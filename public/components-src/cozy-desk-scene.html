<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cozy Desk Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{--bg:#F6E7D2;--wall:#F9EBD9;--ink:#3A2410;--sh:#E9CFAE;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;transition:background .8s,color .8s}
body.n{--bg:#14122A;--wall:#1B1840;--ink:#F2E9FF;--sh:#0F0D22}
.c{width:100%;max-width:900px;display:grid;grid-template-columns:.85fr 1.15fr;gap:24px;align-items:center}
.tx small{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#C2410C;transition:color .8s}.n .tx small{color:#FBBF24}.tx h1{font:700 clamp(32px,4.6vw,52px)/1.02 'Fraunces',serif;letter-spacing:-.03em;margin:12px 0 14px}.tx h1 em{font-style:italic;font-weight:500}
.tx p{font-size:16.5px;line-height:1.6;opacity:.75;max-width:30ch}
.tg{margin-top:24px;display:inline-flex;align-items:center;gap:12px;border:2px solid currentColor;background:none;color:inherit;border-radius:99px;padding:10px 20px 10px 12px;font:600 14.5px 'Inter';cursor:pointer}.tg:focus-visible{outline:3px solid #C2410C;outline-offset:3px}.tg i{position:relative;width:34px;height:20px;border-radius:20px;background:currentColor;opacity:.9}.tg i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--bg);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.n .tg i::after{transform:translateX(14px)}
.sc{position:relative;aspect-ratio:1.18;border-radius:34px;background:var(--wall);overflow:hidden;box-shadow:0 40px 70px -40px rgba(60,30,10,.55);transition:background .8s}
.sc svg{position:absolute;inset:0;width:100%;height:100%}
.glow{opacity:0;transition:opacity .8s}.n .glow{opacity:1}
.win .sky{fill:#BEE3FF;transition:fill .8s}.n .win .sky{fill:#1A1650}.win .sun{fill:#FFE29A;transition:all .8s}.n .win .sun{fill:#F4F1FF;transform:translate(-30px,6px)}
.stars{opacity:0;transition:opacity .8s}.n .stars{opacity:1}.stars circle{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.steam path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;opacity:0;animation:st 3.2s ease-in-out infinite}.steam path:nth-child(2){animation-delay:1s}.steam path:nth-child(3){animation-delay:2s}@keyframes st{0%{opacity:0;transform:translateY(8px)}30%{opacity:.55}100%{opacity:0;transform:translateY(-18px)}}
.plant{transform-origin:540px 330px;animation:sw 5s ease-in-out infinite}@keyframes sw{50%{transform:rotate(3deg)}}.leaf2{transform-origin:540px 330px;animation:sw 4s ease-in-out infinite reverse}
.cur{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.hand{transform-origin:160px 118px;animation:rt 60s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
.cat{animation:br 4s ease-in-out infinite;transform-origin:center bottom}@keyframes br{50%{transform:scaleY(1.04)}}
@media(max-width:760px){.c{grid-template-columns:1fr;text-align:center}.tx p{margin-inline:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="tx"><small>Slow work</small><h1>A desk worth <em>coming back to</em></h1><p>A warm workspace scene with steaming coffee, a swaying plant, a sleeping cat and a switchable night mode.</p><button class="tg" id="tg" aria-pressed="false"><i></i><span id="tl">Switch to night</span></button></div>
<div class="sc"><svg viewBox="0 0 640 540" preserveAspectRatio="xMidYMid slice">
<rect width="640" height="540" fill="none"/>
<g class="win"><rect x="40" y="46" width="200" height="170" rx="10" fill="#fff" opacity=".9"/><rect class="sky" x="52" y="58" width="176" height="146" rx="4"/><circle class="sun" cx="170" cy="100" r="22"/><g class="stars"><circle cx="80" cy="82" r="1.800" fill="#fff"/><circle cx="110" cy="130" r="1.500" fill="#fff"/><circle cx="196" cy="76" r="1.800" fill="#fff"/><circle cx="150" cy="170" r="1.500" fill="#fff"/><circle cx="90" cy="176" r="1.500" fill="#fff"/></g><path d="M52 204 L120 160 L160 190 L196 150 L228 176 V204Z" fill="#6C8E6B" opacity=".6"/><path d="M140 58V204M52 130H228" stroke="#fff" stroke-width="6"/></g>
<g><circle cx="160" cy="118" r="0" fill="none"/></g>
<g class="clk"><circle cx="400" cy="100" r="34" fill="#fff" stroke="var(--ink)" stroke-width="5"/><g stroke="var(--ink)" stroke-width="3" stroke-linecap="round"><path d="M400 74v6M400 120v6M374 100h6M420 100h6"/></g><path d="M400 100v-18" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><g class="hand" style="transform-origin:400px 100px"><path d="M400 100V76" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/></g></g>
<g><rect x="450" y="60" width="130" height="90" rx="6" fill="#fff" opacity=".85"/><rect x="460" y="70" width="46" height="34" fill="#F9A8D4"/><rect x="514" y="70" width="56" height="34" fill="#A5B4FC"/><rect x="460" y="112" width="110" height="28" fill="#FCD34D"/></g>
<rect x="0" y="360" width="640" height="180" fill="#C98A52"/><rect x="0" y="360" width="640" height="14" fill="#B6753F"/><path d="M0 400H640M0 440H640M0 480H640" stroke="#B6753F" stroke-width="2" opacity=".5"/>
<g><rect x="130" y="258" width="260" height="104" rx="8" fill="#2B2F52"/><rect x="140" y="268" width="240" height="84" rx="4" fill="#161A36"/><g><rect x="152" y="282" width="86" height="8" rx="3" fill="#818CF8"/><rect x="152" y="298" width="140" height="8" rx="3" fill="#A78BFA" opacity=".7"/><rect x="152" y="314" width="110" height="8" rx="3" fill="#34D399" opacity=".8"/><rect class="cur" x="266" y="314" width="6" height="8" fill="#fff"/><rect x="152" y="330" width="70" height="8" rx="3" fill="#F472B6" opacity=".7"/></g><path d="M240 362h20l12 18H228z" fill="#1F2347"/><rect x="210" y="378" width="80" height="8" rx="4" fill="#1F2347"/></g>
<rect x="150" y="386" width="190" height="14" rx="5" fill="#2F3560"/><g fill="#434B86">{k}</g>
<g><path d="M410 362 h56 v-50 q0 -10 -10 -10 h-36 q-10 0 -10 10z" fill="#fff"/><path d="M466 322 q22 0 22 18 t-22 18" fill="none" stroke="#fff" stroke-width="8"/><ellipse cx="438" cy="304" rx="26" ry="6" fill="#6B3F1D"/><g class="steam" style="color:var(--ink)"><path d="M428 298c-6-10 6-14 0-24"/><path d="M440 298c-6-10 6-14 0-24"/><path d="M452 298c-6-10 6-14 0-24"/></g></g>
<g class="plant"><path d="M510 362 h60 l-8 -46 h-44z" fill="#E2725B"/><path d="M540 316 C530 270 500 252 484 262 C506 266 520 286 536 316" fill="#4CAF7A"/><path d="M544 316 C554 262 590 244 608 254 C584 262 566 282 548 316" fill="#3E9C69"/><path d="M542 316 C540 252 546 226 560 214 C566 244 556 282 546 316" fill="#58C58C"/></g>
<g class="leaf2"><path d="M530 316 C512 296 496 300 490 308 C506 306 520 310 534 320" fill="#3E9C69"/></g>
<g class="cat"><ellipse cx="86" cy="392" rx="46" ry="26" fill="#F2A65A"/><circle cx="52" cy="380" r="20" fill="#F2A65A"/><path d="M40 366 l-4 -16 l14 8zM62 362 l8 -14 l4 16z" fill="#F2A65A"/><path d="M42 382 q4 4 8 0M56 382 q4 4 8 0" stroke="#3A2410" stroke-width="2.500" fill="none" stroke-linecap="round"/><ellipse cx="86" cy="392" rx="30" ry="14" fill="#E08A3A" opacity=".5"/><path d="M130 396 q22 -6 14 -24" stroke="#F2A65A" stroke-width="9" fill="none" stroke-linecap="round"/></g>
<g class="glow"><ellipse cx="280" cy="300" rx="260" ry="130" fill="#FBBF24" opacity=".07"/><path d="M590 218 l-30 60 h60z" fill="#FDE68A" opacity=".5"/></g>
<g><path d="M592 150 v70" stroke="#6B4A2A" stroke-width="5"/><path d="M572 222 q20 -26 40 0z" fill="#E2725B"/></g>
</svg></div></div>
<script>
const keys=[];for(let r=0;r<2;r++)for(let i=0;i<14;i++)keys.push('<rect x="'+(158+i*13.2)+'" y="'+(388+r*0)+'" width="10" height="9" rx="2"/>');
document.querySelectorAll('g[fill="#434B86"]').forEach(g=>{g.innerHTML=keys.slice(0,14).join('')});
const tg=document.getElementById('tg');tg.onclick=()=>{const n=document.body.classList.toggle('n');tg.setAttribute('aria-pressed',n);document.getElementById('tl').textContent=n?'Switch to day':'Switch to night'};
</script></body></html>
