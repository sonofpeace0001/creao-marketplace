<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Skyline Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7E5F2;font-family:'Poppins',sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;-webkit-font-smoothing:antialiased}
.ft{position:relative;background:linear-gradient(180deg,#1B1448 0%,#3B1F6B 55%,#8A3A7E 100%);color:#F5EEFF;overflow:hidden}
.sk{position:relative;height:210px}.sk svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.mn{position:absolute;left:11%;top:34px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6D6,#F7D98B);box-shadow:0 0 60px 10px rgba(255,235,170,.35)}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.wn{fill:#FFD76A;animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{opacity:1}45%{opacity:.25}60%{opacity:.9}}
.ct{position:relative;background:#0F0A2A;padding:36px 6vw 22px}
.gr{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:30px}
.gr h2{font-size:22px;font-weight:700;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}.gr h2 i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#F59E0B,#EC4899)}.gr p{font-size:14px;line-height:1.6;color:#A99CD6;margin-top:12px;max-width:30ch}
.gr h4{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7A6DB0;margin-bottom:12px}.gr a{display:block;color:#D8CFF5;text-decoration:none;font-size:14.5px;padding:4px 0}.gr a:hover{color:#FFD76A}.gr a:focus-visible{outline:2px solid #FFD76A;outline-offset:3px;border-radius:3px}
.bt{display:flex;justify-content:space-between;margin-top:30px;padding-top:18px;border-top:1px solid #231B52;font-size:13px;color:#7A6DB0}
@media(max-width:640px){.gr{grid-template-columns:1fr 1fr}.gr>div:first-child{grid-column:1/3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.pg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:30px 6vw}.pg i{display:block;border-radius:8px;background:rgba(20,20,40,.08)}.pg i:nth-child(1){width:min(420px,70%);height:34px}.pg i:nth-child(2){width:min(560px,86%);height:12px}.pg i:nth-child(3){width:min(480px,76%);height:12px}.pg i:nth-child(4){width:130px;height:40px;border-radius:99px;margin-top:8px;background:rgba(20,20,40,.14)}</style></head><body>
<div class="pg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<footer class="ft"><div class="sk"><div class="mn"></div><div class="stars" id="st"></div>
<svg viewBox="0 0 1200 210" preserveAspectRatio="none" id="sv"><g fill="#2A1A5E"><rect x="0" y="120" width="70" height="90"/><rect x="80" y="80" width="56" height="130"/><rect x="146" y="130" width="80" height="80"/><rect x="236" y="60" width="64" height="150"/><rect x="310" y="105" width="90" height="105"/><rect x="410" y="30" width="60" height="180"/><rect x="480" y="95" width="74" height="115"/><rect x="564" y="140" width="96" height="70"/><rect x="670" y="70" width="58" height="140"/><rect x="738" y="110" width="80" height="100"/><rect x="828" y="45" width="66" height="165"/><rect x="904" y="100" width="84" height="110"/><rect x="998" y="75" width="60" height="135"/><rect x="1068" y="125" width="132" height="85"/></g><g id="wn"></g></svg></div>
<div class="ct"><div class="gr"><div><h2><i></i>Nightowl</h2><p>Tools for people who do their best work after dark.</p></div><div><h4>Product</h4><a href="#">Features</a><a href="#">Pricing</a><a href="#">Changelog</a></div><div><h4>Resources</h4><a href="#">Guides</a><a href="#">Community</a><a href="#">Support</a></div><div><h4>Company</h4><a href="#">About</a><a href="#">Careers</a><a href="#">Contact</a></div></div><div class="bt"><span>2026 Nightowl Inc.</span><span>Made with care in a city that never sleeps</span></div></div></footer>
<script>
const st=document.getElementById('st');for(let i=0;i<60;i++){const s=document.createElement('i');s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*60+'%;animation-delay:-'+(Math.random()*3)+'s';st.appendChild(s)}
const B=[[0,120,70],[80,80,56],[146,130,80],[236,60,64],[310,105,90],[410,30,60],[480,95,74],[564,140,96],[670,70,58],[738,110,80],[828,45,66],[904,100,84],[998,75,60],[1068,125,132]];let h='';
B.forEach(b=>{for(let y=b[1]+12;y<205;y+=18)for(let x=b[0]+8;x<b[0]+b[2]-10;x+=16){if(Math.random()<.36)h+='<rect class="wn" x="'+x+'" y="'+y+'" width="6" height="8" rx="1" style="animation-delay:-'+(Math.random()*4).toFixed(1)+'s;animation-duration:'+(3+Math.random()*4).toFixed(1)+'s"/>'}});document.getElementById('wn').innerHTML=h;
</script></body></html>
