<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Client Activity Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080B10;color:#E8EEF6;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:560px;background:#10151D;border-radius:28px;padding:22px;box-shadow:0 44px 64px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}.hd small{display:flex;align-items:center;gap:8px;font:600 11.500px 'Geist Mono';letter-spacing:.14em;color:#34D399;text-transform:uppercase}.hd small i{width:8px;height:8px;border-radius:50%;background:#34D399;animation:bk 1.400s infinite}@keyframes bk{50%{opacity:.3}}.hd h1{font:800 40px/1 'Sora';letter-spacing:-.05em;margin-top:8px;font-variant-numeric:tabular-nums}.hd h1 span{font-size:15px;color:#7C8AA0;font-weight:600;letter-spacing:0;margin-left:6px}
.sp{width:150px;height:44px}.sp svg{width:100%;height:100%}.sp path{fill:none;stroke:#34D399;stroke-width:2.200;stroke-linejoin:round;stroke-linecap:round}.sp .a{fill:url(#sg);stroke:none}
.ls{position:relative;height:calc(var(--n)*70px);overflow:hidden}
.it{position:absolute;left:0;right:0;height:62px;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:0 14px;border-radius:16px;background:#171D28;transition:transform .6s cubic-bezier(.3,1.2,.4,1),opacity .5s}
.it.new{animation:ni .6s cubic-bezier(.3,1.5,.5,1)}@keyframes ni{from{opacity:0;transform:translateY(-40px) scale(.95)}}.it.new::before{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:0 0 0 2px #34D399,0 0 24px rgba(52,211,153,.5);animation:fl 1.600s ease-out forwards}@keyframes fl{to{opacity:0}}
.lg{width:44px;height:44px;border-radius:13px;background:var(--c);display:grid;place-items:center;font:800 17px 'Sora';color:#fff;letter-spacing:-.04em}
.tx b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}.tx span{font:500 12px 'Geist Mono';color:#7C8AA0}
.rt{text-align:right}.rt b{display:block;font:700 14px 'Geist Mono';color:#fff}.pl{display:inline-block;margin-top:3px;font:600 10.500px 'Geist Mono';padding:2px 8px;border-radius:99px;background:var(--p);color:var(--pc);letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="cd"><div class="hd"><div><small><i></i>Live · new teams</small><h1><span id="ct">1,284</span><span>teams on board</span></h1></div><div class="sp"><svg viewBox="0 0 150 44" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399" stop-opacity=".35"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient></defs><path class="a" id="pa"/><path id="pl"/></svg></div></div>
<div class="ls" id="ls" style="--n:5"></div></div>
<script>
const NM=[['Northwind','N','#6366F1','Team','$480 / mo'],['Lumen Labs','L','#0EA5E9','Business','$1,240 / mo'],['Halcyon','H','#F97316','Team','$480 / mo'],['Orbit','O','#8B5CF6','Enterprise','$6,800 / mo'],['Verve','V','#EC4899','Team','$360 / mo'],['Atlas Co','A','#10B981','Business','$920 / mo'],['Fable','F','#F59E0B','Startup','$120 / mo'],['Nimbus','N','#14B8A6','Team','$480 / mo'],['Quill','Q','#E11D48','Enterprise','$5,400 / mo'],['Zenith','Z','#2563EB','Business','$1,480 / mo']];
const PC={Startup:['rgba(148,163,184,.18)','#CBD5E1'],Team:['rgba(99,102,241,.2)','#A5B4FC'],Business:['rgba(14,165,233,.2)','#7DD3FC'],Enterprise:['rgba(251,191,36,.2)','#FCD34D']};
const ls=document.getElementById('ls'),sl=t=>new Promise(r=>setTimeout(r,t));let items=[],k=0,count=1284,off=false;const hist=[8,11,9,14,12,17,15,21,19,24,22,28];
function row(n,t,inst){const d=document.createElement('div');d.className='it'+(inst?'':' new');d.style.setProperty('--c',n[2]);d.innerHTML='<div class="lg">'+n[1]+'</div><div class="tx"><b>'+n[0]+'</b><span>'+t+'</span></div><div class="rt"><b>'+n[4]+'</b><span class="pl" style="--p:'+PC[n[3]][0]+';--pc:'+PC[n[3]][1]+'">'+n[3].toUpperCase()+'</span></div>';ls.appendChild(d);return d}
function layout(){items.forEach((it,i)=>{it.el.style.transform='translateY('+(i*70)+'px)'});[...ls.children].forEach(c=>{if(!items.find(i=>i.el===c)){c.style.opacity=0;setTimeout(()=>c.remove(),550)}})}
function spark(){const mx=Math.max(...hist),pts=hist.map((v,i)=>[i/(hist.length-1)*150,40-v/mx*34]);const d='M'+pts.map(p=>p.map(x=>x.toFixed(1)).join(' ')).join(' L');document.getElementById('pl').setAttribute('d',d);document.getElementById('pa').setAttribute('d',d+' L150 44 L0 44Z')}
function push(inst){const n=NM[k++%NM.length],t=inst?['just now','2 min ago','6 min ago','11 min ago','18 min ago'][items.length]:'just now';const el=row(n,t,inst);items.unshift({el});if(items.length>5)items.pop();layout();if(!inst){count++;document.getElementById('ct').textContent=count.toLocaleString('en-US');hist.push(10+Math.random()*22);hist.shift();spark()}}
for(let i=0;i<5;i++){push(true)}items.reverse();items=items.reverse();
[...ls.children].forEach(c=>c.style.transition='none');layout();requestAnimationFrame(()=>requestAnimationFrame(()=>[...ls.children].forEach(c=>c.style.transition='')));spark();
document.querySelector('.cd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a live customer sign-up feed; every couple of seconds a new team drops in at the top with a green glow that fades, the rest of the list slides down and the oldest row falls away, the big team counter ticks up and the sparkline of signups scrolls with a fresh point, while plan chips colour-code Startup, Team, Business and Enterprise, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3200);while(!off){push(false);await sl(1900)}})()}
</script></body></html>
