<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NFT Holo Mint</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070D;color:#EEF;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;width:100%;max-width:760px}
.sc{perspective:900px}
.cd{--mx:50%;--my:50%;--rx:0deg;--ry:0deg;position:relative;width:270px;height:380px;border-radius:22px;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .15s;cursor:grab;background:#10101C;box-shadow:0 40px 60px -20px rgba(0,0,0,.8),0 0 60px -10px rgba(139,92,246,.45);outline:0}.cd:focus-visible{box-shadow:0 0 0 3px #fff}
.cd.rs{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.ar{position:absolute;inset:8px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 60%,#2A1B66,#0D0A24 70%)}
.ar svg{position:absolute;inset:0;width:100%;height:100%}
.fo{position:absolute;inset:0;border-radius:22px;mix-blend-mode:color-dodge;opacity:.55;background:conic-gradient(from calc(var(--mx)*3.6) at var(--mx) var(--my),#ff5ca8,#ffd35c,#5cffb0,#5cc8ff,#a55cff,#ff5ca8);filter:saturate(1.3) contrast(1.1);-webkit-mask:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.2) 60%,transparent 90%);mask:radial-gradient(circle at var(--mx) var(--my),#000 0,rgba(0,0,0,.2) 60%,transparent 90%);pointer-events:none}
.sh{position:absolute;inset:0;border-radius:22px;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 38%);mix-blend-mode:overlay;pointer-events:none}
.lb{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;transform:translateZ(30px)}.lb b{font:700 15px 'Unbounded';letter-spacing:-.02em;color:#fff}.lb span{font:500 11px 'Inter';letter-spacing:.14em;text-transform:uppercase;color:#B9A8FF}
.tp{position:absolute;left:18px;top:16px;font:500 11px 'Inter';letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);transform:translateZ(30px)}
.in small{font:600 12px 'Inter';letter-spacing:.2em;text-transform:uppercase;color:#A78BFA}.in h1{font:700 clamp(26px,4vw,36px)/1.08 'Unbounded';letter-spacing:-.04em;margin:10px 0 10px}.in p{font-size:15px;line-height:1.6;color:#9A98C0;margin-bottom:20px;max-width:34ch}
.pr{display:flex;justify-content:space-between;font-size:13.5px;color:#9A98C0;margin-bottom:8px}.pr b{color:#fff;font-weight:600}.br{height:8px;border-radius:8px;background:#1B1A33;overflow:hidden;margin-bottom:20px}.br i{display:block;height:100%;width:72%;border-radius:8px;background:linear-gradient(90deg,#8B5CF6,#EC4899,#F59E0B)}
.mt{display:flex;gap:10px;align-items:center}.mt .q{display:flex;align-items:center;border:1px solid #2A2850;border-radius:14px;overflow:hidden}.mt .q button{width:40px;height:50px;border:0;background:#14132A;color:#fff;font-size:18px;cursor:pointer}.mt .q button:hover{background:#221F4A}.mt .q button:focus-visible{outline:2px solid #A78BFA;outline-offset:-2px}.mt .q b{width:38px;text-align:center;font:700 16px 'Unbounded'}
.mt .go{flex:1;height:52px;border:0;border-radius:14px;font:700 15px 'Unbounded';letter-spacing:-.02em;color:#fff;background:linear-gradient(135deg,#8B5CF6,#EC4899);cursor:pointer;box-shadow:0 18px 34px -14px #A855F7}.mt .go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.fn{margin-top:14px;font-size:12.5px;color:#6F6D98}
@media(max-width:640px){.c{grid-template-columns:1fr;justify-items:center;text-align:center}.in p{margin-inline:auto}}
@media(prefers-reduced-motion:reduce){.cd{transition:none}}
</style></head><body>
<div class="c"><div class="sc"><div class="cd" id="cd" tabindex="0" role="img" aria-label="Holographic collectible card"><div class="ar"><svg viewBox="0 0 254 364"><defs><linearGradient id="g1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#6366F1"/></linearGradient></defs><circle cx="127" cy="170" r="92" fill="url(#g1)" opacity=".9"/><circle cx="127" cy="170" r="62" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><circle cx="127" cy="170" r="32" fill="#0D0A24"/><circle cx="127" cy="170" r="12" fill="#FDE68A"/><g stroke="#fff" stroke-opacity=".25" stroke-width="1.500"><path d="M0 300H254M0 320H254M0 340H254"/><path d="M40 364 L90 290M127 364V290M214 364 L164 290"/></g><g fill="#fff" opacity=".8"><circle cx="40" cy="50" r="2"/><circle cx="210" cy="80" r="2.500"/><circle cx="60" cy="110" r="1.500"/><circle cx="196" cy="40" r="1.500"/></g></svg></div><div class="tp">Genesis / 042</div><div class="lb"><b>Orbit Core</b><span>Rare</span></div><div class="fo"></div><div class="sh"></div></div></div>
<div class="in"><small>Public mint</small><h1>Orbit Core Genesis</h1><p>A collection of 5,000 holographic cores. Tilt the card to see the foil react to light.</p>
<div class="pr"><span><b>3,612</b> / 5,000 minted</span><span>0.04 ETH</span></div><div class="br"><i></i></div>
<div class="mt"><div class="q"><button id="mi" aria-label="Fewer">-</button><b id="qt">2</b><button id="pl" aria-label="More">+</button></div><button class="go" id="go">Mint now</button></div><p class="fn">Move your cursor over the card.</p></div></div>
<script>
const cd=document.getElementById('cd');let real=false,t=0;
function set(px,py,rs){cd.classList.toggle('rs',!!rs);cd.style.setProperty('--mx',(px*100)+'%');cd.style.setProperty('--my',(py*100)+'%');cd.style.setProperty('--rx',((.5-py)*22)+'deg');cd.style.setProperty('--ry',((px-.5)*26)+'deg')}
cd.addEventListener('pointermove',e=>{real=true;const r=cd.getBoundingClientRect();set((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,false)});
cd.addEventListener('pointerleave',()=>{real=false;});
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(){if(!real){t+=.014;set(.5+Math.cos(t)*.32,.45+Math.sin(t*1.3)*.28,false)}if(!reduce)requestAnimationFrame(loop)}
t=.9;set(.5+Math.cos(t)*.32,.45+Math.sin(t*1.3)*.28,false);if(!reduce)loop();
let q=2;document.getElementById('pl').onclick=()=>{q=Math.min(5,q+1);document.getElementById('qt').textContent=q};document.getElementById('mi').onclick=()=>{q=Math.max(1,q-1);document.getElementById('qt').textContent=q};
document.getElementById('go').onclick=e=>{e.target.textContent='Minted '+q+' core'+(q>1?'s':'')};
</script></body></html>
