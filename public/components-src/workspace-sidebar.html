<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Workspace Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9EBF3;color:#14172B;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ap{display:grid;grid-template-columns:260px 1fr;width:100%;max-width:820px;height:480px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 70px -44px rgba(20,23,43,.55),0 0 0 1px rgba(20,23,43,.07)}
.sd{position:relative;background:#F6F7FB;border-right:1px solid #E7E9F3;display:flex;flex-direction:column;padding:12px}
.ws{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}.ws:hover,.ws[aria-expanded=true]{background:#ECEEF8}.ws:focus-visible{outline:2px solid #5B5BF6}
.ws i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#EC4899);display:grid;place-items:center;color:#fff;font:700 13px 'Inter Tight';font-style:normal}.ws b{display:block;font-size:14.5px;font-weight:700}.ws span{font-size:12px;color:#8A90B6}.ws svg{margin-left:auto;color:#8A90B6}
.sr{display:flex;align-items:center;gap:8px;margin:10px 0 8px;padding:8px 10px;background:#fff;border:1px solid #E7E9F3;border-radius:10px;font-size:13.5px;color:#9096BC}.sr kbd{margin-left:auto;font:500 11px 'Geist Mono',monospace;background:#F2F3FA;border-radius:5px;padding:1px 6px}
.nv{flex:1;overflow:auto;position:relative}
.hl{position:absolute;left:0;right:0;height:34px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(20,23,43,.1),0 0 0 1px #E7E9F3;transition:transform .3s cubic-bezier(.3,1.2,.4,1),height .3s;pointer-events:none;opacity:0}
.it{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0 10px;height:34px;border-radius:9px;cursor:pointer;font:500 14px 'Inter Tight';color:#555B82;text-align:left}.it:hover{color:#14172B}.it.on{color:#14172B;font-weight:600}.it:focus-visible{outline:2px solid #5B5BF6;outline-offset:-2px}
.it svg.i{flex:none;color:#8A90B6}.it.on svg.i{color:#5B5BF6}.it .bd{margin-left:auto;font:600 11px 'Inter Tight';background:#EDEFFC;color:#5B5BF6;border-radius:99px;padding:1px 7px}.it .ch{margin-left:auto;color:#9AA0C4;transition:transform .25s}.it[aria-expanded=true] .ch{transform:rotate(90deg)}
.gp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.gp.op{grid-template-rows:1fr}.gp>div{overflow:hidden;margin-left:19px;border-left:1.5px solid #E3E6F3;padding-left:6px}.gp .it{height:30px;font-size:13.5px}
.lb{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9AA0C4;padding:14px 10px 6px}
.ft{display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid #E7E9F3;margin-top:8px}.ft i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:grid;place-items:center;color:#fff;font:700 12px 'Inter Tight';font-style:normal}.ft b{display:block;font-size:13.5px}.ft span{font-size:12px;color:#8A90B6}
.sw{position:absolute;left:12px;right:12px;top:58px;background:#fff;border:1px solid #E3E6F3;border-radius:16px;padding:6px;box-shadow:0 24px 40px -14px rgba(20,23,43,.4);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top;pointer-events:none;transition:all .2s cubic-bezier(.3,1.3,.5,1);z-index:5}.sw.op{opacity:1;transform:none;pointer-events:auto}
.sw button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;font:inherit;color:inherit;text-align:left}.sw button:hover{background:#F3F4FB}.sw button:focus-visible{outline:2px solid #5B5BF6}.sw i{width:28px;height:28px;border-radius:9px;background:var(--g);display:grid;place-items:center;color:#fff;font:700 12px 'Inter Tight';font-style:normal}.sw b{font-size:14px;font-weight:600}.sw em{margin-left:auto;font-style:normal;color:#5B5BF6;opacity:0}.sw button[aria-checked=true] em{opacity:1}
.mn{padding:26px 28px}.mn small{font:500 12px 'Geist Mono',monospace;color:#9AA0C4}.mn h1{font-size:26px;font-weight:700;letter-spacing:-.04em;margin:4px 0 18px}.mn .cd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mn .cd div{height:92px;border-radius:14px;background:#F6F7FB}.mn .bg{height:150px;border-radius:14px;background:#F6F7FB;margin-top:10px}
@media(max-width:700px){.ap{grid-template-columns:1fr}.mn{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="ap"><aside class="sd"><button class="ws" id="ws" aria-haspopup="menu" aria-expanded="false"><i>N</i><div><b>Northwind</b><span>12 members</span></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg></button>
<div class="sw" id="sw" role="menu"><button role="menuitemradio" aria-checked="true"><i style="--g:linear-gradient(135deg,#6366F1,#EC4899)">N</i><b>Northwind</b><em>&#10003;</em></button><button role="menuitemradio" aria-checked="false"><i style="--g:linear-gradient(135deg,#10B981,#0EA5E9)">F</i><b>Fjord Studio</b><em>&#10003;</em></button><button role="menuitemradio" aria-checked="false"><i style="--g:linear-gradient(135deg,#F59E0B,#EF4444)">H</i><b>Helios Labs</b><em>&#10003;</em></button></div>
<div class="sr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>Search<kbd>/</kbd></div>
<nav class="nv" id="nv" aria-label="Workspace"><span class="hl" id="hl"></span><div id="items"></div></nav>
<div class="ft"><i>MR</i><div><b>Maya Rowe</b><span>maya@northwind.co</span></div></div></aside>
<main class="mn"><small id="cr">Home</small><h1 id="ti">Home</h1><div class="cd"><div></div><div></div><div></div></div><div class="bg"></div></main></div>
<script>
const I=(p)=>'<svg class="i" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>',CH='<svg class="ch" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const N=[['Home','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],['Inbox','M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z',4],['Projects','M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',0,['Website redesign','Mobile app','Brand refresh']],['Reports','M3 3v18h18M7 14l4-4 4 4 5-6'],['Team','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8']];
const it=document.getElementById('items');let sel='Home',open={Projects:true};
function draw(){it.innerHTML='<div class="lb">Workspace</div>'+N.map(n=>{const ch=n[3];return '<button class="it'+(sel===n[0]?' on':'')+'" data-n="'+n[0]+'" '+(ch?'aria-expanded="'+!!open[n[0]]+'"':'')+'>'+I(n[1])+n[0]+(n[2]?'<span class="bd">'+n[2]+'</span>':'')+(ch?CH:'')+'</button>'+(ch?'<div class="gp'+(open[n[0]]?' op':'')+'"><div>'+ch.map(c=>'<button class="it'+(sel===c?' on':'')+'" data-n="'+c+'" data-p="'+n[0]+'"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5"></span>'+c+'</button>').join('')+'</div></div>':'')}).join('');
 it.querySelectorAll('.it').forEach(b=>b.onclick=()=>{const n=N.find(x=>x[0]===b.dataset.n);if(n&&n[3]){open[n[0]]=!open[n[0]];draw();return}sel=b.dataset.n;document.getElementById('ti').textContent=sel;document.getElementById('cr').textContent=(b.dataset.p?b.dataset.p+' / ':'')+sel;draw()});mv()}
function mv(){const h=document.getElementById('hl'),b=it.querySelector('.it.on');if(!b){h.style.opacity=0;return}const r=b.getBoundingClientRect(),p=document.getElementById('nv').getBoundingClientRect();h.style.opacity=1;h.style.transform='translateY('+(r.top-p.top+document.getElementById('nv').scrollTop)+'px)';h.style.height=r.height+'px'}
draw();setTimeout(mv,350);(document.fonts&&document.fonts.ready||Promise.resolve()).then(mv);
const ws=document.getElementById('ws'),sw=document.getElementById('sw');ws.onclick=()=>{const o=!sw.classList.contains('op');sw.classList.toggle('op',o);ws.setAttribute('aria-expanded',o)};
sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{sw.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===b));ws.querySelector('i').textContent=b.querySelector('i').textContent;ws.querySelector('i').style.background=b.querySelector('i').style.getPropertyValue('--g');ws.querySelector('b').textContent=b.querySelector('b').textContent;sw.classList.remove('op');ws.setAttribute('aria-expanded','false')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){sw.classList.remove('op');ws.setAttribute('aria-expanded','false')}});sel='Website redesign';document.getElementById('ti').textContent=sel;document.getElementById('cr').textContent='Projects / '+sel;draw();setTimeout(mv,120);
</script></body></html>
