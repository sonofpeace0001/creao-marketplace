<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dither Gradient Shader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0E10;color:#EDEAE0;font-family:'Space Mono',monospace;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:720px}
.fr{position:relative;aspect-ratio:16/10;border:2px solid #EDEAE0;background:#000;box-shadow:8px 8px 0 #EDEAE0;overflow:hidden;cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.tg{position:absolute;left:14px;top:12px;font:400 22px 'VT323',monospace;letter-spacing:.1em;color:#EDEAE0;background:#0E0E10;padding:0 8px}
.tt{position:absolute;left:14px;bottom:10px;right:14px;display:flex;justify-content:space-between;font:400 20px 'VT323',monospace;color:#0E0E10}.tt span{background:#EDEAE0;padding:0 8px}
.ct{display:flex;gap:14px;align-items:center;margin-top:26px;flex-wrap:wrap}
.ct label{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}.ct input[type=range]{accent-color:#EDEAE0;width:130px}
.sw{display:flex;gap:6px;margin-left:auto}.sw button{width:30px;height:30px;border:2px solid #EDEAE0;cursor:pointer;background:var(--a);position:relative}.sw button::after{content:"";position:absolute;inset:3px;background:var(--b)}.sw button[aria-pressed=true]{outline:3px solid #EDEAE0;outline-offset:2px}.sw button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style></head><body>
<div class="c"><div class="fr" id="fr"><canvas id="cv" role="img" aria-label="Animated ordered-dither gradient"></canvas><div class="tg">DITHER.EXE</div><div class="tt"><span id="lv">LEVELS 4</span><span id="xy">X 0.50 / Y 0.50</span></div></div>
<div class="ct"><label>Levels <input type="range" id="lr" min="2" max="8" value="4" aria-label="Colour levels"></label><label>Pixel <input type="range" id="pr" min="2" max="8" value="4" aria-label="Pixel size"></label>
<div class="sw" id="sw" role="group" aria-label="Palette"></div></div></div>
<script>
const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];const cv=document.getElementById('cv'),x=cv.getContext('2d');
const P=[['#0E0E10','#FF5A1F'],['#06143A','#7DF9FF'],['#14083A','#FF4FD8'],['#0B1A0B','#9BFF6B']];
let w,h,img,t=0,L=4,PX=4,pal=0,mx=.5,my=.5,last=performance.now();const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){const r=cv.getBoundingClientRect();w=Math.max(40,Math.floor(r.width/PX));h=Math.max(30,Math.floor(r.height/PX));cv.width=w;cv.height=h;img=x.createImageData(w,h)}
function frame(n){t+=reduced?0:(n-last)/1000;last=n;const a=hex(P[pal][0]),b=hex(P[pal][1]),d=img.data;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=i/w,v=j/h;const dx=u-mx,dy=(v-my)*.62,r=Math.sqrt(dx*dx+dy*dy);
  let g=.5+.5*Math.sin(u*5+t*.8)*.5+.5*Math.sin(v*6-t*.6)*.35+.35*Math.sin(r*14-t*1.4);g=g*.55+(1-Math.min(1,r*1.5))*.45;
  const th=(B[j&3][i&3]+.5)/16-.5;let q=g+th/(L);q=Math.max(0,Math.min(1,q));q=Math.round(q*(L-1))/(L-1);
  const k=(j*w+i)*4;d[k]=a[0]+(b[0]-a[0])*q;d[k+1]=a[1]+(b[1]-a[1])*q;d[k+2]=a[2]+(b[2]-a[2])*q;d[k+3]=255}
 x.putImageData(img,0,0);if(!reduced)requestAnimationFrame(frame)}
document.getElementById('sw').innerHTML=P.map((p,i)=>'<button style="--a:'+p[0]+';--b:'+p[1]+'" aria-pressed="'+(i===0)+'" aria-label="Palette '+(i+1)+'"></button>').join('');
document.querySelectorAll('#sw button').forEach((b,i)=>b.onclick=()=>{pal=i;document.querySelectorAll('#sw button').forEach(z=>z.setAttribute('aria-pressed',z===b));if(reduced)frame(performance.now())});
document.getElementById('lr').oninput=e=>{L=+e.target.value;document.getElementById('lv').textContent='LEVELS '+L;if(reduced)frame(performance.now())};
document.getElementById('pr').oninput=e=>{PX=+e.target.value;size();if(reduced)frame(performance.now())};
document.getElementById('fr').addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width;my=(e.clientY-r.top)/r.height;document.getElementById('xy').textContent='X '+mx.toFixed(2)+' / Y '+my.toFixed(2)});
size();addEventListener('resize',size);mx=.68;my=.4;requestAnimationFrame(frame);
</script></body></html>
