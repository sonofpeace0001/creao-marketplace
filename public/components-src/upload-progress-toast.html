<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Upload Progress Toast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8ECF3;background-image:linear-gradient(#DDE3EE 1px,transparent 1px),linear-gradient(90deg,#DDE3EE 1px,transparent 1px);background-size:36px 36px;color:#101828;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:640px;height:400px;border-radius:26px;background:#F8FAFD;border:1px solid #D9E0EC;overflow:hidden;box-shadow:0 40px 70px -44px rgba(16,24,40,.5)}
.bar{height:44px;border-bottom:1px solid #E4E9F2;display:flex;align-items:center;gap:6px;padding:0 16px}.bar i{width:11px;height:11px;border-radius:50%;background:#D6DCE8}
.ln{padding:20px}.ln div{height:12px;border-radius:6px;background:#E9EDF5;margin-bottom:10px}.ln div:nth-child(2n){width:70%}.ln div:nth-child(3n){width:45%}
.rp{position:absolute;left:20px;top:56px;border:1px solid #D2DAE8;background:#fff;border-radius:10px;padding:7px 14px;font:600 13px 'DM Sans';cursor:pointer;color:#344054;z-index:3}.rp:hover{border-color:#2563EB;color:#2563EB}.rp:focus-visible{outline:2px solid #2563EB}
.ts{position:absolute;right:18px;bottom:18px;width:min(340px,calc(100% - 36px));background:#101828;color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 30px 50px -20px rgba(16,24,40,.7);overflow:hidden;transition:transform .5s cubic-bezier(.3,1.3,.5,1),opacity .3s}
.ts.out{transform:translateY(30px) scale(.96);opacity:0}
.rw{display:flex;align-items:center;gap:12px}
.ic{position:relative;flex:none;width:44px;height:44px}.ic svg.r{position:absolute;inset:0;transform:rotate(-90deg)}.ic .tr{fill:none;stroke:rgba(255,255,255,.14);stroke-width:4}.ic .pg{fill:none;stroke:#60A5FA;stroke-width:4;stroke-linecap:round;transition:stroke .3s}
.ic .fi{position:absolute;inset:11px;display:grid;place-items:center;color:#93C5FD;transition:all .3s}.ic .ck{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:all .4s cubic-bezier(.3,1.8,.5,1);color:#fff;background:#16A34A;border-radius:50%}
.ts.dn .ic .pg{stroke:#16A34A}.ts.dn .ic .fi{opacity:0;transform:scale(.4)}.ts.dn .ic .ck{opacity:1;transform:none}.ck path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .2s}.ts.dn .ck path{stroke-dashoffset:0}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx span{display:block;font:500 12.5px 'DM Mono',monospace;color:#98A2B3;margin-top:2px}
.cn{border:0;background:rgba(255,255,255,.1);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}.cn:hover{background:rgba(255,255,255,.2)}.cn:focus-visible{outline:2px solid #fff}
.cd{position:absolute;left:0;bottom:0;height:3px;background:#16A34A;width:100%;transform-origin:left;transform:scaleX(0)}.ts.dn .cd{animation:cd 4s linear forwards}@keyframes cd{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.ts .tq{display:flex;gap:6px;margin-top:12px}.ts .tq i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.ts .tq i b{display:block;height:100%;width:var(--w,0%);background:#60A5FA;border-radius:5px;transition:width .2s linear}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.ts.dn .cd{animation:none}}
</style></head><body>
<div class="st"><div class="bar"><i></i><i></i><i></i></div><div class="ln"><div></div><div></div><div></div><div></div><div></div><div></div></div><button class="rp" id="rp">Replay upload</button>
<div class="ts" id="ts" role="status" aria-live="polite"><div class="rw"><div class="ic"><svg class="r" viewBox="0 0 44 44"><circle class="tr" cx="22" cy="22" r="19"/><circle class="pg" id="pg" cx="22" cy="22" r="19" stroke-dasharray="119.4" stroke-dashoffset="119.4"/></svg><span class="fi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></svg></span><span class="ck"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span></div>
<div class="tx"><b id="tt">Uploading brand-guidelines.pdf</b><span id="ts2"></span></div><button class="cn" id="cn" aria-label="Cancel upload"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.200" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="cd"></div></div></div>
<script>
const ts=document.getElementById('ts'),pg=document.getElementById('pg'),C=119.4;let p=0,iv=null,tm=null;
function paint(){pg.setAttribute('stroke-dashoffset',C*(1-p/100));document.getElementById('ts2').textContent=p>=100?'18.4 MB uploaded':(p*0.184).toFixed(1)+' of 18.4 MB  ·  '+(4.2).toFixed(1)+' MB/s'}
function start(from){clearInterval(iv);clearTimeout(tm);ts.classList.remove('dn','out');document.getElementById('tt').textContent='Uploading brand-guidelines.pdf';p=from||0;paint();iv=setInterval(()=>{p=Math.min(100,p+1+Math.random()*2.4);paint();if(p>=100){clearInterval(iv);ts.classList.add('dn');document.getElementById('tt').textContent='Upload complete';tm=setTimeout(()=>ts.classList.add('out'),4000)}},110)}
document.getElementById('rp').onclick=()=>start(0);document.getElementById('cn').onclick=()=>{clearInterval(iv);ts.classList.add('out')};
start(58);
</script></body></html>
