<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Voice Call Avatars</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 360px at 50% 0,#2A1E5C,transparent 70%),#0A0818;color:#F1EEFF;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;text-align:center}
.hd small{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#A8A0E0}.hd small i{width:8px;height:8px;border-radius:50%;background:#F87171;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.25}}
.hd h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:8px 0 4px}.hd p{font:500 15px 'Outfit';color:#8F87C2;font-variant-numeric:tabular-nums}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:34px 0}
.p{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px}
.av{position:relative;width:96px;height:96px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;transition:transform .2s}
.av::before,.av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--c);opacity:0;transform:scale(1)}
.p.sp .av{transform:scale(1.06)}.p.sp .av::before{animation:rg 1.3s ease-out infinite}.p.sp .av::after{animation:rg 1.3s ease-out .5s infinite}@keyframes rg{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.p.sp .av{box-shadow:0 0 0 3px var(--c)}
.p b{font-size:15.5px;font-weight:600}.p.mu .av::after{content:"";animation:none}
.wv{display:flex;align-items:center;gap:3px;height:18px}.wv i{width:3px;height:4px;border-radius:2px;background:var(--c);transition:height .1s}
.mc{position:absolute;right:calc(50% - 56px);top:70px;width:28px;height:28px;border-radius:50%;background:#1E1A3B;border:3px solid #0A0818;display:grid;place-items:center;color:#F87171}
.ct{display:flex;justify-content:center;gap:14px}.ct button{width:58px;height:58px;border-radius:50%;border:0;background:#1E1A3B;color:#F1EEFF;cursor:pointer;display:grid;place-items:center;transition:all .2s}.ct button:hover{background:#2C2656;transform:translateY(-3px)}.ct button[aria-pressed=true]{background:#F87171;color:#fff}.ct .end{background:#EF4444;width:76px;border-radius:30px}.ct .end:hover{background:#DC2626}.ct button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.p.sp .av::before,.p.sp .av::after{animation:none;opacity:.5;transform:scale(1.25)}.hd small i{animation:none}}
</style></head><body>
<div class="c"><div class="hd"><small><i></i>Live</small><h1>Weekly sync</h1><p id="tm">12:04</p></div>
<div class="gr" id="gr"></div>
<div class="ct"><button id="mu" aria-pressed="false" aria-label="Mute"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button aria-label="Share screen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button><button class="end" aria-label="Leave call"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(135deg)"><path d="M22 16.900v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.300 1.800.6 2.800.7a2 2 0 0 1 1.700 2z"/></svg></button></div></div>
<script>
const P=[['Priya','PR','linear-gradient(135deg,#8B5CF6,#5B3FE0)','#A78BFA'],['Marcus','MR','linear-gradient(135deg,#38BDF8,#2563EB)','#7DD3FC'],['Elena','EO','linear-gradient(135deg,#34D399,#059669)','#6EE7B7'],['Tomas','TB','linear-gradient(135deg,#FB923C,#EA580C)','#FDBA74'],['Aiko','AT','linear-gradient(135deg,#F472B6,#DB2777)','#F9A8D4'],['You','ME','linear-gradient(135deg,#94A3B8,#475569)','#CBD5E1']];
const gr=document.getElementById('gr');gr.innerHTML=P.map((p,i)=>'<div class="p" style="--g:'+p[2]+';--c:'+p[3]+'" data-i="'+i+'"><div class="av">'+p[1]+(i===3?'<span class="mc" aria-label="Muted"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M2 2l20 20M9 5a3 3 0 0 1 6 0v6M15 15a3 3 0 0 1-6-3"/></svg></span>':'')+'</div><b>'+p[0]+'</b><div class="wv" aria-hidden="true">'+'<i></i>'.repeat(7)+'</div></div>').join('');
const E=[...gr.children];let sp=[1,2];const mu=document.getElementById('mu');let muted=false;
function tick(){E.forEach((e,i)=>{const on=sp.includes(i)&&i!==3&&!(i===5&&muted);e.classList.toggle('sp',on);e.querySelectorAll('.wv i').forEach(b=>b.style.height=on?(5+Math.random()*13)+'px':'4px')})}
setInterval(tick,110);setInterval(()=>{const n=Math.random()<.35?2:1;sp=[];while(sp.length<n){const k=Math.floor(Math.random()*6);if(!sp.includes(k)&&k!==3)sp.push(k)}},2200);tick();
mu.onclick=()=>{muted=!muted;mu.setAttribute('aria-pressed',muted)};
let s=724;setInterval(()=>{s++;document.getElementById('tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
</script></body></html>
