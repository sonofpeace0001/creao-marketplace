<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ribbon Trail Cursor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05060B;color:#fff;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:780px;aspect-ratio:16/10;border-radius:28px;overflow:hidden;background:#090B14;box-shadow:0 44px 70px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08);cursor:none;touch-action:none}
.st::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(circle at 50% 50%,#000,transparent 80%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.tx{position:absolute;left:7%;bottom:9%;pointer-events:none}.tx small{display:block;font:700 12px 'Space Mono';letter-spacing:.24em;color:#7C86B0;margin-bottom:8px}.tx h1{font:700 62px/.92 'Space Grotesk';letter-spacing:-.06em}
.hd{position:absolute;right:22px;top:18px;font:400 11.500px 'Space Mono';color:#5E6690;letter-spacing:.12em}
</style></head><body>
<div class="st" id="st"><canvas id="cv"></canvas><div class="tx"><small>PHYSICS RIBBON</small><h1>Leave a<br>mark.</h1></div><span class="hd" id="hd">0 PX / S</span></div>
<script>
const st=document.getElementById('st'),cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H,dpr=Math.min(2,devicePixelRatio||1),off=false;
function size(){const r=st.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
const N=44;let tx=.6,ty=.45;const pts=[];for(let i=0;i<N;i++)pts.push({x:W*.6,y:H*.45,vx:0,vy:0});let hue=210,spd=0;
st.addEventListener('pointermove',e=>{off=true;const r=st.getBoundingClientRect();tx=(e.clientX-r.left)/r.width;ty=(e.clientY-r.top)/r.height});
function step(){const head=pts[0];const lx=head.x,ly=head.y;head.vx+=(tx*W-head.x)*.09;head.vy+=(ty*H-head.y)*.09;head.vx*=.78;head.vy*=.78;head.x+=head.vx;head.y+=head.vy;spd=Math.hypot(head.x-lx,head.y-ly)*60;
 for(let i=1;i<N;i++){const p=pts[i],q=pts[i-1];p.x+=(q.x-p.x)*.38;p.y+=(q.y-p.y)*.38}hue=(hue+.8)%360}
function draw(){cx.fillStyle='rgba(9,11,20,.2)';cx.fillRect(0,0,W,H);cx.lineJoin='round';
 const wd=i=>{const t=1-i/N;return 1+Math.pow(t,1.4)*(11+Math.min(10,spd/110))};
 for(let i=1;i<N;i++){const a=pts[i-1],b=pts[i];let dx=a.x-b.x,dy=a.y-b.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;const nx=-dy,ny=dx,wa=wd(i-1),wb=wd(i);cx.beginPath();cx.moveTo(a.x+nx*wa,a.y+ny*wa);cx.lineTo(b.x+nx*wb,b.y+ny*wb);cx.lineTo(b.x-nx*wb,b.y-ny*wb);cx.lineTo(a.x-nx*wa,a.y-ny*wa);cx.closePath();const c='hsla('+((hue+i*5)%360)+',95%,'+(62-i*.5)+'%,'+(.95-i/N*.8)+')';cx.fillStyle=c;cx.strokeStyle=c;cx.lineWidth=1;cx.fill();cx.stroke()}
 const h=pts[0];cx.fillStyle='#fff';cx.shadowColor='hsl('+hue+',95%,60%)';cx.shadowBlur=26;cx.beginPath();cx.arc(h.x,h.y,6,0,6.283);cx.fill();cx.shadowBlur=0;document.getElementById('hd').textContent=String(Math.round(spd)).padStart(4,'0')+' PX / S'}
for(let k=0;k<120;k++){tx=.5+.3*Math.sin(k*.07)*Math.cos(k*.03);ty=.5+.26*Math.sin(k*.12);step();if(k>90)draw()}
/* Idle demo: a glowing head follows the pointer on a spring and drags a forty-four-segment ribbon behind it, each segment chasing the one ahead so the tail whips and lags naturally, the ribbon is thick and bright near the head and thin and transparent at the end with its hue cycling through the spectrum, thickening further when it moves fast, and a speed readout in the corner counts pixels per second, tracing a looping curve until you move your own pointer in. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){requestAnimationFrame(function lp(n){const t=n/1000;if(!off){const a=t*1.1;tx=.5+.32*Math.sin(a)*Math.cos(a*.4);ty=.5+.28*Math.sin(a*1.7)}step();draw();requestAnimationFrame(lp)})}
</script></body></html>
