<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Method Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090D;color:#EEF0F8;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:900px}
.hd{text-align:center;margin-bottom:30px}.hd small{font:500 12.5px 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#A5B4FC}.hd h1{font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-.055em;margin:10px 0 8px}.hd p{color:#7C8198;font-size:16px}
.gd{--x:-999px;--y:-999px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.cd{position:relative;border-radius:24px;padding:1px;background:rgba(255,255,255,.07);overflow:hidden}
.cd::before{content:"";position:absolute;inset:0;border-radius:24px;background:radial-gradient(300px circle at calc(var(--x) - var(--l)) calc(var(--y) - var(--t)),var(--c),transparent 70%);opacity:var(--o,0);transition:opacity .3s}
.in{position:relative;border-radius:23px;background:#0E1016;padding:26px;height:100%;display:flex;flex-direction:column;gap:16px;min-height:290px}
.in::before{content:"";position:absolute;inset:0;border-radius:23px;background:radial-gradient(260px circle at calc(var(--x) - var(--l)) calc(var(--y) - var(--t)),color-mix(in srgb,var(--c) 22%,transparent),transparent 65%);opacity:var(--o,0);transition:opacity .3s;pointer-events:none}
.in>*{position:relative}
.ic{width:50px;height:50px;border-radius:16px;background:color-mix(in srgb,var(--c) 18%,#10131B);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);display:grid;place-items:center;color:var(--c)}
.in h2{font-size:21px;font-weight:600;letter-spacing:-.04em}.in p{font-size:14.5px;line-height:1.55;color:#868CA6}
.rt{display:inline-flex;align-items:center;gap:7px;font:500 12.5px 'Geist Mono',monospace;color:#9AA1BD;background:#141722;border-radius:99px;padding:5px 12px;width:fit-content}.rt i{width:7px;height:7px;border-radius:50%;background:#34D399}
.vl{margin-top:auto;display:flex;align-items:center;gap:10px;background:#141722;border:1px solid #22273A;border-radius:14px;padding:10px 12px 10px 14px}.vl span{flex:1;font:500 14px 'Geist Mono',monospace;color:#DDE1F5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{display:flex;align-items:center;gap:6px;border:0;background:#1E2233;color:#C5CBE6;border-radius:9px;padding:7px 11px;font:600 12.5px 'Geist';cursor:pointer;min-width:74px;justify-content:center;transition:all .25s}.cp:hover{background:#2A3050;color:#fff}.cp.ok{background:#12351F;color:#4ADE80}.cp:focus-visible{outline:2px solid var(--c)}
.cp .ic2{position:relative;width:13px;height:13px}.cp .ic2 svg{position:absolute;inset:0;transition:all .3s cubic-bezier(.3,1.6,.5,1)}.cp .ic2 .k{opacity:0;transform:scale(.3) rotate(-60deg)}.cp.ok .ic2 .c2{opacity:0;transform:scale(.3) rotate(60deg)}.cp.ok .ic2 .k{opacity:1;transform:none}
@media(max-width:760px){.gd{grid-template-columns:1fr}.in{min-height:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><small>Contact</small><h1>Pick the way you like to talk</h1><p>Real people on every channel. Copy a detail with one click.</p></div><div class="gd" id="gd"></div></div>
<script>
const T=[['Email us','Best for detailed questions, contracts and anything with attachments.','Replies in about 4 hours','hello@meridian.dev','#818CF8','M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z'],['Live chat','Quick answers from our support team, every weekday from 9 to 6.','Replies in under 2 minutes','meridian.dev/chat','#34D399','M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],['Call us','Talk to a human about pricing, onboarding or a custom plan.','Mon to Fri, 9 to 6 CET','+351 21 555 0148','#F472B6','M22 16.900v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.3 1.800.6 2.800.7a2 2 0 0 1 1.700 2z']];
const gd=document.getElementById('gd');T.forEach(t=>{const e=document.createElement('div');e.className='cd';e.style.setProperty('--c',t[4]);e.innerHTML='<div class="in"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+t[5]+'"/></svg></div><div><h2>'+t[0]+'</h2></div><p>'+t[1]+'</p><span class="rt"><i></i>'+t[2]+'</span><div class="vl"><span>'+t[3]+'</span><button class="cp"><span class="ic2"><svg class="c2" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><svg class="k" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><b class="lb">Copy</b></button></div></div>';const b=e.querySelector('.cp');b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(t[3]).catch(()=>{});b.classList.add('ok');b.querySelector('.lb').textContent='Copied';setTimeout(()=>{b.classList.remove('ok');b.querySelector('.lb').textContent='Copy'},1600)};gd.appendChild(e)});
const cds=[...gd.children];function lay(){const g=gd.getBoundingClientRect();cds.forEach(c=>{const r=c.getBoundingClientRect();c.style.setProperty('--l',(r.left-g.left)+'px');c.style.setProperty('--t',(r.top-g.top)+'px')})}
function set(x,y,o){gd.style.setProperty('--x',x+'px');gd.style.setProperty('--y',y+'px');cds.forEach(c=>c.style.setProperty('--o',o))}
lay();addEventListener('resize',lay);let real=false,tt=.9;gd.addEventListener('pointermove',e=>{real=true;const r=gd.getBoundingClientRect();set(e.clientX-r.left,e.clientY-r.top,1)});gd.addEventListener('pointerleave',()=>real=false);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;function f(){if(!real){tt+=.012;const r=gd.getBoundingClientRect();set(r.width*(.5+Math.cos(tt)*.44),r.height*(.5+Math.sin(tt*1.2)*.4),1)}if(!reduce)requestAnimationFrame(f)}
set(gd.getBoundingClientRect().width*.5,gd.getBoundingClientRect().height*.35,1);(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{lay();f()});
</script></body></html>
