<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Video Chapters Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0B0F;color:#ECEEF5;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;width:100%;max-width:900px}
.pl{background:#12141B;border:1px solid #23262F;border-radius:20px;overflow:hidden}
.sc{position:relative;aspect-ratio:16/9;background:var(--g);transition:background .6s;overflow:hidden;cursor:pointer}
.sc::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.45),transparent 50%),radial-gradient(circle at 80% 90%,rgba(0,0,0,.5),transparent 60%)}
.sc .tt{position:absolute;left:20px;bottom:56px;font-size:clamp(20px,3.4vw,32px);font-weight:700;letter-spacing:-.035em;text-shadow:0 4px 22px rgba(0,0,0,.4);transition:opacity .3s}
.sc .kk{position:absolute;left:20px;top:16px;font:500 12px 'Geist Mono',monospace;letter-spacing:.12em;background:rgba(0,0,0,.4);padding:4px 9px;border-radius:6px}
.big{position:absolute;left:50%;top:44%;width:64px;height:64px;margin:-32px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;transition:opacity .25s,transform .25s}.pl.playing .big{opacity:0;transform:scale(1.4);pointer-events:none}
.cb{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.tl{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.25);cursor:pointer;margin-bottom:10px;transition:height .15s}.tl:hover{height:9px}
.tl .sg{position:absolute;top:0;bottom:0;border-radius:2px;background:rgba(255,255,255,.18);border-right:2px solid rgba(0,0,0,.6)}.tl .fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#fff;width:0}.tl .kn{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.hv{position:absolute;bottom:22px;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .1s;text-align:center}.hv .th{width:110px;height:62px;border-radius:8px;border:2px solid #fff;background:var(--hg,#444);box-shadow:0 10px 20px rgba(0,0,0,.5)}.hv span{display:block;font:500 11.5px 'Geist Mono',monospace;margin-top:4px;text-shadow:0 1px 4px #000}
.rw{display:flex;align-items:center;gap:12px;font:500 13px 'Geist Mono',monospace}.rw button{border:0;background:none;color:#fff;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;border-radius:8px}.rw button:hover{background:rgba(255,255,255,.18)}.rw button:focus-visible{outline:2px solid #fff}
.ch{background:#12141B;border:1px solid #23262F;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:4px}
.ch h2{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7C8196;padding:8px 10px 6px}
.ch button{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;text-align:left;border:0;background:none;color:inherit;border-radius:12px;padding:8px 10px;cursor:pointer;transition:background .15s}.ch button:hover{background:#1A1D27}.ch button.on{background:#222638}.ch button:focus-visible{outline:2px solid #8B8FFF}
.ch .th2{height:34px;border-radius:7px;background:var(--g)}.ch b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}.ch small{font:500 11.5px 'Geist Mono',monospace;color:#7C8196}
@media(max-width:720px){.c{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="pl" id="pl"><div class="sc" id="sc"><span class="kk" id="kk"></span><div class="tt" id="tt"></div><div class="big"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px"><path d="M8 5.500v13a1 1 0 0 0 1.500.860l10.500-6.500a1 1 0 0 0 0-1.720L9.500 4.640A1 1 0 0 0 8 5.500Z"/></svg></div>
<div class="cb"><div class="tl" id="tl" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="288"><div class="fl" id="fl"></div><div class="kn" id="kn"></div><div class="hv" id="hv"><div class="th"></div><span id="hs"></span></div></div>
<div class="rw"><button id="pp" aria-label="Play"><svg id="pi" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.500v13a1 1 0 0 0 1.500.860l10.500-6.500a1 1 0 0 0 0-1.720L9.500 4.640A1 1 0 0 0 8 5.500Z"/></svg></button><span id="tm">0:00 / 4:48</span></div></div></div></div>
<div class="ch" id="ch"><h2>Chapters</h2></div></div>
<script>
const CH=[['Welcome',0,'linear-gradient(135deg,#FF8A5B,#E8402A 60%,#5B1A3A)'],['Create a project',48,'linear-gradient(135deg,#6FD3FF,#3D5CF0 60%,#1F1B6B)'],['Invite your team',112,'linear-gradient(135deg,#8BE8B5,#1FA36A 60%,#0C4A3A)'],['Automations',178,'linear-gradient(135deg,#D7A8FF,#8B3DE0 60%,#3A1A6B)'],['Reports',236,'linear-gradient(135deg,#FFD66B,#E8981B 60%,#6B3A0C)']];
const D=288,f=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');let t=62,pl=false,iv=null;
const ch=document.getElementById('ch'),tl=document.getElementById('tl');
CH.forEach((c,i)=>{const e=CH[i+1]?CH[i+1][1]:D;const s=document.createElement('div');s.className='sg';s.style.left=(c[1]/D*100)+'%';s.style.width=((e-c[1])/D*100)+'%';tl.insertBefore(s,tl.firstChild);
 ch.insertAdjacentHTML('beforeend','<button data-i="'+i+'"><span class="th2" style="--g:'+c[2]+'"></span><span><b>'+c[0]+'</b><small>'+f(c[1])+'</small></span></button>')});
const B=[...ch.querySelectorAll('button')],pl_=document.getElementById('pl');
function cur(){let k=0;CH.forEach((c,i)=>{if(t>=c[1])k=i});return k}
function draw(){const k=cur();document.getElementById('fl').style.width=(t/D*100)+'%';document.getElementById('kn').style.left=(t/D*100)+'%';document.getElementById('tm').textContent=f(t)+' / 4:48';document.getElementById('sc').style.setProperty('--g',CH[k][2]);document.getElementById('tt').textContent=CH[k][0];document.getElementById('kk').textContent='CHAPTER 0'+(k+1);tl.setAttribute('aria-valuenow',Math.round(t));B.forEach((b,i)=>b.classList.toggle('on',i===k))}
function setP(p){pl=p;pl_.classList.toggle('playing',p);document.getElementById('pi').innerHTML=p?'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>':'<path d="M8 5.500v13a1 1 0 0 0 1.500.860l10.500-6.500a1 1 0 0 0 0-1.720L9.500 4.640A1 1 0 0 0 8 5.500Z"/>';document.getElementById('pp').setAttribute('aria-label',p?'Pause':'Play')}
function run(){clearInterval(iv);iv=setInterval(()=>{if(pl){t=Math.min(D,t+.25);draw();if(t>=D)setP(false)}},250)}
document.getElementById('sc').addEventListener('click',e=>{if(e.target.closest('.cb'))return;setP(!pl)});document.getElementById('pp').onclick=()=>{if(t>=D)t=0;setP(!pl)};
B.forEach((b,i)=>b.onclick=()=>{t=CH[i][1];setP(true);draw()});
function seek(e){const r=tl.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*D}
tl.addEventListener('pointerdown',e=>{e.stopPropagation();t=seek(e);draw();tl.setPointerCapture(e.pointerId);tl._d=1});tl.addEventListener('pointermove',e=>{const s=seek(e);if(tl._d){t=s;draw()}const hv=document.getElementById('hv');hv.style.opacity=1;hv.style.left=(s/D*100)+'%';hv.style.setProperty('--hg',CH[(()=>{let k=0;CH.forEach((c,i)=>{if(s>=c[1])k=i});return k})()][2]);document.getElementById('hs').textContent=f(s)});tl.addEventListener('pointerup',()=>tl._d=0);tl.addEventListener('pointerleave',()=>document.getElementById('hv').style.opacity=0);
tl.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){t=Math.min(D,t+5);draw()}if(e.key==='ArrowLeft'){t=Math.max(0,t-5);draw()}});
draw();run();
</script></body></html>
