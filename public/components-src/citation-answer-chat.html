<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Citation Answer Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9EEF3;color:#14202B;font-family:'Public Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:660px;background:#fff;border-radius:28px;padding:26px;box-shadow:0 40px 56px -34px rgba(20,32,43,.5),inset 0 0 0 1px rgba(20,32,43,.07)}
.q{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}
.sc{display:flex;align-items:center;gap:10px;font:500 12px 'IBM Plex Mono';color:#6A7A8B;margin-bottom:12px;height:20px}.sc .fv{display:flex}.sc .fv i{width:20px;height:20px;border-radius:50%;background:var(--c);margin-left:-6px;box-shadow:0 0 0 2px #fff;transform:scale(0)}.sc .fv i:first-child{margin:0}.an .sc .fv i{transition:transform .35s cubic-bezier(.3,1.8,.5,1)}.sc.dn .fv i{transform:scale(1)}
.ans{font:400 17px/1.7 'Source Serif 4',serif;color:#233443}
.ans mark{background:none;color:inherit;border-radius:4px;padding:1px 0;transition:background .35s,box-shadow .35s}.ans mark.hl{background:rgba(59,130,246,.16);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
.cr{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin:0 2px;border-radius:99px;background:#E7EEF7;color:#2563EB;font:700 11px 'Public Sans';vertical-align:2px;cursor:pointer;transition:background .25s,color .25s,transform .3s cubic-bezier(.3,1.9,.5,1)}.cr.hl{background:#2563EB;color:#fff;transform:scale(1.25)}
.srs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.sr{position:relative;border-radius:14px;padding:12px 13px;background:#F4F7FA;box-shadow:inset 0 0 0 1.5px transparent;transition:all .35s cubic-bezier(.3,1.4,.5,1);min-height:104px}.sr.hl{background:#fff;box-shadow:inset 0 0 0 2px #2563EB,0 14px 24px -14px rgba(37,99,235,.55);transform:translateY(-4px)}
.sr .h{display:flex;align-items:center;gap:7px;font:600 11.500px 'Public Sans';color:#5A6B7B;margin-bottom:6px}.sr .h i{width:16px;height:16px;border-radius:5px;background:var(--c)}.sr .h em{margin-left:auto;font:500 10.500px 'IBM Plex Mono';font-style:normal;color:#2563EB}
.sr b{display:block;font-size:13px;line-height:1.35;font-weight:700;margin-bottom:5px}.sr span{font-size:11.500px;line-height:1.4;color:#6A7A8B;display:block}
.rl{height:3px;border-radius:2px;background:#E1E8EF;margin-top:8px;overflow:hidden}.rl i{display:block;height:100%;width:var(--r);background:#2563EB}
@media(max-width:600px){.srs{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="cd"><div class="q">Why is the sky blue at noon but red at sunset?</div><div class="sc" id="sc"><span class="fv" id="fv"></span><span id="sx">Searched 6 sources</span></div>
<p class="ans" id="an"></p><div class="srs" id="sr"></div></div>
<script>
const SR=[['Rayleigh scattering','NOAA Science','#0EA5E9','Shorter wavelengths scatter far more strongly in air, so blue light reaches your eyes from every direction.',92],['Why sunsets are red','NASA Earth','#F97316','Near the horizon, light crosses much more atmosphere and the blue is scattered out of the beam before it arrives.',88],['How violet is filtered','Physics Today','#8B5CF6','Our eyes are less sensitive to violet and the sun emits less of it, so the sky looks blue rather than violet.',71]];
const AN=[['Sunlight is a mix of every colour, and air molecules scatter short wavelengths ',1],[' far more than long ones. At noon, scattered blue arrives from the whole sky.',1,'1'],['At sunset the light travels through much more atmosphere, ',0],['removing most of the blue and leaving red and orange.',1,'2'],[' The sky is not violet because the sun emits less of it and our eyes respond weakly to it.',1,'3']];
const an=document.getElementById('an'),sr=document.getElementById('sr'),sc=document.getElementById('sc'),fv=document.getElementById('fv');const sl=ms=>new Promise(r=>setTimeout(r,ms));let off=false;
SR.forEach(s=>{fv.insertAdjacentHTML('beforeend','<i style="--c:'+s[2]+'"></i>')});[1,2,3].forEach(()=>fv.insertAdjacentHTML('beforeend','<i style="--c:#CBD5E1"></i>'));
an.innerHTML=[0,1,2,3,4].map(i=>{const p=AN[i];return '<mark data-s="'+(p[2]?p[2]-1:'')+'">'+p[0].trim()+'</mark>'+(p[2]?'<span class="cr" data-s="'+(p[2]-1)+'">'+p[2]+'</span>':'')+' '}).join('');
SR.forEach((s,i)=>{const d=document.createElement('div');d.className='sr';d.dataset.s=i;d.innerHTML='<div class="h"><i style="--c:'+s[2]+'"></i>'+s[1]+'<em>'+s[4]+'%</em></div><b>'+s[0]+'</b><span>'+s[3]+'</span><div class="rl"><i style="--r:'+s[4]+'%"></i></div>';sr.appendChild(d)});
function hl(i){document.querySelectorAll('.cr,.sr,mark').forEach(e=>e.classList.toggle('hl',e.dataset.s!==''&&+e.dataset.s===i&&i>=0))}
document.querySelectorAll('.cr,.sr').forEach(e=>{e.onpointerenter=()=>{off=true;hl(+e.dataset.s)};e.onpointerleave=()=>hl(-1)});
sc.classList.add('dn');requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('an')));hl(1);
/* Idle demo: after 3s a highlight tours the answer: each numbered citation chip pops, the sentence it supports glows blue, and the matching source card lifts out of the row with a relevance meter; between rounds the search strip replays its favicons popping in, until you hover a chip or card. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);let k=1;while(!off){k=(k+1)%3;hl(k);await sl(2300);if(off)return;if(k===2){hl(-1);sc.classList.remove('dn');document.getElementById('sx').textContent='Searching 6 sources…';await sl(500);sc.classList.add('dn');document.getElementById('sx').textContent='Searched 6 sources';await sl(1100)}}})()}
</script></body></html>
