<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Picker Popover</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ECEEF4;color:#14172B;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:560px;height:470px;background:#fff;border-radius:26px;box-shadow:0 40px 70px -44px rgba(20,23,43,.5),0 0 0 1px rgba(20,23,43,.07);padding:26px}
.st h1{font-size:20px;font-weight:700;letter-spacing:-.03em}.st>p{font-size:14px;color:#7A80A4;margin:3px 0 20px}
.pv{position:relative;height:150px;border-radius:20px;background:var(--c);display:grid;place-items:center;transition:background .15s;overflow:hidden}.pv::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.4),transparent 50%)}.pv b{position:relative;font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--t)}
.tr{display:flex;align-items:center;gap:12px;margin-top:16px}.sw{position:relative;width:46px;height:46px;border:3px solid #fff;border-radius:14px;background:var(--c);box-shadow:0 0 0 1.5px #D5D9EC,0 6px 14px -6px rgba(20,23,43,.4);cursor:pointer;transition:transform .15s;padding:0}.sw:hover{transform:scale(1.06)}.sw:focus-visible{outline:3px solid #5B5BF6;outline-offset:3px}
.tr .tx{flex:1}.tr .tx b{display:block;font-size:14.5px;font-weight:600}.tr .tx span{font:500 13px 'JetBrains Mono',monospace;color:#7A80A4}
.pp{position:absolute;left:26px;top:210px;width:264px;background:#fff;border-radius:22px;padding:14px;box-shadow:0 30px 60px -16px rgba(20,23,43,.5),0 0 0 1px rgba(20,23,43,.08);transform-origin:top left;opacity:0;transform:scale(.9) translateY(-8px);pointer-events:none;transition:all .25s cubic-bezier(.3,1.3,.5,1);z-index:5}.pp.op{opacity:1;transform:none;pointer-events:auto}
.sa{position:relative;height:150px;border-radius:14px;cursor:crosshair;touch-action:none;background:linear-gradient(transparent,#000),linear-gradient(90deg,#fff,hsl(var(--h),100%,50%))}
.cur{position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.4);pointer-events:none}
.hu{position:relative;height:14px;border-radius:14px;margin:14px 0 12px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer;touch-action:none}.hu .cur{top:50%}
.hx{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hx span{width:28px;height:28px;border-radius:9px;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}.hx input{flex:1;min-width:0;border:1.5px solid #E0E3F1;border-radius:10px;padding:7px 10px;font:500 14px 'JetBrains Mono',monospace;color:#14172B;outline:0;text-transform:uppercase}.hx input:focus{border-color:#5B5BF6}
.ps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.ps button{aspect-ratio:1;border:0;border-radius:8px;background:var(--c);cursor:pointer;transition:transform .12s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}.ps button:hover{transform:scale(1.15)}.ps button:focus-visible{outline:2px solid #14172B;outline-offset:2px}
</style></head><body>
<div class="st" id="st"><h1>Brand colour</h1><p>Pick an accent. It updates across your workspace.</p>
<div class="pv" id="pv"><b id="pt">Aa  Northwind</b></div>
<div class="tr"><button class="sw" id="sw" aria-haspopup="dialog" aria-expanded="true" aria-label="Open colour picker"></button><div class="tx"><b>Accent colour</b><span id="hx"></span></div></div>
<div class="pp op" id="pp" role="dialog" aria-label="Colour picker"><div class="sa" id="sa"><div class="cur" id="sc"></div></div><div class="hu" id="hu"><div class="cur" id="hc"></div></div><div class="hx"><span></span><input id="hi" maxlength="7" aria-label="Hex value"></div><div class="ps" id="ps"></div></div></div>
<script>
let h=250,s=.72,v=.9;const st=document.getElementById('st');
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return '#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function hex2hsv(x){x=x.replace('#','');if(x.length!==6)return null;const r=parseInt(x.slice(0,2),16)/255,g=parseInt(x.slice(2,4),16)/255,b=parseInt(x.slice(4,6),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=0;if(d){if(mx===r)hh=((g-b)/d)%6;else if(mx===g)hh=(b-r)/d+2;else hh=(r-g)/d+4;hh*=60;if(hh<0)hh+=360}return[hh,mx?d/mx:0,mx]}
function lum(hx){const n=parseInt(hx.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (.299*r+.587*g+.114*b)/255}
function upd(from){const hx=hsv2hex(h,s,v);st.style.setProperty('--c',hx);st.style.setProperty('--h',h);st.style.setProperty('--t',lum(hx)>.62?'#14172B':'#fff');document.getElementById('hx').textContent=hx.toUpperCase();if(from!=='i')document.getElementById('hi').value=hx.toUpperCase();
 document.getElementById('sc').style.left=(s*100)+'%';document.getElementById('sc').style.top=((1-v)*100)+'%';document.getElementById('sc').style.background=hx;document.getElementById('hc').style.left=(h/360*100)+'%';document.getElementById('hc').style.background='hsl('+h+',100%,50%)'}
function drag(el,fn){let d=false;const mv=e=>{const r=el.getBoundingClientRect();fn(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)))};el.addEventListener('pointerdown',e=>{d=true;el.setPointerCapture(e.pointerId);mv(e)});el.addEventListener('pointermove',e=>{if(d)mv(e)});el.addEventListener('pointerup',()=>d=false)}
drag(document.getElementById('sa'),(x,y)=>{s=x;v=1-y;upd()});drag(document.getElementById('hu'),x=>{h=x*360;upd()});
document.getElementById('hi').addEventListener('input',e=>{let t=e.target.value;if(t[0]!=='#')t='#'+t;const r=hex2hsv(t);if(r){[h,s,v]=r;upd('i')}});
const PS=['#EF4444','#F97316','#F59E0B','#10B981','#06B6D4','#3B82F6','#6366F1','#A855F7','#EC4899','#F43F5E','#84CC16','#14B8A6','#0EA5E9','#8B5CF6','#64748B','#111827'];
document.getElementById('ps').innerHTML=PS.map(c=>'<button style="--c:'+c+'" aria-label="'+c+'" data-c="'+c+'"></button>').join('');document.querySelectorAll('.ps button').forEach(b=>b.onclick=()=>{const r=hex2hsv(b.dataset.c);[h,s,v]=r;upd()});
const sw=document.getElementById('sw'),pp=document.getElementById('pp');sw.onclick=()=>{const o=!pp.classList.contains('op');pp.classList.toggle('op',o);sw.setAttribute('aria-expanded',o)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){pp.classList.remove('op');sw.setAttribute('aria-expanded','false');sw.focus()}});
document.addEventListener('pointerdown',e=>{if(!pp.contains(e.target)&&!sw.contains(e.target)){pp.classList.remove('op');sw.setAttribute('aria-expanded','false')}});upd();
</script></body></html>
