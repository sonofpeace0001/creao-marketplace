<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zoom Level Date Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EDE9F6;color:#1D1638;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:400px;background:#fff;border-radius:30px;padding:22px;box-shadow:0 40px 56px -34px rgba(29,22,56,.5),inset 0 0 0 1px rgba(29,22,56,.07)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hd button{border:0;background:none;cursor:pointer;font:inherit;color:inherit}
.ti{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;letter-spacing:-.04em;padding:6px 10px;border-radius:12px;transition:background .2s,transform .15s}.ti:hover{background:#F3EFFB}.ti.pr{transform:scale(.95);background:#E9E2FA}.ti svg{width:16px;height:16px;stroke:#7C5CFF;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.ar{width:34px;height:34px;border-radius:11px;background:#F3EFFB;color:#7C5CFF;font-size:18px;font-weight:800}.ar:hover{background:#E6DEFA}.ar:focus-visible,.ti:focus-visible{outline:2px solid #7C5CFF}
.vp{position:relative;height:290px;overflow:hidden}
.gr{position:absolute;inset:0;display:grid;gap:4px;align-content:start}.gr.d{grid-template-columns:repeat(7,1fr);grid-auto-rows:42px}.gr.m,.gr.y{grid-template-columns:repeat(3,1fr);grid-auto-rows:66px;gap:8px}
.wk{font:500 11px 'DM Mono';color:#9A8FC2;text-align:center;align-self:center}
.c{border:0;border-radius:14px;background:none;font:700 15px 'Bricolage Grotesque';color:#1D1638;cursor:pointer;transition:background .2s,color .2s,transform .2s cubic-bezier(.3,2,.5,1)}.c.dim{color:#C3BBDC}.c:hover{background:#F3EFFB}.c.tn{color:#7C5CFF;box-shadow:inset 0 0 0 2px #CFC3FF}.c.pr{transform:scale(.88);background:#E3DAFB}.c.sel{background:linear-gradient(135deg,#7C5CFF,#C05CFF);color:#fff;box-shadow:0 10px 18px -8px rgba(124,92,255,.7)}.gr.m .c,.gr.y .c{font-size:17px;border-radius:18px;background:#F7F4FD}.gr.m .c.sel,.gr.y .c.sel{background:linear-gradient(135deg,#7C5CFF,#C05CFF)}.c:focus-visible{outline:2px solid #7C5CFF}
.ft{margin-top:12px;padding:12px 14px;border-radius:14px;background:#F7F4FD;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.ft span{font:500 12px 'DM Mono';color:#9A8FC2}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="cd"><div class="hd"><button class="ar" id="pv" aria-label="Previous">‹</button><button class="ti" id="ti"><span id="tt">November 2026</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button class="ar" id="nx" aria-label="Next">›</button></div><div class="vp" id="vp"></div><div class="ft"><b id="fs">Pick a date</b><span id="fl">Day view</span></div></div>
<script>
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],FM=['January','February','March','April','May','June','July','August','September','October','November','December'],WD=['Su','Mo','Tu','We','Th','Fr','Sa'];
const $=id=>document.getElementById(id),vp=$('vp'),sl=t=>new Promise(r=>setTimeout(r,t));let L=0,Y=2026,M=10,sel=null,off=false,cur=null;
function build(l){const g=document.createElement('div');g.className='gr '+['d','m','y'][l];if(l===0){WD.forEach(w=>g.insertAdjacentHTML('beforeend','<span class="wk">'+w+'</span>'));const f=new Date(Y,M,1).getDay(),n=new Date(Y,M+1,0).getDate(),pn=new Date(Y,M,0).getDate();for(let i=0;i<f;i++)g.insertAdjacentHTML('beforeend','<button class="c dim" tabindex="-1">'+(pn-f+i+1)+'</button>');for(let d=1;d<=n;d++){const b=document.createElement('button');b.className='c'+(Y===2026&&M===10&&d===14?' tn':'')+(sel&&sel[0]===Y&&sel[1]===M&&sel[2]===d?' sel':'');b.textContent=d;b.dataset.k='d'+d;b.onclick=()=>{off=true;pickD(d)};g.appendChild(b)}const tot=f+n;for(let i=1;tot+i-1<42&&i<8;i++)g.insertAdjacentHTML('beforeend','<button class="c dim" tabindex="-1">'+i+'</button>')}
 else if(l===1){MN.forEach((m,i)=>{const b=document.createElement('button');b.className='c'+(i===M?' sel':'');b.textContent=m;b.dataset.k='m'+i;b.onclick=()=>{off=true;pickM(i)};g.appendChild(b)})}
 else{const y0=Math.floor(Y/12)*12;for(let i=0;i<12;i++){const y=y0+i,b=document.createElement('button');b.className='c'+(y===Y?' sel':'');b.textContent=y;b.dataset.k='y'+y;b.onclick=()=>{off=true;pickY(y)};g.appendChild(b)}}
 return g}
function title(){$('tt').textContent=L===0?FM[M]+' '+Y:L===1?Y:(Math.floor(Y/12)*12)+' – '+(Math.floor(Y/12)*12+11);$('fl').textContent=['Day view','Month view','Year view'][L];$('ti').querySelector('svg').style.transform=L===2?'rotate(180deg)':''}
function go(l,dir,instant){const old=cur;L=l;const nw=build(l);vp.appendChild(nw);cur=nw;title();if(!instant){const z=dir==='in';nw.animate([{opacity:0,transform:'scale('+(z?.72:1.35)+')'},{opacity:1,transform:'scale(1)'}],{duration:480,easing:'cubic-bezier(.3,1.1,.4,1)'});if(old){const a=old.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale('+(z?1.35:.72)+')'}],{duration:380,fill:'forwards',easing:'ease-in'});a.onfinish=()=>old.remove()}}else if(old)old.remove()}
function pickD(d){sel=[Y,M,d];const dt=new Date(Y,M,d);$('fs').textContent=dt.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});cur.querySelectorAll('.c').forEach(c=>c.classList.toggle('sel',c.dataset.k==='d'+d))}
function pickM(i){M=i;go(0,'in')}function pickY(y){Y=y;go(1,'in')}
$('ti').onclick=()=>{off=true;if(L<2)go(L+1,'out')};$('pv').onclick=()=>{off=true;nav(-1)};$('nx').onclick=()=>{off=true;nav(1)};
function nav(s){if(L===0){M+=s;if(M<0){M=11;Y--}if(M>11){M=0;Y++}}else if(L===1)Y+=s;else Y+=s*12;const o=cur;L=L;const n=build(L);vp.appendChild(n);cur=n;title();n.animate([{opacity:0,transform:'translateX('+(s*40)+'px)'},{opacity:1,transform:'none'}],{duration:340,easing:'ease-out'});o.animate([{opacity:1},{opacity:0,transform:'translateX('+(-s*40)+'px)'}],{duration:260,fill:'forwards'}).onfinish=()=>o.remove()}
async function press(k){const e=[...cur.querySelectorAll('.c,.ti')].find(x=>x.dataset&&x.dataset.k===k);if(e){e.classList.add('pr');await sl(260);e.classList.remove('pr')}}
async function pressTi(){const t=$('ti');t.classList.add('pr');await sl(240);t.classList.remove('pr')}
sel=[2026,10,19];go(0,'in',true);pickD(19);document.querySelector('.cd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a date picker that zooms through levels like a camera; pressing the title zooms out so the month grid shrinks away as twelve month tiles scale in, another press zooms out to a grid of years, picking 2028 and then March zooms back in level by level with each new grid growing from smaller, and finally a day is picked with a violet gradient chip and the footer spells out the full date, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){await pressTi();go(1,'out');await sl(1300);await pressTi();go(2,'out');await sl(1300);await press('y2028');pickY(2028);await sl(1300);await press('m2');pickM(2);await sl(1300);await press('d14');pickD(14);await sl(2800);if(off)return;Y=2026;M=10;sel=[2026,10,19];go(0,'in');pickD(19);await sl(1500)}})()}
</script></body></html>
