<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Confetti Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFF1F5;color:#2B0F1C;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{position:relative;width:100%;max-width:460px;background:#fff;border-radius:28px;padding:28px;box-shadow:0 40px 70px -44px rgba(190,40,100,.5),0 0 0 1px rgba(43,15,28,.06)}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.hd h1{font:800 25px 'Bricolage Grotesque';letter-spacing:-.04em}.hd b{font:800 14px 'Bricolage Grotesque';color:#E11D74}
.pb{height:8px;border-radius:8px;background:#FBE3EC;margin:12px 0 20px;overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#FF7AB6,#E11D74);transition:width .5s cubic-bezier(.3,1.2,.4,1)}
.it{position:relative;display:flex;align-items:center;gap:14px;padding:13px 6px;border-radius:14px;cursor:pointer;user-select:none;transition:background .15s}.it:hover{background:#FFF6F9}
.it input{position:absolute;opacity:0}
.bx{position:relative;flex:none;width:28px;height:28px;border-radius:9px;border:2px solid #E8C5D4;background:#fff;transition:all .25s cubic-bezier(.3,1.5,.5,1);display:grid;place-items:center}
.bx svg{width:16px;height:16px;stroke:#fff;stroke-width:3.500;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .08s ease-out}
.it input:checked~.bx{background:#E11D74;border-color:#E11D74;transform:scale(1.1)}.it input:checked~.bx svg{stroke-dashoffset:0}
.it input:focus-visible~.bx{outline:3px solid #2B0F1C;outline-offset:3px}
.it span.t{font-size:16px;font-weight:500;position:relative;transition:color .25s}.it span.t::after{content:"";position:absolute;left:0;top:52%;height:2px;width:0;background:#B98AA0;transition:width .3s ease-out}
.it input:checked~.t{color:#B98AA0}.it input:checked~.t::after{width:100%}
.it em{margin-left:auto;font:700 12px 'DM Sans';font-style:normal;background:#FFE3EE;color:#B8155F;padding:3px 9px;border-radius:99px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:9}.fx i{position:absolute;width:9px;height:14px;border-radius:2px;will-change:transform,opacity}
.dn{display:none;text-align:center;padding:14px 0 4px;font:800 18px 'Bricolage Grotesque';letter-spacing:-.03em;color:#E11D74}.c.all .dn{display:block}
.rs{margin-top:14px;border:0;background:none;color:#8F5A74;font:600 13px 'DM Sans';cursor:pointer;text-decoration:underline;text-underline-offset:3px}.rs:focus-visible{outline:2px solid #E11D74}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c" id="c"><div class="hd"><h1>Launch day</h1><b id="n">2 of 5</b></div><div class="pb"><i id="p"></i></div><div id="ls"></div><div class="dn">Everything shipped. Go celebrate!</div><button class="rs" id="rs">Reset list</button></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<script>
const I=[['Write the announcement','Marketing',1],['Test the checkout flow','QA',1],['Update the pricing page','Web',0],['Brief the support team','Ops',0],['Schedule the social posts','Social',0]];
const ls=document.getElementById('ls');ls.innerHTML=I.map((t,i)=>'<label class="it"><input type="checkbox" '+(t[2]?'checked':'')+'><span class="bx"><svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><span class="t">'+t[0]+'</span><em>'+t[1]+'</em></label>').join('');
const B=[...ls.querySelectorAll('input')],fx=document.getElementById('fx');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function upd(){const n=B.filter(b=>b.checked).length;document.getElementById('n').textContent=n+' of '+B.length;document.getElementById('p').style.width=(n/B.length*100)+'%';document.getElementById('c').classList.toggle('all',n===B.length)}
function burst(el,big){if(reduced)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,N=big?60:16,col=['#E11D74','#FF7AB6','#FACC15','#38BDF8','#34D399','#A78BFA'];
 for(let i=0;i<N;i++){const p=document.createElement('i');p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=col[i%col.length];fx.appendChild(p);const a=Math.random()*Math.PI*2,v=(big?160:70)+Math.random()*(big?260:90),dx=Math.cos(a)*v,dy=Math.sin(a)*v-(big?120:50),rot=Math.random()*720-360;
  p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+(dy+200)+'px) rotate('+rot+'deg)',opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove()}}
B.forEach(b=>b.addEventListener('change',()=>{upd();if(b.checked){burst(b.nextElementSibling,B.every(x=>x.checked))}}));
document.getElementById('rs').onclick=()=>{B.forEach((b,i)=>b.checked=!!I[i][2]);upd()};upd();
</script></body></html>
