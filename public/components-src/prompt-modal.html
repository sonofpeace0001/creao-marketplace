<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hold to Delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B090A;--panel:#151113;--line:rgba(255,255,255,.08);--text:#F3EEEE;--muted:#9B9092;--red:#F04438;--amber:#F5A623}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 420px at 50% 0,rgba(240,68,56,.13),transparent 65%),var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:32px 18px}
.m{width:100%;max-width:470px;background:linear-gradient(180deg,#1A1517,var(--panel));border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 50px 100px -30px #000,0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.07);position:relative;overflow:hidden}
.m::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#1a0a09 12px 24px);opacity:.85}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(240,68,56,.12);border:1px solid rgba(240,68,56,.3);color:var(--red);margin-bottom:20px;position:relative}
.ic::after{content:"";position:absolute;inset:-7px;border-radius:21px;border:1px solid rgba(240,68,56,.18)}
h1{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
h1 code{font:500 20px 'JetBrains Mono',monospace;color:var(--red)}
.d{color:var(--muted);font-size:14.5px;line-height:1.55;margin:10px 0 18px}
.imp{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.imp div{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;font-size:13.5px;color:#C9BFC1}
.imp div+div{border-top:1px solid var(--line)}
.imp b{font:500 13px 'JetBrains Mono',monospace;color:var(--amber)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
label code{font:500 12.5px 'JetBrains Mono',monospace;color:var(--text);background:rgba(255,255,255,.07);padding:2px 7px;border-radius:6px}
.in{position:relative}
input{width:100%;background:#0E0B0C;border:1.5px solid var(--line);border-radius:13px;padding:14px 44px 14px 15px;font:500 14.5px 'JetBrains Mono',monospace;color:var(--text);outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:rgba(240,68,56,.6);box-shadow:0 0 0 4px rgba(240,68,56,.12)}
input.ok{border-color:#32D583;box-shadow:0 0 0 4px rgba(50,213,131,.1)}
.ck{position:absolute;right:14px;top:50%;transform:translateY(-50%) scale(.5);opacity:0;color:#32D583;transition:all .25s cubic-bezier(.3,1.5,.4,1)}.ok~.ck{opacity:1;transform:translateY(-50%) scale(1)}
.row{display:flex;gap:12px;margin-top:22px}
.cancel{flex:0 0 auto;font:600 14.5px 'Sora';padding:0 22px;height:54px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);cursor:pointer;transition:background .2s}.cancel:hover{background:rgba(255,255,255,.09)}
.hold{position:relative;flex:1;height:54px;border-radius:15px;border:0;overflow:hidden;font:700 14.5px 'Sora';color:#fff;background:#3a1f1d;cursor:not-allowed;user-select:none;-webkit-user-select:none;touch-action:none;transition:background .25s,transform .1s}
.hold .fill{position:absolute;inset:0;background:linear-gradient(90deg,#C2271B,var(--red));transform:scaleX(0);transform-origin:left}
.hold .lab{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;height:100%;color:rgba(255,255,255,.45);transition:color .2s}
.hold.arm{background:#5a2420;cursor:pointer}.hold.arm .lab{color:#fff}
.hold.arm:active{transform:scale(.985)}
.hold:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hold.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hold.gone{background:#12B76A;cursor:default}.hold.gone .fill{display:none}
.tip{margin-top:12px;text-align:center;font-size:12.5px;color:var(--muted);height:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="m" role="alertdialog" aria-labelledby="t" aria-describedby="d">
  <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6M10 11v6M14 11v6"/></svg></div>
  <h1 id="t">Delete <code>orion-api</code>?</h1>
  <p class="d" id="d">This permanently removes the project and everything inside it. There is no undo, and no one on your team will be able to recover it.</p>
  <div class="imp">
    <div>Environments<b>14</b></div><div>Active API keys<b>6</b></div><div>Requests in the last 24h<b>2,310</b></div>
  </div>
  <label for="c">Type <code>orion-api</code> to confirm</label>
  <div class="in"><input id="c" autocomplete="off" spellcheck="false" placeholder="orion-api"><svg class="ck" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 3 3 5-6"/></svg></div>
  <div class="row">
    <button class="cancel" id="cancel">Cancel</button>
    <button class="hold" id="h" aria-disabled="true" aria-label="Hold to delete project"><span class="fill" id="f"></span><span class="lab" id="l"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="lt">Hold to delete</span></span></button>
  </div>
  <div class="tip" id="tip">Type the project name to unlock.</div>
</div>
<script>
const $=id=>document.getElementById(id),c=$('c'),h=$('h'),f=$('f'),lt=$('lt'),tip=$('tip'),HOLD=1200;
let raf=0,t0=0,armed=false,done=false;
c.addEventListener('input',()=>{armed=c.value.trim()==='orion-api';c.classList.toggle('ok',armed);h.classList.toggle('arm',armed);h.setAttribute('aria-disabled',!armed);tip.textContent=armed?'Now press and hold the button for 1.2 seconds.':'Type the project name to unlock.'});
function start(){if(done)return;if(!armed){h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');c.focus();return}
  t0=performance.now();lt.textContent='Keep holding…';const step=t=>{const k=Math.min(1,(t-t0)/HOLD);f.style.transform='scaleX('+k+')';if(k<1)raf=requestAnimationFrame(step);else finish()};raf=requestAnimationFrame(step)}
function stop(){if(done)return;cancelAnimationFrame(raf);f.style.transition='transform .25s';f.style.transform='scaleX(0)';setTimeout(()=>f.style.transition='',260);lt.textContent='Hold to delete'}
function finish(){done=true;h.classList.add('gone');h.classList.remove('arm');$('l').innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg><span>Project deleted</span>';tip.textContent='orion-api was removed. Undo is not available.';c.disabled=true}
h.addEventListener('pointerdown',e=>{e.preventDefault();start()});['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,stop));
h.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();start()}});h.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stop()});
$('cancel').onclick=()=>{c.value='';c.dispatchEvent(new Event('input'));stop()};
</script>
</body>
</html>
