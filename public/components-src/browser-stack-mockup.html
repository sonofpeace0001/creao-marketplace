<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Browser Stack Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#FFE9D6,#FFD6E4 50%,#DCD6FF);color:#1E1530;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{width:100%;max-width:880px;text-align:center}
h1{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:-.055em}p.sb{color:#7C6A8F;font-size:16px;margin:8px 0 34px}
.st{position:relative;height:430px;perspective:1600px;display:grid;place-items:center}
.pl{position:relative;width:min(640px,94vw);height:360px;transform-style:preserve-3d;transform:rotateX(52deg) rotateZ(-28deg);transition:transform .9s cubic-bezier(.3,1.1,.4,1)}
.pl.fan{transform:rotateX(38deg) rotateZ(-20deg)}
.bw{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:16px;background:#fff;box-shadow:0 30px 50px -20px rgba(60,20,90,.5),0 0 0 1px rgba(30,21,48,.1);overflow:hidden;transform:translateZ(var(--z,0px)) translateY(var(--y,0px));transition:transform .8s cubic-bezier(.3,1.2,.5,1);cursor:pointer;outline:0}
.bw:nth-child(1){--z:0px;--y:0px}.bw:nth-child(2){--z:60px;--y:-30px}.bw:nth-child(3){--z:120px;--y:-60px}
.pl.fan .bw:nth-child(1){--z:0px;--y:60px}.pl.fan .bw:nth-child(2){--z:130px;--y:0px}.pl.fan .bw:nth-child(3){--z:260px;--y:-60px}
.bw:hover,.bw:focus-visible{--lift:1}.bw:focus-visible{box-shadow:0 0 0 3px #7C3AED}
.tb{height:38px;background:#F2F0F8;display:flex;align-items:center;gap:7px;padding:0 14px}.tb i{width:10px;height:10px;border-radius:50%;background:#D5D0E4}.tb i:nth-child(1){background:#FF6B6B}.tb i:nth-child(2){background:#FFC145}.tb i:nth-child(3){background:#3DDC84}
.tb .u{margin-left:12px;flex:1;max-width:260px;height:22px;border-radius:99px;background:#fff;font-size:11px;color:#8A7FA0;display:flex;align-items:center;padding:0 12px;font-weight:500}
.bd{padding:20px 24px;height:calc(100% - 38px)}
.b1{background:linear-gradient(160deg,#EEF0FF,#fff)}.b1 .h{font-size:22px;font-weight:800;letter-spacing:-.05em}.b1 .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.b1 .g div{height:90px;border-radius:14px;background:var(--c)}
.b2{background:#14122A;color:#fff}.b2 .h{font-size:22px;font-weight:800;letter-spacing:-.05em}.b2 .l{margin-top:14px;display:grid;gap:8px}.b2 .l i{height:34px;border-radius:10px;background:#1F1B3E;position:relative;overflow:hidden}.b2 .l i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:linear-gradient(90deg,#6366F1,#EC4899);border-radius:10px}
.b3{background:#FFF8EE}.b3 .im{height:150px;border-radius:16px;background:linear-gradient(135deg,#FB923C,#F472B6);position:relative;overflow:hidden}.b3 .im::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:100px;background:#7C2D12;border-radius:50% 50% 0 0;opacity:.6}.b3 .im::after{content:"";position:absolute;right:30px;top:24px;width:48px;height:48px;border-radius:50%;background:#FEF3C7}.b3 .h{font-size:20px;font-weight:800;letter-spacing:-.04em;margin:14px 0 6px}.b3 .t{height:9px;border-radius:5px;background:#F0E2CE;margin-top:7px}.b3 .t:last-child{width:60%}
.lb{position:absolute;right:0;bottom:6px;font-size:13px;color:#8A7AA0;font-weight:600}
.ctl{margin-top:26px;display:flex;gap:10px;justify-content:center}.ctl button{border:2px solid #1E1530;background:#fff;border-radius:99px;padding:9px 20px;font:700 14px 'Sora';cursor:pointer;box-shadow:3px 3px 0 #1E1530}.ctl button:active{transform:translate(3px,3px);box-shadow:none}.ctl button:focus-visible{outline:3px solid #7C3AED;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><h1>Windows in layers</h1><p class="sb">Three browser windows stacked in 3D that fan apart on demand.</p>
<div class="st"><div class="pl fan" id="pl"><div class="bw" tabindex="0" role="img" aria-label="Portfolio window"><div class="tb"><i></i><i></i><i></i><span class="u">atlas.studio/work</span></div><div class="bd b3"><div class="im"></div><div class="h">Northwind rebrand</div><div class="t"></div><div class="t"></div><div class="t"></div></div></div><div class="bw" tabindex="0" role="img" aria-label="Analytics window"><div class="tb"><i></i><i></i><i></i><span class="u">pulse.app/analytics</span></div><div class="bd b2"><div class="h">Traffic by source</div><div class="l"><i style="--w:82%"></i><i style="--w:64%"></i><i style="--w:48%"></i><i style="--w:30%"></i></div></div></div><div class="bw" tabindex="0" role="img" aria-label="Landing page window"><div class="tb"><i></i><i></i><i></i><span class="u">launchpad.dev</span></div><div class="bd b1"><div class="h">Ship your idea this week</div><div class="g"><div style="--c:linear-gradient(135deg,#6366F1,#A855F7)"></div><div style="--c:linear-gradient(135deg,#EC4899,#F97316)"></div><div style="--c:linear-gradient(135deg,#10B981,#0EA5E9)"></div></div></div></div></div></div>
<div class="ctl"><button id="b1">Stack</button><button id="b2">Fan out</button></div></div>
<script>
const pl=document.getElementById('pl');document.getElementById('b1').onclick=()=>pl.classList.remove('fan');document.getElementById('b2').onclick=()=>pl.classList.add('fan');
pl.parentNode.addEventListener('pointermove',e=>{const r=pl.parentNode.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5;pl.style.transform='rotateX('+(pl.classList.contains('fan')?38:52)+'deg) rotateZ('+((pl.classList.contains('fan')?-20:-28)+x*14)+'deg)'});pl.parentNode.addEventListener('pointerleave',()=>pl.style.transform='');
</script></body></html>
