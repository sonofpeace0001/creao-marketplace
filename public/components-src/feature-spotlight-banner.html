<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feature Spotlight Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7E4F5;color:#1A1533;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.bn{position:relative;width:100%;max-width:700px;border-radius:30px;background:linear-gradient(135deg,#6D4DFF,#B14DFF 60%,#FF6AB5);color:#fff;padding:30px;display:grid;grid-template-columns:1fr 280px;gap:26px;align-items:center;box-shadow:0 40px 56px -30px rgba(109,77,255,.7);overflow:hidden}
.bn::before{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.tg{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);font:500 12px 'DM Mono';letter-spacing:.1em;margin-bottom:14px}.tg i{width:7px;height:7px;border-radius:50%;background:#fff;animation:bk 1.4s infinite}@keyframes bk{50%{opacity:.3}}
.tx h1{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.05em;margin-bottom:10px}.tx p{font-size:15.500px;line-height:1.5;color:rgba(255,255,255,.88);margin-bottom:20px;max-width:340px}
.bt{display:flex;gap:10px;align-items:center}.bt a{border:0;border-radius:14px;padding:13px 20px;background:#fff;color:#4C2FD4;font:700 15px 'Bricolage Grotesque';cursor:pointer;text-decoration:none;transition:transform .15s}.bt a:active{transform:scale(.96)}.bt span{font-size:14px;color:rgba(255,255,255,.8);font-weight:600}
.x{position:absolute;right:16px;top:14px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer}.x:focus-visible,.bt a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dm{position:relative;height:210px;perspective:900px}
.wn{position:absolute;inset:0;border-radius:18px;background:var(--wb,#fff);box-shadow:0 26px 40px -16px rgba(20,10,80,.6);transform:rotateY(-14deg) rotateX(6deg);padding:12px;overflow:hidden;transition:background .6s}
.wn .tb{display:flex;gap:5px;margin-bottom:10px}.wn .tb i{width:8px;height:8px;border-radius:50%;background:var(--wl,#DDD)}
.wn .sb{position:absolute;left:12px;top:30px;bottom:12px;width:50px;border-radius:10px;background:var(--wl,#EEE);transition:background .6s}
.wn .mn{margin-left:60px;display:grid;gap:8px}.wn .mn i{display:block;border-radius:9px;background:var(--wl,#EEE);transition:background .6s}.wn .mn i:nth-child(1){height:20px;width:55%;background:var(--wa,#6D4DFF)}.wn .mn i:nth-child(2){height:62px}.wn .mn i:nth-child(3){height:38px;width:80%}
.sw{position:absolute;right:12px;bottom:12px;width:50px;height:28px;border-radius:99px;background:var(--wa,#6D4DFF);transition:background .6s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}.dk .sw::after{transform:translateX(22px)}
.dk .wn{--wb:#161327;--wl:#2A2543;--wa:#B14DFF}
.cu{position:absolute;right:6px;bottom:-4px;width:26px;transition:transform .8s cubic-bezier(.5,0,.2,1);z-index:3;transform:translate(-30px,-110px)}.cu svg{width:26px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}.cu.at{transform:translate(0,0)}
@media(max-width:620px){.bn{grid-template-columns:1fr}.dm{height:170px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bn" id="bn"><button class="x" aria-label="Dismiss">×</button><div class="tx"><span class="tg"><i></i>NEW IN 4.2</span><h1>Dark mode,<br>finally here.</h1><p>Switch themes in one click, or let it follow your system schedule from sunset to sunrise.</p><div class="bt"><a href="#">Try it now</a><span>Takes 5 seconds</span></div></div>
<div class="dm" id="dm"><div class="wn"><div class="tb"><i></i><i></i><i></i></div><div class="sb"></div><div class="mn"><i></i><i></i><i></i></div><span class="sw"></span></div><div class="cu" id="cu"><svg viewBox="0 0 24 24"><path d="M4 3l16 8-7 2-3 7Z" fill="#fff" stroke="#1A1533" stroke-width="1.500" stroke-linejoin="round"/></svg></div></div></div>
<script>
const dm=document.getElementById('dm'),cu=document.getElementById('cu'),sl=ms=>new Promise(r=>setTimeout(r,ms));let off=false;
dm.classList.add('dk');document.getElementById('bn').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a tilted app window inside the banner flips between light and dark again and again; a cursor glides to the toggle, the knob springs across and the whole mock recolours (backgrounds, sidebar, accent), while a pulsing NEW tag and the big headline sell the release, until you click anywhere on it. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){cu.classList.add('at');await sl(1000);if(off)return;dm.classList.toggle('dk');await sl(700);cu.classList.remove('at');await sl(2300)}})()}
</script></body></html>
