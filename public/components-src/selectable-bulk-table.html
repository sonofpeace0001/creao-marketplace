<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Selectable Table with Bulk Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2F3F7;color:#14172B;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{position:relative;width:100%;max-width:780px;background:#fff;border-radius:22px;box-shadow:0 40px 70px -44px rgba(20,23,43,.5),0 0 0 1px rgba(20,23,43,.07);overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}.hd h1{font-size:18px;font-weight:700;letter-spacing:-.03em}.hd p{font-size:13px;color:#7B82A8;margin-top:2px}.hd button{border:0;background:#4F46E5;color:#fff;border-radius:11px;padding:9px 16px;font:600 13.5px 'Inter';cursor:pointer}.hd button:focus-visible{outline:3px solid #14172B;outline-offset:2px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;color:#7B82A8;padding:10px 16px;background:#FAFAFD;border-top:1px solid #EEF0F8;border-bottom:1px solid #EEF0F8;white-space:nowrap}th:first-child,td:first-child{width:52px;padding-left:22px}
td{padding:13px 16px;font-size:14px;border-bottom:1px solid #F2F3F9;transition:background .15s}tr:last-child td{border:0}tr.sel td{background:#F2F1FF}tbody tr:hover td{background:#F8F8FD}tr.sel:hover td{background:#EDEBFF}
.cb{position:relative;width:20px;height:20px;display:block}.cb input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:2}.cb i{position:absolute;inset:0;border-radius:6px;border:1.5px solid #C5CAE3;background:#fff;transition:all .2s cubic-bezier(.3,1.5,.5,1)}.cb i svg{position:absolute;inset:0;margin:auto;stroke:#fff;stroke-width:3.500;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s}
.cb input:checked+i,.cb input:indeterminate+i{background:#4F46E5;border-color:#4F46E5;transform:scale(1.08)}.cb input:checked+i svg{stroke-dashoffset:0}.cb input:indeterminate+i::after{content:"";position:absolute;left:4px;right:4px;top:8.500px;height:2px;border-radius:2px;background:#fff}.cb input:focus-visible+i{outline:2px solid #14172B;outline-offset:2px}
.us{display:flex;align-items:center;gap:11px}.us i{width:32px;height:32px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font:700 11px 'Inter';font-style:normal}.us b{display:block;font-weight:600}.us span{font-size:12.5px;color:#7B82A8}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}.tg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.a{background:#DCFCE7;color:#15803D}.i{background:#FEF3C7;color:#B45309}.o{background:#EEF0F8;color:#5B628C}
td.m{font:500 13px 'JetBrains Mono',monospace;color:#4A5078}
.bk{position:absolute;left:50%;bottom:16px;transform:translate(-50%,calc(100% + 24px));display:flex;align-items:center;gap:6px;background:#14172B;color:#fff;border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 24px 40px -12px rgba(20,23,43,.6);transition:transform .4s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}.bk.on{transform:translate(-50%,0)}
.bk span{font-size:14px;font-weight:600;margin-right:8px}.bk span b{font:600 14px 'JetBrains Mono',monospace;background:rgba(255,255,255,.14);border-radius:7px;padding:2px 8px;margin-right:4px}.bk button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:11px;padding:9px 13px;font:600 13.5px 'Inter';cursor:pointer;display:flex;align-items:center;gap:6px}.bk button:hover{background:rgba(255,255,255,.2)}.bk button.d:hover{background:#DC2626}.bk button:focus-visible{outline:2px solid #fff}.bk .x{padding:9px}
.ct{height:56px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Customers</h1><p id="cn"></p></div><button>Add customer</button></div>
<div class="sc"><table><thead><tr><th><label class="cb"><input type="checkbox" id="all" aria-label="Select all"><i><svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i></label></th><th>Customer</th><th>Status</th><th>Plan</th><th>MRR</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="ct"></div>
<div class="bk" id="bk" role="toolbar" aria-label="Bulk actions"><span><b id="bn">0</b>selected</span><button>Export</button><button>Archive</button><button class="d">Delete</button><button class="x" id="cl" aria-label="Clear selection"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
<script>
let D=[['Northwind Co.','hello@northwind.co','Active','Scale',4200,'#6366F1'],['Fjord Studio','team@fjord.studio','Active','Growth',1850,'#10B981'],['Helios Labs','ops@helioslabs.io','Inactive','Scale',0,'#F97316'],['Pinecone Ltd','ap@pinecone.ltd','Active','Starter',290,'#9333EA'],['Atlas Freight','it@atlasfreight.com','Active','Growth',1350,'#64748B'],['Marlow & Finch','accounts@marlowfinch.com','Inactive','Starter',0,'#DB2777']];
const S=new Set([1,3]),tb=document.getElementById('tb'),all=document.getElementById('all'),bk=document.getElementById('bk');
const cls={Active:'a',Inactive:'i'};
function draw(){tb.innerHTML=D.map((d,i)=>'<tr class="'+(S.has(i)?'sel':'')+'"><td><label class="cb"><input type="checkbox" data-i="'+i+'" '+(S.has(i)?'checked':'')+' aria-label="Select '+d[0]+'"><i><svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i></label></td><td><div class="us"><i style="--g:'+d[5]+'">'+d[0].slice(0,2).toUpperCase()+'</i><div><b>'+d[0]+'</b><span>'+d[1]+'</span></div></div></td><td><span class="tg '+cls[d[2]]+'">'+d[2]+'</span></td><td>'+d[3]+'</td><td class="m">'+(d[4]?'$'+d[4].toLocaleString():'—')+'</td></tr>').join('');
 tb.querySelectorAll('input').forEach(c=>c.onchange=()=>{const i=+c.dataset.i;c.checked?S.add(i):S.delete(i);draw()});all.checked=S.size===D.length&&D.length>0;all.indeterminate=S.size>0&&S.size<D.length;document.getElementById('bn').textContent=S.size;bk.classList.toggle('on',S.size>0);document.getElementById('cn').textContent=D.length+' customers'+(S.size?' · '+S.size+' selected':'')}
all.onchange=()=>{if(all.checked)D.forEach((_,i)=>S.add(i));else S.clear();draw()};document.getElementById('cl').onclick=()=>{S.clear();draw()};
bk.querySelector('.d').onclick=()=>{D=D.filter((_,i)=>!S.has(i));S.clear();draw()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){S.clear();draw()}});draw();
</script></body></html>
