<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Usage Meter Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0F14;color:#E6F1EE;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:720px;background:linear-gradient(160deg,#101A20,#0C1318);border:1px solid #1C2B33;border-radius:28px;padding:28px;box-shadow:0 40px 80px -40px #000}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hd h1{font-size:19px;font-weight:600;letter-spacing:-.03em}.hd span{font:500 12px 'Geist Mono',monospace;color:#6C8A93;letter-spacing:.06em}
.gd{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:center}
.gg{position:relative;width:260px;height:200px}.gg svg{width:100%;height:150px;overflow:visible;display:block}.gg .bg{fill:none;stroke:#1B2B33;stroke-width:16;stroke-linecap:round}.gg .vl{fill:none;stroke:url(#gr);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .4s cubic-bezier(.3,1.1,.5,1)}
.gg .nd{transform-origin:130px 130px;transition:transform .4s cubic-bezier(.3,1.2,.5,1)}.gg .ct{position:absolute;left:0;right:0;bottom:0;text-align:center}.gg .ct b{display:block;font:600 30px 'Sora';letter-spacing:-.04em}.gg .ct span{font:500 12px 'Geist Mono',monospace;color:#6C8A93}
.tr{display:grid;gap:10px}.tr .t{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13.5px;color:#9BB5BC}.tr .t b{font:500 13px 'Geist Mono',monospace;color:#E6F1EE}.tr .t .br{grid-column:1/3;height:7px;border-radius:7px;background:#1B2B33;overflow:hidden}.tr .t .br i{display:block;height:100%;width:0;border-radius:7px;background:var(--c);transition:width .35s cubic-bezier(.3,1.1,.5,1)}
.sl{margin:26px 0 8px}.sl label{display:flex;justify-content:space-between;font-size:13px;color:#9BB5BC;margin-bottom:12px}.sl label b{color:#fff;font-family:'Geist Mono',monospace;font-weight:500}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,#34D399 var(--p),#1B2B33 var(--p));outline:0;cursor:pointer}.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid #34D399;box-shadow:0 0 0 6px rgba(52,211,153,.18),0 6px 14px rgba(0,0,0,.5)}.sl input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid #34D399}.sl input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(255,255,255,.4)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:20px;background:#0E1A1F;border:1px solid #1C2B33;border-radius:18px;padding:16px 20px}.pr span{font-size:13.5px;color:#9BB5BC}.pr .am{font:600 32px 'Sora';letter-spacing:-.04em;display:flex;align-items:baseline;gap:4px}.pr .am small{font:500 13px 'Geist Mono',monospace;color:#6C8A93}.pr .bd{font:500 12px 'Geist Mono',monospace;color:#6C8A93;margin-top:2px}
@media(max-width:620px){.gd{grid-template-columns:1fr;justify-items:center}.tr{width:100%}}
</style></head><body>
<div class="c"><div class="hd"><h1>Usage and billing</h1><span>NOV 1 - NOV 30</span></div>
<div class="gd"><div class="gg"><svg viewBox="0 0 260 150"><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#34D399"/><stop offset=".6" stop-color="#FBBF24"/><stop offset="1" stop-color="#F43F5E"/></linearGradient></defs><path class="bg" d="M20 130A110 110 0 0 1 240 130"/><path class="vl" id="vl" d="M20 130A110 110 0 0 1 240 130" stroke-dasharray="346" stroke-dashoffset="346"/><g class="nd" id="nd"><path d="M130 130 L130 38" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="130" cy="130" r="9" fill="#fff"/></g></svg><div class="ct"><b id="ct"></b><span>API requests</span></div></div>
<div class="tr" id="tr"></div></div>
<div class="sl"><label for="sl">Projected monthly usage<b id="sv"></b></label><input type="range" id="sl" min="0" max="3000000" step="10000" value="1450000"></div>
<div class="pr"><div><span>Projected invoice</span><div class="bd" id="bd"></div></div><div class="am"><span id="am"></span><small>/ month</small></div></div></div>
<script>
const T=[['First 500k','included','Free',500000,0,'#34D399'],['500k to 1.5M','$0.40 per 1k',null,1000000,.0004,'#FBBF24'],['Above 1.5M','$0.25 per 1k',null,1500000,.00025,'#F43F5E']];
const sl=document.getElementById('sl'),tr=document.getElementById('tr');
T.forEach((t,i)=>{const d=document.createElement('div');d.className='t';d.innerHTML='<span>'+t[0]+' <span style="color:#5C7A83;font-size:12px">'+t[1]+'</span></span><b id="b'+i+'"></b><div class="br"><i id="i'+i+'" style="--c:'+t[5]+'"></i></div>';tr.appendChild(d)});
const f=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const k=n=>n>=1e6?(n/1e6).toFixed(2)+'M':Math.round(n/1e3)+'k';
function upd(){const u=+sl.value;sl.style.setProperty('--p',(u/3e6*100)+'%');let rem=u,tot=0,det=[];T.forEach((t,i)=>{const used=Math.min(rem,t[3]);rem-=used;const cost=used*t[4];tot+=cost;document.getElementById('i'+i).style.width=(used/t[3]*100)+'%';document.getElementById('b'+i).textContent=i===0?k(used):f(cost)});
 const last=u>1.5e6?(u-1.5e6)*.00025:0;tot=Math.min(u,5e5)*0+Math.max(0,Math.min(u,1.5e6)-5e5)*.0004+last;document.getElementById('b2').textContent=f(last);
 document.getElementById('am').textContent=f(tot);document.getElementById('sv').textContent=' '+k(u)+' requests';document.getElementById('ct').textContent=k(u);const p=Math.min(1,u/3e6);document.getElementById('vl').setAttribute('stroke-dashoffset',346*(1-p));document.getElementById('nd').style.transform='rotate('+(-90+p*180)+'deg)';document.getElementById('bd').textContent='Base $29 + usage '+f(tot);document.getElementById('am').textContent=f(tot+29)}
sl.addEventListener('input',upd);upd();
</script></body></html>
