<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Logo Flip Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F3FF;color:#1E1B3A;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:720px}
.hd{text-align:center;margin-bottom:26px}.hd small{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7C5CFA}.hd h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.04em;font-weight:800;margin-top:6px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.f{perspective:700px;aspect-ratio:3/2;cursor:pointer;border:0;background:none;padding:0}.f:focus-visible{outline:3px solid #7C5CFA;outline-offset:3px;border-radius:20px}
.in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}.f:hover .in,.f.fl .in,.f:focus-visible .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:14px;text-align:center}
.fr{background:#fff;border:1.5px solid #E7E2FB;box-shadow:0 14px 26px -18px rgba(76,50,180,.5)}.bk{transform:rotateY(180deg);background:var(--c);color:#fff}
.lg{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--c)}.lg i{width:26px;height:26px;border-radius:8px;background:var(--c);display:block;position:relative}.lg i::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2.5px solid #fff}
.bk b{font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1}.bk span{font-size:13px;font-weight:500;opacity:.9;line-height:1.3}
.ft{text-align:center;margin-top:20px;font-size:14px;color:#7A74A8}
@media(max-width:520px){.g{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.in{transition:none}}
</style></head><body>
<div class="c"><div class="hd"><small>Trusted by teams at</small><h1>Results our customers see</h1></div><div class="g" id="g"></div><p class="ft">Hover or focus a logo to flip it.</p></div>
<script>
const D=[['Northwind','#7C5CFA','3.2x','faster reporting'],['Lumen','#0EA5E9','-48%','support tickets'],['Fjord','#0E9F6E','$1.4M','saved yearly'],['Helios','#F97316','12 days','to launch'],['Pinecone','#DB2777','97%','team adoption'],['Atlas','#334155','4.9/5','average rating']];
document.getElementById('g').innerHTML=D.map(d=>'<button class="f" style="--c:'+d[1]+'" aria-label="'+d[0]+': '+d[2]+' '+d[3]+'"><div class="in"><div class="fc fr"><div class="lg"><i></i>'+d[0]+'</div></div><div class="fc bk"><b>'+d[2]+'</b><span>'+d[3]+'</span></div></div></button>').join('');
document.querySelectorAll('.f').forEach(f=>f.onclick=()=>f.classList.toggle('fl'));
</script></body></html>
