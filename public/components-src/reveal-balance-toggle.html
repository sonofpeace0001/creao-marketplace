<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reveal Balance Toggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EEF1F6;color:#0F1424;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:440px;border-radius:32px;padding:26px;background:linear-gradient(160deg,#10162E,#1A1F45 60%,#23205A);color:#EFF1FF;box-shadow:0 40px 60px -34px rgba(16,22,46,.9);position:relative;overflow:hidden}
.cd::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(129,140,248,.16)}
.hd{display:flex;justify-content:space-between;align-items:center;position:relative}.hd small{font:600 11.500px 'Geist Mono';letter-spacing:.14em;color:#9AA2D4;text-transform:uppercase}
.ey{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:background .3s,transform .15s}.ey:hover{background:rgba(255,255,255,.18)}.ey:active{transform:scale(.92)}.ey:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ey svg{width:24px;height:24px;overflow:visible}.ey svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ey .lid{transform-origin:12px 12px;transition:transform .45s cubic-bezier(.3,1.4,.4,1)}.ey .lid2{transform-origin:12px 12px;transition:transform .45s cubic-bezier(.3,1.4,.4,1)}
.ey .pu{fill:currentColor;stroke:none;transition:transform .45s,opacity .3s;transform-origin:12px 12px}
.ey .sl{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s .1s}
.hid .ey .sl{stroke-dashoffset:0}.hid .ey .pu{opacity:0;transform:scale(.3)}
.bl{position:relative;margin:26px 0 6px;height:64px;display:flex;align-items:center}
.am{display:flex;align-items:baseline;gap:4px;font:800 54px/1 'Sora';letter-spacing:-.06em;filter:blur(0);transition:filter .5s cubic-bezier(.4,0,.2,1),opacity .5s;font-variant-numeric:tabular-nums}
.am .cu{font-size:30px;color:#9AA2D4;font-weight:700}.am .de{font-size:30px;color:#C7CCF5}
.hid .am{filter:blur(14px);opacity:.75}
.mk{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;gap:10px;pointer-events:none;opacity:0;transition:opacity .4s}.hid .mk{opacity:1}.mk i{width:14px;height:14px;border-radius:50%;background:#C7CCF5}
.sub{display:flex;gap:8px;align-items:center;font:600 12.500px 'Geist Mono';color:#7DE3A8}.sub i{display:inline-flex;padding:3px 8px;border-radius:99px;background:rgba(74,222,128,.16);font-style:normal}
.tx{margin-top:24px;display:grid;gap:4px;position:relative}
.t{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.05)}
.t .ic{width:40px;height:40px;border-radius:12px;background:var(--c);display:grid;place-items:center}.t .ic svg{width:20px;height:20px}.t .ic svg *{fill:none;stroke:#fff;stroke-width:2.100;stroke-linecap:round;stroke-linejoin:round}
.t b{display:block;font-size:14.500px;font-weight:600}.t small{font:500 11.500px 'Geist Mono';color:#8A92C6}
.t .v{font:700 15px 'Geist Mono';text-align:right;transition:filter .5s;font-variant-numeric:tabular-nums}.t .v.pos{color:#7DE3A8}.hid .t .v,.hid .t .nm{filter:blur(7px)}.t .nm{transition:filter .5s}
.hint{margin-top:16px;text-align:center;font:500 12px 'Geist Mono';color:#7E86BA;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="cd" id="cd"><div class="hd"><small>Main account</small><button class="ey" id="ey" aria-pressed="false" aria-label="Hide balance"><svg viewBox="0 0 24 24"><path class="lid" d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12Z"/><circle class="pu" cx="12" cy="12" r="3.200"/><path class="sl" pathLength="1" d="M4 4l16 16"/></svg></button></div>
<div class="bl"><div class="am" id="am"><span class="cu">$</span><span id="ip">24,580</span><span class="de">.16</span></div><div class="mk" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="sub"><i>+$1,284.40</i> this month</div>
<div class="tx" id="tx"></div><div class="hint" id="ht">Balance visible</div></div>
<script>
const T=[['Blue Bottle Coffee','Today, 08:12','-$6.50','#8B5CF6','<path d="M5 9h12v6a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5ZM17 11h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3"/>',0],['Salary, Northwind','Yesterday','+$4,200.00','#16A34A','<path d="M12 3v18M17 7H9.500a2.500 2.500 0 0 0 0 5h5a2.500 2.500 0 0 1 0 5H7"/>',1],['Metro transit','Yesterday','-$28.00','#0EA5E9','<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4M9 14h.01M15 14h.01"/>',0]];
const tx=document.getElementById('tx'),cd=document.getElementById('cd'),ey=document.getElementById('ey'),ht=document.getElementById('ht');
T.forEach(([n,d,v,c,p,pos])=>{tx.insertAdjacentHTML('beforeend','<div class="t"><span class="ic" style="--c:'+c+'"><svg viewBox="0 0 24 24">'+p+'</svg></span><div><b class="nm">'+n+'</b><small>'+d+'</small></div><span class="v'+(pos?' pos':'')+'">'+v+'</span></div>')});
function set(h){cd.classList.toggle('hid',h);ey.setAttribute('aria-pressed',h);ey.setAttribute('aria-label',h?'Show balance':'Hide balance');ht.textContent=h?'Balance hidden':'Balance visible';const l=ey.querySelector('.lid');l.style.transform=h?'scaleY(.15)':'none'}
ey.onclick=()=>{off=true;set(!cd.classList.contains('hid'))};
/* Idle demo: the eye blinks shut with a slash drawing across it while the balance and transactions blur into dots, then it opens again, every 2.8s, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2600);while(!off){set(!cd.classList.contains('hid'));await sleep(2800)}})()}
</script></body></html>
