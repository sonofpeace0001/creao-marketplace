<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Margin Notes Signup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFF8EA;color:#231D12;font-family:'Instrument Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:36px 20px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(#E9DDBF 1.2px,transparent 1.2px);background-size:24px 24px}
.card{width:100%;max-width:560px;background:#FFE27A;border:2.5px solid #231D12;border-radius:28px;padding:42px 40px 36px;box-shadow:8px 8px 0 #231D12;text-align:center;position:relative}
.sticker{position:absolute;top:-22px;right:26px;background:#FF5E3A;color:#fff;font:800 12px 'Bricolage Grotesque';letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border:2.5px solid #231D12;border-radius:99px;transform:rotate(6deg)}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(34px,5.4vw,50px);line-height:.98;letter-spacing:-.045em}
h1 u{text-decoration:none;position:relative;white-space:nowrap}
h1 u svg{position:absolute;left:-2%;bottom:-8px;width:104%;height:14px}
p{margin:16px auto 24px;color:#5E5230;font-size:16.5px;line-height:1.5;max-width:400px}
form{display:flex;background:#fff;border:2.5px solid #231D12;border-radius:16px;padding:5px;transition:box-shadow .2s}
form:focus-within{box-shadow:4px 4px 0 #231D12}
input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 16px 'Instrument Sans';padding:0 14px;color:#231D12}
input::placeholder{color:#A39878}
button{border:0;background:#231D12;color:#FFE27A;font:700 15px 'Bricolage Grotesque';padding:14px 22px;border-radius:11px;cursor:pointer;transition:transform .15s}
button:hover{transform:scale(1.04)}
.proof{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;font-size:13.5px;color:#5E5230}
.av{display:flex}.av i{width:28px;height:28px;border-radius:50%;border:2px solid #FFE27A;margin-left:-9px;display:grid;place-items:center;font:700 10px 'Bricolage Grotesque';color:#231D12;font-style:normal}.av i:first-child{margin-left:0}
.err{color:#C0341A;font-weight:600;font-size:13.5px;margin-top:12px;height:18px}
.done{display:none;padding:14px 0 6px}.done b{font:800 26px 'Bricolage Grotesque';letter-spacing:-.03em;display:block;margin-bottom:6px}
.ok form,.ok .err,.ok .proof,.ok p{display:none}.ok .done{display:block}
@media(max-width:520px){.card{padding:34px 22px 30px}form{flex-direction:column;gap:6px;padding:8px}input{padding:12px 10px}}
</style></head><body>
<div class="card" id="c">
 <span class="sticker">Free · Fridays</span>
 <h1>Join 24,000 designers who read <u>Margin Notes<svg viewBox="0 0 200 14" preserveAspectRatio="none" fill="none"><path d="M2 9c30-8 60 4 96-2s70-2 100-4" stroke="#FF5E3A" stroke-width="4" stroke-linecap="round"/></svg></u></h1>
 <p>One tiny, opinionated email every Friday: a teardown, a tool, and one idea worth stealing.</p>
 <form id="f" novalidate><input id="e" type="email" placeholder="you@studio.com" aria-label="Email address"><button type="submit">Subscribe</button></form>
 <div class="err" id="er" role="alert"></div>
 <div class="proof"><div class="av"><i style="background:#FF8FA3">MJ</i><i style="background:#8FD3FF">TA</i><i style="background:#A7E8B0">KO</i><i style="background:#FFF">+</i></div>Read by teams at Figma, Stripe &amp; Linear</div>
 <div class="done"><b>You're in.</b>Your first issue lands this Friday.</div>
</div>
<script>
const f=document.getElementById('f'),c=document.getElementById('c'),er=document.getElementById('er'),em=document.getElementById('e');
f.addEventListener('submit',e=>{e.preventDefault();if(/^\S+@\S+\.\S+$/.test(em.value)){c.classList.add('ok')}else{er.textContent="Hmm, that email doesn't look right.";em.focus()}});
</script></body></html>
