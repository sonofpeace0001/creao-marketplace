<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reaction Popover</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F0F1F8;color:#161A35;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{position:relative;width:100%;max-width:520px;background:#fff;border-radius:26px;padding:24px;box-shadow:0 40px 70px -44px rgba(22,26,53,.5),0 0 0 1px rgba(22,26,53,.07)}
.au{display:flex;align-items:center;gap:12px;margin-bottom:14px}.au i{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:grid;place-items:center;color:#fff;font-weight:800;font-style:normal}.au b{display:block;font-size:15px;font-weight:700}.au span{font-size:13px;color:#7B82AB}
.c>p{font-size:16px;line-height:1.6;color:#2C3156;margin-bottom:20px}
.im{height:150px;border-radius:18px;background:linear-gradient(135deg,#FDBA74,#F43F5E 55%,#6D28D9);margin-bottom:16px;position:relative;overflow:hidden}.im::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.5),transparent 50%)}
.bar{display:flex;align-items:center;gap:10px;position:relative}
.rs{display:flex;gap:6px;flex-wrap:wrap}.rc{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #E3E6F4;background:#FAFAFF;border-radius:99px;padding:5px 11px 5px 7px;font:700 13.5px 'Plus Jakarta Sans';color:#4A5080;cursor:pointer;transition:all .2s cubic-bezier(.3,1.5,.5,1)}.rc svg{width:18px;height:18px}.rc:hover{transform:translateY(-2px)}.rc[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}.rc:focus-visible{outline:2px solid #5B5BF6;outline-offset:2px}
.add{width:36px;height:36px;border:1.5px dashed #C9CEEA;background:none;border-radius:50%;color:#7B82AB;cursor:pointer;display:grid;place-items:center;transition:all .2s}.add:hover,.add[aria-expanded=true]{border-style:solid;border-color:#5B5BF6;color:#5B5BF6;background:#F2F2FF}.add:focus-visible{outline:2px solid #5B5BF6;outline-offset:2px}
.pp{position:absolute;left:0;bottom:calc(100% + 10px);display:flex;gap:4px;background:#161A35;border-radius:99px;padding:8px 10px;box-shadow:0 24px 40px -12px rgba(22,26,53,.7);opacity:0;transform:translateY(8px) scale(.9);transform-origin:bottom left;pointer-events:none;transition:all .25s cubic-bezier(.3,1.4,.5,1)}.pp.op{opacity:1;transform:none;pointer-events:auto}
.pp button{position:relative;width:44px;height:44px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.7,.5,1);color:var(--c)}.pp button svg{width:28px;height:28px}.pp button:hover,.pp button:focus-visible{transform:translateY(-10px) scale(1.35);z-index:2}.pp button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pp button::after{content:attr(data-l);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) scale(.8);background:#fff;color:#161A35;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;opacity:0;transition:all .15s;white-space:nowrap;pointer-events:none}.pp button:hover::after,.pp button:focus-visible::after{opacity:1;transform:translateX(-50%) scale(.75)}
.fl{position:fixed;pointer-events:none;z-index:9;color:var(--c)}.fl svg{width:26px;height:26px;display:block}
.cm{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13.5px;color:#7B82AB;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="au"><i>MR</i><div><b>Maya Rowe</b><span>Posted 2h ago in Design</span></div></div><p>Finished the new onboarding flow today. Three steps, one screen each, and a lot fewer tears. Would love your thoughts before we ship on Friday.</p><div class="im"></div>
<div class="bar"><div class="rs" id="rs"></div><button class="add" id="ad" aria-haspopup="true" aria-expanded="true" aria-label="Add reaction"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.500 14a4 4 0 0 0 7 0M9 9.500h.01M15 9.500h.01M19 3v4M17 5h4"/></svg></button><span class="cm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>12</span>
<div class="pp op" id="pp" role="menu" aria-label="Choose a reaction"></div></div></div>
<script>
const R={like:['Like','#3B82F6','M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.200l-1.300 7A2 2 0 0 1 17.700 20H7'],love:['Love','#F43F5E','M12 21S3 15.500 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.500-9 12-9 12z'],wow:['Wow','#F59E0B','M12 3l2.600 5.600 6.100.8-4.500 4.200 1.200 6.100L12 16.700 6.600 19.700l1.200-6.100L3.300 9.400l6.100-.8z'],fire:['Fire','#F97316','M12 2s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 1-5 1-8z'],idea:['Idea','#EAB308','M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.500c.7.700 1 1.500 1 2.500h6c0-1 .3-1.800 1-2.500A6 6 0 0 0 12 3z']};
const cnt={like:8,love:5,fire:2},mine=new Set(['love']);const rs=document.getElementById('rs'),pp=document.getElementById('pp'),ad=document.getElementById('ad');
const svg=k=>'<svg viewBox="0 0 24 24" fill="'+(k==='x'?'none':'currentColor')+'" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"><path d="'+R[k][2]+'"/></svg>';
function draw(){rs.innerHTML=Object.keys(cnt).filter(k=>cnt[k]>0).map(k=>'<button class="rc" style="--c:'+R[k][1]+'" aria-pressed="'+mine.has(k)+'" data-k="'+k+'" aria-label="'+R[k][0]+', '+cnt[k]+'">'+svg(k)+cnt[k]+'</button>').join('');rs.querySelectorAll('.rc').forEach(b=>b.onclick=e=>toggle(b.dataset.k,b))}
pp.innerHTML=Object.keys(R).map(k=>'<button role="menuitem" style="--c:'+R[k][1]+'" data-l="'+R[k][0]+'" data-k="'+k+'" aria-label="'+R[k][0]+'">'+svg(k)+'</button>').join('');
function fly(k,from){const f=document.createElement('div');f.className='fl';f.style.setProperty('--c',R[k][1]);f.innerHTML=svg(k);document.body.appendChild(f);const r=from.getBoundingClientRect();f.style.left=r.left+r.width/2-13+'px';f.style.top=r.top+'px';f.animate([{transform:'translateY(0) scale(1)',opacity:1},{transform:'translateY(-70px) scale(1.8)',opacity:0}],{duration:700,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>f.remove()}
function toggle(k,el){if(mine.has(k)){mine.delete(k);cnt[k]--}else{mine.add(k);cnt[k]=(cnt[k]||0)+1;if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&el)fly(k,el)}draw()}
pp.querySelectorAll('button').forEach(b=>b.onclick=()=>{toggle(b.dataset.k,b);open(false)});
function open(o){pp.classList.toggle('op',o);ad.setAttribute('aria-expanded',o)}ad.onclick=()=>open(!pp.classList.contains('op'));document.addEventListener('keydown',e=>{if(e.key==='Escape')open(false)});document.addEventListener('pointerdown',e=>{if(!pp.contains(e.target)&&!ad.contains(e.target))open(false)});draw();
</script></body></html>
