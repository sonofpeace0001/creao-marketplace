<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings Toggle List</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9ECF4;color:#11152B;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:500px;display:grid;gap:16px}
.hd h1{font-size:28px;font-weight:800;letter-spacing:-.05em}.hd p{color:#6C7396;font-size:14px;margin-top:6px}
.cd{border-radius:28px;background:#fff;padding:6px 20px;box-shadow:0 26px 36px -28px rgba(17,21,43,.5),inset 0 0 0 1px rgba(17,21,43,.06)}
.r{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid #EFF1F8}.r:last-child{border:0}
.ic{position:relative;width:46px;height:46px;border-radius:14px;background:#E9ECF4;display:grid;place-items:center;flex:none;overflow:hidden;transition:background .4s}
.r.on .ic{background:var(--c)}
.ic svg{width:26px;height:26px;overflow:visible}.ic svg *{fill:none;stroke:#8A90B0;stroke-width:2.100;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}.r.on .ic svg *{stroke:#fff}
.t{flex:1}.t b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}.t span{font:500 12px 'Geist Mono';color:#8A90B0}
.sw{--c:#34C759;position:relative;width:54px;height:32px;border:0;background:none;cursor:pointer;flex:none;padding:0}.sw:focus-visible{outline:3px solid #11152B;outline-offset:4px;border-radius:20px}
.sw .tr{position:absolute;inset:0;border-radius:99px;background:#D9DCE9;transition:background .3s}.r.on .sw .tr{background:#34C759}
.sw .th{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.3,1.8,.45,.9)}.r.on .sw .th{transform:translateX(22px)}
/* per-icon motion */
.r.on .wf path:nth-child(1){animation:wv .5s .0s both}.r.on .wf path:nth-child(2){animation:wv .5s .1s both}.r.on .wf path:nth-child(3){animation:wv .5s .2s both}.r.on .wf path:nth-child(4){animation:wv .5s .3s both}@keyframes wv{from{opacity:0;transform:translateY(4px)}}
.r.on .pl{animation:fly .9s cubic-bezier(.4,0,.2,1)}@keyframes fly{0%{transform:translate(0,0)}45%{transform:translate(26px,-18px);opacity:0}46%{transform:translate(-26px,18px);opacity:0}100%{transform:translate(0,0);opacity:1}}
.r.on .sun .rays{animation:spin 6s linear infinite;transform-origin:12px 12px}@keyframes spin{to{transform:rotate(360deg)}}
.r.on .bl{animation:ring .9s ease;transform-origin:12px 4px}@keyframes ring{15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}}
.r.on .pn{animation:drop .6s cubic-bezier(.3,1.8,.5,1)}@keyframes drop{from{transform:translateY(-12px);opacity:0}}
.r.on .bt{animation:bt .7s ease}@keyframes bt{50%{transform:scale(1.2)}}
.sl{display:none}.sl.x{display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Settings that answer back</h1><p>Every switch also animates its own icon, so the change is felt twice.</p></div><div class="cd" id="cd"></div></div>
<script>
const R=[['Wi-Fi','Studio-5G','#0A84FF','<g class="wf"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.500a10 10 0 0 1 14 0"/><path d="M8.500 16a5 5 0 0 1 7 0"/><path d="M12 19.500h.01"/></g>',1],['Airplane mode','Radios off','#FF9F0A','<path class="pl" d="M21 15v-1.500L13 9V4a1 1 0 0 0-2 0v5l-8 4.500V15l8-2.200V18l-2 1.500V21l3-1 3 1v-1.500L13 18v-5.200Z"/>',0],['Bluetooth','2 devices','#5E5CE6','<path class="bt" d="m7 7 10 10-5 4V3l5 4L7 17"/>',1],['Brightness','Auto, 72%','#FFCC00','<g class="sun"><circle cx="12" cy="12" r="4"/><g class="rays"><path d="M12 2v2.500M12 19.500V22M2 12h2.500M19.500 12H22M4.900 4.900l1.800 1.800M17.300 17.300l1.800 1.800M19.100 4.900l-1.800 1.800M6.700 17.300l-1.800 1.800"/></g></g>',1],['Notifications','Banners and sounds','#FF3B30','<g class="bl"><path d="M6 9.500a6 6 0 0 1 12 0c0 5.500 2 7 2 7H4s2-1.500 2-7Z"/></g><path d="M10 20a2 2 0 0 0 4 0"/>',0],['Location','While using the app','#34C759','<g class="pn"><path d="M12 21s-6.500-5.800-6.500-11a6.500 6.500 0 0 1 13 0c0 5.200-6.500 11-6.500 11Z"/><circle cx="12" cy="10" r="2.400"/></g>',1]];
const cd=document.getElementById('cd'),rows=[];
R.forEach(([n,d,c,p,on])=>{const r=document.createElement('div');r.className='r'+(on?' on':'');r.style.setProperty('--c',c);r.innerHTML='<span class="ic"><svg viewBox="0 0 24 24">'+p+'</svg></span><div class="t"><b>'+n+'</b><span>'+d+'</span></div><button class="sw" role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="'+n+'"><span class="tr"></span><span class="th"></span></button>';cd.appendChild(r);const b=r.querySelector('.sw');b.onclick=()=>{off=true;t(r)};rows.push(r)});
function t(r){const on=!r.classList.contains('on');r.classList.remove('on');void r.offsetWidth;r.classList.toggle('on',on);r.querySelector('.sw').setAttribute('aria-checked',on)}
/* Idle demo: the settings flip in turn; as each switch slides, its own icon performs a matching motion (Wi-Fi arcs rise one by one, the plane flies off and back, rays spin, the bell rings, the pin drops), until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2600);let k=0;while(!off){t(rows[k++%6]);await sleep(1600)}})()}
</script></body></html>
