<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Drag Widget Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8EAF2;color:#14172E;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;user-select:none}
.c{width:100%;max-width:880px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 4px}.hd h1{font-size:22px;font-weight:800;letter-spacing:-.04em}.hd span{display:flex;align-items:center;gap:8px;font-size:13px;color:#7A7FA0}.hd span i{font:600 11px 'JetBrains Mono',monospace;font-style:normal;background:#fff;border-radius:6px;padding:2px 7px;border:1px solid #D9DCEE}
.gd{position:relative;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:170px;gap:14px}
.wg{position:relative;background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 1px 2px rgba(20,23,46,.06),0 0 0 1px rgba(20,23,46,.05);overflow:hidden;transition:box-shadow .2s}
.wg.w2{grid-column:span 2}
.wg .hn{position:absolute;right:14px;top:12px;width:30px;height:30px;border-radius:9px;border:0;background:#F2F3FA;color:#8A8FB0;cursor:grab;display:grid;place-items:center;opacity:0;transition:opacity .2s;touch-action:none}.wg:hover .hn,.wg .hn:focus-visible{opacity:1}.wg .hn:active{cursor:grabbing}.wg .hn:focus-visible{outline:2px solid #6366F1}
.wg.ph{opacity:.35;box-shadow:inset 0 0 0 2px #6366F1;background:#EEF0FF}.wg.ph>*{visibility:hidden}
.fl{position:fixed;z-index:50;pointer-events:none;background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 36px 50px -16px rgba(20,23,46,.5),0 0 0 2px #6366F1;transform:rotate(1.5deg) scale(1.02);overflow:hidden}
.wg small{font-size:12.5px;font-weight:600;color:#7A7FA0}.wg .v{font:800 34px/1 'Manrope';letter-spacing:-.05em;margin:6px 0}.wg .dl{font:600 12.5px 'JetBrains Mono',monospace;color:#16A34A}.wg .dl.dn{color:#DC2626}
.wg svg.sp{position:absolute;left:0;right:0;bottom:0;width:100%;height:70px}.wg svg.sp .a{fill:var(--c);opacity:.14}.wg svg.sp .l{fill:none;stroke:var(--c);stroke-width:2.500;stroke-linejoin:round;stroke-linecap:round}
.wg .bs{position:absolute;left:20px;right:20px;bottom:18px;display:flex;align-items:flex-end;gap:7px;height:76px}.wg .bs i{flex:1;border-radius:6px 6px 3px 3px;background:var(--c);opacity:.85;height:var(--h)}
.wg .rg{position:absolute;right:20px;bottom:16px;width:96px;height:96px}.wg .rg svg{transform:rotate(-90deg);width:100%;height:100%}.wg .rg circle{fill:none;stroke-width:10;stroke-linecap:round}.wg .rg .t{stroke:#EEF0F8}.wg .rg .p{stroke:var(--c);stroke-dasharray:251;stroke-dashoffset:calc(251 - 251*var(--p))}.wg .rg b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px 'Manrope';letter-spacing:-.04em}
.wg .ls{margin-top:8px;display:grid;gap:7px}.wg .ls div{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}.wg .ls i{width:8px;height:8px;border-radius:50%;background:var(--c)}.wg .ls span{margin-left:auto;font:500 12.5px 'JetBrains Mono',monospace;color:#7A7FA0}
@media(max-width:620px){.gd{grid-template-columns:1fr}.wg.w2{grid-column:auto}}
</style></head><body>
<div class="c"><div class="hd"><h1>My dashboard</h1><span>Drag the handle <i>::</i> to rearrange</span></div><div class="gd" id="gd"></div></div>
<script>
const SP=(pts,c)=>{const w=300,h=70,mx=Math.max(...pts),mn=Math.min(...pts);const P=pts.map((v,i)=>[i/(pts.length-1)*w,h-8-((v-mn)/(mx-mn||1))*(h-22)]);const d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return '<svg class="sp" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="--c:'+c+'"><path class="a" d="'+d+' L'+w+' '+h+' L0 '+h+'Z"/><path class="l" d="'+d+'" vector-effect="non-scaling-stroke"/></svg>'};
const W=[{id:'rev',w:'',c:'#6366F1',h:'<small>Revenue</small><div class="v">$48.2k</div><div class="dl">+12.4%</div>'+SP([22,30,26,38,34,46,42,58],'#6366F1')},{id:'usr',w:'',c:'#10B981',h:'<small>Active users</small><div class="v">2,931</div><div class="dl">+6.1%</div>'+SP([30,28,36,32,40,38,48,52],'#10B981')},{id:'goal',w:'',c:'#F59E0B',h:'<small>Quarterly goal</small><div class="v">72%</div><div class="dl">On track</div><div class="rg" style="--c:#F59E0B;--p:.72"><svg viewBox="0 0 96 96"><circle class="t" cx="48" cy="48" r="40"/><circle class="p" cx="48" cy="48" r="40"/></svg><b>72</b></div>'},{id:'ord',w:'',c:'#EC4899',h:'<small>Orders by day</small><div class="v">1,284</div><div class="dl dn">-2.3%</div><div class="bs" style="--c:#EC4899">'+[40,62,48,78,56,90,66].map(h=>'<i style="--h:'+h+'%"></i>').join('')+'</div>'},{id:'src',w:'w2',c:'#0EA5E9',h:'<small>Traffic sources</small><div class="ls" style="--c:#0EA5E9"><div><i style="background:#6366F1"></i>Organic search<span>48%</span></div><div><i style="background:#10B981"></i>Direct<span>27%</span></div><div><i style="background:#F59E0B"></i>Referral<span>16%</span></div><div><i style="background:#EC4899"></i>Social<span>9%</span></div></div>'}];
const gd=document.getElementById('gd');const HN='<button class="hn" aria-label="Drag to reorder"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.800"/><circle cx="15" cy="6" r="1.800"/><circle cx="9" cy="12" r="1.800"/><circle cx="15" cy="12" r="1.800"/><circle cx="9" cy="18" r="1.800"/><circle cx="15" cy="18" r="1.800"/></svg></button>';
W.forEach(w=>{const e=document.createElement('div');e.className='wg '+w.w;e.dataset.id=w.id;e.innerHTML=HN+w.h;gd.appendChild(e)});
function flip(fn){const pos=new Map();[...gd.children].forEach(e=>pos.set(e,e.getBoundingClientRect()));fn();[...gd.children].forEach(e=>{const o=pos.get(e),n=e.getBoundingClientRect();if(!o||e.classList.contains('ph')&&0)return;const dx=o.left-n.left,dy=o.top-n.top;if(!dx&&!dy)return;e.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:420,easing:'cubic-bezier(.3,1.2,.5,1)'})})}
let dr=null;
gd.addEventListener('pointerdown',e=>{const hn=e.target.closest('.hn');if(!hn)return;const w=hn.closest('.wg'),r=w.getBoundingClientRect();const fl=w.cloneNode(true);fl.className='fl';fl.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';document.body.appendChild(fl);w.classList.add('ph');dr={w,fl,ox:e.clientX-r.left,oy:e.clientY-r.top,l:r.left,t:r.top};e.preventDefault()});
addEventListener('pointermove',e=>{if(!dr)return;dr.fl.style.transform='translate('+(e.clientX-dr.ox-dr.l)+'px,'+(e.clientY-dr.oy-dr.t)+'px) rotate(1.5deg) scale(1.02)';const t=[...gd.children].find(c=>c!==dr.w&&(r=>e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)(c.getBoundingClientRect()));if(t){const kids=[...gd.children],a=kids.indexOf(dr.w),b=kids.indexOf(t);flip(()=>{if(a<b)gd.insertBefore(dr.w,t.nextSibling);else gd.insertBefore(dr.w,t)})}});
function end(){if(!dr)return;dr.w.classList.remove('ph');dr.fl.remove();dr=null}addEventListener('pointerup',end);addEventListener('pointercancel',end);
gd.addEventListener('keydown',e=>{const hn=e.target.closest('.hn');if(!hn)return;const w=hn.closest('.wg'),k=[...gd.children],i=k.indexOf(w);if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(k[i+1]){e.preventDefault();flip(()=>gd.insertBefore(w,k[i+1].nextSibling));hn.focus()}}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(k[i-1]){e.preventDefault();flip(()=>gd.insertBefore(w,k[i-1]));hn.focus()}}});
</script></body></html>
