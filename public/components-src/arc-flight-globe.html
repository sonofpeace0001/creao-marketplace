<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arc Flight Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 500px at 70% 50%,#13235A,transparent 70%),#050813;color:#EAF0FF;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{width:100%;max-width:960px;display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:center}
.tx small{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#7DD3FC}.tx h1{font-size:clamp(30px,4.6vw,52px);line-height:1.02;font-weight:800;letter-spacing:-.055em;margin:12px 0 14px}.tx h1 span{background:linear-gradient(90deg,#38BDF8,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}.tx p{font-size:16px;line-height:1.6;color:#8D9BC4;max-width:36ch}
.st{display:flex;gap:26px;margin-top:26px}.st b{display:block;font:700 28px 'Sora';letter-spacing:-.04em}.st span{font:500 12px 'JetBrains Mono',monospace;color:#6577A6}
.gl{position:relative;aspect-ratio:1;max-width:520px;width:100%;justify-self:center;cursor:grab;touch-action:none}.gl:active{cursor:grabbing}.gl canvas{width:100%;height:100%;display:block}
.gl::before{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:0 0 120px 10px rgba(56,130,246,.25),inset 0 0 80px rgba(80,120,255,.18);pointer-events:none}
.lv{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font:500 11.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#5B6C9A;text-transform:uppercase}
@media(max-width:760px){.c{grid-template-columns:1fr;text-align:center}.tx p{margin-inline:auto}.st{justify-content:center}}
</style></head><body>
<div class="c"><div class="tx"><small>Global network</small><h1>Every request travels <span>the short way</span></h1><p>Traffic arcs between 14 regions over our private backbone. Drag the globe to look around.</p><div class="st"><div><b>14</b><span>REGIONS</span></div><div><b>38ms</b><span>MEDIAN LATENCY</span></div></div></div>
<div class="gl" id="gl"><canvas id="cv"></canvas><div class="lv">Drag to rotate</div></div></div>
<script>
const POLY=[[[-168,66],[-140,70],[-95,72],[-80,63],[-62,58],[-55,48],[-67,44],[-76,35],[-81,25],[-97,26],[-105,22],[-117,32],[-125,42],[-130,55],[-150,60]],[[-80,10],[-60,10],[-50,0],[-35,-6],[-40,-22],[-55,-35],[-65,-55],[-72,-50],[-72,-20],[-80,-5]],[[-10,36],[-9,44],[-2,48],[5,52],[10,56],[20,60],[30,70],[40,66],[40,50],[28,41],[20,38],[10,40],[0,38]],[[-17,15],[-10,30],[10,36],[32,31],[43,12],[51,11],[40,-12],[35,-25],[20,-35],[12,-18],[9,0],[-8,5]],[[40,66],[70,73],[110,77],[150,68],[170,64],[140,50],[125,38],[122,28],[108,20],[100,8],[80,8],[72,20],[58,24],[48,30],[36,36],[28,41],[40,50]],[[114,-22],[130,-12],[142,-11],[153,-26],[148,-38],[135,-35],[115,-34]]];
function inside(lon,lat){for(const p of POLY){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)c=!c}if(c)return true}return false}
const D=[],N=5200;for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=Math.PI*(1+Math.sqrt(5))*i,lat=Math.asin(y)*180/Math.PI,lon=((th*180/Math.PI+540)%360)-180;if(inside(lon,lat))D.push([lon*Math.PI/180,lat*Math.PI/180])}
const C={sf:[-122,37.7],ny:[-74,40.7],sp:[-46.6,-23.5],ln:[-0.1,51.5],lg:[3.4,6.5],ca:[31.2,30],mb:[72.8,19],sg:[103.8,1.3],tk:[139.7,35.7],sy:[151.2,-33.9],jb:[28,-26]};
const A=[['sf','tk'],['ny','ln'],['ln','mb'],['sg','sy'],['lg','ln'],['sp','ny'],['jb','sg'],['ca','mb'],['sf','ny'],['tk','sg'],['ln','ca'],['sp','lg']];
const cv=document.getElementById('cv'),x=cv.getContext('2d');let S=600,dpr=Math.min(2,devicePixelRatio||1),yaw=-.5,pitch=.42,vy=.003,drag=false,lx=0,ly=0,t=0;
function size(){const r=cv.getBoundingClientRect();S=r.width;cv.width=S*dpr;cv.height=S*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
function proj(lon,lat,r){const cl=Math.cos(lat);let X=cl*Math.sin(lon),Y=Math.sin(lat),Z=cl*Math.cos(lon);const cy=Math.cos(yaw),sy=Math.sin(yaw);let X1=X*cy+Z*sy,Z1=-X*sy+Z*cy;const cp=Math.cos(pitch),sp=Math.sin(pitch);let Y2=Y*cp-Z1*sp,Z2=Y*sp+Z1*cp;return[X1*r,Y2*r,Z2]}
function vec(lon,lat){const cl=Math.cos(lat);return[cl*Math.sin(lon),Math.sin(lat),cl*Math.cos(lon)]}
function pt3(v,r){const cy=Math.cos(yaw),sy=Math.sin(yaw);let X1=v[0]*cy+v[2]*sy,Z1=-v[0]*sy+v[2]*cy;const cp=Math.cos(pitch),sp=Math.sin(pitch);return[X1*r,(v[1]*cp-Z1*sp)*r,v[1]*sp+Z1*cp]}
function frame(){t+=.016;if(!drag)yaw+=vy;x.clearRect(0,0,S,S);const R=S*.4,cx=S/2,cy=S/2;
 const g=x.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R*1.05);g.addColorStop(0,'#1B2F78');g.addColorStop(1,'#0A1236');x.fillStyle=g;x.beginPath();x.arc(cx,cy,R,0,6.283);x.fill();
 x.strokeStyle='rgba(120,160,255,.12)';x.lineWidth=1;for(let la=-60;la<=60;la+=30){x.beginPath();let on=false;for(let lo=-180;lo<=180;lo+=6){const p=proj(lo*Math.PI/180,la*Math.PI/180,R);if(p[2]>0){on?x.lineTo(cx+p[0],cy-p[1]):x.moveTo(cx+p[0],cy-p[1]);on=true}else on=false}x.stroke()}
 for(let lo=-180;lo<180;lo+=30){x.beginPath();let on=false;for(let la=-90;la<=90;la+=6){const p=proj(lo*Math.PI/180,la*Math.PI/180,R);if(p[2]>0){on?x.lineTo(cx+p[0],cy-p[1]):x.moveTo(cx+p[0],cy-p[1]);on=true}else on=false}x.stroke()}
 for(const d of D){const p=proj(d[0],d[1],R);if(p[2]>0){const a=.25+p[2]*.65;x.fillStyle='rgba('+(110+p[2]*80|0)+','+(170+p[2]*60|0)+',255,'+a+')';x.fillRect(cx+p[0]-1,cy-p[1]-1,2.2,2.2)}}
 A.forEach((ar,i)=>{const a=vec(C[ar[0]][0]*Math.PI/180,C[ar[0]][1]*Math.PI/180),b=vec(C[ar[1]][0]*Math.PI/180,C[ar[1]][1]*Math.PI/180);const dot=Math.max(-1,Math.min(1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])),om=Math.acos(dot),so=Math.sin(om)||1;const pts=[];for(let k=0;k<=40;k++){const f=k/40,s1=Math.sin((1-f)*om)/so,s2=Math.sin(f*om)/so;const v=[a[0]*s1+b[0]*s2,a[1]*s1+b[1]*s2,a[2]*s1+b[2]*s2];const h=1+Math.sin(f*Math.PI)*om*.28;pts.push(pt3(v,R*h))}
  x.lineWidth=1.6;let prev=null;pts.forEach((p,k)=>{if(prev&&p[2]>-.05&&prev[2]>-.05){x.strokeStyle='rgba(125,211,252,'+(0.15+0.35*Math.sin(k/40*Math.PI))+')';x.beginPath();x.moveTo(cx+prev[0],cy-prev[1]);x.lineTo(cx+p[0],cy-p[1]);x.stroke()}prev=p});
  const ph=((t*.35+i*.17)%1),k=Math.floor(ph*40),hd=pts[k];if(hd&&hd[2]>0){for(let q=0;q<9;q++){const pk=pts[Math.max(0,k-q)];if(pk[2]<0)continue;x.fillStyle='rgba(180,230,255,'+(1-q/9)*.9+')';x.beginPath();x.arc(cx+pk[0],cy-pk[1],2.6*(1-q/12),0,6.283);x.fill()}}});
 Object.values(C).forEach((c,i)=>{const p=proj(c[0]*Math.PI/180,c[1]*Math.PI/180,R);if(p[2]>0){const pu=(t*1.2+i*.5)%2;x.fillStyle='#38BDF8';x.beginPath();x.arc(cx+p[0],cy-p[1],3.2,0,6.283);x.fill();x.strokeStyle='rgba(56,189,248,'+Math.max(0,1-pu/2)+')';x.lineWidth=1.4;x.beginPath();x.arc(cx+p[0],cy-p[1],3+pu*7,0,6.283);x.stroke()}});
 x.strokeStyle='rgba(120,170,255,.35)';x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,R,0,6.283);x.stroke();
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(frame)}
const gl=document.getElementById('gl');gl.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;gl.setPointerCapture(e.pointerId)});gl.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*.008;pitch=Math.max(-.9,Math.min(.9,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});gl.addEventListener('pointerup',()=>drag=false);gl.addEventListener('pointercancel',()=>drag=false);
t=2.4;frame();
</script></body></html>
