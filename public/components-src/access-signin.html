<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#EEF2FF,#FDF2F8);color:#161A34;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:410px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-radius:30px;padding:34px 30px 28px;box-shadow:0 40px 70px -40px rgba(60,40,140,.5),0 0 0 1px rgba(255,255,255,.9)}
.lg{display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#6366F1,#EC4899);color:#fff;margin:0 auto 18px;box-shadow:0 14px 24px -10px rgba(99,102,241,.7)}
h1{font-size:24px;font-weight:700;letter-spacing:-.04em;text-align:center}.sub{text-align:center;font-size:14px;color:#6E7499;margin:6px 0 22px}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sc button{display:flex;align-items:center;justify-content:center;gap:9px;border:1.5px solid #E1E4F2;background:#fff;border-radius:14px;padding:12px;font:600 14px 'Sora';color:#161A34;cursor:pointer;transition:all .2s}
.sc button:hover{border-color:#6366F1;transform:translateY(-1px)}.sc button:focus-visible{outline:2px solid #6366F1;outline-offset:2px}
.dv{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:12.5px;color:#9AA0C0;font-weight:500}.dv::before,.dv::after{content:"";flex:1;height:1px;background:#E6E8F4}
.f{margin-bottom:14px}.f label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:7px}.f label a{font-weight:600;color:#6366F1;text-decoration:none}
.in{position:relative}.in input{width:100%;border:1.5px solid #DDE0F0;border-radius:14px;padding:13px 44px 13px 15px;font:500 15px 'Sora';color:#161A34;outline:0;background:#fff;transition:all .2s}
.in input:focus{border-color:#6366F1;box-shadow:0 0 0 4px rgba(99,102,241,.14)}.f.bad input{border-color:#E5484D;box-shadow:0 0 0 4px rgba(229,72,77,.1)}
.in button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:10px;background:none;color:#8A90B2;cursor:pointer;display:grid;place-items:center}.in button:hover{background:#F1F2FA;color:#161A34}.in button:focus-visible{outline:2px solid #6366F1}
.er{display:none;font-size:12.5px;color:#D13A3F;margin-top:6px}.f.bad .er{display:block}
.rm{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#4A5078;margin:4px 0 20px;cursor:pointer;user-select:none}.rm input{width:18px;height:18px;accent-color:#6366F1;cursor:pointer}
.go{width:100%;border:0;border-radius:15px;padding:15px;font:700 15px 'Sora';background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;cursor:pointer;box-shadow:0 16px 28px -14px rgba(99,102,241,.8);transition:transform .15s}.go:hover{transform:translateY(-1px)}.go:focus-visible{outline:3px solid #161A34;outline-offset:3px}
.ft{text-align:center;font-size:13.5px;color:#6E7499;margin-top:20px}.ft a{color:#6366F1;font-weight:600;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<form class="c" id="fm" novalidate><div class="lg"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.500"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
 <h1>Welcome back</h1><p class="sub">Sign in to pick up where you left off.</p>
 <div class="sc"><button type="button"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.200v3.900h5.500c-.2 1.300-1.600 3.800-5.500 3.800a6 6 0 1 1 0-12c1.900 0 3.100.8 3.800 1.500l2.600-2.500C16.800 3.400 14.600 2.400 12 2.400a9.600 9.600 0 1 0 0 19.200c5.500 0 9.200-3.900 9.200-9.300 0-.6-.1-1.100-.2-1.600Z"/></svg>Google</button><button type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.050 12.540c0-2.300 1.900-3.400 2-3.500-1.100-1.600-2.800-1.800-3.400-1.800-1.400-.1-2.800.9-3.500.9s-1.800-.9-3-.8a4.500 4.500 0 0 0-3.800 2.300c-1.600 2.800-.4 7 1.200 9.300.8 1.100 1.700 2.400 2.900 2.300 1.200 0 1.600-.7 3-.7s1.800.7 3 .7 2-1.100 2.800-2.200a10 10 0 0 0 1.300-2.600c0 0-2.500-1-2.500-3.900ZM14.800 5.600a4 4 0 0 0 .9-3 4.100 4.100 0 0 0-2.700 1.400 3.800 3.800 0 0 0-.9 2.900 3.400 3.400 0 0 0 2.700-1.300Z"/></svg>Apple</button></div>
 <div class="dv">or continue with email</div>
 <div class="f" id="fe"><label for="e">Email</label><div class="in"><input id="e" type="email" placeholder="you@company.com" autocomplete="off"></div><div class="er">Enter a valid email address.</div></div>
 <div class="f" id="fp"><label for="p">Password <a href="#">Forgot?</a></label><div class="in"><input id="p" type="password" placeholder="••••••••" autocomplete="off"><button type="button" id="sh" aria-label="Show password"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="er">Password must be at least 8 characters.</div></div>
 <label class="rm"><input type="checkbox" checked>Keep me signed in for 30 days</label>
 <button class="go" id="go">Sign in</button><div class="ft">New to Prism? <a href="#">Create an account</a></div></form>
<script>
const $=id=>document.getElementById(id);
$('sh').onclick=()=>{const t=$('p').type==='password';$('p').type=t?'text':'password';$('sh').setAttribute('aria-label',t?'Hide password':'Show password');$('sh').style.color=t?'#6366F1':''};
['e','p'].forEach(id=>$(id).addEventListener('input',()=>$(id).closest('.f').classList.remove('bad')));
$('fm').addEventListener('submit',x=>{x.preventDefault();const a=/^\S+@\S+\.\S+$/.test($('e').value),b=$('p').value.length>=8;$('fe').classList.toggle('bad',!a);$('fp').classList.toggle('bad',!b);if(a&&b){$('go').textContent='Signing in…';setTimeout(()=>$('go').textContent='Signed in ✓',900)}});
</script></body></html>
