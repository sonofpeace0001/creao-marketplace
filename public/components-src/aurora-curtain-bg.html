<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aurora Curtain Background</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{position:relative;min-height:100vh;background:linear-gradient(180deg,#02040E 0%,#06142A 55%,#0B2A3A 100%);color:#EAF6F4;font-family:'Jost',sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden;-webkit-font-smoothing:antialiased}
.st{position:absolute;inset:0}.st i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.au{position:absolute;left:-10%;right:-10%;top:-10%;height:80%;filter:blur(36px);mix-blend-mode:screen;opacity:.9}
.au span{position:absolute;top:0;bottom:0;width:22%;transform-origin:50% 0;background:linear-gradient(180deg,transparent 0,var(--c) 38%,transparent 92%);animation:sw var(--d) ease-in-out infinite alternate;animation-delay:var(--l)}
@keyframes sw{0%{transform:translateX(0) skewX(-12deg) scaleY(.8);opacity:.5}50%{opacity:1}100%{transform:translateX(9vw) skewX(10deg) scaleY(1.15);opacity:.65}}
.mt{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none}.mt svg{width:100%;height:100%;display:block}
.ct{position:relative;z-index:2;text-align:center;max-width:720px;margin-bottom:6vh}
.ct small{font-size:12.5px;font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:#7FE9D2}
.ct h1{font:500 clamp(48px,9vw,100px)/.95 'Cormorant Garamond',serif;letter-spacing:-.02em;margin:18px 0 20px}.ct h1 em{font-style:italic;color:#9CF6E1}
.ct p{font-size:clamp(15px,2vw,18px);line-height:1.65;color:#A8C7C9;max-width:44ch;margin:0 auto 30px;font-weight:400}
.bt{display:inline-flex;gap:12px}.bt a{padding:14px 28px;border-radius:99px;font:500 15px 'Jost';letter-spacing:.04em;text-decoration:none}.bt .p{background:linear-gradient(135deg,#34D399,#22D3EE);color:#02221E;box-shadow:0 0 40px -6px #34D399}.bt .g{border:1px solid rgba(160,230,220,.4);color:#CFF7EE;background:rgba(6,20,42,.4);backdrop-filter:blur(6px)}.bt a:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.au span,.st i{animation:none}}
</style></head><body>
<div class="st" id="st"></div>
<div class="au"><span style="left:2%;--c:#22D3EE;--d:9s;--l:-3s"></span><span style="left:16%;--c:#34D399;--d:11s;--l:-6s"></span><span style="left:32%;--c:#A78BFA;--d:13s;--l:-1s"></span><span style="left:48%;--c:#34D399;--d:10s;--l:-8s"></span><span style="left:64%;--c:#22D3EE;--d:12s;--l:-4s"></span><span style="left:80%;--c:#C084FC;--d:14s;--l:-9s"></span></div>
<div class="mt"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300V190L110 120 190 170 320 70 440 180 540 130 680 210 800 90 930 190 1050 120 1200 200V300Z" fill="#030914"/><path d="M0 300V235L140 190 260 235 400 170 560 245 720 195 880 250 1040 205 1200 245V300Z" fill="#010409"/></svg></div>
<div class="ct"><small>Lapland edition</small><h1>Chase the <em>aurora</em></h1><p>Curtains of green and violet drifting over a still, dark sky. A calm background with real depth for hero sections.</p><div class="bt"><a class="p" href="#">Begin the journey</a><a class="g" href="#">View itinerary</a></div></div>
<script>const st=document.getElementById('st');for(let i=0;i<70;i++){const s=document.createElement('i');s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*60+'%;animation-delay:-'+Math.random()*4+'s;opacity:'+(.3+Math.random()*.6);st.appendChild(s)}</script>
</body></html>
