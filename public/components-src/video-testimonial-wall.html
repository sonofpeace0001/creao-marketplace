<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Video Testimonial Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0F14;color:#F2F3F8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:900px}
.hd{text-align:center;margin-bottom:26px}.hd small{font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#FBBF24}.hd h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.05em;margin-top:8px}
.gd{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:12px}
.vc{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;cursor:pointer;background:var(--g);text-align:left;color:#fff;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;outline:0;isolation:isolate}
.vc.f{grid-column:span 2;grid-row:span 2}.vc.w{grid-column:span 2}
.vc:hover,.vc.pl,.vc:focus-visible{transform:scale(1.025);box-shadow:0 26px 40px -18px rgba(0,0,0,.8)}.vc:focus-visible{box-shadow:0 0 0 3px #fff}
.vc .pf{position:absolute;inset:0;z-index:-1}.vc .pf svg{width:100%;height:100%;display:block}
.vc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,10,20,.82));z-index:0}
.vc .pb{position:absolute;left:50%;top:42%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;z-index:2;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s}.vc.f .pb{width:72px;height:72px;margin:-36px}
.vc:hover .pb{transform:scale(1.12)}.vc.pl .pb{opacity:0;transform:scale(.6)}
.vc .wv{position:absolute;left:50%;top:42%;display:flex;gap:3px;align-items:center;height:34px;transform:translate(-50%,-50%);z-index:2;opacity:0;transition:opacity .25s}.vc.pl .wv{opacity:1}.vc .wv i{width:4px;border-radius:3px;background:#fff;height:10px;animation:wv .9s ease-in-out infinite}.vc .wv i:nth-child(2n){animation-delay:.12s}.vc .wv i:nth-child(3n){animation-delay:.27s}.vc .wv i:nth-child(4n){animation-delay:.4s}@keyframes wv{50%{height:32px}}
.vc .tx{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}.vc .tx q{display:block;font-size:13.5px;line-height:1.35;font-weight:600;quotes:none;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vc.f .tx q{font-size:19px;font-weight:700;letter-spacing:-.02em;-webkit-line-clamp:3}
.vc .tx span{font-size:12px;opacity:.8;display:flex;align-items:center;gap:6px}.vc .tx span i{width:7px;height:7px;border-radius:50%;background:#34D399}
.vc .tm{position:absolute;right:12px;top:12px;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.45);border-radius:99px;padding:3px 9px;z-index:2;backdrop-filter:blur(6px)}
.vc .pr{position:absolute;left:0;bottom:0;height:3px;background:#FBBF24;width:0;z-index:3}.vc.pl .pr{animation:pr 8s linear forwards}@keyframes pr{to{width:100%}}
@media(max-width:700px){.gd{grid-template-columns:1fr 1fr}.vc.w{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><small>Customer stories</small><h1>Hear it from the people who ship with us</h1></div><div class="gd" id="gd"></div></div>
<script>
function face(c){return '<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice"><rect width="200" height="200" fill="'+c[0]+'"/><circle cx="100" cy="86" r="34" fill="'+c[1]+'"/><path d="M30 210c0-44 30-72 70-72s70 28 70 72z" fill="'+c[1]+'"/><circle cx="160" cy="40" r="26" fill="'+c[2]+'" opacity=".5"/></svg>'}
const V=[['f','“We cut our launch time in half and our designers finally stopped complaining.”','Priya Raman · Head of Design, Northwind','0:48',['#4F46E5','#C7D2FE','#F472B6'],'linear-gradient(135deg,#4F46E5,#7C3AED)'],['','“Best onboarding I have seen.”','Marcus Reid · Fjord','0:22',['#0F766E','#99F6E4','#FDE68A'],'linear-gradient(135deg,#0F766E,#14B8A6)'],['','“Support replied in 3 minutes.”','Elena Ortiz · Helios','0:31',['#B45309','#FDE68A','#FB7185'],'linear-gradient(135deg,#B45309,#F59E0B)'],['w','“It paid for itself in the first month. We did not expect that.”','Tomas Berg · Atlas Freight','0:39',['#BE185D','#FBCFE8','#A5B4FC'],'linear-gradient(135deg,#BE185D,#EC4899)'],['','“Our team lives in it.”','Nora Quinn · Pinecone','0:18',['#1D4ED8','#BFDBFE','#FDE68A'],'linear-gradient(135deg,#1D4ED8,#3B82F6)'],['','“Finally, tools that feel good.”','Leo Park · Marlow','0:27',['#6D28D9','#DDD6FE','#FCA5A5'],'linear-gradient(135deg,#6D28D9,#A78BFA)']];
const gd=document.getElementById('gd');let cur=null,tm;
V.forEach((v,i)=>{const b=document.createElement('button');b.className='vc '+v[0];b.style.setProperty('--g',v[5]);b.innerHTML='<span class="pf">'+face(v[4])+'</span><span class="tm">'+v[3]+'</span><span class="pb"><svg width="'+(v[0]==='f'?28:20)+'" height="'+(v[0]==='f'?28:20)+'" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span><span class="wv">'+Array.from({length:9},()=>'<i></i>').join('')+'</span><span class="tx"><q>'+v[1]+'</q><span><i></i>'+v[2]+'</span></span><span class="pr"></span>';b.setAttribute('aria-label','Play testimonial from '+v[2]);b.onclick=()=>play(b);gd.appendChild(b)});
function play(b){const was=cur===b;if(cur){cur.classList.remove('pl');clearTimeout(tm)}cur=null;if(was)return;void b.offsetWidth;b.classList.add('pl');cur=b;tm=setTimeout(()=>{b.classList.remove('pl');cur=null},8000)}
const first=gd.children[0];first.classList.add('pl');cur=first;tm=setTimeout(()=>{first.classList.remove('pl');cur=null},8000);
</script></body></html>
