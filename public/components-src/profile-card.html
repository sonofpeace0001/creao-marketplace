<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Creator Profile Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EFE9DD;color:#241E14;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:400px;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 40px 70px -40px rgba(70,45,10,.55),0 0 0 1px rgba(36,30,20,.07)}
.cv{position:relative;height:130px;background:linear-gradient(120deg,#F59E0B,#EF4444 55%,#BE185D);overflow:hidden}
.cv::before,.cv::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.2)}.cv::before{width:170px;height:170px;right:-40px;top:-70px}.cv::after{width:90px;height:90px;left:30px;bottom:-50px}
.bd{padding:0 26px 26px;margin-top:-46px;position:relative}
.top{display:flex;align-items:flex-end;justify-content:space-between}
.av{width:92px;height:92px;border-radius:30px;background:linear-gradient(135deg,#1F2937,#4B5563);border:5px solid #fff;display:grid;place-items:center;font:400 34px 'Young Serif',serif;color:#FDE68A;box-shadow:0 14px 24px -12px rgba(0,0,0,.4)}
.ac{display:flex;gap:8px;padding-bottom:6px}.ac button{border:0;border-radius:99px;padding:10px 18px;font:700 14px 'Inter';cursor:pointer;transition:all .2s}
.fl{background:#241E14;color:#fff}.fl[aria-pressed=true]{background:#F3EEE3;color:#241E14}.ms{background:#F3EEE3;color:#241E14;width:42px;padding:0!important;display:grid;place-items:center}
.ac button:hover{transform:translateY(-1px)}.ac button:focus-visible{outline:3px solid #BE185D;outline-offset:2px}
.nm{margin-top:14px}.nm h1{font:400 27px 'Young Serif',serif;letter-spacing:-.025em;display:flex;align-items:center;gap:8px}.nm h1 svg{color:#2563EB}
.nm p{font-size:14.5px;color:#7A6F5C;margin-top:2px}
.bi{font-size:15px;line-height:1.55;color:#4D4434;margin:14px 0 18px}
.st{display:grid;grid-template-columns:repeat(3,1fr);background:#FAF6EE;border-radius:20px;padding:14px 8px;margin-bottom:18px}.st div{text-align:center;position:relative}.st div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:#E8DFCC}
.st b{display:block;font:400 22px 'Young Serif',serif;letter-spacing:-.02em}.st span{font-size:12px;color:#8A7F6A;font-weight:600}
.tb{display:flex;gap:4px;background:#F3EEE3;border-radius:14px;padding:4px}.tb button{flex:1;border:0;background:none;font:600 13.5px 'Inter';color:#8A7F6A;padding:9px;border-radius:11px;cursor:pointer;transition:all .2s}.tb button[aria-selected=true]{background:#fff;color:#241E14;box-shadow:0 1px 4px rgba(0,0,0,.12)}.tb button:focus-visible{outline:2px solid #BE185D}
.pn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.pn i{aspect-ratio:1;border-radius:14px;background:var(--g);animation:in .35s both}
@keyframes in{from{opacity:0;transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<article class="c"><div class="cv"></div><div class="bd"><div class="top"><div class="av">LK</div><div class="ac"><button class="fl" id="f" aria-pressed="false">Follow</button><button class="ms" aria-label="Message"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.500 7.200L3 21l1.800-5.500A8 8 0 1 1 21 12Z"/></svg></button></div></div>
 <div class="nm"><h1>Lena Kowalski<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.400 2 3.100-.2.900 3 2.700 1.600-.9 3 .9 3-2.700 1.600-.9 3-3.100-.2L12 22l-2.400-2-3.100.2-.9-3L3.100 15.600l.9-3-.9-3L5.600 8l.9-3 3.100.2Z"/><path d="m8.500 12.200 2.500 2.500 4.500-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></h1><p>@lenamakes · Warsaw, Poland</p></div>
 <p class="bi">Ceramic artist and slow-living writer. I make functional pottery and teach weekend throwing workshops.</p>
 <div class="st"><div><b>312</b><span>Pieces</span></div><div><b id="fc">28.4k</b><span>Followers</span></div><div><b>4.9</b><span>Rating</span></div></div>
 <div class="tb" role="tablist"><button role="tab" aria-selected="true" data-t="0">Work</button><button role="tab" aria-selected="false" data-t="1">Workshops</button><button role="tab" aria-selected="false" data-t="2">About</button></div><div class="pn" id="pn"></div></div></article>
<script>
const G=['#F4A261,#E76F51','#2A9D8F,#264653','#E9C46A,#F4A261','#8AB17D,#2A9D8F','#BC6C25,#7F4F24','#F1E3D3,#D9BBA0','#E76F51,#9B2226','#7B9EA8,#3D5A66','#D4A5A5,#9A6A6A'];
const pn=document.getElementById('pn');function draw(t){const o=t*3;pn.innerHTML=Array.from({length:9},(_,i)=>'<i style="--g:linear-gradient(135deg,'+G[(i+o)%9]+');animation-delay:'+i*30+'ms"></i>').join('')}draw(0);
document.querySelectorAll('.tb button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tb button').forEach(x=>x.setAttribute('aria-selected',x===b));draw(+b.dataset.t)});
const f=document.getElementById('f'),fc=document.getElementById('fc');f.onclick=()=>{const o=f.getAttribute('aria-pressed')!=='true';f.setAttribute('aria-pressed',o);f.textContent=o?'Following':'Follow';fc.textContent=o?'28.4k':'28.4k'};
</script></body></html>
