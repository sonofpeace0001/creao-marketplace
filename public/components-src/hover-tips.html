<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hover Tooltips</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F1FF;color:#1D1538;font-family:'Urbanist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;background:#fff;border-radius:28px;padding:44px 28px 36px;box-shadow:0 40px 70px -46px rgba(80,40,160,.55),0 0 0 1px rgba(29,21,56,.06);text-align:center}
.c h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}.c p{font-size:15px;color:#7A6FA3;font-weight:500;margin-bottom:64px}
.rw{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.tp{position:relative;display:inline-block}.tp>button{width:50px;height:50px;border:1.5px solid #E4DDF7;background:#FBF9FF;border-radius:16px;color:#4C3A9A;cursor:pointer;display:grid;place-items:center;transition:all .2s}.tp>button:hover,.tp>button:focus-visible{background:#EEE8FF;border-color:#7C5CFA;transform:translateY(-3px)}.tp>button:focus-visible{outline:2px solid #7C5CFA;outline-offset:2px}
.bb{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,6px) scale(.9);transform-origin:bottom center;background:#1D1538;color:#fff;font-size:13px;font-weight:700;padding:8px 12px;border-radius:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;gap:8px}
.bb::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:#1D1538;transform:translate(-50%,-5px) rotate(45deg);border-radius:2px}
.bb kbd{font:700 11px 'Urbanist';background:rgba(255,255,255,.18);padding:2px 6px;border-radius:5px}
.tp:hover .bb,.tp>button:focus-visible+.bb,.tp.open .bb{opacity:1;transform:translate(-50%,0) scale(1)}
.tp.b .bb{bottom:auto;top:calc(100% + 12px);transform-origin:top center;transform:translate(-50%,-6px) scale(.9)}.tp.b .bb::after{top:auto;bottom:100%;transform:translate(-50%,5px) rotate(45deg)}.tp.b:hover .bb,.tp.b>button:focus-visible+.bb{transform:translate(-50%,0) scale(1)}
.tp.v .bb{background:linear-gradient(135deg,#7C5CFA,#E04FD0)}.tp.v .bb::after{background:#9B54E8}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><h1>Hover or focus an icon</h1><p>Tooltips appear on hover and keyboard focus, never covering the target.</p>
<div class="rw">
<div class="tp"><button aria-describedby="a1" aria-label="Bold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h6a3.500 3.500 0 0 1 0 7H7zM7 12h7a3.500 3.500 0 0 1 0 7H7z"/></svg></button><span class="bb" role="tooltip" id="a1">Bold <kbd>Ctrl B</kbd></span></div>
<div class="tp"><button aria-describedby="a2" aria-label="Link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button><span class="bb" role="tooltip" id="a2">Insert link <kbd>Ctrl K</kbd></span></div>
<div class="tp v open" id="first"><button aria-describedby="a3" aria-label="AI assist"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800zM19 16l.8 2.200L22 19l-2.200.8L19 22l-.8-2.200L16 19l2.200-.8z"/></svg></button><span class="bb" role="tooltip" id="a3">Ask AI to rewrite</span></div>
<div class="tp"><button aria-describedby="a4" aria-label="Image"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button><span class="bb" role="tooltip" id="a4">Upload image</span></div>
<div class="tp b"><button aria-describedby="a5" aria-label="Share"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.600 13.500 6.800 4M15.400 6.500l-6.800 4"/></svg></button><span class="bb" role="tooltip" id="a5">Share (opens below)</span></div>
<div class="tp b"><button aria-describedby="a6" aria-label="Delete"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg></button><span class="bb" role="tooltip" id="a6">Delete forever</span></div>
</div></div>
<script>
const f=document.getElementById('first');const done=()=>f.classList.remove('open');
document.querySelectorAll('.tp').forEach(t=>{t.addEventListener('mouseenter',()=>{if(t!==f)done()});t.addEventListener('focusin',()=>{if(t!==f)done()})});
</script></body></html>
