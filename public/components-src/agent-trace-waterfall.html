<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agent Trace Waterfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EEF0F4;color:#12141A;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:780px;background:#fff;border-radius:22px;box-shadow:0 40px 70px -44px rgba(18,20,26,.5),0 0 0 1px rgba(18,20,26,.07);overflow:hidden}
.hd{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid #EDEFF4}.hd h1{font-size:16px;font-weight:600;letter-spacing:-.02em}.hd .st{display:flex;gap:18px;margin-left:auto}.hd .st div{font:400 12px 'Geist Mono',monospace;color:#8A90A3}.hd .st b{display:block;font:500 16px 'Geist Mono',monospace;color:#12141A;margin-top:1px}
.ax{display:grid;grid-template-columns:200px 1fr;padding:8px 20px 6px;font:400 11.5px 'Geist Mono',monospace;color:#9AA0B2}.ax div:last-child{display:flex;justify-content:space-between}
.rs{position:relative;padding:0 20px 14px}
.gl{position:absolute;left:220px;right:20px;top:0;bottom:14px;background:repeating-linear-gradient(90deg,#F0F2F7 0 1px,transparent 1px calc(100%/6))}
.nw{position:absolute;left:calc(220px + (100% - 240px)*var(--n));top:-6px;bottom:8px;width:2px;background:#EF4444;z-index:3}.nw::before{content:"";position:absolute;left:-4px;top:0;width:10px;height:10px;border-radius:50%;background:#EF4444}
.rw{position:relative;z-index:1}
.rh{display:grid;grid-template-columns:200px 1fr;align-items:center;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;height:38px;border-radius:8px}.rh:hover{background:#F7F8FB}.rh:focus-visible{outline:2px solid #6366F1}
.nm{display:flex;align-items:center;gap:9px;padding-left:4px;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden}.nm i{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--b);color:#fff}.nm span{font:400 11.5px 'Geist Mono',monospace;color:#9AA0B2}
.tr{position:relative;height:100%}.br{position:absolute;top:9px;height:20px;border-radius:7px;background:var(--b);min-width:3px;overflow:hidden;opacity:var(--o,1);transition:opacity .2s}.br.live::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:sh 1s infinite}@keyframes sh{to{transform:translateX(100%)}}
.br em{position:absolute;left:8px;top:2px;font:500 11px 'Geist Mono',monospace;font-style:normal;color:#fff;white-space:nowrap}
.dt{display:none;margin:2px 0 8px 24px;background:#0F1218;color:#C9CEDF;border-radius:12px;padding:12px 14px;font:400 12px/1.65 'Geist Mono',monospace}.rw.op .dt{display:block}.dt b{color:#7DD3FC;font-weight:500}.dt s{text-decoration:none;color:#86EFAC}
@media(max-width:620px){.ax,.rh{grid-template-columns:120px 1fr}.gl{left:140px}.nw{left:calc(140px + (100% - 160px)*var(--n))}.hd .st{margin-left:0}}
@media(prefers-reduced-motion:reduce){.br.live::after{animation:none}}
</style></head><body>
<div class="c"><div class="hd"><h1>Run 4821 · support-triage</h1><div class="st"><div>Duration<b id="du"></b></div><div>Tokens<b id="tk"></b></div><div>Cost<b id="co"></b></div></div></div>
<div class="ax"><div>Span</div><div><span>0s</span><span>2s</span><span>4s</span><span>6s</span><span>8s</span><span>10s</span><span>12s</span></div></div>
<div class="rs" id="rs"><div class="gl"></div><div class="nw" id="nw"></div></div></div>
<script>
const S=[['agent.run','run',0,12,0,'#6366F1','M5 3l14 9-14 9z'],['llm.plan','llm',0.1,1.6,1840,'#8B5CF6','M12 3l1.900 5.100L19 10l-5.100 1.900L12 17l-1.900-5.100L5 10l5.100-1.900z'],['tool.search_tickets','tool',1.8,2.1,0,'#0EA5E9','M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.300-4.300'],['tool.fetch_customer','tool',1.8,1.3,0,'#0EA5E9','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8'],['llm.classify','llm',4.1,2.4,3920,'#8B5CF6','M12 3l1.900 5.100L19 10l-5.100 1.900L12 17l-1.900-5.100L5 10l5.100-1.900z'],['tool.kb_lookup','tool',6.6,1.9,0,'#0EA5E9','M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h6'],['llm.draft_reply','llm',8.5,3.3,6720,'#8B5CF6','M12 3l1.900 5.100L19 10l-5.100 1.900L12 17l-1.900-5.100L5 10l5.100-1.900z']];
const IO=['<b>input</b> {"query":"refund delayed","limit":20}<br><b>output</b> <s>20 tickets</s> matched in 412 ms','<b>input</b> {"id":"cus_8821"}<br><b>output</b> <s>plan: Pro</s>, tenure 14 months','<b>prompt</b> 3,412 tokens<br><b>completion</b> <s>category: billing / refund</s>'];
const rs=document.getElementById('rs');const rows=S.map((s,i)=>{const w=document.createElement('div');w.className='rw'+(i===2?' op':'');w.innerHTML='<button class="rh"><div class="nm"><i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="'+s[6]+'"/></svg></i>'+s[0]+'<span>'+s[1]+'</span></div><div class="tr"><div class="br" style="--b:'+s[5]+'"><em></em></div></div></button><div class="dt">'+IO[i%3]+'</div>';rs.appendChild(w);w.querySelector('button').onclick=()=>w.classList.toggle('op');return w});
let t=7.4;
function draw(){document.getElementById('nw').style.setProperty('--n',Math.min(t/12,1));let tok=0;S.forEach((s,i)=>{const [n,k,st,du,tk]=s,len=Math.max(0,Math.min(du,t-st)),b=rows[i].querySelector('.br');b.style.left=(st/12*100)+'%';b.style.width=(len/12*100)+'%';b.style.setProperty('--o',t<st?0:1);const live=t>=st&&t<st+du&&i>0&&i<S.length||(i===0&&t<12);b.classList.toggle('live',live);b.querySelector('em').textContent=len>0.5?(len).toFixed(1)+'s':'';if(len>0)tok+=tk*(len/du)});
 document.getElementById('du').textContent=Math.min(t,12).toFixed(1)+'s';document.getElementById('tk').textContent=Math.round(tok).toLocaleString();document.getElementById('co').textContent='$'+(tok*0.0000032).toFixed(3)}
draw();setInterval(()=>{t+=0.06;if(t>13.5)t=0.2;draw()},60);
</script></body></html>
