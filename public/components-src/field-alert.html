<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Field Validation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F5F8;color:#171A26;font-family:'Public Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 18px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:440px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 60px -36px rgba(23,26,38,.4),0 0 0 1px rgba(23,26,38,.06)}
h1{font-size:22px;font-weight:700;letter-spacing:-.03em}.sub{color:#6B7185;font-size:14.5px;margin:6px 0 22px}
.f{margin-bottom:18px}.f label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:7px}.f label span{color:#9096AA;font-weight:500}
.i{position:relative}
.i input{width:100%;border:1.5px solid #DCDFEA;border-radius:13px;padding:14px 44px 14px 15px;font:500 15.5px 'Public Sans';color:#171A26;outline:0;transition:border-color .2s,box-shadow .2s;background:#fff}
.i input:focus{border-color:#4F5BFF;box-shadow:0 0 0 4px rgba(79,91,255,.14)}
.i .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;opacity:0;transform:translateY(-50%) scale(.5);transition:all .25s cubic-bezier(.3,1.6,.4,1)}
.f.bad .i input{border-color:#E5484D;box-shadow:0 0 0 4px rgba(229,72,77,.12);animation:sh .35s}
.f.bad .ic{opacity:1;transform:translateY(-50%) scale(1);background:#E5484D;color:#fff}
.f.ok .i input{border-color:#22A06B}.f.ok .ic{opacity:1;transform:translateY(-50%) scale(1);background:#22A06B;color:#fff}
@keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.m{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:500;margin-top:8px;color:#6B7185;line-height:1.4;min-height:18px}
.bad .m{color:#C8353A}.ok .m{color:#1E8A5C}
.m svg{flex:none;margin-top:1px}
.st{display:flex;gap:5px;margin-top:10px}.st i{flex:1;height:5px;border-radius:5px;background:#E6E8F0;transition:background .3s}
.rl{display:grid;gap:5px;margin-top:10px;font-size:12.5px;color:#8A90A5;font-weight:500}.rl div{display:flex;align-items:center;gap:7px}.rl div::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid #CDD1DF;transition:all .2s}
.rl div.y{color:#1E8A5C}.rl div.y::before{background:#22A06B;border-color:#22A06B;box-shadow:inset 0 0 0 3px #fff}
button.go{width:100%;border:0;border-radius:13px;padding:15px;margin-top:6px;font:700 15px 'Public Sans';background:#4F5BFF;color:#fff;cursor:pointer;transition:all .2s}
button.go:disabled{background:#C9CDEB;cursor:not-allowed}button.go:not(:disabled):hover{transform:translateY(-1px)}
.go:focus-visible{outline:2px solid #171A26;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<form class="c" id="fm" novalidate><h1>Create your account</h1><p class="sub">Inline validation tells people exactly what to fix.</p>
 <div class="f" id="fe"><label for="e">Work email <span>Required</span></label><div class="i"><input id="e" type="email" value="maya@northwind" autocomplete="off"><span class="ic"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round" id="ei"></svg></span></div><div class="m" id="em"></div></div>
 <div class="f" id="fp"><label for="p">Password <span>8+ characters</span></label><div class="i"><input id="p" type="password" value="" autocomplete="off" placeholder="Create a password"><span class="ic"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round" id="pi"></svg></span></div>
  <div class="st" id="st"><i></i><i></i><i></i><i></i></div><div class="rl" id="rl"><div data-r="len">At least 8 characters</div><div data-r="num">One number</div><div data-r="up">One uppercase letter</div></div></div>
 <button class="go" id="go" disabled>Create account</button></form>
<script>
const X='<path d="M6 6l12 12M18 6 6 18"/>',V='<path d="m5 12.500 4.500 4.500L19 7"/>';
const e=document.getElementById('e'),p=document.getElementById('p'),fe=document.getElementById('fe'),fp=document.getElementById('fp'),em=document.getElementById('em'),go=document.getElementById('go');
function chk(){const ev=/^\S+@\S+\.\S+$/.test(e.value);const touched=e.value.length>0;
 fe.className='f '+(!touched?'':ev?'ok':'bad');document.getElementById('ei').innerHTML=ev?V:X;
 em.innerHTML=!touched?'':ev?'Looks good':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.500v.01"/></svg>Enter a full address, like maya@northwind.com';
 const r={len:p.value.length>=8,num:/\d/.test(p.value),up:/[A-Z]/.test(p.value)};const n=Object.values(r).filter(Boolean).length+(p.value.length>=12?1:0);
 document.querySelectorAll('#rl div').forEach(d=>d.classList.toggle('y',r[d.dataset.r]));
 const col=['#E5484D','#F5A524','#22A06B','#22A06B'];document.querySelectorAll('#st i').forEach((s,i)=>s.style.background=p.value&&i<n?col[Math.min(n-1,3)]:'');
 const pv=p.value&&n>=3;fp.className='f '+(!p.value?'':pv?'ok':'bad');document.getElementById('pi').innerHTML=pv?V:X;go.disabled=!(ev&&pv)}
e.addEventListener('input',chk);p.addEventListener('input',chk);chk();
document.getElementById('fm').addEventListener('submit',x=>{x.preventDefault();if(!go.disabled)go.textContent='Account created ✓'});
</script></body></html>
