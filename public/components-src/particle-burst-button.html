<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Particle Burst Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#FFF3D6,#FFE0EC);color:#2A1633;font-family:'Fredoka',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.c{width:100%;max-width:640px;text-align:center}
h1{font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:-.02em}p.sb{color:#8A6A8F;font-size:16px;margin:6px 0 40px}
.rw{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;align-items:center}
.pb{position:relative;display:flex;align-items:center;gap:10px;border:3px solid #2A1633;background:var(--b);color:var(--t,#fff);border-radius:20px;padding:16px 28px;font:600 18px 'Fredoka';cursor:pointer;box-shadow:5px 5px 0 #2A1633;transition:transform .12s,box-shadow .12s}
.pb:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #2A1633}.pb:active{transform:translate(5px,5px);box-shadow:0 0 0 #2A1633}.pb:focus-visible{outline:3px solid #2563EB;outline-offset:4px}
.pb svg{transition:transform .3s cubic-bezier(.3,1.8,.5,1)}.pb.on svg{transform:scale(1.3) rotate(-10deg)}
.pb.like{--b:#FF4D6D}.pb.star{--b:#FFC300;--t:#2A1633}.pb.cl{--b:#2DD4BF;--t:#2A1633;border-radius:99px}
.pb .ct{font:600 18px 'Fredoka';min-width:2ch;text-align:left}
.pt{position:fixed;left:0;top:0;pointer-events:none;z-index:50;will-change:transform,opacity}
.hint{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#B493B8;margin-top:44px}
@media(prefers-reduced-motion:reduce){.pb,.pb svg{transition:none}}
</style></head><body>
<div class="c"><h1>Make it pop</h1><p class="sb">Every click throws a burst of confetti from the button.</p>
<div class="rw"><button class="pb like" id="b1" data-c="#FF4D6D,#FF8FA3,#FFD6E0,#FFC300"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.500" stroke-linejoin="round"><path d="M12 21s-7-4.500-9.500-9A5.500 5.500 0 0 1 12 6a5.500 5.500 0 0 1 9.500 6C19 16.500 12 21 12 21z"/></svg>Like<span class="ct" id="c1">128</span></button>
<button class="pb star" id="b2" data-c="#FFC300,#FF9F1C,#FFFFFF,#FF4D6D"><svg width="24" height="24" viewBox="0 0 24 24" fill="#2A1633"><path d="M12 2l3 6.900 7.500.7-5.700 5 1.700 7.400L12 18l-6.500 4 1.700-7.400-5.700-5 7.500-.7z"/></svg>Favorite<span class="ct" id="c2">42</span></button>
<button class="pb cl" id="b3" data-c="#2DD4BF,#6366F1,#FFC300,#FF4D6D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1633" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>Celebrate</button></div><div class="hint">Click, tap or press Enter</div></div>
<script>
const R=matchMedia('(prefers-reduced-motion:reduce)').matches;
function burst(b,n){if(R)return;const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=b.dataset.c.split(',');for(let i=0;i<n;i++){const p=document.createElement('i');p.className='pt';const s=6+Math.random()*8,shape=Math.random();p.style.cssText='width:'+s+'px;height:'+(shape<.5?s:s*.45)+'px;background:'+cols[i%cols.length]+';border-radius:'+(shape<.3?'50%':'2px')+';border:1.5px solid #2A1633';document.body.appendChild(p);const a=Math.random()*Math.PI*2,sp=3.5+Math.random()*7,vx=Math.cos(a)*sp,vy=Math.sin(a)*sp-4,rot=Math.random()*360,vr=(Math.random()-.5)*28;let x=cx,y=cy,t=0;(function f(){t++;x+=vx*Math.pow(.96,t);y+=vy*Math.pow(.96,t)+t*.28;p.style.transform='translate('+x+'px,'+y+'px) rotate('+(rot+vr*t)+'deg)';p.style.opacity=Math.max(0,1-t/62);if(t<64)requestAnimationFrame(f);else p.remove()})()}}
function bind(b,cid){const c=cid&&document.getElementById(cid);let on=false;b.addEventListener('click',()=>{on=!on;b.classList.toggle('on',on);if(c)c.textContent=+c.textContent+(on?1:-1);if(on||!c)burst(b,26)})}
bind(document.getElementById('b1'),'c1');bind(document.getElementById('b2'),'c2');bind(document.getElementById('b3'));
// demo state: an in-flight burst
(function(){const b=document.getElementById('b1');b.classList.add('on');document.getElementById('c1').textContent=129;const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=b.dataset.c.split(',');for(let i=0;i<30;i++){const p=document.createElement('i');p.className='pt';const s=6+Math.random()*8;p.style.cssText='width:'+s+'px;height:'+(i%2?s:s*.45)+'px;background:'+cols[i%cols.length]+';border-radius:'+(i%3?'2px':'50%')+';border:1.5px solid #2A1633';document.body.appendChild(p);const a=(i/30)*Math.PI*2+Math.random()*.4,d=40+Math.random()*90;p.style.transform='translate('+(cx+Math.cos(a)*d)+'px,'+(cy+Math.sin(a)*d*.8-20)+'px) rotate('+(i*37)+'deg)';p.style.opacity=.9-Math.random()*.4;setTimeout(()=>p.remove(),900)}})();
</script></body></html>
