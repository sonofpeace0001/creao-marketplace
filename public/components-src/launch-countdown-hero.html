<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Launch Countdown Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0A0F;color:#F6F2EA;font-family:'Sora',sans-serif;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px;isolation:isolate}
.glow{position:absolute;left:50%;top:50%;width:min(900px,120vw);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,86,48,.28),rgba(255,86,48,.06) 45%,transparent 68%);z-index:-1;animation:br 5s ease-in-out infinite alternate}
@keyframes br{to{transform:translate(-50%,-50%) scale(1.15);opacity:.8}}
.grain{position:absolute;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;-webkit-mask:radial-gradient(circle at 50% 50%,#000,transparent 70%);mask:radial-gradient(circle at 50% 50%,#000,transparent 70%)}
.tag{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font:600 12px 'Geist Mono';letter-spacing:.16em;text-transform:uppercase;color:#FFB4A2}
.tag i{width:8px;height:8px;border-radius:50%;background:#FF5630;box-shadow:0 0 0 0 rgba(255,86,48,.7);animation:pu 1.800s ease-out infinite}
@keyframes pu{70%{box-shadow:0 0 0 10px rgba(255,86,48,0)}100%{box-shadow:0 0 0 0 rgba(255,86,48,0)}}
h1{font-weight:800;font-size:clamp(34px,6.4vw,84px);line-height:.98;letter-spacing:-.06em;margin:22px 0 14px;max-width:15ch}h1 span{color:#FF5630}
.sb{font-size:clamp(15px,1.6vw,18px);color:#A8A196;max-width:480px;line-height:1.5}
.cd{display:flex;gap:clamp(8px,2vw,18px);margin:38px 0 34px;align-items:flex-start}
.u{display:grid;gap:12px;justify-items:center}.u small{font:600 11px 'Geist Mono';letter-spacing:.2em;text-transform:uppercase;color:#7A7468}
.dg{display:flex;gap:6px}
.d{position:relative;width:clamp(44px,8.4vw,92px);height:clamp(64px,12vw,128px);border-radius:14px;background:linear-gradient(180deg,#1C1A22 0 50%,#15131A 50% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 20px 30px -16px rgba(0,0,0,.8);overflow:hidden;font:600 clamp(40px,7.6vw,86px)/clamp(64px,12vw,128px) 'Geist Mono';text-align:center;letter-spacing:-.06em}
.d::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#0B0A0F;z-index:3}
.d span{position:absolute;inset:0;display:block;transition:none}
.d .o{animation:out .5s cubic-bezier(.6,0,.2,1) forwards}.d .n{animation:inn .5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes out{to{transform:translateY(-100%);opacity:0}}@keyframes inn{from{transform:translateY(100%);opacity:0}}
.sep{font:600 clamp(30px,5vw,60px) 'Geist Mono';color:#4A4540;padding-top:clamp(10px,2.4vw,28px)}
.f{display:flex;gap:8px;width:min(480px,100%);padding:7px;border-radius:18px;background:#16141C;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.f input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:500 16px 'Sora';padding:0 14px}.f input::placeholder{color:#6F695F}
.f button{border:0;border-radius:12px;padding:15px 22px;background:#FF5630;color:#fff;font:700 15px 'Sora';cursor:pointer;white-space:nowrap}.f button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.f:focus-within{box-shadow:inset 0 0 0 2px #FF5630}
.sm{margin-top:18px;font-size:13px;color:#7A7468;display:flex;align-items:center;gap:10px}.av{display:flex}.av i{width:26px;height:26px;border-radius:50%;border:2px solid #0B0A0F;margin-left:-8px;display:block}.av i:first-child{margin-left:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<section class="hero"><div class="glow"></div><div class="grain"></div>
<div class="tag"><i></i>Launching soon</div>
<h1>The camera that <span>thinks before it shoots</span></h1>
<p class="sb">Aperture One reads the scene, picks the exposure and frames the shot. Reserve yours before the first batch ships.</p>
<div class="cd" id="cd" role="timer" aria-label="Time until launch"></div>
<form class="f" onsubmit="return false"><input type="email" placeholder="Your email for early access" aria-label="Email address"><button>Reserve my spot</button></form>
<div class="sm"><div class="av"><i style="background:#FF8A5C"></i><i style="background:#7C8CFF"></i><i style="background:#5ED3A8"></i><i style="background:#F2C94C"></i></div>12,480 people are already waiting</div></section>
<script>
const end=Date.now()+((12*24+7)*3600+41*60+18)*1000,cd=document.getElementById('cd'),U=['Days','Hours','Minutes','Seconds'];
const units=U.map((u,i)=>{const w=document.createElement('div');w.className='u';w.innerHTML='<div class="dg"></div><small>'+u+'</small>';cd.appendChild(w);if(i<3){const s=document.createElement('div');s.className='sep';s.textContent=':';cd.appendChild(s)}return w.querySelector('.dg')});
const digs=units.map(g=>{const a=[0,1].map(()=>{const d=document.createElement('div');d.className='d';d.innerHTML='<span>0</span>';g.appendChild(d);return d});return a});
function set(d,v){const cur=d.querySelector('span:last-child');if(cur.textContent===v)return;const o=cur,n=document.createElement('span');n.textContent=v;n.className='n';o.className='o';d.appendChild(n);setTimeout(()=>{if(o.parentNode)o.remove();n.className=''},520)}
function tick(first){const t=Math.max(0,end-Date.now()),s=Math.floor(t/1000),v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
 v.forEach((x,i)=>{const str=String(x).padStart(2,'0');digs[i].forEach((d,k)=>{if(first){d.querySelector('span').textContent=str[k]}else set(d,str[k])})})}
tick(true);setInterval(()=>tick(false),1000);
</script></body></html>
