<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reaction Icon Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0F18;color:#ECEEF8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(520px 340px at 50% 100%,rgba(236,72,153,.16),transparent 70%)}
.w{width:100%;max-width:520px;display:grid;gap:18px}
.po{border-radius:24px;background:#161827;padding:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.po .au{display:flex;align-items:center;gap:12px;margin-bottom:12px}.po .au i{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EC4899);display:block}.po .au b{display:block;font-size:15px}.po .au span{font-size:12.500px;color:#7C809C}
.po p{font-size:16px;line-height:1.55;color:#C9CCE2}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:6px;border-radius:99px;background:#161827;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);width:max-content;max-width:100%}
.r{--c:#F43F5E;position:relative;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:10px 16px 10px 12px;background:none;color:#9296B5;font:700 14px 'Geist Mono';cursor:pointer;transition:background .25s,color .25s;overflow:visible}
.r:hover{background:rgba(255,255,255,.06)}.r:focus-visible{outline:2px solid var(--c)}
.r svg{width:24px;height:24px;overflow:visible;transition:transform .3s cubic-bezier(.3,1.9,.5,1)}.r svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .25s,stroke .25s}
.r.on{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}.r.on svg *{fill:color-mix(in srgb,var(--c) 28%,transparent);stroke:var(--c)}
.r.pop svg{animation:pp .5s cubic-bezier(.3,1.9,.5,1)}@keyframes pp{0%{transform:scale(.7)}50%{transform:scale(1.45) rotate(-10deg)}100%{transform:scale(1)}}
.r .n{display:inline-block;height:1.3em;overflow:hidden;min-width:2.4ch;text-align:left}.r .n span{display:block;transition:transform .35s cubic-bezier(.3,1.3,.4,1)}
.pt{position:absolute;left:24px;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);pointer-events:none;animation:bs .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes bs{from{transform:translate(0,0) scale(1)}to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.tt{font-size:12.500px;color:#6E7291}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w"><article class="po"><div class="au"><i></i><div><b>Amara Diallo</b><span>Posted 12 minutes ago</span></div></div><p>Shipped the new onboarding today. Setup is down from nine steps to three, and the first week of data looks better than we hoped.</p></article>
<div class="bar" id="bar" role="group" aria-label="Reactions"></div><div class="tt">Tap a reaction. Tap again to take it back.</div></div>
<script>
const R=[['Like','#3B82F6',214,'<path d="M7 11v9H4v-9ZM7 11l4-7c1.700 0 2.500 1.200 2 3l-1 3h6a2 2 0 0 1 2 2.300l-1.200 6A2 2 0 0 1 16.800 20H7"/>'],['Love','#F43F5E',538,'<path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 7.300 4.300 4.300 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10Z"/>'],['Spark','#F59E0B',96,'<path d="m12 3 1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800ZM19 16l.8 2.200L22 19l-2.200.8L19 22l-.8-2.200L16 19l2.200-.8Z"/>'],['Haha','#EAB308',152,'<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2.500 7 2.500 8 0M8.500 9.500h.01M15.500 9.500h.01"/>'],['Wow','#A855F7',47,'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="16" rx="2.200" ry="2.800"/><path d="M8.500 9h.01M15.500 9h.01"/>']];
const bar=document.getElementById('bar');
R.forEach(([n,c,k,p],i)=>{const b=document.createElement('button');b.className='r';b.style.setProperty('--c',c);b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',n);b.dataset.k=k;
 b.innerHTML='<svg viewBox="0 0 24 24">'+p+'</svg><span class="n"><span>'+k+'</span><span>'+(k+1)+'</span></span>';b.onclick=()=>{off=true;tog(b)};bar.appendChild(b)});
function tog(b){const on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.querySelector('.n span').style.transform=on?'translateY(-100%)':'none';b.querySelector('.n span:last-child').style.transform=on?'translateY(-100%)':'none';
 if(on){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');for(let i=0;i<10;i++){const p=document.createElement('i');p.className='pt';const a=i/10*Math.PI*2,d=26+Math.random()*16;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');if(i%2)p.style.width=p.style.height='4px';b.appendChild(p);setTimeout(()=>p.remove(),720)}}}
const rs=[...bar.children];tog(rs[1]);
/* Idle demo: reactions are tapped in turn, each popping with a burst of particles and rolling its counter, and the previous one is released, until a real tap. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3600);let i=2;while(!off){rs.forEach(b=>{if(b.classList.contains('on'))tog(b)});await sleep(250);tog(rs[i++%5]);await sleep(1600)}})()}
</script></body></html>
