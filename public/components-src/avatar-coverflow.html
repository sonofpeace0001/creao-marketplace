<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Avatar Coverflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(800px 520px at 50% 40%,#2A1B57,#0B0818 78%);color:#F1EDFF;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{width:100%;max-width:760px;display:grid;gap:16px;justify-items:center;text-align:center}
.w h1{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.05em}
.cf{position:relative;width:100%;height:300px;perspective:1100px;perspective-origin:50% 40%}
.cd{position:absolute;left:50%;top:0;width:190px;height:230px;margin-left:-95px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.1,.4,1),opacity .5s,filter .5s;transform:translateX(var(--x)) translateZ(var(--z)) rotateY(var(--r));opacity:var(--o);filter:brightness(var(--b))}
.cd:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:26px}
.cd .im{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 30px 40px -16px rgba(0,0,0,.8),inset 0 0 0 1.500px rgba(255,255,255,.25)}.cd .im svg{width:100%;height:100%;display:block}
.cd::after{content:"";position:absolute;left:0;right:0;top:100%;height:90px;margin-top:6px;border-radius:26px;background:inherit;transform:scaleY(-1);opacity:.18;-webkit-mask:linear-gradient(transparent 20%,#000);mask:linear-gradient(transparent 20%,#000);pointer-events:none}
.cd .gl{position:absolute;inset:0;border-radius:26px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:250% 100%;background-position:calc(var(--sh,0)*-1% + 130%) 0;pointer-events:none;z-index:2}
.inf{min-height:78px}.inf b{display:block;font-size:24px;font-weight:800;letter-spacing:-.04em;transition:opacity .25s}.inf span{font:500 12px 'Geist Mono';letter-spacing:.14em;text-transform:uppercase;color:#A89DDE}
.dt{display:flex;gap:8px}.dt i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .4s cubic-bezier(.3,1.6,.5,1)}.dt i.on{width:26px;border-radius:4px;background:#fff}
.ar{display:flex;gap:10px}.ar button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:background .2s,transform .15s}.ar button:hover{background:rgba(255,255,255,.2)}.ar button:active{transform:scale(.92)}.ar button:focus-visible{outline:3px solid #fff;outline-offset:3px}.ar svg{width:20px;height:20px}
@media(max-width:520px){.cf{height:260px}.cd{width:150px;height:190px;margin-left:-75px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><h1>Meet the crew</h1><div class="cf" id="cf" role="listbox" aria-label="Team"></div><div class="inf" aria-live="polite"><b id="nm"></b><span id="rl"></span></div><div class="dt" id="dt"></div>
<div class="ar"><button id="pv" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><button id="nx" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button></div></div>
<script>
function face(s){const r=n=>{s=(s*9301+49297)%233280;return Math.floor(s/233280*n)};const sk=['#F2C9A5','#E0A57A','#B9784B','#8A5230','#5B3420','#F7D9C1'][r(6)],hr=['#1B1410','#3B2314','#7A4A21','#C9A15E','#B5361F','#6B6B73','#2D2A6B'][r(7)],bg=['#FFD6A5','#CAFFBF','#9BF6FF','#BDB2FF','#FFC6FF','#FDFFB6','#A0C4FF','#FFADAD'][r(8)],sh=['#6366F1','#EC4899','#0EA5E9','#10B981','#F59E0B','#8B5CF6'][r(6)],st=r(5),gl=r(3)===0,sm=r(3);
 let h='';if(st===1)h+='<path d="M24 52c-2-24 8-34 26-34s28 10 26 34c-2 12-6 16-6 16H30s-4-4-6-16Z" fill="'+hr+'"/>';
 let top='';if(st===0)top='<path d="M27 46c0-16 9-22 23-22s23 6 23 22c-6-8-14-10-23-10s-17 2-23 10Z" fill="'+hr+'"/>';else if(st===1)top='<path d="M27 48c0-17 9-24 23-24s23 7 23 24c-7-7-14-11-23-11s-16 4-23 11Z" fill="'+hr+'"/>';else if(st===2)top='<g fill="'+hr+'"><circle cx="31" cy="40" r="9"/><circle cx="42" cy="31" r="10"/><circle cx="56" cy="30" r="10"/><circle cx="68" cy="39" r="9"/><circle cx="50" cy="27" r="9"/></g>';else if(st===3)top='<g fill="'+hr+'"><path d="M28 46c0-14 8-20 22-20s22 6 22 20c-5-6-13-9-22-9s-17 3-22 9Z"/><circle cx="50" cy="20" r="8"/></g>';
 return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="100" fill="'+bg+'"/>'+h+'<path d="M14 100c2-18 16-26 36-26s34 8 36 26Z" fill="'+sh+'"/><rect x="43" y="62" width="14" height="14" rx="6" fill="'+sk+'"/><ellipse cx="50" cy="48" rx="21" ry="24" fill="'+sk+'"/>'+top+'<circle cx="42" cy="50" r="2.200" fill="#2A1A12"/><circle cx="58" cy="50" r="2.200" fill="#2A1A12"/>'+(gl?'<g fill="none" stroke="#2A1A12" stroke-width="1.800"><circle cx="42" cy="50" r="6.500"/><circle cx="58" cy="50" r="6.500"/><path d="M48.500 50h3"/></g>':'')+'<path d="'+(sm===0?'M43 60q7 6 14 0':sm===1?'M44 60q6 4 12 0':'M43 59q7 8 14 0')+'" fill="none" stroke="#2A1A12" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="57" r="3.200" fill="#FF8A8A" opacity=".35"/><circle cx="64" cy="57" r="3.200" fill="#FF8A8A" opacity=".35"/></svg>'}
const P=[['Priya Nair','Design lead'],['Marcus Webb','Staff engineer'],['Amara Diallo','Product manager'],['Hannah Cho','Brand designer'],['Tomas Novak','DevOps'],['Lucas Ferreira','Data scientist'],['Imani Cole','Support lead']];
const cf=document.getElementById('cf'),dt=document.getElementById('dt'),nm=document.getElementById('nm'),rl=document.getElementById('rl');let cur=2,cs=[];
P.forEach(([n,r],i)=>{const b=document.createElement('button');b.className='cd';b.setAttribute('role','option');b.setAttribute('aria-label',n+', '+r);b.innerHTML='<span class="im">'+face(i*47+13)+'</span><span class="gl"></span>';b.onclick=()=>{off=true;go(i)};cf.appendChild(b);cs.push(b);dt.insertAdjacentHTML('beforeend','<i></i>')});
function go(i){cur=(i+P.length)%P.length;const small=innerWidth<520,sp=small?92:150;cs.forEach((c,k)=>{let d=k-cur;if(d>P.length/2)d-=P.length;if(d<-P.length/2)d+=P.length;const a=Math.abs(d);c.style.setProperty('--x',(d*sp+(d>0?60:d<0?-60:0)*(small?.6:1))+'px');c.style.setProperty('--z',(d===0?90:-a*70)+'px');c.style.setProperty('--r',(d===0?0:d>0?-52:52)+'deg');c.style.setProperty('--o',a>2?0:1);c.style.setProperty('--b',d===0?1:Math.max(.35,.75-a*.18));c.style.setProperty('--sh',d===0?100:0);c.style.zIndex=10-a;c.setAttribute('aria-selected',d===0);c.style.pointerEvents=a>2?'none':'auto'});
 [...dt.children].forEach((x,k)=>x.classList.toggle('on',k===cur));nm.textContent=P[cur][0];rl.textContent=P[cur][1]}
document.getElementById('nx').onclick=()=>{off=true;go(cur+1)};document.getElementById('pv').onclick=()=>{off=true;go(cur-1)};addEventListener('keydown',e=>{if(e.key==='ArrowRight'){off=true;go(cur+1)}if(e.key==='ArrowLeft'){off=true;go(cur-1)}});addEventListener('resize',()=>go(cur));
go(2);
/* Idle demo: the coverflow turns on its own every 2s, the centre card sliding forward with a glint while its neighbours swing back on the Y axis, until an arrow, key or click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3000);while(!off){go(cur+1);await sleep(2000)}})()}
</script></body></html>
