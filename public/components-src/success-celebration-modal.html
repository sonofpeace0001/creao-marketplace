<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Success Celebration Modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E4EDE8;color:#10241A;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:700px;height:580px;border-radius:28px;background:#F4F8F6;overflow:hidden;box-shadow:0 40px 60px -34px rgba(16,36,26,.5),inset 0 0 0 1px rgba(16,36,26,.07)}
.pg{position:absolute;inset:0;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}.pg .hd{grid-column:1/3;height:28px;width:44%;border-radius:8px;background:#D9E6DF}.pg i{height:110px;border-radius:16px;background:#E8F0EC}
.bk{position:absolute;inset:0;background:rgba(10,30,20,.45);backdrop-filter:blur(3px);opacity:0;transition:opacity .5s}.bk.on{opacity:1}
.m{position:absolute;left:50%;top:50%;width:400px;margin:-240px 0 0 -200px;background:#fff;border-radius:30px;padding:34px 28px 26px;text-align:center;box-shadow:0 36px 70px -20px rgba(0,0,0,.5);transform:translateY(80px) scale(.88);opacity:0;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .4s}.m.on{transform:none;opacity:1}
.rg{position:relative;width:96px;height:96px;margin:0 auto 18px}.rg svg{width:100%;height:100%;overflow:visible}.rg .bg{fill:none;stroke:#E4F4EA;stroke-width:7}.rg .cr{fill:none;stroke:#16A34A;stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transform:rotate(-90deg);transform-origin:50% 50%}.rg .ck{fill:none;stroke:#16A34A;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.m.on .cr{stroke-dashoffset:0;transition:stroke-dashoffset .8s .25s cubic-bezier(.4,0,.2,1)}.m.on .ck{stroke-dashoffset:0;transition:stroke-dashoffset .5s 1s ease-out}
.rg::after{content:"";position:absolute;inset:0;border-radius:50%;background:#16A34A;opacity:0;z-index:-1}.m.on .rg::after{animation:pl 1.200s 1.300s ease-out}@keyframes pl{from{opacity:.45;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
.m h2{font-size:28px;font-weight:800;letter-spacing:-.045em}.m>p{font-size:14.500px;color:#5F7A6C;margin:4px 0 18px}
.am{font:800 52px/1 'Bricolage Grotesque';letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin-bottom:16px}.am span{font-size:24px;color:#5F7A6C;letter-spacing:0;margin-right:2px}
.rc{padding:6px 16px;border-radius:18px;background:#F4F8F6;text-align:left;margin-bottom:18px}.rc div{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px dashed #D5E3DB;opacity:0;transform:translateY(6px);transition:all .4s}.rc div:last-child{border:0}.rc span{color:#6F887A;font-weight:600}.rc b{font:500 13px 'DM Mono'}.m.on .rc div{opacity:1;transform:none;transition-delay:calc(var(--i)*.12s + 1.400s)}
.bt{width:100%;border:0;border-radius:16px;padding:15px;background:#10241A;color:#fff;font:800 15.500px 'Bricolage Grotesque';cursor:pointer;transition:transform .15s}.bt.pr{transform:scale(.96)}.bt:focus-visible{outline:3px solid #16A34A;outline-offset:3px}
.cf{position:absolute;left:50%;top:38%;width:9px;height:9px;border-radius:2px;background:var(--k);pointer-events:none;animation:cf 1.800s cubic-bezier(.15,.8,.3,1) forwards;z-index:9}@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(max-width:480px){.m{width:92%;margin-left:-46%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="st" id="st"><div class="pg"><div class="hd"></div><i></i><i></i><i></i><i></i></div><div class="bk" id="bk"></div>
<div class="m" id="m"><div class="rg"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="cr" cx="50" cy="50" r="42" pathLength="1"/><path class="ck" d="M30 52 L45 66 L71 36" pathLength="1"/></svg></div><h2>Payment complete</h2><p>Thank you, Maya. Your receipt is on its way.</p><div class="am"><span>$</span><b id="am">0.00</b></div><div class="rc"><div style="--i:0"><span>Plan</span><b>Pro · Annual</b></div><div style="--i:1"><span>Card</span><b>Visa •••• 4417</b></div><div style="--i:2"><span>Receipt</span><b>#INV-20418</b></div></div><button class="bt" id="bt">Back to dashboard</button></div></div>
<script>
const $=id=>document.getElementById(id),m=$('m'),sl=t=>new Promise(r=>setTimeout(r,t));let off=false,tw=0;
function count(to,d){cancelAnimationFrame(tw);const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);$('am').textContent=(to*e).toFixed(2);if(k<1)tw=requestAnimationFrame(f)})(t0)}
function confetti(){const C=['#16A34A','#F59E0B','#EC4899','#3B82F6','#8B5CF6'],st=$('st');for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';const a=-Math.PI/2+(Math.random()-.5)*2.800,d=140+Math.random()*190;c.style.cssText='--k:'+C[i%5]+';--x:'+Math.cos(a)*d+'px;--y:'+(Math.sin(a)*d+90)+'px;--r:'+(Math.random()*700-350)+'deg;'+(i%3?'':'border-radius:50%;')+'width:'+(6+Math.random()*6)+'px;height:'+(6+Math.random()*8)+'px;animation-delay:'+(Math.random()*.12)+'s';st.appendChild(c);setTimeout(()=>c.remove(),2000)}}
function show(inst){$('bk').classList.add('on');if(inst){m.style.transition='none';m.querySelectorAll('*').forEach(e=>e.style.transition='none');m.classList.add('on');$('am').textContent='148.00';void m.offsetWidth;m.style.transition='';m.querySelectorAll('*').forEach(e=>e.style.transition='')}else{m.classList.add('on');count(148,1400);setTimeout(confetti,950)}}
function hide(){m.classList.remove('on');$('bk').classList.remove('on')}
$('bt').onclick=()=>{off=true;hide()};show(true);document.querySelector('.st').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a payment-complete dialog celebrates; the backdrop blurs and the card springs up, a green ring draws itself clockwise, the checkmark strokes in and the ring sends out one pulse, confetti fires from behind the card in a fan, the amount counts up to the total and the three receipt lines slide in one by one, then Back to dashboard presses and the card drops away before the loop restarts, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3600);while(!off){const b=$('bt');b.classList.add('pr');await sl(260);b.classList.remove('pr');hide();await sl(1400);if(off)return;m.querySelectorAll('.cr,.ck').forEach(e=>{e.style.transition='none'});m.classList.remove('on');void m.offsetWidth;m.querySelectorAll('.cr,.ck').forEach(e=>e.style.transition='');show(false);await sl(5200)}})()}
</script></body></html>
