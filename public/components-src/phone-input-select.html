<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Phone Input with Country Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EEF1F7;color:#12172E;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{position:relative;width:100%;max-width:440px;min-height:460px;background:#fff;border-radius:26px;padding:28px;box-shadow:0 40px 70px -44px rgba(18,23,46,.5),0 0 0 1px rgba(18,23,46,.06)}
.w h1{font-size:21px;font-weight:700;letter-spacing:-.035em}.w>p{color:#6D7498;font-size:14.5px;margin:4px 0 20px}
.lb{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}
.in{position:relative;display:flex;border:1.5px solid #DADFF0;border-radius:16px;background:#fff;transition:all .2s}.in:focus-within,.in.op{border-color:#4F46E5;box-shadow:0 0 0 4px rgba(79,70,229,.12)}.in.bad{border-color:#E5484D}.in.ok{border-color:#16A34A}
.cs{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0 12px 0 14px;border-right:1.5px solid #ECEFF8;cursor:pointer;font:600 15px 'Inter';color:#12172E;border-radius:16px 0 0 16px}.cs:focus-visible{outline:2px solid #4F46E5;outline-offset:-2px}.cs svg.ch{transition:transform .2s;color:#8A91B6}.in.op .cs svg.ch{transform:rotate(180deg)}
.fl{width:24px;height:17px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}.fl svg{display:block;width:100%;height:100%}
.in input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 17px 'JetBrains Mono',monospace;padding:15px 14px;color:#12172E;letter-spacing:.02em}.in input::placeholder{color:#B3B9D6}
.st{display:grid;place-items:center;width:44px;color:#16A34A;opacity:0;transition:opacity .2s}.in.ok .st{opacity:1}
.hn{margin-top:8px;font-size:13px;color:#8A91B6;min-height:20px}.hn.bad{color:#DC2626}.hn.ok{color:#16A34A}
.dd{position:absolute;left:28px;right:28px;top:164px;background:#fff;border:1px solid #E5E8F5;border-radius:18px;box-shadow:0 30px 50px -16px rgba(18,23,46,.4);padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top;pointer-events:none;transition:all .2s cubic-bezier(.3,1.2,.5,1);z-index:6}.dd.op{opacity:1;transform:none;pointer-events:auto}
.dd .sr{display:flex;align-items:center;gap:8px;background:#F3F5FB;border-radius:12px;padding:0 12px;margin-bottom:4px;color:#8A91B6}.dd .sr input{flex:1;border:0;outline:0;background:none;font:500 14px 'Inter';padding:10px 0;color:#12172E}
.dd ul{list-style:none;max-height:190px;overflow:auto}.dd li button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;font:500 14px 'Inter';color:#12172E;text-align:left}.dd li button:hover,.dd li button.hl{background:#F1F3FC}.dd li button:focus-visible{outline:2px solid #4F46E5}.dd li b{margin-left:auto;font:500 13px 'JetBrains Mono',monospace;color:#8A91B6}.dd li[aria-selected=true] button{color:#4F46E5}
.sv{margin-top:20px;width:100%;border:0;background:#4F46E5;color:#fff;border-radius:14px;padding:14px;font:700 15px 'Inter';cursor:pointer}.sv:disabled{background:#C9CCEA;cursor:default}.sv:focus-visible{outline:3px solid #12172E;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w" id="w"><h1>Verify your number</h1><p>We will text you a 6-digit code to confirm it is you.</p><label class="lb" for="ph">Mobile number</label>
<div class="in op" id="in"><button class="cs" id="cs" aria-haspopup="listbox" aria-expanded="true" aria-label="Country"><span class="fl" id="fl"></span><span id="cc">+1</span><svg class="ch" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><input id="ph" type="tel" inputmode="tel" placeholder="(555) 123-4567" aria-label="Phone number" autocomplete="off"><span class="st"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span></div><div class="hn" id="hn"></div>
<div class="dd op" id="dd"><label class="sr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" placeholder="Search country" aria-label="Search country" autocomplete="off"></label><ul id="ls" role="listbox"></ul></div>
<button class="sv" id="sv" disabled>Send code</button></div>
<script>
const F={us:'<svg viewBox="0 0 24 17"><rect width="24" height="17" fill="#fff"/><g fill="#B22234"><rect y="0" width="24" height="1.300"/><rect y="2.600" width="24" height="1.300"/><rect y="5.200" width="24" height="1.300"/><rect y="7.800" width="24" height="1.300"/><rect y="10.400" width="24" height="1.300"/><rect y="13" width="24" height="1.300"/><rect y="15.600" width="24" height="1.400"/></g><rect width="10" height="9.100" fill="#3C3B6E"/></svg>',gb:'<svg viewBox="0 0 24 17"><rect width="24" height="17" fill="#012169"/><path d="M0 0l24 17M24 0 0 17" stroke="#fff" stroke-width="3"/><path d="M0 0l24 17M24 0 0 17" stroke="#C8102E" stroke-width="1.200"/><path d="M12 0v17M0 8.500h24" stroke="#fff" stroke-width="5"/><path d="M12 0v17M0 8.500h24" stroke="#C8102E" stroke-width="3"/></svg>',de:'<svg viewBox="0 0 24 17"><rect width="24" height="5.700" fill="#000"/><rect y="5.700" width="24" height="5.700" fill="#D00"/><rect y="11.400" width="24" height="5.700" fill="#FFCE00"/></svg>',fr:'<svg viewBox="0 0 24 17"><rect width="8" height="17" fill="#0055A4"/><rect x="8" width="8" height="17" fill="#fff"/><rect x="16" width="8" height="17" fill="#EF4135"/></svg>',jp:'<svg viewBox="0 0 24 17"><rect width="24" height="17" fill="#fff"/><circle cx="12" cy="8.500" r="5" fill="#BC002D"/></svg>',br:'<svg viewBox="0 0 24 17"><rect width="24" height="17" fill="#009C3B"/><path d="M12 2l9 6.500-9 6.500-9-6.500z" fill="#FFDF00"/><circle cx="12" cy="8.500" r="3.200" fill="#002776"/></svg>',in:'<svg viewBox="0 0 24 17"><rect width="24" height="5.700" fill="#FF9933"/><rect y="5.700" width="24" height="5.700" fill="#fff"/><rect y="11.400" width="24" height="5.700" fill="#138808"/><circle cx="12" cy="8.500" r="2" fill="none" stroke="#000080" stroke-width=".7"/></svg>'};
const C=[['us','United States','+1','(###) ###-####',10],['gb','United Kingdom','+44','#### ######',10],['de','Germany','+49','#### #######',11],['fr','France','+33','# ## ## ## ##',9],['jp','Japan','+81','## #### ####',10],['br','Brazil','+55','(##) #####-####',11],['in','India','+91','##### #####',10]];
let cur=0;const w=document.getElementById('w'),dd=document.getElementById('dd'),inn=document.getElementById('in'),ph=document.getElementById('ph'),ls=document.getElementById('ls'),q=document.getElementById('q');
function fmt(d,m){let o='',i=0;for(const c of m){if(i>=d.length)break;if(c==='#')o+=d[i++];else o+=c}return o}
function render(){const t=q.value.toLowerCase();ls.innerHTML=C.map((c,i)=>({c,i})).filter(x=>x.c[1].toLowerCase().includes(t)||x.c[2].includes(t)).map(x=>'<li role="option" aria-selected="'+(x.i===cur)+'"><button data-i="'+x.i+'"><span class="fl">'+F[x.c[0]]+'</span>'+x.c[1]+'<b>'+x.c[2]+'</b></button></li>').join('')}
function sel(i){cur=i;document.getElementById('fl').innerHTML=F[C[i][0]];document.getElementById('cc').textContent=C[i][2];ph.placeholder=C[i][3].replace(/#/g,'5');open(false);ph.value=fmt(ph.value.replace(/\D/g,''),C[i][3]);chk();ph.focus()}
function open(o){dd.classList.toggle('op',o);inn.classList.toggle('op',o);document.getElementById('cs').setAttribute('aria-expanded',o);if(o){q.value='';render();setTimeout(()=>q.focus(),50)}}
function chk(){const d=ph.value.replace(/\D/g,''),n=C[cur][4],h=document.getElementById('hn');inn.classList.toggle('ok',d.length===n);inn.classList.toggle('bad',d.length>n);h.className='hn'+(d.length===n?' ok':d.length>n?' bad':'');h.textContent=d.length===n?'Looks good. We will text '+C[cur][2]+' '+ph.value+'.':d.length>n?'That number is too long.':d.length?(n-d.length)+' more digit'+(n-d.length>1?'s':'')+' needed':'';document.getElementById('sv').disabled=d.length!==n}
ls.addEventListener('click',e=>{const b=e.target.closest('button');if(b)sel(+b.dataset.i)});q.addEventListener('input',render);ph.addEventListener('input',()=>{ph.value=fmt(ph.value.replace(/\D/g,'').slice(0,C[cur][4]+1),C[cur][3]);chk()});
document.getElementById('cs').onclick=()=>open(!dd.classList.contains('op'));document.addEventListener('keydown',e=>{if(e.key==='Escape')open(false)});document.addEventListener('pointerdown',e=>{if(!dd.contains(e.target)&&!inn.contains(e.target))open(false)});
document.getElementById('sv').onclick=e=>{e.target.textContent='Code sent'};sel(0);open(true);
</script></body></html>
