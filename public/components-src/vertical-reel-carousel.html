<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vertical Reel Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A12;color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(600px 460px at 50% 50%,rgba(236,72,153,.18),transparent 70%)}
.ph{position:relative;width:min(100%,290px);aspect-ratio:9/17.200;border-radius:44px;background:#000;padding:8px;box-shadow:0 50px 70px -30px #000,0 0 0 2px #25252F,inset 0 0 0 2px #14141C}
.sc{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#111}
.nt{position:absolute;left:50%;top:10px;width:78px;height:22px;margin-left:-39px;border-radius:99px;background:#000;z-index:8}
.tk{position:absolute;inset:0;transition:transform .8s cubic-bezier(.65,0,.2,1)}
.rl{position:relative;height:100%;overflow:hidden}.rl svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 25%,transparent 55%,rgba(0,0,0,.72))}
.pb{position:absolute;left:14px;right:14px;top:40px;display:flex;gap:4px;z-index:6}.pb i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.pb i b{display:block;height:100%;width:var(--w,0%);background:#fff}
.cp{position:absolute;left:16px;right:64px;bottom:22px;z-index:5}.cp .us{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:8px}.cp .us i{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:800 13px 'Outfit';font-style:normal;box-shadow:0 0 0 2px #fff}.cp .us em{font-style:normal;font-size:11.500px;font-weight:700;padding:3px 9px;border-radius:99px;border:1.500px solid #fff}
.cp p{font-size:14px;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.6)}.cp small{display:block;margin-top:6px;font:500 11.500px 'DM Mono';opacity:.8}
.ac{position:absolute;right:10px;bottom:30px;z-index:5;display:grid;gap:18px;justify-items:center}.ac div{text-align:center;font-size:12px;font-weight:700}.ac svg{width:30px;height:30px;display:block;margin:0 auto 3px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}.ac .lk.on svg{fill:#FF3B6B;stroke:#FF3B6B;animation:pp .45s cubic-bezier(.3,2,.5,1)}@keyframes pp{from{transform:scale(.5)}}
.hr{position:absolute;left:50%;top:48%;width:96px;height:96px;margin:-48px 0 0 -48px;z-index:7;pointer-events:none;opacity:0}.hr svg{width:100%;height:100%;fill:#FF3B6B;stroke:none;filter:drop-shadow(0 6px 14px rgba(255,59,107,.7))}.hr.go{animation:hb .9s ease-out}@keyframes hb{0%{opacity:0;transform:scale(.3) rotate(-14deg)}25%{opacity:1;transform:scale(1.15) rotate(6deg)}55%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:translateY(-40px) scale(1.1)}}
</style></head><body>
<div class="ph"><div class="sc" id="sc"><i class="nt"></i><div class="pb" id="pb"></div><div class="tk" id="tk"></div><div class="hr" id="hr"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.200-8-11a4.800 4.800 0 0 1 8-3.500A4.800 4.800 0 0 1 20 10c0 5.800-8 11-8 11Z"/></svg></div></div></div>
<script>
function scene(s){const r=(n=1)=>{s=(s*9301+49297)%233280;return s/233280*n};const P=[['#1B2A6B','#E85D75','#FFB86B'],['#0B3B3C','#2FA58B','#F4E285'],['#3A1C5B','#C4478D','#FF9E7A'],['#10243A','#3D7BA8','#F2D8A7'],['#3B1A1A','#D1583B','#F8C37A']][Math.floor(r(5))];const id='g'+Math.floor(s);let h='<svg viewBox="0 0 270 520" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P[0]+'"/><stop offset=".55" stop-color="'+P[1]+'"/><stop offset="1" stop-color="'+P[2]+'"/></linearGradient></defs><rect width="270" height="520" fill="url(#'+id+')"/><circle cx="'+(70+r(130))+'" cy="'+(150+r(90))+'" r="'+(28+r(20))+'" fill="#FFF3D1" opacity=".95"/>';for(let l=0;l<5;l++){let d='M0 520L0 '+(300+l*40);const a=26+r(40),f=.01+r(.02),ph=r(6);for(let x=0;x<=270;x+=8)d+=' L'+x+' '+(300+l*40-a*Math.abs(Math.sin(x*f+ph))-a*.35*Math.sin(x*f*2.3+ph*2)).toFixed(1);d+=' L270 520Z';h+='<path d="'+d+'" fill="#0C0A14" opacity="'+(.2+l*.2)+'"/>'}return h+'</svg>'}
const R=[['nomadlena','#F43F5E','L','Golden hour at the ridge, no filter, no crowd.','4:12 · original audio',12400],['peak.kai','#0EA5E9','K','The one trail marker that changed my route.','0:38 · Kai Tanaka',8920],['soul.salt','#F59E0B','S','Salt flats at sunrise, 40 seconds of silence.','0:40 · Alba Reyes',21300],['foggy.fields','#10B981','F','Fog rolled in and the whole valley disappeared.','0:29 · Mara Lindqvist',5610]];
const tk=document.getElementById('tk'),pb=document.getElementById('pb'),$=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms));const bars=[];let cur=0,off=false,pr=0;const fmt=n=>n>=1000?(n/1000).toFixed(1)+'K':n;
R.forEach((r,i)=>{const d=document.createElement('div');d.className='rl';d.style.cssText='position:absolute;left:0;right:0;top:'+(i*100)+'%;height:100%';d.innerHTML=scene(i*19+4)+'<div class="cp"><div class="us"><i style="--c:'+r[1]+'">'+r[2]+'</i>@'+r[0]+'<em>Follow</em></div><p>'+r[3]+'</p><small>♪ '+r[4]+'</small></div><div class="ac"><div class="lk"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.200-8-11a4.800 4.800 0 0 1 8-3.500A4.800 4.800 0 0 1 20 10c0 5.800-8 11-8 11Z"/></svg><span>'+fmt(r[5])+'</span></div><div><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.600 7.100L4 20l1-4.800A8 8 0 1 1 21 12Z"/></svg>'+Math.round(r[5]/30)+'</div><div><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>Share</div></div>';tk.appendChild(d);const b=document.createElement('i');b.innerHTML='<b></b>';pb.appendChild(b);bars.push(b.firstChild)});
function like(i,v){const lk=tk.children[i].querySelector('.lk');lk.classList.toggle('on',v);const s=lk.querySelector('span');s.textContent=fmt(R[i][5]+(v?1:0))}
function heart(){const h=$('hr');h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}
function go(i){cur=(i+R.length)%R.length;tk.style.transform='translateY(-'+cur*100+'%)';pr=0;bars.forEach((b,k)=>b.style.setProperty('--w',k<cur?'100%':'0%'))}
$('sc').addEventListener('dblclick',()=>{off=true;heart();like(cur,true)});$('sc').addEventListener('click',e=>{off=true;if(e.clientY<$('sc').getBoundingClientRect().top+300)go(cur+1);else go(cur-1)});
tk.style.transition='none';go(1);pr=.5;bars[1].style.setProperty('--w','50%');like(1,true);requestAnimationFrame(()=>requestAnimationFrame(()=>tk.style.transition=''));
/* Idle demo: a phone plays short vertical reels; a segmented bar at the top fills for the current reel, about a second in a big heart double-tap burst pops and the like counter ticks up, then the whole stack glides up to the next reel with an eased slide and the cycle repeats through four videos, until you tap or double-tap the screen. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let last=0,hd=false;requestAnimationFrame(function lp(n){const dt=Math.min(.05,(n-last)/1000||0);last=n;if(!off&&n>3000){pr+=dt/3.600;if(!hd&&pr>.28){hd=true;heart();like(cur,true)}if(pr>=1){hd=false;go(cur+1);if(cur===0)tk.querySelectorAll('.lk').forEach((l,i)=>like(i,false))}bars[cur].style.setProperty('--w',Math.min(1,pr)*100+'%')}requestAnimationFrame(lp)})}
</script></body></html>
