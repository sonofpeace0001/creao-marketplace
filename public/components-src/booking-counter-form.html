<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Booking Counter Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3E9DC;color:#2A1B10;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px;background:#FFFCF7;border-radius:30px;display:grid;grid-template-columns:1.2fr 1fr;overflow:hidden;box-shadow:0 40px 70px -40px rgba(80,40,10,.5),0 0 0 1px rgba(42,27,16,.07)}
.fm{padding:30px}.fm h1{font:700 28px 'Fraunces',serif;letter-spacing:-.025em}.fm p.sb{font-size:14.5px;color:#8A7358;margin:4px 0 22px}
.lb{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#A38B6C;margin:18px 0 8px}
.dt{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dt button{border:1.5px solid #EDE0CE;background:#fff;border-radius:14px;padding:8px 0;font:600 15px 'Outfit';color:#2A1B10;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:1px}.dt button small{font-size:10.5px;color:#A38B6C;font-weight:500;letter-spacing:.06em;text-transform:uppercase}.dt button:hover{border-color:#C2410C}.dt button[aria-pressed=true]{background:#C2410C;border-color:#C2410C;color:#fff;transform:translateY(-3px);box-shadow:0 12px 18px -10px #C2410C}.dt button[aria-pressed=true] small{color:#FED7AA}.dt button:focus-visible{outline:2px solid #2A1B10;outline-offset:2px}
.tm{display:flex;flex-wrap:wrap;gap:8px}.tm button{border:1.5px solid #EDE0CE;background:#fff;border-radius:99px;padding:8px 16px;font:600 14px 'Outfit';color:#2A1B10;cursor:pointer;transition:all .2s}.tm button:hover{border-color:#C2410C}.tm button[aria-pressed=true]{background:#2A1B10;border-color:#2A1B10;color:#fff}.tm button:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}.tm button:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
.gs{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid #EDE0CE;border-radius:18px;padding:10px 14px}.gs .l b{display:block;font-size:15.5px}.gs .l span{font-size:12.5px;color:#A38B6C}
.gs .ct{display:flex;align-items:center;gap:14px}.gs .ct button{width:38px;height:38px;border-radius:50%;border:1.5px solid #D9C7AE;background:#fff;color:#2A1B10;cursor:pointer;display:grid;place-items:center;transition:all .15s}.gs .ct button:hover:not(:disabled){background:#C2410C;border-color:#C2410C;color:#fff}.gs .ct button:disabled{opacity:.3;cursor:default}.gs .ct button:active{transform:scale(.88)}.gs .ct button:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
.gs .n{position:relative;width:28px;height:30px;overflow:hidden;text-align:center;font:700 22px/30px 'Fraunces',serif}.gs .n div{position:absolute;left:0;right:0;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}.gs .n b{display:block;height:30px;font-weight:700}
.sm{background:linear-gradient(160deg,#C2410C,#7C2D12);color:#FFF1E3;padding:30px;display:flex;flex-direction:column}
.sm .im{height:130px;border-radius:20px;background:linear-gradient(135deg,#FDBA74,#F472B6);position:relative;overflow:hidden;margin-bottom:18px}.sm .im::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-30px;height:90px;background:#7C2D12;border-radius:50% 50% 0 0;opacity:.7}.sm .im::after{content:"";position:absolute;right:22px;top:20px;width:42px;height:42px;border-radius:50%;background:#FEF3C7}
.sm h2{font:700 21px 'Fraunces',serif;letter-spacing:-.02em}.sm small{font-size:13px;opacity:.75}.sm .rw{display:flex;justify-content:space-between;font-size:14.5px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}.sm .rw b{font-weight:600}
.sm .tt{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;padding-top:18px}.sm .tt span{font-size:14px;opacity:.8}.sm .tt .am{display:flex;font:700 38px 'Fraunces',serif;letter-spacing:-.02em;height:44px;overflow:hidden}.dg{position:relative;width:.54em;height:44px;overflow:hidden}.dg div{position:absolute;left:0;right:0;transition:transform .5s cubic-bezier(.2,.9,.2,1)}.dg b{display:block;height:44px;line-height:44px;font-weight:700}.sp{line-height:44px}
.go{margin-top:14px;border:0;background:#FFF1E3;color:#7C2D12;border-radius:16px;padding:15px;font:700 16px 'Outfit';cursor:pointer}.go:focus-visible{outline:3px solid #fff;outline-offset:3px}.go.dn{background:#BBF7D0;color:#14532D}
@media(max-width:720px){.c{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><form class="fm" onsubmit="return false"><h1>Book your stay</h1><p class="sb">Pick a night, a time and your group size.</p><div class="lb">Date</div><div class="dt" id="dt"></div><div class="lb">Check-in time</div><div class="tm" id="tm"></div><div class="lb">Guests</div>
<div class="gs"><div class="l"><b>Adults</b><span>Ages 13 or above</span></div><div class="ct"><button type="button" id="mi" aria-label="Fewer adults"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></button><div class="n" id="gn" aria-live="polite"><div></div></div><button type="button" id="pl" aria-label="More adults"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
<div class="gs" style="margin-top:8px"><div class="l"><b>Nights</b><span>Up to 14</span></div><div class="ct"><button type="button" id="mi2" aria-label="Fewer nights"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></button><div class="n" id="nn"><div></div></div><button type="button" id="pl2" aria-label="More nights"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div></form>
<div class="sm"><div class="im"></div><h2>Harbour Light Cottage</h2><small>Lisbon, Portugal</small><div style="margin-top:14px"><div class="rw"><span id="r1"></span><b id="r1p"></b></div><div class="rw"><span>Cleaning fee</span><b>$45</b></div><div class="rw"><span>Service fee</span><b id="r3"></b></div></div><div class="tt"><span>Total</span><div class="am" id="am"></div></div><button class="go" id="go">Reserve now</button></div></div>
<script>
const $=id=>document.getElementById(id);const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],TM=['14:00','15:00','16:00','17:00','18:00'];let day=4,tm='16:00',ad=2,ni=3;const RATE=[96,96,96,104,128,142,118];
$('dt').innerHTML=D.map((d,i)=>'<button type="button" aria-pressed="'+(i===day)+'" data-i="'+i+'"><small>'+d+'</small>'+(11+i)+'</button>').join('');$('tm').innerHTML=TM.map((t,i)=>'<button type="button" aria-pressed="'+(t===tm)+'" data-t="'+t+'" '+(t==='18:00'?'disabled':'')+'>'+t+'</button>').join('');
function strip(el,v){el.firstChild.innerHTML=[...Array(15).keys()].map(n=>'<b>'+n+'</b>').join('');el.firstChild.style.transform='translateY(-'+(v*30)+'px)'}
function odo(v){const s='$'+v.toLocaleString('en-US');const el=$('am');let ds=[...el.querySelectorAll('.dg')];const nd=s.replace(/\D/g,'').length;if(ds.length!==nd){el.innerHTML=[...s].map(c=>/\d/.test(c)?'<div class="dg"><div>'+[...'0123456789'].map(n=>'<b>'+n+'</b>').join('')+'</div></div>':'<span class="sp">'+c+'</span>').join('');ds=[...el.querySelectorAll('.dg')];ds.forEach(d=>d.firstChild.style.transition='none');requestAnimationFrame(()=>requestAnimationFrame(()=>ds.forEach(d=>d.firstChild.style.transition='')))}const digs=s.replace(/\D/g,'');ds.forEach((d,i)=>d.firstChild.style.transform='translateY(-'+(+digs[i]*44)+'px)')}
function upd(){strip($('gn'),ad);strip($('nn'),ni);$('mi').disabled=ad<=1;$('pl').disabled=ad>=10;$('mi2').disabled=ni<=1;$('pl2').disabled=ni>=14;const base=RATE[day]*ni,extra=Math.max(0,ad-2)*18*ni,sv=Math.round((base+extra)*.12);$('r1').textContent='$'+RATE[day]+' x '+ni+' night'+(ni>1?'s':'')+(ad>2?' + extra guests':'');$('r1p').textContent='$'+(base+extra);$('r3').textContent='$'+sv;odo(base+extra+45+sv)}
$('dt').onclick=e=>{const b=e.target.closest('button');if(!b)return;day=+b.dataset.i;$('dt').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));upd()};$('tm').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;tm=b.dataset.t;$('tm').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
$('mi').onclick=()=>{ad--;upd()};$('pl').onclick=()=>{ad++;upd()};$('mi2').onclick=()=>{ni--;upd()};$('pl2').onclick=()=>{ni++;upd()};$('go').onclick=()=>{$('go').classList.add('dn');$('go').textContent='Reserved for '+D[day]+' '+(11+day)+' at '+tm;setTimeout(()=>{$('go').classList.remove('dn');$('go').textContent='Reserve now'},2200)};
[$('gn'),$('nn')].forEach(e=>e.firstChild.style.transition='none');upd();requestAnimationFrame(()=>requestAnimationFrame(()=>[$('gn'),$('nn')].forEach(e=>e.firstChild.style.transition='')));
</script></body></html>
