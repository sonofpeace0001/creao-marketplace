<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orbiting Integrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 400px at 50% 50%,#EAF0FF,#F7F9FF 60%);color:#10193A;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:center;width:100%;max-width:860px}
.tx small{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#4F6BFF}.tx h1{font-size:clamp(28px,4.4vw,42px);line-height:1.05;letter-spacing:-.045em;font-weight:800;margin:10px 0 14px}.tx p{font-size:16px;line-height:1.6;color:#5C6791;max-width:36ch;margin-bottom:22px}
.tx a{display:inline-flex;align-items:center;gap:8px;background:#10193A;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;padding:13px 20px;border-radius:12px;transition:transform .15s}.tx a:hover{transform:translateY(-2px)}.tx a:focus-visible{outline:3px solid #4F6BFF;outline-offset:3px}
.st{position:relative;width:min(100%,430px);aspect-ratio:1;margin:0 auto}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px dashed #C9D3F5;transform:translate(-50%,-50%)}
.r1{width:46%;height:46%}.r2{width:78%;height:78%}.r3{width:100%;height:100%;border-color:#DCE3FA}
.ct{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28%;background:linear-gradient(145deg,#5B7CFF,#7C4DFF);display:grid;place-items:center;color:#fff;box-shadow:0 20px 40px -12px rgba(91,124,255,.8),0 0 0 8px rgba(91,124,255,.12),0 0 0 18px rgba(91,124,255,.06);z-index:3}
.ct::after{content:"";position:absolute;inset:-8px;border-radius:34%;border:2px solid rgba(91,124,255,.5);animation:pu 2.4s ease-out infinite}@keyframes pu{from{transform:scale(1);opacity:.8}to{transform:scale(1.5);opacity:0}}
.orb{position:absolute;inset:0;animation:sp var(--d) linear infinite}.orb.rev{animation-direction:reverse}@keyframes sp{to{transform:rotate(360deg)}}
.it{position:absolute;left:50%;top:50%;width:var(--s);aspect-ratio:1;margin:calc(var(--s)/-2);transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1));z-index:2}
.it i{position:absolute;inset:0;border-radius:30%;background:#fff;display:grid;place-items:center;font:800 15px 'Plus Jakarta Sans';font-style:normal;color:var(--c);box-shadow:0 10px 22px -8px rgba(30,50,130,.35),0 0 0 1px rgba(30,50,130,.06);animation:cs var(--d) linear infinite;transition:transform .2s}
.orb.rev .it i{animation-direction:reverse}@keyframes cs{to{transform:rotate(-360deg)}}
.it:hover i{transform:scale(1.18)}
.it::after{content:attr(data-n);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;background:#10193A;color:#fff;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.it:hover::after{opacity:1}
.st:hover .orb,.st:hover .orb .it i{animation-play-state:paused}
@media(max-width:700px){.w{grid-template-columns:1fr;text-align:center}.tx p{margin-left:auto;margin-right:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="w"><div class="tx"><small>Integrations</small><h1>Plugs into the tools you already love.</h1><p>Connect 120+ apps in a click. Data flows both ways and stays in sync, automatically.</p><a href="#">Browse integrations <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
<div class="st" id="st" role="img" aria-label="Integration icons orbiting the product logo"><span class="ring r3"></span><span class="ring r2"></span><span class="ring r1"></span>
<div class="ct"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5M18 3v4h-4M6 21v-4h4"/></svg></div></div></div>
<script>
const st=document.getElementById('st');
const R=[{r:'23%',d:'26s',rev:0,s:'13%',I:[['S','Slack','#E01E5A',0],['N','Notion','#111827',120],['G','GitHub','#24292F',240]]},{r:'39%',d:'38s',rev:1,s:'12.5%',I:[['F','Figma','#A259FF',20],['L','Linear','#5E6AD2',92],['Z','Zoom','#2D8CFF',164],['D','Drive','#1FA463',236],['J','Jira','#0052CC',308]]},{r:'50%',d:'54s',rev:0,s:'11.5%',I:[['H','HubSpot','#FF7A59',0],['St','Stripe','#635BFF',51],['A','Asana','#F06A6A',103],['Sh','Shopify','#5E8E3E',154],['M','Mailchimp','#E8A800',206],['Ta','Tableau','#1F77B4',257],['Dc','Discord','#5865F2',309]]}];
R.forEach(o=>{const d=document.createElement('div');d.className='orb'+(o.rev?' rev':'');d.style.setProperty('--d',o.d);o.I.forEach(i=>{const e=document.createElement('div');e.className='it';e.dataset.n=i[1];e.style.cssText='--r:calc(var(--box) * '+(parseFloat(o.r)/100)+');--a:'+i[3]+'deg;--s:calc(var(--box) * '+(parseFloat(o.s)/100)+');--c:'+i[2];e.innerHTML='<i>'+i[0]+'</i>';d.appendChild(e)});st.appendChild(d)});
function sz(){st.style.setProperty('--box',st.clientWidth+'px')}sz();addEventListener('resize',sz);
</script></body></html>
