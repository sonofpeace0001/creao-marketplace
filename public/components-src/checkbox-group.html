<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Permission Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090B0F;color:#E6EAF2;font-family:'Albert Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 18px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:480px;background:#10141B;border:1px solid #1D2430;border-radius:24px;overflow:hidden;box-shadow:0 40px 80px -34px #000}
.hd{padding:22px 24px 16px}.hd small{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#4ADE80}.hd h1{font-size:21px;font-weight:700;letter-spacing:-.03em;margin-top:6px}.hd p{font-size:14px;color:#7B879B;margin-top:3px}
.all{display:flex;align-items:center;gap:14px;padding:14px 24px;background:#0D1117;border-block:1px solid #1B2230;cursor:pointer}.all b{font-size:15px;font-weight:600}.all span.n{margin-left:auto;font:500 12px 'JetBrains Mono',monospace;color:#6A7690}
.it{display:flex;align-items:center;gap:14px;padding:15px 24px;border-bottom:1px solid #161C27;cursor:pointer;transition:background .2s}.it:last-child{border-bottom:0}.it:hover{background:#131923}
.cb{position:relative;flex:none;width:22px;height:22px}.cb input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.cb i{position:absolute;inset:0;border-radius:7px;border:2px solid #343F54;background:#0D1117;display:grid;place-items:center;transition:all .2s;color:#06140B}
.cb svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.3,1.6,.4,1)}
.cb input:checked+i,.cb input:indeterminate+i{background:#4ADE80;border-color:#4ADE80}.cb input:checked+i .ck{opacity:1;transform:none}.cb input:indeterminate+i .dh{opacity:1;transform:none}
.cb input:focus-visible+i{box-shadow:0 0 0 4px rgba(74,222,128,.25)}
.tx b{display:block;font-size:15px;font-weight:600}.tx span{font-size:13px;color:#7B879B}
.ft{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#0D1117;border-top:1px solid #1B2230}
.ft span{font-size:13px;color:#7B879B}.ft button{border:0;border-radius:11px;padding:10px 18px;font:700 14px 'Albert Sans';background:#4ADE80;color:#06140B;cursor:pointer}.ft button:disabled{background:#1D2533;color:#566178;cursor:not-allowed}.ft button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><small>ACCESS · EDITOR ROLE</small><h1>What can this role do?</h1><p>Choose the permissions for “Content Editor”.</p></div>
 <label class="all"><span class="cb"><input type="checkbox" id="a" aria-label="Select all permissions"><i><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="position:absolute"><path d="m5 12.500 4.500 4.500L19 7"/></svg><svg class="dh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="position:absolute;opacity:0"><path d="M6 12h12"/></svg></i></span><b>All permissions</b><span class="n" id="n"></span></label>
 <div id="g"></div><div class="ft"><span id="s"></span><button id="sv">Save role</button></div></div>
<script>
const P=[['View content','See every page and draft',1],['Edit content','Change copy, images and layout',1],['Publish','Push changes live to the site',0],['Manage media','Upload and delete assets',1],['Invite people','Add collaborators to the workspace',0]];
const g=document.getElementById('g'),a=document.getElementById('a');
const ck='<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="position:absolute"><path d="m5 12.500 4.500 4.500L19 7"/></svg>';
g.innerHTML=P.map((p,i)=>'<label class="it"><span class="cb"><input type="checkbox" data-i="'+i+'"'+(p[2]?' checked':'')+' aria-label="'+p[0]+'"><i>'+ck+'</i></span><span class="tx"><b>'+p[0]+'</b><span>'+p[1]+'</span></span></label>').join('');
const cs=[...g.querySelectorAll('input')];
function sync(){const n=cs.filter(c=>c.checked).length;a.checked=n===cs.length;a.indeterminate=n>0&&n<cs.length;document.getElementById('n').textContent=n+'/'+cs.length;document.getElementById('s').textContent=n?n+' permission'+(n>1?'s':'')+' selected':'No permissions selected';document.getElementById('sv').disabled=!n}
cs.forEach(c=>c.addEventListener('change',sync));a.addEventListener('change',()=>{cs.forEach(c=>c.checked=a.checked);sync()});
document.getElementById('sv').onclick=e=>{e.target.textContent='Saved ✓';setTimeout(()=>e.target.textContent='Save role',1400)};sync();
</script></body></html>
