<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mesh Point Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0E12;color:#F3F1FA;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 14px;-webkit-font-smoothing:antialiased;user-select:none}
.c{width:100%;max-width:820px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.hd h1{font:italic 400 38px 'Instrument Serif',serif;letter-spacing:-.01em}.hd span{font-size:13px;color:#7F7C93}
.cv{position:relative;height:440px;border-radius:28px;overflow:hidden;background:#111;touch-action:none;box-shadow:0 40px 70px -34px #000}
.ly{position:absolute;inset:0;filter:saturate(1.15)}
.ly i{position:absolute;width:75%;height:75%;border-radius:50%;filter:blur(40px);transform:translate(-50%,-50%);opacity:.95;pointer-events:none;background:radial-gradient(circle,var(--c) 0,transparent 68%)}
.gn{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;pointer-events:none}
.pt{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 8px 16px -4px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.18);cursor:grab;transition:box-shadow .2s,transform .15s;z-index:3;touch-action:none;outline:0}.pt:hover{transform:scale(1.15)}.pt.dr{cursor:grabbing;transform:scale(1.25);box-shadow:0 14px 22px -4px rgba(0,0,0,.5),0 0 0 10px rgba(255,255,255,.25)}.pt:focus-visible{box-shadow:0 0 0 4px #fff}
.pt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.tl{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:99px;background:rgba(14,14,18,.5);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);z-index:4}
.tl button{border:0;background:none;color:#F3F1FA;font:600 13px 'Inter';padding:9px 16px;border-radius:99px;cursor:pointer}.tl button:hover{background:rgba(255,255,255,.14)}.tl button:focus-visible{outline:2px solid #fff}
.lb{position:absolute;left:26px;top:22px;z-index:4;pointer-events:none;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.8;mix-blend-mode:overlay}
</style></head><body>
<div class="c"><div class="hd"><h1>Mesh playground</h1><span>Drag the points. Tap one to recolor it.</span></div>
<div class="cv" id="cv"><div class="ly" id="ly"></div><svg class="gn"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg><div class="lb">Mesh / 5 points</div>
<div class="tl"><button id="rn">Randomize</button><button id="rs">Reset</button><button id="an">Animate</button></div></div></div>
<script>
const D=[['#FF5E5B',.2,.25],['#FFD166',.78,.2],['#06D6A0',.3,.78],['#4D96FF',.8,.72],['#B517FF',.52,.48]];let P=D.map(d=>({c:d[0],x:d[1],y:d[2]}));
const cv=document.getElementById('cv'),ly=document.getElementById('ly');const bl=[],pt=[];
P.forEach((p,i)=>{const b=document.createElement('i');ly.appendChild(b);bl.push(b);const e=document.createElement('div');e.className='pt';e.tabIndex=0;e.innerHTML='<input type="color" aria-label="Point '+(i+1)+' color">';e.querySelector('input').value=p.c;cv.appendChild(e);pt.push(e);
 let dr=false,moved=false;e.addEventListener('pointerdown',ev=>{if(ev.target.tagName==='INPUT'){}dr=true;moved=false;e.classList.add('dr');e.setPointerCapture(ev.pointerId)});
 e.addEventListener('pointermove',ev=>{if(!dr)return;moved=true;const r=cv.getBoundingClientRect();p.x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));p.y=Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height));draw()});
 e.addEventListener('pointerup',()=>{dr=false;e.classList.remove('dr')});e.querySelector('input').addEventListener('click',ev=>{if(moved)ev.preventDefault()});e.querySelector('input').addEventListener('input',ev=>{p.c=ev.target.value;draw()});
 e.addEventListener('keydown',ev=>{const s=.02;if(ev.key==='ArrowLeft')p.x=Math.max(0,p.x-s);if(ev.key==='ArrowRight')p.x=Math.min(1,p.x+s);if(ev.key==='ArrowUp')p.y=Math.max(0,p.y-s);if(ev.key==='ArrowDown')p.y=Math.min(1,p.y+s);draw()})});
function draw(){P.forEach((p,i)=>{bl[i].style.left=(p.x*100)+'%';bl[i].style.top=(p.y*100)+'%';bl[i].style.setProperty('--c',p.c);pt[i].style.left=(p.x*100)+'%';pt[i].style.top=(p.y*100)+'%';pt[i].style.setProperty('--c',p.c)})}
draw();
function tween(to,dur){const from=P.map(p=>({x:p.x,y:p.y}));const t0=performance.now();function s(n){const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);P.forEach((p,i)=>{p.x=from[i].x+(to[i].x-from[i].x)*e;p.y=from[i].y+(to[i].y-from[i].y)*e});draw();if(k<1)requestAnimationFrame(s)}requestAnimationFrame(s)}
document.getElementById('rs').onclick=()=>{P.forEach((p,i)=>{p.c=D[i][0];pt[i].querySelector('input').value=p.c});tween(D.map(d=>({x:d[1],y:d[2]})),600)};
document.getElementById('rn').onclick=()=>tween(P.map(()=>({x:.08+Math.random()*.84,y:.08+Math.random()*.84})),900);
let an=false;document.getElementById('an').onclick=e=>{an=!an;e.target.textContent=an?'Stop':'Animate';if(an)(function f(){if(!an)return;tween(P.map(()=>({x:.08+Math.random()*.84,y:.08+Math.random()*.84})),2600);setTimeout(f,2700)})()};
</script></body></html>
