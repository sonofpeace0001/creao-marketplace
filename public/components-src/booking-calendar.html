<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Booking Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8EEF8;color:#0F1B33;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{display:grid;grid-template-columns:230px 1.2fr 150px;width:100%;max-width:860px;background:#fff;border-radius:28px;box-shadow:0 40px 70px -44px rgba(15,27,51,.55),0 0 0 1px rgba(15,27,51,.06);overflow:hidden}
.in{padding:28px 24px;background:linear-gradient(170deg,#F4F8FF,#EBF1FF);border-right:1px solid #E4EBF8}
.in .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#EC4899);display:grid;place-items:center;color:#fff;font-weight:800;margin-bottom:14px}.in small{font-size:13px;color:#6B7BA0;font-weight:600}.in h1{font-size:21px;font-weight:800;letter-spacing:-.035em;margin:2px 0 14px}
.in .md{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#4A5A80;font-weight:600;margin-bottom:9px}.in .md svg{color:#6366F1;flex:none}
.cl{padding:28px 22px}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.ch b{font-size:16px;font-weight:800;letter-spacing:-.02em}.ch div{display:flex;gap:4px}.ch button{width:32px;height:32px;border:0;background:none;border-radius:10px;cursor:pointer;color:#4A5A80;display:grid;place-items:center}.ch button:hover{background:#EEF3FF}.ch button:focus-visible{outline:2px solid #6366F1}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.gr .w{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:#8A98B8;padding:6px 0}
.gr button{aspect-ratio:1;border:0;background:none;border-radius:50%;font:600 14px 'Plus Jakarta Sans';color:#0F1B33;cursor:pointer;position:relative;transition:all .2s cubic-bezier(.3,1.4,.5,1)}
.gr button.av2{background:#EEF3FF;color:#4F46E5}.gr button.av2:hover{background:#DCE6FF;transform:scale(1.1)}.gr button:disabled{color:#C3CCE0;cursor:default;background:none}.gr button.sel{background:#4F46E5;color:#fff;box-shadow:0 8px 16px -6px #4F46E5;transform:scale(1.06)}.gr button.td::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}.gr button:focus-visible{outline:2px solid #0F1B33;outline-offset:1px}
.tz{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12.5px;color:#6B7BA0;font-weight:600}
.sl{padding:28px 18px;border-left:1px solid #E4EBF8;display:flex;flex-direction:column}.sl .d{font-size:14px;font-weight:700;margin-bottom:12px}.sl .d span{color:#6B7BA0;font-weight:600}
.ts{display:grid;gap:8px;overflow-y:auto;max-height:310px;padding-right:2px}.ts button{border:1.5px solid #D9E3FA;background:#fff;color:#4F46E5;border-radius:12px;padding:11px;font:500 13.5px 'JetBrains Mono',monospace;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}.ts button:hover{border-color:#4F46E5;background:#F4F6FF}.ts button.sel{background:#0F1B33;border-color:#0F1B33;color:#fff}.ts button:disabled{opacity:.35;text-decoration:line-through;cursor:default}.ts button:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.cf{margin-top:auto;padding-top:12px}.cf button{width:100%;border:0;background:#4F46E5;color:#fff;border-radius:12px;padding:12px;font:700 14px 'Plus Jakarta Sans';cursor:pointer;box-shadow:0 12px 22px -10px #4F46E5;transition:transform .15s}.cf button:hover:not(:disabled){transform:translateY(-1px)}.cf button:disabled{background:#C9D0E8;box-shadow:none;cursor:default}.cf button:focus-visible{outline:3px solid #0F1B33;outline-offset:2px}
.ok{display:none;padding:50px 24px;text-align:center;grid-column:2/4}.ok i{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#DCFCE7;color:#16A34A;margin:0 auto 16px}.ok h2{font-size:22px;font-weight:800;letter-spacing:-.03em}.ok p{color:#6B7BA0;margin-top:6px;line-height:1.5}
.c.dn .cl,.c.dn .sl{display:none}.c.dn .ok{display:block}
@media(max-width:820px){.c{grid-template-columns:1fr}.in{border-right:0;border-bottom:1px solid #E4EBF8}.sl{border-left:0;border-top:1px solid #E4EBF8}.ts{grid-template-columns:repeat(3,1fr);max-height:none}.ok{grid-column:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c" id="c"><div class="in"><div class="av">MR</div><small>Maya Rowe</small><h1>30 min intro call</h1><div class="md"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>30 minutes</div><div class="md"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>Video call</div><div class="md"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20"/></svg>Europe/Lisbon</div></div>
<div class="cl"><div class="ch"><b id="mt"></b><div><button id="pv" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><button id="nx" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div></div><div class="gr" id="gr"></div><div class="tz"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Times shown in your timezone</div></div>
<div class="sl"><div class="d" id="dl">Pick a day</div><div class="ts" id="ts"></div><div class="cf"><button id="cf" disabled>Confirm</button></div></div>
<div class="ok" role="status"><i><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i><h2>You are booked</h2><p id="ok"></p></div></div>
<script>
const T=new Date(2026,10,9);let vy=2026,vm=10,sd=null,st=null;const gr=document.getElementById('gr'),ts=document.getElementById('ts');
const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
function cal(){document.getElementById('mt').textContent=M[vm]+' '+vy;let h=['M','T','W','T','F','S','S'].map(d=>'<span class="w">'+d+'</span>').join('');const f=(new Date(vy,vm,1).getDay()+6)%7,n=new Date(vy,vm+1,0).getDate();for(let i=0;i<f;i++)h+='<span></span>';
 for(let d=1;d<=n;d++){const dt=new Date(vy,vm,d),wk=dt.getDay()%6===0,past=dt<T,ok=!wk&&!past;h+='<button '+(ok?'class="av2'+(sd&&sd.getTime()===dt.getTime()?' sel':'')+(dt.getTime()===T.getTime()?' td':'')+'" data-d="'+d+'"':'disabled')+'>'+d+'</button>'}gr.innerHTML=h;gr.querySelectorAll('.av2').forEach(b=>b.onclick=()=>{sd=new Date(vy,vm,+b.dataset.d);st=null;cal();slots()})}
function slots(){if(!sd)return;document.getElementById('dl').innerHTML=sd.toLocaleDateString('en-US',{weekday:'short'})+' <span>'+sd.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span>';const t=['09:00','09:30','10:30','11:00','13:00','14:30','15:00','16:30'];ts.innerHTML=t.map((x,i)=>'<button '+((sd.getDate()+i)%5===0?'disabled':'')+' data-t="'+x+'">'+x+'</button>').join('');ts.querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{st=b.dataset.t;ts.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));document.getElementById('cf').disabled=false;document.getElementById('cf').textContent='Confirm '+st})}
document.getElementById('pv').onclick=()=>{vm--;if(vm<0){vm=11;vy--}cal()};document.getElementById('nx').onclick=()=>{vm++;if(vm>11){vm=0;vy++}cal()};
document.getElementById('cf').onclick=()=>{document.getElementById('ok').textContent=sd.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' at '+st+'. A calendar invite is on its way.';document.getElementById('c').classList.add('dn')};
sd=new Date(2026,10,12);cal();slots();ts.querySelector('button:not(:disabled):nth-child(3)').click();
</script></body></html>
