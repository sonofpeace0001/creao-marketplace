<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Which-Key Chord Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0B10;color:#E7EAF4;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ed{position:relative;width:100%;max-width:700px;height:460px;background:#0F1118;border-radius:22px;box-shadow:0 50px 80px -34px #000,0 0 0 1px rgba(255,255,255,.09);overflow:hidden;display:flex;flex-direction:column}
.tb{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#141722;border-bottom:1px solid rgba(255,255,255,.06);font:500 12px 'Fira Code';color:#7C86A8}.tb i{width:10px;height:10px;border-radius:50%;background:#2A2E42}.tb span{margin-left:10px}
.cd{flex:1;padding:16px 18px;font:400 13px/1.75 'Fira Code';color:#9AA4C6;overflow:hidden}.cd div{white-space:nowrap}.cd .ln{color:#4A5170;display:inline-block;width:26px}.cd .k{color:#F29E74}.cd .f{color:#8FD1B8}.cd .s{color:#E8C877}
.ts{position:absolute;right:16px;top:50px;padding:10px 16px;border-radius:12px;background:#34D399;color:#06281D;font-weight:800;font-size:13.500px;transform:translateY(-16px);opacity:0;transition:all .45s cubic-bezier(.3,1.6,.5,1)}.ts.on{transform:none;opacity:1}
.wk{position:absolute;left:12px;right:12px;bottom:12px;border-radius:18px;background:rgba(24,27,40,.96);backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 20px 40px -10px #000;padding:14px 16px 16px;transform:translateY(calc((1 - var(--v,0))*30px));opacity:var(--v,0);transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.wk .bc{display:flex;gap:6px;align-items:center;margin-bottom:12px;font:600 12px 'Fira Code';color:#8A94B8}.bc kbd{padding:3px 9px;border-radius:7px;background:#2A2F47;color:#fff;box-shadow:0 2px 0 #12141F}.bc em{font-style:normal;margin-left:6px;color:#A78BFA}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ky{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13.500px;font-weight:600;transition:background .2s,transform .2s,opacity .3s;animation:in .35s cubic-bezier(.3,1.5,.5,1) both}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.92)}}
.ky kbd{flex:none;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#2A2F47;color:#fff;font:600 13px 'Fira Code';box-shadow:0 2px 0 #12141F}.ky.g kbd{background:#4C3DB3}.ky.pr{background:rgba(167,139,250,.28);transform:scale(.95)}.ky.pr kbd{transform:translateY(2px);box-shadow:none;background:#8B5CF6}
@media(max-width:620px){.gr{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="ed" id="ed"><div class="tb"><i></i><i></i><i></i><span>atlas / src / app.tsx</span></div><div class="cd" id="cd"></div><div class="ts" id="ts"></div>
<div class="wk" id="wk"><div class="bc" id="bc"></div><div class="gr" id="gr"></div></div></div>
<script>
const TR={' ':{n:'leader',k:{f:{n:'+file',k:{o:{a:'Open file'},s:{a:'Save all'},r:{a:'Rename file'},n:{a:'New file'}}},b:{n:'+buffer',k:{b:{a:'Switch buffer'},d:{a:'Close buffer'},n:{a:'Next buffer'}}},g:{n:'+git',k:{s:{a:'Stage hunk'},c:{a:'Commit'},p:{a:'Push'},d:{a:'View diff'}}},t:{n:'+toggle',k:{w:{a:'Word wrap'},z:{a:'Zen mode'},t:{a:'Theme'}}}}}};
const $=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let off=false;
const CODE=['<span class="k">import</span> { Hero } <span class="k">from</span> <span class="s">"./hero"</span>;','','<span class="k">export default function</span> <span class="f">App</span>() {','  <span class="k">const</span> [theme, setTheme] = <span class="f">useState</span>(<span class="s">"light"</span>);','  <span class="k">return</span> (','    &lt;<span class="f">Layout</span> theme={theme}&gt;','      &lt;<span class="f">Hero</span> title=<span class="s">"Ship it"</span> /&gt;','    &lt;/<span class="f">Layout</span>&gt;','  );','}'];
$('cd').innerHTML=CODE.map((l,i)=>'<div><span class="ln">'+(i+1)+'</span>'+l+'</div>').join('');
function show(path,node){$('wk').style.setProperty('--v',1);const keys=Object.entries(node.k);$('bc').innerHTML=path.map(p=>'<kbd>'+(p===' '?'Space':p)+'</kbd>').join('')+'<em>'+(node.n||'')+'</em>';$('gr').innerHTML=keys.map(([k,v],i)=>'<div class="ky'+(v.k?' g':'')+'" data-k="'+k+'" style="animation-delay:'+i*40+'ms"><kbd>'+k+'</kbd>'+(v.a||v.n)+'</div>').join('')}
function hide(){$('wk').style.setProperty('--v',0)}
async function press(k){const e=[...document.querySelectorAll('#gr .ky')].find(x=>x.dataset.k===k);if(e){e.classList.add('pr');await sl(260)}}
show([' '],TR[' ']);show([' ','f'],TR[' '].k.f);$('gr').querySelectorAll('.ky').forEach(e=>e.style.animation='none');$('wk').style.transition='none';requestAnimationFrame(()=>requestAnimationFrame(()=>$('wk').style.transition=''));
document.getElementById('ed').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a which-key style chord palette; pressing the leader key slides up a panel listing the next keys as depressing keycaps with labels, group keys in violet, and each following key narrows the breadcrumb (Space, then f, then o) until an action fires and a green toast confirms, then the panel closes and a different chord runs (git commit, toggle zen mode), until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);const run=[[' ','f','o'],[' ','g','c'],[' ','t','z']];let i=0;while(!off){const ch=run[i++%run.length];hide();await sl(500);let node=TR[' '],path=[' '];show(path,node);await sl(900);for(const k of ch.slice(1)){await press(k);node=node.k[k];path.push(k);if(node.k){show(path,node);await sl(1000)}else{$('ts').textContent='✓ '+node.a;$('ts').classList.add('on');hide();await sl(1700);$('ts').classList.remove('on')}}await sl(700)}})()}
</script></body></html>
