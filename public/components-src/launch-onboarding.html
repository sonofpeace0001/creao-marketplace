<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Getting Started Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(600px 400px at 100% 0,#10261C,transparent 60%),#07090A;color:#E8F0EA;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:500px;background:#0E1311;border:1px solid #1B2620;border-radius:26px;padding:24px;box-shadow:0 40px 80px -34px #000}
.hd{display:flex;justify-content:space-between;align-items:flex-start}.hd h1{font-size:21px;font-weight:700;letter-spacing:-.035em}.hd p{font-size:14px;color:#7B9084;margin-top:4px}
.hd span{font:500 12px 'Geist Mono',monospace;color:#4ADE80;background:rgba(74,222,128,.1);padding:5px 10px;border-radius:99px}
.pb{height:7px;border-radius:7px;background:#17201B;margin:18px 0 16px;overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#4ADE80,#5EEAD4);transition:width .6s cubic-bezier(.3,1,.4,1)}
.st{border:1px solid #1B2620;border-radius:18px;margin-bottom:8px;background:#0B100E;transition:border-color .25s,background .25s}
.st.o{border-color:#2B4A38;background:#0F1612}
.st>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}.st>button:focus-visible{outline:2px solid #4ADE80;outline-offset:-2px;border-radius:18px}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #34443A;display:grid;place-items:center;color:#05140B;transition:all .3s cubic-bezier(.3,1.6,.4,1)}.ck svg{width:13px;height:13px;opacity:0;transform:scale(.3);transition:all .25s}
.st.d .ck{background:#4ADE80;border-color:#4ADE80}.st.d .ck svg{opacity:1;transform:none}
.t{flex:1;font-size:15.5px;font-weight:600;letter-spacing:-.01em}.st.d .t{color:#6B8074;text-decoration:line-through;text-decoration-color:#34443A}
.cv{color:#6B8074;transition:transform .25s}.st.o .cv{transform:rotate(180deg)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.st.o .bd{grid-template-rows:1fr}.bd>div{overflow:hidden}
.bd p{padding:0 16px 4px 56px;font-size:14px;color:#8CA295;line-height:1.55}
.ac{display:flex;gap:10px;padding:12px 16px 16px 56px}.ac button{border:0;border-radius:11px;padding:10px 16px;font:700 13.5px 'Inter Tight';cursor:pointer}.pr{background:#4ADE80;color:#05140B}.sc{background:#17201B;color:#C9DACF}
.ac button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Get started with Bloom</h1><p>Four quick steps to your first campaign.</p></div><span id="ct"></span></div><div class="pb"><i id="pb"></i></div><div id="l"></div></div>
<script>
const S=[['Create your account','Done — welcome aboard! You can edit your profile any time from Settings.',1],['Connect your store','Link Shopify, WooCommerce or upload a CSV of your customers. It takes about two minutes.',0],['Design your first email','Start from a template or build from scratch with our drag-and-drop editor.',0],['Send a test and launch','Preview on desktop and mobile, send yourself a test, then schedule your send.',0]];
let open=1;const l=document.getElementById('l'),ck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>';
function draw(){const d=S.filter(s=>s[2]).length;document.getElementById('ct').textContent=d+' / '+S.length;document.getElementById('pb').style.width=(d/S.length*100)+'%';
 l.innerHTML=S.map((s,i)=>'<div class="st'+(s[2]?' d':'')+(open===i?' o':'')+'"><button data-i="'+i+'" aria-expanded="'+(open===i)+'"><span class="ck">'+ck+'</span><span class="t">'+s[0]+'</span><svg class="cv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="bd"><div><p>'+s[1]+'</p>'+(s[2]?'':'<div class="ac"><button class="pr" data-d="'+i+'">Mark as done</button><button class="sc" data-s="'+i+'">Skip</button></div>')+'</div></div></div>').join('')}
l.addEventListener('click',e=>{const d=e.target.closest('[data-d]'),s=e.target.closest('[data-s]'),b=e.target.closest('.st>button');if(d){S[+d.dataset.d][2]=1;const n=S.findIndex(x=>!x[2]);open=n;draw();return}if(s){open=(+s.dataset.s+1)%S.length;draw();return}if(b){const i=+b.dataset.i;open=open===i?-1:i;draw()}});draw();
</script></body></html>
