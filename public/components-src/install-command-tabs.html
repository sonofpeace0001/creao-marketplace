<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Install Command Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ECEEF4;color:#14172B;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:700px}
.hd{margin-bottom:16px}.hd h1{font-size:26px;font-weight:700;letter-spacing:-.04em}.hd p{font-size:15px;color:#6A6F94;margin-top:4px}
.tm{border-radius:20px;overflow:hidden;background:#0D1117;box-shadow:0 36px 60px -30px rgba(10,14,30,.7),0 0 0 1px #1C2331}
.tb{display:flex;align-items:center;background:#0A0E14;border-bottom:1px solid #1A2130;padding:0 8px 0 6px}
.tb .tw{position:relative;display:flex}.tb button.t{position:relative;border:0;background:none;color:#7C86A0;padding:14px 16px;font:600 13.5px 'Inter';cursor:pointer;display:flex;align-items:center;gap:8px}.tb button.t[aria-selected=true]{color:#fff}.tb button.t:focus-visible{outline:2px solid #58A6FF;outline-offset:-3px;border-radius:8px}
.tb button.t i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ul{position:absolute;bottom:0;height:2px;background:#58A6FF;border-radius:2px;box-shadow:0 0 10px #58A6FF;transition:left .35s cubic-bezier(.4,1.3,.5,1),width .35s}
.cp{margin-left:auto;display:flex;align-items:center;gap:7px;border:1px solid #232B3D;background:#111826;color:#B5BFD6;border-radius:9px;padding:6px 12px;font:600 12.5px 'Inter';cursor:pointer;min-width:84px;justify-content:center;transition:all .25s}.cp:hover{border-color:#44527A;color:#fff}.cp.ok{background:#0F2A1B;border-color:#1F6B3F;color:#4ADE80}.cp:focus-visible{outline:2px solid #58A6FF}
.cp .ic{position:relative;width:14px;height:14px}.cp .ic svg{position:absolute;inset:0;transition:all .3s cubic-bezier(.3,1.6,.5,1)}.cp .ic .ck{opacity:0;transform:scale(.3) rotate(-60deg)}.cp.ok .ic .cc{opacity:0;transform:scale(.3) rotate(60deg)}.cp.ok .ic .ck{opacity:1;transform:none}
.bd{padding:20px 22px;font:400 14.5px/1.85 'JetBrains Mono',monospace;color:#C9D1D9;min-height:210px}
.ln{white-space:pre-wrap;word-break:break-word}.pr{color:#7EE787}.cm{color:#8B949E}.ok2{color:#7EE787}.in{color:#58A6FF}.wn{color:#E3B341}.dm{color:#6E7681}
.cur{display:inline-block;width:8px;height:16px;background:#58A6FF;vertical-align:-3px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.pb{display:inline-block;width:160px;height:8px;border-radius:8px;background:#1C2433;vertical-align:middle;overflow:hidden;margin:0 8px}.pb i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,#58A6FF,#7EE787);border-radius:8px;transition:width .2s}
.rp{margin-top:14px;border:1px solid #D4D8E8;background:#fff;border-radius:99px;padding:8px 18px;font:600 13px 'Inter';color:#4A4F78;cursor:pointer}.rp:focus-visible{outline:2px solid #58A6FF}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Get started in seconds</h1><p>Pick your package manager and run the command.</p></div>
<div class="tm"><div class="tb"><div class="tw" id="tw" role="tablist"><span class="ul" id="ul"></span></div><button class="cp" id="cp"><span class="ic"><svg class="cc" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><svg class="ck" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><span id="cl">Copy</span></button></div>
<div class="bd" id="bd"></div></div><button class="rp" id="rp">Replay install</button></div>
<script>
const PM={npm:['npm','npm install @meridian/ui','#CB3837'],pnpm:['pnpm','pnpm add @meridian/ui','#F69220'],yarn:['yarn','yarn add @meridian/ui','#2C8EBB'],bun:['bun','bun add @meridian/ui','#FBF0DF']};
const tw=document.getElementById('tw'),ul=document.getElementById('ul'),bd=document.getElementById('bd');let cur='pnpm',tm=[];
Object.keys(PM).forEach(k=>{const b=document.createElement('button');b.className='t';b.role='tab';b.dataset.k=k;b.innerHTML='<i style="--c:'+PM[k][2]+'"></i>'+k;b.onclick=()=>set(k);tw.appendChild(b)});
function mark(){tw.querySelectorAll('.t').forEach(b=>{const on=b.dataset.k===cur;b.setAttribute('aria-selected',on);if(on){ul.style.left=b.offsetLeft+'px';ul.style.width=b.offsetWidth+'px'}})}
function clr(){tm.forEach(clearTimeout);tm=[]}
function later(f,d){tm.push(setTimeout(f,d))}
function run(instant){clr();bd.innerHTML='';const cmd=PM[cur][1];const l1=document.createElement('div');l1.className='ln';l1.innerHTML='<span class="pr">$ </span><span id="ty"></span><span class="cur" id="cu"></span>';bd.appendChild(l1);const lines=[['',0],['<span class="dm">Progress: resolved 142, reused 142, downloaded 0</span>',500],['<span class="in">+</span> @meridian/ui <span class="dm">3.4.0</span>',900],['<span class="dm">Packages:</span> <span class="ok2">+1</span>',1100],['PBAR',1250],['<span class="ok2">Done</span> in 1.4s',2300],['',2400],['<span class="cm"># Then import it in your app</span>',2500],['<span class="in">import</span> { Button } <span class="in">from</span> <span class="wn">"@meridian/ui"</span>',2650]];
 const ty=document.getElementById('ty');if(instant){ty.textContent=cmd;document.getElementById('cu').remove();lines.forEach(l=>{if(l[0]==='PBAR'){const d=document.createElement('div');d.className='ln';d.innerHTML='<span class="dm">Installing</span><span class="pb"><i style="--p:100%"></i></span><span class="ok2">100%</span>';bd.appendChild(d)}else{const d=document.createElement('div');d.className='ln';d.innerHTML=l[0]||'&nbsp;';bd.appendChild(d)}});return}
 let i=0;(function t(){ty.textContent=cmd.slice(0,++i);if(i<cmd.length)later(t,38);else{document.getElementById('cu').remove();lines.forEach(l=>later(()=>{if(l[0]==='PBAR'){const d=document.createElement('div');d.className='ln';d.innerHTML='<span class="dm">Installing</span><span class="pb"><i id="pi"></i></span><span id="pt" class="ok2">0%</span>';bd.appendChild(d);let p=0;const iv=setInterval(()=>{p=Math.min(100,p+9);document.getElementById('pi').style.setProperty('--p',p+'%');document.getElementById('pt').textContent=p+'%';if(p>=100)clearInterval(iv)},100)}else{const d=document.createElement('div');d.className='ln';d.innerHTML=l[0]||'&nbsp;';bd.appendChild(d)}},l[1]))}})()}
function set(k){cur=k;mark();run(false)}
document.getElementById('cp').onclick=()=>{const b=document.getElementById('cp');navigator.clipboard&&navigator.clipboard.writeText(PM[cur][1]).catch(()=>{});b.classList.add('ok');document.getElementById('cl').textContent='Copied';setTimeout(()=>{b.classList.remove('ok');document.getElementById('cl').textContent='Copy'},1600)};
document.getElementById('rp').onclick=()=>run(false);
mark();run(true);(document.fonts&&document.fonts.ready||Promise.resolve()).then(mark);
</script></body></html>
