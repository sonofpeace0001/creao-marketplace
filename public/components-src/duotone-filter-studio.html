<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Duotone Filter Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
@property --s{syntax:'<color>';inherits:true;initial-value:#1B1464}
@property --h{syntax:'<color>';inherits:true;initial-value:#FF8AC8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D0E16;color:#EEF0FA;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:720px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:stretch}
.im{--s:#1B1464;--h:#FF8AC8;align-self:start;min-width:0;position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 40px 60px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.1);transition:--s .8s,--h .8s,box-shadow .8s;isolation:isolate}
.im svg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:grayscale(1) contrast(1.15) brightness(1.02)}
.im::before,.im::after{content:"";position:absolute;inset:0;pointer-events:none}.im svg{z-index:0}.im::before{background:var(--h);mix-blend-mode:multiply;z-index:1}.im::after{background:var(--s);mix-blend-mode:lighten;z-index:2}
.im.orig svg{filter:none}.im.orig::before,.im.orig::after{opacity:0}
.lb{position:absolute;left:16px;bottom:16px;z-index:3;padding:8px 14px;border-radius:99px;background:rgba(10,10,18,.6);backdrop-filter:blur(8px);font:700 12.500px 'Sora';box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);display:flex;align-items:center;gap:10px}.lb i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--h),var(--s));display:block}
.pn{display:grid;gap:12px;align-content:start}
.pn h1{font-size:24px;font-weight:800;letter-spacing:-.045em}.pn p{font-size:13.500px;color:#8A8FAD;margin-top:-4px;line-height:1.5}
.pl{display:grid;gap:8px}
.p{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:10px 12px;background:#151724;color:inherit;font:inherit;cursor:pointer;text-align:left;box-shadow:inset 0 0 0 1.500px transparent;transition:all .25s}
.p:hover{background:#1B1E31}.p[aria-pressed=true]{background:#1D2038;box-shadow:inset 0 0 0 1.500px var(--h)}.p:focus-visible{outline:2px solid #fff;outline-offset:2px}
.p i{width:44px;height:30px;border-radius:9px;background:linear-gradient(90deg,var(--s),var(--h));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);flex:none}
.p b{font-size:14px;font-weight:700;display:block}.p small{font:500 11px 'Geist Mono';color:#7C82A3}
.ex{font:500 11.500px 'Geist Mono';color:#6D7396;line-height:1.7;padding:10px 12px;border-radius:14px;background:#11131E;margin-top:2px}.ex b{color:#C9CDF0;font-weight:600}
@media(max-width:620px){.w{grid-template-columns:1fr}.im{aspect-ratio:16/11}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="im" id="im"></div><div class="pn"><h1>One photo, six moods</h1><p>A duotone maps shadows to one colour and highlights to another.</p><div class="pl" id="pl" role="group" aria-label="Duotone presets"></div><div class="ex" id="ex"></div></div></div>
<script>
function scene(s){const r=(n=1)=>{s=(s*9301+49297)%233280;return s/233280*n};const P=[['#FFB27A','#F472B6','#6366F1','#2B1B5E'],['#FDE68A','#FDBA74','#F97316','#7C2D12'],['#A7F3D0','#34D399','#059669','#064E3B'],['#BAE6FD','#38BDF8','#0369A1','#0C2A4A'],['#FBCFE8','#C084FC','#7C3AED','#2E1065'],['#FEF3C7','#FCA5A5','#E11D48','#4C0519']],c=P[Math.floor(r(6))];
 const id='g'+Math.floor(r(1e6));let h='<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c[2]+'"/><stop offset=".55" stop-color="'+c[1]+'"/><stop offset="1" stop-color="'+c[0]+'"/></linearGradient></defs><rect width="400" height="500" fill="url(#'+id+')"/>';
 h+='<circle cx="'+(100+r(200))+'" cy="'+(110+r(60))+'" r="'+(36+r(20))+'" fill="#FFF6D6" opacity=".95"/>';
 for(let l=0;l<4;l++){let d='M0 500 L0 '+(250+l*50);const a=26+r(30),f=.012+r(.02),ph=r(6);for(let x=0;x<=400;x+=8)d+=' L'+x+' '+(250+l*50-a*Math.sin(x*f+ph)-a*.5*Math.sin(x*f*2.3+ph*2)).toFixed(1);d+=' L400 500Z';h+='<path d="'+d+'" fill="'+c[3]+'" opacity="'+(.3+l*.22)+'"/>'}
 return h+'</svg>'}
const PR=[['Midnight','Indigo and pink','#1B1464','#FF8AC8'],['Ember','Wine and amber','#3B0A2A','#FFB15C'],['Lagoon','Navy and aqua','#052A4D','#5CF2D6'],['Candy','Plum and lemon','#4B1D7A','#FFE66B'],['Forest','Pine and lime','#0B3B2A','#C8FF6B'],['Original','Unfiltered colour','#000','#fff']];
const im=document.getElementById('im'),pl=document.getElementById('pl'),ex=document.getElementById('ex');im.innerHTML=scene(8)+'<div class="lb"><i></i><span id="nm">Midnight</span></div>';let cur=0;
PR.forEach(([n,d,s,h],i)=>{const b=document.createElement('button');b.className='p';b.style.cssText='--s:'+s+';--h:'+h;b.setAttribute('aria-pressed','false');b.innerHTML='<i></i><span><b>'+n+'</b><small>'+d+'</small></span>';b.onclick=()=>{off=true;pick(i)};pl.appendChild(b)});
function pick(i){cur=i;const[n,d,s,h]=PR[i];im.style.setProperty('--s',s);im.style.setProperty('--h',h);im.classList.toggle('orig',n==='Original');document.getElementById('nm').textContent=n;im.querySelector('.lb').style.setProperty('--s',n==='Original'?'#fff':s);im.querySelector('.lb').style.setProperty('--h',n==='Original'?'#F472B6':h);[...pl.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===i));ex.innerHTML='<b>Shadows</b> '+(n==='Original'?'none':s)+'<br><b>Highlights</b> '+(n==='Original'?'none':h)+'<br><b>Blend</b> multiply, then lighten'}
pick(0);
/* Idle demo: the presets are applied in turn; the picture goes greyscale and the shadow and highlight colours cross-fade to the new pair over 800ms using registered colour properties, with the final preset returning to the original colours, until you choose one. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2800);let k=1;while(!off){pick(k++%6);await sleep(2200)}})()}
</script></body></html>
