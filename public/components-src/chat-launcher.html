<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chat Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EAF0FB;color:#14213D;font-family:'Nunito Sans',sans-serif;min-height:100vh;padding:24px 14px;-webkit-font-smoothing:antialiased}
.pg{position:relative;max-width:640px;min-height:440px;margin:0 auto;background:#fff;border-radius:22px;overflow:hidden;padding:30px;box-shadow:0 30px 60px -40px rgba(20,33,61,.5),0 0 0 1px rgba(20,33,61,.06)}
.sk div{height:12px;border-radius:8px;background:#EEF2FA;margin-bottom:12px}.sk .h{width:55%;height:22px;background:#E3E9F6;margin-bottom:18px}.sk .a{width:92%}.sk .b{width:78%}.sk .c{width:86%}
.cd{display:flex;gap:12px;margin-top:22px}.cd div{flex:1;height:84px;border-radius:14px;background:#F3F6FC}
.dock{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.pr{position:relative;background:#fff;border-radius:18px 18px 4px 18px;padding:13px 16px;box-shadow:0 16px 34px -10px rgba(20,33,61,.4),0 0 0 1px rgba(20,33,61,.07);max-width:250px;animation:in .5s cubic-bezier(.3,1.4,.5,1) .3s both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.9)}}.pr b{display:block;font-size:14px;font-weight:800}.pr span{font-size:13.5px;color:#5B6B8C;line-height:1.4;display:block;margin-top:2px}.pr .x{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border:0;border-radius:50%;background:#14213D;color:#fff;cursor:pointer;display:grid;place-items:center}.pr .x:focus-visible{outline:2px solid #2563EB;outline-offset:2px}.pr.h{display:none}
.fab{position:relative;width:62px;height:62px;border:0;border-radius:50%;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 18px 30px -10px rgba(37,99,235,.8);transition:transform .2s}.fab:hover{transform:scale(1.07)}.fab:focus-visible{outline:3px solid #14213D;outline-offset:3px}
.fab svg{position:absolute;transition:all .3s cubic-bezier(.4,1.4,.5,1)}.fab .cl{opacity:0;transform:rotate(-90deg) scale(.5)}.fab[aria-expanded=true] .ch{opacity:0;transform:rotate(90deg) scale(.5)}.fab[aria-expanded=true] .cl{opacity:1;transform:none}
.bd{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:#EF4444;border:3px solid #fff;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:bp 2s infinite}@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}.fab[aria-expanded=true] .bd{display:none}
.mn{width:300px;background:#fff;border-radius:20px;box-shadow:0 26px 50px -14px rgba(20,33,61,.5),0 0 0 1px rgba(20,33,61,.07);overflow:hidden;transform-origin:bottom right;transition:all .28s cubic-bezier(.3,1.3,.5,1)}.mn[hidden]{display:block;opacity:0;transform:scale(.85) translateY(10px);pointer-events:none;visibility:hidden}
.mh{background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;padding:18px}.mh b{display:block;font-size:17px;font-weight:800}.mh span{font-size:13px;opacity:.85;display:flex;align-items:center;gap:7px;margin-top:4px}.mh i{width:8px;height:8px;border-radius:50%;background:#4ADE80}
.mi{display:grid;gap:8px;padding:14px}.mi button{display:flex;align-items:center;gap:12px;border:1.5px solid #E5EAF5;background:#fff;border-radius:14px;padding:12px;font:700 14px 'Nunito Sans';color:#14213D;cursor:pointer;text-align:left;transition:all .15s}.mi button:hover{border-color:#2563EB;background:#F4F7FF}.mi button:focus-visible{outline:2px solid #2563EB;outline-offset:2px}.mi svg{flex:none;color:#2563EB}.mi small{display:block;font-weight:600;color:#7A89A8;font-size:12px;margin-top:1px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="pg"><div class="sk"><div class="h"></div><div class="a"></div><div class="b"></div><div class="c"></div><div class="a"></div></div><div class="cd"><div></div><div></div><div></div></div>
<div class="dock"><div class="mn" id="mn" hidden role="dialog" aria-label="Support chat"><div class="mh"><b>Hi there</b><span><i></i>We typically reply in under 2 minutes</span></div><div class="mi"><button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat with us<small>Talk to a real person</small></span></button><button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.500 9a2.500 2.500 0 1 1 3.500 2.300c-.7.400-1 1-1 1.700M12 17h.01"/></svg><span>Browse help articles<small>Guides and how-tos</small></span></button></div></div>
<div class="pr" id="pr"><button class="x" id="px" aria-label="Dismiss"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><b>Need a hand?</b><span>Ask us anything about plans, billing or setup.</span></div>
<button class="fab" id="f" aria-expanded="false" aria-label="Open chat"><svg class="ch" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg><svg class="cl" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="bd">1</span></button></div></div>
<script>
const f=document.getElementById('f'),mn=document.getElementById('mn'),pr=document.getElementById('pr');
function tg(o){f.setAttribute('aria-expanded',o);mn.hidden=!o;f.setAttribute('aria-label',o?'Close chat':'Open chat');if(o)pr.classList.add('h')}
f.onclick=()=>tg(f.getAttribute('aria-expanded')!=='true');document.getElementById('px').onclick=()=>pr.classList.add('h');document.addEventListener('keydown',e=>{if(e.key==='Escape')tg(false)});
</script></body></html>
