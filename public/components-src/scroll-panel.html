<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Activity Log Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0B0F;color:#E6E8F0;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 20px;-webkit-font-smoothing:antialiased}
.p{width:100%;max-width:520px;background:#10121A;border:1px solid #1F2230;border-radius:18px;overflow:hidden;box-shadow:0 40px 80px -30px #000}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #1B1E2B;background:#0D0F16}
.hd h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.f{display:flex;gap:6px}.f button{border:1px solid #232739;background:transparent;color:#8A90A8;font:500 12px 'Inter';padding:5px 11px;border-radius:99px;cursor:pointer;transition:all .2s}
.f button[aria-pressed=true]{background:#E6E8F0;color:#0A0B0F;border-color:#E6E8F0}.f button:focus-visible{outline:2px solid #7AA2FF;outline-offset:2px}
.sc{height:360px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3A4060 transparent}
.sc::-webkit-scrollbar{width:10px}.sc::-webkit-scrollbar-track{background:transparent}
.sc::-webkit-scrollbar-thumb{background:#2B3050;border-radius:10px;border:3px solid #10121A}.sc::-webkit-scrollbar-thumb:hover{background:#4A5390}
.dh{position:sticky;top:0;z-index:2;font:500 11px 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#6C7390;background:rgba(16,18,26,.92);backdrop-filter:blur(8px);padding:10px 20px;border-bottom:1px solid #1B1E2B}
.r{position:relative;display:grid;grid-template-columns:70px 22px 1fr;gap:10px;padding:13px 20px;align-items:start;border-bottom:1px solid #151824;transition:background .2s}
.r:hover{background:#141725}
.r time{font:400 12px 'Geist Mono',monospace;color:#5E6584;padding-top:3px}
.r .d{position:relative;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--b);color:var(--c);margin-top:1px}
.r .d svg{width:12px;height:12px}
.r p{font-size:14px;line-height:1.45;color:#B8BDD2}.r p b{color:#F0F2FA;font-weight:600}
.r code{font:400 12px 'Geist Mono',monospace;background:#171A29;border:1px solid #232739;padding:1px 6px;border-radius:6px;color:#9DB4FF}
.r[hidden]{display:none}
</style></head><body>
<div class="p"><div class="hd"><h1>Audit log</h1><div class="f" id="f"><button aria-pressed="true" data-k="all">All</button><button aria-pressed="false" data-k="deploy">Deploys</button><button aria-pressed="false" data-k="access">Access</button></div></div>
<div class="sc" id="sc"></div></div>
<script>
const I={deploy:'<path d="M12 19V5M5 12l7-7 7 7"/>',access:'<path d="M12 3 4 6v6c0 5 3.400 8 8 9 4.600-1 8-4 8-9V6Z"/>',edit:'<path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4Z"/>'};
const C={deploy:['#0E2B20','#34D399'],access:['#2B1D0E','#F5A524'],edit:['#14213F','#7AA2FF']};
const D=[['Today',[['09:41','deploy','<b>yuki.c</b> deployed <code>web@4f2a9c1</code> to production'],['09:12','access','<b>admin</b> granted <b>noah.b</b> the Editor role'],['08:55','edit','<b>sofia.l</b> updated the <code>pricing.yml</code> config']]],['Yesterday',[['17:30','deploy','<b>ci-bot</b> rolled back <code>api@19be770</code>'],['15:02','access','<b>marcus.r</b> revoked 2 API tokens'],['11:47','edit','<b>elena.o</b> edited billing contact details'],['10:03','deploy','<b>yuki.c</b> deployed <code>api@19be770</code> to staging']]],['Mon, Oct 21',[['16:20','access','<b>admin</b> enabled SSO for the workspace'],['13:11','edit','<b>dev.p</b> renamed project <code>orion</code> → <code>orion-api</code>'],['09:30','deploy','<b>ci-bot</b> deployed <code>web@c0ffee3</code> to production']]]];
const sc=document.getElementById('sc');let h='';
D.forEach(([d,rows])=>{h+='<div class="dh">'+d+'</div>';rows.forEach(([t,k,m])=>{h+='<div class="r" data-k="'+k+'"><time>'+t+'</time><span class="d" style="--b:'+C[k][0]+';--c:'+C[k][1]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round">'+I[k]+'</svg></span><p>'+m+'</p></div>'})});
sc.innerHTML=h;
document.querySelectorAll('#f button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#f button').forEach(x=>x.setAttribute('aria-pressed',x===b));sc.querySelectorAll('.r').forEach(r=>r.hidden=b.dataset.k!=='all'&&r.dataset.k!==b.dataset.k)}));
</script></body></html>
