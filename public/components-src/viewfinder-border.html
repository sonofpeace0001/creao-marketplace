<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Viewfinder Border</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0C0E;color:#ECEDEF;font-family:'Barlow',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{position:relative;width:100%;max-width:520px;aspect-ratio:4/3;background:radial-gradient(70% 70% at 50% 40%,#2A3B2F,#10161B 70%);overflow:hidden;cursor:crosshair}
.sc{position:absolute;inset:0;background:linear-gradient(#10161B 0 48%,#1E2B20 48% 100%);opacity:.9}
.sc::before{content:"";position:absolute;left:12%;bottom:38%;width:28%;height:30%;background:#243428;clip-path:polygon(0 100%,35% 20%,55% 60%,75% 10%,100% 100%)}
.sc::after{content:"";position:absolute;left:46%;bottom:38%;width:42%;height:42%;background:#1B2A1F;clip-path:polygon(0 100%,30% 35%,50% 70%,70% 20%,100% 100%)}
.fr{position:absolute;inset:16%;transition:inset .35s cubic-bezier(.3,1.3,.5,1)}.c:hover .fr{inset:10%}.c.lock .fr{inset:12%}
.fr i{position:absolute;width:26px;height:26px;border:3px solid #FFD400;transition:border-color .2s}
.fr i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.fr i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.fr i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.fr i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.c.lock .fr i{border-color:#4ADE80}
.ch{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}.ch::before,.ch::after{content:"";position:absolute;background:#FFD400;transition:background .2s}.ch::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)}.ch::after{top:50%;left:0;right:0;height:2px;transform:translateY(-50%)}.c.lock .ch::before,.c.lock .ch::after{background:#4ADE80}
.hud{position:absolute;left:14px;right:14px;display:flex;justify-content:space-between;font:600 14px 'Barlow Condensed';letter-spacing:.14em;color:#FFD400}.hud.t{top:12px}.hud.b{bottom:12px;color:#ECEDEF}
.rec{display:flex;align-items:center;gap:7px}.rec i{width:9px;height:9px;border-radius:50%;background:#FF3B30;animation:bl 1.1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.lk{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);font:700 15px 'Barlow Condensed';letter-spacing:.2em;background:#4ADE80;color:#0B0C0E;padding:3px 10px;opacity:0;transition:opacity .2s}.c.lock .lk{opacity:1}
.sh{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:3px solid #ECEDEF;background:transparent;cursor:pointer;display:grid;place-items:center}.sh::after{content:"";width:32px;height:32px;border-radius:50%;background:#ECEDEF;transition:transform .15s}.sh:active::after{transform:scale(.8)}.sh:focus-visible{outline:2px solid #FFD400;outline-offset:3px}
.fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.fl.go{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.rec i{animation:none}.fr{transition:none}.fl.go{animation:none}}
</style></head><body>
<div class="c" id="c"><div class="sc"></div><div class="fr"><i></i><i></i><i></i><i></i><div class="ch"></div></div>
<div class="hud t"><span class="rec"><i></i>REC 00:24</span><span id="m">AUTO · ISO 400</span></div><div class="hud b"><span>1/250  F2.8</span><span id="n">0 SHOTS</span></div><div class="lk">AF LOCK</div>
<button class="sh" id="sh" aria-label="Take photo"></button><div class="fl" id="fl"></div></div>
<script>
const c=document.getElementById('c');let n=0;
c.addEventListener('click',e=>{if(e.target.id==='sh')return;c.classList.toggle('lock');document.getElementById('m').textContent=c.classList.contains('lock')?'AF · LOCKED':'AUTO · ISO 400'});
document.getElementById('sh').onclick=e=>{e.stopPropagation();n++;document.getElementById('n').textContent=n+(n===1?' SHOT':' SHOTS');const f=document.getElementById('fl');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')};
</script></body></html>
