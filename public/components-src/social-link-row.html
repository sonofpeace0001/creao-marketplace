<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Social Row</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0B0E;color:#ECEEF3;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;background:#101217;border:1px solid #1E212B;border-radius:28px;padding:34px 28px 28px;text-align:center;box-shadow:0 40px 80px -34px #000}
.c small{font:500 11.5px 'DM Mono',monospace;letter-spacing:.2em;color:#6A7188;text-transform:uppercase}
.c h1{font-size:26px;font-weight:700;letter-spacing:-.035em;margin:10px 0 24px}
.r{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.b{position:relative;width:62px;height:62px;border-radius:20px;border:1.5px solid #252936;background:#14171E;color:#A5ACC2;display:grid;place-items:center;text-decoration:none;transition:transform .3s cubic-bezier(.3,1.6,.4,1),background .25s,color .25s,border-color .25s,box-shadow .25s}
.b svg{width:24px;height:24px}
.b:hover,.b:focus-visible{transform:translateY(-6px) rotate(-4deg);background:var(--c);color:var(--f,#fff);border-color:transparent;box-shadow:0 18px 26px -12px var(--c);outline:0}
.b:nth-child(even):hover,.b:nth-child(even):focus-visible{transform:translateY(-6px) rotate(4deg)}
.b .tp{position:absolute;left:50%;top:calc(100% + 12px);transform:translate(-50%,-4px);background:#ECEEF3;color:#0A0B0E;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .2s;z-index:2}
.b .tp::before{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;background:#ECEEF3;transform:translateX(-50%) rotate(45deg)}
.b:hover .tp,.b:focus-visible .tp{opacity:1;transform:translate(-50%,0)}
.cp{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:46px;padding:12px 16px;border:1.5px dashed #2A2E3D;border-radius:16px;background:none;color:#B8BED2;font:500 14px 'DM Mono',monospace;cursor:pointer;width:100%;transition:all .2s}
.cp:hover{border-color:#6C7BFF;color:#fff}.cp:focus-visible{outline:2px solid #6C7BFF;outline-offset:2px}.cp.ok{border-color:#34D399;color:#34D399;border-style:solid}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><small>Find me elsewhere</small><h1>Say hello on any of these.</h1>
 <div class="r">
  <a class="b" href="#" style="--c:#000;--f:#fff" aria-label="X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.800 3h3.100l-6.800 7.700L22 21h-6.200l-4.900-6.400L5.300 21H2.200l7.300-8.300L2 3h6.400l4.400 5.800Zm-1.100 16.200h1.700L7.400 4.700H5.600Z"/></svg><span class="tp">X · @mayamakes</span></a>
  <a class="b" href="#" style="--c:linear-gradient(135deg,#F9A826,#E1306C 55%,#7B3FE4)" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r="1" fill="currentColor"/></svg><span class="tp">Instagram</span></a>
  <a class="b" href="#" style="--c:#0A66C2" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.980 3.500a2.500 2.500 0 1 1 0 5 2.500 2.500 0 0 1 0-5ZM3 9.500h4V21H3Zm7 0h3.800v1.600h.1c.5-1 1.800-2 3.800-2 4 0 4.800 2.600 4.800 6V21h-4v-5c0-1.200 0-2.800-1.700-2.800s-2 1.300-2 2.700V21h-4Z"/></svg><span class="tp">LinkedIn</span></a>
  <a class="b" href="#" style="--c:#FF0033" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.200a3 3 0 0 0-2.100-2.100C18 5.600 12 5.600 12 5.600s-6 0-7.900.5A3 3 0 0 0 2 8.200 31 31 0 0 0 1.600 12 31 31 0 0 0 2 15.800a3 3 0 0 0 2.100 2.100c1.900.5 7.900.5 7.900.5s6 0 7.900-.5a3 3 0 0 0 2.100-2.100c.3-1.200.4-2.500.4-3.800s-.1-2.600-.4-3.800ZM10 15V9l5.200 3Z"/></svg><span class="tp">YouTube</span></a>
  <a class="b" href="#" style="--c:#24292F" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.200 19.500c.5.1.7-.2.7-.5v-1.800c-2.800.6-3.400-1.200-3.400-1.200-.5-1.200-1.100-1.500-1.100-1.500-.9-.6.1-.6.1-.6 1 .1 1.500 1 1.500 1 .9 1.500 2.400 1.100 2.900.8.1-.7.4-1.100.6-1.400-2.200-.3-4.600-1.100-4.600-5 0-1.100.4-2 1-2.700-.1-.3-.4-1.300.1-2.700 0 0 .8-.3 2.800 1a9.600 9.600 0 0 1 5 0c2-1.300 2.800-1 2.800-1 .5 1.400.2 2.400.1 2.700.6.700 1 1.600 1 2.700 0 3.900-2.400 4.700-4.600 5 .4.3.7.9.7 1.900v2.800c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg><span class="tp">GitHub</span></a>
  <a class="b" href="#" style="--c:#1DB954;--f:#06180C" aria-label="Spotify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7 9.500c3.500-1 7.500-.6 10.500 1.500M7.500 12.800c3-.8 6.200-.4 8.800 1.200M8 15.800c2.400-.6 4.800-.3 6.800.9"/></svg><span class="tp">Spotify</span></a></div>
 <button class="cp" id="cp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span id="t">hello@maya.design — click to copy</span></button></div>
<script>
const cp=document.getElementById('cp'),t=document.getElementById('t');
cp.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText('hello@maya.design'):Promise.resolve()).catch(()=>{});cp.classList.add('ok');t.textContent='Copied to clipboard';setTimeout(()=>{cp.classList.remove('ok');t.textContent='hello@maya.design — click to copy'},1500)};
</script></body></html>
