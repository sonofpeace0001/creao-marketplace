<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Font Picker Dropdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Caveat:wght@700&family=DM+Serif+Display&family=Fraunces:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@600;800&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&family=Inter+Tight:wght@500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F1EA;color:#1B1812;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{position:relative;width:100%;max-width:760px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.dd{position:relative}.dd>label{display:block;font:600 11.500px 'Geist Mono';letter-spacing:.14em;text-transform:uppercase;color:#988F7A;margin-bottom:9px}
.tr{width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:13px 14px;background:#fff;color:inherit;cursor:pointer;text-align:left;box-shadow:inset 0 0 0 1.500px #DDD6C6,0 1px 2px rgba(27,24,18,.05);transition:box-shadow .2s}
.tr:hover,.tr[aria-expanded=true]{box-shadow:inset 0 0 0 2px #E8590C,0 0 0 5px rgba(232,89,12,.12)}.tr:focus-visible{outline:2px solid #E8590C;outline-offset:2px}
.tr .aa{width:38px;height:38px;border-radius:11px;background:#1B1812;color:#fff;display:grid;place-items:center;font-size:18px;flex:none;transition:font-family .2s}
.tr .n{flex:1;min-width:0}.tr .n b{display:block;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr .n span{font:500 11.500px 'Geist Mono';color:#988F7A}
.tr svg{width:16px;height:16px;color:#988F7A;transition:transform .3s}.tr[aria-expanded=true] svg{transform:rotate(180deg)}
.pp{position:absolute;left:0;right:0;top:calc(100% + 10px);border-radius:20px;background:#fff;padding:6px;box-shadow:0 34px 60px -16px rgba(27,24,18,.45),inset 0 0 0 1px rgba(27,24,18,.09);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top;pointer-events:none;transition:opacity .22s,transform .35s cubic-bezier(.3,1.5,.5,1);z-index:5}
.pp.on{opacity:1;transform:none;pointer-events:auto}
.o{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;cursor:pointer;transition:background .12s;animation:in .35s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*30ms)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.o.hl{background:#FFF1E6}.o b{font-size:20px;line-height:1.15;font-weight:600;flex:1;white-space:nowrap}.o small{font:500 10.500px 'Geist Mono';letter-spacing:.1em;text-transform:uppercase;color:#A59D88;padding:3px 7px;border-radius:6px;background:#F5F1E8}
.o .ck{width:18px;height:18px;border-radius:50%;background:#E8590C;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.8,.5,1)}.o.sel .ck{opacity:1;transform:none}.ck svg{width:10px;height:10px}
.pv{border-radius:28px;background:#fff;padding:26px 28px;box-shadow:0 26px 36px -28px rgba(27,24,18,.5),inset 0 0 0 1px rgba(27,24,18,.07);min-height:340px;display:grid;align-content:space-between;gap:20px}
.pv .lb{font:600 11.500px 'Geist Mono';letter-spacing:.14em;text-transform:uppercase;color:#988F7A;display:flex;justify-content:space-between}.pv .lb b{color:#E8590C;font-weight:600}
.pv h2{font-size:44px;line-height:1.05;letter-spacing:-.02em;transition:font-family .2s}.pv p{font-size:17px;line-height:1.6;color:#4C463A;transition:font-family .2s}
.pv .al{font-size:26px;letter-spacing:.04em;color:#B8AF98;transition:font-family .2s;word-break:break-all}
@media(max-width:640px){.w{grid-template-columns:1fr}.pv{min-height:240px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="w"><div class="dd" id="dd"><label>Heading font</label><button class="tr" id="tr" aria-haspopup="listbox" aria-expanded="false"><span class="aa" id="ta">Aa</span><span class="n"><b id="tn">Fraunces</b><span id="tc">Serif, variable</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="pp" id="pp" role="listbox"></div></div>
<div class="pv"><div class="lb"><span>Live preview</span><b id="pl">Fraunces</b></div><h2 id="ph">Autumn collection, now in the studio</h2><p id="pt">A good typeface makes a quiet argument. It sets the mood before a word is read, and the hover preview lets you hear that argument first.</p><div class="al" id="pa">ABCDEFGHIJKLM abcdefghijklm 0123456789</div></div></div>
<script>
const F=[['Fraunces','Serif, variable',"'Fraunces',serif"],['Playfair Display','Serif, editorial',"'Playfair Display',serif"],['DM Serif Display','Serif, display',"'DM Serif Display',serif"],['Space Grotesk','Sans, geometric',"'Space Grotesk',sans-serif"],['Bricolage Grotesque','Sans, characterful',"'Bricolage Grotesque',sans-serif"],['Syne','Display, wide',"'Syne',sans-serif"],['JetBrains Mono','Monospace',"'JetBrains Mono',monospace"],['Caveat','Handwriting',"'Caveat',cursive"]];
const pp=document.getElementById('pp'),tr=document.getElementById('tr');let cur=0,hl=1,open=false;
const CK='<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span>';
F.forEach(([n,c,f],i)=>{const e=document.createElement('div');e.className='o';e.style.cssText='--i:'+i;e.setAttribute('role','option');e.innerHTML='<b style="font-family:'+f+'">'+n+'</b><small>'+c.split(',')[0]+'</small>'+CK;e.onclick=()=>{off=true;choose(i)};e.onmouseenter=()=>{off=true;hl=i;paint(i)};pp.appendChild(e)});
const os=[...pp.children];
function prev(i){const f=F[i][2];['ph','pt','pa'].forEach(id=>document.getElementById(id).style.fontFamily=f);document.getElementById('pl').textContent=F[i][0]}
function paint(p){os.forEach((o,i)=>{o.classList.toggle('hl',i===hl);o.classList.toggle('sel',i===cur);o.setAttribute('aria-selected',i===cur)});prev(p===undefined?cur:p)}
function choose(i){cur=i;hl=i;const f=F[i];document.getElementById('tn').textContent=f[0];document.getElementById('tn').style.fontFamily=f[2];document.getElementById('ta').style.fontFamily=f[2];document.getElementById('tc').textContent=f[1];paint();setOpen(false)}
function setOpen(o){open=o;pp.classList.toggle('on',o);tr.setAttribute('aria-expanded',o);if(!o)prev(cur)}
tr.onclick=()=>{off=true;setOpen(!open)};pp.addEventListener('pointerleave',()=>prev(cur));addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
document.fonts.ready.then(()=>{choose(0);setOpen(true);hl=4;paint(4)});choose(0);setOpen(true);hl=4;paint(4);
/* Idle demo: the highlight travels down the list and, as it passes each row, the preview text on the right switches to that typeface live; a font is then chosen and the trigger re-sets itself in it, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3000);while(!off){setOpen(true);for(const i of [0,1,2,3,4,5,6,7]){if(off)return;hl=i;paint(i);await sleep(800)}const pick=[5,3,1,4][Math.floor(Math.random()*4)];hl=pick;paint(pick);await sleep(700);if(off)return;choose(pick);await sleep(1800);setOpen(true);await sleep(600)}})()}
</script></body></html>
