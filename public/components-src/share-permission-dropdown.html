<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Share Permission Dropdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7EAF3;color:#12162E;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.dl{position:relative;width:100%;max-width:520px;border-radius:28px;background:#fff;padding:24px;box-shadow:0 40px 60px -34px rgba(18,22,46,.55),inset 0 0 0 1px rgba(18,22,46,.07);min-height:520px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.hd h1{font-size:21px;font-weight:800;letter-spacing:-.04em}.hd span{font:500 12px 'Geist Mono';color:#8189A8}
.iv{display:flex;gap:8px;margin-bottom:16px}.iv div{flex:1;display:flex;align-items:center;border-radius:14px;background:#F3F4FA;padding:0 14px;color:#9AA1BD;font-size:14.500px;box-shadow:inset 0 0 0 1px rgba(18,22,46,.05)}.iv button{border:0;border-radius:14px;padding:13px 20px;background:#4F46E5;color:#fff;font:700 14px 'Plus Jakarta Sans'}
.ls{display:grid;gap:2px}
.p{display:flex;align-items:center;gap:13px;padding:10px 8px;border-radius:16px;transition:all .45s cubic-bezier(.3,1.3,.5,1);max-height:64px;overflow:visible}
.p.gone{max-height:0;padding-top:0;padding-bottom:0;opacity:0;transform:scale(.96);overflow:hidden}
.p .av{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none}.p .av svg{width:100%;height:100%;display:block}
.p .t{flex:1;min-width:0}.p .t b{display:block;font-size:14.500px;font-weight:700}.p .t span{font-size:12.500px;color:#8189A8}
.rl{position:relative}
.rb{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 10px 8px 12px;border-radius:11px;font:600 13.500px 'Plus Jakarta Sans';color:#4B5173;cursor:pointer;transition:background .15s}
.rb:hover,.rb[aria-expanded=true]{background:#F1F2FA;color:#12162E}.rb:focus-visible{outline:2px solid #4F46E5;outline-offset:1px}.rb:disabled{cursor:default;color:#9AA1BD}.rb:disabled:hover{background:none}
.rb svg{width:14px;height:14px;transition:transform .25s}.rb[aria-expanded=true] svg{transform:rotate(180deg)}.rb svg *{fill:none;stroke:currentColor;stroke-width:2.600;stroke-linecap:round;stroke-linejoin:round}
.rb .lbl{display:inline-block;height:1.3em;overflow:hidden;min-width:5.200em;text-align:right}.rb .lbl span{display:block;transition:transform .4s cubic-bezier(.3,1.3,.4,1)}
.mn{position:absolute;right:0;top:calc(100% + 6px);width:290px;border-radius:18px;background:#fff;padding:6px;box-shadow:0 30px 54px -14px rgba(18,22,46,.5),inset 0 0 0 1px rgba(18,22,46,.1);opacity:0;transform:translateY(-6px) scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .32s cubic-bezier(.3,1.5,.5,1);z-index:8}
.mn.on{opacity:1;transform:none;pointer-events:auto}
.o{display:flex;align-items:flex-start;gap:12px;padding:10px 11px;border-radius:12px;cursor:pointer;transition:background .12s}.o.hl{background:#F1F2FA}
.o .ic{width:32px;height:32px;border-radius:10px;background:#EEF0FF;color:#4F46E5;display:grid;place-items:center;flex:none}.o .ic svg{width:17px;height:17px}.o .ic svg *{fill:none;stroke:currentColor;stroke-width:2.100;stroke-linecap:round;stroke-linejoin:round}
.o b{display:block;font-size:14px;font-weight:700}.o span{font-size:12.500px;color:#8189A8;line-height:1.35}
.o .ck{margin-left:auto;width:18px;height:18px;border-radius:50%;background:#4F46E5;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.8,.5,1);flex:none;margin-top:6px}.o.sel .ck{opacity:1;transform:none}.o .ck svg{width:10px;height:10px}
.o.rm{margin-top:2px;border-top:1px solid #F0F1F8;border-radius:0 0 12px 12px}.o.rm b{color:#DC2626}.o.rm .ic{background:#FEE2E2;color:#DC2626}
.lk{display:flex;align-items:center;gap:13px;margin-top:14px;padding:13px 14px;border-radius:18px;background:#F6F7FC;box-shadow:inset 0 0 0 1px rgba(18,22,46,.05)}.lk .ic{width:40px;height:40px;border-radius:12px;background:#E3E6FF;color:#4F46E5;display:grid;place-items:center}.lk .ic svg{width:20px;height:20px}.lk .ic svg *{fill:none;stroke:currentColor;stroke-width:2.100;stroke-linecap:round;stroke-linejoin:round}
.lk .t{flex:1}.lk .t b{display:block;font-size:14.500px}.lk .t span{font-size:12.500px;color:#8189A8}.lk button.cp{border:0;border-radius:11px;padding:9px 14px;background:#12162E;color:#fff;font:700 13px 'Plus Jakarta Sans';cursor:pointer;transition:background .3s}.lk button.cp.ok{background:#16A34A}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="dl" id="dl"><div class="hd"><h1>Share &ldquo;Launch plan&rdquo;</h1><span id="ct">4 people</span></div><div class="iv"><div>Add people by email</div><button tabindex="-1">Invite</button></div><div class="ls" id="ls"></div>
<div class="lk"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><div class="t"><b>Anyone with the link</b><span>Can view, no sign-in needed</span></div><button class="cp" id="cp">Copy link</button></div></div>
<script>
function face(s){const r=n=>{s=(s*9301+49297)%233280;return Math.floor(s/233280*n)};const sk=['#F2C9A5','#E0A57A','#B9784B','#8A5230','#5B3420','#F7D9C1'][r(6)],hr=['#1B1410','#3B2314','#7A4A21','#C9A15E','#B5361F','#6B6B73','#2D2A6B'][r(7)],bg=['#FFD6A5','#CAFFBF','#9BF6FF','#BDB2FF','#FFC6FF','#FDFFB6','#A0C4FF','#FFADAD'][r(8)],sh=['#6366F1','#EC4899','#0EA5E9','#10B981','#F59E0B','#8B5CF6'][r(6)],st=r(5),gl=r(3)===0,sm=r(3);
 let h='';if(st===1)h+='<path d="M24 52c-2-24 8-34 26-34s28 10 26 34c-2 12-6 16-6 16H30s-4-4-6-16Z" fill="'+hr+'"/>';
 let top='';if(st===0)top='<path d="M27 46c0-16 9-22 23-22s23 6 23 22c-6-8-14-10-23-10s-17 2-23 10Z" fill="'+hr+'"/>';else if(st===1)top='<path d="M27 48c0-17 9-24 23-24s23 7 23 24c-7-7-14-11-23-11s-16 4-23 11Z" fill="'+hr+'"/>';else if(st===2)top='<g fill="'+hr+'"><circle cx="31" cy="40" r="9"/><circle cx="42" cy="31" r="10"/><circle cx="56" cy="30" r="10"/><circle cx="68" cy="39" r="9"/><circle cx="50" cy="27" r="9"/></g>';else if(st===3)top='<g fill="'+hr+'"><path d="M28 46c0-14 8-20 22-20s22 6 22 20c-5-6-13-9-22-9s-17 3-22 9Z"/><circle cx="50" cy="20" r="8"/></g>';
 return '<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="'+bg+'"/>'+h+'<path d="M14 100c2-18 16-26 36-26s34 8 36 26Z" fill="'+sh+'"/><rect x="43" y="62" width="14" height="14" rx="6" fill="'+sk+'"/><ellipse cx="50" cy="48" rx="21" ry="24" fill="'+sk+'"/>'+top+'<circle cx="42" cy="50" r="2.200" fill="#2A1A12"/><circle cx="58" cy="50" r="2.200" fill="#2A1A12"/>'+(gl?'<g fill="none" stroke="#2A1A12" stroke-width="1.800"><circle cx="42" cy="50" r="6.500"/><circle cx="58" cy="50" r="6.500"/><path d="M48.500 50h3"/></g>':'')+'<path d="'+(sm===0?'M43 60q7 6 14 0':sm===1?'M44 60q6 4 12 0':'M43 59q7 8 14 0')+'" fill="none" stroke="#2A1A12" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="57" r="3.200" fill="#FF8A8A" opacity=".35"/><circle cx="64" cy="57" r="3.200" fill="#FF8A8A" opacity=".35"/></svg>'}
const R=[['Owner','Full control, can delete','<path d="m3 8 4 4 5-7 5 7 4-4-2 11H5Z"/>'],['Editor','Can edit, share and comment','<path d="M4 20h4L19 9l-4-4L4 16Zm9-13 4 4"/>'],['Commenter','Can comment but not edit','<path d="M4 5h16v11H9l-5 4Z"/>'],['Viewer','Can view only','<path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12ZM12 9.500a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5Z"/>']];
const P=[['Amara Diallo','amara@fable.studio',0,5],['Priya Nair','priya@fable.studio',1,11],['Marcus Webb','marcus@northwind.io',2,48],['Hannah Cho','hannah@fable.studio',3,122]];
const ls=document.getElementById('ls'),CHK='<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span>',CV='<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';let openI=-1,hlI=0;const rows=[];
P.forEach(([n,e,r,s],i)=>{const d=document.createElement('div');d.className='p';d.innerHTML='<div class="av">'+face(s)+'</div><div class="t"><b>'+n+'</b><span>'+e+'</span></div><div class="rl"><button class="rb" aria-haspopup="menu" aria-expanded="false"'+(i===0?' disabled':'')+'><span class="lbl"><span>'+R[r][0]+'</span></span>'+(i===0?'':CV)+'</button><div class="mn" role="menu"></div></div>';ls.appendChild(d);
 const o={d,i,r,btn:d.querySelector('.rb'),mn:d.querySelector('.mn'),lbl:d.querySelector('.lbl')};rows.push(o);
 if(i>0){const mn=o.mn;[1,2,3].forEach(k=>{const e2=document.createElement('div');e2.className='o';e2.dataset.k=k;e2.setAttribute('role','menuitemradio');e2.innerHTML='<span class="ic"><svg viewBox="0 0 24 24">'+R[k][2]+'</svg></span><div><b>'+R[k][0]+'</b><span>'+R[k][1]+'</span></div>'+CHK;e2.onclick=()=>{off=true;setRole(o,k);openMenu(-1)};e2.onmouseenter=()=>{off=true;hlI=k;paintM(o)};mn.appendChild(e2)});
  const rm=document.createElement('div');rm.className='o rm';rm.dataset.k='x';rm.innerHTML='<span class="ic"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></span><div><b>Remove access</b><span>They will lose access immediately</span></div>';rm.onclick=()=>{off=true;openMenu(-1);remove(o)};mn.appendChild(rm);
  o.btn.onclick=()=>{off=true;openMenu(openI===i?-1:i)}}});
function paintM(o){o.mn.querySelectorAll('.o').forEach(e=>{const k=e.dataset.k;e.classList.toggle('sel',+k===o.r);e.classList.toggle('hl',k==='x'?hlI===9:+k===hlI)})}
function openMenu(i){openI=i;rows.forEach(o=>{const on=o.i===i;o.mn.classList.toggle('on',on);o.btn.setAttribute('aria-expanded',on);if(on){hlI=o.r;paintM(o)}})}
function setRole(o,k){o.r=k;const old=o.lbl.firstChild,n=document.createElement('span');n.textContent=R[k][0];n.style.cssText='position:absolute;left:0;right:0;top:0;text-align:right;transform:translateY(100%)';o.lbl.style.position='relative';o.lbl.appendChild(n);old.style.transform='translateY(-100%)';requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.transition='transform .4s cubic-bezier(.3,1.3,.4,1)';n.style.transform='none'}));setTimeout(()=>{old.textContent=R[k][0];old.style.transition='none';old.style.transform='none';n.remove();setTimeout(()=>old.style.transition='',30)},430);paintM(o)}
function remove(o){o.d.classList.add('gone');count()}function restore(o){o.d.classList.remove('gone');count()}function count(){const n=rows.filter(o=>!o.d.classList.contains('gone')).length;document.getElementById('ct').textContent=n+' people'}
addEventListener('keydown',e=>{if(e.key==='Escape')openMenu(-1)});document.addEventListener('pointerdown',e=>{if(openI>=0&&!e.target.closest('.rl'))openMenu(-1)});
const cp=document.getElementById('cp');cp.onclick=()=>{off=true;cp.classList.add('ok');cp.textContent='Copied';setTimeout(()=>{cp.classList.remove('ok');cp.textContent='Copy link'},1500)};
rows.forEach(o=>{if(o.i>0)paintM(o)});openMenu(2);hlI=3;paintM(rows[2]);
/* Idle demo: a person's role menu opens, the highlight moves, a new role is chosen and the label rolls to it, then another person is removed so their row collapses, and finally they are restored, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3200);while(!off){openMenu(-1);await sleep(800);openMenu(1);await sleep(700);hlI=2;paintM(rows[1]);await sleep(700);hlI=3;paintM(rows[1]);await sleep(700);if(off)return;setRole(rows[1],3);openMenu(-1);await sleep(1500);openMenu(3);await sleep(900);hlI=9;paintM(rows[3]);await sleep(900);if(off)return;openMenu(-1);remove(rows[3]);await sleep(2000);restore(rows[3]);setRole(rows[1],1);await sleep(1300);openMenu(2);hlI=3;paintM(rows[2]);await sleep(1400)}})()}
</script></body></html>
