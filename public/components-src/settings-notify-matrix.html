<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notification Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EAEEF3;color:#14202C;font-family:'Public Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:680px;background:#fff;border-radius:24px;padding:26px 28px 22px;box-shadow:0 40px 70px -44px rgba(20,32,44,.5),0 0 0 1px rgba(20,32,44,.06)}
.hd h1{font-size:21px;font-weight:700;letter-spacing:-.03em}.hd p{font-size:14px;color:#6A7C8E;margin:4px 0 20px}
.gd{display:grid;grid-template-columns:1fr repeat(3,90px);align-items:center}
.ch{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:12px;font-size:13px;font-weight:600;color:#5A6C7E}.ch svg{color:#7E91A4}
.ch .ms{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#8A9BAC}
.rw{display:contents}.rw>*{padding:14px 0;border-top:1px solid #EEF1F5;transition:background .3s}.rw .lb b{display:block;font-size:14.5px;font-weight:600}.rw .lb span{display:block;font-size:12.5px;color:#7E91A4;margin-top:2px}.rw .lb{display:flex;align-items:center;gap:10px}.rw .lb button.mr{margin-left:auto;margin-right:14px;border:0;background:#F0F3F7;color:#5A6C7E;border-radius:8px;padding:5px 10px;font:600 11.5px 'Public Sans';cursor:pointer;opacity:0;transition:opacity .15s}.rw:hover .mr,.rw .mr:focus-visible{opacity:1}.rw .mr:focus-visible{outline:2px solid #2563EB}
.cl{display:grid;place-items:center}
.sw{position:relative;width:42px;height:24px;border:0;border-radius:24px;background:#D5DCE4;cursor:pointer;padding:0;transition:background .25s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.sw[aria-checked=true]{background:var(--c,#2563EB)}.sw[aria-checked=true]::after{transform:translateX(18px)}.sw:focus-visible{outline:2px solid #14202C;outline-offset:2px}
.sw.mx::before{content:"";position:absolute;left:12px;right:12px;top:11px;height:2px;border-radius:2px;background:#fff;z-index:2}.sw.mx{background:var(--c,#2563EB)}.sw.mx::after{transform:translateX(9px)}
.sw.rp::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--c);opacity:.5;animation:rp .5s ease-out forwards}@keyframes rp{to{transform:scale(5);opacity:0}}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:14px;border-top:1px solid #EEF1F5;font-size:13px;color:#7E91A4}.ft button{border:0;background:#14202C;color:#fff;border-radius:11px;padding:10px 18px;font:600 13.5px 'Public Sans';cursor:pointer}.ft button:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
@media(max-width:560px){.gd{grid-template-columns:1fr repeat(3,56px)}.rw .lb span{display:none}.rw .mr{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Notifications</h1><p>Choose how you hear about each event. Master switches change a whole column.</p></div><div class="gd" id="gd"></div><div class="ft"><span id="ct"></span><button>Save changes</button></div></div>
<script>
const CH=[['Email','#2563EB','M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z'],['Push','#7C3AED','M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.700 21a2 2 0 0 1-3.400 0'],['Slack','#E11D48','M4 9h16M4 15h16M9 4 7 20M17 4l-2 16']];
const EV=[['Mentions','When someone mentions you',[1,1,1]],['Comments','Replies on your pages',[1,0,1]],['Deploys','Production releases and failures',[0,1,1]],['Billing','Invoices and failed payments',[1,0,0]],['Weekly digest','A summary every Monday',[1,0,0]]];
const S=EV.map(e=>e[2].slice());const gd=document.getElementById('gd');
function sw(on,c,cls){return '<button class="sw '+(cls||'')+'" role="switch" aria-checked="'+on+'" style="--c:'+c+'"></button>'}
function draw(){let h='<div></div>'+CH.map((c,j)=>{const n=S.filter(r=>r[j]).length,st=n===0?'false':n===S.length?'true':'mixed';return '<div class="ch"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+c[2]+'"/></svg>'+c[0]+'<div class="cl">'+(st==='mixed'?'<button class="sw mx" role="switch" aria-checked="mixed" data-m="'+j+'" style="--c:'+c[1]+'" aria-label="All '+c[0]+'"></button>':'<button class="sw" role="switch" aria-checked="'+st+'" data-m="'+j+'" style="--c:'+c[1]+'" aria-label="All '+c[0]+'"></button>')+'</div></div>'}).join('');
 EV.forEach((e,i)=>{h+='<div class="rw"><div class="lb"><div><b>'+e[0]+'</b><span>'+e[1]+'</span></div><button class="mr" data-r="'+i+'">Toggle row</button></div>'+CH.map((c,j)=>'<div class="cl">'+sw(!!S[i][j],c[1]).replace('class="sw ','class="sw ').replace('<button','<button data-i="'+i+'" data-j="'+j+'" aria-label="'+e[0]+' by '+c[0]+'"')+'</div>').join('')+'</div>'});gd.innerHTML=h;
 gd.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S[+b.dataset.i][+b.dataset.j]^=1;draw();ripple(b.dataset.i,b.dataset.j)});gd.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const j=+b.dataset.m,on=S.some(r=>!r[j])?1:0;S.forEach(r=>r[j]=on);draw()});gd.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const i=+b.dataset.r,on=S[i].some(v=>!v)?1:0;S[i]=S[i].map(()=>on);draw()});
 document.getElementById('ct').textContent=S.flat().filter(Boolean).length+' of '+S.flat().length+' notifications on'}
function ripple(i,j){const b=gd.querySelector('[data-i="'+i+'"][data-j="'+j+'"]');if(b){b.classList.add('rp');setTimeout(()=>b.classList.remove('rp'),500)}}
draw();
</script></body></html>
