<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Status Badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0C0D11;color:#E6E8EF;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 18px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:640px;background:#111319;border:1px solid #1E212B;border-radius:22px;padding:26px 26px 22px;box-shadow:0 40px 80px -34px #000}
h2{font:500 11px 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#636B80;margin:0 0 14px}
.g{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.bg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:5px 11px 5px 9px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--c)}
.bg i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.ok{--c:#4ADE80;--bg:rgba(74,222,128,.09);--bd:rgba(74,222,128,.25)}.wr{--c:#FBBF24;--bg:rgba(251,191,36,.09);--bd:rgba(251,191,36,.25)}
.er{--c:#F87171;--bg:rgba(248,113,113,.09);--bd:rgba(248,113,113,.25)}.in{--c:#60A5FA;--bg:rgba(96,165,250,.09);--bd:rgba(96,165,250,.25)}
.pu{--c:#C084FC;--bg:rgba(192,132,252,.09);--bd:rgba(192,132,252,.25)}.nu{--c:#9AA3B8;--bg:rgba(154,163,184,.08);--bd:rgba(154,163,184,.2)}
.live i{animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}
.tg{font:500 12px 'Geist Mono',monospace;color:#AEB6CA;background:#171A22;border:1px solid #242835;padding:4px 9px;border-radius:7px}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font:500 11px 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#636B80;padding:0 0 10px;font-weight:500}
.tb td{padding:12px 0;border-top:1px solid #1B1E27}.tb td:first-child{font-weight:600}.tb td:nth-child(2){color:#7E869C;font:500 12.5px 'Geist Mono',monospace}
.tb td:last-child{text-align:right}
.tb button{all:unset;cursor:pointer;border-radius:99px}.tb button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hint{margin-top:14px;font-size:12px;color:#5A6277}
@media(prefers-reduced-motion:reduce){.live i{animation:none}}
</style></head><body>
<div class="c"><h2>Status variants</h2>
 <div class="g"><span class="bg ok"><i></i>Operational</span><span class="bg wr"><i></i>Degraded</span><span class="bg er"><i></i>Outage</span><span class="bg in"><i></i>Maintenance</span><span class="bg pu"><i></i>Beta</span><span class="bg nu"><i></i>Archived</span><span class="bg ok live"><i></i>Live</span></div>
 <h2>Tags</h2>
 <div class="g"><span class="tg">api</span><span class="tg">v2.4</span><span class="tg">eu-west-1</span><span class="tg">stable</span><span class="tg">breaking-change</span></div>
 <h2>Live services · click a status to cycle</h2>
 <table class="tb"><thead><tr><th>Service</th><th>Region</th><th style="text-align:right">Status</th></tr></thead><tbody id="b"></tbody></table>
 <p class="hint">Badges pair colour with a label and a dot, so status never relies on colour alone.</p></div>
<script>
const S=[['ok','Operational'],['wr','Degraded'],['er','Outage'],['in','Maintenance']];
const R=[['Core API','us-east-1',0],['Webhooks','eu-west-1',0],['Dashboard','global',1],['Batch jobs','ap-south-1',3]];
const b=document.getElementById('b');
function draw(){b.innerHTML=R.map((r,i)=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><button data-i="'+i+'" aria-label="'+r[0]+' status: '+S[r[2]][1]+'. Click to change"><span class="bg '+S[r[2]][0]+'"><i></i>'+S[r[2]][1]+'</span></button></td></tr>').join('')}
b.addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;const i=+x.dataset.i;R[i][2]=(R[i][2]+1)%S.length;draw();b.querySelector('[data-i="'+i+'"]').focus()});draw();
</script></body></html>
