<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Credit Pack Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFF5DD;background-image:radial-gradient(#FFE8B0 1.5px,transparent 1.5px);background-size:24px 24px;color:#2B1B05;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:820px;display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
.pl{background:#fff;border:3px solid #2B1B05;border-radius:28px;padding:26px;box-shadow:7px 7px 0 #2B1B05;position:relative}
.pl h1{font-size:28px;font-weight:800;letter-spacing:-.05em;line-height:1}.pl p{font-size:14.5px;color:#7A5F2E;margin:8px 0 20px;line-height:1.5}
.pk{display:grid;gap:10px}.pk button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2.5px solid #2B1B05;background:#fff;border-radius:18px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s,background .2s;position:relative}.pk button:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 #2B1B05}.pk button[aria-pressed=true]{background:#FFD23F;box-shadow:3px 3px 0 #2B1B05;transform:translate(-2px,-2px)}.pk button:focus-visible{outline:3px solid #2563EB;outline-offset:3px}
.pk .co{flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A6,#FFC107 55%,#E39A00);border:2.5px solid #2B1B05;display:grid;place-items:center;font:800 13px 'Outfit'}
.pk b{display:block;font-size:17px;font-weight:700;letter-spacing:-.03em}.pk span{font-size:13px;color:#7A5F2E}.pk button[aria-pressed=true] span{color:#5A430F}.pk em{margin-left:auto;font:800 17px 'Outfit';font-style:normal}
.pk .bn{position:absolute;right:12px;top:-11px;background:#EF4444;color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;border:2px solid #2B1B05;border-radius:99px;padding:1px 9px;text-transform:uppercase}
.rt{background:#2B1B05;color:#FFF5DD;border-radius:28px;padding:26px;display:flex;flex-direction:column;border:3px solid #2B1B05;box-shadow:7px 7px 0 #B8860B}
.rt small{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E3BE6A}
.jr{position:relative;flex:1;min-height:170px;margin:14px 0}.jr .gl{position:absolute;left:50%;bottom:0;width:150px;height:170px;transform:translateX(-50%);border:4px solid #FFF5DD;border-radius:12px 12px 40px 40px;overflow:hidden;background:rgba(255,245,221,.06)}
.jr .gl::before{content:"";position:absolute;left:-4px;right:-4px;top:-4px;height:10px;border:4px solid #FFF5DD;border-radius:6px;background:#2B1B05;z-index:2}
.jr .cn{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:2px;padding:6px;height:100%}
.jr .cn i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A6,#FFC107 55%,#E39A00);border:2px solid #2B1B05;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);animation:dp .45s cubic-bezier(.3,1.8,.5,1)}@keyframes dp{from{transform:translateY(-60px) scale(.6);opacity:0}}
.am{display:flex;align-items:baseline;gap:8px;margin-top:2px}.am b{font:800 54px/1 'Outfit';letter-spacing:-.06em}.am span{font-size:15px;color:#E3BE6A}
.ln{display:grid;gap:7px;margin:16px 0 20px;font-size:14px;color:#E8D9B5}.ln div{display:flex;justify-content:space-between}.ln b{font:500 13.5px 'JetBrains Mono',monospace;color:#FFF5DD}.ln .bn2 b{color:#FFD23F}
.go{border:3px solid #FFF5DD;background:#FFD23F;color:#2B1B05;border-radius:16px;padding:14px;font:800 17px 'Outfit';cursor:pointer;box-shadow:4px 4px 0 #FFF5DD;transition:transform .12s,box-shadow .12s}.go:active{transform:translate(4px,4px);box-shadow:none}.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:700px){.c{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="pl"><h1>Buy credits</h1><p>Pay as you go. Credits never expire and bigger packs earn bonus coins.</p><div class="pk" id="pk"></div></div>
<div class="rt"><small>Your order</small><div class="jr"><div class="gl"><div class="cn" id="cn"></div></div></div><div class="am"><b id="tt"></b><span id="cr"></span></div><div class="ln"><div><span>Base credits</span><b id="bs"></b></div><div class="bn2"><span>Bonus credits</span><b id="bo"></b></div><div><span>Per credit</span><b id="pc"></b></div></div><button class="go" id="go">Checkout</button></div></div>
<script>
const P=[['Starter',100,9,0],['Builder',500,39,10],['Studio',1500,99,20],['Agency',5000,279,30]];let cur=2;const $=id=>document.getElementById(id);
$('pk').innerHTML=P.map((p,i)=>'<button data-i="'+i+'" aria-pressed="'+(i===cur)+'">'+(p[3]?'<span class="bn">+'+p[3]+'% bonus</span>':'')+'<span class="co">'+(p[1]>=1000?(p[1]/1000)+'k':p[1])+'</span><div><b>'+p[0]+'</b><span>'+p[1].toLocaleString()+' credits</span></div><em>$'+p[2]+'</em></button>').join('');
function fill(n){const c=$('cn');const want=Math.min(34,Math.round(n/60)+4);c.innerHTML='';for(let i=0;i<want;i++){const e=document.createElement('i');e.style.animationDelay=(Math.min(i,20)*18)+'ms';c.appendChild(e)}}
function upd(a){const p=P[cur],bonus=Math.round(p[1]*p[3]/100);$('tt').textContent='$'+p[2];$('cr').textContent=(p[1]+bonus).toLocaleString()+' credits';$('bs').textContent=p[1].toLocaleString();$('bo').textContent='+'+bonus.toLocaleString();$('pc').textContent='$'+(p[2]/(p[1]+bonus)).toFixed(3);document.querySelectorAll('#pk button').forEach((b,i)=>b.setAttribute('aria-pressed',i===cur));fill(p[1]+bonus)}
document.querySelectorAll('#pk button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;upd()});upd();
document.getElementById('cn').querySelectorAll('i').forEach(i=>i.style.animation='none');
$('go').onclick=e=>{e.target.textContent='Redirecting...'; setTimeout(()=>e.target.textContent='Checkout',1500)};
</script></body></html>
