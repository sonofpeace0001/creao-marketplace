<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Status Badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090A10;color:#ECEDF5;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(560px 380px at 50% 0,rgba(139,92,246,.2),transparent 70%)}
.w{width:100%;max-width:620px;display:grid;gap:28px;justify-items:center}
.hd{text-align:center}.hd h1{font-size:28px;font-weight:700;letter-spacing:-.045em}.hd p{color:#767A93;font-size:14px;margin-top:6px}
.mp{position:relative;padding:1.500px;border-radius:99px;background:conic-gradient(from var(--a),rgba(255,255,255,.1) 0 55%,#8B5CF6 75%,#22D3EE 90%,rgba(255,255,255,.1));animation:ro 3s linear infinite;transition:width .5s cubic-bezier(.3,1.2,.4,1)}
.mp.done{background:rgba(52,211,153,.5);animation:none}
@keyframes ro{to{--a:360deg}}
.mp .in{display:flex;align-items:center;gap:12px;height:56px;padding:0 22px 0 16px;border-radius:99px;background:#10111A;white-space:nowrap;overflow:hidden}
.mp .ic{position:relative;width:26px;height:26px;flex:none}
.mp .ic>*{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.3,1.5,.5,1)}.mp .ic>.on{opacity:1;transform:none}
.mp .ic svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb{font:600 16px 'Geist';letter-spacing:-.01em}
.sh{background:linear-gradient(90deg,#6E7291 0,#fff 45%,#6E7291 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ss 1.700s linear infinite}@keyframes ss{to{background-position:-220% 0}}
.mp.done .lb{background:none;color:#34D399;animation:none}
.dots::after{content:"";display:inline-block;width:1.200em;text-align:left;animation:dt 1.400s steps(4) infinite}@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.b{display:flex;align-items:center;gap:11px;padding:11px 16px 11px 12px;border-radius:99px;background:#12131C;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font:600 14px 'Geist'}
.b .ic{position:relative;width:22px;height:22px;flex:none;color:var(--c)}.b .ic svg{width:100%;height:100%}.b .ic svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b small{margin-left:auto;font:500 11px 'Geist Mono';color:#6E7291}
.spn{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.orb{animation:ob 1.800s linear infinite;transform-origin:12px 12px}@keyframes ob{to{transform:rotate(360deg)}}
.pen{animation:pn 1s ease-in-out infinite alternate}@keyframes pn{from{transform:translate(-1px,1px) rotate(-6deg)}to{transform:translate(2px,-2px) rotate(4deg)}}
.scn{animation:sc 1.800s ease-in-out infinite alternate}@keyframes sc{from{transform:translate(-3px,0)}to{transform:translate(3px,2px)}}
.brt{animation:br 1.600s ease-in-out infinite}@keyframes br{50%{transform:scale(1.18);opacity:.7}}
.ck path{stroke-dasharray:1;stroke-dashoffset:1;animation:cd 2.600s ease-in-out infinite}@keyframes cd{0%{stroke-dashoffset:1}25%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@media(max-width:520px){.gal{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Say what the model is doing</h1><p>One badge that morphs through every stage, and the full set below.</p></div>
<div class="mp" id="mp"><div class="in"><div class="ic" id="ic"></div><span class="lb sh dots" id="lb">Thinking</span></div></div>
<div class="gal" id="gal"></div></div>
<script>
const SV={think:'<svg viewBox="0 0 24 24"><path class="orb" d="M12 3a9 9 0 0 1 9 9"/><circle class="brt" cx="12" cy="12" r="3.500"/><path d="M12 21a9 9 0 0 1-9-9" opacity=".5"/></svg>',search:'<svg viewBox="0 0 24 24"><g class="spn" style="transform-origin:12px 12px"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></g></svg>',write:'<svg viewBox="0 0 24 24"><g class="pen"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="m13 7 4 4"/></g></svg>',review:'<svg viewBox="0 0 24 24"><g class="scn"><circle cx="10.500" cy="10.500" r="6"/><path d="m15 15 5.500 5.500"/></g></svg>',done:'<svg class="ck" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" opacity=".35"/><path pathLength="1" d="m7.500 12.500 3 3 6-6.500"/></svg>'};
const ST=[['think','Thinking','#A78BFA'],['search','Searching the web','#38BDF8'],['write','Writing the answer','#F59E0B'],['review','Checking the facts','#F472B6'],['done','Done in 4.2s','#34D399']];
const mp=document.getElementById('mp'),ic=document.getElementById('ic'),lb=document.getElementById('lb'),gal=document.getElementById('gal');
ST.forEach(([k,t,c],i)=>{const d=document.createElement('div');d.className='b';d.style.setProperty('--c',c);d.innerHTML='<span class="ic">'+SV[k]+'</span>'+t+'<small>'+['0.0s','1.4s','2.9s','3.8s','4.2s'][i]+'</small>';gal.appendChild(d)});
ST.forEach(([k])=>{const w=document.createElement('div');w.dataset.k=k;w.innerHTML=SV[k];ic.appendChild(w)});
let cur=-1;
function show(i){cur=i;const[k,t,c]=ST[i],oldW=mp.offsetWidth;[...ic.children].forEach(w=>{w.classList.toggle('on',w.dataset.k===k);w.style.color=c});const done=k==='done';mp.classList.toggle('done',done);
 lb.className='lb '+(done?'':'sh dots');lb.textContent=t;ic.style.color=c;mp.style.width='auto';const nw=mp.offsetWidth;mp.style.width=oldW+'px';void mp.offsetWidth;mp.style.width=nw+'px'}
show(0);document.fonts.ready.then(()=>{mp.style.width='auto';const w=mp.offsetWidth;mp.style.width=w+'px'});
/* Idle demo: the single badge cycles through thinking, searching, writing, checking and done every 2.2s, resizing to fit each label while its icon swaps and the orbiting border stops when it finishes. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3000);let i=1;while(true){show(i%5);i++;await sleep(i%5===1?3200:2200)}})()}
</script></body></html>
