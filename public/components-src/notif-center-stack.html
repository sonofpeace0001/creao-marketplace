<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notification Center Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 400px at 30% 20%,#7C5CFA,transparent 60%),radial-gradient(500px 400px at 80% 90%,#F472B6,transparent 60%),#1B1340;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{width:100%;max-width:400px}
.tm{text-align:center;margin-bottom:22px}.tm b{display:block;font-size:64px;font-weight:600;letter-spacing:-.05em;line-height:1}.tm span{font-size:15px;opacity:.8;font-weight:500}
.gr{position:relative;margin-bottom:14px}
.gh{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px;font-size:13px;font-weight:600;opacity:.9}.gh button{border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px}.gh button:focus-visible{outline:2px solid #fff}
.cd{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;border:0;text-align:left;font:inherit;color:#fff;background:rgba(255,255,255,.2);backdrop-filter:blur(24px) saturate(1.5);border-radius:22px;padding:13px 14px;cursor:pointer;transition:transform .45s cubic-bezier(.3,1.1,.4,1),opacity .35s,margin .45s cubic-bezier(.3,1.1,.4,1),scale .45s;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.cd:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cd i{width:38px;height:38px;border-radius:11px;background:var(--g);flex:none;display:grid;place-items:center}.cd b{font-size:14.5px;font-weight:600;display:block}.cd p{font-size:13.5px;line-height:1.35;opacity:.88;margin-top:2px}.cd time{margin-left:auto;font-size:12px;opacity:.7;flex:none}
.cd .tx{flex:1;min-width:0}
.gr:not(.open) .cd:not(:first-of-type){margin-top:-52px;scale:var(--s);opacity:var(--o);pointer-events:none}
.gr:not(.open) .cd:nth-of-type(2){--s:.95;--o:.85;z-index:2}.gr:not(.open) .cd:nth-of-type(3){--s:.9;--o:.6;z-index:1}.gr:not(.open) .cd:nth-of-type(n+4){display:none}
.gr:not(.open) .cd:not(:first-of-type)>*{visibility:hidden}.gr.open .cd{margin-top:8px}.gr.open .cd:first-of-type{margin-top:0}
.cd.rm{opacity:0;transform:translateX(60px)}
.ct{position:absolute;right:-4px;top:-8px;min-width:22px;height:22px;border-radius:99px;background:#FF4D6D;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid rgba(255,255,255,.8);z-index:5;transition:opacity .2s}.gr.open .ct{opacity:0}
.cl{display:block;margin:6px auto 0;border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;font:600 13px 'Inter';padding:8px 18px;border-radius:99px;cursor:pointer}.cl:focus-visible{outline:2px solid #fff}
.sub{opacity:.75;font-size:12.5px;text-align:center;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="st"><div class="tm"><b id="t">9:41</b><span>Monday, November 9</span></div>
<div class="gr" id="g1" role="group" aria-label="Messages notifications"></div><div class="gr" id="g2" role="group" aria-label="Calendar notifications"></div>
<button class="cl" id="cl">Clear all</button><div class="sub">Tap a stack to expand it. Tap a notification to dismiss.</div></div>
<script>
const G={g1:['Messages',[['Priya Raman','Can you look at the pricing page before standup?','now','linear-gradient(135deg,#34D399,#059669)'],['Marcus Reid','Pushed the fix, ready for review','2m','linear-gradient(135deg,#34D399,#059669)'],['Elena Ortiz','Lunch at 12:30?','5m','linear-gradient(135deg,#34D399,#059669)'],['Tomas Berg','Sent you the brand files','8m','linear-gradient(135deg,#34D399,#059669)']]],g2:['Calendar',[['Design review in 15 minutes','Room 4 · Northwind redesign','10m','linear-gradient(135deg,#60A5FA,#2563EB)'],['Planning tomorrow','Review the roadmap with product','1h','linear-gradient(135deg,#60A5FA,#2563EB)']]]};
const ic={g1:'<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>',g2:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>'};
function draw(id){const el=document.getElementById(id),d=G[id],n=d[1].length;el.innerHTML='<div class="gh"><span>'+d[0]+'</span><button aria-label="Collapse or expand '+d[0]+'">'+(el.classList.contains('open')?'&minus;':'+')+'</button></div>'+d[1].map((c,i)=>'<button class="cd" data-i="'+i+'" style="--g:'+c[3]+'"><i>'+ic[id]+'</i><div class="tx"><b>'+c[0]+'</b><p>'+c[1]+'</p></div><time>'+c[2]+'</time></button>').join('')+(n>1?'<span class="ct" aria-label="'+n+' notifications">'+n+'</span>':'');el.style.display=n?'':'none';
 el.querySelector('.gh button').onclick=()=>{el.classList.toggle('open');draw(id)};
 el.querySelectorAll('.cd').forEach(b=>b.onclick=()=>{if(!el.classList.contains('open')&&n>1){el.classList.add('open');draw(id);return}b.classList.add('rm');setTimeout(()=>{d[1].splice(+b.dataset.i,1);draw(id)},300)})}
draw('g1');draw('g2');document.getElementById('g2').classList.add('open');draw('g2');
document.getElementById('cl').onclick=()=>{G.g1[1].length=0;G.g2[1].length=0;draw('g1');draw('g2')};
</script></body></html>
