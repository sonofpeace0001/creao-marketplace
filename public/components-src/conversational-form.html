<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conversational Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#14263A;background-image:radial-gradient(circle at 20% 10%,#1F3C5E,#14263A 60%);color:#F3EFE6;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{position:relative;width:100%;max-width:640px;min-height:440px}
.pb{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;width:var(--p,20%);background:linear-gradient(90deg,#FBBF24,#FB923C);border-radius:4px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.ct{position:absolute;left:0;top:22px;font:600 13px 'Inter';letter-spacing:.12em;text-transform:uppercase;color:#7F9BB8}
.st{position:absolute;left:0;right:0;top:80px;opacity:0;transform:translateY(40px);pointer-events:none;transition:all .55s cubic-bezier(.3,1,.4,1)}.st.on{opacity:1;transform:none;pointer-events:auto}.st.pr{opacity:0;transform:translateY(-40px)}
.q{display:flex;gap:14px;align-items:baseline}.q b{font:600 18px 'Inter';color:#FBBF24;display:flex;align-items:center;gap:6px;flex:none;margin-top:2px}.q h1{font:500 clamp(28px,5vw,40px)/1.15 'Fraunces',serif;letter-spacing:-.02em}
.sb{margin:10px 0 26px 36px;font-size:16px;color:#9DB4CC}
.an{margin-left:36px}.an input.t{width:100%;border:0;border-bottom:2px solid #3A5675;background:none;padding:10px 0;font:500 clamp(22px,3.4vw,30px) 'Fraunces',serif;color:#fff;outline:0;transition:border-color .2s}.an input.t:focus{border-color:#FBBF24}.an input::placeholder{color:#58728F}
.ch{display:grid;gap:10px;max-width:420px}.ch button{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid #3A5675;background:rgba(255,255,255,.04);color:#F3EFE6;border-radius:12px;padding:12px 14px;font:500 17px 'Inter';cursor:pointer;transition:all .2s}.ch button:hover{border-color:#FBBF24;background:rgba(251,191,36,.1)}.ch button kbd{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid #5A7798;display:grid;place-items:center;font:600 12px 'Inter';color:#9DB4CC}.ch button[aria-pressed=true]{border-color:#FBBF24;background:rgba(251,191,36,.16)}.ch button[aria-pressed=true] kbd{background:#FBBF24;color:#14263A;border-color:#FBBF24}.ch button:focus-visible{outline:2px solid #FBBF24;outline-offset:2px}
.ok{display:flex;align-items:center;gap:14px;margin-top:22px;margin-left:36px}.ok button{display:flex;align-items:center;gap:8px;border:0;background:#FBBF24;color:#14263A;border-radius:10px;padding:11px 20px;font:700 16px 'Inter';cursor:pointer;box-shadow:0 12px 22px -12px #FBBF24}.ok button:focus-visible{outline:3px solid #fff;outline-offset:3px}.ok span{font-size:13px;color:#7F9BB8}.ok span kbd{font:600 11.5px 'Inter';background:rgba(255,255,255,.1);border-radius:5px;padding:2px 7px}
.er{margin:10px 0 0 36px;font-size:14px;color:#FCA5A5;height:18px;opacity:0;transition:opacity .2s}.er.on{opacity:1}
.nv{position:absolute;right:0;bottom:0;display:flex;gap:6px}.nv button{width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center}.nv button:hover:not(:disabled){background:rgba(255,255,255,.2)}.nv button:disabled{opacity:.3;cursor:default}.nv button:focus-visible{outline:2px solid #FBBF24}
.dn{text-align:center;padding-top:30px}.dn i{display:grid;place-items:center;width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:#FBBF24;color:#14263A}.dn h1{font:500 40px/1.1 'Fraunces',serif}.dn p{color:#9DB4CC;margin-top:10px;font-size:17px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c" id="c"><div class="pb"><i id="pb"></i></div><div class="ct" id="ct">Question 1 of 4</div><div id="sts"></div>
<div class="nv"><button id="up" aria-label="Previous question"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button><button id="dw" aria-label="Next question"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div></div>
<script>
const Q=[{k:'name',q:'Hi there. What should we call you?',s:'Just your first name is fine.',t:'text',ph:'Type your answer...'},{k:'role',q:'Nice to meet you, {name}. What do you do?',s:'Pick the one that fits best.',t:'choice',o:['Designer','Engineer','Product manager','Founder']},{k:'size',q:'How big is your team?',s:'So we can suggest the right plan.',t:'choice',o:['Just me','2 to 10','11 to 50','50 and up']},{k:'email',q:'Where should we send your starter kit?',s:'We will never share your email.',t:'text',ph:'name@company.com',email:1}];
const A={};let cur=1;const sts=document.getElementById('sts');
Q.forEach((q,i)=>{const s=document.createElement('div');s.className='st';s.id='s'+i;s.innerHTML='<div class="q"><b>'+(i+1)+'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></b><h1 class="qt"></h1></div><p class="sb">'+q.s+'</p><div class="an">'+(q.t==='text'?'<input class="t" placeholder="'+q.ph+'" aria-label="Answer" autocomplete="off">':'<div class="ch">'+q.o.map((o,k)=>'<button type="button" aria-pressed="false" data-o="'+o+'"><kbd>'+String.fromCharCode(65+k)+'</kbd>'+o+'</button>').join('')+'</div>')+'</div><div class="er"></div><div class="ok"><button type="button">'+(i===Q.length-1?'Submit':'OK')+'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></button><span>press <kbd>Enter</kbd></span></div>';sts.appendChild(s);
 s.querySelectorAll('.ch button').forEach(b=>b.onclick=()=>{s.querySelectorAll('.ch button').forEach(x=>x.setAttribute('aria-pressed',x===b));A[q.k]=b.dataset.o;setTimeout(()=>next(),320)});s.querySelector('.ok button').onclick=()=>next()});
Q[1].o.length;A.name='Ada';
function text(i){return Q[i].q.replace('{name}',A.name||'friend')}
function show(){Q.forEach((q,i)=>{const s=document.getElementById('s'+i);s.classList.toggle('on',i===cur);s.classList.toggle('pr',i<cur);s.querySelector('.qt').textContent=text(i)});document.getElementById('pb').parentNode.style.setProperty('--p',(cur+1)/Q.length*100+'%');document.getElementById('pb').style.setProperty('--p',((cur+1)/Q.length*100)+'%');document.getElementById('ct').textContent='Question '+(cur+1)+' of '+Q.length;document.getElementById('up').disabled=cur===0;const f=document.querySelector('#s'+cur+' input');if(f&&!window.__init)f.focus()}
function next(){const q=Q[cur],s=document.getElementById('s'+cur);if(q.t==='text'){const v=s.querySelector('input').value.trim();const er=s.querySelector('.er');if(!v||q.email&&!/^\S+@\S+\.\S+$/.test(v)){er.textContent=!v?'Please fill this in.':'That does not look like an email.';er.classList.add('on');return}er.classList.remove('on');A[q.k]=v}else if(!A[q.k]){const er=s.querySelector('.er');er.textContent='Pick one to continue.';er.classList.add('on');return}
 if(cur===Q.length-1){sts.innerHTML='<div class="dn st on" style="position:static;opacity:1;transform:none"><i><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i><h1>Thanks, '+A.name+'.</h1><p>Your starter kit is on its way to '+A.email+'.</p></div>';document.getElementById('pb').style.setProperty('--p','100%');document.getElementById('ct').textContent='All done';document.querySelector('.nv').style.display='none';return}
 cur++;show()}
document.getElementById('dw').onclick=next;document.getElementById('up').onclick=()=>{if(cur>0){cur--;show()}};
addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();next()}const q=Q[cur];if(q&&q.t==='choice'&&/^[a-d]$/i.test(e.key)){const b=document.querySelectorAll('#s'+cur+' .ch button')[e.key.toLowerCase().charCodeAt(0)-97];if(b)b.click()}});
window.__init=true;show();A.role='Designer';document.querySelector('#s1 .ch button').setAttribute('aria-pressed','true');
</script></body></html>
