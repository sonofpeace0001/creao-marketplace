<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Foil Achievement Badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(600px 400px at 50% 0,#2B2150,transparent 70%),#0A0818;color:#F1EEFF;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:760px}
.hd{text-align:center;margin-bottom:30px}.hd small{font:400 12px 'Fragment Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#A89CFF}.hd h1{font-size:clamp(26px,4.4vw,36px);letter-spacing:-.045em;font-weight:800;margin-top:8px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;perspective:900px}
.m{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--o:0;position:relative;aspect-ratio:3/4;border-radius:22px;background:#15112B;border:1px solid #2A2350;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 8px;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .18s ease-out;cursor:pointer;text-align:center;font:inherit;color:inherit;overflow:hidden}
.m.rs{transition:transform .5s cubic-bezier(.2,.9,.2,1)}.m:focus-visible{outline:3px solid #fff;outline-offset:3px}
.md{position:relative;width:78px;height:78px;border-radius:50%;background:var(--g);display:grid;place-items:center;box-shadow:0 12px 24px -8px var(--c),inset 0 2px 3px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.25);transform:translateZ(40px)}
.md::before{content:"";position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(255,255,255,.55)}.md svg{position:relative;color:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.m b{font-size:14px;font-weight:700;letter-spacing:-.02em;transform:translateZ(24px)}.m span{font:400 11px 'Fragment Mono',monospace;color:#A8A0D8;transform:translateZ(18px)}
.foil{position:absolute;inset:0;border-radius:22px;background:conic-gradient(from calc(var(--ry)*10) at var(--mx) var(--my),#ff7ad9,#7af0ff,#fff27a,#7aff9a,#c27aff,#ff7ad9);mix-blend-mode:color-dodge;opacity:calc(var(--o)*.4);pointer-events:none;-webkit-mask:radial-gradient(circle at var(--mx) var(--my),#000,transparent 70%);mask:radial-gradient(circle at var(--mx) var(--my),#000,transparent 70%)}
.m.lk{filter:grayscale(1) brightness(.55)}.m.lk .md{box-shadow:none}.m.lk .foil{display:none}
.lkc{position:absolute;right:10px;top:10px;color:#8E87B8;display:none}.m.lk .lkc{display:block}
.pg{margin-top:26px}.pg .t{display:flex;justify-content:space-between;font-size:13px;color:#A8A0D8;margin-bottom:8px}.pg .bar{height:8px;border-radius:8px;background:#1E1940;overflow:hidden}.pg .bar i{display:block;height:100%;width:62%;border-radius:8px;background:linear-gradient(90deg,#8B5CF6,#F472B6);box-shadow:0 0 16px rgba(139,92,246,.7)}
@media(max-width:620px){.g{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.m{transition:none}}
</style></head><body>
<div class="w"><div class="hd"><small>Achievements</small><h1>Earn your stripes</h1></div><div class="g" id="g"></div>
<div class="pg"><div class="t"><span>5 of 8 unlocked</span><span>62%</span></div><div class="bar"><i></i></div></div></div>
<script>
const M=[['First Ship','Deploy once','linear-gradient(145deg,#FDE68A,#F59E0B)','#F59E0B','M12 3l3 6.500 7 .9-5.200 4.800 1.400 7-6.200-3.500L5.800 21.200l1.400-7L2 9.400l7-.9z',0],['Streak 7','7 days in a row','linear-gradient(145deg,#FDBA74,#EA580C)','#EA580C','M12 2s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 1-5 1-8z',0],['Team Player','Invite 5 people','linear-gradient(145deg,#93C5FD,#2563EB)','#2563EB','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.900M16 3.100a4 4 0 0 1 0 7.800',0],['Night Owl','Ship after midnight','linear-gradient(145deg,#C4B5FD,#7C3AED)','#7C3AED','M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z',0],['Bug Hunter','Fix 25 issues','linear-gradient(145deg,#86EFAC,#16A34A)','#16A34A','M8 2l1.900 1.900M16 2l-1.900 1.900M9 7.100V6a3 3 0 0 1 6 0v1.100M12 20a6 6 0 0 1-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3a6 6 0 0 1-6 6zM12 20v-9M6 13H2M22 13h-4M6 17l-3 1M18 17l3 1',1],['Speedrun','Ship in under 1h','linear-gradient(145deg,#F9A8D4,#DB2777)','#DB2777','M13 2L4 14h7l-1 8 9-12h-7z',1],['Polyglot','Use 5 languages','linear-gradient(145deg,#67E8F9,#0891B2)','#0891B2','M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3.600 9h16.800M3.600 15h16.800M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18',1],['Legend','Reach level 50','linear-gradient(145deg,#FCD34D,#B45309)','#B45309','M6 9H4.500a2.500 2.500 0 0 1 0-5H6M18 9h1.500a2.500 2.500 0 0 0 0-5H18M4 22h16M10 14.700V17c0 .600-.500 1-1.200 1.200C7.800 18.700 7 20.200 7 22M14 14.700V17c0 .600.500 1 1.200 1.200 1 .500 1.800 2 1.800 3.800M18 2H6v7a6 6 0 0 0 12 0z',1]];
const g=document.getElementById('g');g.innerHTML=M.map(m=>'<button class="m'+(m[5]?' lk':'')+'" style="--g:'+m[2]+';--c:'+m[3]+'" aria-label="'+m[0]+', '+m[1]+(m[5]?', locked':', unlocked')+'"><div class="foil"></div><svg class="lkc" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div class="md"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+m[4]+'"/></svg></div><b>'+m[0]+'</b><span>'+m[1]+'</span></button>').join('');
const C=[...g.children];
function tilt(c,x,y){const r=c.getBoundingClientRect(),px=(x-r.left)/r.width,py=(y-r.top)/r.height;c.classList.remove('rs');c.style.setProperty('--ry',((px-.5)*26)+'deg');c.style.setProperty('--rx',((.5-py)*26)+'deg');c.style.setProperty('--mx',(px*100)+'%');c.style.setProperty('--my',(py*100)+'%');c.style.setProperty('--o',1)}
function rst(c){c.classList.add('rs');c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.style.setProperty('--o',0)}
C.forEach(c=>{c.addEventListener('pointermove',e=>tilt(c,e.clientX,e.clientY));c.addEventListener('pointerleave',()=>rst(c));c.addEventListener('focus',()=>{const r=c.getBoundingClientRect();tilt(c,r.left+r.width*.7,r.top+r.height*.3)});c.addEventListener('blur',()=>rst(c))});
setTimeout(()=>{const r=C[1].getBoundingClientRect();tilt(C[1],r.left+r.width*.74,r.top+r.height*.3)},60);
</script></body></html>
