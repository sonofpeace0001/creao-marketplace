<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Docs Callout Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F4F0;color:#1C1B18;font-family:'Onest',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.dc{width:100%;max-width:640px;background:#fff;border-radius:24px;padding:30px 32px;box-shadow:0 36px 50px -34px rgba(28,27,24,.45),inset 0 0 0 1px rgba(28,27,24,.07)}
.dc h1{font-size:25px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}.dc>p{font-size:15px;line-height:1.6;color:#55524B;margin-bottom:16px}.dc code{font:500 13px 'Fira Code';background:#F0EEE8;padding:2px 6px;border-radius:5px}
.co{position:relative;display:grid;grid-template-columns:30px 1fr 26px;gap:12px;padding:14px 14px 14px 18px;border-radius:14px;background:var(--bg);margin-bottom:10px;overflow:hidden;max-height:140px}
.an .co{transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .35s,margin .5s,padding .5s,transform .5s}.co.gone{max-height:0;opacity:0;margin-bottom:0;padding-top:0;padding-bottom:0;transform:translateX(30px)}
.co::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);transform-origin:top;transform:scaleY(1)}
.an .co::before{animation:dr .7s cubic-bezier(.3,1,.4,1) both}@keyframes dr{from{transform:scaleY(0)}}
.ic{width:28px;height:28px;border-radius:9px;background:var(--c);display:grid;place-items:center}.ic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.600;fill:none;stroke-linecap:round;stroke-linejoin:round}
.co b{display:block;font-size:14.500px;font-weight:700;color:var(--t);margin-bottom:2px}.co span{font-size:14px;line-height:1.5;color:#44413B}
.x{width:26px;height:26px;border:0;border-radius:8px;background:none;color:#8A867C;font-size:16px;cursor:pointer}.x:hover{background:rgba(0,0,0,.06)}.x:focus-visible{outline:2px solid var(--c)}
.nt{--c:#3B82F6;--bg:#EEF4FF;--t:#1D4ED8}.tp{--c:#16A34A;--bg:#EAF8EF;--t:#15803D}.wn{--c:#F59E0B;--bg:#FFF6E3;--t:#B45309}.dg{--c:#EF4444;--bg:#FEEEEE;--t:#B91C1C}
.an .wn .ic{animation:wb 2.400s ease-in-out infinite}@keyframes wb{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-14deg)}84%{transform:rotate(12deg)}92%{transform:rotate(-6deg)}}
.an .dg .ic{animation:dp 1.800s ease-in-out infinite}@keyframes dp{50%{box-shadow:0 0 0 7px rgba(239,68,68,.18)}}
.an .tp .ic{animation:tb 2.600s ease-in-out infinite}@keyframes tb{50%{transform:translateY(-2px)}}
.rs{margin-top:8px;font:500 12px 'Fira Code';color:#8A867C}.rs button{border:0;background:#1C1B18;color:#fff;border-radius:99px;padding:5px 12px;font:600 12px 'Onest';cursor:pointer;margin-left:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="dc"><h1>Configure webhooks</h1><p>Send events to your server by registering an endpoint with <code>POST /v1/webhooks</code>.</p><div id="ls"></div><div class="rs"><span id="rs"></span><button id="rb">Restore all</button></div></div>
<script>
const I={nt:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.500h.01"/>',tp:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.700.600 1 1.300 1 2.100h5c0-.800.300-1.500 1-2.100A6 6 0 0 0 12 3Z"/>',wn:'<path d="M12 9v4M12 17h.01"/><path d="M10.300 3.900 2.400 17.500A2 2 0 0 0 4.100 20.500h15.800a2 2 0 0 0 1.700-3L13.700 3.900a2 2 0 0 0-3.400 0Z"/>',dg:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>'};
const C=[['nt','Note','Webhook endpoints must respond within 10 seconds or the delivery is retried.'],['tp','Tip','Use the CLI command stripe listen to forward live events to localhost while you build.'],['wn','Warning','Always verify the signature header. Skipping it lets anyone post fake events to your server.'],['dg','Danger','Rotating the signing secret invalidates every endpoint immediately. This cannot be undone.']];
const ls=document.getElementById('ls'),els=[];let off=false;
C.forEach((c,i)=>{const d=document.createElement('div');d.className='co '+c[0];d.innerHTML='<span class="ic"><svg viewBox="0 0 24 24">'+I[c[0]]+'</svg></span><div><b>'+c[1]+'</b><span>'+c[2]+'</span></div><button class="x" aria-label="Dismiss">×</button>';d.querySelector('.x').onclick=()=>{off=true;gone(i)};ls.appendChild(d);els.push(d)});
function gone(i,v=true){els[i].classList.toggle('gone',v);cnt()}
function cnt(){const n=els.filter(e=>e.classList.contains('gone')).length;document.getElementById('rs').textContent=n?n+' dismissed':'All callouts shown'}
document.getElementById('rb').onclick=()=>{off=true;els.forEach(e=>e.classList.remove('gone'));cnt()};
cnt();requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('an')));
/* Idle demo: each callout has its own personality, the Warning icon wobbles, the Danger icon pulses a red halo and the Tip bulb bobs while a coloured bar draws down the left edge; after a few seconds callouts dismiss one by one, collapsing and sliding out, and then they all return, until you dismiss one yourself. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sl=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sl(4200);while(!off){for(const i of [0,3,1]){if(off)return;gone(i);await sl(1500)}await sl(1400);if(off)return;els.forEach(e=>e.classList.remove('gone'));cnt();await sl(3400)}})()}
</script></body></html>
