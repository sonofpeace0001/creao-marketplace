<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Phone Orbit Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080A12;color:#fff;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:760px;height:520px;border-radius:30px;background:radial-gradient(420px 360px at 50% 55%,rgba(124,92,255,.38),transparent 70%),#0C0F1A;box-shadow:0 44px 70px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden;perspective:1400px}
.ph{position:absolute;left:50%;top:50%;width:230px;height:468px;margin:-234px 0 0 -115px;transform-style:preserve-3d;animation:sw 7s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotateY(-22deg) rotateX(6deg)}50%{transform:rotateY(22deg) rotateX(2deg)}}
.bd{position:absolute;inset:0;border-radius:42px;background:linear-gradient(145deg,#33364A,#10121C);padding:9px;box-shadow:0 40px 60px -20px #000,inset 0 0 0 2px #4A4E68,inset 0 0 0 5px #090A12}
.sc{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#111}.sc::after{content:"";position:absolute;left:50%;top:9px;width:70px;height:20px;margin-left:-35px;border-radius:99px;background:#000;z-index:5}
.sn{position:absolute;inset:0;padding:48px 18px 20px;opacity:0;transition:opacity .7s;display:flex;flex-direction:column}.sn.on{opacity:1}
.s1{background:linear-gradient(180deg,#5B3DF5,#2A1B8A)}.s2{background:linear-gradient(180deg,#F97316,#BE123C)}.s3{background:linear-gradient(180deg,#0EA5E9,#0F766E)}
.sn small{font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.8}.sn h2{font-size:30px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:6px 0 14px}.sn .bg{font-size:50px;font-weight:800;letter-spacing:-.06em;line-height:1;margin-top:auto}.sn .bg span{font-size:18px;opacity:.8;letter-spacing:0}
.sn .bar{display:flex;gap:5px;margin:10px 0}.sn .bar i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.28)}.sn .bar i.f{background:#fff}
.sn .row{display:flex;justify-content:space-between;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);font-size:13px;font-weight:600;margin-top:8px}
.fl{position:absolute;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 20px 36px -14px rgba(0,0,0,.6);display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;animation:bob 4s ease-in-out infinite;white-space:nowrap}
.fl i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;font-style:normal;background:var(--c)}.fl span{display:block;font-size:11.500px;font-weight:600;opacity:.7}
.f1{left:5%;top:16%;--c:#F97316}.f2{right:4%;top:40%;--c:#10B981;animation-delay:-1.300s}.f3{left:8%;bottom:14%;--c:#EC4899;animation-delay:-2.600s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ln{position:absolute;inset:0;pointer-events:none}.ln path{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.500;stroke-dasharray:4 7;animation:dh 3s linear infinite}@keyframes dh{to{stroke-dashoffset:-22}}
.fl.pop{animation:bob 4s ease-in-out infinite,pp .6s cubic-bezier(.3,2,.5,1)}@keyframes pp{from{scale:.6;opacity:.3}}
.sh{position:absolute;left:50%;bottom:22px;width:240px;height:26px;margin-left:-120px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%);animation:shd 7s ease-in-out infinite}@keyframes shd{50%{transform:scaleX(.8)}}
@media(max-width:620px){.fl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ph{transform:rotateY(-14deg)}}
</style></head><body>
<div class="st" id="st"><svg class="ln" viewBox="0 0 760 520" preserveAspectRatio="none"><path d="M240 130 Q330 150 380 220"/><path d="M520 240 Q470 250 440 260"/><path d="M240 400 Q320 360 370 320"/></svg>
<div class="fl f1"><i>🔥</i><div>12 day streak<span>Personal best</span></div></div><div class="fl f2"><i>💸</i><div>+$240.00<span>Saved this month</span></div></div><div class="fl f3"><i>🎯</i><div>Goal reached<span>Holiday fund</span></div></div>
<div class="ph"><div class="bd"><div class="sc"><div class="sn s1 on"><small>THIS WEEK</small><h2>You walked more than ever.</h2><div class="bar"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i></div><div class="bg">68,420<span> steps</span></div><div class="row"><span>Goal</span><b>70,000</b></div></div><div class="sn s2"><small>SPENDING</small><h2>Under budget by $184.</h2><div class="bar"><i class="f"></i><i class="f"></i><i class="f"></i><i></i></div><div class="bg">$2,316<span> / $2,500</span></div><div class="row"><span>Food</span><b>$620</b></div><div class="row"><span>Travel</span><b>$410</b></div></div><div class="sn s3"><small>SLEEP</small><h2>Seven hours, finally.</h2><div class="bar"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i></div><div class="bg">7h 12m<span> avg</span></div><div class="row"><span>Deep sleep</span><b>1h 48m</b></div></div></div></div></div><i class="sh"></i></div>
<script>
const sn=[...document.querySelectorAll('.sn')],fl=[...document.querySelectorAll('.fl')],sl=t=>new Promise(r=>setTimeout(r,t));let k=0,off=false;
document.getElementById('st').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a phone floats in 3D, swinging slowly through plus and minus 22 degrees of Y rotation with a matching shadow below, while its screen cross-fades every few seconds between a purple steps summary, an orange spending card and a teal sleep card, three glass feature chips bob around it joined by dashed lines that flow toward the phone, and each chip pops with a spring as its matching screen appears, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3000);while(!off){k=(k+1)%3;sn.forEach((s,i)=>s.classList.toggle('on',i===k));const f=fl[k];f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');await sl(2600)}})()}
</script></body></html>
