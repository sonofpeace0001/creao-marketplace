<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizon Grid Backdrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#12062B;color:#FFE8FB;font-family:'Rajdhani',sans-serif;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.sc{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:linear-gradient(#12062B 0%,#2A0B5A 45%,#6A1B7D 62%,#FF4FA3 100%)}
.sun{position:absolute;left:50%;bottom:36%;width:min(46vw,360px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#FFE66B,#FF7A59 55%,#FF2D87);box-shadow:0 0 90px rgba(255,79,163,.7);-webkit-mask:repeating-linear-gradient(transparent 0 calc(100% - 100%),#000 0),linear-gradient(#000,#000);}
.sun::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(#12062B 0 0,transparent 0 0);}
.sun{-webkit-mask:linear-gradient(#000 55%,transparent 55% 58%,#000 58% 66%,transparent 66% 70%,#000 70% 78%,transparent 78% 83%,#000 83%);mask:linear-gradient(#000 55%,transparent 55% 58%,#000 58% 66%,transparent 66% 70%,#000 70% 78%,transparent 78% 83%,#000 83%)}
.gr{position:absolute;left:-50%;right:-50%;bottom:0;height:38%;background:#12062B;perspective:300px;overflow:hidden;border-top:2px solid #FF4FA3;box-shadow:0 -6px 40px rgba(255,79,163,.6)}
.gr i{position:absolute;left:-50%;right:-50%;bottom:0;height:260%;background-image:linear-gradient(rgba(255,79,163,.9) 2px,transparent 2px),linear-gradient(90deg,rgba(0,229,255,.8) 2px,transparent 2px);background-size:64px 64px;transform:rotateX(62deg);transform-origin:50% 100%;animation:mv 1.1s linear infinite}
@keyframes mv{to{background-position:0 64px}}
.gr::after{content:"";position:absolute;inset:0;background:linear-gradient(#12062B,transparent 45%)}
.st{position:absolute;inset:0}.st b{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite}@keyframes tw{50%{opacity:.2}}
.ct{position:relative;text-align:center;padding:0 20px;margin-bottom:20vh}
.ct small{font:600 14px 'Rajdhani';letter-spacing:.5em;text-transform:uppercase;color:#7DF9FF;text-shadow:0 0 10px #12062B,0 0 4px #12062B}
.ct h1{font:900 clamp(40px,9vw,88px)/1 'Orbitron';letter-spacing:.04em;margin:12px 0 18px;background:linear-gradient(180deg,#fff,#FF9AD5 60%,#FF4FA3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,79,163,.6))}
.ct button{border:2px solid #7DF9FF;background:rgba(125,249,255,.08);color:#7DF9FF;font:700 15px 'Orbitron';letter-spacing:.2em;padding:14px 30px;border-radius:4px;cursor:pointer;box-shadow:0 0 24px rgba(125,249,255,.4),inset 0 0 18px rgba(125,249,255,.15);transition:all .2s}.ct button:hover{background:#7DF9FF;color:#12062B}.ct button:focus-visible{outline:3px solid #fff;outline-offset:4px}
@media(prefers-reduced-motion:reduce){.gr i,.st b{animation:none}}
</style></head><body>
<div class="sc"><div class="st" id="st" aria-hidden="true"></div><div class="sun" aria-hidden="true"></div>
<div class="ct"><small>Season 04 · Live now</small><h1>NEON<br>HORIZON</h1><button>ENTER THE GRID</button></div><div class="gr" aria-hidden="true"><i></i></div></div>
<script>
const st=document.getElementById('st');for(let i=0;i<70;i++){const b=document.createElement('b');b.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*52+'%;animation-delay:'+Math.random()*3+'s;opacity:'+(.4+Math.random()*.6);st.appendChild(b)}
</script></body></html>
