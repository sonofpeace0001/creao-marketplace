<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Period Morph Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0E15;color:#E8ECF6;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ap{display:grid;grid-template-columns:200px 1fr;width:100%;max-width:960px;background:#10141D;border:1px solid #1D2433;border-radius:26px;overflow:hidden;box-shadow:0 40px 80px -40px #000}
.sd{background:#0D1119;border-right:1px solid #1B2230;padding:20px 14px;display:flex;flex-direction:column;gap:4px}.sd .lg{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.04em;padding:0 8px 16px}.sd .lg i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#34D399,#38BDF8)}
.sd a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:500;color:#8590A8;text-decoration:none}.sd a.on{background:#171D2A;color:#fff}.sd a svg{flex:none}
.mn{padding:22px 24px}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}.hd h1{font-size:22px;font-weight:700;letter-spacing:-.04em}
.pt{position:relative;display:flex;background:#0B0E15;border:1px solid #1D2433;border-radius:12px;padding:3px}.pt .pl{position:absolute;top:3px;bottom:3px;border-radius:9px;background:#212A3C;transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s}.pt button{position:relative;z-index:1;border:0;background:none;padding:7px 16px;font:600 13px 'DM Sans';color:#7F8AA3;cursor:pointer;transition:color .2s}.pt button[aria-pressed=true]{color:#fff}.pt button:focus-visible{outline:2px solid #34D399;border-radius:9px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.k{background:#0C1017;border:1px solid #1B2230;border-radius:18px;padding:16px 18px}.k small{font-size:13px;color:#7F8AA3;font-weight:500}.k .v{display:flex;align-items:baseline;gap:8px;margin-top:6px}.k .v b{font:700 28px 'DM Sans';letter-spacing:-.05em;font-variant-numeric:tabular-nums}.k .v em{font:500 12.5px 'DM Mono',monospace;font-style:normal;color:#34D399;background:rgba(52,211,153,.12);border-radius:99px;padding:2px 8px}.k .v em.dn{color:#FB7185;background:rgba(251,113,133,.12)}
.ch{background:#0C1017;border:1px solid #1B2230;border-radius:18px;padding:18px 20px}.ch .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.ch .t b{font-size:15px;font-weight:600}.ch .t span{font-size:12.5px;color:#7F8AA3}
.bs{position:relative;height:190px;display:flex;align-items:flex-end;gap:5px}.bs .gl{position:absolute;inset:0 0 22px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.bs .gl i{border-top:1px dashed #1A2130}
.bs .cl{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bs .cl .b{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#34D399,#0E9F78);height:var(--h);transition:height .7s cubic-bezier(.3,1.1,.4,1);margin-bottom:22px;position:relative}.bs .cl:hover .b{filter:brightness(1.15)}
.bs .cl .b::after{content:attr(data-v);position:absolute;left:50%;top:-24px;transform:translateX(-50%);font:500 11px 'DM Mono',monospace;color:#E8ECF6;background:#1E2638;border-radius:6px;padding:2px 7px;opacity:0;transition:opacity .15s;white-space:nowrap}.bs .cl:hover .b::after{opacity:1}
.bs .cl span{position:absolute;bottom:0;font:500 11px 'DM Mono',monospace;color:#6A7590}
@media(max-width:760px){.ap{grid-template-columns:1fr}.sd{display:none}.kp{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="ap"><aside class="sd"><div class="lg"><i></i>Pulse</div><a href="#" class="on"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 14l4-4 4 4 5-6"/></svg>Overview</a><a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"/></svg>Customers</a><a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>Orders</a><a href="#"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>Settings</a></aside>
<main class="mn"><div class="hd"><h1>Overview</h1><div class="pt" id="pt"><span class="pl" id="pl"></span><button data-i="0">7 days</button><button data-i="1" aria-pressed="true">30 days</button><button data-i="2">90 days</button></div></div>
<div class="kp" id="kp"></div><div class="ch"><div class="t"><b>Daily revenue</b><span id="rg"></span></div><div class="bs" id="bs"></div></div></main></div>
<script>
const DS=[{l:'Last 7 days',k:[['Revenue',12.4,'$','k','+8.2%',0],['Orders',824,'','','+5.1%',0],['Avg. order',63.4,'$','','-1.4%',1]],b:[['Mon',48],['Tue',62],['Wed',55],['Thu',71],['Fri',84],['Sat',66],['Sun',52]]},{l:'Last 30 days',k:[['Revenue',48.2,'$','k','+12.4%',0],['Orders',3190,'','','+6.1%',0],['Avg. order',61.8,'$','','+2.3%',0]],b:Array.from({length:15},(_,i)=>['D'+(i*2+1),40+Math.round(28*Math.sin(i*.7)+i*2.2+((i*37)%11))])},{l:'Last 90 days',k:[['Revenue',131.6,'$','k','+21.7%',0],['Orders',9140,'','','+14.9%',0],['Avg. order',59.2,'$','','-3.1%',1]],b:Array.from({length:12},(_,i)=>['W'+(i+1),38+Math.round(22*Math.sin(i*.55)+i*3.4+((i*29)%9))])}];
let cur=1;const pt=document.getElementById('pt'),pl=document.getElementById('pl'),bt=[...pt.querySelectorAll('button')];
function mvp(){const b=bt[cur];pl.style.left=b.offsetLeft+'px';pl.style.width=b.offsetWidth+'px'}
function fmt(v,p,s){const d=s==='k'?1:(v%1?1:0);return p+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+s}
const kp=document.getElementById('kp'),bs=document.getElementById('bs');let shown=[0,0,0];
function render(first){const d=DS[cur];bt.forEach((b,i)=>b.setAttribute('aria-pressed',i===cur));mvp();document.getElementById('rg').textContent=d.l;
 if(!kp.children.length)kp.innerHTML=d.k.map((k,i)=>'<div class="k"><small>'+k[0]+'</small><div class="v"><b id="kv'+i+'"></b><em id="ke'+i+'"></em></div></div>').join('');
 d.k.forEach((k,i)=>{const e=document.getElementById('ke'+i);e.textContent=k[4];e.className=k[5]?'dn':'';const el=document.getElementById('kv'+i),from=first?k[1]:shown[i],to=k[1],t0=performance.now(),dur=first?0:700;function s(n){const f=dur?Math.min(1,(n-t0)/dur):1,e2=1-Math.pow(1-f,3),v=from+(to-from)*e2;el.textContent=fmt(v,k[2],k[3]);if(f<1)requestAnimationFrame(s);else shown[i]=to}requestAnimationFrame(s)});
 const mx=Math.max(...d.b.map(x=>x[1]))*1.12;const old=[...bs.querySelectorAll('.cl')];
 if(!bs.querySelector('.gl'))bs.innerHTML='<div class="gl"><i></i><i></i><i></i><i></i></div>';
 const need=d.b.length;while(bs.querySelectorAll('.cl').length<need){const c=document.createElement('div');c.className='cl';c.innerHTML='<div class="b" data-v=""></div><span></span>';c.querySelector('.b').style.height='0%';bs.appendChild(c)}
 const cls=[...bs.querySelectorAll('.cl')];cls.forEach((c,i)=>{if(i>=need){c.querySelector('.b').style.height='0%';setTimeout(()=>{if(i>=DS[cur].b.length)c.remove()},700);return}const b=c.querySelector('.b');if(first)b.style.transition='none';b.style.setProperty('--h',(d.b[i][1]/mx*85)+'%');b.style.height='var(--h)';b.dataset.v='$'+d.b[i][1]+'k'.replace('k','00');b.dataset.v='$'+(d.b[i][1]*100).toLocaleString();c.querySelector('span').textContent=d.b[i][0];if(first)requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.transition=''))})}
bt.forEach((b,i)=>b.onclick=()=>{cur=i;render(false)});
render(true);(document.fonts&&document.fonts.ready||Promise.resolve()).then(mvp);addEventListener('resize',mvp);
</script></body></html>
