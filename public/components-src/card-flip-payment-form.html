<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card Flip Payment Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7EAF5;color:#12152E;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:820px;background:#fff;border-radius:30px;padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;box-shadow:0 40px 70px -44px rgba(18,21,46,.5),0 0 0 1px rgba(18,21,46,.06)}
.cv{perspective:1000px}
.cd{position:relative;width:100%;max-width:340px;aspect-ratio:1.586;margin:0 auto;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.2,.4,1)}.cd.fl{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;color:#fff;padding:22px;background:linear-gradient(135deg,var(--a,#4F46E5),var(--b,#9333EA));box-shadow:0 30px 40px -18px var(--a,#4F46E5);transition:background .4s}
.fc::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}.fc::after{content:"";position:absolute;left:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.fr{display:flex;flex-direction:column;justify-content:space-between}.fr>*{position:relative;z-index:1}
.tp{display:flex;justify-content:space-between;align-items:center}.chip{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#FDE68A,#D4A72C);position:relative}.chip::before{content:"";position:absolute;inset:6px 9px;border:1.5px solid rgba(120,80,0,.4);border-radius:3px}.br{font:700 20px 'Sora';letter-spacing:-.04em;font-style:italic}
.nu{font:400 clamp(18px,3.2vw,24px) 'Share Tech Mono',monospace;letter-spacing:.1em;display:flex;gap:10px;text-shadow:0 2px 6px rgba(0,0,0,.2)}.nu span{display:inline-block;min-width:4ch}
.bt{display:flex;justify-content:space-between;align-items:flex-end}.bt small{display:block;font:500 9.5px 'Sora';letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-bottom:3px}.bt b{font:500 14px 'Share Tech Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.bk{transform:rotateY(180deg);padding:0}.bk .st{margin-top:26px;height:44px;background:#12152E}.bk .sg{margin:22px 22px 0;height:40px;border-radius:6px;background:repeating-linear-gradient(90deg,#fff 0 8px,#F0F0F5 8px 16px);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;color:#12152E;font:italic 500 18px 'Share Tech Mono',monospace;letter-spacing:.1em}.bk p{margin:14px 22px 0;font-size:10px;line-height:1.5;opacity:.8}
.fm h1{font-size:22px;font-weight:700;letter-spacing:-.045em;margin-bottom:4px}.fm p.sb{font-size:14px;color:#6D7298;margin-bottom:20px}
.f{margin-bottom:14px}.f label{display:block;font-size:12.5px;font-weight:600;color:#6D7298;margin-bottom:6px}.f input{width:100%;height:50px;border:2px solid #E1E4F2;border-radius:14px;padding:0 16px;font:500 16px 'Sora';color:#12152E;outline:0;transition:all .2s;background:#fff}.f input:focus{border-color:#4F46E5;box-shadow:0 0 0 4px rgba(79,70,229,.12)}.f input.bad{border-color:#EF4444}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{width:100%;height:54px;border:0;border-radius:16px;background:#12152E;color:#fff;font:600 16px 'Sora';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:transform .15s,background .3s}.go:hover{transform:translateY(-1px)}.go:focus-visible{outline:3px solid #4F46E5;outline-offset:3px}.go.dn{background:#16A34A}
.sec{display:flex;align-items:center;gap:7px;font-size:12px;color:#8A8FB0;margin-top:12px;justify-content:center}
@media(max-width:700px){.c{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.cd{transition:none}}
</style></head><body>
<div class="c"><div class="cv"><div class="cd" id="cd"><div class="fc fr" id="ff"><div class="tp"><div class="chip"></div><div class="br" id="br">CARD</div></div><div class="nu" id="nu"></div><div class="bt"><div><small>Card holder</small><b id="nm">YOUR NAME</b></div><div style="text-align:right"><small>Expires</small><b id="ex">MM/YY</b></div></div></div>
<div class="fc bk" id="fb"><div class="st"></div><div class="sg" id="cvv">***</div><p>Authorized signature. This card is property of the issuing bank and must be returned on request.</p></div></div></div>
<form class="fm" id="fm"><h1>Payment details</h1><p class="sb">The card turns as you move through the fields.</p>
<div class="f"><label for="n">Card number</label><input id="n" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" autocomplete="off"></div>
<div class="f"><label for="h">Name on card</label><input id="h" placeholder="Ada Lovelace" autocomplete="off"></div>
<div class="rw"><div class="f"><label for="x">Expiry</label><input id="x" inputmode="numeric" maxlength="5" placeholder="MM/YY" autocomplete="off"></div><div class="f"><label for="c">CVC</label><input id="c" inputmode="numeric" maxlength="4" placeholder="123" autocomplete="off"></div></div>
<button class="go" id="go" type="submit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="gl">Pay $48.00</span></button><div class="sec">Payments are encrypted and secured</div></form></div>
<script>
const $=id=>document.getElementById(id);const T={visa:['#1E3A8A','#3B82F6','VISA'],mc:['#7C2D12','#F97316','MASTERCARD'],amex:['#064E3B','#10B981','AMEX'],x:['#4F46E5','#9333EA','CARD']};
function type(v){if(/^4/.test(v))return 'visa';if(/^(5[1-5]|2[2-7])/.test(v))return 'mc';if(/^3[47]/.test(v))return 'amex';return 'x'}
function nu(){const raw=$('n').value.replace(/\D/g,''),t=type(raw),pad=(raw+'****************').slice(0,16);const g=[pad.slice(0,4),pad.slice(4,8),pad.slice(8,12),pad.slice(12,16)];$('nu').innerHTML=g.map(x=>'<span>'+x+'</span>').join('');const c=T[t];$('cd').style.setProperty('--a',c[0]);$('cd').style.setProperty('--b',c[1]);document.querySelectorAll('.fc').forEach(f=>{f.style.setProperty('--a',c[0]);f.style.setProperty('--b',c[1])});$('br').textContent=c[2]}
$('n').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,16);e.target.value=v.replace(/(.{4})/g,'$1 ').trim();nu()});
$('h').addEventListener('input',e=>$('nm').textContent=e.target.value.toUpperCase()||'YOUR NAME');
$('x').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v;$('ex').textContent=v||'MM/YY'});
$('c').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'');$('cvv').textContent=e.target.value||'***'});
$('c').addEventListener('focus',()=>$('cd').classList.add('fl'));$('c').addEventListener('blur',()=>$('cd').classList.remove('fl'));
$('fm').onsubmit=e=>{e.preventDefault();$('go').classList.add('dn');$('gl').textContent='Payment complete';setTimeout(()=>{$('go').classList.remove('dn');$('gl').textContent='Pay $48.00'},2000)};
$('n').value='4242 4242 4242 4242';$('h').value='Ada Lovelace';$('x').value='08/28';$('n').dispatchEvent(new Event('input'));$('h').dispatchEvent(new Event('input'));$('x').dispatchEvent(new Event('input'));
</script></body></html>
