<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Week Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2F0EA;color:#1F2A24;font-family:'Figtree',sans-serif;min-height:100vh;display:grid;place-items:center;padding:26px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -36px rgba(31,42,36,.45),0 0 0 1px rgba(31,42,36,.07)}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #ECE8DC}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.03em}.top h1 span{color:#8C9A90;font-weight:600}
.vw{display:flex;gap:4px;background:#F4F1E8;padding:4px;border-radius:12px}.vw button{border:0;background:none;font:700 13px 'Figtree';color:#7A887E;padding:7px 14px;border-radius:9px;cursor:pointer}.vw button[aria-pressed=true]{background:#fff;color:#1F2A24;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.hd{display:grid;grid-template-columns:54px repeat(7,1fr);border-bottom:1px solid #ECE8DC}
.hd div{text-align:center;padding:12px 0 10px}.hd small{display:block;font-size:11px;font-weight:700;color:#8C9A90;letter-spacing:.08em}
.hd b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:16px;font-weight:700;margin-top:4px}
.hd .t b{background:#E8530E;color:#fff}.hd .t small{color:#E8530E}
.body{position:relative;display:grid;grid-template-columns:54px repeat(7,1fr);height:330px;overflow-y:auto}
.hrs div{height:55px;font-size:11px;font-weight:600;color:#9AA79E;text-align:right;padding:0 10px;transform:translateY(-7px)}
.col{position:relative;border-left:1px solid #F0EDE2;background:repeating-linear-gradient(#fff 0 54px,#F0EDE2 54px 55px)}
.col.t{background:repeating-linear-gradient(#FFFBF6 0 54px,#F6E9DB 54px 55px)}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:6px 8px;font-size:11.5px;font-weight:700;line-height:1.25;color:var(--fg);background:var(--bg);border-left:3px solid var(--fg);cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:hidden}
.ev:hover,.ev:focus-visible{transform:scale(1.04);box-shadow:0 10px 18px -8px rgba(0,0,0,.35);z-index:3;outline:0}
.ev span{display:block;font-weight:500;opacity:.75;margin-top:1px}
.now{position:absolute;left:54px;right:0;height:2px;background:#E8530E;z-index:2}.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#E8530E}
@media(max-width:680px){.hd,.body{grid-template-columns:40px repeat(7,minmax(46px,1fr))}.c{overflow-x:auto}}
</style></head><body>
<div class="c"><div class="top"><h1>Week 42 <span>· Oct 14 – 20</span></h1><div class="vw" role="group" aria-label="View"><button aria-pressed="false">Day</button><button aria-pressed="true">Week</button><button aria-pressed="false">Month</button></div></div>
<div class="hd" id="hd"></div><div class="body" id="b"></div></div>
<script>
const D=['MON','TUE','WED','THU','FRI','SAT','SUN'],T=2;
document.getElementById('hd').innerHTML='<div></div>'+D.map((d,i)=>'<div class="'+(i===T?'t':'')+'"><small>'+d+'</small><b>'+(14+i)+'</b></div>').join('');
const col=(bg,fg)=>'--bg:'+bg+';--fg:'+fg;
const EV=[[0,1,2,'Design crit','10:00',col('#E6F0FF','#2563EB')],[0,5,1.5,'Standup','14:30',col('#E7F7EE','#16803C')],[1,0.5,1,'1:1 · Maya','09:30',col('#FDEBF3','#BE185D')],[1,3,2,'Workshop','12:00',col('#FFF2D9','#B45309')],[2,1,1,'Sprint plan','10:00',col('#E6F0FF','#2563EB')],[2,4,1.5,'Client call','13:00',col('#FDEBF3','#BE185D')],[3,0,2.5,'Focus block','09:00',col('#EEE9FF','#6D28D9')],[3,5,1,'Retro','14:00',col('#E7F7EE','#16803C')],[4,2,1.5,'Demo day','11:00',col('#FFF2D9','#B45309')],[4,4,1,'Happy hour','13:00',col('#EEE9FF','#6D28D9')]];
let h='<div class="hrs">'+Array.from({length:9},(_,i)=>'<div>'+(9+i>12?9+i-12:9+i)+(9+i>=12?' PM':' AM')+'</div>').join('')+'</div>';
for(let c=0;c<7;c++)h+='<div class="col'+(c===T?' t':'')+'" style="height:495px">'+EV.filter(e=>e[0]===c).map(e=>'<div class="ev" tabindex="0" style="top:'+(e[1]*55)+'px;height:'+(e[2]*55-4)+'px;'+e[5]+'">'+e[3]+'<span>'+e[4]+'</span></div>').join('')+(c===T?'<span class="now" style="top:'+(2.6*55)+'px;left:0;margin-left:0"></span>':'')+'</div>';
const b=document.getElementById('b');b.innerHTML=h;b.style.height='330px';
document.querySelectorAll('.vw button').forEach(x=>x.addEventListener('click',()=>document.querySelectorAll('.vw button').forEach(y=>y.setAttribute('aria-pressed',y===x))));
</script></body></html>
