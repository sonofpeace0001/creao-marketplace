<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wallet Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0D14;color:#EDEFFA;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:400px;border-radius:30px;padding:24px;background:radial-gradient(120% 90% at 0 0,#3B2A8C,transparent 55%),radial-gradient(100% 90% at 100% 100%,#0E7490,transparent 55%),#13162A;border:1px solid #2A2F55;box-shadow:0 50px 80px -40px #000}
.tp{display:flex;justify-content:space-between;align-items:center}.ad{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:6px 12px 6px 7px;font:500 13px 'Martian Mono',monospace;cursor:pointer;color:#EDEFFA;transition:background .15s}.ad:hover{background:rgba(255,255,255,.14)}.ad:focus-visible{outline:2px solid #fff;outline-offset:2px}.ad i{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EC4899)}
.net{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#A5F3FC}.net i{width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 8px #34D399}
.bl{margin:30px 0 4px;font-size:13px;color:#A8B0DC;font-weight:500}.am{font:600 44px 'Sora';letter-spacing:-.05em;display:flex;align-items:baseline;gap:10px}.am small{font-size:17px;color:#A8B0DC;letter-spacing:0;font-weight:500}
.ch{font:500 13px 'Martian Mono',monospace;color:#4ADE80;margin-top:2px}
.ac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.ac button{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);border-radius:18px;padding:14px 4px;font:600 13px 'Sora';color:#EDEFFA;cursor:pointer;transition:all .2s}.ac button:hover{background:rgba(255,255,255,.12);transform:translateY(-3px)}.ac button:focus-visible{outline:2px solid #fff;outline-offset:2px}.ac i{width:38px;height:38px;border-radius:50%;background:#EDEFFA;color:#13162A;display:grid;place-items:center}
.as{background:rgba(8,10,22,.5);border-radius:20px;padding:6px}.rw{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;transition:background .15s}.rw:hover{background:rgba(255,255,255,.05)}.rw .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 13px 'Sora';color:#fff;flex:none}.rw b{display:block;font-size:14.5px}.rw span{font:400 12px 'Martian Mono',monospace;color:#8E96C4}.rw .v{margin-left:auto;text-align:right}.rw .v b{font:500 13.5px 'Martian Mono',monospace}.rw .v span{color:#A8B0DC}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<article class="c"><div class="tp"><button class="ad" id="ad" aria-label="Copy wallet address"><i></i><span id="at">0x7a3F…c91E</span></button><span class="net"><i></i>Mainnet</span></div>
<p class="bl">Total balance</p><div class="am">$12,480.52<small>USD</small></div><div class="ch">+$318.40 (2.6%) today</div>
<div class="ac"><button><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></i>Send</button><button><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M16 17H7V8"/></svg></i>Receive</button><button><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg></i>Swap</button></div>
<div class="as"><div class="rw"><div class="ic" style="background:#627EEA">E</div><div><b>Ethereum</b><span>3.82 ETH</span></div><div class="v"><b>$9,214.10</b><span>+1.9%</span></div></div><div class="rw"><div class="ic" style="background:#2775CA">U</div><div><b>USD Coin</b><span>2,500.00 USDC</span></div><div class="v"><b>$2,500.00</b><span>0.0%</span></div></div><div class="rw"><div class="ic" style="background:#8247E5">P</div><div><b>Polygon</b><span>1,420 MATIC</span></div><div class="v"><b>$766.42</b><span>+4.2%</span></div></div></div></article>
<script>
document.getElementById('ad').onclick=()=>{const t=document.getElementById('at');navigator.clipboard&&navigator.clipboard.writeText('0x7a3F2b8d4e9c1a60f5b7d3e2c8a4916fc91E').catch(()=>{});t.textContent='Copied';setTimeout(()=>t.textContent='0x7a3F…c91E',1400)};
</script></body></html>
