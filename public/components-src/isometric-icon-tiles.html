<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Isometric Icon Tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 500px at 50% 30%,#2B2F6E,#0E1030 75%);color:#EEF0FF;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{display:grid;gap:8px;justify-items:center;text-align:center}
.w h1{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.05em}.w p{color:#9AA0D6;font-size:14px}
.sc{perspective:1400px;margin-top:28px}
.bd{display:grid;grid-template-columns:repeat(3,112px);gap:26px;transform:rotateX(58deg) rotateZ(-40deg);transform-style:preserve-3d}
.t{position:relative;width:112px;height:112px;transform-style:preserve-3d;cursor:pointer;outline:0}
.t .bs{position:absolute;inset:0;border-radius:22px;background:var(--c);transform:translateZ(0);box-shadow:0 0 0 2px rgba(255,255,255,.1) inset}
.t .sd{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h,14)*1px);background:var(--d);transform-origin:bottom;transform:rotateX(-90deg);border-radius:0 0 22px 22px}
.t .sr{position:absolute;top:0;bottom:0;right:0;width:calc(var(--h,14)*1px);background:var(--d2);transform-origin:right;transform:rotateY(90deg);border-radius:0 22px 22px 0}
.t .tp{position:absolute;inset:0;border-radius:22px;background:linear-gradient(135deg,var(--l),var(--c));transform:translateZ(calc(var(--h,14)*1px));display:grid;place-items:center;transition:transform .5s cubic-bezier(.3,1.5,.5,1);box-shadow:inset 0 0 0 1.500px rgba(255,255,255,.28)}
.t .ic{position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d;transform:translateZ(calc(var(--h,14)*1px + 8px));transition:transform .5s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.t .ic svg{width:44px;height:44px;transform:rotateZ(40deg) rotateX(-58deg);transform-origin:center;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}.t .ic svg *{fill:none;stroke:#fff;stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}
.t .sh{position:absolute;inset:6px;border-radius:22px;background:rgba(0,0,0,.4);filter:blur(10px);transform:translateZ(-2px) translate(14px,14px);transition:all .5s}
.t.up .tp{transform:translateZ(calc(var(--h,14)*1px + 30px))}.t.up .ic{transform:translateZ(calc(var(--h,14)*1px + 44px))}.t.up .sh{transform:translateZ(-2px) translate(26px,26px);filter:blur(16px)}
.t:focus-visible .bs{box-shadow:0 0 0 3px #fff}
.lb{position:absolute;left:50%;top:100%;margin-top:10px;transform:translateX(-50%) rotateZ(40deg) rotateX(-58deg);font:500 11px 'Geist Mono';letter-spacing:.1em;text-transform:uppercase;color:#fff;white-space:nowrap;opacity:0;transition:opacity .3s;background:rgba(14,16,48,.7);padding:4px 9px;border-radius:99px}
.t.up .lb{opacity:1}
@media(max-width:520px){.bd{grid-template-columns:repeat(3,80px);gap:18px;margin-top:20px}.t{width:80px;height:80px}.t .ic svg{width:32px;height:32px}.lb{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><h1>Icons with real depth</h1><p>Each tile is a slab: base, walls, a floating top and a shadow that follows.</p><div class="sc"><div class="bd" id="bd"></div></div></div>
<script>
const T=[['Deploy','#6D5BFF','#8E7FFF','#4A3BD1','#3A2EAA','<path d="M12 3c3 2 5 5 5 9l-2 2.500H9L7 12c0-4 2-7 5-9ZM9 15l-2 3.500 3-1M15 15l2 3.500-3-1"/><circle cx="12" cy="9.500" r="1.600"/>'],['Data','#16A394','#34D3C0','#0E7D72','#0A5E55','<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.700 3.100 3 7 3s7-1.300 7-3V6M5 12v6c0 1.700 3.100 3 7 3s7-1.300 7-3v-6"/>'],['Auth','#F2693A','#FF9366','#C04A22','#9A381A','<rect x="5" y="10.500" width="14" height="10" rx="2.500"/><path d="M8 10.500V8a4 4 0 0 1 8 0v2.500M12 14.500v2.500"/>'],['Billing','#E8467C','#FF74A1','#B52F5E','#8F234A','<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.500h18M7 15h3"/>'],['Search','#2D8CFF','#63AEFF','#1D68C9','#1650A0','<circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/>'],['Alerts','#F2B01E','#FFD055','#C48A0E','#9A6B08','<path d="M6 9.500a6 6 0 0 1 12 0c0 5.500 2 7 2 7H4s2-1.500 2-7ZM10 20a2 2 0 0 0 4 0"/>']];
const bd=document.getElementById('bd');
T.forEach(([n,c,l,d,d2,p],i)=>{const t=document.createElement('div');t.className='t';t.tabIndex=0;t.setAttribute('role','img');t.setAttribute('aria-label',n);t.style.cssText='--c:'+c+';--l:'+l+';--d:'+d+';--d2:'+d2+';--h:'+(12+(i%3)*4);
 t.innerHTML='<div class="sh"></div><div class="bs"></div><div class="sd"></div><div class="sr"></div><div class="tp"></div><div class="ic"><svg viewBox="0 0 24 24">'+p+'</svg></div><span class="lb">'+n+'</span>';
 t.addEventListener('pointerenter',()=>{off=true;t.classList.add('up')});t.addEventListener('pointerleave',()=>t.classList.remove('up'));t.addEventListener('focus',()=>t.classList.add('up'));t.addEventListener('blur',()=>t.classList.remove('up'));bd.appendChild(t)});
const tiles=[...bd.children];tiles[4].classList.add('up');
/* Idle demo: a wave lifts the tiles one after another, each rising on its slab with its shadow stretching, until a pointer arrives. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms)),order=[0,1,2,5,4,3];(async()=>{await sleep(3600);while(!off){for(const i of order){if(off)return;tiles.forEach(t=>t.classList.remove('up'));tiles[i].classList.add('up');await sleep(900)}}tiles.forEach(t=>t.classList.remove('up'))})()}
</script></body></html>
