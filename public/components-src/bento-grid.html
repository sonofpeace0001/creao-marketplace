<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Control Room Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F4;--ink:#12141C;--m:#6A6F80;--b:#2F6BFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',sans-serif;min-height:100vh;display:grid;place-items:center;padding:36px 20px;-webkit-font-smoothing:antialiased}
.g{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,150px);gap:12px}
.c{background:#fff;border-radius:24px;padding:20px;box-shadow:0 0 0 1px rgba(18,20,28,.06);position:relative;overflow:hidden;transition:transform .3s}
.c:hover{transform:translateY(-3px)}
.c h2{font-size:15px;font-weight:700;letter-spacing:-.02em}.c small{font-size:12px;color:var(--m);font-weight:500}
.hero{grid-column:span 2;grid-row:span 2;background:linear-gradient(155deg,#2F6BFF,#1B3FD6 60%,#14289A);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.hero small{color:#B8CBFF}.hero h2{font-size:30px;letter-spacing:-.045em;line-height:1.02;font-weight:800;max-width:300px;margin-top:8px}
.hero .pl{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);padding:8px 13px;border-radius:99px;font-size:13px;font-weight:600}
.dots{position:absolute;right:-30px;top:-30px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.big{font-size:44px;font-weight:800;letter-spacing:-.06em;line-height:1;margin-top:8px}
.up{display:inline-block;font-size:12px;font-weight:700;color:#0E9F6E;background:#DDF7EC;padding:3px 8px;border-radius:99px;margin-top:8px}
.spark{position:absolute;left:0;right:0;bottom:0;height:56px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;font-size:11px;text-align:center;color:var(--m);font-weight:600}
.cal span{padding:5px 0;border-radius:8px}.cal .on{background:var(--ink);color:#fff}.cal .ev{background:#E8EEFF;color:var(--b)}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--b) 0 72%,#E9ECF3 0);display:grid;place-items:center;margin-top:8px}
.ring i{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 17px 'Figtree';font-style:normal;letter-spacing:-.04em}
.wide{grid-column:span 2}
.team{display:flex;margin-top:14px}.team i{width:40px;height:40px;border-radius:50%;border:3px solid #fff;margin-left:-10px;display:grid;place-items:center;font:700 12px 'Figtree';color:#fff;font-style:normal}.team i:first-child{margin-left:0}
@media(max-width:720px){.g{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.hero{grid-column:span 2}.c{min-height:150px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="g">
 <div class="c hero"><div class="dots"></div><div><small>Command center</small><h2>Every project, one calm view.</h2></div><div class="pl"><span class="pill">12 projects</span><span class="pill">3 need review</span></div></div>
 <div class="c"><small>Velocity</small><div class="big">94%</div><span class="up">▲ 8.2%</span>
  <svg class="spark" viewBox="0 0 200 56" preserveAspectRatio="none"><path d="M0 44C25 40 35 24 60 28S100 8 125 18 170 6 200 2V56H0Z" fill="rgba(47,107,255,.14)"/><path d="M0 44C25 40 35 24 60 28S100 8 125 18 170 6 200 2" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-linecap="round"/></svg></div>
 <div class="c"><small>Sprint goal</small><div class="ring"><i>72%</i></div></div>
 <div class="c wide"><h2>This week</h2><div class="cal"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span><span>12</span><span class="on">13</span><span class="ev">14</span><span>15</span><span class="ev">16</span><span>17</span><span>18</span></div></div>
 <div class="c wide"><h2>Next milestone</h2><small>Public beta · Oct 28</small><div style="height:10px;border-radius:99px;background:#E9ECF3;margin-top:22px;overflow:hidden"><i style="display:block;height:100%;width:68%;border-radius:99px;background:linear-gradient(90deg,#2F6BFF,#6C8CFF)"></i></div><div style="display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--m);font-weight:600"><span>17 of 25 tasks</span><span>68%</span></div></div>
 <div class="c wide"><h2>Team online</h2><small>6 of 9 active now</small><div class="team"><i style="background:#2F6BFF">AK</i><i style="background:#10B981">MR</i><i style="background:#F59E0B">JT</i><i style="background:#EC4899">SL</i><i style="background:#8B5CF6">DP</i><i style="background:#12141C">+4</i></div></div>
</div></body></html>
