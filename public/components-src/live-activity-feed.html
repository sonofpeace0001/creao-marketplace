<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Activity Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F5F2;color:#18181B;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:480px;background:#fff;border-radius:26px;box-shadow:0 40px 70px -44px rgba(24,24,27,.5),0 0 0 1px rgba(24,24,27,.07);overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #F0F0EC}.hd h1{font-size:18px;font-weight:700;letter-spacing:-.035em;display:flex;align-items:center;gap:10px}
.lv{display:inline-flex;align-items:center;gap:6px;font:500 11.5px 'Geist Mono',monospace;color:#16A34A;background:#DCFCE7;padding:3px 9px;border-radius:99px;letter-spacing:.06em}.lv i{width:6px;height:6px;border-radius:50%;background:#16A34A;animation:pg 1.6s infinite}@keyframes pg{50%{opacity:.3}}
.hd button{border:1px solid #E4E4E0;background:#fff;color:#3F3F46;border-radius:10px;padding:7px 12px;font:600 13px 'Geist';cursor:pointer}.hd button:hover{background:#F6F6F2}.hd button:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.nb{display:none;margin:12px 16px 0;border:0;width:calc(100% - 32px);background:#4F46E5;color:#fff;border-radius:12px;padding:9px;font:600 13px 'Geist';cursor:pointer;animation:dn .35s cubic-bezier(.3,1.4,.5,1)}.nb.on{display:block}@keyframes dn{from{opacity:0;transform:translateY(-10px)}}
.ls{list-style:none;height:380px;overflow-y:auto;padding:8px 8px 14px;scroll-behavior:smooth}.ls::-webkit-scrollbar{width:0}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;position:relative;animation:in .5s cubic-bezier(.3,1.2,.4,1);transition:background .2s}.it:hover{background:#F8F8F5}
@keyframes in{from{opacity:0;transform:translateY(-14px) scale(.97);max-height:0;padding-top:0;padding-bottom:0}to{max-height:120px}}
.it.nw{background:#F1F0FF}.it.nw::before{content:"";position:absolute;left:4px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#4F46E5}
.av{width:38px;height:38px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;position:relative}.av b{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--t);border:2px solid #fff;display:grid;place-items:center}
.tx{flex:1;min-width:0;font-size:14px;line-height:1.45;color:#52525B}.tx strong{color:#18181B;font-weight:600}.tx em{font-style:normal;color:#18181B;font-weight:500;background:#F3F3EF;padding:1px 6px;border-radius:6px;font-size:13px}.tx time{display:block;font:500 11.5px 'Geist Mono',monospace;color:#A1A1AA;margin-top:3px}
.ft{padding:12px 22px;border-top:1px solid #F0F0EC;font-size:13px;color:#A1A1AA;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Activity <span class="lv"><i></i>LIVE</span></h1><button id="pb">Pause</button></div><button class="nb" id="nb"></button><ul class="ls" id="ls" aria-live="polite"></ul><div class="ft">Updating in real time</div></div>
<script>
const P=[['Priya','linear-gradient(135deg,#8B5CF6,#5B3FE0)'],['Marcus','linear-gradient(135deg,#38BDF8,#2563EB)'],['Elena','linear-gradient(135deg,#34D399,#059669)'],['Tomas','linear-gradient(135deg,#FB923C,#EA580C)'],['Aiko','linear-gradient(135deg,#F472B6,#DB2777)']];
const E=[['commented on','Pricing page redesign','#3B82F6','M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],['merged','PR #482 Fix checkout timeout','#8B5CF6','M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9'],['deployed','northwind-web to production','#10B981','M12 2L4 14h7l-1 8 9-12h-7z'],['closed','Issue: Export fails on Safari','#F59E0B','M5 12.500l4.500 4.500L19 7'],['invited','sam@acme.co to the workspace','#EC4899','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8']];
const ls=document.getElementById('ls'),nb=document.getElementById('nb');let n=0,paused=false,unseen=0,t=0;
function add(init){const p=P[n%5],e=E[(n*3+1)%5];n++;const li=document.createElement('li');li.className='it'+(init?'':' nw');
 li.innerHTML='<span class="av" style="--g:'+p[1]+';--t:'+e[2]+'">'+p[0].slice(0,2)+'<b><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="'+e[3]+'"/></svg></b></span><div class="tx"><strong>'+p[0]+'</strong> '+e[0]+' <em>'+e[1]+'</em><time>'+(init?(n*3)+' min ago':'just now')+'</time></div>';
 ls.prepend(li);if(!init){if(ls.scrollTop>40){unseen++;nb.textContent=unseen+' new '+(unseen>1?'updates':'update');nb.classList.add('on')}}
 while(ls.children.length>30)ls.lastChild.remove()}
for(let i=0;i<7;i++)add(true);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){if(!paused)add(false)}
if(!reduced)setInterval(tick,2600);
nb.onclick=()=>{ls.scrollTo({top:0});unseen=0;nb.classList.remove('on')};ls.addEventListener('scroll',()=>{if(ls.scrollTop<10){unseen=0;nb.classList.remove('on')}});
document.getElementById('pb').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
setTimeout(()=>{add(false);add(false)},120);
</script></body></html>
