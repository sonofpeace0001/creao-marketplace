<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Parallax Slide Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0D;color:#fff;font-family:'Archivo',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.vp{position:relative;width:100%;max-width:780px;aspect-ratio:16/9;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 44px 70px -34px #000;touch-action:pan-y;user-select:none}
.sl{position:absolute;inset:0;overflow:hidden;will-change:transform}
.ly{position:absolute;inset:0;will-change:transform}.bg svg{width:100%;height:100%;display:block;transform:scale(1.15)}
.nm{display:grid;align-items:center;justify-items:start;padding-left:6%;font:400 330px/1 'Anton';color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.35);letter-spacing:-.02em}
.fg{display:flex;flex-direction:column;justify-content:flex-end;padding:0 7% 11%}.fg small{font:500 12px 'DM Mono';letter-spacing:.24em;text-transform:uppercase;color:#FFD08A;margin-bottom:10px}.fg h2{font:400 82px/.92 'Anton';text-transform:uppercase;letter-spacing:.005em;text-shadow:0 8px 30px rgba(0,0,0,.45)}.fg p{font-size:16px;line-height:1.5;max-width:340px;margin-top:14px;color:rgba(255,255,255,.88)}
.vp::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 60%);pointer-events:none;z-index:2}
.ct{position:absolute;left:7%;right:7%;bottom:5%;z-index:4;display:flex;align-items:center;gap:16px}.ct .dt{display:flex;gap:7px}.ct .dt i{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;cursor:pointer;position:relative}.ct .dt i b{position:absolute;inset:0;width:var(--w,0%);background:#fff;display:block}
.ct span{margin-left:auto;font:500 13px 'DM Mono'}.ct button{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;font-size:18px;cursor:pointer}.ct button:hover{background:rgba(255,255,255,.3)}.ct button:focus-visible{outline:2px solid #fff}
@media(max-width:640px){.fg h2{font-size:44px}.nm{font-size:170px}}
</style></head><body>
<div class="vp" id="vp"><div class="ct"><div class="dt" id="dt"></div><span id="cn">01 / 04</span><button id="pv" aria-label="Previous">‹</button><button id="nx" aria-label="Next">›</button></div></div>
<script>
function scene(s){const r=(n=1)=>{s=(s*9301+49297)%233280;return s/233280*n};const P=[['#1B2A6B','#E85D75','#FFB86B'],['#0B3B3C','#2FA58B','#F4E285'],['#3A1C5B','#C4478D','#FF9E7A'],['#10243A','#3D7BA8','#F2D8A7']][Math.floor(r(4))];const id='g'+Math.floor(s);let h='<svg viewBox="0 0 780 440" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P[0]+'"/><stop offset=".55" stop-color="'+P[1]+'"/><stop offset="1" stop-color="'+P[2]+'"/></linearGradient></defs><rect width="780" height="440" fill="url(#'+id+')"/><circle cx="'+(300+r(380))+'" cy="'+(110+r(70))+'" r="'+(44+r(30))+'" fill="#FFF3D1" opacity=".95"/>';for(let l=0;l<4;l++){let d='M0 440L0 '+(270+l*44);const a=40+r(50),f=.005+r(.006),ph=r(6);for(let x=0;x<=780;x+=12)d+=' L'+x+' '+(270+l*44-a*Math.abs(Math.sin(x*f+ph))-a*.35*Math.sin(x*f*2.3+ph*2)).toFixed(1);d+=' L780 440Z';h+='<path d="'+d+'" fill="#0C0A14" opacity="'+(.2+l*.22)+'"/>'}return h+'</svg>'}
const S=[['Chapter one','Into the Fjord','Cold water, warm light and a boat that only runs at dawn.',7],['Chapter two','Cedar and Mist','A three-day walk between mountain temples with no signal at all.',19],['Chapter three','Blue Hour','The medina after sunset, when every lamp turns the walls electric.',28],['Chapter four','Salt and Sky','A mirror the size of a country, and the horizon gone entirely.',41]];
const vp=document.getElementById('vp'),dt=document.getElementById('dt'),sl=[],ms=ms=>new Promise(r=>setTimeout(r,ms));let p=0,tg=0,off=false,v=0;const dots=[];
S.forEach((s,i)=>{const d=document.createElement('div');d.className='sl';d.innerHTML='<div class="ly bg">'+scene(s[3])+'</div><div class="ly nm">0'+(i+1)+'</div><div class="ly fg"><small>'+s[0]+'</small><h2>'+s[1]+'</h2><p>'+s[2]+'</p></div>';vp.insertBefore(d,vp.firstChild);sl.push(d);const b=document.createElement('i');b.innerHTML='<b></b>';b.onclick=()=>{off=true;tg=i};dt.appendChild(b);dots.push(b.firstChild)});
function paint(){const W=vp.clientWidth;sl.forEach((d,i)=>{const o=i-p;d.style.transform='translateX('+(o*W)+'px)';d.style.visibility=Math.abs(o)<1.05?'visible':'hidden';const L=d.children;L[0].style.transform='translateX('+(-o*W*.55)+'px)';L[1].style.transform='translateX('+(-o*W*.1+o*W*.25)+'px)';L[2].style.transform='translateX('+(o*W*.32)+'px)';L[2].style.opacity=Math.max(0,1-Math.abs(o)*1.4)});const cur=Math.round(p);dots.forEach((b,i)=>b.style.setProperty('--w',i===cur?'100%':i<cur?'100%':'0%'));document.getElementById('cn').textContent='0'+(cur+1)+' / 0'+S.length}
document.getElementById('nx').onclick=()=>{off=true;tg=(tg+1)%S.length};document.getElementById('pv').onclick=()=>{off=true;tg=(tg-1+S.length)%S.length};
let dragX=null,startP=0;vp.addEventListener('pointerdown',e=>{off=true;dragX=e.clientX;startP=p;vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(dragX===null)return;p=Math.max(0,Math.min(S.length-1,startP-(e.clientX-dragX)/vp.clientWidth));tg=p});vp.addEventListener('pointerup',()=>{if(dragX!==null){tg=Math.round(p);dragX=null}});
p=tg=0;paint();
/* Idle demo: four full-bleed slides move with real parallax, the landscape drifts at about half speed, the huge outlined numeral at a different rate and the headline faster than the slide itself; the headline fades as it leaves, and a spring-eased glide takes the carousel to the next slide every few seconds while the dash indicators fill, until you drag, click an arrow or click a dash. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let last=0,tm=0;requestAnimationFrame(function lp(n){const dt2=Math.min(.05,(n-last)/1000||0);last=n;if(!off&&n>3000){tm+=dt2;if(tm>3.4){tm=0;tg=(Math.round(tg)+1)%S.length}}if(dragX===null){const wrap=tg===0&&p>S.length-1.5?S.length:tg;v+=(wrap-p)*dt2*30;v*=.82;p+=v*dt2*3;if(Math.abs(wrap-p)<.0008&&Math.abs(v)<.01){p=wrap;if(wrap===S.length){p=0;tg=0}}}paint();requestAnimationFrame(lp)})}
</script></body></html>
