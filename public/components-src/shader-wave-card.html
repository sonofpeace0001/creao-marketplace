<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wave Field Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06070D;min-height:100vh;display:grid;place-items:center;padding:30px 20px;font-family:'Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.card{--x:50%;--y:40%;position:relative;width:100%;max-width:520px;aspect-ratio:4/3;border-radius:30px;overflow:hidden;background:#0A0B14;border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 80px -30px #000;isolation:isolate}
.w{position:absolute;inset:-30%;z-index:-2;background:
 radial-gradient(40% 40% at 25% 30%,#00E0C6,transparent 70%),
 radial-gradient(44% 44% at 78% 24%,#5B3DFF,transparent 70%),
 radial-gradient(46% 46% at 62% 82%,#FF3D8B,transparent 70%),
 radial-gradient(34% 34% at 14% 82%,#FFB020,transparent 70%);
 filter:blur(26px) saturate(1.3);animation:w 14s ease-in-out infinite alternate}
@keyframes w{0%{transform:rotate(0) scale(1)}50%{transform:rotate(8deg) scale(1.12) translate(3%,-2%)}100%{transform:rotate(-6deg) scale(1.05) translate(-3%,3%)}}
.m{position:absolute;inset:0;z-index:-1;background:radial-gradient(260px circle at var(--x) var(--y),rgba(255,255,255,.35),transparent 65%);mix-blend-mode:overlay;transition:opacity .3s}
.ln{position:absolute;inset:0;z-index:-1;opacity:.5;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 1px,transparent 1px 14px);mask-image:linear-gradient(180deg,transparent,#000 60%)}
.c{position:absolute;inset:0;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(8,9,18,.5);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:99px}
.pill i{width:7px;height:7px;border-radius:50%;background:#00E0C6;box-shadow:0 0 10px #00E0C6}
h1{font:800 clamp(30px,6vw,46px)/.98 'Syne';letter-spacing:-.045em}
p{margin-top:10px;max-width:300px;font-size:14.5px;color:rgba(255,255,255,.82);line-height:1.5}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.go{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0A0B14;font-weight:600;font-size:14px;padding:12px 18px;border-radius:14px;text-decoration:none;transition:transform .2s}.go:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){.w{animation:none}}
</style></head><body>
<article class="card" id="c"><div class="w"></div><div class="ln"></div><div class="m"></div>
 <div class="c"><span class="pill"><i></i>Generative · live</span>
  <div class="row"><div><h1>Wave field</h1><p>A living colour shader that leans toward your cursor. Drop it behind any hero.</p></div><a class="go" href="#">Get the shader <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div></div></article>
<script>
const c=document.getElementById('c');
c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--x',(e.clientX-r.left)+'px');c.style.setProperty('--y',(e.clientY-r.top)+'px')});
</script></body></html>
