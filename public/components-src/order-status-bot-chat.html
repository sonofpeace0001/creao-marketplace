<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order Status Bot Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0C1411;color:#E8F2EC;font-family:'Hanken Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 14px;-webkit-font-smoothing:antialiased}
.wd{width:100%;max-width:420px;height:610px;background:#121C17;border-radius:30px;box-shadow:0 44px 64px -30px #000,inset 0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.07)}.av{width:38px;height:38px;border-radius:12px;background:#34D399;color:#06281D;display:grid;place-items:center;font-weight:800;font-size:17px}.hd b{display:block;font-size:15.500px}.hd span{font:500 11.500px 'Fira Code';color:#6FA38A}
.ms{flex:1;overflow:hidden;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:9px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14.500px;line-height:1.4;animation:in .45s cubic-bezier(.3,1.5,.5,1)}@keyframes in{from{opacity:0;transform:translateY(12px) scale(.95)}}
.m.b{align-self:flex-start;background:#1B2A23;border-bottom-left-radius:5px}.m.u{align-self:flex-end;background:#34D399;color:#06281D;font-weight:700;border-bottom-right-radius:5px}
.oc{align-self:stretch;background:#18251F;border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);animation:in .5s cubic-bezier(.3,1.4,.5,1)}
.oc .t{display:flex;align-items:center;gap:12px;margin-bottom:14px}.oc .bx{width:46px;height:46px;border-radius:14px;background:#233A2F;display:grid;place-items:center;font-size:24px;animation:bb 2.400s ease-in-out infinite}@keyframes bb{50%{transform:translateY(-3px) rotate(-4deg)}}
.oc .t b{display:block;font-size:15.500px}.oc .t span{font:500 12px 'Fira Code';color:#6FA38A}.oc .eta{margin-left:auto;text-align:right}.oc .eta b{font:800 22px 'Hanken Grotesk';letter-spacing:-.03em;color:#34D399;font-variant-numeric:tabular-nums}.oc .eta span{display:block;font:500 10.500px 'Fira Code'}
.st{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:6px}.st::before,.st::after{content:"";position:absolute;left:12.500%;top:11px;height:3px;border-radius:2px}.st::before{right:12.500%;background:#26382F}.st::after{width:var(--w,0%);background:linear-gradient(90deg,#34D399,#6EE7B7);transition:width 1.100s cubic-bezier(.4,0,.2,1)}
.sp{position:relative;z-index:1;text-align:center;font-size:11.500px;font-weight:700;color:#5E8070}.sp i{display:block;width:24px;height:24px;border-radius:50%;margin:0 auto 6px;background:#1B2A23;box-shadow:inset 0 0 0 3px #26382F;transition:all .5s cubic-bezier(.3,1.7,.5,1);display:grid;place-items:center;font-style:normal;font-size:12px;color:#06281D}.sp.on{color:#E8F2EC}.sp.on i{background:#34D399;box-shadow:none;transform:scale(1.1)}.sp.cu i{animation:cp 1.600s infinite}@keyframes cp{50%{box-shadow:0 0 0 7px rgba(52,211,153,.2)}}.sp.cu i{box-shadow:0 0 0 0 rgba(52,211,153,.4)}
.ac{display:flex;gap:8px;margin-top:14px}.ac button{flex:1;border:0;border-radius:12px;padding:10px;background:#233A2F;color:#C9E8D8;font:700 13px 'Hanken Grotesk';cursor:pointer}.ac button:first-child{background:#34D399;color:#06281D}.ac button:focus-visible{outline:2px solid #34D399}
.in{display:flex;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07)}.in div{flex:1;padding:11px 15px;border-radius:99px;background:#1B2A23;font-size:14px;color:#5E8070}.in button{width:42px;border:0;border-radius:50%;background:#34D399;color:#06281D;font-size:17px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wd"><div class="hd"><div class="av">N</div><div><b>Nest Support Bot</b><span>online · order lookups</span></div></div><div class="ms" id="ms"></div><div class="in"><div>Ask about your order…</div><button aria-label="Send">➤</button></div></div>
<script>
const ms=document.getElementById('ms'),sl=t=>new Promise(r=>setTimeout(r,t));let off=false,step=1,eta=47;const LAB=['Packed','Shipped','Out for delivery','Delivered'];
function add(c,h){const d=document.createElement('div');d.className=c;d.innerHTML=h;ms.appendChild(d);while(ms.children.length>6)ms.firstChild.remove();return d}
function card(){return '<div class="t"><div class="bx">📦</div><div><b>Order #NS-48213</b><span>Oak shelf · 2 items</span></div><div class="eta"><b id="eta">—</b><span id="el">ESTIMATED</span></div></div><div class="st" id="st">'+LAB.map((l,i)=>'<div class="sp"><i></i>'+l+'</div>').join('')+'</div><div class="ac"><button>Change address</button><button>Contact courier</button></div>'}
function upd(){const sp=[...document.querySelectorAll('#st .sp')];sp.forEach((s,i)=>{s.classList.toggle('on',i<=step);s.classList.toggle('cu',i===step&&step<3);s.querySelector('i').textContent=i<step||step===3?'✓':''});const st=document.getElementById('st');if(st)st.style.setProperty('--w',(step/3*75)+'%');const e=document.getElementById('eta'),l=document.getElementById('el');if(e){if(step===3){e.textContent='Delivered';l.textContent='JUST NOW'}else{e.textContent=eta+' min';l.textContent=['PREPARING','IN TRANSIT','ARRIVING'][step]}}}
function build(inst){ms.innerHTML='';add('m u','Where is my order?');add('m b','Found it! Here is the latest status for your order:');const c=add('oc',card());if(inst){c.style.animation='none';ms.children[1].style.animation='none';ms.children[0].style.animation='none'}step=1;eta=47;const st=document.getElementById('st');st.style.transition='none';st.querySelectorAll('.sp i').forEach(i=>i.style.transition='none');upd();requestAnimationFrame(()=>requestAnimationFrame(()=>{st.querySelectorAll('.sp i').forEach(i=>i.style.transition='')}));}
build(true);
document.getElementById('ms').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a support bot answers Where is my order? with a live order card; the box bobs, a progress line draws from Packed to Shipped to Out for delivery to Delivered with each step popping green, the ETA minutes count down and its label changes, and the bot posts a short message at each milestone, then the chat resets, until you tap it. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){for(let k=0;k<6&&!off;k++){eta--;upd();await sl(180)}if(off)return;step=2;eta=22;upd();await sl(900);add('m b','🚚 Your parcel is out for delivery. The driver is 6 stops away.');await sl(2200);for(let k=0;k<5&&!off;k++){eta-=3;upd();await sl(180)}if(off)return;step=3;upd();await sl(700);add('m b','✅ Delivered to your front door. Enjoy your new shelf!');await sl(4200);if(off)return;build(false);await sl(1200)}})()}
</script></body></html>
