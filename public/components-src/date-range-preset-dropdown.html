<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Date Range Preset Dropdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3F4F6;color:#0F1115;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{position:relative;width:100%;max-width:620px;border-radius:26px;background:#fff;padding:22px 22px 18px;box-shadow:0 30px 44px -30px rgba(15,17,21,.5),inset 0 0 0 1px rgba(15,17,21,.07);min-height:520px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px}.hd h1{font-size:20px;font-weight:700;letter-spacing:-.035em}
.tr{display:flex;align-items:center;gap:10px;border:0;border-radius:12px;padding:9px 12px 9px 11px;background:#fff;box-shadow:inset 0 0 0 1.500px #DADDE5,0 1px 2px rgba(15,17,21,.05);font:600 13.500px 'Geist';cursor:pointer;color:inherit;transition:box-shadow .2s}
.tr:hover,.tr[aria-expanded=true]{box-shadow:inset 0 0 0 1.500px #4F46E5,0 0 0 4px rgba(79,70,229,.12)}.tr:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.tr svg{width:16px;height:16px}.tr svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tr .c{color:#6B7280;font-weight:500;font-family:'Geist Mono';font-size:12.500px}
.pp{position:absolute;right:22px;top:68px;width:min(430px,calc(100% - 44px));border-radius:20px;background:#fff;display:grid;grid-template-columns:150px 1fr;box-shadow:0 34px 60px -16px rgba(15,17,21,.45),inset 0 0 0 1px rgba(15,17,21,.1);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .22s,transform .35s cubic-bezier(.3,1.5,.5,1);z-index:5;overflow:hidden}
.pp.on{opacity:1;transform:none;pointer-events:auto}
.ps{background:#F7F8FA;padding:10px 8px;border-right:1px solid #EEF0F3;display:grid;gap:2px;align-content:start}
.ps button{border:0;background:none;text-align:left;padding:9px 11px;border-radius:9px;font:500 13.500px 'Geist';color:#4B5160;cursor:pointer;transition:background .15s,color .15s}.ps button:hover{background:#ECEEF3}.ps button[aria-checked=true]{background:#4F46E5;color:#fff;font-weight:600}.ps button:focus-visible{outline:2px solid #4F46E5;outline-offset:-2px}
.cl{padding:14px 14px 12px}.cl .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;font-weight:700}.cl .mh span{font:500 11.500px 'Geist Mono';color:#9AA0AE}
.dw{display:grid;grid-template-columns:repeat(7,1fr);font:600 10.500px 'Geist Mono';color:#9AA0AE;text-align:center;margin-bottom:4px}
.dg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.d{position:relative;height:34px;display:grid;place-items:center;font:500 13px 'Geist';color:#3F4552;font-variant-numeric:tabular-nums}.d span{position:relative;z-index:1}
.d::before{content:"";position:absolute;left:0;right:0;top:3px;bottom:3px;background:#EEF0FF;transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.3,1,.4,1);transition-delay:var(--dl,0s)}
.d.in::before{transform:scaleX(1)}.d.s::before,.d.e::before{background:#4F46E5;border-radius:99px;left:2px;right:2px;transform:scale(1)}.d.s.in::before{border-radius:99px 0 0 99px;left:2px;right:0}.d.e.in::before{border-radius:0 99px 99px 0;left:0;right:2px}.d.s.e::before{border-radius:99px;left:2px;right:2px}
.d.s span,.d.e span{color:#fff;font-weight:700}.d.f{color:#C5C9D3}.d.td span{box-shadow:0 0 0 1.500px #4F46E5;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.d.s.td span,.d.e.td span{box-shadow:none}
.ch{margin-top:26px;display:grid;gap:4px}.ch .lb{display:flex;justify-content:space-between;align-items:baseline}.ch .lb b{font-size:34px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.ch .lb span{font:500 12.500px 'Geist Mono';color:#16A34A}.ch .tt{font-size:13px;color:#6B7280}
.bs{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:10px}.bs i{flex:1;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#6366F1,#C7D2FE);transition:height .55s cubic-bezier(.3,1.2,.4,1);min-height:3px}
@media(max-width:560px){.pp{grid-template-columns:1fr;width:calc(100% - 28px);right:14px}.ps{grid-template-columns:repeat(3,1fr);border-right:0;border-bottom:1px solid #EEF0F3}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w" id="w"><div class="hd"><h1>Revenue</h1><button class="tr" id="tr" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="3.500" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.500 10h17"/></svg><span id="tl">Last 30 days</span><span class="c" id="tc"></span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div>
<div class="ch"><div class="lb"><b id="tv">$0</b><span id="td">+0%</span></div><div class="tt" id="tt"></div><div class="bs" id="bs"></div></div>
<div class="pp" id="pp" role="dialog" aria-label="Choose a date range"><div class="ps" id="ps" role="radiogroup"></div><div class="cl"><div class="mh"><b>November 2026</b><span id="rg"></span></div><div class="dw"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="dg" id="dg"></div></div></div></div>
<script>
const TODAY=14,PR=[['Today',14,14],['Last 7 days',8,14],['Last 14 days',1,14],['Month to date',1,14],['Last 30 days',1,14]];
const ps=document.getElementById('ps'),dg=document.getElementById('dg'),bs=document.getElementById('bs'),pp=document.getElementById('pp'),tr=document.getElementById('tr');let cur=4,open=false,ds=[];
const MN=['Oct','Nov'];
function lab(d){return d<=0?(31+d)+' Oct':d+' Nov'}
PR.forEach(([n],i)=>{const b=document.createElement('button');b.setAttribute('role','radio');b.textContent=n;b.onclick=()=>{off=true;pick(i)};ps.appendChild(b)});
const dow0=6;/* 1 Nov 2026 is a Sunday: index 6 in a Monday-first grid */
for(let k=0;k<dow0;k++){const e=document.createElement('div');e.className='d f';e.innerHTML='<span>'+(31-dow0+k+1)+'</span>';dg.appendChild(e)}
for(let d=1;d<=30;d++){const e=document.createElement('div');e.className='d'+(d===TODAY?' td':'')+(d>TODAY?' f':'');e.innerHTML='<span>'+d+'</span>';e.onclick=()=>{off=true;rangeTo(d)};dg.appendChild(e);ds[d]=e}
let seed=3;const R=()=>(seed=seed*16807%2147483647)/2147483647;
function pick(i,custom){cur=i;const[n,a,b]=custom||PR[i];[...ps.children].forEach((x,k)=>x.setAttribute('aria-checked',k===i));
 for(let d=1;d<=30;d++){const e=ds[d],dl=Math.abs(d-Math.max(a,1))*.012;e.style.setProperty('--dl',dl+'s');e.classList.toggle('s',d===Math.max(a,1));e.classList.toggle('e',d===b);e.classList.toggle('in',d>=Math.max(a,1)&&d<=b)}
 const days=b-a+1;document.getElementById('tl').textContent=n;document.getElementById('tc').textContent=lab(a)+' - '+lab(b);document.getElementById('rg').textContent=days+' days';
 const tot=Math.round(days*1840+(a*37%900));document.getElementById('tv').textContent='$'+tot.toLocaleString('en-US');document.getElementById('td').textContent='+'+(6+days%9)+'.'+(days*3%10)+'%';document.getElementById('tt').textContent='vs the previous '+days+' days';
 const nb=Math.min(40,Math.max(7,days));bs.innerHTML='';let sd=days*7+3;const r2=()=>(sd=sd*16807%2147483647)/2147483647;for(let k=0;k<nb;k++){const i2=document.createElement('i');i2.style.height='4%';bs.appendChild(i2);const h=34+r2()*54+k/nb*12;setTimeout(()=>i2.style.height=h+'%',20+k*12)}}
function rangeTo(d){pick(-1,['Custom',Math.min(d,TODAY),TODAY])}
function setOpen(o){open=o;pp.classList.toggle('on',o);tr.setAttribute('aria-expanded',o)}
tr.onclick=()=>{off=true;setOpen(!open)};addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
pick(4);setOpen(true);
/* Idle demo: presets are chosen in turn; the range band floods across the calendar from its start date, the header shows the new span, and the revenue figure and bar chart redraw for the chosen window, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2800);const o=[1,0,2,3,4];let k=0;while(!off){pick(o[k++%5]);await sleep(2400)}})()}
</script></body></html>
