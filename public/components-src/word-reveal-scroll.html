<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Word Reveal Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F6F2EA;color:#16130E;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:820px}
.k{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8F8672;margin-bottom:26px}
.k .bar{flex:1;max-width:200px;height:3px;border-radius:3px;background:#E3DCCB;margin-left:20px;overflow:hidden}.k .bar i{display:block;height:100%;width:0;background:#C2410C}
.tx{font:400 clamp(30px,5.6vw,58px)/1.12 'Instrument Serif',serif;letter-spacing:-.03em}
.tx .w{display:inline-block;margin-right:.24em;color:rgba(22,19,14,var(--o,.14));transition:color .25s,transform .35s cubic-bezier(.3,1.3,.5,1),filter .3s;filter:blur(var(--b,2px));transform:translateY(var(--y,4px))}
.tx .w.on{--o:1;--b:0px;--y:0px}.tx .w.em{font-style:italic}.tx .w.em.on{color:#C2410C}
.ct{display:flex;align-items:center;gap:16px;margin-top:34px;flex-wrap:wrap}.ct label{font-size:13px;font-weight:600;color:#8F8672;display:flex;align-items:center;gap:12px}.ct input{width:min(320px,60vw);accent-color:#C2410C}
.ct button{margin-left:auto;border:1.5px solid #16130E;background:none;color:#16130E;border-radius:99px;padding:9px 18px;font:600 13px 'Inter';cursor:pointer;transition:all .2s}.ct button:hover{background:#16130E;color:#F6F2EA}.ct button:focus-visible{outline:3px solid #C2410C;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.tx .w{transition:color .1s;filter:none;transform:none}}
</style></head><body>
<div class="c"><div class="k"><span>Our manifesto</span><span class="bar"><i id="br"></i></span></div>
<p class="tx" id="tx" aria-label="We believe the best software feels invisible. It gets out of the way, respects your attention and quietly makes the hard parts easy."></p>
<div class="ct"><label>Progress <input type="range" id="rg" min="0" max="100" value="46" aria-label="Reveal progress"></label><button id="pl">Play</button></div></div>
<script>
const txt='We believe the best software feels invisible. It gets out of the way, respects your attention and quietly makes the hard parts easy.',EM=['invisible.','attention','easy.'];
const tx=document.getElementById('tx');tx.innerHTML=txt.split(' ').map(w=>'<span class="w'+(EM.includes(w)?' em':'')+'" aria-hidden="true">'+w+'</span>').join(' ');
const W=[...tx.children],rg=document.getElementById('rg');let play=false,tm=null;
function set(p){rg.value=p;const n=Math.round(p/100*W.length);W.forEach((w,i)=>w.classList.toggle('on',i<n));document.getElementById('br').style.width=p+'%'}
rg.oninput=()=>{stop();set(+rg.value)};
function stop(){play=false;clearInterval(tm);document.getElementById('pl').textContent='Play'}
document.getElementById('pl').onclick=()=>{if(play){stop();return}play=true;document.getElementById('pl').textContent='Pause';if(+rg.value>=100)set(0);const rd=matchMedia('(prefers-reduced-motion: reduce)').matches;tm=setInterval(()=>{const v=+rg.value+(rd?100:1.2);if(v>=100){set(100);stop()}else set(v)},40)};
set(46);
</script></body></html>
