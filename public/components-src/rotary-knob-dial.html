<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rotary Knob Dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#17181C;background-image:radial-gradient(#202228 1px,transparent 1px);background-size:18px 18px;color:#E8EAF0;font-family:'Chakra Petch',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:640px;background:linear-gradient(160deg,#2A2C33,#1F2026);border:1px solid #373A44;border-radius:30px;padding:26px 26px 22px;box-shadow:0 1px 0 #44474F inset,0 40px 70px -30px #000}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.hd h1{font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.hd span{display:flex;align-items:center;gap:8px;font:400 12px 'Share Tech Mono',monospace;color:#7C8090;letter-spacing:.1em}.hd i{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 10px #4ADE80}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.k{display:flex;flex-direction:column;align-items:center;gap:10px}
.kn{position:relative;width:118px;height:118px;touch-action:none;cursor:grab;outline:0;border-radius:50%}.kn:active{cursor:grabbing}.kn:focus-visible{box-shadow:0 0 0 3px #17181C,0 0 0 5px var(--c)}
.kn svg.sc{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);overflow:visible}.sc .tk{stroke:#3B3E48;stroke-width:2;stroke-linecap:round}.sc .vl{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--c))}.sc .bg{fill:none;stroke:#2F3138;stroke-width:4;stroke-linecap:round}
.kn .bd{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#5A5D69,#2E3037 55%,#1B1C21);box-shadow:0 10px 18px -4px rgba(0,0,0,.7),inset 0 2px 3px rgba(255,255,255,.2),inset 0 -6px 10px rgba(0,0,0,.5);transform:rotate(var(--r))}
.kn .bd::before{content:"";position:absolute;inset:10px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 4deg,transparent 4deg 10deg);mask:radial-gradient(circle,transparent 48%,#000 50%)}
.kn .bd::after{content:"";position:absolute;left:50%;top:9px;width:5px;height:22px;margin-left:-2.500px;border-radius:3px;background:var(--c);box-shadow:0 0 10px var(--c)}
.k label{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9A9EAE}.k output{font:400 22px 'Share Tech Mono',monospace;color:var(--c);letter-spacing:.04em;text-shadow:0 0 12px var(--c)}
.pr{display:flex;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #34373F;flex-wrap:wrap}.pr span{font:400 12px 'Share Tech Mono',monospace;color:#7C8090;letter-spacing:.1em;align-self:center;margin-right:4px}.pr button{border:1px solid #3C3F49;background:#24262C;color:#C9CCD8;border-radius:10px;padding:8px 14px;font:600 13px 'Chakra Petch';cursor:pointer;letter-spacing:.04em}.pr button:hover{border-color:#6A6E80;color:#fff}.pr button:focus-visible{outline:2px solid #fff}
@media(max-width:560px){.g{grid-template-columns:1fr 1fr 1fr;gap:6px}.kn{width:88px;height:88px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Studio EQ</h1><span><i></i>POWER ON</span></div><div class="g" id="g"></div><div class="pr" id="pr"><span>PRESET</span></div></div>
<script>
const K=[['Gain',0,100,64,'%','#4ADE80'],['Tone',0,100,38,'%','#38BDF8'],['Drive',0,100,72,'%','#FB923C'],['Reverb',0,100,25,'%','#C084FC'],['Delay',0,1000,320,'ms','#F472B6'],['Volume',-40,6,-6,'dB','#FACC15']];
const A0=-135,A1=135,g=document.getElementById('g');
function polar(r,a){const t=(a-90)*Math.PI/180;return [50+Math.cos(t)*r,50+Math.sin(t)*r]}
function arc(r,a0,a1){const [x0,y0]=polar(r,a0),[x1,y1]=polar(r,a1);return 'M'+x0+' '+y0+'A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 1 '+x1+' '+y1}
g.innerHTML=K.map((k,i)=>{let t='';for(let n=0;n<=10;n++){const a=A0+(A1-A0)*n/10,[x0,y0]=polar(52,a),[x1,y1]=polar(56,a);t+='<line class="tk" x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y1+'"/>'}return '<div class="k" style="--c:'+k[5]+'"><div class="kn" tabindex="0" role="slider" aria-label="'+k[0]+'" aria-valuemin="'+k[1]+'" aria-valuemax="'+k[2]+'" data-i="'+i+'"><svg class="sc" viewBox="0 0 100 100"><path class="bg" d="'+arc(47,A0,A1)+'"/><path class="vl" id="v'+i+'"/>'+t+'</svg><div class="bd" id="b'+i+'"></div></div><label>'+k[0]+'</label><output id="o'+i+'"></output></div>'}).join('');
const val=K.map(k=>k[3]);
function upd(i){const k=K[i],p=(val[i]-k[1])/(k[2]-k[1]),a=A0+(A1-A0)*p;document.getElementById('b'+i).style.setProperty('--r',a+'deg');document.getElementById('v'+i).setAttribute('d',p>0.001?arc(47,A0,a):'');const v=Math.round(val[i]);document.getElementById('o'+i).textContent=(k[4]==='dB'&&v>0?'+':'')+v+k[4];g.querySelectorAll('.kn')[i].setAttribute('aria-valuenow',v)}
K.forEach((_,i)=>upd(i));
g.querySelectorAll('.kn').forEach(el=>{const i=+el.dataset.i,k=K[i];let dg=false,sy=0,sv=0;el.addEventListener('pointerdown',e=>{dg=true;sy=e.clientY;sv=val[i];el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!dg)return;const d=(sy-e.clientY)/160*(k[2]-k[1]);val[i]=Math.max(k[1],Math.min(k[2],sv+d));upd(i)});el.addEventListener('pointerup',()=>dg=false);
 el.addEventListener('wheel',e=>{e.preventDefault();val[i]=Math.max(k[1],Math.min(k[2],val[i]-Math.sign(e.deltaY)*(k[2]-k[1])/50));upd(i)},{passive:false});el.addEventListener('keydown',e=>{const s=(k[2]-k[1])/(e.shiftKey?10:50);if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();val[i]=Math.min(k[2],val[i]+s);upd(i)}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();val[i]=Math.max(k[1],val[i]-s);upd(i)}});el.addEventListener('dblclick',()=>{val[i]=K[i][3];upd(i)})});
const P={Warm:[55,62,40,30,260,-4],Bright:[70,25,55,45,180,-6],Heavy:[80,48,92,20,420,-3],Clean:[50,50,10,15,0,-8]};const pr=document.getElementById('pr');Object.keys(P).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{P[n].forEach((v,i)=>{val[i]=v;upd(i)})};pr.appendChild(b)});
</script></body></html>
