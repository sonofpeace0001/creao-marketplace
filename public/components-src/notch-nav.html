<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dynamic Notch Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7E9F2;color:#0E1020;font-family:'Inter Tight',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.pg{position:relative;max-width:820px;min-height:100vh;margin:0 auto;padding:90px 24px 24px;background:radial-gradient(500px 300px at 80% 0,#D8DCFF,transparent 70%)}
.nt{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:#0B0C14;color:#fff;border-radius:26px;box-shadow:0 24px 44px -14px rgba(11,12,20,.6),0 0 0 1px rgba(255,255,255,.08) inset;overflow:hidden;transition:width .5s cubic-bezier(.3,1.2,.4,1),height .5s cubic-bezier(.3,1.2,.4,1);z-index:5}
.bar{display:flex;align-items:center;gap:4px;padding:6px;height:52px}
.bar .lg{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#7C6CFF,#E04FD0);display:grid;place-items:center;flex:none;margin-right:4px}
.bar button{position:relative;border:0;background:none;color:#A3A7BD;font:500 14px 'Inter Tight';padding:0 14px;height:40px;border-radius:14px;cursor:pointer;transition:color .2s;white-space:nowrap}.bar button:hover{color:#fff}.bar button[aria-current=true]{color:#fff}.bar button:focus-visible{outline:2px solid #A5B4FC;outline-offset:-2px}
.bar .hl{position:absolute;top:6px;height:40px;border-radius:14px;background:rgba(255,255,255,.12);transition:left .4s cubic-bezier(.3,1.2,.4,1),width .4s cubic-bezier(.3,1.2,.4,1);pointer-events:none}
.bar .go{margin-left:6px;background:#fff;color:#0B0C14;font-weight:700;border-radius:14px}.bar .go:hover{color:#0B0C14;background:#E9EAFF}
.pn{padding:4px 18px 18px;opacity:0;transform:translateY(-8px);transition:opacity .25s .1s,transform .3s .1s;pointer-events:none}.nt.open .pn{opacity:1;transform:none;pointer-events:auto}
.pn .gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pn a{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;color:#fff;text-decoration:none;transition:background .15s}.pn a:hover{background:rgba(255,255,255,.08)}.pn a:focus-visible{outline:2px solid #A5B4FC}
.pn a i{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c)}.pn a b{display:block;font-size:14px;font-weight:600}.pn a span{font-size:12.5px;color:#9498B0;line-height:1.35}
.hero{padding-top:230px}.hero h1{font-size:clamp(34px,6vw,60px);line-height:1;letter-spacing:-.05em;font-weight:700;max-width:12ch}.hero p{margin-top:16px;color:#5B607F;max-width:40ch;font-size:16.5px;line-height:1.55}
</style></head><body>
<div class="pg"><nav class="nt" id="nt" aria-label="Main"><div class="bar" id="bar"><span class="hl" id="hl"></span><div class="lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5"/></svg></div><button data-m="1" aria-haspopup="true" aria-expanded="false">Product</button><button data-m="0">Pricing</button><button data-m="0">Docs</button><button data-m="2" aria-haspopup="true" aria-expanded="false">Company</button><button class="go">Sign up</button></div>
<div class="pn" id="pn"></div></nav>
<div class="hero"><h1>Build with a calmer stack.</h1><p>Hover the navigation: the notch morphs to fit each menu, like a dynamic island for your site.</p></div></div>
<script>
const nt=document.getElementById('nt'),bar=document.getElementById('bar'),hl=document.getElementById('hl'),pn=document.getElementById('pn');
const M={1:[['#6366F1','Workflows','Automate repetitive work'],['#10B981','Analytics','Live dashboards and reports'],['#F59E0B','Integrations','120+ connected apps'],['#EC4899','Security','SSO, audit logs, SCIM']],2:[['#0EA5E9','About us','Our story and values'],['#8B5CF6','Careers','12 open roles'],['#F43F5E','Press','News and media kit'],['#14B8A6','Contact','Talk to our team']]};
const base=[...bar.querySelectorAll('button')];let t=null;
function size(open,key){const w=bar.scrollWidth;nt.style.width=(open?Math.max(w,420):w)+'px';nt.style.height=(open?52+Math.ceil(M[key].length/2)*74+26:52)+'px'}
function mv(b){if(!b){hl.style.opacity=0;return}hl.style.opacity=1;hl.style.left=b.offsetLeft+'px';hl.style.width=b.offsetWidth+'px'}
function open(key,b){clearTimeout(t);pn.innerHTML='<div class="gr">'+M[key].map(x=>'<a href="#"><i style="--c:'+x[0]+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.300" stroke-linecap="round"><circle cx="12" cy="12" r="3"/></svg></i><div><b>'+x[1]+'</b><span>'+x[2]+'</span></div></a>').join('')+'</div>';nt.classList.add('open');size(true,key);base.forEach(x=>x.setAttribute('aria-expanded',x===b?'true':(x.hasAttribute('aria-haspopup')?'false':'')));}
function close(){t=setTimeout(()=>{nt.classList.remove('open');size(false);mv(null);base.forEach(x=>x.hasAttribute('aria-haspopup')&&x.setAttribute('aria-expanded','false'))},120)}
base.forEach(b=>{if(b.classList.contains('go'))return;const k=+b.dataset.m;b.addEventListener('pointerenter',()=>{mv(b);if(k)open(k,b);else{clearTimeout(t);nt.classList.remove('open');size(false)}});b.addEventListener('focus',()=>{mv(b);if(k)open(k,b)});b.addEventListener('click',()=>{if(k)open(k,b)})});
nt.addEventListener('pointerleave',close);nt.addEventListener('pointerenter',()=>clearTimeout(t));document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function init(){size(false)}(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{init();setTimeout(()=>{const b=base[0+1];mv(b);open(1,b)},120)});init();
</script></body></html>
