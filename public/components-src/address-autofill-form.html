<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Address Autofill Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8EEF2;color:#10202B;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px;background:#fff;border-radius:28px;padding:28px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;box-shadow:0 40px 70px -44px rgba(16,32,43,.5),0 0 0 1px rgba(16,32,43,.06)}
.fm h1{font-size:24px;font-weight:700;letter-spacing:-.045em}.fm p.sb{font-size:14px;color:#6A8294;margin:4px 0 18px}
.f{position:relative;margin-bottom:12px}.f label{display:block;font-size:12.5px;font-weight:600;color:#6A8294;margin-bottom:6px}
.f input{width:100%;height:48px;border:2px solid #DDE6EC;border-radius:13px;padding:0 14px;font:500 15.5px 'Inter Tight';color:#10202B;outline:0;background:#fff;transition:all .2s}.f input:focus{border-color:#0E7490;box-shadow:0 0 0 4px rgba(14,116,144,.12)}
.f input.fl{animation:fl .7s}@keyframes fl{0%{background:#CFFAFE;border-color:#06B6D4}100%{background:#fff}}
.sg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #DDE6EC;border-radius:16px;padding:6px;box-shadow:0 24px 40px -14px rgba(16,32,43,.35);z-index:5;display:none}.sg.op{display:block}
.sg button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;padding:10px;border-radius:11px;cursor:pointer;font:inherit;color:inherit;text-align:left}.sg button:hover,.sg button.hi{background:#ECFEFF}.sg button svg{flex:none;color:#0E7490}.sg b{display:block;font-size:14.5px}.sg span{font-size:12.5px;color:#6A8294}.sg mark{background:#CFFAFE;color:#0E7490;border-radius:3px}
.rw{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.go{width:100%;height:52px;border:0;border-radius:15px;background:#0E7490;color:#fff;font:600 16px 'Inter Tight';cursor:pointer;margin-top:6px;box-shadow:0 14px 24px -14px #0E7490}.go:focus-visible{outline:3px solid #10202B;outline-offset:3px}
.mp{position:relative;border-radius:22px;overflow:hidden;background:#DCEAF0;min-height:340px}
.mp svg.bg{position:absolute;inset:0;width:100%;height:100%}
.mp .pn{position:absolute;left:50%;top:46%;width:40px;height:50px;margin:-50px 0 0 -20px;transform:translateY(-120px) scale(.6);opacity:0;transition:all .7s cubic-bezier(.3,1.5,.5,1)}.mp.on .pn{transform:none;opacity:1}
.mp .pn::after{content:"";position:absolute;left:50%;bottom:-8px;width:22px;height:8px;margin-left:-11px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(3px)}
.mp .rp{position:absolute;left:50%;top:46%;width:14px;height:14px;margin:-7px;border-radius:50%;border:2px solid #0E7490;opacity:0}.mp.on .rp{animation:rp 1.8s .6s infinite}@keyframes rp{0%{transform:scale(1);opacity:.8}100%{transform:scale(7);opacity:0}}
.mp .cd{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px;box-shadow:0 14px 24px -12px rgba(16,32,43,.4)}.mp .cd i{width:36px;height:36px;border-radius:10px;background:#0E7490;display:grid;place-items:center;color:#fff;flex:none}.mp .cd b{display:block;font-size:14.5px}.mp .cd span{font:500 12px 'JetBrains Mono',monospace;color:#6A8294}
@media(max-width:760px){.c{grid-template-columns:1fr}.rw{grid-template-columns:1fr 1fr}.rw .f:first-child{grid-column:1/3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><form class="fm" id="fm" onsubmit="return false"><h1>Delivery address</h1><p class="sb">Start typing and we fill in the rest.</p>
<div class="f"><label for="a">Street address</label><input id="a" placeholder="Start typing an address" autocomplete="off" role="combobox" aria-expanded="false"><div class="sg" id="sg" role="listbox"></div></div>
<div class="f"><label for="a2">Apartment, suite, etc. (optional)</label><input id="a2" placeholder="Apt 4B" autocomplete="off"></div>
<div class="rw"><div class="f"><label for="ci">City</label><input id="ci" autocomplete="off"></div><div class="f"><label for="st">State</label><input id="st" autocomplete="off"></div><div class="f"><label for="zp">ZIP</label><input id="zp" autocomplete="off"></div></div>
<button class="go">Save address</button></form>
<div class="mp" id="mp"><svg class="bg" viewBox="0 0 400 340" preserveAspectRatio="xMidYMid slice"><rect width="400" height="340" fill="#DCEAF0"/><path d="M-10 200 C80 160 160 230 260 180 S380 120 420 150" fill="none" stroke="#fff" stroke-width="16"/><path d="M120 -10 L150 130 L120 350" fill="none" stroke="#fff" stroke-width="12"/><path d="M-10 90 L420 70" stroke="#fff" stroke-width="10"/><path d="M240 -10 L270 350" stroke="#fff" stroke-width="9"/><rect x="170" y="210" width="90" height="70" rx="6" fill="#CFE1E8"/><rect x="20" y="110" width="80" height="60" rx="6" fill="#CFE1E8"/><rect x="290" y="200" width="90" height="100" rx="6" fill="#CFE1E8"/><rect x="170" y="20" width="60" height="40" rx="6" fill="#C5DBA8"/><rect x="290" y="20" width="90" height="38" rx="6" fill="#C5DBA8"/></svg><span class="rp"></span><svg class="pn" viewBox="0 0 40 50"><path d="M20 0C9 0 0 9 0 20c0 15 20 30 20 30s20-15 20-30C40 9 31 0 20 0z" fill="#0E7490"/><circle cx="20" cy="19" r="7" fill="#fff"/></svg>
<div class="cd"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></i><div><b id="mb">Enter an address</b><span id="ms">Waiting for input</span></div></div></div></div>
<script>
const A=[['350 Fifth Avenue','New York, NY 10118','New York','NY','10118'],['350 Terry Francois Blvd','San Francisco, CA 94158','San Francisco','CA','94158'],['350 Mission Street','San Francisco, CA 94105','San Francisco','CA','94105'],['3500 Deer Creek Road','Palo Alto, CA 94304','Palo Alto','CA','94304']];
const $=id=>document.getElementById(id),a=$('a'),sg=$('sg');let hi=0,list=[];
const PIN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-7 8-13a8 8 0 1 0-16 0c0 6 8 13 8 13z"/><circle cx="12" cy="9" r="3"/></svg>';
function sug(){const v=a.value.trim().toLowerCase();list=v.length>1?A.filter(x=>x[0].toLowerCase().includes(v)):[];hi=0;if(!list.length){sg.classList.remove('op');a.setAttribute('aria-expanded','false');return}sg.innerHTML=list.map((x,i)=>'<button type="button" role="option" class="'+(i?'':'hi')+'">'+PIN+'<div><b>'+x[0].replace(new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<mark>$1</mark>')+'</b><span>'+x[1]+'</span></div></button>').join('');sg.classList.add('op');a.setAttribute('aria-expanded','true');sg.querySelectorAll('button').forEach((b,i)=>b.onmousedown=e=>{e.preventDefault();pick(i)})}
function typeInto(el,txt,d){el.value='';el.classList.remove('fl');let i=0;(function t(){el.value=txt.slice(0,++i);if(i<txt.length)setTimeout(t,d);else{void el.offsetWidth;el.classList.add('fl')}})()}
function pick(i,instant){const x=list[i]||A[i];sg.classList.remove('op');a.value=x[0];if(instant){$('ci').value=x[2];$('st').value=x[3];$('zp').value=x[4]}else{typeInto($('ci'),x[2],26);setTimeout(()=>typeInto($('st'),x[3],40),250);setTimeout(()=>typeInto($('zp'),x[4],40),430)}$('mp').classList.remove('on');void $('mp').offsetWidth;$('mp').classList.add('on');$('mb').textContent=x[0];$('ms').textContent=x[1]}
a.addEventListener('input',sug);a.addEventListener('keydown',e=>{if(!sg.classList.contains('op'))return;const b=[...sg.querySelectorAll('button')];if(e.key==='ArrowDown'){e.preventDefault();hi=(hi+1)%b.length;b.forEach((x,i)=>x.classList.toggle('hi',i===hi))}if(e.key==='ArrowUp'){e.preventDefault();hi=(hi+b.length-1)%b.length;b.forEach((x,i)=>x.classList.toggle('hi',i===hi))}if(e.key==='Enter'){e.preventDefault();pick(hi)}if(e.key==='Escape')sg.classList.remove('op')});a.addEventListener('blur',()=>sg.classList.remove('op'));
list=A;pick(2,true);
</script></body></html>
