<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Expandable Card Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EFEDE8;color:#16140F;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 0;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{width:100%;max-width:980px;padding:0 24px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:12px}.hd h1{font:400 clamp(32px,5.4vw,52px)/1 'Instrument Serif',serif;letter-spacing:-.03em}.hd h1 em{color:#C2410C}.hd p{font-size:14px;color:#7A7466;font-weight:500}
.vp{position:relative;overflow:hidden;margin:0 -24px;padding:6px 24px 30px;cursor:grab;touch-action:pan-y}.vp.dg{cursor:grabbing}
.tr{display:flex;gap:16px;width:max-content;will-change:transform;transition:transform .6s cubic-bezier(.2,.9,.2,1)}.vp.dg .tr{transition:none}
.cd{position:relative;flex:none;width:230px;height:380px;border-radius:26px;overflow:hidden;border:0;padding:0;text-align:left;color:#fff;background:var(--g);cursor:pointer;transition:width .6s cubic-bezier(.2,.9,.2,1),box-shadow .3s;box-shadow:0 18px 30px -18px rgba(22,20,15,.6)}
.cd.open{width:430px;box-shadow:0 30px 50px -22px rgba(22,20,15,.7)}.cd:focus-visible{outline:3px solid #16140F;outline-offset:3px}
.cd::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 18%,rgba(255,255,255,.5),transparent 50%),linear-gradient(transparent 40%,rgba(0,0,0,.65))}
.cd .k{position:absolute;left:22px;top:20px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.9}.cd .tt{position:absolute;left:22px;right:22px;bottom:22px}.cd h2{font:800 25px/1.05 'Inter Tight';letter-spacing:-.04em}
.cd .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.2,.9,.2,1)}.cd.open .bd{grid-template-rows:1fr}.cd .bd>div{overflow:hidden}.cd .bd p{padding-top:10px;font-size:14.5px;line-height:1.55;opacity:.92;max-width:34ch}.cd .bd span{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-weight:700;font-size:13.5px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);padding:8px 14px;border-radius:99px}
.cd .pl{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .4s}.cd.open .pl{transform:rotate(45deg)}
.ct{display:flex;align-items:center;gap:10px;margin-top:4px}.ct button{width:44px;height:44px;border-radius:50%;border:0;background:#E1DED4;color:#16140F;cursor:pointer;display:grid;place-items:center;transition:all .2s}.ct button:hover:not(:disabled){background:#16140F;color:#EFEDE8}.ct button:disabled{opacity:.4;cursor:default}.ct button:focus-visible{outline:3px solid #C2410C;outline-offset:2px}
@media(max-width:600px){.cd{width:200px;height:340px}.cd.open{width:290px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Places that <em>stay</em> with you</h1><p>Drag, then tap a card</p></div>
<div class="vp" id="vp"><div class="tr" id="tr"></div></div>
<div class="ct"><button id="pv" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button id="nx" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
<script>
const D=[['Lisbon','Portugal','Seven hills, yellow trams and a light that makes everything look like a film still.','linear-gradient(160deg,#FFC785,#E8562A 60%,#4A1A1A)'],['Kyoto','Japan','Temples at dawn, quiet lanes and a thousand shades of moss and maple.','linear-gradient(160deg,#FFB6C9,#D9487A 60%,#3A1030)'],['Oaxaca','Mexico','Markets, mezcal and murals. A city that tastes as good as it looks.','linear-gradient(160deg,#FFE29A,#E8A21B 60%,#5A2A06)'],['Reykjavik','Iceland','Steaming lagoons, black beaches and northern lights if you are lucky.','linear-gradient(160deg,#9CC8FF,#3D6FE0 60%,#101E5A)'],['Marrakesh','Morocco','Rooftop sunsets, spice stalls and courtyards hidden behind plain doors.','linear-gradient(160deg,#FFB48A,#C2410C 60%,#3A1208)'],['Banff','Canada','Turquoise lakes under granite peaks, an hour from anywhere you have been.','linear-gradient(160deg,#9BF0D0,#0E9F8A 60%,#06352E)']];
const vp=document.getElementById('vp'),tr=document.getElementById('tr');
tr.innerHTML=D.map((d,i)=>'<button class="cd'+(i===1?' open':'')+'" style="--g:'+d[3]+'" aria-expanded="'+(i===1)+'"><span class="k">'+d[1]+'</span><span class="pl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.800" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="tt"><h2>'+d[0]+'</h2><div class="bd"><div><p>'+d[2]+'</p><span>Explore guide <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></div></span></button>').join('');
const C=[...tr.children];let x=0,dg=false,sx=0,ox=0,moved=0;
function max(){return Math.max(0,tr.scrollWidth-vp.clientWidth+48)}function set(v,a){x=Math.max(-max(),Math.min(0,v));tr.style.transform='translateX('+x+'px)'}
function ensure(i){setTimeout(()=>{const c=C[i],l=c.offsetLeft,r=l+c.offsetWidth;const vw=vp.clientWidth-24;if(l+x<24)set(-(l-24));else if(r+x>vw)set(-(r-vw))},20);setTimeout(()=>{const c=C[i],r=c.offsetLeft+c.offsetWidth,vw=vp.clientWidth-24;if(r+x>vw)set(-(r-vw))},640)}
C.forEach((c,i)=>c.addEventListener('click',e=>{if(moved>6)return;const o=!c.classList.contains('open');C.forEach(z=>{z.classList.remove('open');z.setAttribute('aria-expanded','false')});if(o){c.classList.add('open');c.setAttribute('aria-expanded','true');ensure(i)}}));
vp.addEventListener('pointerdown',e=>{dg=true;moved=0;sx=e.clientX;ox=x;vp.classList.add('dg')});
addEventListener('pointermove',e=>{if(!dg)return;moved=Math.abs(e.clientX-sx);set(ox+(e.clientX-sx))});addEventListener('pointerup',()=>{dg=false;vp.classList.remove('dg')});
document.getElementById('nx').onclick=()=>set(x-260);document.getElementById('pv').onclick=()=>set(x+260);
setTimeout(()=>set(0),10);
</script></body></html>
