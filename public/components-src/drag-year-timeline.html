<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Drag Year Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EEE3;color:#2B241A;font-family:'Work Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{width:100%;max-width:860px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:12px}.hd h1{font:700 clamp(26px,4.4vw,38px)/1 'Fraunces',serif;letter-spacing:-.03em}.hd span{font-size:13px;color:#8C7F67;font-weight:500;display:flex;align-items:center;gap:6px}
.vp{position:relative;overflow:hidden;cursor:grab;border-radius:22px;background:#FBF8F0;border:1px solid #E5DDCC;padding:30px 0 26px;touch-action:pan-y;user-select:none}.vp.dg{cursor:grabbing}
.vp::before,.vp::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none}.vp::before{left:0;background:linear-gradient(90deg,#FBF8F0,transparent)}.vp::after{right:0;background:linear-gradient(270deg,#FBF8F0,transparent)}
.tr{display:flex;width:max-content;padding:0 40vw 0 60px;will-change:transform}
.ye{position:relative;flex:none;width:250px;padding-right:24px}
.ye .rl{position:absolute;left:0;right:0;top:78px;height:2px;background:#DDD3BD}.ye:last-child .rl{right:50%}
.ye .dt{position:absolute;left:0;top:70px;width:18px;height:18px;border-radius:50%;background:#FBF8F0;border:3px solid #C2410C;transition:all .3s}.ye.on .dt{background:#C2410C;box-shadow:0 0 0 7px rgba(194,65,12,.16)}
.ye b{display:block;font:700 56px/1 'Fraunces',serif;letter-spacing:-.05em;color:#D8CDB3;transition:color .3s;margin-bottom:34px}.ye.on b{color:#2B241A}
.ye h2{font:700 19px 'Fraunces',serif;letter-spacing:-.02em;margin:34px 0 6px}.ye p{font-size:14px;line-height:1.55;color:#7C6F57;max-width:24ch}
.ct{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.pb{flex:1;max-width:220px;height:4px;border-radius:4px;background:#E2D9C4;overflow:hidden}.pb i{display:block;height:100%;width:30%;background:#C2410C;border-radius:4px}
.ct div{display:flex;gap:8px}.ct button{width:42px;height:42px;border-radius:50%;border:1.5px solid #2B241A;background:none;color:#2B241A;cursor:pointer;display:grid;place-items:center;transition:all .2s}.ct button:hover{background:#2B241A;color:#F3EEE3}.ct button:focus-visible{outline:3px solid #C2410C;outline-offset:3px}
</style></head><body>
<div class="c"><div class="hd"><h1>A decade of making</h1><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.500V6a2 2 0 0 0-4 0v8M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.800 0-4.500-.9-5.700-2.400L3.400 16a2 2 0 0 1 3.200-2.400L8 15"/></svg>Drag to explore</span></div>
<div class="vp" id="vp"><div class="tr" id="tr"></div></div>
<div class="ct"><div class="pb"><i id="pb"></i></div><div><button id="pv" aria-label="Previous year"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button id="nx" aria-label="Next year"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div></div>
<script>
const Y=[['2016','Kitchen table','Four friends, one laptop and a very loud coffee machine.'],['2018','First studio','We moved into a real office with a door that actually locked.'],['2020','Going remote','The team spread across nine time zones and got better at writing.'],['2022','Product-led','Open signups, a public roadmap and thousands of new makers.'],['2024','Global launch','Localised into 14 languages with partners on four continents.'],['2026','What is next','Ten years in, we are only getting started.']];
const tr=document.getElementById('tr'),vp=document.getElementById('vp');
tr.innerHTML=Y.map(y=>'<div class="ye"><div class="rl"></div><div class="dt"></div><b>'+y[0]+'</b><h2>'+y[1]+'</h2><p>'+y[2]+'</p></div>').join('');
const E=[...tr.children];let x=0,cur=1,dg=false,sx=0,sx0=0;
function max(){return Math.max(0,tr.scrollWidth-vp.clientWidth)}
function set(v,anim){x=Math.max(-max(),Math.min(0,v));tr.style.transition=anim?'transform .6s cubic-bezier(.2,.9,.2,1)':'none';tr.style.transform='translateX('+x+'px)';
 const c=vp.clientWidth*.3;let best=0,bd=1e9;E.forEach((e,i)=>{const d=Math.abs(e.offsetLeft+x+60-c);if(d<bd){bd=d;best=i}});cur=best;E.forEach((e,i)=>e.classList.toggle('on',i===cur));document.getElementById('pb').style.width=(100*(cur+1)/E.length)+'%'}
function goto(i){i=Math.max(0,Math.min(E.length-1,i));set(-(E[i].offsetLeft-vp.clientWidth*.3+60),true)}
vp.addEventListener('pointerdown',e=>{dg=true;vp.classList.add('dg');sx=e.clientX;sx0=x;vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(dg)set(sx0+(e.clientX-sx),false)});
function up(){if(!dg)return;dg=false;vp.classList.remove('dg');goto(cur)}vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){set(x-e.deltaX,false)}},{passive:true});
document.getElementById('nx').onclick=()=>goto(cur+1);document.getElementById('pv').onclick=()=>goto(cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')goto(cur+1);if(e.key==='ArrowLeft')goto(cur-1)});
addEventListener('resize',()=>goto(cur));goto(1);
</script></body></html>
