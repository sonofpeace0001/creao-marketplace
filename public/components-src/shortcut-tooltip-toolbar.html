<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shortcut Tooltip Toolbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E1014;color:#ECEEF4;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;text-align:center}
.c h1{font-size:clamp(24px,5vw,32px);font-weight:600;letter-spacing:-.04em}.c p{color:#868B9E;font-size:15px;margin:6px 0 70px}
.tb{position:relative;display:inline-flex;gap:4px;padding:6px;border-radius:18px;background:#171A21;border:1px solid #262A35;box-shadow:0 30px 50px -24px #000}
.tb button{position:relative;display:grid;place-items:center;width:46px;height:46px;border:0;background:none;border-radius:13px;color:#A4A9BD;cursor:pointer;transition:background .15s,color .15s,transform .12s}.tb button:hover,.tb button:focus-visible{background:#232734;color:#fff}.tb button:focus-visible{outline:2px solid #8B9CFF;outline-offset:1px}.tb button.fl{background:#4F5BE8;color:#fff;transform:scale(.92)}
.sp{width:1px;background:#2A2E3B;margin:8px 4px}
.tt{position:absolute;left:0;bottom:calc(100% + 12px);height:36px;border-radius:11px;background:#F4F5FA;color:#14161C;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;font:500 13.5px 'Geist';white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(6px);transition:left .28s cubic-bezier(.3,1.3,.5,1),width .28s cubic-bezier(.3,1.3,.5,1),opacity .15s,transform .2s;overflow:hidden;box-shadow:0 14px 22px -10px rgba(0,0,0,.6)}
.tt.on{opacity:1;transform:none}
.tt::after{content:"";position:absolute}
.ar{position:absolute;left:0;bottom:calc(100% + 7px);width:10px;height:10px;background:#F4F5FA;transform:rotate(45deg);border-radius:2px;opacity:0;transition:left .28s cubic-bezier(.3,1.3,.5,1),opacity .15s;pointer-events:none}.ar.on{opacity:1}
.tt .k{display:inline-flex;gap:3px}.tt kbd{font:500 11.5px 'Geist Mono',monospace;background:#E3E5EF;border-radius:6px;padding:2px 6px;color:#454A60}
.tt .lb{display:flex;align-items:center;gap:10px}
.lg{margin-top:70px;font:500 13px 'Geist Mono',monospace;color:#6A6F84;letter-spacing:.04em}.lg b{color:#B8BDD2;font-weight:500}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><h1>Shortcuts, shown</h1><p>One tooltip glides between tools. Press the keys to trigger them.</p>
<div class="tb" id="tb"><div class="tt" id="tt"></div><span class="ar" id="ar"></span></div>
<div class="lg">Last action: <b id="lg">none</b></div></div>
<script>
const I=(d)=>'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';
const T=[['Bold','B','M7 5h6a3.500 3.500 0 0 1 0 7H7zM7 12h7a3.500 3.500 0 0 1 0 7H7z'],['Italic','I','M19 4h-9M14 20H5M15 4 9 20'],['Underline','U','M6 4v7a6 6 0 0 0 12 0V4M4 21h16'],0,['Link','K','M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700L11.500 6.800M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1.500-1.500'],['Comment','M','M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],['Code','E','M16 18l6-6-6-6M8 6l-6 6 6 6'],['Share','S','M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13']];
const tb=document.getElementById('tb'),tt=document.getElementById('tt'),ar=document.getElementById('ar'),btns=[];
T.forEach(t=>{if(!t){const s=document.createElement('span');s.className='sp';tb.appendChild(s);return}const b=document.createElement('button');b.innerHTML=I(t[2]);b.setAttribute('aria-label',t[0]+' ('+t[1]+')');b.dataset.k=t[1];b.dataset.n=t[0];tb.appendChild(b);btns.push([b,t]);
 const sh=()=>{tt.innerHTML='<span class="lb">'+t[0]+'<span class="k"><kbd>Ctrl</kbd><kbd>'+t[1]+'</kbd></span></span>';const w=tt.firstChild.getBoundingClientRect().width+22;const l=b.offsetLeft+b.offsetWidth/2-w/2;tt.style.width=w+'px';tt.style.left=Math.max(0,l)+'px';ar.style.left=(b.offsetLeft+b.offsetWidth/2-5)+'px';tt.classList.add('on');ar.classList.add('on')};
 b.addEventListener('mouseenter',sh);b.addEventListener('focus',sh);b.onclick=()=>fire(b)});
tb.addEventListener('mouseleave',()=>{tt.classList.remove('on');ar.classList.remove('on')});tb.addEventListener('focusout',e=>{if(!tb.contains(e.relatedTarget)){tt.classList.remove('on');ar.classList.remove('on')}});
function fire(b){b.classList.add('fl');setTimeout(()=>b.classList.remove('fl'),160);document.getElementById('lg').textContent=b.dataset.n}
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toUpperCase(),m=btns.find(x=>x[1][1]===k);if(m){e.preventDefault();fire(m[0])}});
function demo(){const b=btns[4][0];b.dispatchEvent(new Event('mouseenter'))}
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{tt.style.transition='none';ar.style.transition='none';demo();requestAnimationFrame(()=>{tt.style.transition='';ar.style.transition=''})});
</script></body></html>
