<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dotted World Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070A12;color:#E6EBFA;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px;background:radial-gradient(600px 300px at 50% 0,#12204A,transparent 70%),#0A0F1C;border:1px solid #17213D;border-radius:26px;padding:26px 26px 20px;box-shadow:0 50px 80px -40px #000}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}.hd h1{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.04em}.hd p{font-size:14px;color:#7F8DB4;margin-top:4px}
.st{display:flex;gap:22px}.st div b{display:block;font:500 22px 'Geist Mono',monospace;letter-spacing:-.04em}.st div span{font-size:12px;color:#7F8DB4}
.mp{position:relative;aspect-ratio:2/1;margin:6px -6px 4px}.mp canvas{position:absolute;inset:0;width:100%;height:100%}
.tt{position:absolute;pointer-events:none;background:#fff;color:#0A0F1C;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;transform:translate(-50%,-135%);opacity:0;transition:opacity .15s;box-shadow:0 10px 20px rgba(0,0,0,.4)}.tt small{display:block;font:500 11px 'Geist Mono',monospace;color:#5B6788}
.lg{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#7F8DB4;border-top:1px solid #151E38;padding-top:14px}.lg span{display:flex;align-items:center;gap:7px}.lg i{width:8px;height:8px;border-radius:50%}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Global edge network</h1><p>Traffic is served from the closest of 24 regions.</p></div><div class="st"><div><b id="n1">0</b><span>Regions</span></div><div><b id="n2">0</b><span>ms median</span></div></div></div>
<div class="mp" id="mp"><canvas id="cv" role="img" aria-label="Dotted world map with animated connections between cities"></canvas><div class="tt" id="tt"></div></div>
<div class="lg"><span><i style="background:#4DE3FF"></i>Primary region</span><span><i style="background:#8B7CFF"></i>Edge region</span><span><i style="background:#3A4A7A"></i>Land</span></div></div>
<script>
// coarse continent polygons [lon,lat]
const LAND=[[[-168,66],[-140,70],[-100,72],[-80,70],[-60,60],[-55,48],[-70,42],[-76,35],[-81,25],[-90,29],[-97,26],[-105,22],[-110,24],[-117,32],[-124,40],[-125,49],[-140,59],[-160,58]],[[-81,10],[-77,7],[-70,12],[-60,8],[-50,0],[-35,-6],[-40,-22],[-48,-28],[-58,-38],[-65,-45],[-70,-54],[-74,-45],[-72,-30],[-71,-18],[-80,-5]],[[-10,36],[-9,43],[-2,48],[5,53],[8,57],[12,56],[20,60],[28,70],[40,68],[60,70],[80,73],[110,76],[140,72],[170,68],[160,58],[142,46],[130,35],[122,30],[120,22],[108,18],[100,8],[104,1],[96,16],[88,22],[80,14],[75,8],[70,22],[58,25],[50,30],[44,12],[36,28],[30,32],[26,38],[20,40],[12,38],[2,38]],[[-17,15],[-16,25],[-8,35],[10,37],[25,32],[34,28],[43,12],[51,12],[40,-5],[40,-16],[35,-26],[20,-35],[12,-18],[9,-1],[8,4],[-8,5]],[[114,-22],[122,-18],[132,-12],[142,-11],[153,-27],[149,-38],[138,-35],[130,-32],[115,-34]],[[-24,64],[-14,66],[-14,63],[-22,63]],[[-10,50],[-5,58],[2,56],[2,51]],[[130,31],[142,43],[145,44],[140,36]]];
const CITIES=[['San Francisco',-122,37.7,1],['New York',-74,40.7,0],['São Paulo',-46.6,-23.5,0],['London',-0.1,51.5,1],['Frankfurt',8.6,50.1,0],['Lagos',3.4,6.5,0],['Dubai',55.3,25.2,0],['Mumbai',72.8,19.1,0],['Singapore',103.8,1.3,1],['Tokyo',139.7,35.7,0],['Sydney',151.2,-33.9,0]];
const ROUTES=[[0,1],[1,3],[3,4],[4,6],[6,7],[7,8],[8,9],[9,10],[0,9],[1,2],[3,5],[2,5],[8,10]];
const cv=document.getElementById('cv'),x=cv.getContext('2d'),mp=document.getElementById('mp'),tt=document.getElementById('tt');let W,H,dpr,dots=[],pts=[],hover=-1,t0=performance.now();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function inside(poly,lo,la){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>la)!==(b[1]>la)&&lo<(b[0]-a[0])*(la-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function proj(lo,la){return [(lo+180)/360*W,(90-la)/180*H*1.0]}
function build(){dpr=Math.min(2,devicePixelRatio||1);W=mp.clientWidth;H=mp.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);dots=[];const step=Math.max(7,W/95);for(let px=step/2;px<W;px+=step)for(let py=step/2;py<H;py+=step){const lo=px/W*360-180,la=90-py/H*180;if(la<-58||la>78)continue;if(LAND.some(p=>inside(p,lo,la)))dots.push([px,py])}pts=CITIES.map(c=>proj(c[1],c[2]))}
function arc(a,b,p){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-Math.hypot(b[0]-a[0],b[1]-a[1])*.28;const u=1-p;return [u*u*a[0]+2*u*p*mx+p*p*b[0],u*u*a[1]+2*u*p*my+p*p*b[1],mx,my]}
function draw(now){const t=(now-t0)/1000;x.clearRect(0,0,W,H);x.fillStyle='#3A4A7A';dots.forEach(d=>{x.beginPath();x.arc(d[0],d[1],Math.max(1.6,W/480),0,6.283);x.fill()});
 ROUTES.forEach((r,i)=>{const a=pts[r[0]],b=pts[r[1]],m=arc(a,b,.5);x.strokeStyle='rgba(139,124,255,.35)';x.lineWidth=1.2;x.beginPath();x.moveTo(a[0],a[1]);x.quadraticCurveTo(m[2]*1,m[3]*1+0,b[0],b[1]);x.stroke();
  const p=reduced?.6:((t*.35+i*.19)%1.4);if(p<1){const q=arc(a,b,p);const g=x.createRadialGradient(q[0],q[1],0,q[0],q[1],8);g.addColorStop(0,'#4DE3FF');g.addColorStop(1,'rgba(77,227,255,0)');x.fillStyle=g;x.beginPath();x.arc(q[0],q[1],8,0,6.283);x.fill()}});
 pts.forEach((p,i)=>{const pr=CITIES[i][3],c=pr?'#4DE3FF':'#8B7CFF';const k=reduced?.5:((t*.8+i*.3)%1);x.strokeStyle=c;x.globalAlpha=1-k;x.lineWidth=1.5;x.beginPath();x.arc(p[0],p[1],4+k*14,0,6.283);x.stroke();x.globalAlpha=1;x.fillStyle=c;x.beginPath();x.arc(p[0],p[1],i===hover?6:4,0,6.283);x.fill()});
 if(!reduced)requestAnimationFrame(draw)}
mp.addEventListener('pointermove',e=>{const r=mp.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;hover=pts.findIndex(p=>Math.hypot(p[0]-px,p[1]-py)<14);if(hover>-1){tt.style.opacity=1;tt.style.left=pts[hover][0]+'px';tt.style.top=pts[hover][1]+'px';tt.innerHTML=CITIES[hover][0]+'<small>'+(CITIES[hover][3]?'PRIMARY · 9 ms':'EDGE · '+(14+hover*3)+' ms')+'</small>'}else tt.style.opacity=0;if(reduced)draw(performance.now())});
mp.addEventListener('pointerleave',()=>{hover=-1;tt.style.opacity=0});
function cnt(id,to,ms){const e=document.getElementById(id);const s=performance.now();const f=n=>{const p=Math.min(1,(n-s)/ms);e.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};reduced?e.textContent=to:requestAnimationFrame(f)}
build();requestAnimationFrame(draw);cnt('n1',24,1200);cnt('n2',38,1200);addEventListener('resize',()=>{build();if(reduced)draw(performance.now())});
</script></body></html>
