<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Paper Plane Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#DFF1FF,#F0E4FF);color:#16152E;font-family:'Hanken Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{position:relative;width:100%;max-width:620px;background:#fff;border-radius:32px;padding:34px;box-shadow:0 40px 70px -40px rgba(70,60,170,.5),0 0 0 1px rgba(22,21,46,.06)}
.c h1{font:800 32px/1.05 'Bricolage Grotesque';letter-spacing:-.05em}.c p.sb{font-size:15.5px;color:#6D6C93;margin:6px 0 20px}
.lb{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8E8DB2;margin-bottom:8px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.ch button{border:1.5px solid #E5E5F5;background:#fff;border-radius:99px;padding:9px 16px;font:600 14px 'Hanken Grotesk';color:#4A4970;cursor:pointer;transition:all .25s cubic-bezier(.3,1.4,.5,1)}.ch button:hover{border-color:#6D5BFF}.ch button[aria-pressed=true]{background:#6D5BFF;border-color:#6D5BFF;color:#fff;transform:translateY(-2px);box-shadow:0 10px 16px -10px #6D5BFF}.ch button:focus-visible{outline:3px solid #16152E;outline-offset:2px}
.f{position:relative;margin-bottom:12px}.f input,.f textarea{width:100%;border:2px solid #E5E5F5;border-radius:16px;padding:22px 16px 8px;font:500 16px 'Hanken Grotesk';color:#16152E;background:#fff;outline:0;transition:all .2s;resize:none}.f input{height:58px}.f label{position:absolute;left:18px;top:17px;font-size:15.5px;color:#9A99BC;pointer-events:none;transition:all .2s cubic-bezier(.3,1.2,.5,1)}.f input:focus,.f textarea:focus{border-color:#6D5BFF;box-shadow:0 0 0 5px rgba(109,91,255,.12)}.f input:focus+label,.f input:not(:placeholder-shown)+label,.f textarea:focus+label,.f textarea:not(:placeholder-shown)+label{top:8px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#6D5BFF}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ft{display:flex;align-items:center;gap:12px;margin-top:6px}.at{display:flex;align-items:center;gap:8px;border:1.5px dashed #D3D2EC;background:#FAFAFF;color:#6D6C93;border-radius:14px;padding:12px 16px;font:600 14px 'Hanken Grotesk';cursor:pointer}.at:hover{border-color:#6D5BFF;color:#6D5BFF}.at:focus-visible{outline:3px solid #16152E;outline-offset:2px}
.sd{position:relative;margin-left:auto;display:flex;align-items:center;gap:10px;height:56px;border:0;border-radius:16px;padding:0 26px 0 22px;background:linear-gradient(135deg,#6D5BFF,#9B5CFF);color:#fff;font:700 16px 'Hanken Grotesk';cursor:pointer;box-shadow:0 16px 26px -14px #6D5BFF;overflow:visible;transition:transform .15s}.sd:hover{transform:translateY(-2px)}.sd:focus-visible{outline:3px solid #16152E;outline-offset:3px}.sd.fl{pointer-events:none}
.sd .pl{width:24px;height:24px;transition:transform .9s cubic-bezier(.5,0,.8,.4),opacity .5s .5s}.sd.fl .pl{transform:translate(260px,-180px) rotate(28deg) scale(.4);opacity:0}.sd.fl span.t{opacity:0}.sd span.t{transition:opacity .2s}
.sd .ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity .3s 1s;background:#16A34A;border-radius:16px}.sd.dn{background:#16A34A}.sd.dn .ok{opacity:1}
.tr{position:absolute;right:30px;bottom:58px;width:0;height:2px;background:repeating-linear-gradient(90deg,#9B8CFF 0 6px,transparent 6px 12px);transform-origin:right;transform:rotate(-35deg);opacity:0;pointer-events:none}.tr.on{animation:tr 1.1s ease-out forwards}@keyframes tr{0%{width:0;opacity:.9}60%{width:260px;opacity:.7}100%{width:260px;opacity:0}}
.cl{position:absolute;pointer-events:none;width:46px;height:16px;border-radius:99px;background:rgba(255,255,255,.9);opacity:.7}.cl::before{content:"";position:absolute;left:8px;top:-9px;width:20px;height:20px;border-radius:50%;background:inherit}.cl1{right:-30px;top:40px;animation:dr 9s linear infinite}.cl2{left:-34px;bottom:110px;animation:dr 12s linear infinite reverse}@keyframes dr{50%{transform:translateX(16px)}}
@media(max-width:560px){.rw{grid-template-columns:1fr}.ft{flex-wrap:wrap}.sd{margin-left:0;width:100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><span class="cl cl1"></span><span class="cl cl2"></span><h1>Send us a note</h1><p class="sb">Pick a topic and tell us what you need. We read every message.</p>
<div class="lb">Topic</div><div class="ch" id="ch" role="group" aria-label="Topic"></div>
<div class="rw"><div class="f"><input id="n" placeholder=" " autocomplete="off"><label for="n">Your name</label></div><div class="f"><input id="e" type="email" placeholder=" " autocomplete="off"><label for="e">Email address</label></div></div>
<div class="f"><textarea id="m" rows="4" placeholder=" "></textarea><label for="m">How can we help?</label></div>
<div class="ft"><button class="at" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-9 9a5 5 0 0 1-7-7l9-9a3.500 3.500 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>Attach file</button>
<button class="sd" id="sd" type="button"><span class="tr" id="tr"></span><svg class="pl" viewBox="0 0 24 24" fill="#fff"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z" fill="none" stroke="#fff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t">Send message</span><span class="ok"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>Sent. Talk soon.</span></button></div></div>
<script>
const T=['Project enquiry','Partnership','Support','Press','Something else'];const ch=document.getElementById('ch');T.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{ch.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};ch.appendChild(b)});
const sd=document.getElementById('sd');sd.onclick=()=>{if(sd.classList.contains('fl')||sd.classList.contains('dn'))return;sd.classList.add('fl');const tr=document.getElementById('tr');tr.classList.add('on');setTimeout(()=>{sd.classList.add('dn')},800);setTimeout(()=>{sd.classList.remove('fl','dn');tr.classList.remove('on')},3200)};
document.getElementById('n').value='Ada Lovelace';document.getElementById('e').value='ada@studio.com';document.getElementById('m').value='We are looking for a partner to redesign our product and brand this spring.';
</script></body></html>
