<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plan Tier Badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EEF0F6;color:#12142A;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:720px;display:grid;gap:22px}
.hd h1{font-size:28px;font-weight:800;letter-spacing:-.05em}.hd p{color:#6A6F90;font-size:14px;margin-top:6px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.c{position:relative;border-radius:24px;background:#fff;padding:20px 14px 18px;display:grid;justify-items:center;gap:14px;text-align:center;box-shadow:0 20px 26px -22px rgba(18,20,42,.5),inset 0 0 0 1px rgba(18,20,42,.07);transition:transform .35s cubic-bezier(.3,1.4,.4,1)}
.c:hover{transform:translateY(-5px) rotate(-1deg)}
.bd{position:relative;width:92px;height:92px;display:grid;place-items:center}
.bd svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bd .gl{position:relative;width:34px;height:34px}.bd .gl svg *{fill:none;stroke:var(--k);stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}.bd .gl svg{position:static;width:100%;height:100%}
.sh{animation:sw 4s ease-in-out infinite;animation-delay:var(--d,0s)}@keyframes sw{0%,55%{transform:translateX(-130%) skewX(-20deg)}100%{transform:translateX(130%) skewX(-20deg)}}
.c b{font-size:17px;font-weight:800;letter-spacing:-.03em}.c small{font:500 12px 'Geist Mono';color:#6A6F90;margin-top:-8px}.c .pr{font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:#F1F2F8}
.en .bd::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from var(--a),transparent 0 55%,#F5C542 80%,#fff 92%,transparent);animation:ro 3s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
@keyframes ro{to{--a:360deg}}
.sk{position:absolute;width:12px;height:12px;opacity:0;animation:tw 2.400s ease-in-out infinite;animation-delay:var(--d)}.sk::before,.sk::after{content:"";position:absolute;left:50%;top:50%;background:#FFE27A;border-radius:2px}.sk::before{width:12px;height:2px;margin:-1px -6px}.sk::after{width:2px;height:12px;margin:-6px -1px}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@media(max-width:620px){.g{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Plans you can recognise by touch</h1><p>Metal, finish and motion rise with every tier.</p></div>
<div class="g" id="g"></div></div>
<script>
const T=[['Free','Starter','$0','#8E93AD','#D7DAE8','#B3B8D0','#fff','M12 4l2.400 5 5.600.8-4 4 1 5.600-5-2.700L7 20.400l1-5.600-4-4L9.600 9Z'],['Pro','Individuals','$12','#6366F1','#A5B4FC','#4338CA','#fff','M13 3 5 14h6l-1 7 8-11h-6Z'],['Team','Up to 25 seats','$29','#0EA5A4','#7DE3DD','#0B6F6E','#fff','M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM3 20c0-3 2.500-5 5-5s5 2 5 5M13 20c0-3 2.500-5 5-5s3 2 3 5'],['Enterprise','Custom','Talk','#18181B','#52525B','#F5C542','#F5C542','M3 8l4 4 5-7 5 7 4-4-2 11H5Z']];
const g=document.getElementById('g');
function hex(c1,c2,c3,id){return '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c2+'"/><stop offset=".55" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c3+'"/></linearGradient></defs>'}
T.forEach(([n,sub,pr,c1,c2,c3,k,p],i)=>{const id='h'+i;const a=document.createElement('article');a.className='c'+(i===3?' en':'');
 a.innerHTML='<div class="bd"><svg viewBox="0 0 92 92" aria-hidden="true">'+hex(c1,c2,c3,id)+'<path d="M46 4 83 25v42L46 88 9 67V25Z" fill="url(#'+id+')" stroke="rgba(255,255,255,.55)" stroke-width="2"/><path d="M46 12 76 29v34L46 80 16 63V29Z" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.200"/><clipPath id="c'+id+'"><path d="M46 4 83 25v42L46 88 9 67V25Z"/></clipPath><g clip-path="url(#c'+id+')"><rect class="sh" style="--d:'+(i*.7)+'s" x="0" y="0" width="22" height="92" fill="rgba(255,255,255,.5)"/></g></svg><span class="gl" style="--k:'+k+'"><svg viewBox="0 0 24 24"><path d="'+p+'"/></svg></span>'+(i===3?'<i class="sk" style="right:-4px;top:4px;--d:0s"></i><i class="sk" style="left:-6px;top:38px;--d:.9s"></i><i class="sk" style="right:6px;bottom:-4px;--d:1.700s"></i>':'')+'</div><b>'+n+'</b><small>'+sub+'</small><span class="pr">'+pr+(i&&i<3?'/mo':'')+'</span>';g.appendChild(a)});
</script></body></html>
