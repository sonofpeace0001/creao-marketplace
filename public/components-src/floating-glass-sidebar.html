<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Floating Glass Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0716;color:#F1EDFF;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:780px;height:470px;border-radius:30px;overflow:hidden;background:radial-gradient(400px 300px at 20% 20%,#6D3BF0,transparent 60%),radial-gradient(420px 320px at 90% 90%,#E0388A,transparent 60%),radial-gradient(300px 260px at 70% 10%,#1BB7D6,transparent 60%),#150F2E;box-shadow:0 40px 80px -40px #000}
.sd{position:absolute;left:16px;top:16px;bottom:16px;width:72px;border-radius:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;transition:width .5s cubic-bezier(.3,1.2,.4,1);overflow:hidden;z-index:3;box-shadow:0 20px 40px -16px rgba(0,0,0,.5)}
.st.ex .sd{width:220px;align-items:stretch;padding:14px 10px}
.lg{display:flex;align-items:center;gap:10px;padding:0 6px;margin-bottom:10px;height:44px}.lg i{flex:none;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#fff,#D8C8FF);display:grid;place-items:center;color:#4C2A9E}.lg b{font-size:17px;font-weight:800;letter-spacing:-.04em;opacity:0;white-space:nowrap;transition:opacity .25s}.st.ex .lg b{opacity:1;transition-delay:.15s}
.it{position:relative;display:flex;align-items:center;gap:12px;height:46px;border:0;background:none;color:rgba(255,255,255,.75);border-radius:16px;cursor:pointer;padding:0 14px;font:600 14.5px 'Sora';white-space:nowrap;flex:none;transition:background .2s,color .2s}.it:hover{background:rgba(255,255,255,.14);color:#fff}.it.on{background:#fff;color:#2A1560;box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}.it:focus-visible{outline:2px solid #fff;outline-offset:2px}
.it svg{flex:none}.it span{opacity:0;transition:opacity .2s}.st.ex .it span{opacity:1;transition-delay:.12s}
.it .dt{position:absolute;right:12px;top:12px;width:9px;height:9px;border-radius:50%;background:#FF5A8A;border:2px solid #3A2370}.st.ex .it .dt{right:16px;top:18px}
.it::after{content:attr(data-l);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%) translateX(-6px);background:#fff;color:#2A1560;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9px;opacity:0;pointer-events:none;transition:all .15s;z-index:9}.st:not(.ex) .it:hover::after,.st:not(.ex) .it:focus-visible::after{opacity:1;transform:translateY(-50%)}
.sp{flex:1}.tg{display:flex;align-items:center;justify-content:center;gap:10px;height:42px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:14px;cursor:pointer;font:600 13px 'Sora';margin:0 4px}.tg:hover{background:rgba(255,255,255,.18)}.tg:focus-visible{outline:2px solid #fff}.tg svg{transition:transform .4s}.st.ex .tg svg{transform:rotate(180deg)}.tg span{display:none}.st.ex .tg span{display:inline}
.mn{position:absolute;left:104px;right:16px;top:16px;bottom:16px;transition:left .5s cubic-bezier(.3,1.2,.4,1);padding:14px 10px}.st.ex .mn{left:236px}
.mn small{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7}.mn h1{font-size:34px;font-weight:800;letter-spacing:-.05em;margin:4px 0 16px}.mn .cd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mn .cd div{height:96px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px)}.mn .bg{height:150px;margin-top:10px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="st ex" id="st"><nav class="sd" aria-label="Main"><div class="lg"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5"/></svg></i><b>Prism</b></div><div id="its" style="display:contents"></div><span class="sp"></span><button class="tg" id="tg" aria-expanded="true" aria-label="Collapse sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg><span>Collapse</span></button></nav>
<main class="mn"><small id="cr">Overview</small><h1 id="ti">Good evening</h1><div class="cd"><div></div><div></div><div></div></div><div class="bg"></div></main></div>
<script>
const N=[['Overview','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',0],['Messages','M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',1],['Calendar','M4 6h16v14H4zM8 3v4M16 3v4M4 11h16',0],['Analytics','M3 3v18h18M7 14l4-4 4 4 5-6',0],['Settings','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.100a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.100a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z',0]];
let sel='Overview';const its=document.getElementById('its'),st=document.getElementById('st');
function draw(){its.innerHTML=N.map(n=>'<button class="it'+(sel===n[0]?' on':'')+'" data-n="'+n[0]+'" data-l="'+n[0]+'" aria-label="'+n[0]+'" '+(sel===n[0]?'aria-current="page"':'')+'><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+n[1]+'"/></svg><span>'+n[0]+'</span>'+(n[2]?'<i class="dt"></i>':'')+'</button>').join('');its.querySelectorAll('.it').forEach(b=>b.onclick=()=>{sel=b.dataset.n;document.getElementById('cr').textContent=sel;document.getElementById('ti').textContent=sel==='Overview'?'Good evening':sel;draw()})}
draw();document.getElementById('tg').onclick=()=>{const e=st.classList.toggle('ex');document.getElementById('tg').setAttribute('aria-expanded',e);document.getElementById('tg').setAttribute('aria-label',e?'Collapse sidebar':'Expand sidebar')};
</script></body></html>
