<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Task Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#FFF3D6,#FFE3E3 55%,#E7E4FF);color:#2A2140;font-family:'Quicksand',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 18px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:440px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-radius:30px;padding:28px;box-shadow:0 36px 60px -34px rgba(70,40,110,.5),0 0 0 1px rgba(255,255,255,.9)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}.hd h1{font-size:25px;font-weight:700;letter-spacing:-.03em}.hd span{font-size:13.5px;font-weight:700;color:#9A8DB5}
.pb{height:9px;border-radius:9px;background:#F0E9FA;margin:14px 0 20px;overflow:hidden}.pb i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#FF8A5B,#F43F8E);transition:width .5s cubic-bezier(.3,1.2,.4,1)}
.l{list-style:none;display:grid;gap:8px}
.it{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #F0EAF8;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:in .35s cubic-bezier(.3,1.4,.4,1)}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.it:hover{transform:translateX(3px);box-shadow:0 0 0 1px #E5D9F6}
.cb{position:relative;flex:none;width:26px;height:26px}.cb input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.cb b{position:absolute;inset:0;border-radius:9px;border:2.500px solid #D9CCF0;background:#fff;transition:all .25s cubic-bezier(.3,1.5,.4,1);display:grid;place-items:center;color:#fff}
.cb svg{width:15px;height:15px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .1s}
.cb input:checked+b{background:linear-gradient(135deg,#FF8A5B,#F43F8E);border-color:transparent;transform:scale(1.08)}.cb input:checked+b svg{stroke-dashoffset:0}
.cb input:focus-visible+b{box-shadow:0 0 0 4px rgba(244,63,142,.25)}
.tx{flex:1;font-size:16px;font-weight:600;position:relative;transition:color .25s}.tx::after{content:"";position:absolute;left:0;top:50%;height:2px;width:0;background:#B7A9D0;transition:width .35s}
.it.dn .tx{color:#B7A9D0}.it.dn .tx::after{width:100%}
.ad{display:flex;gap:10px;margin-top:16px}
.ad input{flex:1;border:2px dashed #DCCFF2;border-radius:16px;padding:13px 16px;font:600 15px 'Quicksand';color:#2A2140;background:transparent;outline:0;transition:all .2s}.ad input:focus{border-style:solid;border-color:#F43F8E;background:#fff}
.ad button{border:0;border-radius:16px;padding:0 20px;font:700 14px 'Quicksand';background:#2A2140;color:#fff;cursor:pointer}.ad button:focus-visible{outline:2px solid #F43F8E;outline-offset:2px}
.cl{margin-top:14px;text-align:center}.cl button{border:0;background:none;font:700 13.5px 'Quicksand';color:#9A8DB5;cursor:pointer}.cl button:hover{color:#F43F8E}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Today</h1><span id="ct"></span></div><div class="pb"><i id="pb"></i></div><ul class="l" id="l"></ul>
<form class="ad" id="f"><input id="i" placeholder="Add a task…" aria-label="New task" autocomplete="off"><button>Add</button></form><div class="cl"><button id="cl">Clear completed</button></div></div>
<script>
let T=[['Review pull requests',1],['Send the launch announcement',1],['Update the pricing page',0],['Book flights for the offsite',0],['Water the plants',0]],id=0;
const l=document.getElementById('l');
const ck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.600" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>';
function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function draw(){l.innerHTML=T.map((t,i)=>'<li class="it'+(t[1]?' dn':'')+'"><label class="cb"><input type="checkbox" data-i="'+i+'"'+(t[1]?' checked':'')+' aria-label="'+esc(t[0])+'"><b>'+ck+'</b></label><span class="tx">'+esc(t[0])+'</span></li>').join('');
 const d=T.filter(t=>t[1]).length;document.getElementById('ct').textContent=d+' of '+T.length+' done';document.getElementById('pb').style.width=(T.length?d/T.length*100:0)+'%'}
l.addEventListener('change',e=>{const i=e.target.dataset.i;if(i==null)return;T[i][1]=e.target.checked?1:0;const li=e.target.closest('.it');li.classList.toggle('dn',e.target.checked);const d=T.filter(t=>t[1]).length;document.getElementById('ct').textContent=d+' of '+T.length+' done';document.getElementById('pb').style.width=(d/T.length*100)+'%'});
l.addEventListener('click',e=>{const it=e.target.closest('.it');if(it&&!e.target.closest('.cb')){const c=it.querySelector('input');c.checked=!c.checked;c.dispatchEvent(new Event('change',{bubbles:true}))}});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('i').value.trim();if(!v)return;T.push([v,0]);document.getElementById('i').value='';draw()});
document.getElementById('cl').onclick=()=>{T=T.filter(t=>!t[1]);draw()};draw();
</script></body></html>
