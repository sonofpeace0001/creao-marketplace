<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orbit Globe Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04060C;color:#E6ECFA;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;overflow:hidden;-webkit-font-smoothing:antialiased;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#fff 50%,transparent),radial-gradient(1px 1px at 78% 14%,#fff 50%,transparent),radial-gradient(1.4px 1.4px at 88% 70%,#9fb8ff 50%,transparent),radial-gradient(1px 1px at 24% 84%,#fff 50%,transparent),radial-gradient(1px 1px at 52% 8%,#cfe 50%,transparent),radial-gradient(1.2px 1.2px at 6% 58%,#fff 50%,transparent)}
.w{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;width:100%;max-width:820px}
.gb{position:relative;width:min(340px,80vw);aspect-ratio:1;margin:0 auto}
.sp{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,#2A5CC8,#0F2A6B 45%,#050C26 78%);box-shadow:inset -34px -26px 60px rgba(0,0,0,.65),inset 12px 10px 40px rgba(110,170,255,.25),0 0 90px -10px rgba(60,120,255,.55);overflow:hidden}
.ln{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.ln i{position:absolute;left:50%;top:0;bottom:0;width:100%;margin-left:-50%;border-radius:50%;border:1px solid rgba(140,190,255,.22);transform:scaleX(var(--s))}
.eq{position:absolute;left:0;right:0;border-top:1px solid rgba(140,190,255,.22)}
.dots{position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(rgba(150,200,255,.55) 1.4px,transparent 1.6px);background-size:14px 14px;mask-image:radial-gradient(circle at 40% 36%,#000 25%,transparent 72%);-webkit-mask-image:radial-gradient(circle at 40% 36%,#000 25%,transparent 72%);animation:pan 26s linear infinite}
@keyframes pan{to{background-position:140px 0}}
.pin{position:absolute;width:10px;height:10px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 14px #5EEAD4;left:var(--x);top:var(--y)}
.pin::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px solid #5EEAD4;animation:pu 2.4s ease-out infinite;animation-delay:var(--d)}
@keyframes pu{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.7);opacity:0}}
.ring{position:absolute;inset:-26px;border-radius:50%;border:1px dashed rgba(140,190,255,.28);animation:rt 40s linear infinite}
.ring::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;border-radius:50%;background:#FFB84D;box-shadow:0 0 14px #FFB84D}
@keyframes rt{to{transform:rotate(360deg)}}
.tx small{font:400 12px 'Space Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#6E8BC8}
.big{font-size:clamp(70px,13vw,128px);font-weight:700;letter-spacing:-.07em;line-height:.9;margin:12px 0 10px;background:linear-gradient(135deg,#fff,#7FAEFF);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.tx p{color:#8EA3CC;font-size:17px;line-height:1.5;max-width:300px}
.mt{display:flex;gap:28px;margin-top:26px;padding-top:20px;border-top:1px solid #16223F}.mt b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em}.mt span{font:400 11.5px 'Space Mono',monospace;color:#6E8BC8;letter-spacing:.08em}
@media(max-width:700px){.w{grid-template-columns:1fr;text-align:center;gap:50px}.tx p{margin:0 auto}.mt{justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="w"><div class="gb"><div class="ring"></div><div class="sp"><div class="dots"></div><div class="ln"><i style="--s:.2"></i><i style="--s:.45"></i><i style="--s:.72"></i><i style="--s:1"></i><span class="eq" style="top:50%"></span><span class="eq" style="top:30%"></span><span class="eq" style="top:70%"></span></div>
 <i class="pin" style="--x:44%;--y:36%;--d:0s"></i><i class="pin" style="--x:60%;--y:48%;--d:.6s"></i><i class="pin" style="--x:34%;--y:58%;--d:1.2s"></i><i class="pin" style="--x:68%;--y:30%;--d:1.8s"></i></div></div>
 <div class="tx"><small>Worldwide reach</small><div class="big" id="n">0</div><p>countries where teams ship with Relay every single day.</p><div class="mt"><div><b>2.4M</b><span>ACTIVE USERS</span></div><div><b>42</b><span>REGIONS</span></div></div></div></div>
<script>
const el=document.getElementById('n'),T=190,t0=performance.now(),R=matchMedia('(prefers-reduced-motion: reduce)').matches;(function f(t){const k=R?1:Math.min(1,(t-t0)/1800),e=1-Math.pow(1-k,3);el.textContent=Math.round(T*e);if(k<1)requestAnimationFrame(f)})(t0);
</script></body></html>
