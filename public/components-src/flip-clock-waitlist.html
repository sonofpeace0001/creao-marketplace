<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Flip Clock Waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#14110F;background-image:radial-gradient(#1D1916 1px,transparent 1px);background-size:20px 20px;color:#F4EEE6;font-family:'Karla',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:640px;text-align:center}
.c small{font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#E9A23B}.c h1{font:700 clamp(32px,6vw,52px)/1.02 'Oswald';letter-spacing:.01em;text-transform:uppercase;margin:10px 0 28px}
.cl{display:flex;justify-content:center;gap:clamp(8px,2vw,16px);margin-bottom:30px}
.un{display:flex;flex-direction:column;align-items:center;gap:10px}.un span{font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9A8E7E}
.pair{display:flex;gap:5px}
.d{position:relative;width:clamp(44px,10vw,70px);height:clamp(64px,14vw,98px);font:700 clamp(44px,10vw,72px)/clamp(64px,14vw,98px) 'Oswald';perspective:400px}
.d>div,.f>div{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:linear-gradient(180deg,#2E2925,#221E1B);text-align:center;color:#F7F0E6}
.u1{top:0;border-radius:10px 10px 0 0;border-bottom:1px solid #0E0C0A}.l1{bottom:0;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#26221F,#1C1815)!important}
.u1 i,.f .fr i{position:absolute;left:0;right:0;top:0;font-style:normal;height:200%}.l1 i,.f .bk i{position:absolute;left:0;right:0;bottom:0;font-style:normal;height:200%}
.u1,.f .fr{display:block}
.d>div i{display:block;width:100%;text-align:center}
.f{position:absolute;left:0;right:0;top:0;height:50%;transform-origin:50% 100%;transform-style:preserve-3d;z-index:3}
.f>div{height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}.f .fr{top:0;border-radius:10px 10px 0 0}.f .bk{top:0;transform:rotateX(180deg);border-radius:0 0 10px 10px;background:linear-gradient(180deg,#26221F,#1C1815)}
.f .bk i{bottom:0;top:auto;height:200%}.f .fr i{top:0}
.f.go{animation:fl .55s ease-in forwards}@keyframes fl{to{transform:rotateX(-180deg)}}
.d::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;margin-top:-1px;background:#0E0C0A;z-index:5}
.sp{font:700 40px/98px 'Oswald';color:#E9A23B;align-self:flex-start;margin-top:22px;opacity:.7}
.fm{display:flex;gap:8px;max-width:440px;margin:0 auto 14px}.fm input{flex:1;min-width:0;background:#1E1A17;border:1.5px solid #3A332D;border-radius:12px;padding:14px 16px;font:500 16px 'Karla';color:#F4EEE6;outline:0}.fm input:focus{border-color:#E9A23B;box-shadow:0 0 0 4px rgba(233,162,59,.15)}.fm input::placeholder{color:#7A6F62}.fm button{border:0;border-radius:12px;padding:0 24px;font:700 15px 'Karla';background:#E9A23B;color:#1D1305;cursor:pointer;letter-spacing:.02em}.fm button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sl{max-width:440px;margin:0 auto}.sl .t{display:flex;justify-content:space-between;font-size:13.5px;color:#9A8E7E;margin-bottom:8px}.sl .t b{color:#F4EEE6}.sl .br{height:8px;border-radius:8px;background:#26211D;overflow:hidden}.sl .br i{display:block;height:100%;width:58%;border-radius:8px;background:linear-gradient(90deg,#E9A23B,#F5C76E)}
@media(prefers-reduced-motion:reduce){.f.go{animation-duration:.01s}}
</style></head><body>
<div class="c"><small>Founding access</small><h1>Doors open soon</h1>
<div class="cl" id="cl"></div>
<form class="fm" onsubmit="event.preventDefault();this.querySelector('button').textContent='You are in'"><input type="email" placeholder="you@studio.com" aria-label="Email"><button>Reserve spot</button></form>
<div class="sl"><div class="t"><span><b>418</b> of 1,000 spots left</span><span>58% claimed</span></div><div class="br"><i></i></div></div></div>
<script>
const cl=document.getElementById('cl');const U=['Days','Hours','Min','Sec'];const target=Date.now()+(12*86400+7*3600+41*60+9)*1000;const cards=[];
U.forEach((u,k)=>{const w=document.createElement('div');w.className='un';const p=document.createElement('div');p.className='pair';const ds=[0,1].map(()=>mk());ds.forEach(d=>p.appendChild(d.el));w.appendChild(p);w.insertAdjacentHTML('beforeend','<span>'+u+'</span>');cl.appendChild(w);cards.push(ds);if(k<3)cl.insertAdjacentHTML('beforeend','<div class="sp">:</div>')});
function mk(){const el=document.createElement('div');el.className='d';el.innerHTML='<div class="u1"><i></i></div><div class="l1"><i></i></div><div class="f"><div class="fr"><i></i></div><div class="bk"><i></i></div></div>';const o={el,v:null,u:el.querySelector('.u1 i'),l:el.querySelector('.l1 i'),f:el.querySelector('.f'),fr:el.querySelector('.fr i'),bk:el.querySelector('.bk i')};return o}
function set(o,v,anim){if(o.v===v)return;const old=o.v==null?v:o.v;o.v=v;o.u.textContent=v;if(!anim||old===v){o.l.textContent=v;o.fr.textContent=v;o.bk.textContent=v;return}o.fr.textContent=old;o.bk.textContent=v;o.f.classList.remove('go');void o.f.offsetWidth;o.f.classList.add('go');setTimeout(()=>{o.l.textContent=v;o.f.classList.remove('go');o.fr.textContent=v},540)}
function tick(anim){let s=Math.max(0,Math.floor((target-Date.now())/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];v.forEach((n,i)=>{const t=String(n).padStart(2,'0');set(cards[i][0],t[0],anim);set(cards[i][1],t[1],anim)})}
tick(false);setInterval(()=>tick(true),1000);
</script></body></html>
