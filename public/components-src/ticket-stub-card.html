<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ticket Stub Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Archivo:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2E6D4;color:#201712;font-family:'Archivo',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.5),transparent 40%)}
.w{display:grid;gap:26px;justify-items:center}
.tk{--r:0deg;--tx:0px;--ty:0px;display:flex;width:min(640px,94vw);filter:drop-shadow(0 22px 22px rgba(32,23,18,.28));transform:rotate(-2deg)}
.main{position:relative;flex:1;background:#FF5A36;color:#FFF3E6;padding:24px 26px;min-height:230px;border-radius:18px 0 0 18px;display:flex;flex-direction:column;justify-content:space-between;
 -webkit-mask:radial-gradient(circle 14px at 100% 0,transparent 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 100% 100%,transparent 98%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 14px at 100% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 100% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.main::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px);pointer-events:none}
.stub{position:relative;width:148px;background:#201712;color:#FFF3E6;padding:22px 18px;border-radius:0 18px 18px 0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;transform-origin:50% 100%;transform:translate(var(--tx),var(--ty)) rotate(var(--r));transition:transform .8s cubic-bezier(.3,1.3,.4,1);
 -webkit-mask:radial-gradient(circle 14px at 0 0,transparent 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 0 100%,transparent 98%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 14px at 0 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 14px at 0 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.stub::before{content:"";position:absolute;left:-1px;top:16px;bottom:16px;border-left:2px dashed rgba(255,243,230,.35)}
.tk.tear .stub{--r:7deg;--tx:12px;--ty:6px}
.eb{font:700 11px 'Space Mono';letter-spacing:.2em;text-transform:uppercase;opacity:.85;display:flex;justify-content:space-between}
.main h2{font:700 clamp(28px,6vw,44px) 'Unbounded';letter-spacing:-.05em;line-height:.95;position:relative}
.main h2 span{display:block;font-weight:500;font-size:.5em;letter-spacing:-.02em;opacity:.85;margin-top:8px}
.info{display:flex;gap:26px;position:relative}.info small{display:block;font:700 10px 'Space Mono';letter-spacing:.16em;opacity:.7;text-transform:uppercase}.info b{font-size:16px}
.bar{position:relative;width:96px;height:86px;overflow:hidden;border-radius:4px;background:#FFF3E6}
.bar svg{width:100%;height:100%;display:block}
.scan{position:absolute;left:0;right:0;height:3px;background:#FF5A36;box-shadow:0 0 12px 3px rgba(255,90,54,.8);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{top:2%}50%{top:94%}}
.stub .seat{text-align:center}.stub small{display:block;font:700 10px 'Space Mono';letter-spacing:.16em;opacity:.6}.stub b{font:700 30px 'Unbounded';letter-spacing:-.04em}
.rot{writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px 'Space Mono';letter-spacing:.2em;opacity:.55;position:absolute;right:8px;top:50%;margin-top:-60px}
.cta{border:0;border-radius:99px;padding:13px 24px;background:#201712;color:#FFF3E6;font:700 14px 'Archivo';cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.cta:focus-visible{outline:3px solid #FF5A36;outline-offset:3px}
@media(max-width:520px){.stub{width:104px;padding:18px 12px}.stub b{font-size:22px}.bar{width:76px;height:64px}.info{gap:14px}.rot{display:none}}
@media(prefers-reduced-motion:reduce){.stub{transition:none}.scan{animation:none;top:40%}}
</style></head><body>
<div class="w"><div class="tk" id="tk">
<div class="main"><div class="eb"><span>Admit one</span><span>No. 004127</span></div><h2>Nightfall<br>Festival<span>Sat 14 Sept  |  Harbour Quarter</span></h2><div class="info"><div><small>Doors</small><b>18:30</b></div><div><small>Gate</small><b>North B</b></div><div><small>Tier</small><b>General</b></div></div></div>
<div class="stub"><span class="rot">NIGHTFALL 2026</span><div class="seat"><small>SECTION</small><b>C14</b></div><div class="bar"><svg viewBox="0 0 96 86" preserveAspectRatio="none"><g fill="#201712"><rect x="4" y="6" width="3" height="74"/><rect x="10" y="6" width="1.500" height="74"/><rect x="14" y="6" width="5" height="74"/><rect x="22" y="6" width="2" height="74"/><rect x="27" y="6" width="4" height="74"/><rect x="34" y="6" width="1.500" height="74"/><rect x="38" y="6" width="3" height="74"/><rect x="44" y="6" width="5" height="74"/><rect x="52" y="6" width="1.500" height="74"/><rect x="56" y="6" width="3" height="74"/><rect x="62" y="6" width="4" height="74"/><rect x="69" y="6" width="2" height="74"/><rect x="74" y="6" width="5" height="74"/><rect x="82" y="6" width="1.500" height="74"/><rect x="86" y="6" width="4" height="74"/></g></svg><span class="scan"></span></div></div>
</div><button class="cta" id="b"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>Scan at the gate</button></div>
<script>
const tk=document.getElementById('tk'),b=document.getElementById('b');let off=false,timer;
const tear=v=>tk.classList.toggle('tear',v);
tk.addEventListener('pointerenter',()=>{off=true;tear(true)});tk.addEventListener('pointerleave',()=>tear(false));b.addEventListener('click',()=>tear(!tk.classList.contains('tear')));
/* Idle demo: the stub tears away and snaps back every 3.4s, while the scanner line never stops. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setTimeout(()=>{if(off)return;tear(true);timer=setInterval(()=>{if(off){clearInterval(timer);return}tear(!tk.classList.contains('tear'))},1900)},3600);
</script></body></html>
