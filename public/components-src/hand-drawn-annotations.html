<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hand Drawn Annotations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F6F1E6;color:#1E1A12;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:720px;background:#FFFDF7;border-radius:6px;padding:48px 52px 44px;box-shadow:0 1px 0 #fff inset,0 40px 70px -44px rgba(70,50,10,.5),0 0 0 1px rgba(30,26,18,.08);background-image:linear-gradient(transparent 31px,rgba(120,150,200,.18) 32px);background-size:100% 32px;position:relative}
.c::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:rgba(220,90,90,.35)}
small{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#B4491C}
h1{font:600 clamp(34px,5.5vw,52px)/1.15 'Fraunces',serif;letter-spacing:-.025em;margin:10px 0 18px}
p{font:500 clamp(19px,2.6vw,23px)/1.62 'Fraunces',serif;color:#3A3428;margin-bottom:16px}
.an{position:relative;display:inline-block;white-space:nowrap}
.an svg{position:absolute;pointer-events:none;overflow:visible}
.an svg path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);transition:stroke-dashoffset .9s cubic-bezier(.5,0,.2,1)}
.an.on svg path{stroke-dashoffset:0}
.an.hl svg{left:-4px;right:-4px;top:12%;bottom:6%;width:calc(100% + 8px);height:82%;z-index:-1}.an.hl svg path{stroke:#FFD54A;stroke-width:26;opacity:.75}
.an.ul svg{left:0;bottom:-8px;width:100%;height:12px}.an.ul svg path{stroke:#E85D04;stroke-width:3.500}
.an.ci svg{left:-14px;top:-10px;width:calc(100% + 28px);height:calc(100% + 20px)}.an.ci svg path{stroke:#2563EB;stroke-width:2.800}
.an.bx svg{left:-6px;top:-4px;width:calc(100% + 12px);height:calc(100% + 8px)}.an.bx svg path{stroke:#16A34A;stroke-width:2.500}
.an.st svg{left:-4px;top:50%;width:calc(100% + 8px);height:10px;margin-top:-5px}.an.st svg path{stroke:#DC2626;stroke-width:3}
.nt{display:inline-block;margin-left:10px;font:italic 500 17px 'Fraunces',serif;color:#2563EB;transform:rotate(-3deg);opacity:0;transition:opacity .5s .7s}.nt.on{opacity:1}
.rp{margin-top:6px;border:1.5px solid #D8CFB8;background:#fff;border-radius:99px;padding:8px 18px;font:600 13.5px 'Inter';color:#5A5240;cursor:pointer}.rp:hover{border-color:#B4491C;color:#B4491C}.rp:focus-visible{outline:2px solid #B4491C}
@media(max-width:560px){.c{padding:34px 22px 30px 40px}.an{white-space:normal}}
@media(prefers-reduced-motion:reduce){.an svg path{transition:none;stroke-dashoffset:0}.nt{transition:none;opacity:1}}
</style></head><body>
<div class="c"><small>Field notes</small><h1>Good products are <span class="an hl" data-p="M2 20 C60 8 140 26 300 14">built slowly</span>, then shipped <span class="an ul" data-p="M2 7 C40 2 90 11 140 5 S230 8 298 4">all at once</span>.</h1>
<p>Most teams chase <span class="an st" data-p="M2 5 C60 8 150 2 298 6">speed</span>, but the ones people love <span class="an ci" data-p="M20 6 C90 -2 180 0 232 14 C260 30 200 46 120 44 C40 42 -4 30 6 14 C10 8 30 4 60 3">sweat the details</span>. Every pixel is a small promise to the person on the other side of the screen.</p>
<p>Write the thing down, <span class="an bx" data-p="M2 4 L298 2 L296 36 L3 38 Z">then check it twice</span><span class="nt" id="nt">always</span> before it goes out the door.</p><button class="rp" id="rp">Replay the drawing</button></div>
<script>
const ans=[...document.querySelectorAll('.an')];
function build(){ans.forEach(a=>{if(a.querySelector('svg'))return;const w=a.getBoundingClientRect().width||150,h=a.getBoundingClientRect().height||34;let vb='0 0 300 40',pa=a.dataset.p;const ns='http://www.w3.org/2000/svg';const s=document.createElementNS(ns,'svg');s.setAttribute('viewBox',a.classList.contains('ul')?'0 0 300 12':a.classList.contains('st')?'0 0 300 10':a.classList.contains('ci')?'0 -4 240 56':a.classList.contains('bx')?'0 0 300 40':'0 0 300 30');s.setAttribute('preserveAspectRatio','none');const p=document.createElementNS(ns,'path');p.setAttribute('d',pa);p.setAttribute('vector-effect','non-scaling-stroke');s.appendChild(p);a.appendChild(s);const L=Math.ceil(p.getTotalLength?p.getTotalLength()*4:1600);p.style.setProperty('--l',L)})}
function play(){ans.forEach(a=>a.classList.remove('on'));document.getElementById('nt').classList.remove('on');void document.body.offsetWidth;ans.forEach((a,i)=>setTimeout(()=>a.classList.add('on'),i*650+100));setTimeout(()=>document.getElementById('nt').classList.add('on'),ans.length*650)}
function instant(){ans.forEach(a=>{const p=a.querySelector('path');p.style.transition='none';a.classList.add('on');requestAnimationFrame(()=>p.style.transition='')});document.getElementById('nt').classList.add('on')}
function init(){build();instant()}
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{ans.forEach(a=>{const s=a.querySelector('svg');if(s)s.remove()});build();instant()});
document.getElementById('rp').onclick=play;
</script></body></html>
