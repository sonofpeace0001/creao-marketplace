<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Copilot Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 480px at 85% 0,#2A1D0B,transparent 60%),#0B0B0D;color:#F1EEE8;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 18px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:440px;height:600px;background:#121214;border:1px solid #26262B;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 80px -30px #000}
.hd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #202025;background:#0F0F11}
.lg{width:38px;height:38px;border-radius:12px;background:conic-gradient(from 200deg,#FFB547,#FF7A45,#FFB547);display:grid;place-items:center;color:#1A1000}
.hd b{font-size:15.5px;font-weight:600;display:block}.hd span{font-size:12.5px;color:#8E8A80;display:flex;align-items:center;gap:6px}.hd span i{width:6px;height:6px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80}
.lg2{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;color:#FFB547;background:rgba(255,181,71,.1);padding:5px 10px;border-radius:99px}
.ms{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}.ms::-webkit-scrollbar{width:0}
.m{max-width:86%;font-size:14.5px;line-height:1.5;padding:12px 15px;border-radius:18px;animation:in .35s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.ai{align-self:flex-start;background:#1B1B1F;border:1px solid #26262B;border-bottom-left-radius:6px;color:#E8E5DD}
.me{align-self:flex-end;background:linear-gradient(135deg,#FFB547,#FF8A3D);color:#1A1000;font-weight:500;border-bottom-right-radius:6px}
.ai b{color:#FFC978;font-weight:600}
.ty{align-self:flex-start;display:flex;gap:5px;padding:15px 16px;background:#1B1B1F;border:1px solid #26262B;border-radius:18px;border-bottom-left-radius:6px}
.ty i{width:7px;height:7px;border-radius:50%;background:#8E8A80;animation:b 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.ch{display:flex;gap:8px;padding:0 18px 12px;flex-wrap:wrap}
.ch button{border:1px solid #2C2C32;background:#16161A;color:#CFCBC0;font:500 13px 'Inter Tight';padding:8px 13px;border-radius:99px;cursor:pointer;transition:all .2s}
.ch button:hover{border-color:#FFB547;color:#FFC978}
.in{display:flex;gap:10px;padding:14px 16px 16px;border-top:1px solid #202025;background:#0F0F11}
.in input{flex:1;background:#17171B;border:1px solid #2A2A30;border-radius:14px;padding:13px 15px;color:#F1EEE8;font:400 15px 'Inter Tight';outline:0}
.in input:focus{border-color:#FFB547;box-shadow:0 0 0 4px rgba(255,181,71,.12)}
.in button{width:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#FFB547,#FF8A3D);color:#1A1000;cursor:pointer;display:grid;place-items:center;transition:transform .15s}.in button:hover{transform:scale(1.05)}
.in button:focus-visible,.ch button:focus-visible{outline:2px solid #FFB547;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="w"><div class="hd"><div class="lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.200 6.800L21 11l-6.800 2.200L12 20l-2.200-6.800L3 11l6.800-2.200Z"/></svg></div><div><b>Copilot</b><span><i></i>Online · replies in seconds</span></div><span class="lg2">BETA</span></div>
<div class="ms" id="m" aria-live="polite"></div><div class="ch" id="c"></div>
<form class="in" id="f"><input id="i" placeholder="Ask anything about your workspace…" aria-label="Message" autocomplete="off"><button aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form></div>
<script>
const m=document.getElementById('m'),c=document.getElementById('c'),f=document.getElementById('f'),i=document.getElementById('i');
const R={'summarize':'Here\'s the quick version: <b>3 projects on track</b>, 1 at risk (Mobile redesign), and 2 reviews due today.','risk':'The <b>Mobile redesign</b> is 4 days behind. The blocker is design sign-off — want me to ping Ines for a review?','plan':'I\'d suggest this order: <b>1) unblock sign-off, 2) freeze scope, 3) ship the beta Thursday.</b> I can draft the update.'};
const Q=[['Summarize this week','summarize'],['What\'s at risk?','risk'],['Plan my Friday','plan']];
c.innerHTML=Q.map(q=>'<button data-k="'+q[1]+'">'+q[0]+'</button>').join('');
function add(t,w){const d=document.createElement('div');d.className='m '+w;d.innerHTML=t;m.appendChild(d);m.scrollTop=m.scrollHeight}
function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function ask(t,k){add(esc(t),'me');const ty=document.createElement('div');ty.className='ty';ty.innerHTML='<i></i><i></i><i></i>';m.appendChild(ty);m.scrollTop=m.scrollHeight;
 setTimeout(()=>{ty.remove();add(R[k]||'Good question. I\'ll look through your boards and get back with <b>specifics</b> in a moment.','ai')},1300)}
add('Hi Maya — I\'m your workspace copilot. I can summarise progress, flag risks and draft updates. What do you need?','ai');
add('Summarize this week','me');
add(R.summarize,'ai');
add('What\'s at risk?','me');
add(R.risk,'ai');
c.addEventListener('click',e=>{const b=e.target.closest('button');if(b)ask(b.textContent,b.dataset.k)});
f.addEventListener('submit',e=>{e.preventDefault();const t=i.value.trim();if(!t)return;i.value='';const l=t.toLowerCase();ask(t,l.includes('risk')?'risk':l.includes('plan')?'plan':l.includes('summar')?'summarize':'')});
</script></body></html>
