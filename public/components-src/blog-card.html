<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9ECF5;color:#14172B;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.g{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;width:100%;max-width:760px}
.cd{position:relative;display:flex;flex-direction:column;background:#fff;border-radius:26px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 30px 50px -36px rgba(20,23,43,.55),0 0 0 1px rgba(20,23,43,.05);transition:transform .3s cubic-bezier(.3,1.2,.5,1),box-shadow .3s}.cd:hover{transform:translateY(-6px);box-shadow:0 40px 60px -34px rgba(20,23,43,.6),0 0 0 1px rgba(20,23,43,.05)}.cd:focus-visible{outline:3px solid #5B3DF5;outline-offset:3px}
.im{position:relative;overflow:hidden;aspect-ratio:16/10}.im i{position:absolute;inset:0;transition:transform .6s cubic-bezier(.2,.8,.2,1)}.cd:hover .im i{transform:scale(1.08)}
.im span{position:absolute;left:14px;top:14px;font:700 11.5px 'Inter';letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.92);color:#14172B;padding:6px 11px;border-radius:99px;backdrop-filter:blur(6px)}
.bd{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}.mt{font-size:12.5px;color:#7C829E;font-weight:500;margin-bottom:9px;display:flex;gap:8px}
.bd h2{font:800 22px/1.15 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em;margin-bottom:9px}.bd p{font-size:14.5px;line-height:1.55;color:#5B6180;margin-bottom:18px}
.ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between}.au{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}.au i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px 'Inter';font-style:normal}
.ar{width:36px;height:36px;border-radius:50%;background:#14172B;color:#fff;display:grid;place-items:center;transition:all .3s}.cd:hover .ar{background:#5B3DF5;transform:rotate(-45deg)}
.sm .im{aspect-ratio:16/9}.sm h2{font-size:18px}.sm p{display:none}
.bm{position:absolute;right:14px;top:14px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#14172B;cursor:pointer;display:grid;place-items:center;z-index:2;backdrop-filter:blur(6px)}.bm[aria-pressed=true]{background:#5B3DF5;color:#fff}.bm[aria-pressed=true] svg{fill:currentColor}.bm:focus-visible{outline:2px solid #5B3DF5;outline-offset:2px}
@media(max-width:640px){.g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="g">
<div style="position:relative"><button class="bm" aria-pressed="false" aria-label="Save article"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
<a class="cd" href="#" style="height:100%"><div class="im"><i style="background:radial-gradient(circle at 25% 30%,#FFD27A,transparent 45%),radial-gradient(circle at 80% 70%,#7C5CFA,transparent 55%),linear-gradient(135deg,#FF7A59,#E04FD0)"></i><span>Product</span></div><div class="bd"><div class="mt"><span>Nov 5</span><span>·</span><span>7 min read</span></div><h2>How we rebuilt onboarding and doubled activation</h2><p>A behind-the-scenes look at the experiments, the dead ends and the three small changes that mattered most.</p><div class="ft"><div class="au"><i style="background:#5B3DF5">MR</i>Maya Rowe</div><div class="ar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div></div></a></div>
<a class="cd sm" href="#"><div class="im"><i style="background:radial-gradient(circle at 70% 25%,#B6F7D6,transparent 50%),linear-gradient(135deg,#0EA5A4,#1E3A8A)"></i><span>Engineering</span></div><div class="bd"><div class="mt"><span>Oct 29</span><span>·</span><span>5 min read</span></div><h2>Shipping faster with smaller pull requests</h2><div class="ft"><div class="au"><i style="background:#0EA5A4">TK</i>Tomas Klein</div><div class="ar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div></div></a>
</div>
<script>document.querySelector('.bm').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};</script></body></html>
