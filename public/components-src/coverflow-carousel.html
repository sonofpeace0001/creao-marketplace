<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Coverflow Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 400px at 50% 100%,#1D1636,transparent 70%),#0B0A12;color:#F2EFFA;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{width:100%;max-width:900px;text-align:center}
.st{position:relative;height:340px;perspective:1100px;touch-action:pan-y}
.cv{position:absolute;left:50%;top:0;width:220px;height:300px;margin-left:-110px;border-radius:20px;background:var(--g);cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.9,.2,1),opacity .5s,filter .5s;box-shadow:0 30px 40px -18px rgba(0,0,0,.8);border:0;padding:0;overflow:hidden;text-align:left;color:#fff}
.cv:focus-visible{outline:3px solid #fff;outline-offset:4px}
.cv::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.5),transparent 50%),radial-gradient(circle at 80% 100%,rgba(0,0,0,.5),transparent 60%)}
.cv::after{content:"";position:absolute;left:0;right:0;bottom:-100%;height:100%;background:linear-gradient(rgba(255,255,255,.28),transparent 50%);transform:scaleY(-1);opacity:.5;pointer-events:none}
.cv .n{position:absolute;left:18px;top:14px;font:700 13px 'Syne';letter-spacing:.14em;opacity:.85}.cv .nm{position:absolute;left:18px;bottom:46px;font:800 26px/1 'Syne';letter-spacing:-.04em}.cv .ar{position:absolute;left:18px;bottom:20px;font-size:13px;opacity:.85;font-weight:500}
.in{margin-top:18px}.in h1{font:800 clamp(22px,3.6vw,30px) 'Syne';letter-spacing:-.04em}.in p{color:#9A92BE;margin-top:6px;font-size:14.5px}
.ct{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:20px}.ct button{width:46px;height:46px;border-radius:50%;border:1px solid #2F2850;background:#16122A;color:#F2EFFA;cursor:pointer;display:grid;place-items:center;transition:all .2s}.ct button:hover{background:#F2EFFA;color:#0B0A12}.ct button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.dt{display:flex;gap:7px}.dt i{width:7px;height:7px;border-radius:50%;background:#3A3260;transition:all .3s}.dt i.on{width:22px;border-radius:5px;background:#fff}
@media(max-width:600px){.cv{width:170px;height:240px;margin-left:-85px}.st{height:290px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="st" id="st" role="region" aria-label="Album carousel"></div><div class="in"><h1 id="nm"></h1><p id="ar"></p></div>
<div class="ct"><button id="pv" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><div class="dt" id="dt"></div><button id="nx" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
<script>
const A=[['Neon Coast','Mira Vale','linear-gradient(160deg,#FF7A59,#E8316B 55%,#3A0F4A)'],['Static Bloom','The Quiet Hours','linear-gradient(160deg,#6FD3FF,#3D5CF0 55%,#1A1466)'],['Golden Hour','Sol & Echo','linear-gradient(160deg,#FFD25A,#FF8A3D 55%,#7A2410)'],['Deep Field','Orbit Club','linear-gradient(160deg,#C79BFF,#6D28D9 55%,#1E0A4A)'],['Greenhouse','Fern Atlas','linear-gradient(160deg,#9BF0C0,#059669 55%,#06392A)'],['Paper Moon','Lila Hart','linear-gradient(160deg,#F7C4F0,#B24FD0 55%,#3A0F5A)'],['Afterglow','Hollow Pines','linear-gradient(160deg,#FFB48A,#D9534F 55%,#4A1020)']];
const st=document.getElementById('st'),dt=document.getElementById('dt');let cur=3;
st.innerHTML=A.map((a,i)=>'<button class="cv" style="--g:'+a[2]+'" aria-label="'+a[0]+' by '+a[1]+'"><span class="n">0'+(i+1)+'</span><span class="nm">'+a[0]+'</span><span class="ar">'+a[1]+'</span></button>').join('');dt.innerHTML=A.map(()=>'<i></i>').join('');
const C=[...st.children],D=[...dt.children];
function lay(){const gap=window.innerWidth<600?70:96;C.forEach((c,i)=>{const o=i-cur,ab=Math.abs(o);c.style.zIndex=20-ab;c.style.opacity=ab>3?0:1;c.style.pointerEvents=ab>3?'none':'auto';c.style.filter=ab===0?'none':'brightness('+(1-ab*.16)+')';c.style.transform=o===0?'translateX(0) translateZ(70px)':'translateX('+(o*gap+(o>0?110:-110))+'px) translateZ('+(-ab*50)+'px) rotateY('+(o>0?-58:58)+'deg)'});D.forEach((d,i)=>d.classList.toggle('on',i===cur));document.getElementById('nm').textContent=A[cur][0];document.getElementById('ar').textContent=A[cur][1]}
function go(n){cur=Math.max(0,Math.min(A.length-1,n));lay()}
C.forEach((c,i)=>c.onclick=()=>go(i));document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('pv').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let sx=null;st.addEventListener('pointerdown',e=>sx=e.clientX);st.addEventListener('pointerup',e=>{if(sx===null)return;const d=e.clientX-sx;if(Math.abs(d)>50)go(cur+(d<0?1:-1));sx=null});
st.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>20){go(cur+(e.deltaX>0?1:-1))}},{passive:true});
addEventListener('resize',lay);lay();
</script></body></html>
