<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>App Launcher Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#DDE3F5,#EBDDF5);color:#14172B;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:560px;height:500px;background:rgba(255,255,255,.4);border-radius:28px;overflow:hidden}
.tb{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}.tb b{font-size:15px;font-weight:700;letter-spacing:-.02em}.bt{width:40px;height:40px;border:0;border-radius:12px;background:#fff;color:#14172B;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px -6px rgba(20,23,43,.4);transition:all .2s}.bt:hover{background:#14172B;color:#fff}.bt[aria-expanded=true]{background:#14172B;color:#fff}.bt:focus-visible{outline:3px solid #5B5BF6;outline-offset:2px}
.pn{position:absolute;right:16px;top:64px;width:340px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-radius:24px;padding:14px;box-shadow:0 40px 70px -20px rgba(20,23,43,.5),0 0 0 1px rgba(255,255,255,.8);transform-origin:top right;opacity:0;transform:scale(.88) translateY(-10px);pointer-events:none;transition:all .3s cubic-bezier(.3,1.3,.5,1)}.pn.op{opacity:1;transform:none;pointer-events:auto}
.sr{display:flex;align-items:center;gap:8px;background:#F1F2FA;border-radius:14px;padding:0 12px;margin-bottom:12px;color:#7C82A8}.sr:focus-within{background:#fff;box-shadow:0 0 0 2px #5B5BF6}.sr input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 14.5px 'Inter';padding:11px 0;color:#14172B}
.pn h3{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A90B4;padding:2px 6px 8px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px}
.ap{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:12px 4px 10px;border-radius:16px;cursor:pointer;font:inherit;color:inherit;transition:background .15s,transform .2s;opacity:0;transform:translateY(8px);animation:in .4s cubic-bezier(.3,1.3,.5,1) forwards;animation-delay:calc(var(--i)*30ms + 80ms)}
@keyframes in{to{opacity:1;transform:none}}.ap:hover,.ap:focus-visible{background:#F1F2FA;transform:translateY(-2px)}.ap:focus-visible{outline:2px solid #5B5BF6}
.ap i{width:52px;height:52px;border-radius:16px;background:var(--g);display:grid;place-items:center;color:#fff;box-shadow:0 10px 18px -8px var(--c);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ap:hover i{transform:scale(1.1) rotate(-4deg)}
.ap span{font-size:12.5px;font-weight:600;color:#2C3150}.ap[hidden]{display:none}
.em{padding:24px;text-align:center;color:#8A90B4;font-size:14px}
.ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ECEEF8;margin:8px -14px -14px;padding:12px 20px;font-size:13px;color:#7C82A8}.ft a{color:#5B5BF6;font-weight:600;text-decoration:none}.ft a:focus-visible{outline:2px solid #5B5BF6;border-radius:4px}
.bg{position:absolute;inset:80px 20px 20px;border-radius:18px;background:rgba(255,255,255,.55);padding:20px}.bg div{height:12px;border-radius:6px;background:#D9DCEE;margin-bottom:12px}.bg div:nth-child(2){width:70%}.bg div:nth-child(3){width:50%}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;opacity:1!important;transform:none!important}.pn:not(.op){opacity:0!important}}
</style></head><body>
<div class="st"><div class="tb"><b>Northwind Suite</b><button class="bt" id="bt" aria-expanded="true" aria-haspopup="true" aria-label="Open app launcher"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg></button></div><div class="bg"><div></div><div></div><div></div></div>
<div class="pn op" id="pn" role="dialog" aria-label="Apps"><label class="sr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" placeholder="Search apps" aria-label="Search apps" autocomplete="off"></label><h3 id="h3">Recent</h3><div class="gr" id="gr"></div><div class="em" id="em" hidden>No apps match.</div><div class="ft"><span>9 apps</span><a href="#">Manage apps</a></div></div></div>
<script>
const A=[['Mail','#EF4444','linear-gradient(135deg,#F87171,#DC2626)','M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z'],['Calendar','#3B82F6','linear-gradient(135deg,#60A5FA,#2563EB)','M4 6h16v14H4zM8 3v4M16 3v4M4 11h16'],['Docs','#F59E0B','linear-gradient(135deg,#FBBF24,#D97706)','M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5'],['Drive','#10B981','linear-gradient(135deg,#34D399,#059669)','M7 3h10l4 7-5 9H8L3 10zM3 10h18'],['Meet','#8B5CF6','linear-gradient(135deg,#A78BFA,#6D28D9)','M3 6h13v12H3zM16 10l5-3v10l-5-3'],['Sheets','#22C55E','linear-gradient(135deg,#4ADE80,#16A34A)','M4 4h16v16H4zM4 10h16M4 15h16M10 4v16'],['Chat','#EC4899','linear-gradient(135deg,#F472B6,#DB2777)','M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],['Tasks','#06B6D4','linear-gradient(135deg,#22D3EE,#0891B2)','M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9'],['Forms','#F97316','linear-gradient(135deg,#FB923C,#EA580C)','M5 4h14v16H5zM9 9h6M9 13h6M9 17h3']];
const gr=document.getElementById('gr'),q=document.getElementById('q'),pn=document.getElementById('pn'),bt=document.getElementById('bt');
gr.innerHTML=A.map((a,i)=>'<button class="ap" style="--i:'+i+';--g:'+a[2]+';--c:'+a[1]+'" data-n="'+a[0].toLowerCase()+'"><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+a[3]+'"/></svg></i><span>'+a[0]+'</span></button>').join('');
const B=[...gr.children];
q.addEventListener('input',()=>{const t=q.value.toLowerCase();let n=0;B.forEach(b=>{const m=b.dataset.n.includes(t);b.hidden=!m;if(m)n++});document.getElementById('em').hidden=n>0;document.getElementById('h3').textContent=t?'Results':'Recent'});
function tg(o){pn.classList.toggle('op',o);bt.setAttribute('aria-expanded',o);if(o)setTimeout(()=>q.focus(),200)}
bt.onclick=()=>tg(!pn.classList.contains('op'));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pn.classList.contains('op')){tg(false);bt.focus()}});document.addEventListener('pointerdown',e=>{if(!pn.contains(e.target)&&!bt.contains(e.target))tg(false)});
</script></body></html>
