<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fuzzy Action Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 360px at 50% 0%,#33307A,transparent 70%),#0D0E1A;color:#ECEEFB;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.pl{position:relative;width:100%;max-width:560px;background:rgba(24,26,46,.92);backdrop-filter:blur(24px);border:1px solid #2C3058;border-radius:20px;box-shadow:0 50px 90px -30px #000,0 0 0 1px rgba(255,255,255,.03) inset;overflow:hidden}
.in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #262A4D}.in svg{color:#7A83BB;flex:none}.in input{flex:1;border:0;background:none;outline:0;color:#fff;font:500 16.5px 'Inter'}.in input::placeholder{color:#5F688F}.in kbd{font:500 11.5px 'Geist Mono',monospace;color:#8791C8;background:#1F2242;border-radius:6px;padding:3px 7px}
.ls{position:relative;max-height:340px;overflow-y:auto;padding:8px;scrollbar-width:thin}
.sl{position:absolute;left:8px;right:8px;height:44px;border-radius:12px;background:linear-gradient(90deg,rgba(99,102,241,.3),rgba(139,92,246,.18));box-shadow:inset 2px 0 0 #818CF8;transition:transform .22s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.gh{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6A7399;padding:10px 12px 5px;position:relative}
.it{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;cursor:pointer;font-size:14.5px;font-weight:500;color:#C5CAEA}.it.on{color:#fff}.it svg{flex:none;color:#7A83BB}.it.on svg{color:#A5B4FC}.it .nm mark{background:none;color:#A5B4FC;font-weight:700}.it kbd{margin-left:auto;display:flex;gap:4px}.it kbd i{font:500 11px 'Geist Mono',monospace;font-style:normal;background:#202448;border-radius:5px;padding:2px 6px;color:#8791C8}
.ai{display:none;padding:22px 18px;font-size:14.5px;color:#9CA4D2;line-height:1.55}.ai.on{display:block}.ai b{color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:8px}.ai b i{width:7px;height:7px;border-radius:50%;background:#A78BFA;box-shadow:0 0 10px #A78BFA;animation:bl 1s infinite}@keyframes bl{50%{opacity:.3}}.ai span.cr{display:inline-block;width:2px;height:15px;background:#A78BFA;vertical-align:-3px;animation:bl .8s infinite}
.ft{display:flex;gap:16px;padding:10px 18px;border-top:1px solid #262A4D;font-size:12px;color:#6A7399}.ft span{display:flex;align-items:center;gap:6px}.ft kbd{font:500 11px 'Geist Mono',monospace;background:#1F2242;border-radius:5px;padding:1px 6px;color:#8791C8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="pl" role="dialog" aria-label="Command palette"><div class="in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" placeholder="Type a command or search" aria-label="Command" autocomplete="off"><kbd>Esc</kbd></div>
<div class="ls" id="ls"><div class="sl" id="sl"></div></div><div class="ai" id="ai"></div>
<div class="ft"><span><kbd>Up</kbd><kbd>Down</kbd> navigate</span><span><kbd>Enter</kbd> run</span><span style="margin-left:auto">Ask AI when nothing matches</span></div></div>
<script>
const I={d:'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5',u:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',s:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.200l2-1.500-2-3.400-2.300 1a7 7 0 0 0-2-1.200L14 3h-4l-.4 2.700a7 7 0 0 0-2 1.200l-2.300-1-2 3.400 2 1.500A7 7 0 0 0 5 12c0 .4 0 .8.100 1.200l-2 1.500 2 3.400 2.300-1a7 7 0 0 0 2 1.200L10 21h4l.4-2.700a7 7 0 0 0 2-1.200l2.300 1 2-3.400-2-1.500c.1-.4.100-.8.100-1.200z',p:'M12 5v14M5 12h14',m:'M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z',k:'M21 2l-2 2m-7.600 7.600a5.500 5.500 0 1 1-7.800 7.800 5.500 5.500 0 0 1 7.800-7.800zm0 0L15.500 7.500m0 0 3 3L22 7l-3-3m-3.500 3.500L19 4',l:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9'};
const C=[['Pages',[['New document','d','N D'],['Go to Dashboard','d','G D'],['Open recent files','d','']]],['Team',[['Invite teammate','u','I'],['Manage members','u',''],['Create new project','p','N P']]],['Settings',[['Switch to dark theme','m','T D'],['API keys','k',''],['Account settings','s',','],['Sign out','l','']]]];
const ls=document.getElementById('ls'),sl=document.getElementById('sl'),q=document.getElementById('q'),ai=document.getElementById('ai');let rows=[],cur=0;
function fz(s,t){let j=0,ix=[];s=s.toLowerCase();for(let i=0;i<t.length&&j<s.length;i++){if(t[i].toLowerCase()===s[j]){ix.push(i);j++}}return j===s.length?ix:null}
function hl(t,ix){if(!ix)return t;const set=new Set(ix);return [...t].map((c,i)=>set.has(i)?'<mark>'+c+'</mark>':c).join('')}
function render(){const v=q.value.trim();ls.querySelectorAll('.gh,.it').forEach(e=>e.remove());rows=[];let n=0;C.forEach(g=>{const m=g[1].map(i=>({i,ix:v?fz(v,i[0]):[]})).filter(x=>x.ix);if(!m.length)return;const h=document.createElement('div');h.className='gh';h.textContent=g[0];ls.appendChild(h);m.forEach(x=>{const e=document.createElement('div');e.className='it';e.setAttribute('role','option');e.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+I[x.i[1]]+'"/></svg><span class="nm">'+hl(x.i[0],x.ix)+'</span>'+(x.i[2]?'<kbd>'+x.i[2].split(' ').map(k=>'<i>'+k+'</i>').join('')+'</kbd>':'');const k=n++;e.onmouseenter=()=>{cur=k;mv()};ls.appendChild(e);rows.push(e)})});
 cur=Math.min(cur,Math.max(0,rows.length-1));const none=!rows.length;ls.style.display=none?'none':'block';ai.classList.toggle('on',none);if(none)stream(v);else mv()}
function mv(){rows.forEach((e,i)=>e.classList.toggle('on',i===cur));const e=rows[cur];if(!e)return;const top=e.offsetTop;sl.style.transform='translateY('+top+'px)';e.scrollIntoView({block:'nearest'})}
let ti;function stream(v){clearInterval(ti);const t='No command matches "'+v+'". Here is what I can do: search your docs, create a page called "'+v+'", or open settings.';ai.innerHTML='<b><i></i>Ask AI</b><span id="tx"></span><span class="cr"></span>';let k=0;ti=setInterval(()=>{k+=2;document.getElementById('tx').textContent=t.slice(0,k);if(k>=t.length)clearInterval(ti)},22)}
q.addEventListener('input',render);q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cur=(cur+1)%rows.length;mv()}if(e.key==='ArrowUp'){e.preventDefault();cur=(cur+rows.length-1)%rows.length;mv()}});
render();cur=2;mv();(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{sl.style.transition='none';mv();requestAnimationFrame(()=>sl.style.transition='')});
</script></body></html>
