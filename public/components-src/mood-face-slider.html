<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mood Face Slider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg,#FFF4D6);transition:background .5s;color:#2B2008;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:520px;background:#fff;border:3px solid #2B2008;border-radius:34px;padding:34px 30px 28px;box-shadow:8px 8px 0 #2B2008;text-align:center}
.c small{font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8B7A45}.c h1{font:800 clamp(24px,5vw,30px)/1.1 'Bricolage Grotesque';letter-spacing:-.04em;margin:8px 0 22px}
.fc{position:relative;width:160px;height:160px;margin:0 auto 14px;border-radius:50%;background:var(--f);border:3px solid #2B2008;transition:background .4s,transform .3s cubic-bezier(.3,1.6,.5,1);box-shadow:inset -10px -12px 0 rgba(0,0,0,.1)}
.fc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.fc svg *{transition:all .3s cubic-bezier(.3,1.4,.5,1)}
.fc.bump{transform:scale(1.06)}
.lb{font:800 28px 'Bricolage Grotesque';letter-spacing:-.04em;height:36px;margin-bottom:22px}
.sl{position:relative;height:44px;margin:0 8px}.sl .tr{position:absolute;left:0;right:0;top:16px;height:12px;border-radius:12px;background:linear-gradient(90deg,#F87171,#FBBF24 50%,#4ADE80);border:2.5px solid #2B2008}
.sl input{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:none;margin:0;cursor:pointer}.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #2B2008;box-shadow:3px 3px 0 #2B2008;transition:transform .15s}.sl input:active::-webkit-slider-thumb{transform:scale(1.15)}.sl input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #2B2008}.sl input:focus-visible::-webkit-slider-thumb{outline:3px solid #FF5A1F;outline-offset:3px}
.tk{display:flex;justify-content:space-between;margin:2px 4px 0;font-size:12px;font-weight:700;color:#8B7A45}
.cm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.cm button{border:2.5px solid #2B2008;background:#fff;border-radius:99px;padding:8px 6px;font:700 13px 'DM Sans';cursor:pointer;color:#2B2008;transition:all .15s}.cm button[aria-pressed=true]{background:#2B2008;color:#fff;box-shadow:none}.cm button:focus-visible{outline:3px solid #FF5A1F;outline-offset:2px}
.go{width:100%;border:3px solid #2B2008;background:#FF5A1F;color:#fff;border-radius:18px;padding:14px;font:800 16px 'Bricolage Grotesque';cursor:pointer;box-shadow:4px 4px 0 #2B2008;transition:transform .12s,box-shadow .12s}.go:active{transform:translate(4px,4px);box-shadow:none}.go:focus-visible{outline:3px solid #2B2008;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c" id="c"><small>Daily check-in</small><h1>How are you feeling today?</h1>
<div class="fc" id="fc"><svg viewBox="0 0 160 160" fill="none" stroke="#2B2008" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path id="b1" d="M44 52l22 4"/><path id="b2" d="M116 52l-22 4"/><ellipse id="e1" cx="56" cy="72" rx="7" ry="9" fill="#2B2008" stroke="none"/><ellipse id="e2" cx="104" cy="72" rx="7" ry="9" fill="#2B2008" stroke="none"/><path id="mo" d="M50 108q30 0 60 0"/><path id="ch1" d="" stroke="none" fill="#F472B6" opacity="0"/></svg></div>
<div class="lb" id="lb">Okay</div>
<div class="sl"><div class="tr"></div><input type="range" id="r" min="0" max="4" step="1" value="2" aria-label="Mood" aria-valuetext="Okay"></div><div class="tk"><span>Awful</span><span>Bad</span><span>Okay</span><span>Good</span><span>Great</span></div>
<div class="cm" id="cm" role="group" aria-label="Contributing factors"></div><button class="go" id="go">Save check-in</button></div>
<script>
const M=[{n:'Awful',bg:'#FFD9D6',f:'#F87171',b1:'M42 44l24 12',b2:'M118 44l-24 12',e:[8,10],m:'M48 118q32-26 64 0'},{n:'Bad',bg:'#FFE6D1',f:'#FB923C',b1:'M44 50l22 6',b2:'M116 50l-22 6',e:[7,9],m:'M50 114q30-14 60 0'},{n:'Okay',bg:'#FFF4D6',f:'#FBBF24',b1:'M44 54l22 0',b2:'M116 54l-22 0',e:[7,9],m:'M52 110q28 0 56 0'},{n:'Good',bg:'#E8F7D8',f:'#A3E635',b1:'M44 52l22-3',b2:'M116 52l-22-3',e:[7,8],m:'M50 104q30 18 60 0'},{n:'Great',bg:'#D6F5E3',f:'#4ADE80',b1:'M44 48l22-6',b2:'M116 48l-22-6',e:[8,6],m:'M44 100q36 30 72 0'}];
const r=document.getElementById('r'),c=document.getElementById('c'),fc=document.getElementById('fc');
function set(){const m=M[+r.value];document.body.style.setProperty('--bg',m.bg);fc.style.setProperty('--f',m.f);document.getElementById('b1').setAttribute('d',m.b1);document.getElementById('b2').setAttribute('d',m.b2);['e1','e2'].forEach(i=>{document.getElementById(i).setAttribute('rx',m.e[0]);document.getElementById(i).setAttribute('ry',m.e[1])});document.getElementById('mo').setAttribute('d',m.m);document.getElementById('lb').textContent=m.n;r.setAttribute('aria-valuetext',m.n);fc.classList.remove('bump');void fc.offsetWidth;fc.classList.add('bump');setTimeout(()=>fc.classList.remove('bump'),200)}
r.addEventListener('input',set);set();
document.getElementById('cm').innerHTML=['Sleep','Work','Family','Health'].map((t,i)=>'<button aria-pressed="'+(i===1)+'">'+t+'</button>').join('');document.querySelectorAll('#cm button').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));
document.getElementById('go').onclick=e=>{e.target.textContent='Saved. Take care of you.'};
r.value=3;set();
</script></body></html>
