<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Month Agenda Sync Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D0F14;color:#EEF0F7;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:700px;background:#151821;border-radius:28px;padding:22px;box-shadow:0 44px 64px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08);display:grid;grid-template-columns:1.1fr 1fr;gap:22px}
.mo h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}.mo h1 span{color:#8A92AE;font-weight:600}
.wk,.gd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.wk span{font:500 11px 'DM Mono';color:#6F7894;text-align:center;padding-bottom:8px}
.gd{position:relative}.pk{position:absolute;width:calc((100% - 12px)/7);height:var(--h,40px);border-radius:12px;background:linear-gradient(135deg,#7C5CFF,#E86BFF);box-shadow:0 8px 18px -6px rgba(124,92,255,.8);transition:transform .5s cubic-bezier(.3,1.3,.4,1);left:0;top:0}
.d{position:relative;z-index:1;height:40px;border:0;background:none;color:#D7DBEA;font:600 14.500px 'Bricolage Grotesque';cursor:pointer;display:grid;place-items:center;border-radius:12px;transition:color .3s}.d.m{color:#566080}.d.on{color:#fff}.d:hover:not(.on){background:rgba(255,255,255,.05)}.d:focus-visible{outline:2px solid #E86BFF}
.d i{position:absolute;bottom:5px;display:flex;gap:3px}.d i b{width:4px;height:4px;border-radius:50%;background:var(--c)}.d.on i b{background:#fff}
.d.td::after{content:"";position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:#34D399}
.ag{display:flex;flex-direction:column}.ag small{font:500 11.500px 'DM Mono';letter-spacing:.14em;color:#8A92AE;text-transform:uppercase}.ag h2{font-size:26px;font-weight:800;letter-spacing:-.04em;margin:4px 0 14px}
.ls{position:relative;flex:1;min-height:250px}.it{position:absolute;left:0;right:0;display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 14px;border-radius:14px;background:#1C202B;opacity:0;transform:translateY(16px);transition:opacity .4s,transform .5s cubic-bezier(.3,1.3,.4,1)}.it.in{opacity:1;transform:none}.it.out{opacity:0;transform:translateY(-16px)}
.it u{border-radius:2px;background:var(--c)}.it b{display:block;font-size:15px;font-weight:700}.it span{font:500 12px 'DM Mono';color:#8A92AE}
.em{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#6F7894;font-size:14px;opacity:0;transition:opacity .3s}.em.on{opacity:1}
@media(max-width:620px){.cd{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="cd"><div class="mo"><h1>November <span>2026</span></h1><div class="wk"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div><div class="gd" id="gd"><i class="pk" id="pk"></i></div></div>
<div class="ag"><small id="dw">Thursday</small><h2 id="dn">19 Nov</h2><div class="ls" id="ls"><div class="em" id="em">Nothing planned.<br>Enjoy the free day.</div></div></div></div>
<script>
const EV={3:[['Sprint planning','10:00','#7C5CFF'],['Design crit','14:00','#E86BFF']],5:[['Dentist','09:30','#34D399']],10:[['Investor update','11:00','#F59E0B'],['Team lunch','12:30','#34D399'],['Ship v4.9','17:00','#7C5CFF']],12:[['Offsite travel','All day','#38BDF8']],17:[['Workshop','13:00','#E86BFF'],['1:1 Mina','16:00','#7C5CFF']],19:[['Design review','10:00','#7C5CFF'],['Customer call','15:00','#E86BFF'],['Dinner with Sam','19:30','#34D399']],24:[['Release freeze','All day','#F59E0B']],26:[['Retro','11:00','#7C5CFF'],['Pottery class','18:30','#38BDF8']]};
const gd=document.getElementById('gd'),pk=document.getElementById('pk'),ls=document.getElementById('ls'),em=document.getElementById('em'),sl=ms=>new Promise(r=>setTimeout(r,ms));const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],cells={};let off=false,cur=19;
for(let i=0;i<35;i++){const d=i-0+1;const b=document.createElement('button');const day=d>30?d-30:d;b.className='d'+(d>30?' m':'')+(d===14?' td':'');b.innerHTML=day+(EV[d]?'<i>'+EV[d].map(e=>'<b style="--c:'+e[2]+'"></b>').join('')+'</i>':'');if(d<=30)b.onclick=()=>{off=true;sel(d)};gd.appendChild(b);cells[d]=b}
function sel(d,instant){cells[cur]&&cells[cur].classList.remove('on');cur=d;const c=cells[d];c.classList.add('on');const gr=gd.getBoundingClientRect(),cr=c.getBoundingClientRect();pk.style.setProperty('--h',cr.height+'px');if(instant)pk.style.transition='none';pk.style.transform='translate('+(cr.left-gr.left)+'px,'+(cr.top-gr.top)+'px)';if(instant){void pk.offsetWidth;pk.style.transition=''}
 document.getElementById('dw').textContent=WD[(d-1)%7];document.getElementById('dn').textContent=d+' Nov';[...ls.querySelectorAll('.it')].forEach(e=>{e.classList.remove('in');e.classList.add('out');setTimeout(()=>e.remove(),420)});const list=EV[d]||[];em.classList.toggle('on',!list.length);list.forEach((e,i)=>{const n=document.createElement('div');n.className='it';n.style.top=(i*74)+'px';n.style.setProperty('--c',e[2]);n.innerHTML='<u></u><div><b>'+e[0]+'</b><span>'+e[1]+'</span></div>';ls.appendChild(n);if(instant){n.style.transition='none';n.classList.add('in');requestAnimationFrame(()=>requestAnimationFrame(()=>n.style.transition=''))}else setTimeout(()=>n.classList.add('in'),120+i*110)})}
sel(19,true);addEventListener('resize',()=>sel(cur,true));document.fonts.ready.then(()=>sel(cur,true));
document.querySelector('.cd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a month calendar and the agenda beside it stay in sync; after 3.4s a gradient selection tile glides with a spring from date to date, the day name and number change and the previous day's events lift away while the new day's events slide up one after another, and quiet days show an empty message, until you click a date. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);const seq=[24,10,5,17,12,26,3,19];let k=0;while(!off){sel(seq[k++%seq.length]);await sl(2600)}})()}
</script></body></html>
