<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Holographic Team Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 340px at 50% 0,#241A55,transparent 70%),#08060F;color:#F1EEFF;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:820px}
.hd{text-align:center;margin-bottom:30px}.hd small{font:400 12px 'Fragment Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9A8CFF}.hd h1{font-size:clamp(26px,4.6vw,38px);letter-spacing:-.045em;font-weight:800;margin-top:8px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;perspective:1000px}
.cd{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--o:0;position:relative;aspect-ratio:3/4;border-radius:22px;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .2s ease-out;background:#14102A;cursor:pointer}
.cd.rs{transition:transform .6s cubic-bezier(.2,.9,.2,1)}
.fc{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--g);box-shadow:0 30px 50px -24px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12)}
.fc::before{content:"";position:absolute;left:50%;top:26%;width:42%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:rgba(255,255,255,.9)}
.fc::after{content:"";position:absolute;left:12%;right:12%;top:52%;bottom:-8%;border-radius:80px 80px 0 0;background:rgba(255,255,255,.9)}
.hl{position:absolute;inset:0;border-radius:22px;background:conic-gradient(from calc(var(--ry) * 12) at var(--mx) var(--my),#ff7ad9,#7af0ff,#fff27a,#7aff9a,#c27aff,#ff7ad9);mix-blend-mode:color-dodge;opacity:calc(var(--o) * .55);filter:saturate(1.4) brightness(.9);pointer-events:none;-webkit-mask:radial-gradient(circle at var(--mx) var(--my),#000 0,transparent 75%);mask:radial-gradient(circle at var(--mx) var(--my),#000 0,transparent 75%);transition:opacity .25s}
.gl{position:absolute;inset:0;border-radius:22px;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 45%);mix-blend-mode:overlay;opacity:var(--o);pointer-events:none;transition:opacity .25s}
.in{position:absolute;left:0;right:0;bottom:0;padding:16px;transform:translateZ(46px);background:linear-gradient(transparent,rgba(8,6,15,.82) 38%);border-radius:0 0 22px 22px}
.in b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.02em}.in span{font:400 12px 'Fragment Mono',monospace;color:#C9C1FF}
.tg{position:absolute;right:12px;top:12px;transform:translateZ(36px);font:400 11px 'Fragment Mono',monospace;background:rgba(8,6,15,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);padding:4px 9px;border-radius:99px}
@media(max-width:620px){.g{grid-template-columns:1fr 1fr}.cd:last-child{grid-column:1/-1;max-width:50%;margin:0 auto;width:100%}}
@media(prefers-reduced-motion:reduce){.cd{transition:none}}
</style></head><body>
<div class="w"><div class="hd"><small>The crew</small><h1>Small team. Big shine.</h1></div><div class="g" id="g"></div></div>
<script>
const T=[['Ines Duarte','Founder / Design','#01','linear-gradient(160deg,#FF9A6B,#E8402A 60%,#6B1A3A)'],['Priya Raman','Engineering Lead','#02','linear-gradient(160deg,#7BD3FF,#3D5CF0 60%,#1F1B6B)'],['Tomas Berg','Brand and Motion','#03','linear-gradient(160deg,#C79BFF,#8B3DE0 60%,#3A1A6B)']];
const g=document.getElementById('g');g.innerHTML=T.map(t=>'<article class="cd" style="--g:'+t[3]+'" tabindex="0" aria-label="'+t[0]+', '+t[1]+'"><div class="fc"></div><div class="hl"></div><div class="gl"></div><span class="tg">'+t[2]+'</span><div class="in"><b>'+t[0]+'</b><span>'+t[1]+'</span></div></article>').join('');
const C=[...g.children];
function tilt(c,x,y){const r=c.getBoundingClientRect(),px=(x-r.left)/r.width,py=(y-r.top)/r.height;c.classList.remove('rs');c.style.setProperty('--ry',((px-.5)*24)+'deg');c.style.setProperty('--rx',((.5-py)*24)+'deg');c.style.setProperty('--mx',(px*100)+'%');c.style.setProperty('--my',(py*100)+'%');c.style.setProperty('--o',1)}
function rst(c){c.classList.add('rs');c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg');c.style.setProperty('--o',0)}
C.forEach(c=>{c.addEventListener('pointermove',e=>tilt(c,e.clientX,e.clientY));c.addEventListener('pointerleave',()=>rst(c));c.addEventListener('focus',()=>{const r=c.getBoundingClientRect();tilt(c,r.left+r.width*.7,r.top+r.height*.3)});c.addEventListener('blur',()=>rst(c))});
setTimeout(()=>{const r=C[1].getBoundingClientRect();tilt(C[1],r.left+r.width*.72,r.top+r.height*.28)},60);
</script></body></html>
