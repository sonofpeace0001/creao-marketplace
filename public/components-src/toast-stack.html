<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stacked Toasts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 340px at 50% 0,#2B1A55,transparent 70%),#0C0A16;color:#EFEBFF;font-family:'Lexend',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:400px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.hd{text-align:center}.hd h1{font-size:20px;font-weight:600;letter-spacing:-.03em}.hd p{font-size:13.5px;color:#8D84B5;margin-top:6px}
.bt{display:flex;gap:8px;margin-top:16px;justify-content:center}.bt button{border:1px solid #34295F;background:#16102B;color:#EFEBFF;border-radius:12px;padding:9px 14px;font:500 13px 'Lexend';cursor:pointer;transition:all .15s}.bt button:hover{background:#21183F}.bt button:focus-visible{outline:2px solid #A78BFA;outline-offset:2px}
.sk{position:relative;width:100%;height:220px;margin-top:20px}
.sk:hover .t{transition-delay:0s}
.t{text-align:left;position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;background:rgba(32,24,64,.92);backdrop-filter:blur(12px);border:1px solid #3B2F6E;border-radius:16px;padding:13px 14px;box-shadow:0 14px 28px -12px #000;transition:transform .4s cubic-bezier(.3,1.2,.4,1),opacity .3s,scale .4s;transform-origin:bottom center}
.t.new{animation:in .45s cubic-bezier(.3,1.3,.4,1)}@keyframes in{from{transform:translateY(40px) scale(.9);opacity:0}}
.t i{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}.t div{flex:1;min-width:0}.t b{display:block;font-size:13.5px;font-weight:500}.t span{display:block;font-size:12.5px;color:#9A91C4;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t time{font-size:11.5px;color:#7468A6}
.t button{border:0;width:24px;height:24px;border-radius:7px;background:none;color:#8D84B5;cursor:pointer;display:none;place-items:center}.t:last-child button,.sk:hover .t button{display:grid}.t button:hover{background:#2D2356;color:#fff}.t button:focus-visible{outline:2px solid #A78BFA}
.c1 i{background:#143B2B;color:#4ADE80}.c2 i{background:#2B2A55;color:#A5B4FC}.c3 i{background:#46301A;color:#FBBF24}.c4 i{background:#47202B;color:#FB7185}
.cl{margin-top:12px;border:0;background:none;color:#8D84B5;font:500 12.5px 'Lexend';cursor:pointer;display:none}.cl.on{display:inline-block}.cl:hover{color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Toast stack</h1><p>Add several toasts — they stack, peek and fan out on hover.</p><div class="bt"><button data-k="1">Deploy</button><button data-k="2">Comment</button><button data-k="3">Warning</button><button data-k="4">Failure</button></div></div>
<div style="width:100%;text-align:center"><div class="sk" id="sk" role="region" aria-live="polite" aria-label="Notifications"></div><button class="cl" id="cl">Clear all</button></div></div>
<script>
const M={1:['M5 12.500l4.500 4.500L19 7','Deploy succeeded','web-app · production · 38s'],2:['M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z','New comment from Ana','"Can we ship this before Friday?"'],3:['M12 9v4M12 17h.01M10.300 3.900 1.800 18a2 2 0 0 0 1.700 3h17a2 2 0 0 0 1.700-3L13.700 3.900a2 2 0 0 0-3.400 0Z','Usage at 85%','You have used 8.5 GB of 10 GB storage'],4:['M6 6l12 12M18 6 6 18','Build failed','api-service · 3 type errors in auth.ts']};
const sk=document.getElementById('sk'),cl=document.getElementById('cl');let L=[],uid=0;
function lay(h){const n=L.length;L.forEach((t,i)=>{const d=n-1-i,hov=h;t.el.style.transform=hov?'translateY(-'+d*66+'px)':'translateY(-'+Math.min(d,3)*12+'px) scale('+(1-Math.min(d,3)*.05)+')';t.el.style.opacity=d>3&&!hov?0:1;t.el.style.zIndex=i;t.el.style.pointerEvents=(d>3&&!hov)?'none':'auto'});cl.classList.toggle('on',n>1)}
function add(k){const d=M[k],e=document.createElement('div');e.className='t new c'+k;e.innerHTML='<i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="'+d[0]+'"/></svg></i><div><b>'+d[1]+'</b><span>'+d[2]+'</span></div><time>now</time><button aria-label="Dismiss"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
 const o={id:++uid,el:e};e.querySelector('button').onclick=()=>{e.style.opacity=0;e.style.transform+=' translateX(30px)';setTimeout(()=>{e.remove();L=L.filter(x=>x!==o);lay(sk.matches(':hover'))},250)};L.push(o);if(L.length>6){L.shift().el.remove()}sk.appendChild(e);lay(sk.matches(':hover'))}
sk.onmouseenter=()=>lay(true);sk.onmouseleave=()=>lay(false);sk.addEventListener('focusin',()=>lay(true));sk.addEventListener('focusout',()=>lay(false));
cl.onclick=()=>{L.forEach(x=>x.el.remove());L=[];lay(false)};document.querySelectorAll('.bt button').forEach(b=>b.onclick=()=>add(b.dataset.k));
add(2);add(1);add(3);
</script></body></html>
