<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Split Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07080C;color:#EEF0F8;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:820px;min-height:500px;background:#0E1017;border:1px solid #1D2130;border-radius:30px;overflow:hidden;box-shadow:0 50px 90px -40px #000}
.vs{position:relative;padding:34px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 90% at 0 0,#FF8A5B,transparent 55%),radial-gradient(100% 90% at 100% 100%,#7C3AED,transparent 55%),#2B1B4A;overflow:hidden}
.vs::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.2px);background-size:22px 22px;mask-image:linear-gradient(135deg,#000,transparent 70%)}
.vs>*{position:relative}.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.04em}.lg i{width:26px;height:26px;border-radius:9px;background:#fff;display:block}
.qt{min-height:150px}.qt p{font:italic 500 25px/1.3 'Playfair Display',serif;letter-spacing:-.01em;transition:opacity .4s}.qt .by{display:flex;align-items:center;gap:12px;margin-top:18px;transition:opacity .4s}
.qt .by i{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font:700 13px 'Outfit';font-style:normal}.qt .by b{display:block;font-size:14.5px}.qt .by span{font-size:13px;opacity:.8}
.dt{display:flex;gap:7px}.dt button{width:26px;height:4px;border:0;border-radius:4px;background:rgba(255,255,255,.35);cursor:pointer;padding:0}.dt button.on{background:#fff}.dt button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.fm{padding:42px 38px;display:flex;flex-direction:column;justify-content:center}
.fm h1{font-size:28px;font-weight:700;letter-spacing:-.04em}.fm .s{font-size:14.5px;color:#8C93AE;margin:6px 0 24px}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;font-weight:600;color:#B6BCD4;margin-bottom:7px}
.f input{width:100%;background:#151824;border:1.5px solid #252A3D;border-radius:14px;padding:14px 15px;font:500 15px 'Outfit';color:#EEF0F8;outline:0;transition:all .2s}.f input:focus{border-color:#FF8A5B;box-shadow:0 0 0 4px rgba(255,138,91,.14)}
.rw{display:flex;justify-content:space-between;align-items:center;margin:2px 0 20px;font-size:13.5px;color:#8C93AE}.rw label{display:flex;gap:9px;align-items:center;cursor:pointer}.rw input{accent-color:#FF8A5B;width:16px;height:16px}.rw a{color:#FF9D78;text-decoration:none;font-weight:600}
.go{border:0;border-radius:14px;padding:15px;font:700 15.5px 'Outfit';background:linear-gradient(135deg,#FF8A5B,#F43F8E);color:#fff;cursor:pointer;box-shadow:0 16px 28px -14px rgba(244,63,142,.8);transition:transform .15s}.go:hover{transform:translateY(-1px)}.go:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ft{text-align:center;font-size:13.5px;color:#8C93AE;margin-top:20px}.ft a{color:#FF9D78;font-weight:600;text-decoration:none}
@media(max-width:700px){.c{grid-template-columns:1fr}.vs{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><aside class="vs"><div class="lg"><i></i>Lumen</div><div class="qt" id="q" aria-live="polite"></div><div class="dt" id="d"></div></aside>
 <form class="fm" id="f" novalidate><h1>Sign in</h1><p class="s">Welcome back — your workspace is waiting.</p>
 <div class="f"><label for="e">Email</label><input id="e" type="email" value="maya@northwind.co" autocomplete="off"></div>
 <div class="f"><label for="p">Password</label><input id="p" type="password" value="password123" autocomplete="off"></div>
 <div class="rw"><label><input type="checkbox" checked>Remember me</label><a href="#">Forgot password?</a></div>
 <button class="go" id="go">Sign in to Lumen</button><div class="ft">No account yet? <a href="#">Start free trial</a></div></form></div>
<script>
const Q=[['“We cut our reporting time from two days to ten minutes.”','Priya Raman','Head of Ops, Flux','PR'],['“Finally, one place where the whole team agrees on the plan.”','Marcus Reid','VP Product, Northwind','MR'],['“The calmest software we use — and the most powerful.”','Elena Ortiz','Founder, Fjord Studio','EO']];
const q=document.getElementById('q'),d=document.getElementById('d');let i=0,tm;
d.innerHTML=Q.map((_,k)=>'<button aria-label="Quote '+(k+1)+'"></button>').join('');const bs=[...d.children];
function show(k){i=k;q.style.opacity=0;setTimeout(()=>{q.innerHTML='<p>'+Q[k][0]+'</p><div class="by"><i>'+Q[k][3]+'</i><div><b>'+Q[k][1]+'</b><span>'+Q[k][2]+'</span></div></div>';q.style.opacity=1},200);bs.forEach((b,j)=>b.classList.toggle('on',j===k));clearTimeout(tm);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)tm=setTimeout(()=>show((k+1)%Q.length),5000)}
bs.forEach((b,k)=>b.onclick=()=>show(k));q.innerHTML='<p>'+Q[0][0]+'</p><div class="by"><i>'+Q[0][3]+'</i><div><b>'+Q[0][1]+'</b><span>'+Q[0][2]+'</span></div></div>';bs[0].classList.add('on');tm=setTimeout(()=>show(1),5000);
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const g=document.getElementById('go');g.textContent='Signing in…';setTimeout(()=>g.textContent='Signed in',900)});
</script></body></html>
