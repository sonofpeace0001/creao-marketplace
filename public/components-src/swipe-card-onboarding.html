<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Swipe Card Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFE9DA;color:#2A1608;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{width:100%;max-width:400px;text-align:center}
.hd h1{font:800 28px 'Bricolage Grotesque';letter-spacing:-.045em}.hd p{color:#8A6446;margin:6px 0 18px;font-size:15px}
.pr{display:flex;gap:6px;justify-content:center;margin-bottom:20px}.pr i{width:34px;height:5px;border-radius:5px;background:#F2CDB2;overflow:hidden;position:relative}.pr i.on::after,.pr i.dn::after{content:"";position:absolute;inset:0;background:#FF5A1F;border-radius:5px}.pr i.on::after{animation:f .4s}@keyframes f{from{transform:scaleX(0);transform-origin:left}}
.dk{position:relative;height:340px;touch-action:none}
.cd{position:absolute;inset:0;border-radius:30px;background:var(--g);border:2.5px solid #2A1608;box-shadow:6px 6px 0 #2A1608;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:#fff;cursor:grab;transition:transform .45s cubic-bezier(.3,1.2,.4,1),opacity .3s;user-select:none;will-change:transform}
.cd.dg{transition:none;cursor:grabbing}
.cd::before{content:"";position:absolute;inset:0;border-radius:28px;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.4),transparent 50%),linear-gradient(transparent 40%,rgba(0,0,0,.4))}
.cd .ic{position:absolute;left:24px;top:24px;width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.28);display:grid;place-items:center;backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.5)}
.cd h2,.cd p{position:relative}.cd h2{font:800 28px/1.05 'Bricolage Grotesque';letter-spacing:-.04em;margin-bottom:8px}.cd p{font-size:15.5px;line-height:1.5;opacity:.95}
.cd .bd{position:absolute;top:28px;font:800 20px 'Bricolage Grotesque';letter-spacing:.06em;padding:6px 14px;border-radius:12px;border:3px solid;opacity:0;transform:rotate(var(--r))}.cd .y{right:24px;color:#B6FFCE;border-color:#B6FFCE;--r:10deg}.cd .n{right:24px;color:#FFC2C2;border-color:#FFC2C2;--r:-10deg}
.ac{display:flex;justify-content:center;gap:18px;margin-top:30px}.ac button{width:64px;height:64px;border-radius:50%;border:2.5px solid #2A1608;background:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 #2A1608;transition:transform .12s,box-shadow .12s}.ac button:active{transform:translate(3px,3px);box-shadow:0 0 0 #2A1608}.ac button:focus-visible{outline:3px solid #FF5A1F;outline-offset:3px}.ac .n{color:#E11D48}.ac .y{color:#16A34A;background:#FFD84D}
.dn{display:none;border:2.5px solid #2A1608;background:#fff;border-radius:30px;box-shadow:6px 6px 0 #2A1608;padding:40px 24px;height:340px;place-content:center}.dn.on{display:grid}.dn h2{font:800 28px 'Bricolage Grotesque';letter-spacing:-.04em}.dn p{color:#8A6446;margin:8px 0 16px}.dn button{border:2.5px solid #2A1608;background:#FF5A1F;color:#fff;border-radius:14px;padding:12px 22px;font:800 15px 'Bricolage Grotesque';cursor:pointer;box-shadow:3px 3px 0 #2A1608}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Tune your feed</h1><p id="sb">Swipe right to follow a topic, left to skip.</p></div><div class="pr" id="pr"></div>
<div class="dk" id="dk"></div><div class="dn" id="dn"><h2>You are all set</h2><p id="sm"></p><button id="rs">Start over</button></div>
<div class="ac" id="ac"><button class="n" id="no" aria-label="Skip topic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="y" id="yes" aria-label="Follow topic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></button></div></div>
<script>
const T=[['Design systems','Tokens, components and the craft behind consistent products.','linear-gradient(145deg,#A78BFA,#6D28D9)','M12 3l8 4.500v9L12 21l-8-4.500v-9zM12 12l8-4.500M12 12v9M12 12 4 7.500'],['Indie hacking','Shipping small products and building in public.','linear-gradient(145deg,#FB923C,#EA580C)','M13 2 4 14h7l-1 8 9-12h-7z'],['AI tooling','Practical ways to put language models to work.','linear-gradient(145deg,#22D3EE,#0E7490)','M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z'],['Typography','Typefaces, hierarchy and the art of reading well.','linear-gradient(145deg,#F472B6,#BE185D)','M5 6V4h14v2M12 4v16M9 20h6'],['Growth','Experiments, funnels and honest numbers.','linear-gradient(145deg,#4ADE80,#15803D)','M3 17l6-6 4 4 8-8M15 7h6v6']];
let i=0,fol=[];const dk=document.getElementById('dk'),pr=document.getElementById('pr');pr.innerHTML=T.map(()=>'<i></i>').join('');
function prog(){[...pr.children].forEach((p,k)=>{p.className=k<i?'dn':k===i?'on':''})}
function show(){dk.innerHTML='';if(i>=T.length){dk.style.display='none';document.getElementById('ac').style.display='none';const d=document.getElementById('dn');d.classList.add('on');document.getElementById('sm').textContent=fol.length?'You are following '+fol.join(', ')+'.':'Nothing followed yet. You can change this any time.';document.getElementById('sb').textContent='Your feed is ready.';prog();return}
 [2,1,0].forEach(o=>{const t=T[i+o];if(!t)return;const c=document.createElement('div');c.className='cd';c.style.cssText='--g:'+t[2]+';z-index:'+(10-o)+';transform:translateY('+o*14+'px) scale('+(1-o*.05)+')'+(o?';pointer-events:none':'');c.innerHTML='<span class="bd y">FOLLOW</span><span class="bd n">SKIP</span><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+t[3]+'"/></svg></div><h2>'+t[0]+'</h2><p>'+t[1]+'</p>';dk.appendChild(c);if(!o)bind(c)});prog()}
function out(c,dir){c.style.transition='transform .45s cubic-bezier(.4,0,.6,1),opacity .4s';c.style.transform='translate('+dir*420+'px,-40px) rotate('+dir*20+'deg)';c.style.opacity=0;if(dir>0)fol.push(T[i][0]);i++;setTimeout(show,300)}
function bind(c){let sx=0,dx=0,dg=false;c.addEventListener('pointerdown',e=>{dg=true;sx=e.clientX;c.classList.add('dg');c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!dg)return;dx=e.clientX-sx;c.style.transform='translate('+dx+'px,'+(-Math.abs(dx)*.06)+'px) rotate('+dx*.06+'deg)';c.querySelector('.y').style.opacity=Math.max(0,Math.min(1,dx/90));c.querySelector('.n').style.opacity=Math.max(0,Math.min(1,-dx/90))});
 const up=()=>{if(!dg)return;dg=false;c.classList.remove('dg');if(Math.abs(dx)>90)out(c,dx>0?1:-1);else{c.style.transform='';c.querySelector('.y').style.opacity=0;c.querySelector('.n').style.opacity=0}dx=0};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
document.getElementById('yes').onclick=()=>{const c=dk.querySelector('.cd');if(c)out(c,1)};document.getElementById('no').onclick=()=>{const c=dk.querySelector('.cd');if(c)out(c,-1)};
document.getElementById('rs').onclick=()=>{i=0;fol=[];dk.style.display='';document.getElementById('ac').style.display='';document.getElementById('dn').classList.remove('on');document.getElementById('sb').textContent='Swipe right to follow a topic, left to skip.';show()};
document.addEventListener('keydown',e=>{if(i>=T.length)return;if(e.key==='ArrowRight')document.getElementById('yes').click();if(e.key==='ArrowLeft')document.getElementById('no').click()});show();
</script></body></html>
