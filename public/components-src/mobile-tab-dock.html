<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mobile Tab Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#DDE6F4;color:#1B2440;font-family:'Nunito',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ph{position:relative;width:min(340px,100%);height:600px;background:#F6F8FD;border-radius:44px;border:9px solid #1B2440;overflow:hidden;box-shadow:0 50px 70px -34px rgba(27,36,64,.7)}
.ph::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:#1B2440;z-index:5}
.sc{position:absolute;inset:0;padding:56px 22px 110px;overflow:hidden}
.pn{display:none}.pn.on{display:block;animation:fi .4s ease}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.pn h1{font-size:28px;font-weight:800;letter-spacing:-.04em}.pn p{font-size:14px;color:#7A86A6;margin:4px 0 20px;font-weight:500}
.cd{border-radius:22px;padding:18px;margin-bottom:12px;color:#fff}.cd b{display:block;font-size:34px;font-weight:800;letter-spacing:-.04em}.cd span{font-size:13.5px;opacity:.9;font-weight:600}
.ls{background:#fff;border-radius:18px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 10px -6px rgba(27,36,64,.25)}.ls i{width:36px;height:36px;border-radius:11px}.ls b{font-size:14.5px;display:block}.ls small{font-size:12.5px;color:#7A86A6;font-weight:600}
.dk{position:absolute;left:14px;right:14px;bottom:14px;height:70px;background:#fff;border-radius:26px;box-shadow:0 18px 34px -12px rgba(27,36,64,.45);display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
.bb{position:absolute;top:-16px;left:6px;width:calc((100% - 12px)/4);display:grid;place-items:center;transition:transform .45s cubic-bezier(.4,1.4,.5,1);pointer-events:none}.bb i{width:54px;height:54px;border-radius:50%;background:var(--c,#5B6CFF);box-shadow:0 12px 20px -6px var(--c,#5B6CFF);border:5px solid #F6F8FD;transition:background .3s}
.dk button{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#98A2BE;font:700 11.5px 'Nunito';transition:all .35s cubic-bezier(.4,1.4,.5,1)}
.dk button svg{transition:transform .35s cubic-bezier(.4,1.4,.5,1)}.dk button[aria-selected=true]{color:#1B2440}.dk button[aria-selected=true] svg{transform:translateY(-22px);color:#fff}.dk button[aria-selected=true] span{transform:translateY(2px)}
.dk button:focus-visible{outline:2px solid #5B6CFF;outline-offset:-4px;border-radius:20px}
.bd{position:absolute;top:9px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:#FF4D6D;border:2px solid #fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="ph"><div class="sc" id="sc"></div>
<nav class="dk" role="tablist" aria-label="Main" id="dk"><span class="bb" id="bb"><i></i></span></nav></div>
<script>
const T=[['Home','#5B6CFF','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z','Good morning','3 things to finish today',[['#5B6CFF','Design review','10:30 · Room 4'],['#FF8A5B','Ship v2.4','Due 5:00 PM'],['#34C98E','Team lunch','12:45 · Rooftop']]],['Search','#FF8A5B','M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.500-4.500','Discover','Trending in your network',[['#FF8A5B','Maya Rowe','12 mutual friends'],['#B85CFF','Studio Orbit','Design agency'],['#34C98E','Fieldwork','Productivity app']]],['Inbox','#34C98E','M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z','Inbox','5 unread messages',[['#34C98E','Priya Raman','Can you review the deck?'],['#5B6CFF','Marcus Reid','Lunch tomorrow?'],['#FF8A5B','Billing','Your receipt is ready']]],['Profile','#B85CFF','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0','Profile','Ada Lovelace',[['#B85CFF','Edit profile','Name, photo, bio'],['#5B6CFF','Notifications','Push and email'],['#FF8A5B','Privacy','Who can see you']]]];
const sc=document.getElementById('sc'),dk=document.getElementById('dk'),bb=document.getElementById('bb');
sc.innerHTML=T.map((t,i)=>'<section class="pn" id="p'+i+'" role="tabpanel" aria-labelledby="b'+i+'"><h1>'+t[3]+'</h1><p>'+t[4]+'</p><div class="cd" style="background:'+t[1]+'"><b>'+(i===2?'5':i===0?'3':i===1?'24':'128')+'</b><span>'+(i===2?'new messages':i===0?'tasks left':i===1?'new this week':'followers')+'</span></div>'+t[5].map(l=>'<div class="ls"><i style="background:'+l[0]+'"></i><div><b>'+l[1]+'</b><small>'+l[2]+'</small></div></div>').join('')+'</section>').join('');
T.forEach((t,i)=>dk.insertAdjacentHTML('beforeend','<button role="tab" id="b'+i+'" aria-selected="false" aria-controls="p'+i+'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+t[2]+'"/></svg><span>'+t[0]+'</span>'+(i===2?'<i class="bd"></i>':'')+'</button>'));
const B=[...dk.querySelectorAll('button')],P=[...sc.children];
function go(i){B.forEach((b,k)=>{b.setAttribute('aria-selected',k===i);b.tabIndex=k===i?0:-1});P.forEach((p,k)=>p.classList.toggle('on',k===i));bb.style.transform='translateX('+i*100+'%)';bb.style.setProperty('--c',T[i][1])}
B.forEach((b,i)=>{b.onclick=()=>go(i);b.onkeydown=e=>{let n=null;if(e.key==='ArrowRight')n=(i+1)%4;if(e.key==='ArrowLeft')n=(i+3)%4;if(n!==null){e.preventDefault();go(n);B[n].focus()}}});go(0);
</script></body></html>
