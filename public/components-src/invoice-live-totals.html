<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Invoice Live Totals</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8E5DC;color:#1A1812;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:640px;background:#FFFEFA;border-radius:6px 6px 22px 22px;padding:34px 34px 28px;box-shadow:0 1px 0 #fff inset,0 40px 70px -40px rgba(60,50,20,.55),0 0 0 1px rgba(26,24,18,.08);position:relative}
.c::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:radial-gradient(circle at 8px 0,transparent 6px,#FFFEFA 6.500px) 0 0/16px 8px repeat-x}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.hd h1{font:italic 400 38px 'Instrument Serif',serif;letter-spacing:-.01em}.hd small{display:block;font:500 12px 'JetBrains Mono',monospace;color:#8E8672;letter-spacing:.1em;margin-top:4px}.hd .pd{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border:2px solid #C2410C;color:#C2410C;border-radius:8px;padding:6px 12px;transform:rotate(6deg)}
.th,.rw{display:grid;grid-template-columns:1fr 64px 92px 92px;gap:10px;align-items:center}.th{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9A917A;padding-bottom:8px;border-bottom:1.5px solid #1A1812}
.rw{padding:10px 0;border-bottom:1px solid #EFEBDD}.rw input{width:100%;border:1.5px solid transparent;background:none;border-radius:8px;padding:7px 8px;font:500 14.5px 'Inter';color:#1A1812;outline:0;margin-left:-8px;transition:all .15s}.rw input:hover{background:#F6F2E6}.rw input:focus{border-color:#C2410C;background:#fff}.rw .n{text-align:right;font-family:'JetBrains Mono',monospace;font-size:13.5px}.rw .tt{text-align:right;font:500 14px 'JetBrains Mono',monospace;color:#1A1812}
.rw .q,.rw .p{text-align:right;margin-left:0}.rw .q input,.rw .p input{text-align:right;font-family:'JetBrains Mono',monospace;font-size:13.5px;margin-left:0}
.rm{border:0;background:none;color:#B8AF97;cursor:pointer;padding:4px;border-radius:6px;display:none}
.ad{margin:10px 0 0;border:0;background:none;color:#C2410C;font:600 13.5px 'Inter';cursor:pointer;padding:6px 0}.ad:focus-visible{outline:2px solid #C2410C;border-radius:6px}
.bt{display:grid;grid-template-columns:1fr 250px;gap:24px;margin-top:22px;align-items:start}
.pm{display:flex;flex-direction:column;gap:10px}.pm label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9A917A}.cp{display:flex;gap:6px}.cp input{flex:1;min-width:0;border:1.5px dashed #CFC6AB;background:#FBF8EE;border-radius:10px;padding:10px 12px;font:500 13.5px 'JetBrains Mono',monospace;text-transform:uppercase;outline:0;color:#1A1812}.cp input:focus{border-color:#C2410C}.cp button{border:0;background:#1A1812;color:#fff;border-radius:10px;padding:0 14px;font:600 13px 'Inter';cursor:pointer}.cp button:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
.tx{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#5C5543;cursor:pointer}.tx input{accent-color:#C2410C;width:16px;height:16px}
.sm .r{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:#6B634E}.sm .r b{font:500 14px 'JetBrains Mono',monospace;color:#1A1812}.sm .r.dc b{color:#15803D}.sm .gt{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid #1A1812;margin-top:8px;padding-top:12px}.sm .gt>span{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.sm .gt .am{display:flex;font:500 34px 'Instrument Serif',serif;letter-spacing:-.01em;height:40px;overflow:hidden;align-items:flex-start}.dg{position:relative;width:.52em;height:40px;overflow:hidden}.dg div{position:absolute;left:0;right:0;transition:transform .6s cubic-bezier(.2,.9,.2,1)}.dg b{display:block;height:40px;line-height:40px;font-weight:400}.sp{width:auto;padding:0 .05em;line-height:40px;text-align:center}
.sm .r s{color:#B8AF97}
@media(max-width:560px){.bt{grid-template-columns:1fr}.th,.rw{grid-template-columns:1fr 50px 74px 76px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Invoice</h1><small>INV-2043 · DUE NOV 24</small></div><span class="pd">Draft</span></div>
<div class="th"><span>Description</span><span style="text-align:right">Qty</span><span style="text-align:right">Rate</span><span style="text-align:right">Amount</span></div><div id="rw"></div><button class="ad" id="ad">+ Add line item</button>
<div class="bt"><div class="pm"><label>Discount code</label><div class="cp"><input id="cd" placeholder="TRY SAVE10" aria-label="Discount code"><button id="ap">Apply</button></div><label class="tx"><input type="checkbox" id="tx" checked>Add 8% sales tax</label></div>
<div class="sm"><div class="r"><span>Subtotal</span><b id="sb"></b></div><div class="r dc" id="dr" style="display:none"><span>Discount (10%)</span><b id="ds"></b></div><div class="r"><span>Tax</span><b id="tv"></b></div><div class="gt"><span>Total</span><div class="am" id="am"></div></div></div></div></div>
<script>
let L=[['Brand identity system',1,3200],['Landing page design',2,1450],['Motion guidelines',1,680]],disc=false;const $=id=>document.getElementById(id);
const f=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function rows(){$('rw').innerHTML=L.map((l,i)=>'<div class="rw"><input data-i="'+i+'" data-k="0" value="'+l[0]+'" aria-label="Description"><div class="q"><input data-i="'+i+'" data-k="1" value="'+l[1]+'" inputmode="numeric" aria-label="Quantity"></div><div class="p"><input data-i="'+i+'" data-k="2" value="'+l[2]+'" inputmode="decimal" aria-label="Rate"></div><span class="tt n" id="t'+i+'">'+f(l[1]*l[2])+'</span></div>').join('');$('rw').querySelectorAll('input').forEach(e=>e.oninput=()=>{const i=+e.dataset.i,k=+e.dataset.k;L[i][k]=k?parseFloat(e.value)||0:e.value;$('t'+i).textContent=f(L[i][1]*L[i][2]);calc()})}
function odo(el,str){let ds=[...el.querySelectorAll('.dg')];const dg=str.replace(/[^0-9]/g,'');if(ds.length!==dg.length){el.innerHTML='';[...str].forEach(ch=>{if(/\d/.test(ch)){const d=document.createElement('div');d.className='dg';d.innerHTML='<div>'+[...'0123456789'].map(n=>'<b>'+n+'</b>').join('')+'</div>';el.appendChild(d)}else{const s=document.createElement('span');s.className='sp';s.textContent=ch;el.appendChild(s)}});ds=[...el.querySelectorAll('.dg')];ds.forEach(d=>d.firstChild.style.transition='none');requestAnimationFrame(()=>requestAnimationFrame(()=>ds.forEach(d=>d.firstChild.style.transition='')))}
 ds.forEach((d,i)=>d.firstChild.style.transform='translateY(-'+(+dg[i]*40)+'px)')}
function calc(){const s=L.reduce((a,l)=>a+l[1]*l[2],0),d=disc?s*.1:0,t=$('tx').checked?(s-d)*.08:0,g=s-d+t;$('sb').textContent=f(s);$('dr').style.display=disc?'flex':'none';$('ds').textContent='-'+f(d);$('tv').textContent=f(t);odo($('am'),f(g))}
rows();calc();$('tx').onchange=calc;$('ad').onclick=()=>{L.push(['New service',1,500]);rows();calc()};
$('ap').onclick=()=>{disc=$('cd').value.trim().toUpperCase()==='SAVE10';$('ap').textContent=disc?'Applied':'Apply';calc()};
</script></body></html>
