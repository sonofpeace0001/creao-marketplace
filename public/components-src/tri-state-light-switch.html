<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tri-State Light Switch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{--lt:0;background:#0B0D14;color:#EEF0F8;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{position:relative;width:100%;max-width:480px;border-radius:34px;overflow:hidden;padding:26px;display:grid;gap:18px;justify-items:center;background:color-mix(in srgb,#FFD27A calc(var(--lt)*18%),#12151F);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 40px 60px -36px rgba(0,0,0,.9);transition:background .8s}
.hd{display:flex;justify-content:space-between;align-items:center;width:100%}.hd b{font-size:20px;font-weight:800;letter-spacing:-.04em}.hd span{font:600 11.500px 'Geist Mono';letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,#FFD27A calc(var(--lt)*100%),#7C839B);transition:color .6s}
.bl{position:relative;width:160px;height:190px;display:grid;place-items:center}
.gl{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,122,.65),rgba(255,180,60,.2) 40%,transparent 68%);opacity:var(--lt);transition:opacity .8s}
.bl svg{position:relative;width:100%;height:100%;overflow:visible}
.gs{fill:color-mix(in srgb,#FFE9A8 calc(var(--lt)*100%),#2A2E3B);stroke:#4A5063;stroke-width:3;transition:fill .8s;filter:drop-shadow(0 0 calc(var(--lt)*16px) rgba(255,200,80,.9))}
.fi{fill:none;stroke:color-mix(in srgb,#FFB020 calc(var(--lt)*100%),#5A6176);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:stroke .8s}
.bs{fill:#4A5063}
.ry{opacity:var(--lt);transition:opacity .8s}.ry line{stroke:#FFD27A;stroke-width:4;stroke-linecap:round}
.on .ry{animation:rp 2s ease-in-out infinite}@keyframes rp{50%{opacity:.7}}
.auto .gl{animation:ab 2.600s ease-in-out infinite}@keyframes ab{50%{opacity:.18}}
.sen{position:absolute;right:-8px;top:0;width:44px;height:44px;border-radius:50%;background:#1B1F2C;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:grid;place-items:center;opacity:0;transform:scale(.5);transition:all .5s cubic-bezier(.3,1.6,.5,1)}.auto .sen{opacity:1;transform:none}
.sen svg{width:22px;height:22px;overflow:visible;animation:sn 4s linear infinite}@keyframes sn{to{transform:rotate(360deg)}}.sen svg *{fill:none;stroke:#FFD27A;stroke-width:2;stroke-linecap:round}
.sg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);width:100%;padding:6px;border-radius:99px;background:#0B0D14;box-shadow:inset 0 3px 8px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.07)}
.sg .th{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:99px;background:linear-gradient(160deg,#fff,#D6DBE8);box-shadow:0 8px 14px rgba(0,0,0,.45);transform:translateX(calc(var(--p)*100%));transition:transform .55s cubic-bezier(.3,1.5,.4,1)}
.sg button{position:relative;z-index:1;border:0;background:none;padding:14px 0;font:800 14.500px 'Manrope';color:#8B93AB;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;transition:color .3s}.sg button svg{width:17px;height:17px}.sg button svg *{fill:none;stroke:currentColor;stroke-width:2.100;stroke-linecap:round;stroke-linejoin:round}
.sg button[aria-checked=true]{color:#12151F}.sg button:focus-visible{outline:2px solid #FFD27A;outline-offset:-3px;border-radius:99px}
.rd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}.rd div{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}.rd small{display:block;font:600 10px 'Geist Mono';letter-spacing:.14em;color:#7C839B}.rd b{font:800 17px 'Manrope';letter-spacing:-.03em;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="cd" id="cd" style="--lt:1;--p:2"><div class="hd"><b>Living room</b><span id="md">On</span></div>
<div class="bl"><div class="gl"></div><div class="sen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.500"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600 7 7M17 17l1.400 1.400M18.400 5.600 17 7M7 17l-1.400 1.400"/></svg></div>
<svg viewBox="0 0 160 190"><g class="ry"><line x1="80" y1="6" x2="80" y2="-8"/><line x1="26" y1="30" x2="14" y2="20"/><line x1="134" y1="30" x2="146" y2="20"/><line x1="6" y1="82" x2="-8" y2="82"/><line x1="154" y1="82" x2="168" y2="82"/></g><path class="gs" d="M80 22c-32 0-52 24-52 52 0 20 10 34 22 46 5 5 8 12 8 20v8h44v-8c0-8 3-15 8-20 12-12 22-26 22-46 0-28-20-52-52-52Z"/><path class="fi" d="M66 128c0-14 10-22 14-38 4 16 14 24 14 38M60 128h40"/><rect class="bs" x="58" y="148" width="44" height="12" rx="4"/><rect class="bs" x="62" y="162" width="36" height="12" rx="4"/><rect class="bs" x="70" y="176" width="20" height="10" rx="4"/></svg></div>
<div class="sg" id="sg" role="radiogroup" aria-label="Light mode"><span class="th"></span><button role="radio" aria-checked="false"><svg viewBox="0 0 24 24"><path d="M12 2v8M6.300 6.300a8 8 0 1 0 11.400 0"/></svg>Off</button><button role="radio" aria-checked="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Auto</button><button role="radio" aria-checked="true"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.700V17h8v-2.300A7 7 0 0 0 12 2Z"/></svg>On</button></div>
<div class="rd"><div><small>BRIGHTNESS</small><b id="br">100%</b></div><div><small>DAYLIGHT</small><b id="dl">0 lx</b></div><div><small>POWER</small><b id="pw">9.0 W</b></div></div></div>
<script>
const cd=document.getElementById('cd'),bs=[...document.querySelectorAll('#sg button')],md=document.getElementById('md');let cur=2,tw=null;
const N=['Off','Auto','On'];
function set(i){cur=i;const lt=i===0?0:i===1?.4:1;cd.style.setProperty('--p',i);cd.style.setProperty('--lt',lt);cd.classList.toggle('on',i===2);cd.classList.toggle('auto',i===1);bs.forEach((b,k)=>b.setAttribute('aria-checked',k===i));md.textContent=i===1?'Auto, dimmed by daylight':N[i];
 const to={br:Math.round(lt*100),dl:i===1?340:0,pw:(lt*9).toFixed(1)};document.getElementById('br').textContent=to.br+'%';document.getElementById('dl').textContent=to.dl+' lx';document.getElementById('pw').textContent=to.pw+' W'}
bs.forEach((b,i)=>{b.onclick=()=>{off=true;set(i)};b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){off=true;set((cur+1)%3);bs[cur].focus()}if(e.key==='ArrowLeft'){off=true;set((cur+2)%3);bs[cur].focus()}})});
set(2);
/* Idle demo: the switch cycles On, Off, Auto: the bulb fills with warm light and rays pulse when on, goes dark when off, and in auto breathes at a dimmed level with a spinning daylight sensor, while the whole card tints and the readouts update, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3000);const o=[0,1,2];let k=0;while(!off){set(o[k++%3]);await sleep(2600)}})()}
</script></body></html>
