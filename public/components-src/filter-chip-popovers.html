<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Filter Chip Popovers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EEF0F5;color:#12141F;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{position:relative;width:100%;max-width:680px;border-radius:26px;background:#fff;padding:22px;box-shadow:0 30px 44px -30px rgba(18,20,31,.5),inset 0 0 0 1px rgba(18,20,31,.07);min-height:500px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}.hd h1{font-size:22px;font-weight:800;letter-spacing:-.04em}.hd span{font:500 12.500px 'Geist Mono';color:#7C8196}
.ch{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.cp{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:8px 13px 8px 14px;background:#F3F4F8;font:600 13.500px 'Inter Tight';color:#3E4358;cursor:pointer;box-shadow:inset 0 0 0 1.500px transparent;transition:all .2s}
.cp:hover{background:#EBEDF4}.cp[aria-expanded=true]{background:#fff;box-shadow:inset 0 0 0 1.500px #4F46E5;color:#4F46E5}.cp.has{background:#EEF0FF;color:#4338CA}.cp:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.cp .n{display:grid;place-items:center;min-width:19px;height:19px;border-radius:99px;background:#4F46E5;color:#fff;font:700 11px 'Inter Tight';padding:0 5px;transform:scale(0);width:0;margin-left:-4px;transition:all .35s cubic-bezier(.3,1.8,.5,1)}.cp.has .n{transform:scale(1);width:auto;margin-left:0}
.cp svg{width:14px;height:14px;transition:transform .25s}.cp[aria-expanded=true] svg.cv{transform:rotate(180deg)}.cp svg *{fill:none;stroke:currentColor;stroke-width:2.400;stroke-linecap:round;stroke-linejoin:round}
.clr{border:0;background:none;color:#7C8196;font:600 13px 'Inter Tight';padding:8px 6px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}.clr.on{opacity:1;pointer-events:auto}.clr:hover{color:#12141F}
.pp{position:absolute;top:calc(100% + 8px);width:230px;border-radius:18px;background:#fff;padding:6px;box-shadow:0 28px 50px -14px rgba(18,20,31,.45),inset 0 0 0 1px rgba(18,20,31,.1);opacity:0;transform:translateY(-6px) scale(.96);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .32s cubic-bezier(.3,1.5,.5,1);z-index:6}
.pp.on{opacity:1;transform:none;pointer-events:auto}
.op{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:600;transition:background .12s}.op:hover,.op.hl{background:#F3F4F9}
.bx{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.800px #C5C9D8;display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.7,.5,1);flex:none}.bx svg{width:12px;height:12px;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .3s}
.op.on .bx{background:#4F46E5;box-shadow:none}.op.on .bx svg{stroke-dashoffset:0}
.op.rd .bx{border-radius:50%}.op.rd.on .bx{background:#fff;box-shadow:inset 0 0 0 6px #4F46E5}.op.rd.on .bx svg{display:none}
.op .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 10px 'Inter Tight';color:#fff;background:var(--c);flex:none}.op .dt{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}.op small{margin-left:auto;font:500 11.500px 'Geist Mono';color:#9AA0B4}
.rs{margin-top:20px;display:grid;gap:6px}
.t{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:#F8F9FC;transition:all .35s cubic-bezier(.3,1.3,.5,1);max-height:60px;overflow:hidden}
.t.hide{max-height:0;padding-top:0;padding-bottom:0;opacity:0;margin-top:-6px;transform:scale(.97)}
.t .st{width:10px;height:10px;border-radius:50%;background:var(--c)}.t b{font-size:14.500px;font-weight:600}.t .pr{font:600 11px 'Geist Mono';letter-spacing:.06em;padding:3px 8px;border-radius:7px;background:var(--pc);color:var(--pt)}.t .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 10px 'Inter Tight';color:#fff;background:var(--c)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w" id="w"><div class="hd"><h1>Sprint tasks</h1><span id="ct">8 of 8</span></div><div class="ch" id="ch"></div><div class="rs" id="rs"></div></div>
<script>
const P=[['Priya','#7C3AED'],['Marcus','#0EA5E9'],['Amara','#F59E0B'],['Hannah','#EC4899']];
const ST=[['Todo','#94A3B8'],['In progress','#3B82F6'],['In review','#F59E0B'],['Done','#16A34A']];
const PR=[['Low','#E7F6EC','#15803D'],['Medium','#FEF3C7','#B45309'],['High','#FEE2E2','#B91C1C']];
const TK=[['Redesign onboarding',1,0,2],['Fix focus order bug',2,1,1],['Write launch copy',2,2,1],['Billing webhook retries',1,1,2],['Update brand tokens',3,3,0],['Audit empty states',0,0,0],['Ship pricing page',3,2,2],['Add keyboard shortcuts',1,3,1]];
const F=[{k:'st',n:'Status',radio:1,opts:ST.map(s=>({l:s[0],c:s[1]}))},{k:'as',n:'Assignee',opts:P.map(p=>({l:p[0],c:p[1],av:p[0][0]}))},{k:'pr',n:'Priority',opts:PR.map((p,i)=>({l:p[0],c:p[2]}))}];
const sel={st:new Set(),as:new Set(),pr:new Set()},ch=document.getElementById('ch'),rs=document.getElementById('rs'),w=document.getElementById('w');let openK=null;
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>';
F.forEach(f=>{const b=document.createElement('button');b.className='cp';b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');b.innerHTML=f.n+'<span class="n">0</span><svg class="cv" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';f.btn=b;ch.appendChild(b);
 const pp=document.createElement('div');pp.className='pp';pp.setAttribute('role','listbox');f.pp=pp;ch.appendChild(pp);
 f.opts.forEach((o,i)=>{const e=document.createElement('div');e.className='op'+(f.radio?' rd':'');e.setAttribute('role','option');e.innerHTML='<span class="bx">'+CK+'</span>'+(o.av?'<span class="av" style="--c:'+o.c+'">'+o.av+'</span>':f.k==='st'?'<span class="dt" style="--c:'+o.c+'"></span>':'')+o.l;e.onclick=()=>{off=true;tg(f,i)};pp.appendChild(e);o.el=e});
 b.onclick=()=>{off=true;toggle(f.k)}});
const cl=document.createElement('button');cl.className='clr';cl.textContent='Clear all';cl.onclick=()=>{off=true;clearAll()};ch.appendChild(cl);
TK.forEach(([n,s,a,p])=>{const e=document.createElement('div');e.className='t';e.style.cssText='--c:'+ST[s][1]+';--pc:'+PR[p][1]+';--pt:'+PR[p][2];e.innerHTML='<span class="st"></span><b>'+n+'</b><span class="pr">'+PR[p][0].toUpperCase()+'</span><span class="av" style="--c:'+P[a][1]+'">'+P[a][0][0]+'</span>';rs.appendChild(e);e._d=[s,a,p]});
const rows=[...rs.children];
function pos(f){const r=f.btn.getBoundingClientRect(),c=ch.getBoundingClientRect();f.pp.style.left=Math.min(c.width-236,Math.max(0,r.left-c.left))+'px'}
function toggle(k){const was=openK;openK=was===k?null:k;F.forEach(f=>{const o=f.k===openK;if(o)pos(f);f.pp.classList.toggle('on',o);f.btn.setAttribute('aria-expanded',o)})}
function tg(f,i){const s=sel[f.k];if(f.radio){if(s.has(i))s.clear();else{s.clear();s.add(i)}}else{s.has(i)?s.delete(i):s.add(i)}paint()}
function clearAll(){Object.values(sel).forEach(s=>s.clear());paint()}
function paint(){F.forEach(f=>{const s=sel[f.k];f.opts.forEach((o,i)=>o.el.classList.toggle('on',s.has(i)));f.btn.classList.toggle('has',s.size>0);f.btn.querySelector('.n').textContent=s.size});
 let n=0;rows.forEach(r=>{const[st,as,pr]=r._d;const ok=(!sel.st.size||sel.st.has(st))&&(!sel.as.size||sel.as.has(as))&&(!sel.pr.size||sel.pr.has(pr));r.classList.toggle('hide',!ok);if(ok)n++});
 document.getElementById('ct').textContent=n+' of 8';cl.classList.toggle('on',Object.values(sel).some(s=>s.size))}
addEventListener('keydown',e=>{if(e.key==='Escape')toggle(openK)});document.addEventListener('pointerdown',e=>{if(openK&&!ch.contains(e.target))toggle(openK)});
paint();sel.as.add(1);sel.as.add(2);paint();toggle('as');
/* Idle demo: each chip popover opens in turn and its options are ticked, so the count badge pops in on the chip and the task list below collapses and expands live, ending with Clear all, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3000);while(!off){clearAll();toggle(null);await sleep(900);if(off)return;toggle('st');await sleep(700);tg(F[0],1);await sleep(1500);toggle('as');await sleep(700);tg(F[1],0);await sleep(700);tg(F[1],2);await sleep(1300);toggle('pr');await sleep(700);tg(F[2],2);await sleep(1700);toggle(null);await sleep(1400);clearAll();await sleep(1600)}})()}
</script></body></html>
