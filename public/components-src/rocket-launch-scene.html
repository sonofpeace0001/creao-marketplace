<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rocket Launch Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070A1A;color:#EEF1FF;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.tx small{font:600 12.5px 'Unbounded';letter-spacing:.16em;text-transform:uppercase;color:#F97316}.tx h1{font:700 clamp(30px,4.4vw,50px)/1.04 'Unbounded';letter-spacing:-.04em;margin:14px 0 14px}.tx p{font-size:16.5px;line-height:1.6;color:#8E98CC;max-width:30ch}
.tx button{margin-top:24px;border:0;background:linear-gradient(135deg,#F97316,#EF4444);color:#fff;border-radius:99px;padding:15px 30px;font:700 15px 'Manrope';cursor:pointer;box-shadow:0 18px 30px -12px #F97316;display:flex;align-items:center;gap:10px}.tx button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sc{position:relative;height:480px;border-radius:30px;background:radial-gradient(circle at 50% 100%,#2A2F6E,#0B0F2A 70%);overflow:hidden;box-shadow:0 40px 70px -30px #000,0 0 0 1px #1D2350}
.st i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}.st i.d{animation:fall 2.4s linear infinite}@keyframes tw{50%{opacity:.2}}@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(500px)}}
.pl{position:absolute;right:-50px;top:60px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FDBA74,#F43F5E 60%,#7C1D6F);box-shadow:inset -18px -10px 30px rgba(0,0,0,.45),0 0 60px rgba(244,63,94,.35)}.pl::after{content:"";position:absolute;left:-30px;right:-30px;top:60px;height:26px;border-radius:50%;border:5px solid rgba(253,186,116,.6);transform:rotate(-18deg)}
.mn{position:absolute;left:30px;top:90px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#C9CFF0);box-shadow:inset -8px -4px 12px rgba(80,90,160,.5)}
.gd{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,#171B44,#0A0D26)}.gd::before{content:"";position:absolute;left:50%;top:-6px;width:130px;height:12px;margin-left:-65px;border-radius:6px;background:#3A4080}
.rk{position:absolute;left:50%;bottom:62px;width:80px;margin-left:-40px;transform-origin:50% 100%;animation:ls 6s cubic-bezier(.5,0,.8,.3) infinite}
.rk.go{animation:ls 6s cubic-bezier(.5,0,.8,.3) infinite}
@keyframes ls{0%,18%{transform:translateY(0) translateX(0)}20%{transform:translateY(0) translateX(-1.5px)}22%{transform:translateY(0) translateX(1.5px)}24%{transform:translateY(-6px) translateX(-1px)}28%{transform:translateY(-24px)}55%{transform:translateY(-300px)}82%,100%{transform:translateY(-560px)}}
.rk svg{width:100%;display:block;overflow:visible}
.fl{transform-origin:50% 0;animation:fl .12s ease-in-out infinite alternate}@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}
.fa{animation:fa 6s linear infinite}@keyframes fa{0%,20%{opacity:0}24%,80%{opacity:1}90%,100%{opacity:0}}
.sm{position:absolute;left:50%;bottom:66px;border-radius:50%;background:rgba(220,225,255,.7);filter:blur(4px);opacity:0;animation:sm 6s ease-out infinite;animation-delay:var(--d)}@keyframes sm{0%,18%{opacity:0;transform:translate(0,0) scale(.4)}24%{opacity:.8}60%{opacity:0;transform:translate(var(--x),-40px) scale(var(--s))}100%{opacity:0}}
.ct{position:absolute;left:20px;bottom:84px;font:700 40px 'Unbounded';letter-spacing:-.04em;opacity:.85}.ct small{display:block;font:600 11px 'Manrope';letter-spacing:.2em;color:#8E98CC;text-transform:uppercase;margin-bottom:2px}
@media(max-width:760px){.c{grid-template-columns:1fr;text-align:center}.tx p{margin-inline:auto}.tx button{margin-inline:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="c"><div class="tx"><small>Mission control</small><h1>Ready for liftoff</h1><p>A looping launch scene with shaking ignition, a roaring flame, smoke and falling stars.</p><button id="b"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Replay launch</button></div>
<div class="sc" id="sc"><div class="st" id="st"></div><div class="mn"></div><div class="pl"></div>
<div class="ct"><small>T minus</small><span id="cd">3</span></div>
<div class="sm" style="--d:.2s;--x:-60px;--s:4;width:36px;height:36px;margin-left:-18px"></div><div class="sm" style="--d:.4s;--x:60px;--s:4.5;width:40px;height:40px;margin-left:-20px"></div><div class="sm" style="--d:.6s;--x:-110px;--s:5;width:44px;height:44px;margin-left:-22px"></div><div class="sm" style="--d:.8s;--x:100px;--s:5;width:44px;height:44px;margin-left:-22px"></div>
<div class="rk" id="rk"><svg viewBox="0 0 80 190"><defs><linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#E7EAFB"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#B8C0E6"/></linearGradient><linearGradient id="fm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset=".5" stop-color="#F97316"/><stop offset="1" stop-color="#EF4444" stop-opacity="0"/></linearGradient></defs>
<g class="fa"><g class="fl"><path d="M28 120 Q40 210 40 230 Q40 210 52 120Z" fill="url(#fm)"/><path d="M34 120 Q40 170 40 185 Q40 170 46 120Z" fill="#FFF7D6" opacity=".9"/></g></g>
<path d="M14 100 L0 140 L22 128Z" fill="#F43F5E"/><path d="M66 100 L80 140 L58 128Z" fill="#F43F5E"/>
<path d="M40 0 C60 30 64 70 60 124 H20 C16 70 20 30 40 0Z" fill="url(#bd)"/><path d="M40 0 C50 14 56 26 58 40 H22 C24 26 30 14 40 0Z" fill="#F43F5E"/><circle cx="40" cy="66" r="12" fill="#1D2350"/><circle cx="40" cy="66" r="9" fill="#38BDF8"/><circle cx="36" cy="62" r="3" fill="#fff" opacity=".7"/><rect x="26" y="124" width="28" height="12" rx="3" fill="#8A93C6"/></svg></div>
<div class="gd"></div></div></div>
<script>
const st=document.getElementById('st');for(let i=0;i<70;i++){const s=document.createElement('i');s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*80+'%;animation-delay:-'+Math.random()*3+'s;opacity:'+(.3+Math.random()*.7);st.appendChild(s)}for(let i=0;i<14;i++){const s=document.createElement('i');s.className='d';s.style.cssText='left:'+Math.random()*100+'%;top:0;height:'+(14+Math.random()*26)+'px;width:1.5px;background:linear-gradient(#fff,transparent);animation-delay:-'+Math.random()*2.4+'s;animation-duration:'+(1.6+Math.random()*1.4)+'s;opacity:.5';st.appendChild(s)}
const rk=document.getElementById('rk'),cd=document.getElementById('cd');let t0=performance.now();setInterval(()=>{const t=((performance.now()-t0)/1000)%6;cd.textContent=t<1.1?'3':t<2.2?'2':t<3.3?'1':'Go'},200);
document.getElementById('b').onclick=()=>{[...document.querySelectorAll('.rk,.fa,.sm')].forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation=''});t0=performance.now()};
// start mid-flight so the first frame is dramatic
document.querySelectorAll('.rk,.fa,.sm').forEach(e=>{e.style.animationDelay=(e.classList.contains('sm')?'calc(var(--d) - 2.9s)':'-2.9s')});setTimeout(()=>document.querySelectorAll('.rk,.fa,.sm').forEach(e=>e.style.animationDelay=''),50);
</script></body></html>
