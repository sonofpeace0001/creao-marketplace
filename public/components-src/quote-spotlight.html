<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pull Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0E0C;--ivory:#F3EDE0;--gold:#C9A24B;--muted:#9A9283}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 0,#1D1A14,var(--bg) 60%);color:var(--ivory);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:56px 28px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.q{position:relative;max-width:920px;text-align:center}
.mark{position:absolute;left:50%;top:-176px;transform:translateX(-50%);font:400 240px/1 'Playfair Display',serif;color:transparent;-webkit-text-stroke:1.5px rgba(201,162,75,.5);user-select:none;pointer-events:none}
.label{position:relative;display:inline-flex;align-items:center;gap:14px;font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:56px 0 34px}
.label::before,.label::after{content:"";width:34px;height:1px;background:var(--gold);opacity:.6}
.text{position:relative;font:italic 400 clamp(30px,4.4vw,54px)/1.2 'Playfair Display',serif;letter-spacing:-.01em;min-height:3.7em;display:flex;align-items:center;justify-content:center}
.tx{max-width:100%}
.text span.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
.text b{font-weight:500;color:var(--gold)}
@keyframes in{to{opacity:1;transform:none;filter:none}}
.by{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:38px;transition:opacity .4s}
.by .m{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:500 17px 'Playfair Display',serif;color:var(--bg);background:linear-gradient(135deg,#E6C879,#B88A2E)}
.by b{display:block;font-size:15px;font-weight:600}.by span{font-size:13.5px;color:var(--muted)}
.by div{text-align:left}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:46px}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,237,224,.2);background:none;color:var(--ivory);cursor:pointer;display:grid;place-items:center;transition:border-color .2s,background .2s}
.arr:hover{border-color:var(--gold);background:rgba(201,162,75,.1)}
.arr:focus-visible,.dot:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.dots{display:flex;gap:10px}
.dot{width:46px;height:3px;border:0;border-radius:3px;background:rgba(243,237,224,.18);position:relative;overflow:hidden;cursor:pointer;padding:0}
.dot i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left}
.dot.done i{transform:scaleX(1)}
.dot.on i{animation:fill var(--d,7000ms) linear forwards}
.paused .dot.on i{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
@media(max-width:640px){.mark{font-size:150px;top:-50px}.text{min-height:6em}}
@media(prefers-reduced-motion:reduce){.text span.w{animation:none;opacity:1;transform:none;filter:none}.dot.on i{animation:none;transform:scaleX(1)}}
</style>
</head>
<body>
<div class="q" id="q" aria-roledescription="carousel" aria-label="Customer quotes">
  <div class="mark" aria-hidden="true">“</div>
  <div class="label">What customers say</div>
  <blockquote class="text" id="t" aria-live="polite"></blockquote>
  <div class="by" id="by"><span class="m" id="m"></span><div><b id="n"></b><span id="r"></span></div></div>
  <div class="ctl">
    <button class="arr" id="prev" aria-label="Previous quote"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="arr" id="next" aria-label="Next quote"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>
<script>
const Q=[
{t:'We replaced three vendors, two spreadsheets and a *weekly meeting* with one tool. Our team got a day of the week back.',n:'Amara Okafor',r:'Chief Operating Officer · Meridian Health',m:'AO'},
{t:'It is the rare product where *every detail* feels argued over. You can tell someone cared — and it shows in how quickly our people adopted it.',n:'Julien Marchetti',r:'Head of Design · Atelier & Co.',m:'JM'},
{t:'Onboarding took an afternoon. Six months later, nobody on the team can *explain how we worked* before it.',n:'Hannah Lindqvist',r:'Founder · Nordlys Studio',m:'HL'}];
const DUR=7000;let i=0,timer,paused=false;
const t=document.getElementById('t'),dots=document.getElementById('dots'),by=document.getElementById('by'),q=document.getElementById('q');
Q.forEach((_,k)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Quote '+(k+1));b.style.setProperty('--d',DUR+'ms');b.innerHTML='<i></i>';b.onclick=()=>go(k);dots.appendChild(b)});
function words(s){return s.split(/(\*[^*]+\*)/).filter(Boolean).flatMap(p=>{const em=p[0]==='*';return (em?p.slice(1,-1):p).split(' ').filter(Boolean).map(w=>({w,em}))})}
function show(k){const d=Q[k];t.innerHTML='';const box=document.createElement('div');box.className='tx';t.appendChild(box);
  words(d.t).forEach((o,j)=>{const s=document.createElement('span');s.className='w';s.style.animationDelay=(j*45)+'ms';s.innerHTML=(o.em?'<b>'+o.w+'</b>':o.w)+'&nbsp;';box.appendChild(s)});
  by.style.opacity=0;setTimeout(()=>{document.getElementById('m').textContent=d.m;document.getElementById('n').textContent=d.n;document.getElementById('r').textContent=d.r;by.style.opacity=1},220);
  [...dots.children].forEach((b,j)=>{b.classList.remove('on','done');if(j<k)b.classList.add('done');void b.offsetWidth;if(j===k)b.classList.add('on')})}
function go(k){i=(k+Q.length)%Q.length;show(i);arm()}
function arm(){clearTimeout(timer);if(!paused)timer=setTimeout(()=>go(i+1),DUR)}
document.getElementById('next').onclick=()=>go(i+1);document.getElementById('prev').onclick=()=>go(i-1);
q.addEventListener('mouseenter',()=>{paused=true;q.classList.add('paused');clearTimeout(timer)});
q.addEventListener('mouseleave',()=>{paused=false;q.classList.remove('paused');go(i)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
if(matchMedia('(prefers-reduced-motion: reduce)').matches)paused=true;
show(0);arm();
</script>
</body>
</html>
