<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hover Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080B;color:#E6EBF2;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ap{position:relative;display:flex;width:100%;max-width:780px;height:440px;background:#0B0E13;border:1px solid #1B212B;border-radius:26px;overflow:hidden;box-shadow:0 40px 80px -34px #000}
.rl{position:absolute;z-index:3;left:0;top:0;bottom:0;width:68px;background:rgba(10,13,18,.92);backdrop-filter:blur(18px);border-right:1px solid #1B212B;padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:width .3s cubic-bezier(.3,1,.4,1),box-shadow .3s}
.rl:hover,.rl:focus-within{width:216px;box-shadow:24px 0 50px -20px rgba(0,0,0,.7)}
.lg{display:flex;align-items:center;gap:13px;height:42px;padding:0 9px;margin-bottom:10px;white-space:nowrap}.lg i{flex:none;width:30px;height:30px;border-radius:10px;background:conic-gradient(from 200deg,#34D399,#38BDF8,#818CF8,#34D399)}.lg b{font-size:17px;font-weight:700;letter-spacing:-.03em}
.it{position:relative;display:flex;align-items:center;gap:15px;height:46px;padding:0 13px;border:0;background:none;border-radius:14px;color:#7F8BA0;font:600 15px 'DM Sans';cursor:pointer;white-space:nowrap;text-align:left;transition:all .2s}
.it svg{flex:none}.it:hover{background:#131820;color:#E6EBF2}.it:focus-visible{outline:2px solid #34D399;outline-offset:-2px}
.it.on{background:rgba(52,211,153,.12);color:#34D399}.it.on::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:#34D399;box-shadow:0 0 12px #34D399}
.it span{opacity:0;transition:opacity .2s}.rl:hover .it span,.rl:focus-within .it span{opacity:1}
.us{margin-top:auto;display:flex;align-items:center;gap:13px;padding:10px 9px;border-top:1px solid #1B212B;white-space:nowrap}.us i{flex:none;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FFB86B,#F43F8E);display:grid;place-items:center;font:700 12px 'DM Sans';color:#fff;font-style:normal}.us div{opacity:0;transition:opacity .2s}.rl:hover .us div,.rl:focus-within .us div{opacity:1}.us b{display:block;font-size:14px}.us span{font-size:12px;color:#6A768C}
.mn{margin-left:68px;flex:1;padding:24px 26px;min-width:0}
.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.tp h1{font-size:22px;font-weight:700;letter-spacing:-.03em}.tp span{font-size:13px;color:#6A768C}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.c{background:#10141B;border:1px solid #1B212B;border-radius:18px;padding:16px}.c small{font-size:12px;color:#6A768C;font-weight:600}.c b{display:block;font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:6px}
.bg{margin-top:12px;height:170px;border-radius:18px;background:linear-gradient(180deg,rgba(52,211,153,.14),transparent),#10141B;border:1px solid #1B212B;position:relative;overflow:hidden}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.hn{position:absolute;right:20px;bottom:16px;font-size:12.5px;color:#586379;z-index:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="ap"><nav class="rl" aria-label="Main navigation"><div class="lg"><i></i><b>Meridian</b></div>
 <button class="it on" data-t="Overview"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Overview</span></button>
 <button class="it" data-t="Analytics"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Analytics</span></button>
 <button class="it" data-t="Customers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.500"/><path d="M3 20a6 6 0 0 1 12 0M17 4a3.500 3.500 0 0 1 0 7M21 20a6 6 0 0 0-4-5.600"/></svg><span>Customers</span></button>
 <button class="it" data-t="Billing"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg><span>Billing</span></button>
 <button class="it" data-t="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.200 4.200l2.100 2.100M17.700 17.700l2.100 2.100M2 12h3M19 12h3M4.200 19.800l2.100-2.100M17.700 6.300l2.100-2.100"/></svg><span>Settings</span></button>
 <div class="us"><i>MA</i><div><b>Maya Alvarez</b><span>Owner</span></div></div></nav>
 <main class="mn"><div class="tp"><h1 id="h">Overview</h1><span>Last 30 days</span></div><div class="gd"><div class="c"><small>Revenue</small><b>$84.2k</b></div><div class="c"><small>Orders</small><b>1,942</b></div><div class="c"><small>Visitors</small><b>38.1k</b></div></div>
 <div class="bg"><svg viewBox="0 0 400 170" preserveAspectRatio="none"><path d="M0 130C40 120 60 80 110 90S180 40 230 60 320 30 400 20V170H0Z" fill="rgba(52,211,153,.16)"/><path d="M0 130C40 120 60 80 110 90S180 40 230 60 320 30 400 20" fill="none" stroke="#34D399" stroke-width="2.500"/></svg><span class="hn">Hover or focus the rail to expand it</span></div></main></div>
<script>document.querySelectorAll('.it').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.it').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('h').textContent=b.dataset.t}))</script></body></html>
