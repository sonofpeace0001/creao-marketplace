<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pressline Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEAE3;--ink:#0E0E0E;--yellow:#FFD60A;--pink:#FF4F9A;--blue:#2B59FF;--green:#18C37E;--sh:5px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:48px 24px;background-image:radial-gradient(rgba(14,14,14,.16) 1.2px,transparent 1.2px);background-size:22px 22px}
.board{width:100%;max-width:760px;background:var(--bg);border:3px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:34px 36px 36px}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:26px}
h1{font-size:34px;line-height:1;letter-spacing:-.03em;font-weight:700}
.tag{font:700 11px 'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--yellow);padding:6px 10px}
.lab{font:700 11px 'Space Mono',monospace;letter-spacing:.14em;text-transform:uppercase;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.lab::after{content:"";flex:1;height:2px;background:var(--ink);opacity:.18}
.row{display:flex;flex-wrap:wrap;gap:16px 18px;align-items:center}
.btn{--c:var(--yellow);font:700 15px 'Space Grotesk',sans-serif;color:var(--ink);background:var(--c);border:3px solid var(--ink);padding:12px 22px;cursor:pointer;box-shadow:var(--sh) var(--sh) 0 var(--ink);transform:translate(0,0);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:10px;position:relative}
.btn:hover{transform:translate(-2px,-2px);box-shadow:calc(var(--sh) + 2px) calc(var(--sh) + 2px) 0 var(--ink)}
.btn:active{transform:translate(var(--sh),var(--sh));box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.white{--c:#fff}.dark{--c:var(--ink);color:#fff;box-shadow:var(--sh) var(--sh) 0 var(--blue)}
.dark:hover{box-shadow:7px 7px 0 var(--blue)}
.pink{--c:var(--pink)}
.link{background:none;border:0;box-shadow:none;padding:6px 0;border-bottom:3px solid var(--ink);gap:8px}
.link:hover{box-shadow:none;transform:none;color:var(--blue);border-color:var(--blue)}
.link:active{transform:none}
.link svg{transition:transform .2s}.link:hover svg{transform:translateX(5px)}
.sm{padding:7px 14px;font-size:13px;--sh:3px}.lg{padding:17px 32px;font-size:18px;--sh:7px}
.ico{padding:0;width:48px;height:48px;justify-content:center}
.btn[disabled]{background:repeating-linear-gradient(135deg,#d8d4cb 0 8px,#e6e2d9 8px 16px);color:#8c877c;cursor:not-allowed;box-shadow:none;transform:none;border-color:#8c877c}
.deploy{min-width:178px;justify-content:center}
.deploy[data-s=loading]{--c:#fff;cursor:progress}
.deploy[data-s=done]{--c:var(--green)}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;background:var(--ink);border-radius:50%;animation:b .8s infinite}
.dots i:nth-child(2){animation-delay:.12s}.dots i:nth-child(3){animation-delay:.24s}
@keyframes b{50%{transform:translateY(-5px)}}
.split{display:inline-flex;position:relative}
.split .btn:first-child{border-right-width:0;padding-right:18px}
.split .caret{padding:0 14px;--c:var(--blue);color:#fff}
.menu{position:absolute;top:calc(100% + 12px);right:0;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);min-width:200px;display:none;z-index:5}
.menu.open{display:block}
.menu button{display:flex;width:100%;justify-content:space-between;font:700 14px 'Space Grotesk';background:none;border:0;padding:12px 16px;cursor:pointer;text-align:left}
.menu button+button{border-top:2px solid var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--yellow);outline:0}
.menu kbd{font:400 11px 'Space Mono',monospace;opacity:.6}
@media(max-width:560px){.board{padding:24px 20px}h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="board">
  <div class="top"><h1>Button lab</h1><span class="tag">06 states</span></div>

  <div class="lab">Variants</div>
  <div class="row">
    <button class="btn">Start a project</button>
    <button class="btn white">View pricing</button>
    <button class="btn dark">Book a demo</button>
    <button class="btn link">Read the docs <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </div>

  <div class="lab">Live states</div>
  <div class="row">
    <button class="btn deploy" id="deploy" data-s="idle"><span id="dl">Deploy to prod</span></button>
    <div class="split">
      <button class="btn white">Publish</button>
      <button class="btn caret" id="caret" aria-haspopup="menu" aria-expanded="false" aria-label="More publish options"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="menu" role="menu">
        <button role="menuitem">Publish now <kbd>⌘P</kbd></button>
        <button role="menuitem">Schedule… <kbd>⌘S</kbd></button>
        <button role="menuitem">Save as draft <kbd>⌘D</kbd></button>
      </div>
    </div>
    <button class="btn pink">Delete project</button>
  </div>

  <div class="lab">Sizes · icon · disabled</div>
  <div class="row">
    <button class="btn sm">Small</button>
    <button class="btn">Medium</button>
    <button class="btn lg">Large</button>
    <button class="btn white ico" aria-label="Favourite"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></button>
    <button class="btn" disabled>Unavailable</button>
  </div>
</div>
<script>
const d=document.getElementById('deploy'),dl=document.getElementById('dl');let t;
d.addEventListener('click',()=>{
  if(d.dataset.s==='loading')return;
  if(d.dataset.s==='done'){d.dataset.s='idle';dl.textContent='Deploy to prod';return}
  d.dataset.s='loading';dl.innerHTML='Deploying <span class="dots"><i></i><i></i><i></i></span>';
  clearTimeout(t);t=setTimeout(()=>{d.dataset.s='done';dl.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="square"><path d="m4 12.5 5 5L20 6.5"/></svg> Live — click to reset'},1700)});
const c=document.getElementById('caret'),m=document.getElementById('menu');
c.addEventListener('click',e=>{e.stopPropagation();const o=m.classList.toggle('open');c.setAttribute('aria-expanded',o)});
document.addEventListener('click',()=>{m.classList.remove('open');c.setAttribute('aria-expanded',false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){m.classList.remove('open');c.setAttribute('aria-expanded',false);c.focus()}});
</script>
</body>
</html>
