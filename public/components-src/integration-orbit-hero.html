<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Integration Orbit Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070D1C;color:#E6ECFB;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(900px 600px at 78% 50%,rgba(59,130,246,.2),transparent 70%)}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,4vw,48px)}
.lg{font-weight:800;font-size:19px;letter-spacing:-.04em;display:flex;align-items:center;gap:9px}.lg i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#3B82F6,#22D3EE);display:block}
nav ul{display:flex;gap:26px;list-style:none;font-size:14px;font-weight:600;color:#8FA0C6}nav a{color:inherit;text-decoration:none}
.nb{border:0;border-radius:12px;padding:11px 18px;background:#E6ECFB;color:#070D1C;font:700 13px 'Plus Jakarta Sans';cursor:pointer}.nb:focus-visible,.b1:focus-visible,.b2:focus-visible{outline:3px solid #22D3EE;outline-offset:3px}
.body{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;padding:0 clamp(18px,5vw,70px) 40px}
.eb{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#22D3EE;display:flex;align-items:center;gap:10px}.eb::before{content:"";width:28px;height:2px;background:#22D3EE}
h1{font-size:clamp(34px,5.2vw,68px);line-height:1;font-weight:800;letter-spacing:-.055em;margin:16px 0 18px}h1 span{background:linear-gradient(90deg,#60A5FA,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb{font-size:clamp(15px,1.5vw,18px);line-height:1.55;color:#9BAAD0;max-width:480px}
.ct{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}.b1{border:0;border-radius:14px;padding:16px 24px;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font:700 15px 'Plus Jakarta Sans';cursor:pointer;box-shadow:0 14px 30px -10px rgba(59,130,246,.7)}.b2{border:0;border-radius:14px;padding:16px 24px;background:rgba(255,255,255,.06);color:#E6ECFB;font:700 15px 'Plus Jakarta Sans';cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pf{display:flex;gap:26px;margin-top:34px;font-size:13px;color:#7384AB}.pf b{display:block;font-size:24px;color:#E6ECFB;letter-spacing:-.04em}
.orb{position:relative;width:min(560px,92%);aspect-ratio:1;margin-inline:auto}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.500px dashed rgba(143,160,198,.28);transform:translate(-50%,-50%)}
.r1{width:42%;height:42%}.r2{width:70%;height:70%}.r3{width:98%;height:98%}
.spin{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);animation:rot var(--t) linear infinite}
.spin.rev{animation-direction:reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.nd{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;transform:rotate(var(--a)) translateY(calc(var(--s2)/-2));}
.nd>i{display:grid;place-items:center;width:100%;height:100%;border-radius:16px;background:linear-gradient(160deg,#141E3A,#0D1530);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 12px 22px -10px rgba(0,0,0,.8);animation:upr var(--t) linear infinite;transform:rotate(calc(var(--a)*-1))}
.rev .nd>i{animation-direction:reverse}
@keyframes upr{to{transform:rotate(calc(var(--a)*-1 - 360deg))}}
.nd svg{width:26px;height:26px}
.core{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28%;background:linear-gradient(135deg,#3B82F6,#22D3EE);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(59,130,246,.12),0 0 0 28px rgba(59,130,246,.07),0 0 70px rgba(34,211,238,.5)}
.core svg{width:46%;height:46%}.core::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid rgba(34,211,238,.6);animation:pulse 2.600s ease-out infinite}
@keyframes pulse{to{transform:scale(1.6);opacity:0}}
@media(max-width:820px){.body{grid-template-columns:1fr}nav ul{display:none}.orb{width:min(380px,92%)}}
@media(prefers-reduced-motion:reduce){.spin,.nd>i,.core::after{animation:none}}
</style></head><body>
<section class="hero"><nav><div class="lg"><i></i>Convoy</div><ul><li><a href="#">Product</a></li><li><a href="#">Integrations</a></li><li><a href="#">Pricing</a></li></ul><button class="nb">Get started</button></nav>
<div class="body"><div><div class="eb">One workspace</div><h1>Every tool you use, <span>finally on speaking terms</span></h1><p class="sb">Convoy syncs your issue tracker, repo, chat, docs and billing into a single timeline, so nothing gets copy-pasted between tabs again.</p>
<div class="ct"><button class="b1">Connect your stack</button><button class="b2">Browse 240 integrations</button></div>
<div class="pf"><div><b>240+</b>Integrations</div><div><b>12 min</b>Average setup</div><div><b>99.98%</b>Sync uptime</div></div></div>
<div class="orb" id="orb" aria-hidden="true"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
<div class="core"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.500 2.500M15.500 15.500 18 18M18 6l-2.500 2.500M8.500 15.500 6 18"/></svg></div></div></div></section>
<script>
/* Orbit nodes are generated so each ring has its own count, speed and direction, and each icon stays upright while it travels. */
const I={git:'<path d="M6 3v12M18 9v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM18 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM18 9c0 4-6 4-12 6" stroke="#60A5FA"/>',chat:'<path d="M4 5h16v11H9l-5 4Z" stroke="#A78BFA"/>',doc:'<path d="M7 3h8l4 4v14H7ZM15 3v4h4M10 13h6M10 17h4" stroke="#34D399"/>',card:'<rect x="3" y="6" width="18" height="12" rx="2" stroke="#FBBF24"/><path d="M3 10h18" stroke="#FBBF24"/>',bolt:'<path d="M13 2 4 14h6l-1 8 9-12h-6Z" stroke="#F472B6"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2" stroke="#22D3EE"/><path d="M8 3v4M16 3v4M4 10h16" stroke="#22D3EE"/>',db:'<ellipse cx="12" cy="6" rx="7" ry="3" stroke="#FB923C"/><path d="M5 6v6c0 1.700 3 3 7 3s7-1.300 7-3V6M5 12v6c0 1.700 3 3 7 3s7-1.300 7-3v-6" stroke="#FB923C"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2" stroke="#60A5FA"/><path d="m3 7 9 6 9-6" stroke="#60A5FA"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2" stroke="#34D399"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2" stroke="#A78BFA"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#A78BFA"/>',cloud:'<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.500 4.500 4.500 0 0 1 17.500 18Z" stroke="#22D3EE"/>'};
const R=[{c:'r1',keys:['git','chat','doc'],t:'26s',rev:0,s:42},{c:'r2',keys:['card','bolt','cal','db','mail'],t:'42s',rev:1,s:70},{c:'r3',keys:['chart','lock','cloud','git'],t:'62s',rev:0,s:98}];
const orb=document.getElementById('orb');
R.forEach(r=>{const w=document.createElement('div');w.className='spin'+(r.rev?' rev':'');w.style.cssText='--s:'+r.s+'%;--t:'+r.t;const px=orb.clientWidth*r.s/100;
 r.keys.forEach((k,i)=>{const a=(360/r.keys.length)*i+(r.c==='r2'?20:0);const n=document.createElement('div');n.className='nd';n.style.cssText='--a:'+a+'deg;--s2:'+px+'px;--t:'+r.t;n.innerHTML='<i><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I[k]+'</svg></i>';w.appendChild(n)});orb.appendChild(w)});
</script></body></html>
