<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ask-Anything FAQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#F1EEFF,#FFF0F6);color:#1B1536;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:620px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-radius:30px;padding:28px;box-shadow:0 40px 70px -44px rgba(80,40,160,.55),0 0 0 1px rgba(255,255,255,.9)}
h1{font-size:clamp(24px,4vw,30px);font-weight:800;letter-spacing:-.04em}.sub{font-size:15px;color:#6E6894;margin:6px 0 20px}
.in{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E2DCF7;border-radius:18px;padding:6px 6px 6px 18px;transition:all .2s}.in:focus-within{border-color:#7C5CFA;box-shadow:0 0 0 5px rgba(124,92,250,.13)}
.in svg{color:#7C5CFA;flex:none}.in input{flex:1;min-width:0;border:0;outline:0;font:500 15.5px 'Plus Jakarta Sans';color:#1B1536;background:none}.in input::placeholder{color:#A9A3C9}
.in button{border:0;border-radius:13px;background:linear-gradient(135deg,#7C5CFA,#C14DFF);color:#fff;font:700 14px 'Plus Jakarta Sans';padding:11px 18px;cursor:pointer;transition:transform .15s}.in button:hover{transform:scale(1.04)}.in button:focus-visible{outline:3px solid #1B1536;outline-offset:2px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}.ch button{border:1px solid #E2DCF7;background:#FAF8FF;color:#5A4FA0;border-radius:99px;padding:7px 13px;font:600 13px 'Plus Jakarta Sans';cursor:pointer;transition:all .15s}.ch button:hover{background:#7C5CFA;color:#fff;border-color:#7C5CFA}.ch button:focus-visible{outline:2px solid #7C5CFA;outline-offset:2px}
.an{margin-top:18px;border-radius:20px;background:#fff;border:1px solid #EEE9FB;padding:18px 20px;min-height:150px;box-shadow:0 14px 26px -20px rgba(80,40,160,.4)}
.an .q{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;margin-bottom:10px}.an .q i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#7C5CFA,#C14DFF);color:#fff;display:grid;place-items:center;font:700 12px 'Plus Jakarta Sans';font-style:normal}
.an p{font-size:15.5px;line-height:1.65;color:#463F6E;min-height:84px}.an p .cur{display:inline-block;width:8px;height:16px;background:#7C5CFA;border-radius:2px;vertical-align:-3px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.src{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;opacity:0;transition:opacity .4s}.src.on{opacity:1}.src a{font-size:12.5px;font-weight:600;color:#7C5CFA;background:#F3EFFF;padding:5px 10px;border-radius:8px;text-decoration:none}
.an .fb{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:#8F89B3}.an .fb button{display:grid;place-items:center;border:1px solid #E2DCF7;background:#fff;border-radius:8px;width:30px;height:28px;cursor:pointer;color:#6E6894}.an .fb button:hover{background:#F3EFFF}.an .fb button:focus-visible{outline:2px solid #7C5CFA}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
</style></head><body>
<div class="c"><h1>Ask us anything</h1><p class="sub">Get an instant answer from our docs, or pick a popular question.</p>
<form class="in" id="f"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/></svg><input id="i" placeholder="e.g. How does the free trial work?" aria-label="Ask a question" autocomplete="off"><button>Ask</button></form>
<div class="ch" id="ch"></div>
<div class="an" aria-live="polite"><div class="q"><i>Q</i><span id="qq"></span></div><p id="aa"></p><div class="src" id="sr"></div><div class="fb"><span>Was this helpful?</span><button aria-label="Yes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.200l-1.300 7A2 2 0 0 1 17.700 20H7"/></svg></button><button aria-label="No"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.200l-1.300 7A2 2 0 0 1 17.700 20H7"/></svg></button></div></div></div>
<script>
const K=[['How does the free trial work?','You get every feature free for 14 days with no card required. On day 12 we email a reminder, and if you do nothing the workspace simply moves to the free Starter plan.',['Pricing','Trial FAQ']],['Can I invite my whole team?','Yes. Invite anyone by email or share a link. Guests can view and comment for free, and only editors count as paid seats.',['Seats','Roles']],['Is my data secure?','Everything is encrypted in transit and at rest, backed up hourly and stored in the region you choose. We are SOC 2 Type II certified.',['Security','Compliance']],['How do I cancel?','Open Settings, then Billing, then Cancel plan. You keep access until the end of the period and can export all your data in one click.',['Billing','Export']]];
const ch=document.getElementById('ch'),qq=document.getElementById('qq'),aa=document.getElementById('aa'),sr=document.getElementById('sr'),i=document.getElementById('i');let tm=null;
ch.innerHTML=K.map(k=>'<button>'+k[0]+'</button>').join('');
function ask(n,shown){clearInterval(tm);const k=K[n];qq.textContent=shown||k[0];sr.classList.remove('on');sr.innerHTML=k[2].map(s=>'<a href="#">'+s+'</a>').join('');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduced){aa.textContent=k[1];sr.classList.add('on');return}
 const w=k[1].split(' ');let p=0;aa.innerHTML='<span class="cur"></span>';tm=setInterval(()=>{p+=2;aa.innerHTML=w.slice(0,p).join(' ')+'<span class="cur"></span>';if(p>=w.length){clearInterval(tm);aa.textContent=k[1];sr.classList.add('on')}},45)}
function match(t){t=t.toLowerCase();let b=0,s=0;K.forEach((k,n)=>{const sc=k[0].toLowerCase().split(/\W+/).filter(x=>x.length>3).reduce((a,x)=>a+(t.includes(x)?1:0),0)+k[1].toLowerCase().split(/\W+/).filter(x=>x.length>4).reduce((a,x)=>a+(t.includes(x)?.5:0),0);if(sc>s){s=sc;b=n}});return b}
[...ch.children].forEach((b,n)=>b.onclick=()=>{i.value=K[n][0];ask(n)});
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(v)ask(match(v),v)};
ask(0);
</script></body></html>
