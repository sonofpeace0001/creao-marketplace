<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Empty Projects State</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4EFE6;color:#2A2218;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:26px 16px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:520px;background:#fff;border-radius:32px;padding:42px 36px 34px;text-align:center;box-shadow:0 36px 60px -36px rgba(80,55,20,.45),0 0 0 1px rgba(42,34,24,.07);position:relative;overflow:hidden}
.c::before{content:"";position:absolute;left:50%;top:-80px;width:360px;height:360px;margin-left:-180px;border-radius:50%;background:radial-gradient(circle,#FFE9C9,transparent 65%)}
.il{position:relative;width:200px;height:150px;margin:0 auto 24px}
.il svg{width:100%;height:100%;overflow:visible}
.fl{animation:f 4s ease-in-out infinite}.fl.b{animation-delay:-1.3s}.fl.c2{animation-delay:-2.4s}
@keyframes f{50%{transform:translateY(-7px)}}
h1{position:relative;font:500 32px/1.05 'Fraunces',serif;letter-spacing:-.03em}h1 em{font-weight:400;color:#C2410C}
p{position:relative;color:#7A6E5C;font-size:16px;line-height:1.55;margin:12px auto 26px;max-width:340px}
.a{position:relative;display:flex;flex-direction:column;gap:10px;align-items:center}
.pr{display:inline-flex;align-items:center;gap:9px;border:0;background:#2A2218;color:#fff;font:600 15px 'Inter';padding:15px 26px;border-radius:15px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 14px 24px -12px rgba(42,34,24,.7)}.pr:hover{transform:translateY(-2px)}.pr:focus-visible{outline:3px solid #C2410C;outline-offset:3px}
.sc{border:0;background:none;color:#7A6E5C;font:600 14px 'Inter';cursor:pointer;border-bottom:1.5px solid #D8CDB8;padding-bottom:2px}.sc:hover{color:#2A2218;border-color:#2A2218}.sc:focus-visible{outline:2px solid #C2410C;outline-offset:3px}
.tp{position:relative;display:flex;justify-content:center;gap:8px;margin-top:26px;padding-top:22px;border-top:1px dashed #E8DFCF;flex-wrap:wrap}
.tp button{border:1.5px solid #E8DFCF;background:#FFFBF4;color:#5E5240;font:500 13px 'Inter';padding:8px 13px;border-radius:99px;cursor:pointer;transition:all .2s}.tp button:hover{border-color:#C2410C;color:#C2410C;background:#fff}.tp button:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.fl{animation:none}*{transition:none!important}}
</style></head><body>
<div class="c"><div class="il"><svg viewBox="0 0 200 150" fill="none"><ellipse cx="100" cy="136" rx="62" ry="7" fill="#F0E6D3"/><g class="fl"><rect x="34" y="40" width="84" height="76" rx="14" fill="#FFF" stroke="#2A2218" stroke-width="2.500"/><path d="M34 62h84" stroke="#2A2218" stroke-width="2.500"/><circle cx="46" cy="51" r="3" fill="#C2410C"/><circle cx="57" cy="51" r="3" fill="#FFB020"/><circle cx="68" cy="51" r="3" fill="#2A2218"/><rect x="46" y="76" width="36" height="6" rx="3" fill="#EADFCB"/><rect x="46" y="90" width="58" height="6" rx="3" fill="#F3EBDB"/></g><g class="fl b"><rect x="94" y="20" width="72" height="62" rx="14" fill="#FFE2C2" stroke="#2A2218" stroke-width="2.500"/><path d="M130 38v26M117 51h26" stroke="#2A2218" stroke-width="3.500" stroke-linecap="round"/></g><g class="fl c2"><circle cx="160" cy="104" r="14" fill="#C2410C" stroke="#2A2218" stroke-width="2.500"/><path d="m154 104 4 4 8-9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M22 28l5 5M27 28l-5 5M176 52l4 4M180 52l-4 4" stroke="#C2410C" stroke-width="2.500" stroke-linecap="round"/></svg></div>
 <h1>No projects <em>yet.</em></h1><p id="p">Start with a blank board, or pick a template and we'll set up the first few tasks for you.</p>
 <div class="a"><button class="pr" id="b"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create your first project</button><button class="sc" id="i">Import from Trello or Asana</button></div>
 <div class="tp" role="group" aria-label="Templates"><button>Product launch</button><button>Marketing plan</button><button>Weekly sprint</button></div></div>
<script>
const p=document.getElementById('p'),b=document.getElementById('b');
document.querySelectorAll('.tp button').forEach(x=>x.addEventListener('click',()=>{p.textContent='“'+x.textContent+'” template ready — 8 tasks added to a new board.';b.lastChild.textContent='Open the board'}));
b.addEventListener('click',()=>{p.textContent='Your first project is ready. Add a task to get moving.';b.lastChild.textContent='Open the board'});
</script></body></html>
