<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Logo Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F6FB;color:#13203A;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:40px 0;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{width:100%;max-width:1000px;padding:0 20px}
.k{text-align:center;font-size:13px;font-weight:700;color:#6B7A99;letter-spacing:.06em;margin-bottom:26px}
.k b{color:#13203A}
.band{position:relative;overflow:hidden;padding:14px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.row{display:flex;gap:14px;width:max-content;animation:m 38s linear infinite}
.row.r{animation-direction:reverse;animation-duration:46s;margin-top:14px}
.band:hover .row{animation-play-state:paused}
@keyframes m{to{transform:translateX(-50%)}}
.l{flex:none;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #E3E8F2;border-radius:16px;padding:16px 24px;font-weight:800;font-size:18px;letter-spacing:-.03em;color:#8794B0;transition:all .25s}
.l svg{flex:none;color:var(--c)}
.l:hover{color:#13203A;border-color:#C9D3E8;transform:translateY(-3px);box-shadow:0 14px 24px -16px rgba(19,32,58,.45)}
.hint{text-align:center;margin-top:22px;font-size:12.5px;color:#8794B0}
@media(prefers-reduced-motion:reduce){.row{animation:none}.band{overflow-x:auto}}
</style></head><body>
<div class="w"><div class="k">Powering teams at <b>2,400+</b> companies worldwide</div>
<div class="band"><div class="row" id="a"></div><div class="row r" id="b"></div></div>
<div class="hint">Hover to pause</div></div>
<script>
const L=[['Orbitly','#3B82F6','<circle cx="12" cy="12" r="10" fill="currentColor"/><circle cx="12" cy="12" r="4" fill="#fff"/>'],['Stackline','#10B981','<rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/><path d="M8 12h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>'],['Apex Labs','#F59E0B','<path d="m12 2 10 18H2Z" fill="currentColor"/>'],['Cloudmint','#06B6D4','<path d="M4 12a8 8 0 0 1 16 0v8H4Z" fill="currentColor"/>'],['Quartz','#8B5CF6','<path d="M12 2 22 12 12 22 2 12Z" fill="currentColor"/>'],['Duet','#EC4899','<circle cx="8" cy="12" r="6" fill="currentColor"/><circle cx="16" cy="12" r="6" fill="currentColor" opacity=".55"/>'],['Northwind','#EF4444','<path d="M3 12h18M12 3v18" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>'],['Lumen','#14B8A6','<circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>']];
function fill(el,list){const h=list.map(([n,c,p])=>'<div class="l" style="--c:'+c+'"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>'+n+'</div>').join('');el.innerHTML=h+h}
fill(document.getElementById('a'),L);fill(document.getElementById('b'),L.slice().reverse());
</script></body></html>
