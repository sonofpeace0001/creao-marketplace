<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pointer Hue Tiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0C0C14;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.hd h1{font:700 clamp(24px,4vw,34px)/1 'Unbounded';letter-spacing:-.04em}.hd span{font-size:13px;color:#7B7F9C}
.gd{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:12px}
.tl{--x:50%;--y:50%;--h:0;position:relative;border-radius:22px;overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;cursor:default;isolation:isolate;background:hsl(calc(var(--h)*1deg) 70% 45%);transition:background .25s}
.tl::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x) var(--y),hsl(calc(var(--h)*1deg + 70) 95% 62%),transparent 62%);z-index:-1;transition:opacity .3s}
.tl::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.2),transparent 40%,rgba(0,0,0,.28));z-index:-1}
.tl.w2{grid-column:span 2}.tl.h2{grid-row:span 2}
.tl h2{font:700 17px 'Unbounded';letter-spacing:-.03em;margin-bottom:3px}.tl p{font-size:13px;color:rgba(255,255,255,.8)}.tl b{position:absolute;right:16px;top:14px;font:500 11px 'Inter';letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.tl .hx{position:absolute;left:18px;top:14px;font:500 12px 'Inter';opacity:.9;font-variant-numeric:tabular-nums}
.tl:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:700px){.gd{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="c"><div class="hd"><h1>Hue follows you</h1><span>Move across a tile to shift its colour</span></div>
<div class="gd" id="gd"></div></div>
<script>
const T=[['Warm up','Start at sunrise',210,'w2 h2'],['Focus','Deep work mode',160,''],['Create','Make something',290,''],['Share','Send it out',20,'h2'],['Reflect','Wrap the day',340,''],['Rest','Wind down slowly',120,'w2']];
const gd=document.getElementById('gd'),els=[];let real=false,t=0;
T.forEach((d,i)=>{const e=document.createElement('div');e.className='tl '+d[3];e.tabIndex=0;e.style.setProperty('--h',d[2]);e.innerHTML='<b>0'+(i+1)+'</b><span class="hx"></span><h2>'+d[0]+'</h2><p>'+d[1]+'</p>';gd.appendChild(e);els.push({e,base:d[2],h:d[2]});
 e.addEventListener('pointermove',ev=>{real=true;const r=e.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width;set(i,px,(ev.clientY-r.top)/r.height,true)});
 e.addEventListener('pointerleave',()=>{set(i,.5,.5,false)});e.addEventListener('focus',()=>set(i,.75,.3,true));e.addEventListener('blur',()=>set(i,.5,.5,false))});
function set(i,px,py,act){const o=els[i];o.h=o.base+(act?(px-.5)*120:0);o.e.style.setProperty('--x',(px*100)+'%');o.e.style.setProperty('--y',(py*100)+'%');o.e.style.setProperty('--h',o.h);o.e.querySelector('.hx').textContent='hsl '+Math.round((o.h+360)%360)+'deg'}
els.forEach((o,i)=>set(i,.5,.5,false));set(0,.82,.28,true);set(3,.3,.7,true);
</script></body></html>
