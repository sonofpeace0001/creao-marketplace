<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agent Orchestration Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080A10;color:#E6E9F5;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px;background:#0D1018;border:1px solid #1C2130;border-radius:24px;overflow:hidden;box-shadow:0 40px 80px -40px #000}
.hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #1C2130}.hd b{font-size:15px;font-weight:600}.hd span{display:flex;align-items:center;gap:8px;font:500 12px 'JetBrains Mono',monospace;color:#7C86A6}.hd i{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 10px #34D399;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.35}}
.bd{display:grid;grid-template-columns:1fr 250px}
.gr{position:relative;aspect-ratio:600/330;background:radial-gradient(circle,#161B28 1px,transparent 1.2px) 0 0/20px 20px}
.gr>svg{position:absolute;inset:0;width:100%;height:100%}
.ed{fill:none;stroke:#252B3D;stroke-width:2}.ed.on{stroke:url(#g);stroke-width:2.200}
.dot{fill:#A5B4FC;filter:drop-shadow(0 0 5px #818CF8);opacity:0}.on+.dot,.dot.on{opacity:1}
.nd{position:absolute;width:21.7%;transform:translate(-50%,-50%);background:#131826;border:1px solid #262D42;border-radius:14px;padding:9px 11px;display:flex;align-items:center;gap:9px;transition:all .3s}
.nd i{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--g);color:#fff}
.nd b{display:block;font-size:13px;font-weight:600}.nd span{display:block;font:500 10.5px 'JetBrains Mono',monospace;color:#7C86A6;margin-top:1px}
.nd.run{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px -6px var(--c)}.nd.run span{color:var(--c)}.nd.done span{color:#34D399}
.nd.run i{animation:pu 1.2s infinite}@keyframes pu{50%{transform:scale(1.1)}}
.lg{border-left:1px solid #1C2130;padding:14px 16px;font:400 12px/1.7 'JetBrains Mono',monospace;color:#8C95B3;overflow:hidden;max-height:330px}.lg h4{font:600 11.5px 'Inter Tight';letter-spacing:.14em;text-transform:uppercase;color:#5B6486;margin-bottom:8px}
.lg div{display:flex;gap:8px;opacity:.85}.lg div:last-child{opacity:1;color:#E6E9F5}.lg em{font-style:normal;color:#5B6486}.lg b{font-weight:500;color:var(--c)}
@media(max-width:700px){.bd{grid-template-columns:1fr}.lg{border-left:0;border-top:1px solid #1C2130;max-height:150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="c"><div class="hd"><b>Research assistant run</b><span><i></i>RUNNING  00:14</span></div>
<div class="bd"><div class="gr" id="gr"><svg viewBox="0 0 600 330" preserveAspectRatio="none" id="sv"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs></svg></div>
<div class="lg" id="lg"><h4>Event log</h4></div></div></div>
<script>
const N={planner:{x:90,y:165,t:'Planner',s:'plans tasks',c:'#818CF8',g:'linear-gradient(135deg,#6366F1,#8B5CF6)',p:'M4 6h16M4 12h10M4 18h6'},researcher:{x:300,y:70,t:'Researcher',s:'web + docs',c:'#22D3EE',g:'linear-gradient(135deg,#06B6D4,#3B82F6)',p:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.300-4.300'},coder:{x:300,y:260,t:'Coder',s:'writes code',c:'#FBBF24',g:'linear-gradient(135deg,#F59E0B,#EF4444)',p:'M16 18l6-6-6-6M8 6l-6 6 6 6'},reviewer:{x:510,y:165,t:'Reviewer',s:'checks output',c:'#34D399',g:'linear-gradient(135deg,#10B981,#059669)',p:'M5 12.500l4.500 4.500L19 7'}};
const E=[['planner','researcher','M155 165 C200 165 190 70 235 70'],['planner','coder','M155 165 C200 165 190 260 235 260'],['researcher','reviewer','M365 70 C410 70 400 165 445 165'],['coder','reviewer','M365 260 C410 260 400 165 445 165']];
const st={planner:'idle',researcher:'idle',coder:'idle',reviewer:'idle'};const gr=document.getElementById('gr'),sv=document.getElementById('sv');
E.forEach((e,i)=>{sv.insertAdjacentHTML('beforeend','<path class="ed" id="e'+i+'" d="'+e[2]+'"/><circle class="dot" id="d'+i+'" r="4"><animateMotion dur="1.4s" repeatCount="indefinite" path="'+e[2]+'"/></circle>')});
Object.keys(N).forEach(k=>{const n=N[k],d=document.createElement('div');d.className='nd';d.id='n_'+k;d.style.cssText='left:'+(n.x/6)+'%;top:'+(n.y/3.3)+'%;--c:'+n.c+';--g:'+n.g;d.innerHTML='<i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="'+n.p+'"/></svg></i><div><b>'+n.t+'</b><span></span></div>';gr.appendChild(d)});
const steps=[['planner','run','Plan the report outline'],['planner','done','Outline ready, 4 tasks'],['researcher','run','Searching 12 sources'],['coder','run','Building comparison chart'],['researcher','done','Collected 9 citations'],['coder','done','Chart rendered'],['reviewer','run','Fact checking draft'],['reviewer','done','All checks passed']];
const lg=document.getElementById('lg');let i=0;
function paint(){Object.keys(N).forEach(k=>{const d=document.getElementById('n_'+k);d.className='nd '+(st[k]==='idle'?'':st[k]);d.querySelector('span').textContent=st[k]==='run'?'working...':st[k]==='done'?'done':'idle'});
 E.forEach((e,j)=>{const on=st[e[0]]==='run'||st[e[1]]==='run'||(st[e[0]]==='done'&&st[e[1]]==='run');document.getElementById('e'+j).classList.toggle('on',on);document.getElementById('d'+j).classList.toggle('on',on)})}
function apply(s,log){st[s[0]]=s[1];if(log){const d=document.createElement('div');d.innerHTML='<em>'+String(Math.floor(i*1.7)).padStart(2,'0')+'s</em><span><b style="--c:'+N[s[0]].c+'">'+N[s[0]].t+'</b> '+s[2]+'</span>';lg.appendChild(d);while(lg.children.length>9)lg.children[1].remove()}paint()}
for(let k=0;k<4;k++){i=k;apply(steps[k],true)}i=4;
setInterval(()=>{if(i>=steps.length){i=0;Object.keys(st).forEach(k=>st[k]='idle');while(lg.children.length>1)lg.lastChild.remove();}apply(steps[i],true);i++},1500);
</script></body></html>
