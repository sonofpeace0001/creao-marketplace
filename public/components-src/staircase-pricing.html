<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staircase Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D1018;color:#EEF1FA;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:900px}
.hd{text-align:center;margin-bottom:30px}.hd h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.055em}.hd p{color:#8A91B4;font-size:16px;margin-top:8px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
.sp{position:relative;border-radius:24px 24px 0 0;padding:22px 20px 22px;cursor:default;outline:0;overflow:hidden;background:linear-gradient(180deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.1);border-bottom:0;transition:transform .45s cubic-bezier(.3,1.3,.5,1),box-shadow .4s;height:var(--h)}
.sp::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.sp:hover,.sp.on,.sp:focus-visible{transform:translateY(-12px);box-shadow:0 30px 50px -24px var(--c),0 0 0 1px var(--c)}
.sp:focus-visible{box-shadow:0 0 0 3px #fff}
.sp .ix{position:absolute;right:16px;top:12px;font:800 72px/1 'Sora';letter-spacing:-.08em;color:var(--c);opacity:.14}
.sp h2{font-size:17px;font-weight:700;letter-spacing:-.03em;color:var(--c)}.sp .pr{display:flex;align-items:baseline;gap:4px;margin:8px 0 4px;font-size:40px;font-weight:800;letter-spacing:-.06em}.sp .pr small{font-size:13px;font-weight:500;color:#8A91B4;letter-spacing:0}.sp .ds{font-size:13px;color:#99A0C2;line-height:1.45;min-height:38px}
.sp ul{list-style:none;margin:16px 0;display:grid;gap:9px;font-size:13.5px}.sp li{display:flex;gap:9px;align-items:center;color:#D5D9EE;opacity:0;transform:translateY(8px);transition:all .35s;transition-delay:calc(var(--i)*60ms)}.sp:hover li,.sp.on li,.sp:focus-visible li{opacity:1;transform:none}
.sp li svg{flex:none;color:var(--c)}
.sp .bt{position:absolute;left:20px;right:20px;bottom:20px;border:1.5px solid var(--c);background:transparent;color:var(--c);border-radius:13px;padding:11px;font:700 14px 'Sora';cursor:pointer;opacity:0;transform:translateY(10px);transition:all .35s .15s}.sp:hover .bt,.sp.on .bt,.sp:focus-visible .bt{opacity:1;transform:none}.sp .bt:hover{background:var(--c);color:#0D1018}.sp .bt:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sp .bd{position:absolute;left:20px;bottom:24px;font-size:12.5px;color:#8A91B4;transition:opacity .25s}.sp:hover .bd,.sp.on .bd,.sp:focus-visible .bd{opacity:0}
.bs{height:6px;background:linear-gradient(90deg,#34D399,#38BDF8,#A78BFA,#F472B6);border-radius:6px;margin-top:0}
@media(max-width:760px){.st{grid-template-columns:1fr 1fr;align-items:stretch}.sp{height:auto!important;border-radius:22px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:70px}.sp li{opacity:1;transform:none}.sp .bt{opacity:1;transform:none}.sp .bd{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Climb at your pace</h1><p>Every step up unlocks more room to grow.</p></div><div class="st" id="st"></div><div class="bs"></div></div>
<script>
const P=[['Seed','Free','For side projects and learning the ropes.',['3 projects','Community help','Basic analytics'],'#34D399','#10231F','#0F1822',230],['Sprout','$19','For solo makers launching something real.',['Unlimited projects','Custom domain','Email support','Export data'],'#38BDF8','#0F2231','#101A27',290],['Bloom','$49','For small teams that move quickly.',['10 collaborators','Version history','Priority support','Roles and SSO','API access'],'#A78BFA','#1F1938','#14142A',350],['Canopy','Custom','For organizations with serious needs.',['Unlimited seats','Audit logs','Dedicated manager','99.99% SLA','Custom contracts'],'#F472B6','#341830','#1B1429',410]];
const st=document.getElementById('st');const CK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>';
P.forEach((p,i)=>{const e=document.createElement('div');e.className='sp'+(i===2?' on':'');e.tabIndex=0;e.style.cssText='--c:'+p[4]+';--a:'+p[5]+';--b:'+p[6]+';--h:'+p[7]+'px';e.innerHTML='<span class="ix">'+(i+1)+'</span><h2>'+p[0]+'</h2><div class="pr">'+p[1]+(p[1][0]==='$'?'<small>/mo</small>':'')+'</div><p class="ds">'+p[2]+'</p><ul>'+p[3].map((f,k)=>'<li style="--i:'+k+'">'+CK+f+'</li>').join('')+'</ul><span class="bd">Hover to see what is included</span><button class="bt">'+(i===3?'Contact sales':'Choose '+p[0])+'</button>';
 e.addEventListener('mouseenter',()=>st.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===e)));e.addEventListener('focus',()=>st.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===e)));st.appendChild(e)});
</script></body></html>
