<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rating Breakdown Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EFEBE3;color:#1F1A12;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:820px;background:#FFFDF8;border-radius:28px;padding:30px;display:grid;grid-template-columns:280px 1fr;gap:34px;box-shadow:0 40px 70px -44px rgba(70,50,10,.5),0 0 0 1px rgba(31,26,18,.07)}
.sm{border-right:1px solid #EFE8D8;padding-right:30px}.sm h2{font:700 15px 'Inter';letter-spacing:.02em;color:#8A8068;margin-bottom:6px}.sm .bg{font:700 76px/1 'Fraunces',serif;letter-spacing:-.05em}.sm .st{display:flex;gap:3px;margin:8px 0 6px}.sm .st svg{color:#F59E0B}.sm p{font-size:13.5px;color:#8A8068;margin-bottom:20px}
.br{display:grid;grid-template-columns:18px 1fr 34px;gap:10px;align-items:center;font-size:13px;color:#6B6350;margin-bottom:9px;border:0;background:none;width:100%;cursor:pointer;padding:3px 0;border-radius:8px;text-align:left;font-family:inherit}.br:hover{background:#F8F2E3}.br[aria-pressed=true]{background:#FDEFD0}.br:focus-visible{outline:2px solid #B4491C}
.br .tr{height:8px;border-radius:8px;background:#F0E8D6;overflow:hidden}.br .tr i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#F59E0B,#F97316);transition:width .9s cubic-bezier(.2,.9,.2,1)}.br b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ls h3{font:700 22px 'Fraunces',serif;letter-spacing:-.02em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}.ls h3 span{font:500 13px 'Inter';color:#8A8068}
.rv{border-top:1px solid #F0E9D8;padding:16px 0}.rv:first-of-type{border-top:0;padding-top:0}
.rv .t{display:flex;align-items:center;gap:10px;margin-bottom:8px}.rv .av{width:34px;height:34px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font:700 12px 'Inter'}.rv b{font-size:14.5px}.rv .vf{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:#15803D;background:#DCFCE7;border-radius:99px;padding:2px 8px;margin-left:6px}.rv .rs{margin-left:auto;display:flex;gap:2px;color:#F59E0B}
.rv h4{font-size:15.5px;font-weight:600;margin-bottom:4px}.rv p{font-size:14.5px;line-height:1.55;color:#554E3C}
.rv .ft{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:12.5px;color:#9A907A}.rv .ft button{display:flex;align-items:center;gap:6px;border:1px solid #E8DFCB;background:#fff;border-radius:99px;padding:5px 12px;font:500 12.5px 'Inter';color:#6B6350;cursor:pointer;transition:all .2s}.rv .ft button:hover{border-color:#B4491C;color:#B4491C}.rv .ft button.on{background:#FDEFD0;border-color:#F59E0B;color:#92400E}.rv .ft button:focus-visible{outline:2px solid #B4491C}
.rv.hide{display:none}.mr{margin-top:8px;border:1.5px solid #E8DFCB;background:#fff;border-radius:99px;padding:9px 18px;font:600 13.5px 'Inter';color:#5A5240;cursor:pointer}.mr:hover{border-color:#B4491C;color:#B4491C}.mr:focus-visible{outline:2px solid #B4491C}
@media(max-width:700px){.c{grid-template-columns:1fr}.sm{border-right:0;padding-right:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="sm"><h2>Customer rating</h2><div class="bg">4.8</div><div class="st" id="st"></div><p>Based on 2,418 reviews</p><div id="bs"></div></div>
<div class="ls"><h3>What people say <span id="ct"></span></h3><div id="rv"></div><button class="mr" id="mr">Show all reviews</button></div></div>
<script>
const S='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.900 7.500.7-5.700 5 1.700 7.400L12 18l-6.500 4 1.700-7.400-5.700-5 7.500-.7z"/></svg>';
document.getElementById('st').innerHTML=S.repeat(5);
const B=[[5,78],[4,15],[3,4],[2,2],[1,1]];const R=[[5,'Worth every cent','Setup took ten minutes and the team was productive the same afternoon. Support answered a tricky question in minutes.','Priya Raman','linear-gradient(135deg,#6366F1,#EC4899)',24],[5,'Finally a calm tool','No clutter, no noise. Our designers and engineers stopped fighting over process and started shipping.','Marcus Reid','linear-gradient(135deg,#10B981,#0EA5E9)',18],[4,'Great, with room to grow','Everything we use daily is polished. I would love deeper reporting, but the roadmap looks promising.','Elena Ortiz','linear-gradient(135deg,#F59E0B,#EF4444)',9],[3,'Good but pricey for small teams','Quality is high and onboarding is smooth. The jump between plans is steep when you only need one extra seat.','Tomas Berg','linear-gradient(135deg,#8B5CF6,#06B6D4)',5],[5,'Replaced three other apps','We consolidated tasks, docs and chat. The savings paid for the annual plan within a quarter.','Nora Quinn','linear-gradient(135deg,#EC4899,#F97316)',31]];
let f=0,ex=false;const bs=document.getElementById('bs'),rv=document.getElementById('rv');
B.forEach(b=>{const e=document.createElement('button');e.className='br';e.dataset.s=b[0];e.setAttribute('aria-pressed','false');e.innerHTML='<span>'+b[0]+'</span><span class="tr"><i data-w="'+b[1]+'"></i></span><b>'+b[1]+'%</b>';e.onclick=()=>{f=f===b[0]?0:b[0];bs.querySelectorAll('.br').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.s===f));filter()};bs.appendChild(e)});
R.forEach((r,i)=>{const e=document.createElement('div');e.className='rv';e.dataset.s=r[0];e.innerHTML='<div class="t"><div class="av" style="--g:'+r[4]+'">'+r[3].split(' ').map(x=>x[0]).join('')+'</div><b>'+r[3]+'</b><span class="vf"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>Verified</span><span class="rs">'+S.replace(/16/g,'13').repeat(r[0])+'</span></div><h4>'+r[1]+'</h4><p>'+r[2]+'</p><div class="ft"><button data-n="'+r[5]+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M7 22V11l5-9a2 2 0 0 1 2 2v5h5.500a2 2 0 0 1 2 2.300l-1.500 8A2 2 0 0 1 18 22zM2 11h5v11H2z"/></svg>Helpful <b>'+r[5]+'</b></button><span>2 weeks ago</span></div>';const bt=e.querySelector('button');if(i===0){bt.classList.add('on');bt.querySelector('b').textContent=r[5]+1}bt.onclick=()=>{const on=bt.classList.toggle('on');bt.querySelector('b').textContent=+bt.dataset.n+(on?1:0)};rv.appendChild(e)});
function filter(){let n=0,shown=0;rv.querySelectorAll('.rv').forEach(e=>{const ok=!f||+e.dataset.s===f;if(ok)n++;const vis=ok&&(ex||f||shown<3);if(ok&&vis)shown++;e.classList.toggle('hide',!vis)});document.getElementById('ct').textContent=n+' reviews';const m=document.getElementById('mr');m.style.display=(!f&&n>3)?'inline-block':'none';m.textContent=ex?'Show fewer':'Show all '+n+' reviews'}document.getElementById('mr').onclick=()=>{ex=!ex;filter()};filter();
setTimeout(()=>bs.querySelectorAll('.tr i').forEach(i=>i.style.width=i.dataset.w+'%'),50);bs.querySelectorAll('.tr i').forEach(i=>{i.style.transition='none';i.style.width=i.dataset.w+'%'});requestAnimationFrame(()=>requestAnimationFrame(()=>bs.querySelectorAll('.tr i').forEach(i=>i.style.transition='')));
</script></body></html>
