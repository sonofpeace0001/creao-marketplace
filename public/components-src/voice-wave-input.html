<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Voice Wave Input</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0C14;color:#E9ECF8;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(560px 380px at 50% 100%,rgba(244,63,94,.16),transparent 70%)}
.w{width:100%;max-width:560px;display:grid;gap:16px}
.w h1{font-size:22px;font-weight:800;letter-spacing:-.03em;text-align:center}.w>p{text-align:center;color:#7C84A8;font-size:14px;margin-top:-8px}
.bx{position:relative;display:flex;align-items:center;gap:12px;border-radius:99px;background:#12162A;padding:8px 8px 8px 22px;box-shadow:inset 0 0 0 1.500px rgba(255,255,255,.09);min-height:72px;transition:box-shadow .3s,background .3s}
.bx.rec{background:#1A1224;box-shadow:inset 0 0 0 2px #F43F5E,0 0 0 8px rgba(244,63,94,.1),0 0 50px rgba(244,63,94,.2)}
.tx{flex:1;min-width:0;position:relative;height:30px;overflow:hidden}
.tx input{position:absolute;inset:0;width:100%;border:0;outline:0;background:none;color:#E9ECF8;font:500 17px 'Plus Jakarta Sans';opacity:1;transition:opacity .25s}.tx input::placeholder{color:#5A6285}
.bx.rec .tx input{opacity:0;pointer-events:none}
.wv{position:absolute;inset:0;display:flex;align-items:center;gap:3px;opacity:0;transition:opacity .25s}.bx.rec .wv{opacity:1}
.wv i{flex:1;max-width:5px;min-width:3px;border-radius:3px;background:linear-gradient(180deg,#FB7185,#F43F5E);height:6px;transition:height .09s linear}
.tm{font:500 13px 'JetBrains Mono';color:#F43F5E;display:none;margin-right:2px}.bx.rec .tm{display:block}
.mc{width:56px;height:56px;border:0;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;position:relative;transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .3s}
.mc:active{transform:scale(.92)}.mc svg{width:24px;height:24px}.mc:focus-visible{outline:3px solid #fff;outline-offset:3px}
.bx.rec .mc{background:#F43F5E}.bx.rec .mc::before,.bx.rec .mc::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #F43F5E;animation:rp 1.600s ease-out infinite}.bx.rec .mc::after{animation-delay:.8s}
@keyframes rp{to{transform:scale(1.9);opacity:0}}
.mc .st{display:none}.bx.rec .mc .mi{display:none}.bx.rec .mc .st{display:block}
.cap{min-height:48px;text-align:center;font-size:15px;line-height:1.5;color:#C3C8E4}.cap .cr{display:inline-block;width:2px;height:1em;background:#F43F5E;vertical-align:-2px;animation:bl 1s steps(1) infinite;margin-left:2px}@keyframes bl{50%{opacity:0}}
.cap em{font-style:normal;color:#7C84A8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w"><h1>Say it, don&rsquo;t type it</h1><p>Tap the microphone and speak. We transcribe as you go.</p>
<div class="bx" id="bx"><div class="tx"><input id="in" placeholder="Type a message or tap the mic" aria-label="Message"><div class="wv" id="wv" aria-hidden="true"></div></div><span class="tm" id="tm">0:00</span>
<button class="mc" id="mc" aria-label="Start voice input"><svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg class="st" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.500"/></svg></button></div>
<div class="cap" id="cap" aria-live="polite"><em>Ready when you are.</em></div></div>
<script>
const bx=document.getElementById('bx'),wv=document.getElementById('wv'),mc=document.getElementById('mc'),inp=document.getElementById('in'),cap=document.getElementById('cap'),tm=document.getElementById('tm');
for(let i=0;i<46;i++)wv.appendChild(document.createElement('i'));const bars=[...wv.children];let raf,t0,rec=false,txt='',words=[];
function wave(n){const t=n/1000;bars.forEach((b,i)=>{const env=Math.sin((i/bars.length)*Math.PI),v=(Math.sin(t*7+i*.55)+Math.sin(t*4.3+i*.9)*.7+Math.sin(t*11+i*.3)*.4+2.1)/4.2;b.style.height=(5+env*v*26*(.55+.45*Math.sin(t*1.7)))+'px'});tm.textContent='0:'+String(Math.floor((n-t0)/1000)%60).padStart(2,'0');raf=requestAnimationFrame(wave)}
function start(){cancelAnimationFrame(raf);rec=true;bx.classList.add('rec');mc.setAttribute('aria-label','Stop voice input');t0=performance.now();raf=requestAnimationFrame(wave);cap.innerHTML='<em>Listening&hellip;</em>'}
function stop(){rec=false;bx.classList.remove('rec');mc.setAttribute('aria-label','Start voice input');cancelAnimationFrame(raf);bars.forEach(b=>b.style.height='6px');if(txt){inp.value=txt;cap.innerHTML='<em>Transcribed. Edit it, or send as is.</em>'}else cap.innerHTML='<em>Ready when you are.</em>'}
function say(w){txt+=(txt?' ':'')+w;cap.innerHTML=txt+'<i class="cr"></i>'}
mc.onclick=()=>{if(rec)stop();else{txt='';inp.value='';start()}};
start();'Remind me to send the revised proposal to Amara'.split(' ').forEach(say);
/* Idle demo: recording starts, the waveform reacts, words appear as if spoken, recording stops and the text lands in the field, in a loop. */
let off=false;['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{off=true},{once:true}));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms)),L=['Book a table for four at the harbour restaurant on Saturday evening','Summarise the customer interviews and flag the three biggest complaints','Add a reminder to renew the domain two weeks before it expires'];
 (async()=>{await sleep(3400);let k=0;while(!off){txt='';inp.value='';start();await sleep(900);for(const w of L[k++%L.length].split(' ')){if(off){stop();return}say(w);await sleep(260+Math.random()*180)}await sleep(700);if(off)return;stop();await sleep(3200)}})()}
</script></body></html>
