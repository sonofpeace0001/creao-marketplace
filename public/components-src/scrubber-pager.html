<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scrubber Pager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2F1EC;color:#18181B;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:640px;background:#fff;border-radius:26px;padding:24px;box-shadow:0 40px 70px -44px rgba(24,24,27,.5),0 0 0 1px rgba(24,24,27,.07)}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.hd h1{font-size:20px;font-weight:700;letter-spacing:-.035em}.hd span{font:500 12.5px 'JetBrains Mono',monospace;color:#8A8A92}
.ls{display:grid;gap:8px;min-height:268px}.rw{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:#F8F8F5;animation:in .35s cubic-bezier(.3,1.2,.4,1) both;animation-delay:calc(var(--i)*30ms)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.rw i{width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;color:#fff;font:700 12px 'Inter Tight';font-style:normal}.rw b{font-size:14.5px;font-weight:600;display:block}.rw span{font-size:12.5px;color:#8A8A92}.rw em{font:500 13px 'JetBrains Mono',monospace;font-style:normal;color:#52525B}
.pg{margin-top:20px;padding-top:18px;border-top:1px solid #F0F0EC}
.tr{position:relative;height:44px;margin:0 6px}
.rl{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:4px;background:#ECECE6}.fl{position:absolute;left:0;top:20px;height:4px;border-radius:4px;background:#18181B;width:var(--p)}
.tk{position:absolute;top:14px;width:2px;height:16px;border-radius:2px;background:#D9D9D2;transform:translateX(-1px)}.tk.on{background:#18181B}
.kn{position:absolute;top:10px;left:var(--p);width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff;border:3px solid #18181B;cursor:grab;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 10px rgba(0,0,0,.15)}.kn:active{cursor:grabbing;transform:scale(1.15)}.kn:focus-visible{outline:3px solid #4F46E5;outline-offset:3px}
.bb{position:absolute;left:var(--p);top:-30px;transform:translateX(-50%);background:#18181B;color:#fff;font:500 13px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:8px;white-space:nowrap;pointer-events:none}.bb::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:#18181B;transform:translateX(-50%) rotate(45deg)}
.ct{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.ct button{border:1px solid #E4E4DE;background:#fff;color:#18181B;border-radius:12px;padding:9px 16px;font:600 14px 'Inter Tight';cursor:pointer;display:flex;align-items:center;gap:6px}.ct button:hover:not(:disabled){background:#18181B;color:#fff}.ct button:disabled{opacity:.35;cursor:default}.ct button:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.ct .pn{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#6B6B73;font-weight:500}.ct .pn input{width:54px;border:1.5px solid #E4E4DE;border-radius:10px;padding:7px 8px;text-align:center;font:500 14px 'JetBrains Mono',monospace;outline:0}.ct .pn input:focus{border-color:#18181B}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Invoices</h1><span id="rg"></span></div><div class="ls" id="ls"></div>
<div class="pg"><div class="tr" id="tr" style="--p:0%"><div class="rl"></div><div class="fl"></div><div id="tks"></div><div class="bb" id="bb"></div><button class="kn" id="kn" role="slider" aria-label="Page" aria-valuemin="1" aria-valuemax="24"></button></div>
<div class="ct"><button id="pv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>Prev</button><label class="pn">Go to <input id="gi" type="number" min="1" max="24" aria-label="Page number"> of 24</label><button id="nx">Next<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div></div></div>
<script>
const N=24,PER=5,COL=['#6366F1','#EC4899','#10B981','#F59E0B','#0EA5E9'],NM=['Northwind','Fjord Studio','Helios Labs','Pinecone Ltd','Atlas Freight','Marlow & Finch','Kite Analytics','Lumen Co.'];let pg=7;
const tr=document.getElementById('tr'),kn=document.getElementById('kn');
document.getElementById('tks').innerHTML=Array.from({length:N},(_,i)=>'<i class="tk" style="left:'+(i/(N-1)*100)+'%"></i>').join('');const T=[...document.querySelectorAll('.tk')];
function render(){tr.style.setProperty('--p',((pg-1)/(N-1)*100)+'%');T.forEach((t,i)=>t.classList.toggle('on',i<pg));document.getElementById('bb').textContent='Page '+pg;kn.setAttribute('aria-valuenow',pg);document.getElementById('gi').value=pg;document.getElementById('pv').disabled=pg===1;document.getElementById('nx').disabled=pg===N;
 const s=(pg-1)*PER;document.getElementById('rg').textContent=(s+1)+' to '+(s+PER)+' of '+N*PER;document.getElementById('ls').innerHTML=Array.from({length:PER},(_,i)=>{const n=s+i+1,nm=NM[(n*3)%NM.length];return '<div class="rw" style="--i:'+i+';--c:'+COL[(n)%5]+'"><i>'+nm.slice(0,2).toUpperCase()+'</i><div><b>'+nm+'</b><span>INV-'+String(2000+n)+' · Nov '+((n%28)+1)+'</span></div><em>$'+(((n*379)%4800)+240).toLocaleString()+'</em></div>'}).join('')}
function set(p){pg=Math.max(1,Math.min(N,Math.round(p)));render()}
function fromX(x){const r=tr.getBoundingClientRect();return 1+Math.max(0,Math.min(1,(x-r.left)/r.width))*(N-1)}
let dg=false;tr.addEventListener('pointerdown',e=>{dg=true;tr.setPointerCapture(e.pointerId);set(fromX(e.clientX))});tr.addEventListener('pointermove',e=>{if(dg)set(fromX(e.clientX))});tr.addEventListener('pointerup',()=>dg=false);
kn.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();set(pg+1)}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();set(pg-1)}if(e.key==='Home')set(1);if(e.key==='End')set(N)});
document.getElementById('pv').onclick=()=>set(pg-1);document.getElementById('nx').onclick=()=>set(pg+1);document.getElementById('gi').addEventListener('change',e=>set(+e.target.value||pg));render();
</script></body></html>
