<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Multi-Select Chip Checkbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F0E8DC;color:#241A12;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{position:relative;width:100%;max-width:560px;background:#FFFCF7;border-radius:30px;padding:28px 26px 96px;box-shadow:0 40px 56px -34px rgba(36,26,18,.5),inset 0 0 0 1px rgba(36,26,18,.08);overflow:hidden}
.hd small{font:500 12px 'DM Mono';letter-spacing:.14em;color:#B0714A;text-transform:uppercase}.hd h1{font:800 31px/1.05 'Bricolage Grotesque';letter-spacing:-.045em;margin:6px 0 6px}.hd p{font-size:15px;color:#7D6A5A;margin-bottom:20px}
.gr{display:flex;flex-wrap:wrap;gap:9px}
.ch{position:relative;display:flex;align-items:center;gap:9px;padding:9px 15px 9px 10px;border:0;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.5px #E7D9C8;font:700 14.500px 'Bricolage Grotesque';color:#4A3A2C;cursor:pointer;transition:background .3s,color .3s,box-shadow .3s,transform .4s cubic-bezier(.3,2,.5,1)}
.ch .ic{position:relative;width:22px;height:22px;border-radius:50%;background:#F3E9DC;display:grid;place-items:center;transition:background .3s,transform .5s cubic-bezier(.3,1.8,.5,1)}.ch .ic::before,.ch .ic::after{content:"";position:absolute;left:50%;top:50%;background:#9A7E66;border-radius:1px;transition:all .35s cubic-bezier(.3,1.6,.5,1)}.ch .ic::before{width:10px;height:2px;margin:-1px 0 0 -5px}.ch .ic::after{width:2px;height:10px;margin:-5px 0 0 -1px}
.ch.on{background:var(--c);color:#fff;box-shadow:none;transform:scale(1.04)}.ch.on .ic{background:rgba(255,255,255,.28);transform:rotate(360deg)}.ch.on .ic::before{width:6px;height:2.500px;margin:1px 0 0 -6px;transform:rotate(45deg);background:#fff}.ch.on .ic::after{width:2.500px;height:11px;margin:-8px 0 0 2px;transform:rotate(45deg);background:#fff}
.ch:focus-visible{outline:3px solid #241A12;outline-offset:2px}
.bar{position:absolute;left:18px;right:18px;bottom:18px;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 18px;border-radius:22px;background:#241A12;color:#fff;transform:translateY(calc((1 - var(--v,0))*120px));opacity:var(--v,0);transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.bar .av{display:flex;flex:1;min-width:0}.bar .av i{width:30px;height:30px;border-radius:50%;margin-left:-8px;background:var(--c);display:grid;place-items:center;font-size:14px;font-style:normal;box-shadow:0 0 0 2.500px #241A12;animation:pp .45s cubic-bezier(.3,2,.5,1)}.bar .av i:first-child{margin-left:0}@keyframes pp{from{transform:scale(0)}}
.bar b{font-size:14.500px;font-weight:700;white-space:nowrap}.bar b span{display:inline-block;min-width:1.2ch;font-variant-numeric:tabular-nums}.bar button{border:0;border-radius:15px;padding:12px 20px;background:#FF8A4C;color:#2A1305;font:800 14.500px 'Bricolage Grotesque';cursor:pointer;transition:transform .15s}.bar button.pr{transform:scale(.94)}.bar button:focus-visible{outline:3px solid #fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="cd"><div class="hd"><small>Step 2 of 4</small><h1>What are you into?</h1><p>Pick at least three. We will tune your feed to match.</p></div><div class="gr" id="gr"></div>
<div class="bar" id="bar"><div class="av" id="av"></div><b><span id="n">0</span> selected</b><button id="go">Continue</button></div></div>
<script>
const T=[['🎨','Design','#E5522B'],['💻','Code','#2563EB'],['📈','Growth','#16A34A'],['🎧','Audio','#9333EA'],['📷','Photo','#DB2777'],['✈️','Travel','#0891B2'],['🍳','Cooking','#EA580C'],['🎮','Games','#4F46E5'],['📚','Books','#B45309'],['🌱','Nature','#15803D'],['🎬','Film','#BE123C'],['🏃','Fitness','#0D9488'],['🧠','Science','#7C3AED'],['🧶','Craft','#C2410C']];
const gr=document.getElementById('gr'),av=document.getElementById('av'),sl=t=>new Promise(r=>setTimeout(r,t));const sel=new Set([0,2,4,9]);let off=false;const els=T.map((t,i)=>{const b=document.createElement('button');b.className='ch';b.style.setProperty('--c',t[2]);b.setAttribute('aria-pressed','false');b.innerHTML='<span class="ic"></span>'+t[0]+' '+t[1];b.onclick=()=>{off=true;tog(i)};gr.appendChild(b);return b});
function paint(inst){els.forEach((e,i)=>{e.classList.toggle('on',sel.has(i));e.setAttribute('aria-pressed',sel.has(i))});document.getElementById('n').textContent=sel.size;document.getElementById('bar').style.setProperty('--v',sel.size?1:0);const have=[...av.children].map(c=>+c.dataset.i);[...sel].forEach(i=>{if(!have.includes(i)){const a=document.createElement('i');a.dataset.i=i;a.style.setProperty('--c',T[i][2]);a.textContent=T[i][0];av.appendChild(a)}});[...av.children].forEach(c=>{if(!sel.has(+c.dataset.i))c.remove()});document.getElementById('go').textContent=sel.size>=3?'Continue':'Pick '+(3-sel.size)+' more'}
function tog(i){sel.has(i)?sel.delete(i):sel.add(i);paint()}
els.forEach(e=>e.style.transition='none');document.getElementById('bar').style.transition='none';paint();[...av.children].forEach(c=>c.style.animation='none');requestAnimationFrame(()=>requestAnimationFrame(()=>{els.forEach(e=>e.style.transition='');document.getElementById('bar').style.transition=''}));
document.querySelector('.cd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: interest chips turn into checkboxes with a satisfying morph, the plus in each round badge spins a full turn and becomes a tick while the chip fills with its own colour and swells slightly; a dark action bar springs up from the bottom with a growing stack of emoji avatars and a live count, the Continue button presses itself once enough are picked, then the selection clears chip by chip and starts again, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);const add=[1,6,11,3,12];while(!off){for(const i of add){if(off)return;tog(i);await sl(650)}await sl(700);const g=document.getElementById('go');g.classList.add('pr');await sl(260);g.classList.remove('pr');await sl(1800);if(off)return;for(const i of [...sel]){if(off)return;tog(i);await sl(160)}await sl(900);[0,2,4,9].forEach(i=>sel.add(i));paint();await sl(1400)}})()}
</script></body></html>
