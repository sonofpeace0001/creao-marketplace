<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Logo Spotlight Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Fraunces:wght@700&family=Space+Grotesk:wght@700&family=Playfair+Display:wght@700&family=DM+Serif+Display&family=Outfit:wght@700&family=Syne:wght@800&family=Instrument+Serif&family=Bricolage+Grotesque:wght@800&family=Unbounded:wght@600&family=Plus+Jakarta+Sans:wght@800&family=Fredoka:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0B10;color:#EEF0F8;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:900px}
.hd{text-align:center;margin-bottom:30px}.hd small{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#7C8198}.hd h1{font:700 clamp(26px,4.4vw,40px)/1.12 'Sora';letter-spacing:-.05em;margin-top:10px}
.gd{--x:-999px;--y:-999px;position:relative;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #1B1E2A;border-radius:26px;overflow:hidden;background:#0E1017}
.cl{position:relative;height:130px;display:grid;place-items:center;border:0.5px solid #1B1E2A;overflow:hidden}
.cl .lg{display:flex;align-items:center;gap:10px;color:#6A7090;transition:color .3s}.cl .lg svg{width:30px;height:30px}.cl .lg b{font-size:23px;letter-spacing:-.02em;white-space:nowrap}
.cl .cc{position:absolute;inset:0;display:grid;place-items:center;-webkit-mask:radial-gradient(210px circle at calc(var(--x) - var(--l)) calc(var(--y) - var(--t)),#000 0,transparent 100%);mask:radial-gradient(210px circle at calc(var(--x) - var(--l)) calc(var(--y) - var(--t)),#000 0,transparent 100%);pointer-events:none}
.cl .cc .lg{color:var(--c)}
.gd::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x) var(--y),rgba(129,140,248,.1),transparent 70%);pointer-events:none}
.ft{text-align:center;margin-top:24px;font-size:14.5px;color:#7C8198}.ft a{color:#A5B4FC;text-decoration:none;font-weight:600;margin-left:6px}.ft a:focus-visible{outline:2px solid #A5B4FC;border-radius:4px}
@media(max-width:700px){.gd{grid-template-columns:repeat(2,1fr)}.cl{height:100px}}
</style></head><body>
<div class="c"><div class="hd"><small>Customers</small><h1>The best teams build with us</h1></div><div class="gd" id="gd"></div><div class="ft">Move your cursor to light up the logos. <a href="#">Read the customer stories</a></div></div>
<script>
const ICO={circle:'<circle cx="12" cy="12" r="9" fill="currentColor"/>',tri:'<path d="M12 3 22 20H2z" fill="currentColor"/>',sun:'<circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4M4.200 4.200l2.800 2.800M17 17l2.800 2.800M4.200 19.800 7 17M17 7l2.800-2.800" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',hex:'<path d="M12 2 21 7v10l-9 5-9-5V7z" fill="currentColor"/>',sq:'<rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor"/><rect x="8" y="8" width="8" height="8" rx="2" fill="#0E1017"/>',wave:'<path d="M2 14c3-6 5-6 8 0s5 6 8 0 3-4 4-4" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/>',bulb:'<path d="M12 2a7 7 0 0 0-4 12.700V18h8v-3.300A7 7 0 0 0 12 2zM9 21h6" fill="currentColor" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"/>',ring:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="19" cy="6" r="2.500" fill="currentColor"/>',diamond:'<path d="M12 2 22 12 12 22 2 12z" fill="currentColor"/>',cloud:'<path d="M7 18a5 5 0 1 1 1-9.900A6 6 0 0 1 19.500 11 3.500 3.500 0 0 1 18 18z" fill="currentColor"/>',bird:'<path d="M2 8c4 0 6 2 8 5 1-2 3-4 6-4l-2 3c3 0 5 1 6 3-3 0-4 1-5 2-1 4-5 6-9 5 3-1 4-3 4-5-4 0-7-3-8-9z" fill="currentColor"/>',leaf:'<path d="M20 4C9 4 4 9 4 16c0 2 .5 3 1 4 1-4 4-7 9-9-5 3-7 6-8 10 8 1 14-5 14-17z" fill="currentColor"/>'};
const L=[['Northwind','circle','Sora','#60A5FA'],['Fjord','tri','Fraunces','#22D3EE'],['Helios','sun','Space Grotesk','#FBBF24'],['Pinecone','hex','Playfair Display','#4ADE80'],['Atlas','sq','DM Serif Display','#F87171'],['Marlow','wave','Outfit','#A78BFA'],['Lumen','bulb','Syne','#FACC15'],['Orbit','ring','Instrument Serif','#F472B6'],['Vertex','diamond','Bricolage Grotesque','#2DD4BF'],['Nimbus','cloud','Unbounded','#818CF8'],['Kestrel','bird','Plus Jakarta Sans','#FB923C'],['Quill','leaf','Fredoka','#34D399']];
const gd=document.getElementById('gd');L.forEach(l=>{const e=document.createElement('div');e.className='cl';const lg='<div class="lg" style="font-family:\''+l[2]+'\',sans-serif"><svg viewBox="0 0 24 24">'+ICO[l[1]]+'</svg><b>'+l[0]+'</b></div>';e.style.setProperty('--c',l[3]);e.innerHTML=lg+'<div class="cc">'+lg+'</div>';gd.appendChild(e)});
const cls=[...gd.children];function lay(){const g=gd.getBoundingClientRect();cls.forEach(c=>{const r=c.getBoundingClientRect();c.style.setProperty('--l',(r.left-g.left)+'px');c.style.setProperty('--t',(r.top-g.top)+'px')})}
function set(x,y){gd.style.setProperty('--x',x+'px');gd.style.setProperty('--y',y+'px')}
lay();addEventListener('resize',lay);let real=false,tt=.5;gd.addEventListener('pointermove',e=>{real=true;const r=gd.getBoundingClientRect();set(e.clientX-r.left,e.clientY-r.top)});gd.addEventListener('pointerleave',()=>real=false);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;function f(){if(!real){tt+=.012;const r=gd.getBoundingClientRect();set(r.width*(.5+Math.cos(tt)*.42),r.height*(.5+Math.sin(tt*1.3)*.4))}if(!reduce)requestAnimationFrame(f)}
set(gd.getBoundingClientRect().width*.35,gd.getBoundingClientRect().height*.4);(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{lay();f()});
</script></body></html>
