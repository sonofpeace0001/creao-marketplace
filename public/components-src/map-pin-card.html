<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Store Locator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F1EFE8;min-height:100vh;display:grid;place-items:center;padding:34px 20px;font-family:'Plus Jakarta Sans',sans-serif;color:#1C2B24;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:820px;display:grid;grid-template-columns:1.5fr 1fr;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -34px rgba(28,43,36,.45),0 0 0 1px rgba(28,43,36,.07)}
.map{position:relative;min-height:380px;background:#E9EDE3}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.p{position:absolute;transform:translate(-50%,-100%);width:36px;height:46px;border:0;background:none;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.5,.4,1)}
.p svg{position:static;width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(28,43,36,.35))}
.p path{fill:#9AA79F;transition:fill .2s}.p circle{fill:#fff}
.p:hover,.p:focus-visible{transform:translate(-50%,-100%) scale(1.15);outline:0}
.p[aria-pressed=true]{transform:translate(-50%,-100%) scale(1.3);z-index:3}.p[aria-pressed=true] path{fill:#E8530E}
.pnl{padding:28px 26px;display:flex;flex-direction:column}
.pnl small{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#E8530E}
.pnl h1{font-size:25px;letter-spacing:-.04em;line-height:1.05;margin:8px 0 4px;font-weight:800}
.pnl .ad{color:#6A7A72;font-size:14.5px;line-height:1.5}
.hr{margin:20px 0;display:grid;gap:9px;font-size:14px}
.hr div{display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1px dashed #D6DCD3}
.hr b{font-weight:700}.hr span{color:#6A7A72}
.tg{display:flex;gap:7px;flex-wrap:wrap}.tg i{font-style:normal;font-size:12px;font-weight:700;background:#EEF3EA;color:#34594A;padding:5px 10px;border-radius:99px}
.go{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:8px;background:#1C2B24;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;padding:14px;border-radius:14px;transition:transform .2s;margin-top:22px}
.go:hover{transform:translateY(-2px)}
.sw{animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
@media(max-width:680px){.w{grid-template-columns:1fr}.map{min-height:260px}}
@media(prefers-reduced-motion:reduce){.sw{animation:none}*{transition:none!important}}
</style></head><body>
<div class="w"><div class="map"><svg viewBox="0 0 520 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="520" height="380" fill="#E9EDE3"/><path d="M-20 300C80 270 140 330 240 310S400 250 540 290V400H-20Z" fill="#BFDDE6"/><rect x="330" y="40" width="150" height="90" rx="14" fill="#CFE3C0"/><g fill="#F7F5EE"><rect x="24" y="30" width="110" height="70" rx="8"/><rect x="154" y="30" width="150" height="70" rx="8"/><rect x="24" y="130" width="70" height="90" rx="8"/><rect x="114" y="130" width="130" height="90" rx="8"/><rect x="264" y="130" width="196" height="90" rx="8"/></g><g stroke="#fff" stroke-width="12" fill="none"><path d="M-10 114H540M-10 238H540M104 -10V400M254 -10V260M318 -10V260"/></g><g stroke="#FFD58A" stroke-width="4" fill="none"><path d="M-10 114H540"/></g></svg>
 <button class="p" style="left:24%;top:34%" aria-pressed="true" data-i="0" aria-label="SoHo store"><svg viewBox="0 0 34 46"><path d="M17 1C8.200 1 1 8 1 16.800 1 28.500 17 45 17 45s16-16.500 16-28.200C33 8 25.800 1 17 1Z"/><circle cx="17" cy="17" r="6"/></svg></button>
 <button class="p" style="left:54%;top:52%" aria-pressed="false" data-i="1" aria-label="Williamsburg store"><svg viewBox="0 0 34 46"><path d="M17 1C8.200 1 1 8 1 16.800 1 28.500 17 45 17 45s16-16.500 16-28.200C33 8 25.800 1 17 1Z"/><circle cx="17" cy="17" r="6"/></svg></button>
 <button class="p" style="left:78%;top:30%" aria-pressed="false" data-i="2" aria-label="Dumbo store"><svg viewBox="0 0 34 46"><path d="M17 1C8.200 1 1 8 1 16.800 1 28.500 17 45 17 45s16-16.500 16-28.200C33 8 25.800 1 17 1Z"/><circle cx="17" cy="17" r="6"/></svg></button></div>
 <div class="pnl"><div class="sw" id="s"></div><a class="go" href="#">Get directions <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div></div>
<script>
const S=[['SoHo','Mercer & Co. — SoHo','112 Mercer Street, New York, NY','Mon–Sat','10am – 8pm','Sunday','11am – 6pm',['Flagship','Try-on bar']],['Williamsburg','Mercer & Co. — Williamsburg','48 N 6th Street, Brooklyn, NY','Mon–Sat','11am – 9pm','Sunday','12pm – 7pm',['Pickup','Repairs']],['Dumbo','Mercer & Co. — Dumbo','9 Water Street, Brooklyn, NY','Mon–Sun','10am – 7pm','Holidays','Closed',['Pickup','Gift wrap']]];
const s=document.getElementById('s'),ps=[...document.querySelectorAll('.p')];
function show(i){const d=S[i];s.classList.remove('sw');void s.offsetWidth;s.classList.add('sw');s.innerHTML='<small>'+d[0]+'</small><h1>'+d[1]+'</h1><div class="ad">'+d[2]+'</div><div class="hr"><div><b>'+d[3]+'</b><span>'+d[4]+'</span></div><div><b>'+d[5]+'</b><span>'+d[6]+'</span></div></div><div class="tg">'+d[7].map(t=>'<i>'+t+'</i>').join('')+'</div>';ps.forEach(p=>p.setAttribute('aria-pressed',+p.dataset.i===i))}
ps.forEach(p=>p.addEventListener('click',()=>show(+p.dataset.i)));show(0);
</script></body></html>
