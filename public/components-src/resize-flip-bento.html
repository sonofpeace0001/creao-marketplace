<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Resize Flip Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F1ECE2;color:#2A2013;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:880px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:10px}.hd h1{font-size:30px;font-weight:800;letter-spacing:-.05em}.hd p{font-size:14.5px;color:#8A7A5E;margin-top:3px}.hd button{border:2px solid #2A2013;background:#fff;border-radius:99px;padding:8px 16px;font:600 13.5px 'Outfit';cursor:pointer;box-shadow:3px 3px 0 #2A2013}.hd button:active{transform:translate(3px,3px);box-shadow:none}.hd button:focus-visible{outline:3px solid #2563EB;outline-offset:3px}
.gd{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:130px;grid-auto-flow:dense;gap:12px}
.tl{position:relative;border:2.5px solid #2A2013;border-radius:22px;background:var(--bg);overflow:hidden;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:4px 4px 0 #2A2013;display:flex;flex-direction:column;justify-content:space-between;min-width:0;outline:0;transition:box-shadow .2s}
.tl:hover{box-shadow:6px 6px 0 #2A2013}.tl:focus-visible{outline:3px solid #2563EB;outline-offset:3px}
.tl.w2{grid-column:span 2}.tl.h2{grid-row:span 2}
.tl .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.tl h2{font-size:19px;font-weight:800;letter-spacing:-.04em;line-height:1.05}.tl .sz{flex:none;font:700 11px 'Outfit';background:#2A2013;color:#fff;border-radius:99px;padding:3px 9px;letter-spacing:.06em}
.tl .bd{font-size:14px;line-height:1.45;opacity:0;max-height:0;overflow:hidden;transition:opacity .3s .15s}.tl.w2 .bd,.tl.h2 .bd{opacity:.85;max-height:80px}
.tl .vz{align-self:stretch;flex:1;display:none;align-items:flex-end;gap:6px;padding-top:8px}.tl.h2 .vz{display:flex}.tl .vz i{flex:1;border-radius:6px 6px 2px 2px;background:#2A2013;opacity:.8;height:var(--h)}
.tl .big{font-size:44px;font-weight:800;letter-spacing:-.06em;line-height:1}.tl.w2 .big,.tl.h2 .big{font-size:54px}
.tl .ic{width:34px;height:34px;border-radius:11px;background:#2A2013;color:#fff;display:grid;place-items:center}
@media(max-width:720px){.gd{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Make it yours</h1><p>Click any tile to cycle its size. The grid reflows with a smooth layout animation.</p></div><button id="sh">Shuffle</button></div><div class="gd" id="gd"></div></div>
<script>
const T=[['Revenue','$48k','#FFD166','M3 3v18h18M7 14l4-4 4 4 5-6','Up 12% on last month and trending.','w2'],['Users','2.9k','#8ECAE6','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8','Daily active across all regions.',''],['Tasks','18','#F4A6C0','M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9','Open items assigned to you.','h2'],['Uptime','99.9%','#B8E0B4','M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z','Rolling twelve month average.',''],['Orders','1.2k','#FFB38A','M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18','Fulfilled within SLA this week.',''],['NPS','72','#C9B6F2','M12 3l3 6.900 7.500.7-5.700 5 1.700 7.400L12 18l-6.500 4 1.700-7.400-5.700-5 7.500-.7z','Survey score from 340 replies.','w2']];
const SZ=['','w2','w2 h2','h2'];const gd=document.getElementById('gd');const ST=T.map(t=>SZ.indexOf(t[5]));
function lbl(s){return ['1x1','2x1','2x2','1x2'][s]}
function render(){gd.innerHTML='';T.forEach((t,i)=>{const b=document.createElement('button');b.className='tl '+SZ[ST[i]];b.dataset.i=i;b.style.setProperty('--bg',t[2]);b.innerHTML='<div class="t"><h2>'+t[0]+'</h2><span class="sz">'+lbl(ST[i])+'</span></div><div class="big">'+t[1]+'</div><div class="bd">'+t[4]+'</div><div class="vz">'+[40,64,50,80,58,92,70].map(h=>'<i style="--h:'+h+'%"></i>').join('')+'</div>';b.onclick=()=>cyc(i);gd.appendChild(b)})}
function flip(fn){const pos=new Map();[...gd.children].forEach(e=>pos.set(e.dataset.i,e.getBoundingClientRect()));fn();[...gd.children].forEach(e=>{const o=pos.get(e.dataset.i),n=e.getBoundingClientRect();if(!o)return;const dx=o.left-n.left,dy=o.top-n.top,sx=o.width/n.width,sy=o.height/n.height;if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(sx-1)<.01&&Math.abs(sy-1)<.01)return;e.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')'},{transform:'none'}],{duration:480,easing:'cubic-bezier(.3,1.2,.5,1)'})})}
function cyc(i){ST[i]=(ST[i]+1)%4;const e=gd.querySelector('[data-i="'+i+'"]');flip(()=>{e.className='tl '+SZ[ST[i]];e.querySelector('.sz').textContent=lbl(ST[i])})}
document.getElementById('sh').onclick=()=>{const k=[...gd.children];const ord=k.map((_,i)=>i).sort(()=>Math.random()-.5);flip(()=>ord.forEach(o=>gd.appendChild(k[o])))};
render();
</script></body></html>
