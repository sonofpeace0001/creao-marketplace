<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crossing Ribbons CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F0E6;color:#111;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 0;overflow:hidden;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;height:520px;display:grid;place-items:center;overflow:hidden}
.rb{position:absolute;left:-10%;width:120%;height:84px;display:flex;align-items:center;overflow:hidden;border-top:3px solid #111;border-bottom:3px solid #111}
.r1{transform:rotate(-8deg);background:#FF4D2E;color:#111}.r2{transform:rotate(8deg);background:#111;color:#F4F0E6}
.tk{display:flex;flex:none;white-space:nowrap;animation:mq 22s linear infinite}.r2 .tk{animation-direction:reverse;animation-duration:26s}
@keyframes mq{to{transform:translateX(-50%)}}
.tk span{font:400 44px/1 'Anton',sans-serif;letter-spacing:.02em;text-transform:uppercase;padding:0 22px;display:flex;align-items:center;gap:44px}.tk span::after{content:"";width:16px;height:16px;border-radius:50%;background:currentColor;opacity:.9}
.cd{position:relative;z-index:5;width:min(440px,92%);background:#fff;border:3px solid #111;border-radius:26px;padding:30px 30px 26px;text-align:center;box-shadow:9px 9px 0 #111}
.cd small{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:#FFE14D;border:2px solid #111;border-radius:99px;padding:4px 12px;margin-bottom:14px}
.cd h1{font:400 clamp(38px,7vw,56px)/.98 'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.cd p{font-size:15.5px;line-height:1.5;color:#555;margin:12px 0 20px}
.bt{display:inline-flex;align-items:center;gap:10px;background:#FF4D2E;color:#111;border:3px solid #111;border-radius:16px;padding:14px 26px;font:700 16px 'Space Grotesk';text-decoration:none;box-shadow:4px 4px 0 #111;transition:transform .12s,box-shadow .12s}.bt:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #111}.bt:active{transform:translate(4px,4px);box-shadow:0 0 0 #111}.bt:focus-visible{outline:3px solid #2563EB;outline-offset:4px}
@media(prefers-reduced-motion:reduce){.tk{animation:none}}
</style></head><body>
<div class="st"><div class="rb r1"><div class="tk" id="t1"></div></div><div class="rb r2"><div class="tk" id="t2"></div></div>
<div class="cd"><small>No credit card</small><h1>Start building now</h1><p>Join thousands of makers shipping with the fastest component library on the web.</p><a class="bt" href="#">Get started free<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div></div>
<script>
function fill(id,t){const e=document.getElementById(id);let h='';for(let i=0;i<12;i++)h+='<span>'+t+'</span>';e.innerHTML=h}
fill('t1','Ship it today');fill('t2','Start building now');
</script></body></html>
