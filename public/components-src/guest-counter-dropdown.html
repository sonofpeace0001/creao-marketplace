<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Guest Counter Dropdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EDE2;color:#241C10;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:start center;padding:3vh 14px 24px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(600px 400px at 90% 0,rgba(255,138,76,.18),transparent 70%)}
.w{position:relative;width:100%;max-width:520px}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;border-radius:26px;background:#fff;box-shadow:0 20px 34px -22px rgba(36,28,16,.5),inset 0 0 0 1px rgba(36,28,16,.08)}
.f{padding:14px 20px;border-right:1px solid #F0E8D8}.f:last-child{border:0}.f small{display:block;font:500 11px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:#A39578}.f b{font-size:15.500px;font-weight:700}
.tr{border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;border-radius:0 26px 26px 0;position:relative;transition:background .2s}
.tr:hover,.tr[aria-expanded=true]{background:#FFF4EA}.tr:focus-visible{outline:3px solid #E8590C;outline-offset:-3px}
.tr b{display:block;transition:color .3s}.tr b.pop{animation:bp .45s cubic-bezier(.3,1.8,.5,1)}@keyframes bp{40%{transform:translateY(-3px);color:#E8590C}}
.go{position:absolute;right:10px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;background:#E8590C;display:grid;place-items:center}.go svg{width:17px;height:17px}.go svg *{fill:none;stroke:#fff;stroke-width:2.600;stroke-linecap:round}
.pp{position:absolute;right:0;top:82px;width:min(360px,100%);border-radius:26px;background:#fff;padding:10px 20px 18px;box-shadow:0 34px 60px -16px rgba(36,28,16,.5),inset 0 0 0 1px rgba(36,28,16,.09);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .22s,transform .35s cubic-bezier(.3,1.5,.5,1);z-index:5}
.pp.on{opacity:1;transform:none;pointer-events:auto}
.r{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F3ECDD}.r:nth-last-child(2){border:0}
.r b{display:block;font-size:17px;font-weight:700}.r span{font-size:13px;color:#9A8C70}
.st{display:flex;align-items:center;gap:14px}
.st button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 1.500px #D8CDB6;color:#241C10;display:grid;place-items:center;cursor:pointer;transition:all .2s cubic-bezier(.3,1.6,.5,1)}
.st button:hover:not(:disabled){box-shadow:inset 0 0 0 1.500px #241C10;transform:scale(1.08)}.st button:active:not(:disabled){transform:scale(.9)}.st button:disabled{opacity:.3;cursor:not-allowed}.st button:focus-visible{outline:3px solid #E8590C;outline-offset:2px}
.st button svg{width:16px;height:16px}.st button svg *{fill:none;stroke:currentColor;stroke-width:2.600;stroke-linecap:round}
.st .nm{display:inline-block;height:1.2em;overflow:hidden;min-width:1.4ch;text-align:center;font:800 22px/1.2 'Bricolage Grotesque';font-variant-numeric:tabular-nums}.st .nm span{display:block;transition:transform .4s cubic-bezier(.3,1.3,.4,1);color:#241C10;font-size:22px}
.pt{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;border-top:1px solid #F3ECDD}.pt b{font-size:15px}.pt .sw{width:46px;height:28px;border-radius:99px;border:0;background:#E5DCC8;position:relative;cursor:pointer;transition:background .3s}.pt .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .4s cubic-bezier(.3,1.8,.45,.9)}.pt .sw[aria-checked=true]{background:#E8590C}.pt .sw[aria-checked=true]::after{transform:translateX(18px)}.pt .sw:focus-visible{outline:3px solid #E8590C;outline-offset:2px}
.dn{width:100%;margin-top:12px;border:0;border-radius:16px;padding:15px;background:#241C10;color:#fff;font:700 15px 'Bricolage Grotesque';cursor:pointer}.dn:focus-visible{outline:3px solid #E8590C;outline-offset:3px}
.hl{margin-top:34px;border-radius:26px;height:360px;background:linear-gradient(135deg,#FFB27A,#F472B6 55%,#6366F1);position:relative;overflow:hidden}.hl::before{content:"";position:absolute;right:16%;top:18%;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.7)}.hl::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40%;height:80%;border-radius:50% 50% 0 0;background:rgba(40,20,90,.5)}
.hl span{position:absolute;left:22px;bottom:18px;z-index:2;color:#fff;font-size:24px;font-weight:800;letter-spacing:-.04em}
@media(max-width:560px){.bar{grid-template-columns:1fr 1fr}.f:nth-child(2){border-right:0}.tr{grid-column:1/-1;border-top:1px solid #F0E8D8;border-radius:0 0 26px 26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="w" id="w"><div class="bar"><div class="f"><small>Check in</small><b>12 Dec</b></div><div class="f"><small>Check out</small><b>19 Dec</b></div><button class="f tr" id="tr" aria-haspopup="dialog" aria-expanded="false"><small>Guests</small><b id="sm">2 guests</b><span class="go"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></svg></span></button></div>
<div class="pp" id="pp" role="dialog" aria-label="Guests"></div><div class="hl"><span>Casa Verde, Lisbon</span></div></div>
<script>
const G=[['Adults','Ages 13 or above',1,8,2],['Children','Ages 2 to 12',0,6,1],['Infants','Under 2',0,4,0]];
const pp=document.getElementById('pp'),tr=document.getElementById('tr'),sm=document.getElementById('sm');const V=G.map(g=>g[4]);let open=false,pets=false;
pp.innerHTML=G.map((g,i)=>'<div class="r"><div><b>'+g[0]+'</b><span>'+g[1]+'</span></div><div class="st"><button data-i="'+i+'" data-d="-1" aria-label="Fewer '+g[0].toLowerCase()+'"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><span class="nm" aria-live="polite"><span>'+g[4]+'</span></span><button data-i="'+i+'" data-d="1" aria-label="More '+g[0].toLowerCase()+'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>').join('')+'<div class="pt"><b>Bringing a pet?</b><button class="sw" role="switch" aria-checked="false" aria-label="Bringing a pet"></button></div><button class="dn" id="dn">Done</button>';
const nm=[...pp.querySelectorAll('.nm')],bt=[...pp.querySelectorAll('.st button')],sw=pp.querySelector('.sw');
function roll(i,v){const o=nm[i].firstChild;if(+o.textContent===v)return;const n=document.createElement('span');n.textContent=v;n.style.cssText='position:absolute;left:0;right:0;top:0;transform:translateY(100%);display:block';nm[i].style.position='relative';nm[i].appendChild(n);o.style.transform='translateY(-100%)';requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.transition='transform .4s cubic-bezier(.3,1.3,.4,1)';n.style.transform='none'}));setTimeout(()=>{o.textContent=v;o.style.transition='none';o.style.transform='none';n.remove();setTimeout(()=>o.style.transition='',30)},430)}
function paint(){bt.forEach(b=>{const i=+b.dataset.i,d=+b.dataset.d;b.disabled=d<0?V[i]<=G[i][2]:V[i]>=G[i][3]});const t=V[0]+V[1],inf=V[2];sm.textContent=t+' guest'+(t===1?'':'s')+(inf?', '+inf+' infant'+(inf===1?'':'s'):'')+(pets?', pet':'');sm.classList.remove('pop');void sm.offsetWidth;sm.classList.add('pop')}
function step(i,d){const n=Math.max(G[i][2],Math.min(G[i][3],V[i]+d));if(n===V[i])return;V[i]=n;roll(i,n);paint()}
bt.forEach(b=>b.onclick=()=>{off=true;step(+b.dataset.i,+b.dataset.d)});sw.onclick=()=>{off=true;tg()};function tg(){pets=!pets;sw.setAttribute('aria-checked',pets);paint()}
function setOpen(o){open=o;pp.classList.toggle('on',o);tr.setAttribute('aria-expanded',o)}
tr.onclick=()=>{off=true;setOpen(!open)};document.getElementById('dn').onclick=()=>{off=true;setOpen(false)};addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
paint();setOpen(true);
/* Idle demo: the guest panel steps its counters up and down, each number rolling vertically and the summary on the search bar re-reading and bumping, then the pet switch flips and the popover closes and reopens, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2800);const plan=[[0,1],[1,1],[1,1],[2,1],[0,-1],[1,-1],[2,1]];while(!off){setOpen(true);for(const[i,d]of plan){if(off)return;step(i,d);await sleep(850)}tg();await sleep(1200);if(off)return;setOpen(false);await sleep(1100);V[0]=2;V[1]=1;V[2]=0;pets=false;sw.setAttribute('aria-checked','false');[2,1,0].forEach((v,i)=>roll(i,[2,1,0][i]));paint();setOpen(true);await sleep(600)}})()}
</script></body></html>
