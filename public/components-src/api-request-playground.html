<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>API Request Playground</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7EAF3;color:#12162B;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 36px 70px -36px rgba(18,22,43,.55),0 0 0 1px rgba(18,22,43,.07)}

.sn{height:46px;border:0;border-radius:12px;padding:0 22px;background:#4F46E5;color:#fff;font:700 14.5px 'Inter Tight';cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 12px 20px -12px #4F46E5;min-width:104px;justify-content:center}.sn:focus-visible{outline:3px solid #12162B;outline-offset:2px}.sn.ld{background:#7C83B8}.sn svg.sp{animation:rot .8s linear infinite;display:none}.sn.ld svg.sp{display:block}.sn.ld svg.pl{display:none}@keyframes rot{to{transform:rotate(360deg)}}

.tb .rs{margin-left:auto;display:flex;gap:10px;font:500 12px 'JetBrains Mono',monospace;color:#8A90B4;align-items:center;padding-bottom:8px}.tb .rs b{padding:2px 8px;border-radius:6px;background:#EAF7EE;color:#15803D;font-weight:600}
.cd{flex:1;padding:14px 16px;font:400 13px/1.75 'JetBrains Mono',monospace;color:#3A4066;overflow:auto;background:#FBFCFF}
.hd{display:grid;gap:7px;font:400 12.5px 'JetBrains Mono',monospace}.hd div{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #EDEFF7;border-radius:9px;padding:7px 10px}.hd b{color:#4F46E5;font-weight:500;min-width:110px}.hd span{color:#3A4066;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.js{white-space:pre}.k{color:#4F46E5}.s{color:#15803D}.n{color:#C2410C}.b2{color:#BE185D}.cm{color:#9AA0C2}
.ph{display:grid;place-items:center;height:100%;min-height:200px;color:#9AA0C2;font-size:14px;text-align:center}.ph div{display:grid;gap:8px;justify-items:center}
.cur{display:inline-block;width:7px;height:14px;background:#4F46E5;vertical-align:-2px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.tm{height:3px;background:#EDEFF7;overflow:hidden}.tm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#818CF8,#4F46E5)}.tm i.run{animation:ld 1s ease-out forwards}@keyframes ld{to{width:85%}}.tm i.dn{width:100%;transition:width .2s;background:#22C55E}
@media(max-width:720px){.gd{grid-template-columns:1fr}.pn+.pn{border-left:0;border-top:1px solid #EDEFF7}.hd b{min-width:80px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="c"><div class="rq"><div class="mt">GET</div><div class="ur"><span>https://api.meridian.dev</span><b>/v1/customers/cus_8f2Qk1</b></div><button class="sn" id="sn"><svg class="pl" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="sp" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.200-8.600"/></svg><span id="sl">Send</span></button></div>
<div class="tm"><i id="tm"></i></div>
<div class="gd"><div class="pn"><div class="tb"><button aria-selected="true">Headers</button><button aria-selected="false">Params</button><button aria-selected="false">Auth</button></div><div class="cd"><div class="hd"><div><b>Authorization</b><span>Bearer sk_live_51Hx...</span></div><div><b>Content-Type</b><span>application/json</span></div><div><b>Accept</b><span>application/json</span></div><div><b>X-Request-Id</b><span>req_7Qm2kLx9</span></div><div><b>User-Agent</b><span>meridian-node/3.4.0</span></div></div></div></div>
<div class="pn"><div class="tb"><button aria-selected="true">Response</button><button aria-selected="false">Headers</button><div class="rs" id="rs"></div></div><div class="cd" id="rb"></div></div></div></div>
<script>
const R={id:'cus_8f2Qk1',object:'customer',email:'ada@studio.com',name:'Ada Lovelace',plan:{id:'pro',interval:'month',amount:2400},balance:0,created:1730851200,metadata:{team:'Analytical Engines',seats:12},livemode:true};
function html(o,ind=0){const pad='  '.repeat(ind),pad2='  '.repeat(ind+1);if(Array.isArray(o))return '['+o.map(x=>html(x,ind+1)).join(', ')+']';if(o&&typeof o==='object'){const e=Object.entries(o);return '{\n'+e.map(([k,v],i)=>pad2+'<span class="k">"'+k+'"</span>: '+html(v,ind+1)+(i<e.length-1?',':'')).join('\n')+'\n'+pad+'}'}if(typeof o==='string')return '<span class="s">"'+o+'"</span>';if(typeof o==='number')return '<span class="n">'+o+'</span>';return '<span class="b2">'+o+'</span>'}
const rb=document.getElementById('rb'),rs=document.getElementById('rs'),sn=document.getElementById('sn'),tmb=document.getElementById('tm');const FULL=html(R);let tm;
function show(full){rb.innerHTML='<div class="js">'+FULL+'</div>';rs.innerHTML='<b>200 OK</b><span>143 ms</span><span>412 B</span>'}
function send(){if(sn.classList.contains('ld'))return;clearTimeout(tm);sn.classList.add('ld');document.getElementById('sl').textContent='Sending';rs.innerHTML='';rb.innerHTML='<div class="ph"><div><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.200-8.600"/></svg>Waiting for response...</div></div>';tmb.className='';void tmb.offsetWidth;tmb.classList.add('run');
 tm=setTimeout(()=>{tmb.className='dn';sn.classList.remove('ld');document.getElementById('sl').textContent='Send';rs.innerHTML='<b>200 OK</b><span>143 ms</span><span>412 B</span>';const raw=FULL;rb.innerHTML='<div class="js" id="js"></div>';const el=document.getElementById('js');let i=0;(function t(){i=Math.min(raw.length,i+7);let c=raw.slice(0,i);const lt=c.lastIndexOf('<'),gt=c.lastIndexOf('>');if(lt>gt)c=c.slice(0,lt);const op=(c.match(/<span/g)||[]).length-(c.match(/<\/span>/g)||[]).length;el.innerHTML=c+'</span>'.repeat(Math.max(0,op))+(i<raw.length?'<span class="cur"></span>':'');if(i<raw.length)setTimeout(t,14)})()},1200)}
sn.onclick=send;show();tmb.className='dn';
</script></body></html>
