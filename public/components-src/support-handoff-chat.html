<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Support Handoff Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#E2F4EC,#E6EAFF);color:#14201C;font-family:'Nunito Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:400px;height:600px;display:flex;flex-direction:column;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 40px 70px -40px rgba(20,40,60,.55),0 0 0 1px rgba(20,32,28,.06)}
.hd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #EEF1F0;transition:background .5s}.hd.hu{background:#F0FBF5}
.av{position:relative;width:42px;height:42px;flex:none}.av i{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 14px 'Nunito Sans';font-style:normal;transition:all .5s cubic-bezier(.3,1.4,.5,1)}.av .b{background:linear-gradient(135deg,#6D5BFA,#9B6BFF)}.av .h{background:linear-gradient(135deg,#10B981,#34D399);transform:scale(.3) rotate(-90deg);opacity:0}.hu .av .b{transform:scale(.3) rotate(90deg);opacity:0}.hu .av .h{transform:none;opacity:1}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#22C55E;border:2.500px solid #fff}
.hd b{display:block;font-size:16px;font-weight:800}.hd span{font-size:13px;color:#6C7A74}
.tg{margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:#EEEAFF;color:#5B45E8;transition:all .4s}.hu .tg{background:#D5F5E3;color:#0E7A4D}
.ms{flex:1;overflow:hidden;padding:12px 16px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:#FAFBFA}
.m{max-width:80%;padding:8px 13px;border-radius:18px;font-size:14.5px;line-height:1.38;animation:in .3s cubic-bezier(.3,1.4,.5,1)}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.95)}}
.m.b{align-self:flex-start;background:#fff;border:1px solid #ECEFEE;border-bottom-left-radius:6px}.m.u{align-self:flex-end;background:#6D5BFA;color:#fff;border-bottom-right-radius:6px}.m.a{align-self:flex-start;background:#E4F8EE;border-bottom-left-radius:6px}
.sy{align-self:center;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#0E7A4D;background:#E4F8EE;border-radius:99px;padding:6px 14px;margin:4px 0;animation:in .3s}
.ty{align-self:flex-start;display:flex;gap:4px;background:#fff;border:1px solid #ECEFEE;border-radius:18px;border-bottom-left-radius:6px;padding:13px 15px}.ty i{width:7px;height:7px;border-radius:50%;background:#A9B4AF;animation:ty 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}@keyframes ty{40%{transform:translateY(-5px);background:#6D5BFA}}
.qr{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 14px;background:#FAFBFA}.qr button{border:1.5px solid #6D5BFA;background:#fff;color:#5B45E8;border-radius:99px;padding:8px 14px;font:700 13.5px 'Nunito Sans';cursor:pointer}.qr button:hover{background:#6D5BFA;color:#fff}.qr button:focus-visible{outline:3px solid #14201C;outline-offset:2px}
.ft{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #EEF1F0}.ft div{flex:1;background:#F2F5F4;border-radius:99px;padding:11px 16px;font-size:14.5px;color:#9AA7A1}.ft i{width:42px;height:42px;border-radius:50%;background:#6D5BFA;display:grid;place-items:center;color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd" id="hd"><div class="av"><i class="b">AI</i><i class="h">SJ</i></div><div><b id="nm">Lumi Assistant</b><span id="sb">Replies instantly</span></div><div class="tg" id="tg">Bot</div></div>
<div class="ms" id="ms"></div><div class="qr" id="qr"></div>
<div class="ft"><div>Type a message</div><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></i></div></div>
<script>
const ms=document.getElementById('ms'),qr=document.getElementById('qr'),hd=document.getElementById('hd');let tm=[];
function add(c,t){const d=document.createElement('div');d.className=c;d.textContent=t;ms.appendChild(d);while(ms.children.length>9)ms.firstChild.remove();return d}
function typing(){const d=document.createElement('div');d.className='ty';d.innerHTML='<i></i><i></i><i></i>';ms.appendChild(d);return d}
function later(f,ms){tm.push(setTimeout(f,ms))}
function reset(){tm.forEach(clearTimeout);tm=[];ms.innerHTML='';qr.innerHTML='';hd.classList.remove('hu');document.getElementById('nm').textContent='Lumi Assistant';document.getElementById('sb').textContent='Replies instantly';document.getElementById('tg').textContent='Bot'}
function opts(l){qr.innerHTML='';l.forEach(o=>{const b=document.createElement('button');b.textContent=o[0];b.onclick=o[1];qr.appendChild(b)})}
function handoff(fast){const go=()=>{ms.querySelectorAll('.ty').forEach(e=>e.remove());const s=document.createElement('div');s.className='sy';s.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>Sara joined the chat';ms.appendChild(s);hd.classList.add('hu');document.getElementById('nm').textContent='Sara Jensen';document.getElementById('sb').textContent='Support specialist';document.getElementById('tg').textContent='Human';add('m a','Hi Ana, Sara here. I can see your order #3921 and I am sorting that refund out right now.');opts([['Replay demo',start]])};
 if(fast){go();return}add('m b','Connecting you to a teammate. One moment.');const t=typing();later(()=>{t.remove();go()},1300)}
function start(){reset();add('m b','Hi! I am Lumi. How can I help today?');opts([['Track my order',()=>{},],['Request a refund',ask],['Talk to a person',ask]]);qr.querySelectorAll('button').forEach(b=>b.onclick=ask)}
function ask(e){const t=e.target.textContent;qr.innerHTML='';add('m u',t);const ty=typing();later(()=>{ty.remove();add('m b','I can help with that, but refunds over $50 need a human review. Want me to bring in a specialist?');opts([['Yes, connect me',()=>{qr.innerHTML='';add('m u','Yes, connect me');handoff()}],['No thanks',start]])},1100)}
reset();add('m b','Hi! I am Lumi. How can I help today?');add('m u','Request a refund');add('m b','I can help with that, but refunds over $50 need a human review. Want me to bring in a specialist?');add('m u','Yes, connect me');handoff(true);
</script></body></html>
