<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Office Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EAE6DC;color:#1E1A12;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:900px;background:#FFFDF8;border-radius:30px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:0 40px 70px -40px rgba(70,50,10,.5),0 0 0 1px rgba(30,26,18,.07)}
.fm{padding:34px}.fm small{font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#C2410C}.fm h1{font:700 34px/1.05 'Fraunces',serif;letter-spacing:-.03em;margin:8px 0 8px}.fm p.sb{font-size:15px;color:#7A7058;margin-bottom:20px;line-height:1.55}
.f{margin-bottom:12px}.f label{display:block;font-size:12.5px;font-weight:600;color:#7A7058;margin-bottom:6px}.f input,.f textarea{width:100%;border:1.5px solid #E8E1CE;border-radius:13px;padding:12px 14px;font:500 15px 'Inter';color:#1E1A12;background:#fff;outline:0;transition:all .2s;resize:none}.f input:focus,.f textarea:focus{border-color:#C2410C;box-shadow:0 0 0 4px rgba(194,65,12,.1)}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{width:100%;height:52px;border:0;border-radius:14px;background:#1E1A12;color:#fff;font:700 15.5px 'Inter';cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}.go:focus-visible{outline:3px solid #C2410C;outline-offset:3px}
.mp{position:relative;background:#DDE9EE;min-height:480px;overflow:hidden}
.mp svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pn{position:absolute;left:46%;top:42%;width:46px;height:58px;margin:-58px 0 0 -23px;animation:bn 2.4s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-8px)}}.rp{position:absolute;left:46%;top:42%;width:16px;height:16px;margin:-8px;border-radius:50%;border:2px solid #C2410C;animation:rp 2s ease-out infinite}.rp.r2{animation-delay:1s}@keyframes rp{0%{transform:scale(1);opacity:.8}100%{transform:scale(8);opacity:0}}
.of{position:absolute;left:18px;right:18px;bottom:18px;background:rgba(255,253,248,.94);backdrop-filter:blur(12px);border-radius:22px;padding:18px 20px;box-shadow:0 20px 34px -16px rgba(30,26,18,.45)}
.of .t{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.of b{font:700 18px 'Fraunces',serif;letter-spacing:-.02em}
.op{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:#DCFCE7;color:#15803D}.op i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:bl 1.4s infinite}.op.cl{background:#FEE2E2;color:#B91C1C}.op.cl i{animation:none}@keyframes bl{50%{opacity:.3}}
.of .ad{font-size:14px;color:#6B6149;line-height:1.5;margin-bottom:12px}
.hr{display:grid;gap:4px;font-size:13px}.hr div{display:flex;justify-content:space-between;color:#8A7F63;padding:3px 0;border-radius:6px}.hr div.td{color:#1E1A12;font-weight:700;background:#FFF1E0;padding:3px 8px;margin:0 -8px}
.of .ac{display:flex;gap:8px;margin-top:12px}.of .ac a{flex:1;height:40px;border-radius:11px;border:1.5px solid #E8E1CE;display:flex;align-items:center;justify-content:center;gap:7px;font:600 13.5px 'Inter';color:#1E1A12;text-decoration:none;background:#fff}.of .ac a:hover{border-color:#C2410C}.of .ac a:focus-visible{outline:2px solid #C2410C}
@media(max-width:760px){.c{grid-template-columns:1fr}.mp{min-height:440px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="c"><form class="fm" onsubmit="return false"><small>Get in touch</small><h1>Come say hello</h1><p class="sb">Tell us a little about your project and we will reply within one working day.</p><div class="rw"><div class="f"><label for="n">Name</label><input id="n" placeholder="Ada Lovelace" autocomplete="off"></div><div class="f"><label for="e">Email</label><input id="e" type="email" placeholder="ada@studio.com" autocomplete="off"></div></div><div class="f"><label for="s">Subject</label><input id="s" placeholder="A new brand for our product" autocomplete="off"></div><div class="f"><label for="m">Message</label><textarea id="m" rows="4" placeholder="What are you working on?"></textarea></div><button class="go">Send message<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></form>
<div class="mp"><svg class="bg" viewBox="0 0 400 480" preserveAspectRatio="xMidYMid slice"><rect width="400" height="480" fill="#DDE9EE"/><path d="M-10 190 C80 150 170 220 270 170 S390 110 420 140 V240 C340 210 250 270 170 250 S50 230 -10 250Z" fill="#BFD9E6"/><path d="M-10 300 L420 270" stroke="#fff" stroke-width="16"/><path d="M130 -10 L170 490" stroke="#fff" stroke-width="12"/><path d="M-10 90 L420 70" stroke="#fff" stroke-width="10"/><path d="M300 -10 L330 490" stroke="#fff" stroke-width="9"/><path d="M-10 380 L420 360" stroke="#fff" stroke-width="9"/><rect x="190" y="300" width="90" height="46" rx="6" fill="#CFE0E8"/><rect x="20" y="120" width="90" height="56" rx="6" fill="#CFE0E8"/><rect x="340" y="290" width="70" height="60" rx="6" fill="#CFE0E8"/><rect x="190" y="10" width="80" height="48" rx="6" fill="#C5DBA8"/><rect x="20" y="20" width="90" height="50" rx="6" fill="#C5DBA8"/><rect x="40" y="320" width="70" height="46" rx="6" fill="#C5DBA8"/></svg>
<span class="rp"></span><span class="rp r2"></span><svg class="pn" viewBox="0 0 46 58"><path d="M23 0C10 0 0 10 0 23c0 17 23 35 23 35s23-18 23-35C46 10 36 0 23 0z" fill="#C2410C"/><circle cx="23" cy="22" r="8" fill="#fff"/></svg>
<div class="of"><div class="t"><b>Lisbon studio</b><span class="op" id="op"><i></i><span id="ot">Open now</span></span></div><div class="ad">Rua das Flores 48, 3rd floor<br>1200-195 Lisboa, Portugal</div><div class="hr" id="hr"></div><div class="ac"><a href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.900v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.3 1.800.6 2.800.7a2 2 0 0 1 1.700 2z"/></svg>Call</a><a href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8z"/></svg>Directions</a></div></div></div></div>
<script>
const H=[['Mon','09:00 to 18:00'],['Tue','09:00 to 18:00'],['Wed','09:00 to 18:00'],['Thu','09:00 to 18:00'],['Fri','09:00 to 17:00'],['Sat','Closed'],['Sun','Closed']];
const now=new Date(),dow=(now.getDay()+6)%7;const hr=document.getElementById('hr');hr.innerHTML=H.slice(0,5).map((h,i)=>'<div class="'+(i===Math.min(dow,4)&&dow<5?'td':'')+'"><span>'+h[0]+'</span><span>'+h[1]+'</span></div>').join('')+'<div class="'+(dow>=5?'td':'')+'"><span>Sat and Sun</span><span>Closed</span></div>';
const h=now.getHours(),open=dow<5&&h>=9&&h<(dow===4?17:18);const op=document.getElementById('op');if(!open){op.classList.add('cl');document.getElementById('ot').textContent='Closed now'}
// demo: always show the open state with Thursday highlighted
op.classList.remove('cl');document.getElementById('ot').textContent='Open now';hr.querySelectorAll('.td').forEach(e=>e.classList.remove('td'));hr.children[3].classList.add('td');
</script></body></html>
