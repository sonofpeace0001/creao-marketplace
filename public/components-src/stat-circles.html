<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ring Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --p{syntax:'<number>';inherits:false;initial-value:0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3F0FA;color:#1E1838;font-family:'Lexend',sans-serif;min-height:100vh;display:grid;place-items:center;padding:36px 20px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:860px;background:#fff;border-radius:32px;padding:34px 36px;box-shadow:0 30px 60px -36px rgba(30,24,56,.4),0 0 0 1px rgba(30,24,56,.06)}
.h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:10px}
.h h1{font-size:24px;font-weight:600;letter-spacing:-.03em}.h p{font-size:14px;color:#7A74A0;margin-top:4px}
.rp{display:flex;gap:6px;background:#F3F0FA;border-radius:99px;padding:4px}.rp button{border:0;background:none;font:500 13px 'Lexend';color:#7A74A0;padding:7px 14px;border-radius:99px;cursor:pointer}.rp button[aria-pressed=true]{background:#fff;color:#1E1838;box-shadow:0 1px 4px rgba(30,24,56,.15)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.c{text-align:center;padding:18px 10px;border-radius:24px;transition:background .3s,transform .3s}
.c:hover{background:#FAF8FF;transform:translateY(-3px)}
.r{--p:0;--c1:var(--a);--c2:var(--b);position:relative;width:min(170px,100%);aspect-ratio:1;margin:0 auto;border-radius:50%;background:conic-gradient(from -90deg,var(--c1) 0,var(--c2) calc(var(--p)*1%),#ECE8F7 0);display:grid;place-items:center;transition:--p 1.2s cubic-bezier(.2,.8,.2,1)}
.r::before{content:"";position:absolute;inset:14px;border-radius:50%;background:#fff}
.r::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c2);top:0;left:50%;margin:-1px 0 0 -7px;transform-origin:50% calc(var(--s)*.5 + 1px);transform:rotate(calc(var(--p)*3.6deg));box-shadow:0 0 0 3px #fff,0 4px 10px -2px var(--c2)}
.r b{position:relative;z-index:1;font-size:34px;font-weight:700;letter-spacing:-.05em}.r b sup{font-size:16px;font-weight:600;color:#9A94BA;margin-left:2px}
.c h2{font-size:16px;font-weight:600;margin-top:16px;letter-spacing:-.02em}.c p{font-size:13px;color:#7A74A0;margin-top:4px}
@media(max-width:640px){.g{grid-template-columns:1fr}.w{padding:26px 20px}}
@media(prefers-reduced-motion:reduce){.r{transition:none}}
</style></head><body>
<div class="w"><div class="h"><div><h1>Goal progress</h1><p>Where the team stands this quarter</p></div><div class="rp" role="group" aria-label="Period"><button aria-pressed="true" data-s="0">Q3</button><button aria-pressed="false" data-s="1">Q4</button></div></div>
<div class="g" id="g"></div></div>
<script>
const D=[[['Revenue target',82,'$4.1M of $5M','#6C5CE7','#A29BFE'],['Product launches',64,'8 of 12 shipped','#00B894','#55EFC4'],['Customer NPS',91,'Best score yet','#FD79A8','#E84393']],[['Revenue target',38,'$1.9M of $5M','#6C5CE7','#A29BFE'],['Product launches',25,'3 of 12 shipped','#00B894','#55EFC4'],['Customer NPS',77,'Up 4 pts','#FD79A8','#E84393']]];
const g=document.getElementById('g');
function draw(i){g.innerHTML=D[i].map(d=>'<div class="c"><div class="r" style="--a:'+d[3]+';--b:'+d[4]+'" role="img" aria-label="'+d[0]+' '+d[1]+' percent"><b>'+d[1]+'<sup>%</sup></b></div><h2>'+d[0]+'</h2><p>'+d[2]+'</p></div>').join('');
 requestAnimationFrame(()=>requestAnimationFrame(()=>g.querySelectorAll('.r').forEach((r,k)=>{r.style.setProperty('--s',r.offsetWidth+'px');r.style.setProperty('--p',D[i][k][1])})))}
document.querySelectorAll('.rp button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.rp button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw(+b.dataset.s)}));
draw(0);
</script></body></html>
