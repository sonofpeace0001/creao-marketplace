<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Swipe Photo Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8E2D6;color:#2B2218;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;overflow:hidden;-webkit-font-smoothing:antialiased}
.w{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;width:100%;max-width:820px}
.tx h1{font:500 clamp(34px,5vw,54px)/1 'Fraunces',serif;letter-spacing:-.035em}.tx h1 em{color:#C2410C}.tx p{font-size:16px;line-height:1.6;color:#6F6252;margin:14px 0 22px;max-width:30ch}
.ct{display:flex;align-items:center;gap:14px}.ct button{width:48px;height:48px;border-radius:50%;border:1.5px solid #2B2218;background:none;color:#2B2218;cursor:pointer;display:grid;place-items:center;transition:all .2s}.ct button:hover{background:#2B2218;color:#E8E2D6}.ct button:focus-visible{outline:3px solid #C2410C;outline-offset:3px}.ct span{font-size:13.5px;font-weight:700;color:#8A7B66}
.st{position:relative;width:min(100%,340px);aspect-ratio:3/4;margin:0 auto;touch-action:none}
.cd{position:absolute;inset:0;border-radius:22px;background:var(--bg);padding:12px 12px 56px;box-shadow:0 24px 40px -18px rgba(43,34,24,.55),0 0 0 1px rgba(43,34,24,.06);cursor:grab;transition:transform .5s cubic-bezier(.3,1.2,.5,1),opacity .3s;user-select:none;will-change:transform}
.cd.drag{transition:none;cursor:grabbing}.cd .im{width:100%;height:100%;border-radius:14px;position:relative;overflow:hidden;background:var(--g)}
.cd .im::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.55),transparent 45%),radial-gradient(circle at 80% 85%,rgba(0,0,0,.25),transparent 50%)}
.cd .im i{position:absolute;left:12%;right:12%;bottom:0;height:46%;background:var(--m);clip-path:polygon(0 100%,18% 40%,32% 62%,52% 12%,72% 58%,86% 34%,100% 100%)}
.cd .im i+i{left:-10%;right:30%;height:30%;background:var(--m2);opacity:.9}
.cd figcaption{position:absolute;left:20px;right:20px;bottom:14px;display:flex;justify-content:space-between;align-items:baseline}.cd figcaption b{font:500 20px 'Fraunces',serif;letter-spacing:-.02em;color:#2B2218}.cd figcaption span{font-size:12.5px;font-weight:700;color:#8A7B66}
.hint{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:13px;color:#8A7B66}
@media(max-width:680px){.w{grid-template-columns:1fr;text-align:center}.tx p{margin-left:auto;margin-right:auto}.ct{justify-content:center}}
@media(prefers-reduced-motion:reduce){.cd{transition:none}}
</style></head><body>
<div class="w"><div class="tx"><h1>Postcards from <em>the road.</em></h1><p>A year of small journeys, captured one frame at a time. Drag a photo away to see the next.</p>
<div class="ct"><button id="pv" aria-label="Previous photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button id="nx" aria-label="Next photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><span id="n">1 / 5</span></div></div>
<div class="st" id="st" aria-live="polite"><div class="hint">Drag, flick or use the arrows</div></div></div>
<script>
const P=[['Lofoten','Norway','linear-gradient(160deg,#9DD6FF,#4C7BD9 55%,#23305E)','#1E2B4D','#35467A'],['Kyoto','Japan','linear-gradient(160deg,#FFD1B8,#F28C6B 55%,#8E3B47)','#5A2236','#7A3446'],['Marrakesh','Morocco','linear-gradient(160deg,#FFE29A,#F0A04B 55%,#A84E2A)','#6B2F18','#8A4224'],['Banff','Canada','linear-gradient(160deg,#B8F0D8,#4FB28F 55%,#1F5B4E)','#143F38','#226B5C'],['Santorini','Greece','linear-gradient(160deg,#E4EEFF,#8FB3F2 55%,#3A5CA8)','#2C4586','#4C6CBC']];
const st=document.getElementById('st');let order=P.map((_,i)=>i),ix=0;
const els=P.map((p,i)=>{const f=document.createElement('figure');f.className='cd';f.style.cssText='--bg:#FFFDF8;--g:'+p[2]+';--m:'+p[3]+';--m2:'+p[4];f.innerHTML='<div class="im"><i></i><i></i></div><figcaption><b>'+p[0]+'</b><span>'+p[1]+'</span></figcaption>';f.setAttribute('role','img');f.setAttribute('aria-label',p[0]+', '+p[1]);st.insertBefore(f,st.querySelector('.hint'));return f});
function lay(){els.forEach((e,i)=>{const d=(i-ix+P.length)%P.length;e.style.zIndex=P.length-d;if(d<3){e.style.opacity=1;e.style.transform='translateY('+d*14+'px) scale('+(1-d*.05)+') rotate('+(d?(d%2?3:-3)*d:0)+'deg)'}else{e.style.opacity=0;e.style.transform='translateY(40px) scale(.85)'}e.style.pointerEvents=d===0?'auto':'none'});document.getElementById('n').textContent=(ix+1)+' / '+P.length}
function adv(dir){const e=els[ix];e.style.transition='transform .45s cubic-bezier(.4,0,.6,1),opacity .4s';e.style.transform='translate('+dir*340+'px,-30px) rotate('+dir*22+'deg)';e.style.opacity=0;setTimeout(()=>{e.style.transition='';ix=(ix+1)%P.length;lay()},330)}
function back(){ix=(ix-1+P.length)%P.length;lay()}
document.getElementById('nx').onclick=()=>adv(1);document.getElementById('pv').onclick=back;
let sx=0,cur=null;
st.addEventListener('pointerdown',e=>{const c=e.target.closest('.cd');if(c!==els[ix])return;cur=c;sx=e.clientX;c.classList.add('drag');c.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{if(!cur)return;const dx=e.clientX-sx;cur.style.transform='translate('+dx+'px,'+(-Math.abs(dx)*.08)+'px) rotate('+dx*.06+'deg)'});
function end(e){if(!cur)return;const dx=e.clientX-sx;cur.classList.remove('drag');const c=cur;cur=null;if(Math.abs(dx)>90)adv(dx>0?1:-1);else lay()}
st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')adv(1);if(e.key==='ArrowLeft')back()});lay();
</script></body></html>
