<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mention Textarea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3F1FA;color:#1A1633;font-family:'Hanken Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 40px 70px -44px rgba(60,40,140,.5),0 0 0 1px rgba(26,22,51,.06)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}.hd i{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:grid;place-items:center;color:#fff;font:700 13px 'Hanken Grotesk';font-style:normal}.hd b{font-size:15px}.hd span{display:block;font-size:12.5px;color:#8A85AD}
.ed{position:relative;border:2px solid #E4E0F3;border-radius:18px;transition:all .2s}.ed:focus-within{border-color:#6D4DF2;box-shadow:0 0 0 5px rgba(109,77,242,.12)}
.mi,.ta{display:block;width:100%;font:500 16px/1.6 'Hanken Grotesk';padding:14px 16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;min-height:120px;letter-spacing:0}
.mi{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}.mi mark{background:#E9E3FF;color:transparent;border-radius:6px;box-shadow:0 0 0 2px #E9E3FF}
.ta{position:relative;resize:none;border:0;outline:0;background:none;color:#1A1633;overflow:hidden}
.pp{position:absolute;left:14px;top:calc(100% + 8px);width:260px;background:#fff;border:1px solid #E4E0F3;border-radius:16px;padding:6px;box-shadow:0 24px 40px -14px rgba(60,40,140,.35);display:none;z-index:5}.pp.op{display:block}
.pp button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:11px;cursor:pointer;font:inherit;text-align:left;color:inherit}.pp button:hover,.pp button.hi{background:#F3F0FF}.pp i{width:30px;height:30px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font:700 11px 'Hanken Grotesk';font-style:normal}.pp b{display:block;font-size:14px}.pp span{font-size:12px;color:#8A85AD}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.ft .tl{display:flex;gap:4px}.ft .tl button{width:34px;height:34px;border:0;background:#F5F3FC;border-radius:10px;color:#6B6590;cursor:pointer;display:grid;place-items:center}.ft .tl button:hover{background:#E9E3FF;color:#5B3FE0}.ft .tl button:focus-visible{outline:2px solid #6D4DF2}
.rt{display:flex;align-items:center;gap:12px}.rg{position:relative;width:30px;height:30px}.rg svg{transform:rotate(-90deg)}.rg circle{fill:none;stroke-width:3.500;stroke-linecap:round}.rg .tr{stroke:#ECE9F7}.rg .pg{stroke:#6D4DF2;transition:stroke-dasharray .2s,stroke .2s}.rt .sn{border:0;background:#6D4DF2;color:#fff;border-radius:12px;padding:10px 20px;font:700 14.5px 'Hanken Grotesk';cursor:pointer;box-shadow:0 10px 20px -10px #6D4DF2}.rt .sn:focus-visible{outline:3px solid #1A1633;outline-offset:2px}
.hn{font-size:12.5px;color:#9C97BC;margin-top:10px}.hn kbd{font:600 11.5px 'Hanken Grotesk';background:#F1EFF9;border-radius:5px;padding:1px 6px}
</style></head><body>
<div class="c"><div class="hd"><i>MR</i><div><b>Maya Rowe</b><span>Posting to #design-review</span></div></div>
<div class="ed"><div class="mi" id="mi" aria-hidden="true"></div><textarea class="ta" id="ta" rows="4" maxlength="280" aria-label="Write a comment" placeholder="Write a comment. Type @ to mention someone."></textarea>
<div class="pp" id="pp" role="listbox"></div></div>
<div class="ft"><div class="tl"><button aria-label="Attach"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-9 9a5 5 0 0 1-7-7l9-9a3.500 3.500 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></button><button aria-label="Mention" id="at"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg></button></div>
<div class="rt"><div class="rg"><svg width="30" height="30" viewBox="0 0 32 32"><circle class="tr" cx="16" cy="16" r="13"/><circle class="pg" id="pg" cx="16" cy="16" r="13" stroke-dasharray="0 100"/></svg></div><button class="sn">Comment</button></div></div>
<p class="hn"><kbd>Enter</kbd> to pick a person, <kbd>Esc</kbd> to close.</p></div>
<script>
const U=[['Ada Lovelace','Engineering','#6366F1','AL'],['Grace Hopper','Platform','#10B981','GH'],['Linus Berg','Design','#F97316','LB'],['Priya Raman','Product','#EC4899','PR'],['Tomas Reid','Research','#0EA5E9','TR']];
const ta=document.getElementById('ta'),mi=document.getElementById('mi'),pp=document.getElementById('pp');let hi=0,list=[],start=-1;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function paint(){let v=ta.value;let h=esc(v).replace(/@([A-Z][a-z]+ [A-Z][a-z]+)/g,(m,n)=>U.some(u=>u[0]===n)?'<mark>'+m+'</mark>':m);mi.innerHTML=h+'\n';ta.style.height='auto';ta.style.height=Math.max(120,ta.scrollHeight)+'px';mi.style.height=ta.style.height;
 const n=v.length,p=n/280;const g=document.getElementById('pg');g.setAttribute('stroke-dasharray',(Math.min(p,1)*81.7)+' 100');g.style.stroke=p>.9?'#DC2626':p>.75?'#F59E0B':'#6D4DF2'}
function check(){const c=ta.selectionStart,b=ta.value.slice(0,c),m=b.match(/@([A-Za-z ]{0,20})$/);if(m&&(m.index===0||/\s/.test(b[m.index-1]))){start=m.index;const q=m[1].toLowerCase();list=U.filter(u=>u[0].toLowerCase().includes(q));hi=0;show()}else{pp.classList.remove('op');start=-1}}
function show(){if(!list.length){pp.classList.remove('op');return}pp.innerHTML=list.map((u,i)=>'<button role="option" class="'+(i===hi?'hi':'')+'" style="--g:'+u[2]+'"><i>'+u[3]+'</i><div><b>'+u[0]+'</b><span>'+u[1]+'</span></div></button>').join('');pp.classList.add('op');pp.querySelectorAll('button').forEach((b,i)=>b.onmousedown=e=>{e.preventDefault();pick(i)})}
function pick(i){const u=list[i],c=ta.selectionStart;ta.value=ta.value.slice(0,start)+'@'+u[0]+' '+ta.value.slice(c);const pos=start+u[0].length+2;ta.setSelectionRange(pos,pos);pp.classList.remove('op');paint();ta.focus()}
ta.addEventListener('input',()=>{paint();check()});ta.addEventListener('click',check);
ta.addEventListener('keydown',e=>{if(!pp.classList.contains('op'))return;if(e.key==='ArrowDown'){e.preventDefault();hi=(hi+1)%list.length;show()}if(e.key==='ArrowUp'){e.preventDefault();hi=(hi+list.length-1)%list.length;show()}if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pick(hi)}if(e.key==='Escape'){pp.classList.remove('op')}});
document.getElementById('at').onclick=()=>{ta.focus();const c=ta.selectionStart;ta.value=ta.value.slice(0,c)+'@'+ta.value.slice(c);ta.setSelectionRange(c+1,c+1);paint();check()};
ta.value='Looks great overall! @Ada Lovelace can you check the motion curve on the nav, and @Linus Berg the spacing on mobile? ';paint();
</script></body></html>
