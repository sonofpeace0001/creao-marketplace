<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Email Expand Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EAE7DF;color:#1B1912;font-family:'Figtree',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:420px;background:#FFFDF8;border-radius:30px;padding:34px 30px 28px;box-shadow:0 40px 70px -44px rgba(70,60,20,.5),0 0 0 1px rgba(27,25,18,.07)}
.lg{width:44px;height:44px;border-radius:14px;background:#1B1912;display:grid;place-items:center;margin-bottom:20px}.lg i{width:18px;height:18px;border-radius:50%;background:#FFB703}
.c h1{font-size:28px;font-weight:800;letter-spacing:-.055em}.c p.sb{font-size:15px;color:#7C7662;margin:6px 0 22px}
.so{display:grid;gap:10px}
.sb2{position:relative;display:flex;align-items:center;gap:12px;height:54px;border:1.5px solid #E4DFD0;background:#fff;border-radius:16px;padding:0 18px;font:600 15.5px 'Figtree';color:#1B1912;cursor:pointer;transition:all .3s cubic-bezier(.3,1.2,.5,1);text-align:left;width:100%}.sb2:hover{border-color:#1B1912;transform:translateY(-1px)}.sb2:focus-visible{outline:3px solid #2563EB;outline-offset:2px}.sb2 svg{flex:none}.sb2 span{flex:1}.sb2 em{font-style:normal;font-size:12px;color:#A39C84;font-weight:600}
.dv{display:flex;align-items:center;gap:12px;margin:18px 0 14px;font-size:13px;color:#A39C84}.dv::before,.dv::after{content:"";flex:1;height:1px;background:#E8E3D4}
.em{position:relative;border:1.5px solid #E4DFD0;border-radius:18px;background:#fff;overflow:hidden;transition:border-color .3s,box-shadow .3s}.em.op{border-color:#1B1912;box-shadow:0 0 0 5px rgba(27,25,18,.06)}
.em .hd{display:flex;align-items:center;gap:12px;width:100%;height:54px;border:0;background:none;padding:0 18px;font:600 15.5px 'Figtree';color:#1B1912;cursor:pointer;text-align:left}.em .hd:focus-visible{outline:3px solid #2563EB;outline-offset:-3px;border-radius:16px}.em .hd span{flex:1}.em .hd .ch{transition:transform .35s;color:#A39C84}.em.op .hd .ch{transform:rotate(180deg)}
.em .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.3,1,.4,1)}.em.op .bd{grid-template-rows:1fr}.em .bd>div{overflow:hidden}.em .in{padding:2px 18px 18px;display:grid;gap:10px}
.f{position:relative}.f input{width:100%;height:50px;border:1.5px solid #E4DFD0;border-radius:13px;padding:0 14px;font:500 15.5px 'Figtree';color:#1B1912;outline:0;background:#FFFEFB;transition:all .2s;opacity:0;transform:translateY(8px)}.em.op .f input{opacity:1;transform:none;transition:all .4s calc(.15s + var(--i)*.08s),border-color .2s,box-shadow .2s}.f input:focus{border-color:#1B1912;box-shadow:0 0 0 4px rgba(27,25,18,.08)}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}.rw label{display:flex;align-items:center;gap:8px;color:#5C5744;cursor:pointer}.rw input{accent-color:#1B1912;width:16px;height:16px}.rw a{color:#1B1912;font-weight:600;text-decoration:none}.rw a:focus-visible{outline:2px solid #2563EB;border-radius:3px}
.go{height:50px;border:0;border-radius:14px;background:#1B1912;color:#fff;font:700 15.5px 'Figtree';cursor:pointer;box-shadow:0 14px 22px -14px #1B1912}.go:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
.ft{margin-top:18px;text-align:center;font-size:14px;color:#8A8470}.ft a{color:#1B1912;font-weight:700;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="lg"><i></i></div><h1>Sign in to Marigold</h1><p class="sb">Welcome back. Choose how you want to continue.</p>
<div class="so"><button class="sb2"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.200c0-.7-.1-1.400-.2-2H12v3.900h5.600a4.800 4.800 0 0 1-2.100 3.100v2.600h3.400c2-1.800 3.100-4.500 3.100-7.600z"/><path fill="#34A853" d="M12 22c2.800 0 5.200-.9 6.900-2.500l-3.400-2.600c-.9.600-2.100 1-3.500 1-2.700 0-5-1.800-5.800-4.300H2.700v2.700A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.200 13.600a6 6 0 0 1 0-3.800V7.100H2.700a10 10 0 0 0 0 9.200z"/><path fill="#EA4335" d="M12 6c1.500 0 2.900.5 4 1.600l3-3A10 10 0 0 0 2.700 7.100l3.500 2.700C7 7.800 9.300 6 12 6z"/></svg><span>Continue with Google</span><em>Last used</em></button>
<button class="sb2"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1B1912"><path d="M16.400 12.600c0-2.400 2-3.500 2.100-3.600-1.100-1.700-2.900-1.900-3.500-1.900-1.500-.2-2.900.9-3.700.9-.8 0-1.900-.9-3.200-.8a4.700 4.700 0 0 0-4 2.400c-1.700 3-.4 7.300 1.200 9.700.8 1.200 1.800 2.500 3 2.400 1.200 0 1.700-.8 3.100-.8s1.900.8 3.200.7c1.300 0 2.200-1.200 3-2.400a10 10 0 0 0 1.300-2.700c-.1 0-2.500-1-2.500-3.900zM14 5.500c.7-.8 1.100-1.900 1-3-1 0-2.100.7-2.800 1.500-.6.700-1.100 1.800-1 2.900 1.100.1 2.100-.6 2.800-1.400z"/></svg><span>Continue with Apple</span></button>
<button class="sb2"><svg width="22" height="22" viewBox="0 0 24 24" fill="#1B1912"><path d="M12 2a10 10 0 0 0-3.200 19.500c.5.100.7-.2.7-.5v-1.800c-2.800.6-3.400-1.300-3.400-1.300-.5-1.200-1.100-1.500-1.100-1.500-.9-.6.100-.6.100-.6 1 .1 1.500 1 1.500 1 .9 1.500 2.300 1.100 2.900.8.1-.7.4-1.100.6-1.300-2.200-.3-4.600-1.100-4.600-5 0-1.100.4-2 1-2.700-.1-.3-.4-1.300.1-2.700 0 0 .8-.3 2.800 1a9.600 9.600 0 0 1 5 0c1.900-1.300 2.800-1 2.800-1 .5 1.400.2 2.400.1 2.700.6.700 1 1.600 1 2.700 0 3.900-2.400 4.700-4.600 5 .4.300.7.900.7 1.800v2.700c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg><span>Continue with GitHub</span></button></div>
<div class="dv">or</div>
<div class="em op" id="em"><button class="hd" id="hd" aria-expanded="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg><span>Continue with email</span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
<div class="bd"><div><form class="in" onsubmit="return false"><div class="f" style="--i:0"><input type="email" placeholder="Email address" aria-label="Email address" autocomplete="off"></div><div class="f" style="--i:1"><input type="password" placeholder="Password" aria-label="Password" autocomplete="off"></div><div class="rw"><label><input type="checkbox" checked>Keep me signed in</label><a href="#">Forgot password?</a></div><button class="go">Sign in</button></form></div></div></div>
<div class="ft">New to Marigold? <a href="#">Create an account</a></div></div>
<script>
const em=document.getElementById('em'),hd=document.getElementById('hd');hd.onclick=()=>{const o=em.classList.toggle('op');hd.setAttribute('aria-expanded',o)};
</script></body></html>
