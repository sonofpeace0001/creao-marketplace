<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gradient Headline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--a:#FF6A3D;--b:#E83E8C;--c:#7C3AED}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FBF9F5;color:#241C2E;font-family:'Instrument Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:44px 24px;-webkit-font-smoothing:antialiased}
.w{max-width:860px;text-align:center}
.k{display:inline-block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:#8A7C99;margin-bottom:22px}
h1{font:400 clamp(54px,10.5vw,138px)/.9 'Instrument Serif',serif;letter-spacing:-.045em}
h1 span{display:block;background:linear-gradient(100deg,var(--a),var(--b) 40%,var(--c) 70%,var(--a));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:s 7s linear infinite;transition:--x .6s}
h1 em{font-style:italic}
@keyframes s{to{background-position:-220% 0}}
p{margin:26px auto 0;max-width:480px;font-size:19px;line-height:1.55;color:#5E5270}
.sw{display:inline-flex;gap:10px;margin-top:34px;padding:8px;background:#fff;border-radius:99px;box-shadow:0 0 0 1px rgba(36,28,46,.08),0 12px 24px -16px rgba(36,28,46,.35)}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;cursor:pointer;background:var(--g);box-shadow:0 0 0 1px rgba(36,28,46,.15);transition:transform .2s}
.sw button:hover{transform:scale(1.15)}.sw button[aria-pressed=true]{box-shadow:0 0 0 2px #241C2E}
.sw button:focus-visible{outline:2px solid #7C3AED;outline-offset:3px}
@media(prefers-reduced-motion:reduce){h1 span{animation:none}}
</style></head><body>
<div class="w"><div class="k">Typography · gradient clip</div>
<h1>Make it<span><em>unforgettable.</em></span></h1>
<p>A single clipped gradient and a flowing highlight turn one headline into the thing people remember.</p>
<div class="sw" role="group" aria-label="Palette">
 <button aria-pressed="true" data-a="#FF6A3D" data-b="#E83E8C" data-c="#7C3AED" style="--g:linear-gradient(135deg,#FF6A3D,#7C3AED)" aria-label="Sunset"></button>
 <button aria-pressed="false" data-a="#00B894" data-b="#0984E3" data-c="#6C5CE7" style="--g:linear-gradient(135deg,#00B894,#6C5CE7)" aria-label="Lagoon"></button>
 <button aria-pressed="false" data-a="#F59E0B" data-b="#EF4444" data-c="#BE185D" style="--g:linear-gradient(135deg,#F59E0B,#BE185D)" aria-label="Ember"></button>
 <button aria-pressed="false" data-a="#111827" data-b="#6B7280" data-c="#111827" style="--g:linear-gradient(135deg,#111827,#9CA3AF)" aria-label="Graphite"></button></div></div>
<script>
const r=document.documentElement.style;document.querySelectorAll('.sw button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sw button').forEach(x=>x.setAttribute('aria-pressed',x===b));r.setProperty('--a',b.dataset.a);r.setProperty('--b',b.dataset.b);r.setProperty('--c',b.dataset.c)}));
</script></body></html>
