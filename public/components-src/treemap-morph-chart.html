<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Treemap Morph Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ECE9E2;color:#1B1914;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:720px;background:#FBF9F4;border-radius:28px;padding:24px;box-shadow:0 40px 56px -34px rgba(27,25,20,.5),inset 0 0 0 1px rgba(27,25,20,.08)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}.hd small{font:500 11.500px 'DM Mono';letter-spacing:.14em;color:#8C8473;text-transform:uppercase}.hd h1{font:800 38px/1 'Bricolage Grotesque';letter-spacing:-.05em;margin-top:5px;font-variant-numeric:tabular-nums}
.tb{display:flex;gap:6px;padding:4px;border-radius:99px;background:#EFEBE1}.tb button{border:0;border-radius:99px;padding:8px 15px;background:none;color:#7C7463;font:700 13.500px 'Bricolage Grotesque';cursor:pointer;transition:all .3s}.tb button.on{background:#1B1914;color:#fff}.tb button:focus-visible{outline:2px solid #E5522B;outline-offset:2px}
.tm{position:relative;height:320px;border-radius:16px;overflow:hidden;background:#EFEBE1}
.tl{position:absolute;border-radius:10px;padding:10px 12px;color:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px #FBF9F4;will-change:left,top,width,height}
.tl b{display:block;font-size:14.500px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.tl span{display:block;font:500 12px 'DM Mono';opacity:.88;margin-top:3px}.tl em{position:absolute;right:10px;bottom:8px;font:500 11px 'DM Mono';font-style:normal;opacity:.75}
.tl.sm b{font-size:12px}.tl.sm span,.tl.sm em{display:none}
</style></head><body>
<div class="cd"><div class="hd"><div><small id="sm">Spend, Q1</small><h1 id="tt">$0</h1></div><div class="tb" id="tb"></div></div><div class="tm" id="tm"></div></div>
<script>
const C=[['Payroll','#E5522B'],['Infrastructure','#2E5BFF'],['Marketing','#9333EA'],['Tools','#0E9F6E'],['Travel','#F59E0B'],['Legal','#475569'],['Support','#DB2777'],['R&D','#0891B2']];
const Q=[[420,160,120,60,48,34,70,150],[430,210,180,70,36,28,76,170],[440,260,140,76,90,52,82,190],[455,330,230,84,70,40,90,240]];
const tm=document.getElementById('tm'),tb=document.getElementById('tb'),els=C.map(c=>{const d=document.createElement('div');d.className='tl';d.style.background=c[1];d.innerHTML='<b>'+c[0]+'</b><span></span><em></em>';tm.appendChild(d);return d});
function squarify(items,x,y,w,h){const tot=items.reduce((a,b)=>a+b.v,0),sc=w*h/tot;let rest=items.map(i=>({...i,a:i.v*sc})),out=[];let X=x,Y=y,W=w,H=h;
 function worst(row,side){const s=row.reduce((a,b)=>a+b.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))}
 while(rest.length){const side=Math.min(W,H);let row=[rest[0]],i=1;while(i<rest.length&&worst(row.concat(rest[i]),side)<=worst(row,side)){row.push(rest[i]);i++}rest=rest.slice(row.length);const s=row.reduce((a,b)=>a+b.a,0);
  if(W>=H){const cw=s/H;let yy=Y;row.forEach(r=>{const hh=r.a/cw;out.push({k:r.k,x:X,y:yy,w:cw,h:hh});yy+=hh});X+=cw;W-=cw}else{const rh=s/W;let xx=X;row.forEach(r=>{const ww=r.a/rh;out.push({k:r.k,x:xx,y:Y,w:ww,h:rh});xx+=ww});Y+=rh;H-=rh}}return out}
let cur=0,off=false,rects=[],tgt=[],shown=0,tv=0;
function plan(q){const W=tm.clientWidth,H=tm.clientHeight;const it=C.map((c,i)=>({k:i,v:Q[q][i]})).sort((a,b)=>b.v-a.v);const r=squarify(it,0,0,W,H);const m=[];r.forEach(o=>m[o.k]=o);return m}
function set(q,instant){cur=q;tgt=plan(q);if(instant||!rects.length)rects=tgt.map(r=>({...r}));[...tb.children].forEach((b,i)=>b.classList.toggle('on',i===q));tv=Q[q].reduce((a,b)=>a+b,0);document.getElementById('sm').textContent='Spend, Q'+(q+1)+' 2026';els.forEach((e,i)=>{e.querySelector('span').textContent='$'+Q[q][i]+'k';e.querySelector('em').textContent=Math.round(Q[q][i]/tv*100)+'%'})}
['Q1','Q2','Q3','Q4'].forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{off=true;set(i)};tb.appendChild(b)});
function paint(){els.forEach((e,i)=>{const r=rects[i];e.style.left=r.x+'px';e.style.top=r.y+'px';e.style.width=r.w+'px';e.style.height=r.h+'px';e.classList.toggle('sm',r.w<110||r.h<70)})}
set(1,true);shown=tv;paint();document.getElementById('tt').textContent='$'+Math.round(shown*1000).toLocaleString('en-US');addEventListener('resize',()=>{set(cur,true);paint()});document.fonts.ready.then(()=>{set(cur,true);paint()});
/* Idle demo: a treemap of company spend where every tile is a category; switching the quarter re-runs a squarified layout and each tile glides and resizes to its new place while its dollar figure and share update and the headline total rolls to the new sum, cycling Q1 to Q4, until you click a quarter. */
(function lp(){rects.forEach((r,i)=>{const t=tgt[i];['x','y','w','h'].forEach(k=>r[k]+=(t[k]-r[k])*.1)});shown+=(tv-shown)*.1;document.getElementById('tt').textContent='$'+Math.round(shown*1000).toLocaleString('en-US');paint();requestAnimationFrame(lp)})();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sl=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sl(3400);while(!off){set((cur+1)%4);await sl(3000)}})()}
</script></body></html>
