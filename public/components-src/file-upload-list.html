<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Upload Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090D;color:#EAECF4;font-family:'Epilogue',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:520px;background:#10121A;border:1px solid #1F2332;border-radius:24px;padding:22px;box-shadow:0 40px 80px -34px #000}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hd h1{font-size:17px;font-weight:700;letter-spacing:-.02em}.hd span{font:500 12px 'Geist Mono',monospace;color:#6C7791}
.ov{height:6px;border-radius:6px;background:#1A1E2C;overflow:hidden;margin-bottom:16px}.ov i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7C8CFF,#5EEAD4);transition:width .3s}
.l{display:grid;gap:10px}
.f{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#141722;border:1px solid #1F2332;transition:border-color .3s,transform .3s}
.f.done{border-color:rgba(94,234,212,.3)}.f.err{border-color:rgba(255,107,107,.4)}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--b);color:var(--c);font:700 11px 'Geist Mono',monospace;letter-spacing:.04em}
.i b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.i span{display:flex;gap:8px;font:500 11.5px 'Geist Mono',monospace;color:#6C7791;margin-top:3px}.i .ok{color:#5EEAD4}.i .bad{color:#FF8A8A}
.pb{height:5px;border-radius:5px;background:#1E2231;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;width:0;border-radius:5px;background:#7C8CFF;transition:width .2s linear}
.f.done .pb i{background:#5EEAD4}.f.err .pb i{background:#FF6B6B}
.a{width:34px;height:34px;border:0;border-radius:10px;background:none;color:#7D88A6;cursor:pointer;display:grid;place-items:center}.a:hover{background:#1E2231;color:#fff}.a:focus-visible{outline:2px solid #7C8CFF}
.ck{color:#5EEAD4}
.ft{margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6C7791}
.ft button{border:0;background:#EAECF4;color:#08090D;font:700 13.5px 'Epilogue';padding:10px 16px;border-radius:12px;cursor:pointer}.ft button:focus-visible{outline:2px solid #7C8CFF;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Uploading 4 files</h1><span id="s"></span></div><div class="ov"><i id="ov"></i></div><div class="l" id="l"></div>
<div class="ft"><span id="m">Keep this tab open until uploads finish.</span><button id="r">Add files</button></div></div>
<script>
const T={PDF:['#3A1F23','#FF8A8A'],FIG:['#2A1F3F','#C4A6FF'],ZIP:['#2F2A14','#FBD34D'],MP4:['#14303A','#5EEAD4'],PNG:['#142A3F','#7AB8FF']};
let F=[['Brand-guidelines-v3.pdf','PDF',11.2,100,'done'],['Homepage-hero.fig','FIG',48.6,64,'up'],['Launch-assets.zip','ZIP',212,31,'up'],['Walkthrough.mp4','MP4',86.4,18,'err']];
const l=document.getElementById('l');
function draw(){l.innerHTML=F.map((f,i)=>{const t=T[f[1]];return '<div class="f '+(f[4]==='done'?'done':f[4]==='err'?'err':'')+'" data-i="'+i+'"><span class="ic" style="--b:'+t[0]+';--c:'+t[1]+'">'+f[1]+'</span><div class="i"><b>'+f[0]+'</b><span><em style="font-style:normal">'+(f[2]*f[3]/100).toFixed(1)+' / '+f[2]+' MB</em>'+(f[4]==='done'?'<span class="ok">Complete</span>':f[4]==='err'?'<span class="bad">Failed · network</span>':'<span>'+Math.round(f[3])+'%</span>')+'</span><div class="pb"><i style="width:'+f[3]+'%"></i></div></div>'+(f[4]==='done'?'<span class="a ck"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span>':f[4]==='err'?'<button class="a" data-r="'+i+'" aria-label="Retry '+f[0]+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.700L3 8M3 3v5h5"/></svg></button>':'<button class="a" data-x="'+i+'" aria-label="Cancel '+f[0]+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>')+'</div>'}).join('');tot()}
function tot(){const a=F.reduce((s,f)=>s+f[2]*f[3]/100,0),b=F.reduce((s,f)=>s+f[2],0);document.getElementById('ov').style.width=(F.length?a/b*100:0)+'%';document.getElementById('s').textContent=a.toFixed(0)+' / '+b.toFixed(0)+' MB';document.querySelector('.hd h1').textContent=F.some(f=>f[4]==='up')?'Uploading '+F.filter(f=>f[4]==='up').length+' files':'All uploads finished'}
l.addEventListener('click',e=>{const x=e.target.closest('[data-x]'),r=e.target.closest('[data-r]');if(x){F.splice(+x.dataset.x,1);draw()}if(r){F[+r.dataset.r][4]='up';F[+r.dataset.r][3]=0;draw()}});
setInterval(()=>{let rebuild=false;F.forEach(f=>{if(f[4]==='up'){f[3]=Math.min(100,f[3]+1.2+Math.random()*1.5);if(f[3]>=100){f[4]='done';rebuild=true}}});
 if(rebuild){draw();return}
 // in-place update so buttons keep focus and clicks are never lost mid-render
 [...l.children].forEach((el,i)=>{const f=F[i];if(!f||f[4]!=='up')return;el.querySelector('.pb i').style.width=f[3]+'%';const sp=el.querySelector('.i span');sp.firstElementChild.textContent=(f[2]*f[3]/100).toFixed(1)+' / '+f[2]+' MB';sp.lastElementChild.textContent=Math.round(f[3])+'%'});tot()},180);
document.getElementById('r').onclick=()=>{F.push(['Notes-'+(F.length+1)+'.png','PNG',3.4,0,'up']);draw()};draw();
</script></body></html>
