<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edge Rail Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;background:radial-gradient(900px 600px at 70% 10%,#17284A,transparent 60%),radial-gradient(700px 500px at 90% 90%,#2A1346,transparent 60%),#070912;font-family:'Hanken Grotesk',sans-serif;color:#E8ECF8;padding:30px;-webkit-font-smoothing:antialiased}
.dock{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:24px;background:rgba(18,22,38,.72);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(22px);box-shadow:0 30px 60px -20px #000,inset 0 1px 0 rgba(255,255,255,.07)}
.b{position:relative;width:54px;height:54px;border:0;border-radius:16px;cursor:pointer;display:grid;place-items:center;color:#fff;background:var(--g);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -8px var(--s);transition:transform .25s cubic-bezier(.3,1.5,.4,1),border-radius .25s}
.b:hover{transform:translateX(6px) scale(1.08);border-radius:20px}
.b:focus-visible{outline:2px solid #fff;outline-offset:3px}
.b.on::before{content:"";position:absolute;left:-12px;top:14px;bottom:14px;width:4px;border-radius:4px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8)}
.b .l{position:absolute;left:calc(100% + 16px);top:50%;transform:translate(-6px,-50%);background:#0b0e1a;border:1px solid rgba(255,255,255,.12);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:all .18s}
.b:hover .l,.b:focus-visible .l{opacity:1;transform:translate(0,-50%)}
.b .n{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:#FF4D6D;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #121626;padding:0 4px}
.div{height:1px;background:rgba(255,255,255,.1);margin:2px 8px}
.main{margin-left:70px;max-width:420px}
.main small{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#7C86AA;font-weight:700}
.main h1{font-size:clamp(34px,5vw,54px);font-weight:700;letter-spacing:-.045em;line-height:1;margin:14px 0 12px}
.main p{color:#8E98BA;font-size:17px;line-height:1.55}
@media(max-width:640px){body{align-items:flex-end}.dock{flex-direction:row;position:fixed;left:50%;bottom:16px;transform:translateX(-50%)}.div{width:1px;height:auto;margin:8px 2px}.main{display:none}.b .l{display:none}.b.on::before{left:14px;right:14px;top:auto;bottom:-10px;width:auto;height:4px}}
@media(prefers-reduced-motion:reduce){.b{transition:none}}
</style></head><body>
<nav class="dock" aria-label="Workspace">
 <button class="b on" style="--g:linear-gradient(150deg,#6C7BFF,#3A47D5);--s:#4655e8" aria-label="Home"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span class="l">Home</span></button>
 <button class="b" style="--g:linear-gradient(150deg,#2DD4BF,#0F9F8E);--s:#14b8a6" aria-label="Projects"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span class="l">Projects</span></button>
 <button class="b" style="--g:linear-gradient(150deg,#FFB547,#F2780C);--s:#f59e0b" aria-label="Inbox"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1 3h6l1-3h5M5 5h14l2 8v6H3v-6Z"/></svg><span class="n">4</span><span class="l">Inbox · 4 new</span></button>
 <button class="b" style="--g:linear-gradient(150deg,#F472B6,#C2267A);--s:#ec4899" aria-label="Analytics"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="l">Analytics</span></button>
 <div class="div"></div>
 <button class="b" style="--g:linear-gradient(150deg,#475069,#262C40);--s:#334" aria-label="Settings"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span class="l">Settings</span></button>
</nav>
<div class="main"><small>Workspace</small><h1>Everything one tap away.</h1><p>A floating rail that stays out of the way until you reach for it. Hover for labels, watch for the unread badge.</p></div>
<script>
const bs=[...document.querySelectorAll('.b')];bs.forEach(b=>b.addEventListener('click',()=>{bs.forEach(x=>x.classList.toggle('on',x===b));const n=b.querySelector('.n');if(n)n.remove()}));
</script></body></html>
