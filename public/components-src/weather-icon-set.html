<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Weather Icon Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#DDE8F5;color:#10233E;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:680px;display:grid;gap:18px}
.hd{display:flex;justify-content:space-between;align-items:end}.hd h1{font-size:28px;font-weight:800;letter-spacing:-.045em}.hd span{font-size:13px;font-weight:600;color:#5C7498}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.c{position:relative;border-radius:26px;overflow:hidden;padding:16px 16px 14px;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 20px 26px -20px var(--b),inset 0 0 0 1px rgba(255,255,255,.2);min-height:196px;display:flex;flex-direction:column;justify-content:space-between}
.c svg{width:96px;height:96px;overflow:visible;margin:-4px 0 0 -4px}
.c small{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}.c b{display:block;font-size:42px;font-weight:700;letter-spacing:-.06em;line-height:1}.c span{font-size:13px;font-weight:500;opacity:.85}
.top{display:flex;justify-content:space-between;align-items:flex-start}.top small{margin-top:4px}
.sunc{--a:#4AA3FF;--b:#2D6FE0}.part{--a:#6EA8E8;--b:#3B6FB8}.rain{--a:#5D7FA8;--b:#33506F}.snow{--a:#8FB4D8;--b:#5681AD}.thun{--a:#4A4F7A;--b:#25274A}.night{--a:#2A2F66;--b:#10123A}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes pls{50%{transform:scale(1.08)}}@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(7px)}}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes snow{0%{transform:translate(0,-6px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(6px,24px) rotate(180deg);opacity:0}}
@keyframes bolt{0%,55%,100%{opacity:1}60%,70%{opacity:.1}65%,75%{opacity:1}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}@keyframes bob{50%{transform:translateY(-3px)}}
.rays{transform-origin:48px 48px;animation:rot 18s linear infinite}.core{transform-origin:48px 48px;animation:pls 3s ease-in-out infinite}
.cld{animation:drift 5s ease-in-out infinite alternate}.dr{transform-box:fill-box;animation:fall 1.100s linear infinite}.sf{transform-box:fill-box;transform-origin:center;animation:snow 2.600s linear infinite}
.bt{animation:bolt 2.400s linear infinite}.st{transform-box:fill-box;transform-origin:center;animation:tw 2.600s ease-in-out infinite}.mn{animation:bob 5s ease-in-out infinite}
@media(max-width:520px){.g{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Weather, in motion</h1><span>6 animated icons, pure SVG and CSS</span></div>
<div class="g">
<article class="c sunc"><div class="top"><svg viewBox="0 0 96 96" aria-hidden="true"><g class="rays" stroke="#FFE066" stroke-width="5" stroke-linecap="round"><path d="M48 8v10M48 78v10M8 48h10M78 48h10M20 20l7 7M69 69l7 7M76 20l-7 7M27 69l-7 7"/></g><circle class="core" cx="48" cy="48" r="19" fill="#FFD43B"/><circle cx="42" cy="42" r="8" fill="#FFF3B0" opacity=".7"/></svg><small>Mon</small></div><div><b>27&deg;</b><span>Clear and bright</span></div></article>
<article class="c part"><div class="top"><svg viewBox="0 0 96 96" aria-hidden="true"><g class="rays" style="transform-origin:34px 34px"><path stroke="#FFE066" stroke-width="4.500" stroke-linecap="round" d="M34 8v8M34 52v8M8 34h8M52 34h8M15.500 15.500l5.600 5.600M46.900 46.900l5.600 5.600M52.500 15.500l-5.600 5.600"/></g><circle class="core" style="transform-origin:34px 34px" cx="34" cy="34" r="14" fill="#FFD43B"/><g class="cld"><path d="M30 76a14 14 0 0 1 1-28 20 20 0 0 1 38 6 11 11 0 0 1 1 22Z" fill="#fff"/></g></svg><small>Tue</small></div><div><b>22&deg;</b><span>Sun and cloud</span></div></article>
<article class="c rain"><div class="top"><svg viewBox="0 0 96 96" aria-hidden="true"><g class="cld"><path d="M26 56a14 14 0 0 1 1-28 20 20 0 0 1 38 6 11 11 0 0 1 1 22Z" fill="#E7EEF8"/></g><g stroke="#8FD0FF" stroke-width="4.500" stroke-linecap="round"><path class="dr" d="M32 66v8"/><path class="dr" style="animation-delay:.35s" d="M48 66v8"/><path class="dr" style="animation-delay:.7s" d="M64 66v8"/><path class="dr" style="animation-delay:.2s" d="M40 72v6"/><path class="dr" style="animation-delay:.55s" d="M56 72v6"/></g></svg><small>Wed</small></div><div><b>15&deg;</b><span>Steady rain</span></div></article>
<article class="c snow"><div class="top"><svg viewBox="0 0 96 96" aria-hidden="true"><g class="cld"><path d="M26 54a14 14 0 0 1 1-28 20 20 0 0 1 38 6 11 11 0 0 1 1 22Z" fill="#F4F8FD"/></g><g stroke="#fff" stroke-width="3" stroke-linecap="round"><g class="sf" style="animation-delay:0s"><path d="M32 66v9M27.500 70.500h9M29 67l6 7M35 67l-6 7"/></g><g class="sf" style="animation-delay:.9s"><path d="M48 68v9M43.500 72.500h9M45 69l6 7M51 69l-6 7"/></g><g class="sf" style="animation-delay:1.700s"><path d="M64 66v9M59.500 70.500h9M61 67l6 7M67 67l-6 7"/></g></g></svg><small>Thu</small></div><div><b>-2&deg;</b><span>Light snow</span></div></article>
<article class="c thun"><div class="top"><svg viewBox="0 0 96 96" aria-hidden="true"><g class="cld"><path d="M26 52a14 14 0 0 1 1-28 20 20 0 0 1 38 6 11 11 0 0 1 1 22Z" fill="#9CA3D6"/></g><path class="bt" d="M52 50 40 68h9l-4 16 18-22h-10l5-12Z" fill="#FFD43B" stroke="#FFF3B0" stroke-width="1.500" stroke-linejoin="round"/></svg><small>Fri</small></div><div><b>18&deg;</b><span>Thunderstorms</span></div></article>
<article class="c night"><div class="top"><svg viewBox="0 0 96 96" aria-hidden="true"><g class="mn"><path d="M60 20a28 28 0 1 0 22 44A32 32 0 0 1 60 20Z" fill="#F3EDC8"/><circle cx="46" cy="52" r="4" fill="#D8D0A4" opacity=".7"/><circle cx="58" cy="64" r="2.600" fill="#D8D0A4" opacity=".7"/></g><g fill="#fff"><circle class="st" cx="20" cy="22" r="2.200"/><circle class="st" style="animation-delay:.8s" cx="30" cy="62" r="1.800"/><circle class="st" style="animation-delay:1.500s" cx="76" cy="18" r="2"/><circle class="st" style="animation-delay:.4s" cx="82" cy="40" r="1.500"/></g></svg><small>Sat</small></div><div><b>9&deg;</b><span>Clear night</span></div></article>
</div></div></body></html>
