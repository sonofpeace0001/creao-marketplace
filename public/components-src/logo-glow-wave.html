<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Logo Glow Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Fraunces:wght@700&family=Space+Grotesk:wght@700&family=Playfair+Display:wght@700&family=DM+Serif+Display&family=Outfit:wght@700&family=Syne:wght@800&family=Instrument+Serif&family=Bricolage+Grotesque:wght@800&family=Unbounded:wght@600&family=Plus+Jakarta+Sans:wght@800&family=Fredoka:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3F1FA;color:#17142E;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:900px;background:#fff;border-radius:34px;padding:42px 36px 34px;text-align:center;box-shadow:0 40px 70px -44px rgba(70,50,170,.5),0 0 0 1px rgba(23,20,46,.06);overflow:hidden;position:relative}
.c small{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7C5CFF}.c h1{font:700 clamp(26px,4.2vw,40px)/1.12 'Sora';letter-spacing:-.05em;margin:10px 0 8px}.c p{font-size:16px;color:#6F6B96;max-width:46ch;margin:0 auto 30px}
.gd{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lg{position:relative;height:96px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:10px;background:#F8F7FF;border:1px solid #ECE9FA;color:#B4B0D2;overflow:hidden;transition:color .5s,background .5s,box-shadow .5s,border-color .5s,transform .5s cubic-bezier(.3,1.4,.5,1)}
.lg svg{width:28px;height:28px;flex:none}.lg b{font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.lg.on{color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);border-color:color-mix(in srgb,var(--c) 40%,#fff);box-shadow:0 18px 28px -16px var(--c);transform:translateY(-4px) scale(1.03)}
.lg::after{content:"";position:absolute;inset:0;background:radial-gradient(120px circle at 50% 120%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);opacity:0;transition:opacity .5s}.lg.on::after{opacity:1}
.sw{position:absolute;left:0;top:-30px;bottom:-30px;width:140px;background:linear-gradient(90deg,transparent,rgba(124,92,255,.14),transparent);pointer-events:none;transform:translateX(var(--sx,-200px));filter:blur(6px)}
.ft{display:flex;justify-content:center;gap:34px;margin-top:30px;flex-wrap:wrap}.ft div{display:flex;align-items:center;gap:10px;font-size:14.5px;color:#6F6B96;font-weight:500}.ft div i{width:34px;height:34px;border-radius:11px;background:#EEEAFF;color:#7C5CFF;display:grid;place-items:center}
@media(max-width:700px){.gd{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.lg{transition:none}}
</style></head><body>
<div class="c"><small>Trusted by leaders</small><h1>Teams that move fast choose Meridian</h1><p>Our customers range from two-person studios to global enterprises.</p><div class="gd" id="gd"><div class="sw" id="sw"></div></div>
<div class="ft"><div><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></i>SOC 2 Type II</div><div><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></i>99.99% uptime</div><div><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l3 6.900 7.500.7-5.700 5 1.700 7.400L12 18l-6.500 4 1.700-7.400-5.700-5 7.500-.7z"/></svg></i>4.9 on G2</div></div></div>
<script>
const ICO={circle:'<circle cx="12" cy="12" r="9" fill="currentColor"/>',tri:'<path d="M12 3 22 20H2z" fill="currentColor"/>',sun:'<circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4M4.200 4.200l2.800 2.800M17 17l2.800 2.800M4.200 19.800 7 17M17 7l2.800-2.800" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',hex:'<path d="M12 2 21 7v10l-9 5-9-5V7z" fill="currentColor"/>',sq:'<rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor"/>',wave:'<path d="M2 14c3-6 5-6 8 0s5 6 8 0 3-4 4-4" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/>',bulb:'<path d="M12 2a7 7 0 0 0-4 12.700V18h8v-3.300A7 7 0 0 0 12 2zM9 21h6" fill="currentColor" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"/>',ring:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="19" cy="6" r="2.500" fill="currentColor"/>',diamond:'<path d="M12 2 22 12 12 22 2 12z" fill="currentColor"/>',cloud:'<path d="M7 18a5 5 0 1 1 1-9.900A6 6 0 0 1 19.500 11 3.500 3.500 0 0 1 18 18z" fill="currentColor"/>',bird:'<path d="M2 8c4 0 6 2 8 5 1-2 3-4 6-4l-2 3c3 0 5 1 6 3-3 0-4 1-5 2-1 4-5 6-9 5 3-1 4-3 4-5-4 0-7-3-8-9z" fill="currentColor"/>',leaf:'<path d="M20 4C9 4 4 9 4 16c0 2 .5 3 1 4 1-4 4-7 9-9-5 3-7 6-8 10 8 1 14-5 14-17z" fill="currentColor"/>'};
const L=[['Northwind','circle','Sora','#2563EB'],['Fjord','tri','Fraunces','#0E7490'],['Helios','sun','Space Grotesk','#F59E0B'],['Pinecone','hex','Playfair Display','#15803D'],['Atlas','sq','DM Serif Display','#DC2626'],['Marlow','wave','Outfit','#7C3AED'],['Lumen','bulb','Syne','#CA8A04'],['Orbit','ring','Instrument Serif','#DB2777'],['Vertex','diamond','Bricolage Grotesque','#0F766E'],['Nimbus','cloud','Unbounded','#4F46E5'],['Kestrel','bird','Plus Jakarta Sans','#EA580C'],['Quill','leaf','Fredoka','#16A34A']];
const gd=document.getElementById('gd'),els=[];L.forEach(l=>{const e=document.createElement('div');e.className='lg';e.style.setProperty('--c',l[3]);e.innerHTML='<svg viewBox="0 0 24 24">'+ICO[l[1]]+'</svg><b style="font-family:\''+l[2]+'\',sans-serif">'+l[0]+'</b>';gd.appendChild(e);els.push(e)});
const cols=()=>getComputedStyle(gd).gridTemplateColumns.split(' ').length;let t=0;const sw=document.getElementById('sw');
function tick(){t+=.02;const c=cols(),W=gd.getBoundingClientRect().width,ph=(t%1.4)/1.4;const x=-140+ph*(W+280);sw.style.setProperty('--sx',x+'px');els.forEach(e=>{const r=e.getBoundingClientRect(),g=gd.getBoundingClientRect(),cx=r.left-g.left+r.width/2;e.classList.toggle('on',Math.abs(cx-(x+70))<r.width*.62)});if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(tick)}
t=.38;tick();
</script></body></html>
