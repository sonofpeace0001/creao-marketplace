<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Icon Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0C;color:#EDEDF2;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:640px;background:#111114;border:1px solid #232328;border-radius:26px;padding:22px;box-shadow:0 40px 80px -34px #000}
.hd{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.hd h1{font-size:19px;font-weight:700;letter-spacing:-.03em}.hd h1 span{font:500 12px 'JetBrains Mono',monospace;color:#6C6C78;margin-left:8px}
.s{position:relative;flex:1;min-width:180px;max-width:240px}.s svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6C6C78}
.s input{width:100%;background:#17171B;border:1px solid #2A2A31;border-radius:12px;padding:10px 12px 10px 36px;font:500 14px 'Inter';color:#EDEDF2;outline:0}.s input:focus{border-color:#FFB547;box-shadow:0 0 0 3px rgba(255,181,71,.15)}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.i{position:relative;aspect-ratio:1;border:1px solid #1F1F25;background:#141418;border-radius:16px;color:#C8C8D2;cursor:pointer;display:grid;place-items:center;transition:all .2s}
.i:hover,.i:focus-visible{background:#1B1B21;color:#FFB547;border-color:#3A3A44;transform:translateY(-3px);outline:0}
.i svg{width:26px;height:26px;transition:transform .25s cubic-bezier(.3,1.6,.4,1)}.i:hover svg{transform:scale(1.15)}
.i span{position:absolute;left:0;right:0;bottom:7px;text-align:center;font:500 10px 'JetBrains Mono',monospace;color:#8A8A96;opacity:0;transition:opacity .2s}.i:hover span,.i:focus-visible span{opacity:1}
.i.ok{border-color:#34D399;color:#34D399}.i.ok span{opacity:1;color:#34D399}
.em{grid-column:1/-1;text-align:center;padding:36px;color:#6C6C78;font-size:14px}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12.5px;color:#6C6C78}.ft kbd{font:500 11px 'JetBrains Mono',monospace;background:#17171B;border:1px solid #2A2A31;border-radius:5px;padding:2px 6px}
@media(max-width:520px){.g{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Line icons<span id="ct"></span></h1><div class="s"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" placeholder="Search icons…" aria-label="Search icons"></div></div>
<div class="g" id="g"></div><div class="ft"><span>Click an icon to copy its SVG</span><span><kbd>2px</kbd> stroke · <kbd>24</kbd> grid</span></div></div>
<script>
const I={home:'<path d="m3 11 9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.300 21a1.900 1.900 0 0 0 3.400 0"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',heart:'<path d="M20.800 4.600a5.500 5.500 0 0 0-7.800 0L12 5.700l-1-1.100a5.500 5.500 0 0 0-7.800 7.800l1 1.100L12 21l7.800-7.500 1-1.100a5.500 5.500 0 0 0 0-7.800Z"/>',star:'<path d="m12 2.600 2.900 6 6.600.9-4.800 4.600 1.200 6.500L12 17.400l-5.900 3.200 1.200-6.500L2.500 9.500l6.600-.900Z"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',cart:'<path d="M3 4h2l2.400 11h10l2-8H6.500M9 20h.01M17 20h.01"/>',cal:'<rect x="3.500" y="5" width="17" height="15.500" rx="3"/><path d="M3.500 10h17M8 3v4M16 3v4"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.200 4.200l2.100 2.100M17.700 17.700l2.100 2.100M2 12h3M19 12h3M4.200 19.800l2.100-2.100M17.700 6.300l2.100-2.100"/>',cloud:'<path d="M7 18a4.500 4.500 0 0 1-.6-8.960A6 6 0 0 1 18 10a4 4 0 0 1-1 8Z"/>',code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',pin:'<path d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12Z"/><circle cx="12" cy="9" r="2.500"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.500"/>',music:'<path d="M9 18V6l10-2v12"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="16.500" cy="16" r="2.500"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M8 8a2.500 2.500 0 1 1 0-5c3 0 4 5 4 5s1-5 4-5a2.500 2.500 0 1 1 0 5"/>',trash:'<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',edit:'<path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4Z"/>',link:'<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'};
const g=document.getElementById('g'),q=document.getElementById('q');
function draw(){const s=q.value.trim().toLowerCase(),k=Object.keys(I).filter(n=>n.includes(s));document.getElementById('ct').textContent=k.length+' icons';
 g.innerHTML=k.length?k.map(n=>'<button class="i" data-n="'+n+'" aria-label="Copy '+n+' icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg><span>'+n+'</span></button>').join(''):'<div class="em">No icons match “'+q.value.replace(/[<>&]/g,'')+'”</div>'}
g.addEventListener('click',e=>{const b=e.target.closest('.i');if(!b)return;const svg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I[b.dataset.n]+'</svg>';(navigator.clipboard?navigator.clipboard.writeText(svg):Promise.resolve()).catch(()=>{});b.classList.add('ok');b.querySelector('span').textContent='copied';setTimeout(()=>{b.classList.remove('ok');b.querySelector('span').textContent=b.dataset.n},1200)});
q.addEventListener('input',draw);draw();
</script></body></html>
