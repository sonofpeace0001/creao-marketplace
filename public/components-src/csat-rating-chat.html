<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSAT Rating Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{--c:#22C55E;background:#E8EEF0;color:#12212A;font-family:'Onest',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 14px;-webkit-font-smoothing:antialiased}
.wd{position:relative;width:100%;max-width:400px;height:590px;background:#fff;border-radius:30px;box-shadow:0 44px 64px -30px rgba(18,33,42,.55),inset 0 0 0 1px rgba(18,33,42,.07);display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #EDF1F3}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0EA5E9,#6366F1);display:grid;place-items:center;color:#fff;font-weight:800}.hd b{display:block;font-size:15.500px}.hd span{font-size:12.500px;color:#7B8C95}.hd em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:#7B8C95;padding:4px 10px;border-radius:99px;background:#F1F4F6}
.ms{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.m{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14.500px;line-height:1.4}.m.b{background:#F1F4F6;border-bottom-left-radius:6px;align-self:flex-start}.m.d{align-self:center;background:none;color:#8A9AA3;font-size:12px;padding:0}
.cs{margin-top:4px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 14px 32px -14px rgba(18,33,42,.3),inset 0 0 0 1px #E8EEF1;position:relative;overflow:hidden}
.cs h3{font-size:15.500px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
.rt{position:relative;display:grid;grid-template-columns:repeat(5,1fr);padding:4px;border-radius:18px;background:#F1F4F6}.rt .hl{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:14px;background:#fff;box-shadow:0 6px 14px -6px rgba(18,33,42,.4),inset 0 0 0 2px var(--c);transform:translateX(calc(var(--i,4)*100%));transition:transform .5s cubic-bezier(.3,1.5,.5,1),box-shadow .3s;opacity:var(--o,1)}
.rt button{position:relative;z-index:1;border:0;background:none;padding:10px 0;font-size:28px;cursor:pointer;filter:grayscale(1);opacity:.55;transition:filter .3s,opacity .3s,transform .45s cubic-bezier(.3,2,.5,1)}.rt button.on{filter:none;opacity:1;transform:scale(1.28) translateY(-2px)}.rt button:focus-visible{outline:2px solid var(--c);border-radius:12px}
.lb{text-align:center;font-weight:800;font-size:14px;margin-top:10px;color:var(--c);height:20px;transition:color .3s}
.fu{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .4s}.fu.on{max-height:170px;opacity:1}.fu .in{padding-top:14px}
.fu p{font-size:13px;color:#6C7E88;margin-bottom:8px;font-weight:600}.ch{display:flex;gap:7px;flex-wrap:wrap}.ch span{padding:8px 14px;border-radius:99px;background:#F1F4F6;font-size:13.500px;font-weight:700;color:#41545E;transition:all .3s cubic-bezier(.3,1.6,.5,1)}.ch span.on{background:var(--c);color:#fff;transform:scale(1.05)}
.ta{min-height:66px;border-radius:14px;padding:11px 13px;background:#F6F8F9;box-shadow:inset 0 0 0 2px var(--c);font-size:14px;line-height:1.4;color:#12212A}.ta i{display:inline-block;width:2px;height:15px;background:var(--c);vertical-align:-3px;margin-left:1px;animation:bk .8s steps(2) infinite}@keyframes bk{50%{opacity:0}}
.sb{margin-top:14px;width:100%;border:0;border-radius:14px;padding:13px;background:var(--c);color:#fff;font:800 15px 'Onest';cursor:pointer;opacity:0;transform:translateY(8px);transition:all .4s,background .3s}.sb.on{opacity:1;transform:none}.sb.pr{transform:scale(.97)}
.ty{position:absolute;inset:0;background:rgba(255,255,255,.96);display:grid;place-items:center;align-content:center;gap:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s}.ty.on{opacity:1}.ty .ck{width:64px;height:64px;border-radius:50%;background:var(--c);display:grid;place-items:center;transform:scale(0)}.ty.on .ck{animation:pp .6s .1s cubic-bezier(.3,2,.5,1) forwards}@keyframes pp{to{transform:scale(1)}}.ty svg{width:30px;height:30px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.ty b{font-size:19px}.ty span{font-size:13.500px;color:#6C7E88}
.cf{position:absolute;left:50%;top:44%;width:8px;height:8px;border-radius:2px;background:var(--k);animation:cf 1.200s cubic-bezier(.2,.8,.3,1) forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wd"><div class="hd"><div class="av">S</div><div><b>Sam from Support</b><span>Chat ended 1 min ago</span></div><em>Closed</em></div><div class="ms"><div class="m d">Today 2:41 PM</div><div class="m b">Your refund has been issued and will arrive in 3 to 5 days. Anything else I can help with?</div><div class="m b">Thanks for chatting with us today, Maya! 💜</div>
<div class="cs" id="cs"><h3>How was your chat with Sam?</h3><div class="rt" id="rt"><i class="hl" id="hl"></i></div><div class="lb" id="lb"></div><div class="fu" id="fu"><div class="in" id="in"></div></div><button class="sb" id="sb">Send feedback</button><div class="ty" id="ty"><div class="ck"><svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7"/></svg></div><b>Thank you!</b><span>Your feedback helps us improve.</span></div></div></div></div>
<script>
const EM=['😡','😕','😐','🙂','🤩'],LB=['Awful','Not great','Okay','Good','Loved it!'],CO=['#EF4444','#F97316','#EAB308','#65A30D','#16A34A'];
const $=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let off=false,cur=4;const bt=EM.map((e,i)=>{const b=document.createElement('button');b.textContent=e;b.setAttribute('aria-label',LB[i]);b.onclick=()=>{off=true;rate(i,true)};$('rt').appendChild(b);return b});
function chips(a,sel){return '<p>'+(cur>=3?'What went well?':'What could we do better?')+'</p><div class="ch" id="ch">'+a.map((x,i)=>'<span class="'+(sel.includes(i)?'on':'')+'">'+x+'</span>').join('')+'</div>'}
function rate(i,inst){cur=i;document.body.style.setProperty('--c',CO[i]);$('hl').style.setProperty('--i',i);bt.forEach((b,k)=>b.classList.toggle('on',k===i));$('lb').textContent=LB[i];
 const fu=$('fu'),inn=$('in');fu.classList.add('on');$('sb').classList.add('on');if(i<=1){inn.innerHTML='<p>What went wrong?</p><div class="ta"><span id="tx"></span><i></i></div>'}else if(i===2){inn.innerHTML=chips(['Slow replies','Unclear answer','Wrong info'],[])}else inn.innerHTML=chips(['Fast reply','Helpful','Friendly','Clear'],i===4?[0,1]:[])}
async function type(s){const t=$('tx');if(!t)return;for(let i=1;i<=s.length;i++){t.textContent=s.slice(0,i);await sl(45)}}
async function sendIt(){const b=$('sb');b.classList.add('pr');await sl(260);b.classList.remove('pr');const ty=$('ty');ty.classList.add('on');for(let k=0;k<18;k++){const c=document.createElement('i');c.className='cf';const a=k/18*6.28,d=90+Math.random()*60;c.style.cssText='--k:'+['#16A34A','#0EA5E9','#F59E0B','#EC4899'][k%4]+';--x:'+Math.cos(a)*d+'px;--y:'+Math.sin(a)*d+'px;--r:'+(Math.random()*400-200)+'deg';ty.appendChild(c);setTimeout(()=>c.remove(),1300)}await sl(2600);ty.classList.remove('on')}
$('hl').style.transition='none';rate(4);requestAnimationFrame(()=>requestAnimationFrame(()=>$('hl').style.transition=''));
document.querySelector('.wd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a post-chat satisfaction card where a white highlight with a coloured ring springs between five emoji faces, the chosen face scales up in colour while the others go grey, the label and accent change from red to green, and a follow-up area slides open: a typed comment box for a low score or tappable reason chips for a good one; the Send button presses itself and a thank-you check bursts with confetti, looping between a bad and a great review, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){await sendIt();if(off)return;rate(1);await sl(900);await type('The first answer missed my question.');await sl(700);await sendIt();if(off)return;rate(4);await sl(1500);const c=[...document.querySelectorAll('#ch span')];if(c[3])c[3].classList.add('on');await sl(1100)}})()}
</script></body></html>
