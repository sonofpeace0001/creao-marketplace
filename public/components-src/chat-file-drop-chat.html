<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chat File Drop Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0C12;color:#E9ECF6;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 14px;-webkit-font-smoothing:antialiased}
.wd{position:relative;width:100%;max-width:440px;height:600px;background:#12151F;border-radius:30px;box-shadow:0 44px 64px -30px #000,inset 0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.07)}.av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#818CF8,#C084FC);display:grid;place-items:center;font-weight:800}.hd b{display:block;font-size:15.500px}.hd span{font:500 11.500px 'Geist Mono';color:#7C86A8}
.ms{flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14.500px;line-height:1.4;animation:in .45s cubic-bezier(.3,1.5,.5,1)}@keyframes in{from{opacity:0;transform:translateY(12px) scale(.95)}}.m.b{align-self:flex-start;background:#1C2030;border-bottom-left-radius:5px}.m.u{align-self:flex-end;background:#6366F1;color:#fff;border-bottom-right-radius:5px}
.fl{align-self:flex-end;width:250px;background:#6366F1;border-radius:16px;border-bottom-right-radius:5px;padding:12px 14px;animation:in .45s cubic-bezier(.3,1.5,.5,1)}.fl .r{display:flex;gap:11px;align-items:center}.fi{flex:none;width:38px;height:44px;border-radius:8px;background:#fff;color:#E5484D;display:grid;place-items:end center;padding-bottom:4px;font:800 10px 'Inter Tight';position:relative}.fi::before{content:"";position:absolute;right:0;top:0;border:7px solid transparent;border-top-color:#C7CCFF;border-right-color:#C7CCFF}
.fl b{display:block;font-size:14px;font-weight:700}.fl span{font:500 11.500px 'Geist Mono';opacity:.85}.fl .pg{height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}.fl .pg i{display:block;height:100%;width:var(--p,0%);background:#fff;border-radius:3px}.fl .ok{display:none;margin-top:8px;font-size:12.500px;font-weight:700}.fl.dn .ok{display:block}.fl.dn .pg{display:none}
.ty{align-self:flex-start;display:flex;gap:4px;padding:13px 16px;background:#1C2030;border-radius:16px;border-bottom-left-radius:5px}.ty i{width:7px;height:7px;border-radius:50%;background:#818CF8;animation:bn 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}@keyframes bn{30%{transform:translateY(-5px)}}
.in{display:flex;gap:10px;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07)}.in div{flex:1;padding:11px 15px;border-radius:99px;background:#1C2030;font-size:14px;color:#6A7394}.in button{width:42px;border:0;border-radius:50%;background:#6366F1;color:#fff;font-size:17px}
.dz{position:absolute;left:12px;right:12px;top:76px;bottom:70px;border-radius:22px;border:2.500px dashed #818CF8;background:rgba(99,102,241,.14);backdrop-filter:blur(3px);display:grid;place-items:center;align-content:center;gap:8px;text-align:center;opacity:0;transform:scale(.97);transition:opacity .3s,transform .4s cubic-bezier(.3,1.5,.5,1);pointer-events:none;z-index:4}.dz.on{opacity:1;transform:none}.dz svg{width:44px;height:44px;stroke:#A5B4FC;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;animation:bb 1s ease-in-out infinite}@keyframes bb{50%{transform:translateY(5px)}}.dz b{font-size:18px}.dz span{font-size:13px;color:#A5B4FC}
.gf{position:absolute;left:0;top:0;width:150px;z-index:6;background:#fff;color:#12151F;border-radius:14px;padding:10px 12px;box-shadow:0 22px 34px -10px rgba(0,0,0,.7);display:flex;gap:10px;align-items:center;transition:transform .95s cubic-bezier(.5,0,.2,1),opacity .3s;pointer-events:none}.gf b{font-size:12.500px;display:block}.gf span{font:500 10.500px 'Geist Mono';color:#6A7394}.gf.pk{transform-origin:20px 20px}
.cu{position:absolute;z-index:7;width:22px;pointer-events:none;transition:transform .95s cubic-bezier(.5,0,.2,1)}.cu svg{width:22px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wd" id="wd"><div class="hd"><div class="av">C</div><div><b>Clause assistant</b><span>reads contracts, flags risks</span></div></div><div class="ms" id="ms"></div><div class="in"><div>Message or drop a file…</div><button aria-label="Send">➤</button></div>
<div class="dz" id="dz"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><b>Drop to attach</b><span>PDF, DOCX or images up to 25 MB</span></div>
<div class="gf" id="gf"><div class="fi" style="width:32px;height:38px">PDF</div><div><b>Contract_v3.pdf</b><span>2.4 MB</span></div></div><div class="cu" id="cu"><svg viewBox="0 0 24 24"><path d="M4 3l16 8-7 2-3 7Z" fill="#fff" stroke="#12151F" stroke-width="1.500" stroke-linejoin="round"/></svg></div></div>
<script>
const ms=document.getElementById('ms'),$=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let off=false;
function add(c,h,fast){const d=document.createElement('div');d.className=c;d.innerHTML=h;if(fast)d.style.animation='none';ms.appendChild(d);while(ms.children.length>6)ms.firstChild.remove();return d}
function base(){ms.innerHTML='';add('m b','Hi! Drop in a contract and I will pull out the clauses that need your attention.',1);add('m u','I have the vendor agreement, one sec.',1)}
function pos(x,y,inst){const g=$('gf'),c=$('cu');if(inst){g.style.transition='none';c.style.transition='none'}g.style.transform='translate('+x+'px,'+y+'px)';c.style.transform='translate('+(x+16)+'px,'+(y+14)+'px)';if(inst){void g.offsetWidth;g.style.transition='';c.style.transition=''}}
base();$('dz').classList.add('on');pos(140,230,true);
document.getElementById('wd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a file is dragged into a chat; a dashed Drop to attach zone fades in as the file card glides over the conversation, then it lands, becomes an outgoing file bubble whose progress bar fills to a green uploaded check, the assistant types and replies with the three clauses it found, and the chat resets for another drop, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3200);while(!off){$('dz').classList.remove('on');pos(330,60,false);await sl(250);$('dz').classList.add('on');pos(140,230,false);await sl(1400);if(off)return;$('dz').classList.remove('on');$('gf').style.opacity=0;$('cu').style.opacity=0;const f=add('fl','<div class="r"><div class="fi">PDF</div><div><b>Contract_v3.pdf</b><span>2.4 MB · uploading</span></div></div><div class="pg"><i></i></div><div class="ok">✓ Uploaded</div>');const bar=f.querySelector('.pg i'),sp=f.querySelector('span');for(let p=0;p<=100;p+=4){bar.style.setProperty('--p',p+'%');sp.textContent='2.4 MB · '+(p*2.4/100).toFixed(1)+' of 2.4 MB';await sl(45)}f.classList.add('dn');sp.textContent='2.4 MB · PDF';await sl(600);let t=add('ty','<i></i><i></i><i></i>');await sl(1500);t.remove();add('m b','Got it. I found <b>3 clauses</b> to review:<br>• Auto-renewal in 12 months<br>• Uncapped liability<br>• Payment terms: net 15');await sl(4200);if(off)return;base();$('gf').style.opacity=1;$('cu').style.opacity=1;pos(330,60,true);await sl(900)}})()}
</script></body></html>
