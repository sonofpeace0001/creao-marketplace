<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Natural Language Date Input</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F3EF;color:#18181B;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:520px;background:#fff;border-radius:26px;padding:26px;box-shadow:0 40px 70px -44px rgba(24,24,27,.5),0 0 0 1px rgba(24,24,27,.07)}
.c h1{font-size:22px;font-weight:700;letter-spacing:-.04em}.c>p{color:#71717A;font-size:14.5px;margin:4px 0 18px}
.in{display:flex;align-items:center;gap:10px;border:1.5px solid #E4E4E7;border-radius:16px;padding:6px 14px;background:#FAFAF9;transition:all .2s}.in:focus-within{border-color:#18181B;background:#fff;box-shadow:0 0 0 4px rgba(24,24,27,.07)}
.in svg{flex:none;color:#71717A}.in input{flex:1;border:0;outline:0;background:none;font:500 17px 'Geist';padding:12px 0;color:#18181B}.in input::placeholder{color:#A1A1AA}
.in kbd{font:500 11.5px 'Geist Mono',monospace;color:#71717A;background:#F0F0EE;border:1px solid #E4E4E7;border-radius:6px;padding:2px 7px}
.rs{margin-top:14px;min-height:92px}
.pv{display:flex;align-items:center;gap:14px;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#EEF0FF,#F6EEFF);border:1px solid #E0E2FA;animation:pi .35s cubic-bezier(.3,1.3,.5,1)}@keyframes pi{from{opacity:0;transform:translateY(8px) scale(.97)}}
.pv .cal{flex:none;width:54px;border-radius:12px;background:#fff;overflow:hidden;text-align:center;box-shadow:0 6px 14px -6px rgba(79,70,229,.5)}.pv .cal i{display:block;background:#4F46E5;color:#fff;font:600 10.5px 'Geist';font-style:normal;letter-spacing:.1em;padding:3px 0;text-transform:uppercase}.pv .cal b{display:block;font-size:24px;font-weight:700;letter-spacing:-.05em;padding:4px 0 6px}
.pv .tx b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}.pv .tx span{font-size:13.5px;color:#6B6F94}
.pv .ck{margin-left:auto;color:#16A34A}
.er{display:none;align-items:center;gap:10px;border-radius:16px;padding:14px 16px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-size:14px;font-weight:500}.rs.bad .er{display:flex}.rs.bad .pv{display:none}
.sg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.sg button{border:1px solid #E4E4E7;background:#fff;color:#3F3F46;border-radius:99px;padding:7px 13px;font:500 13.5px 'Geist';cursor:pointer;transition:all .15s}.sg button:hover{border-color:#18181B}.sg button:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.sg button b{font:500 11px 'Geist Mono',monospace;color:#8B8B96;margin-left:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><h1>When is it due?</h1><p>Type it like you would say it. We will figure out the date.</p>
<div class="in"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><input id="i" value="next friday" aria-label="Date in plain language" autocomplete="off"><kbd>Enter</kbd></div>
<div class="rs" id="rs" aria-live="polite"><div class="pv" id="pv"></div><div class="er">Sorry, we could not understand that. Try "in 3 days".</div></div>
<div class="sg" id="sg"></div></div>
<script>
const TODAY=new Date(2026,10,9),DN=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'],MN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function parse(s){s=s.trim().toLowerCase();if(!s)return null;if(s==='today'||s==='now')return TODAY;if(s==='tomorrow')return add(TODAY,1);if(s==='yesterday')return add(TODAY,-1);
 let m=s.match(/^in (\d+) (day|days|week|weeks|month|months)$/);if(m){const n=+m[1];if(m[2][0]==='d')return add(TODAY,n);if(m[2][0]==='w')return add(TODAY,n*7);const x=new Date(TODAY);x.setMonth(x.getMonth()+n);return x}
 m=s.match(/^(next|this)?\s*(sunday|monday|tuesday|wednesday|thursday|friday|saturday)$/);if(m){const t=DN.indexOf(m[2]);let diff=(t-TODAY.getDay()+7)%7;if(diff===0)diff=7;if(m[1]==='next'&&diff<7)diff+=7;return add(TODAY,diff)}
 if(s==='next week')return add(TODAY,7);if(s==='next month'){const x=new Date(TODAY);x.setMonth(x.getMonth()+1);return x}if(s==='end of month')return new Date(2026,11,0);
 m=s.match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})$/);if(m){const mo=MN.indexOf(m[1]);if(mo>-1)return new Date(2026,mo,+m[2])}return null}
const i=document.getElementById('i'),pv=document.getElementById('pv'),rs=document.getElementById('rs');
function show(){const d=parse(i.value);rs.classList.toggle('bad',!d&&!!i.value.trim());if(!d){pv.innerHTML='';return}const diff=Math.round((d-TODAY)/864e5);const rel=diff===0?'Today':diff===1?'Tomorrow':diff<0?Math.abs(diff)+' days ago':'In '+diff+' days';
 pv.innerHTML='<div class="cal"><i>'+d.toLocaleDateString('en-US',{month:'short'})+'</i><b>'+d.getDate()+'</b></div><div class="tx"><b>'+d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</b><span>'+rel+'</span></div><svg class="ck" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>'}
i.addEventListener('input',show);i.addEventListener('keydown',e=>{if(e.key==='Enter')show()});
const S=['tomorrow','in 3 days','next monday','end of month','dec 24'];document.getElementById('sg').innerHTML=S.map(s=>'<button data-s="'+s+'">'+s+'</button>').join('');document.querySelectorAll('.sg button').forEach(b=>b.onclick=()=>{i.value=b.dataset.s;show();i.focus()});show();
</script></body></html>
