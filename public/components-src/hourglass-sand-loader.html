<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hourglass Sand Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 400px at 50% 30%,#4A2A12,transparent 70%),#1A0F08;color:#FBEFD9;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{text-align:center;width:100%;max-width:460px}
.hg{position:relative;width:150px;height:230px;margin:0 auto 26px;animation:fl 6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes fl{0%,88%{transform:rotate(0)}100%{transform:rotate(180deg)}}
.hg svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 20px 24px rgba(0,0,0,.5))}
.fr{fill:rgba(255,236,200,.08);stroke:#E8C48A;stroke-width:3.500;stroke-linejoin:round}
.cap{fill:#C58B3C}
.sd{fill:url(#sg)}
.tp{transform-origin:50% 100%;animation:tp 6s linear infinite}.bt{transform-origin:50% 100%;animation:bt 6s linear infinite}
@keyframes tp{0%{transform:scaleY(1)}88%,100%{transform:scaleY(.02)}}
@keyframes bt{0%{transform:scaleY(.02)}88%,100%{transform:scaleY(1)}}
.st{stroke:#F2C879;stroke-width:3;stroke-linecap:round;stroke-dasharray:4 7;animation:ds .5s linear infinite}@keyframes ds{to{stroke-dashoffset:-11}}
.str{animation:sr 6s linear infinite}@keyframes sr{0%{opacity:1}86%{opacity:1}88%,100%{opacity:0}}
.c h1{font:600 26px 'Fraunces',serif;letter-spacing:-.02em}.c h1 em{font-style:italic;color:#F2C879}.c p{font-size:15px;color:#BFA27A;margin-top:8px}
.tm{margin-top:18px;font:500 13px 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8E7551}
@media(prefers-reduced-motion:reduce){*{animation-duration:12s!important}}
</style></head><body>
<div class="c"><div class="hg"><svg viewBox="0 0 150 230"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8D89A"/><stop offset="1" stop-color="#E0A24A"/></linearGradient><clipPath id="top"><path d="M24 28 H126 C126 78 84 98 78 115 C84 132 126 152 126 202 H24 C24 152 66 132 72 115 C66 98 24 78 24 28Z"/></clipPath></defs>
<g clip-path="url(#top)"><g class="tp" style="transform-origin:75px 115px"><rect class="sd" x="20" y="28" width="110" height="87"/></g><g class="bt" style="transform-origin:75px 202px"><path class="sd" d="M20 202 H130 V175 C100 150 75 115 75 115 C75 115 50 150 20 175Z"/></g></g>
<line class="st str" x1="75" y1="108" x2="75" y2="200"/>
<path class="fr" d="M24 28 H126 C126 78 84 98 78 115 C84 132 126 152 126 202 H24 C24 152 66 132 72 115 C66 98 24 78 24 28Z" fill="none"/>
<rect class="cap" x="12" y="14" width="126" height="14" rx="5"/><rect class="cap" x="12" y="202" width="126" height="14" rx="5"/></svg></div>
<h1>Just a <em>moment</em></h1><p>We are preparing something good for you.</p><div class="tm" id="tm">Time remaining 00:06</div></div>
<script>
let t=6;setInterval(()=>{t=t<=1?6:t-1;document.getElementById('tm').textContent='Time remaining 00:0'+t},1000);
</script></body></html>
