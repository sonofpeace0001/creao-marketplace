<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aurora Backdrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c1:#00E0B8;--c2:#2D6BFF;--c3:#7A3CFF;--bg:#050810}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;padding:30px}
.b{position:absolute;border-radius:50%;filter:blur(80px);mix-blend-mode:screen;opacity:.75;transition:background 1.2s;animation:f 16s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:var(--c1)}
.b2{width:55vmax;height:55vmax;right:-18vmax;top:5vmax;background:var(--c2);animation-delay:-5s}
.b3{width:50vmax;height:50vmax;left:20vmax;bottom:-30vmax;background:var(--c3);animation-delay:-9s}
@keyframes f{to{transform:translate(6vmax,4vmax) scale(1.15)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.2px);background-size:26px 26px;mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.c{position:relative;z-index:1}
.k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;opacity:.8}
h1{font-family:'Syne';font-weight:800;font-size:clamp(48px,9vw,120px);line-height:.92;letter-spacing:-.05em;margin:16px 0 14px}
p{max-width:430px;margin:0 auto;color:rgba(255,255,255,.72);font-size:17px;line-height:1.55}
.sw{display:inline-flex;gap:8px;margin-top:34px;padding:7px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px)}
.sw button{display:flex;align-items:center;gap:8px;border:0;background:none;color:rgba(255,255,255,.7);font:600 13px 'Inter';padding:9px 15px;border-radius:99px;cursor:pointer;transition:all .25s}
.sw button i{width:14px;height:14px;border-radius:50%;background:var(--g)}
.sw button[aria-pressed=true]{background:#fff;color:#0a0d18}
.sw button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.b{animation:none}}
</style></head><body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="dots"></div><div class="grain"></div>
<div class="c">
  <div class="k">Backdrop · 03 presets</div>
  <h1 id="h">Aurora</h1>
  <p>A living gradient field built from three blurred light sources. Pick a mood — the whole canvas re-tints in a second.</p>
  <div class="sw" role="group" aria-label="Preset">
    <button aria-pressed="true" data-n="Aurora" data-a="#00E0B8" data-b="#2D6BFF" data-c="#7A3CFF" style="--g:linear-gradient(135deg,#00E0B8,#7A3CFF)"><i></i>Aurora</button>
    <button aria-pressed="false" data-n="Ember" data-a="#FF7A18" data-b="#FF2E63" data-c="#7A1CAC" style="--g:linear-gradient(135deg,#FF7A18,#FF2E63)"><i></i>Ember</button>
    <button aria-pressed="false" data-n="Tide" data-a="#00B4D8" data-b="#0077B6" data-c="#48CAE4" style="--g:linear-gradient(135deg,#00B4D8,#0077B6)"><i></i>Tide</button>
  </div>
</div>
<script>
const r=document.documentElement.style,h=document.getElementById('h');
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sw button').forEach(x=>x.setAttribute('aria-pressed',x===b));
 r.setProperty('--c1',b.dataset.a);r.setProperty('--c2',b.dataset.b);r.setProperty('--c3',b.dataset.c);h.textContent=b.dataset.n});
</script></body></html>
