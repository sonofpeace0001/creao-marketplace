<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bar Race Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E1018;color:#ECEEF8;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:640px;border-radius:28px;background:#151827;padding:24px 26px 26px;box-shadow:0 40px 60px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08);position:relative;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.hd h1{font-size:21px;font-weight:700;letter-spacing:-.03em}.hd small{display:block;font:400 11.500px 'Space Mono';color:#7C84A6;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.yr{font:700 64px/.9 'Space Grotesk';letter-spacing:-.06em;color:rgba(255,255,255,.14);font-variant-numeric:tabular-nums;position:absolute;right:26px;top:16px;pointer-events:none}
.ls{position:relative;height:calc(var(--n)*46px)}
.rw{position:absolute;left:0;right:0;height:38px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;transition:transform .7s cubic-bezier(.3,1.1,.4,1)}
.rw span{font-size:13.500px;font-weight:600;text-align:right;color:#B3B9D4;white-space:nowrap}
.tk{position:relative;height:100%}.tk i{position:absolute;left:0;top:0;bottom:0;border-radius:6px 12px 12px 6px;width:var(--w,0%);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#151827),var(--c));box-shadow:0 0 18px -4px var(--c);transition:width .3s linear}
.tk b{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--w,0%) + 10px);font:700 13px 'Space Mono';color:#fff;font-variant-numeric:tabular-nums;transition:left .3s linear}
.tk i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:36px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35));border-radius:inherit}
.ct{display:flex;gap:10px;margin-top:18px;align-items:center}.ct button{border:0;border-radius:10px;padding:9px 14px;background:rgba(255,255,255,.1);color:#fff;font:700 13px 'Space Grotesk';cursor:pointer}.ct button:hover{background:rgba(255,255,255,.18)}.ct button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ct .tl{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}.ct .tl i{display:block;height:100%;width:var(--p,0%);background:#7C8CFF;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="cd"><div class="hd"><div><h1>Monthly active users</h1><small>Top 6 products, thousands</small></div></div><div class="ls" id="ls" style="--n:6"></div><div class="yr" id="yr">2018</div><div class="ct"><button id="pl">Pause</button><div class="tl"><i id="tl"></i></div></div></div>
<script>
const P=[['Atlas','#7C8CFF',40,38],['Beacon','#22D3EE',22,64],['Cinder','#FB7185',58,22],['Drift','#FBBF24',14,60],['Ember','#34D399',30,44],['Flux','#C084FC',8,70],['Gale','#F97316',46,16],['Halo','#2DD4BF',18,52]];
const Y0=2018,Y1=2026,ls=document.getElementById('ls'),yr=document.getElementById('yr'),tl=document.getElementById('tl');
const st=P.map((p,i)=>{const d=document.createElement('div');d.className='rw';d.innerHTML='<span>'+p[0]+'</span><div class="tk" style="--c:'+p[1]+'"><i></i><b></b></div>';ls.appendChild(d);return{el:d,bar:d.querySelector('i'),val:d.querySelector('b'),p}});
function val(p,t){const x=(t-Y0)/(Y1-Y0);return Math.max(2,p[2]+p[3]*Math.pow(x,1.3)*(1.3+Math.sin(x*5+p[2])*.35)*(p[3]>45?1.4:1)*(p[0]==='Cinder'?.6:1))}
let t=Y0+.0,play=true,off=false,last=0;
function draw(){const arr=st.map(s=>({s,v:val(s.p,t)}));arr.sort((a,b)=>b.v-a.v);const mx=arr[0].v*1.12;arr.forEach((a,i)=>{const rank=i<6?i:6;a.s.el.style.transform='translateY('+(rank*46)+'px)';a.s.el.style.opacity=i<6?1:0;a.s.bar.style.setProperty('--w',(a.v/mx*100)+'%');a.s.bar.parentNode.style.setProperty('--w',(a.v/mx*86)+'%');a.s.bar.style.width=(a.v/mx*86)+'%';a.s.val.textContent=Math.round(a.v*12.5).toLocaleString('en-US')});yr.textContent=Math.floor(t);tl.style.setProperty('--p',((t-Y0)/(Y1-Y0)*100)+'%')}
draw();
document.getElementById('pl').onclick=e=>{off=true;play=!play;e.target.textContent=play?'Pause':'Play'};
/* Idle demo: time runs from 2018 to 2026; each bar grows with its own curve and a mono counter, rows overtake one another and glide into their new rank with a springy slide, a ghost year counter ticks in the corner and the timeline fills, then the race loops, until you pause. */
t=Y0+4.1;draw();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){play=false;setTimeout(()=>{if(!off)play=true},3600);requestAnimationFrame(function f(n){const dt=Math.min(.05,(n-last)/1000||0);last=n;if(play){t+=dt*.55;if(t>=Y1){t=Y1;draw();play=false;setTimeout(()=>{t=Y0;if(!off)play=true},2400)}else draw()}requestAnimationFrame(f)})}
</script></body></html>
