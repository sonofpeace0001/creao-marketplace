<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agent Browser Cursor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E4E8F2;color:#101828;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.wr{width:100%;max-width:720px;display:grid;grid-template-columns:1fr 190px;gap:14px;align-items:stretch}
.bw{position:relative;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 36px 50px -30px rgba(16,24,40,.55),inset 0 0 0 1px rgba(16,24,40,.08);height:476px}
.tb{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#F2F4F9;border-bottom:1px solid #E3E7F0}.tb i{width:10px;height:10px;border-radius:50%;background:#D5DAE6}.tb .u{flex:1;margin-left:8px;padding:6px 12px;border-radius:99px;background:#fff;font:500 11.500px 'JetBrains Mono';color:#667085;box-shadow:inset 0 0 0 1px #E3E7F0}
.pg{padding:22px 24px}.pg h3{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}.pg p{font-size:13px;color:#667085;margin-bottom:16px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fd{border-radius:12px;box-shadow:inset 0 0 0 1.5px #D8DDEA;padding:9px 12px;transition:box-shadow .2s}.fd.fc{box-shadow:inset 0 0 0 2px #6366F1}.fd small{display:block;font-size:10.500px;font-weight:700;letter-spacing:.1em;color:#8A93A8;text-transform:uppercase}.fd b{display:block;font-size:15px;font-weight:600;min-height:21px}
.sb{margin-top:12px;width:100%;border:0;border-radius:12px;padding:12px;background:#101828;color:#fff;font:700 14.500px 'Inter Tight';transition:transform .15s,background .3s}.sb.pr{transform:scale(.97);background:#6366F1}
.rs{margin-top:14px;display:grid;gap:7px}.rs div{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#F5F6FB;opacity:0;transform:translateY(8px);transition:all .4s}.rs.on div{opacity:1;transform:none}.rs div:nth-child(2){transition-delay:.12s}.rs div:nth-child(3){transition-delay:.24s}
.rs em{font-style:normal;font:700 11px 'JetBrains Mono';padding:3px 8px;border-radius:6px;background:#E0E7FF;color:#4338CA}.rs b{font-size:13.500px}.rs span{margin-left:auto;font:600 13.500px 'JetBrains Mono'}
.cu{position:absolute;left:0;top:0;z-index:5;pointer-events:none;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.cu svg{width:24px;height:24px;filter:drop-shadow(0 3px 5px rgba(99,102,241,.5))}.cu span{position:absolute;left:18px;top:20px;padding:3px 9px;border-radius:7px 99px 99px 99px;background:#6366F1;color:#fff;font:600 11.500px 'Inter Tight';white-space:nowrap}
.cu.cl svg{animation:ck .35s}@keyframes ck{40%{transform:scale(.78)}}
.lg{background:#101828;border-radius:18px;padding:14px;color:#A3ADC4;box-shadow:0 36px 50px -30px rgba(16,24,40,.7);overflow:hidden;position:relative}.lg h4{font:600 11px 'JetBrains Mono';letter-spacing:.14em;color:#818CF8;margin-bottom:10px}
.lg div.l{font:400 11.500px/1.5 'JetBrains Mono';padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);animation:in .35s}.lg .l b{color:#fff;font-weight:500}.lg .l i{color:#6EE7B7;font-style:normal}@keyframes in{from{opacity:0;transform:translateX(8px)}}
@media(max-width:640px){.wr{grid-template-columns:1fr}.lg{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wr"><div class="bw" id="bw"><div class="tb"><i></i><i></i><i></i><span class="u">https://flights.skyline.app/search</span></div>
<div class="pg"><h3>Find a flight</h3><p>Round trip · 1 adult · Economy</p><div class="fl"><div class="fd" id="f1"><small>From</small><b></b></div><div class="fd" id="f2"><small>To</small><b></b></div><div class="fd" id="f3"><small>Depart</small><b></b></div><div class="fd" id="f4"><small>Return</small><b></b></div></div><button class="sb" id="sb">Search flights</button>
<div class="rs" id="rs"><div><em>BA 117</em><b>Direct · 7h 05m</b><span>$482</span></div><div><em>VS 003</em><b>Direct · 7h 15m</b><span>$511</span></div><div><em>AA 101</em><b>1 stop · 9h 40m</b><span>$398</span></div></div></div>
<div class="cu" id="cu"><svg viewBox="0 0 24 24"><path d="M4 3l16 8-7 2-3 7Z" fill="#6366F1" stroke="#fff" stroke-width="1.800" stroke-linejoin="round"/></svg><span>Agent</span></div></div>
<div class="lg"><h4>ACTION LOG</h4><div id="lg"></div></div></div>
<script>
const $=id=>document.getElementById(id),bw=$('bw'),cu=$('cu'),lg=$('lg'),sl=ms=>new Promise(r=>setTimeout(r,ms));let off=false;
const F=[['f1','New York (JFK)'],['f2','London (LHR)'],['f3','Mon 12 Oct'],['f4','Sun 18 Oct']];
function logL(a,b){const d=document.createElement('div');d.className='l';d.innerHTML='<b>'+a+'</b> '+b;lg.appendChild(d);while(lg.children.length>7)lg.firstChild.remove()}
function go(el,dx,dy){const b=bw.getBoundingClientRect(),r=el.getBoundingClientRect();cu.style.transform='translate('+(r.left-b.left+(dx||40))+'px,'+(r.top-b.top+(dy||24))+'px)'}
async function click(el,log1,log2){go(el);await sl(950);cu.classList.add('cl');await sl(80);cu.classList.remove('cl');if(log1)logL(log1,log2)}
async function type(id,txt){const f=$(id),b=f.querySelector('b');f.classList.add('fc');b.textContent='';for(const ch of txt){b.textContent+=ch;await sl(45)}f.classList.remove('fc')}
function setAll(){F.forEach(([id,t])=>{$(id).querySelector('b').textContent=t});$('rs').classList.remove('on')}
function clearAll(){F.forEach(([id])=>{$(id).querySelector('b').textContent=''});$('rs').classList.remove('on');lg.innerHTML=''}
setAll();$('rs').classList.add('on');logL('navigate','<i>flights.skyline.app</i>');logL('click','#from');logL('type','"New York (JFK)"');logL('click','#to');logL('type','"London (LHR)"');logL('click','#search');
cu.style.transition='none';go($('sb'),120,12);requestAnimationFrame(()=>requestAnimationFrame(()=>cu.style.transition=''));
/* Idle demo: an AI agent cursor glides across a flight search page, clicks each field, types the airports and dates, presses Search so three fares slide in, and every step is written into the action log beside it, then the form clears and the run repeats, until you move your pointer over it. */
bw.addEventListener('pointermove',()=>{off=true});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3600);while(!off){clearAll();logL('navigate','<i>flights.skyline.app</i>');await sl(600);await click($('f1'),'click','#from');await type('f1',F[0][1]);logL('type','"'+F[0][1]+'"');await click($('f2'),'click','#to');await type('f2',F[1][1]);logL('type','"'+F[1][1]+'"');await click($('f3'),'click','#depart');await type('f3',F[2][1]);logL('type','"'+F[2][1]+'"');await click($('f4'),'click','#return');await type('f4',F[3][1]);logL('type','"'+F[3][1]+'"');go($('sb'),120,12);await sl(950);$('sb').classList.add('pr');cu.classList.add('cl');await sl(200);$('sb').classList.remove('pr');cu.classList.remove('cl');logL('click','#search');await sl(400);$('rs').classList.add('on');logL('read','<i>3 results found</i>');await sl(4200)}})()}
</script></body></html>
