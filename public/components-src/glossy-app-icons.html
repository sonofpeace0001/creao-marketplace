<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Glossy App Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#2B1B5A,#0F2A5C 55%,#0B3B52);color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{width:100%;max-width:560px;display:grid;gap:26px;justify-items:center}
.hd{display:flex;justify-content:space-between;align-items:center;width:100%}.hd h1{font-size:26px;font-weight:800;letter-spacing:-.04em}
.ed{border:0;border-radius:99px;padding:10px 18px;background:rgba(255,255,255,.14);color:#fff;font:700 13px 'Outfit';cursor:pointer;backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}.ed:focus-visible{outline:3px solid #fff;outline-offset:3px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px;width:100%}
.a{--a:#FF6B6B;--b:#C9184A;position:relative;border:0;background:none;display:grid;justify-items:center;gap:9px;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.a:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:24px}
.ic{position:relative;width:100%;max-width:96px;aspect-ratio:1;border-radius:27%;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 18px 22px -12px var(--b),inset 0 -6px 10px rgba(0,0,0,.18),inset 0 1.500px 0 rgba(255,255,255,.5);display:grid;place-items:center;overflow:hidden;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.ic::before{content:"";position:absolute;left:6%;right:6%;top:3%;height:46%;border-radius:50% 50% 60% 60%/70% 70% 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.04))}
.ic::after{content:"";position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(18deg) translateX(0);animation:shine 6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shine{0%,70%{transform:rotate(18deg) translateX(0)}100%{transform:rotate(18deg) translateX(420%)}}
.ic svg{position:relative;width:50%;height:50%;overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28));z-index:1}.ic svg *{fill:none;stroke:#fff;stroke-width:2.100;stroke-linecap:round;stroke-linejoin:round}
.a b{font-size:13px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.a:hover .ic,.a.up .ic{transform:translateY(-6px) scale(1.07) rotate(-2deg)}
.a:active .ic{transform:scale(.92)}
.a.go .ic{animation:launch .7s cubic-bezier(.3,1.6,.5,1)}@keyframes launch{0%{transform:scale(1)}35%{transform:scale(.88)}65%{transform:scale(1.18) translateY(-10px)}100%{transform:scale(1)}}
.dl{position:absolute;left:2px;top:-6px;width:24px;height:24px;border-radius:50%;background:#E5E7EB;color:#111;display:none;place-items:center;font:700 16px/1 'Outfit';box-shadow:0 3px 6px rgba(0,0,0,.35);z-index:3}
.g.jig .dl{display:grid}.g.jig .a:nth-child(odd) .ic{animation:jg .22s ease-in-out infinite alternate}.g.jig .a:nth-child(even) .ic{animation:jg .26s ease-in-out infinite alternate-reverse}
@keyframes jg{from{transform:rotate(-2.600deg)}to{transform:rotate(2.600deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Home screen, glossed</h1><button class="ed" id="ed" aria-pressed="false">Edit layout</button></div><div class="g" id="g"></div></div>
<script>
const A=[['Photos','#FFB347','#E8590C','<circle cx="12" cy="12" r="3.500"/><path d="M12 3v4.500M12 16.500V21M3 12h4.500M16.500 12H21M5.600 5.600l3.200 3.200M15.200 15.200l3.200 3.200M18.400 5.600l-3.200 3.200M8.800 15.200l-3.200 3.200"/>'],['Messages','#4ADE80','#15803D','<path d="M4 5h16v11H9.500L5 20v-4H4Z"/>'],['Wallet','#60A5FA','#1D4ED8','<rect x="3" y="6.500" width="18" height="13" rx="3"/><path d="M15 12h6v4h-6a2 2 0 0 1 0-4ZM5 6.500 16 4v2.500"/>'],['Music','#F472B6','#BE185D','<path d="M9 18V6l10-2v12M9 18a2.500 2.500 0 1 1-5 0 2.500 2.500 0 0 1 5 0ZM19 16a2.500 2.500 0 1 1-5 0 2.500 2.500 0 0 1 5 0Z"/>'],['Maps','#34D399','#047857','<path d="M12 21s-6.500-5.800-6.500-11a6.500 6.500 0 0 1 13 0c0 5.200-6.500 11-6.500 11Z"/><circle cx="12" cy="10" r="2.400"/>'],['Health','#FB7185','#BE123C','<path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 7.300 4.300 4.300 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10ZM7 12h2.500l1.500-3 2 6 1.500-3H17"/>'],['Focus','#A78BFA','#5B21B6','<path d="M20 14.500A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500Z"/>'],['Notes','#FCD34D','#B45309','<path d="M6 3h9l4 4v14H6ZM15 3v4h4M9 12h7M9 16h5"/>']];
const g=document.getElementById('g'),ed=document.getElementById('ed');
A.forEach(([n,a,b,p],i)=>{const e=document.createElement('button');e.className='a';e.style.cssText='--a:'+a+';--b:'+b+';--d:'+(i*.45)+'s';e.setAttribute('aria-label',n);e.innerHTML='<span class="dl" aria-hidden="true">&minus;</span><span class="ic"><svg viewBox="0 0 24 24">'+p+'</svg></span><b>'+n+'</b>';
 e.onclick=()=>{off=true;e.classList.remove('go');void e.offsetWidth;e.classList.add('go')};g.appendChild(e)});
ed.onclick=()=>{off=true;const j=g.classList.toggle('jig');ed.setAttribute('aria-pressed',j);ed.textContent=j?'Done':'Edit layout'};
const ap=[...g.children];ap[2].classList.add('up');
/* Idle demo: apps lift and launch in turn while a glint sweeps across each icon, and every few seconds the grid enters jiggle mode, until a tap. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3600);let k=0;while(!off){const a=ap[k++%8];ap.forEach(x=>x.classList.remove('up'));a.classList.add('up');a.classList.remove('go');void a.offsetWidth;a.classList.add('go');await sleep(1100);if(k%8===0){g.classList.add('jig');await sleep(2400);g.classList.remove('jig')}}ap.forEach(x=>x.classList.remove('up'))})()}
</script></body></html>
