<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spec Sheet Accordion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{--a:#C6F432;background:#0B0C0A;color:#E9ECE2;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:580px;background:#12140F;border-radius:22px;padding:24px;box-shadow:0 40px 60px -34px #000,inset 0 0 0 1px rgba(198,244,50,.12);position:relative;overflow:hidden}
.cd::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(198,244,50,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(198,244,50,.04) 1px,transparent 1px);background-size:24px 24px;pointer-events:none;mask-image:linear-gradient(#000,transparent 70%)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;position:relative}.hd h1{font-size:25px;font-weight:700;letter-spacing:-.03em}.hd small{display:block;font:500 11px 'IBM Plex Mono';letter-spacing:.14em;color:var(--a);margin-bottom:5px}.hd span{font:500 11.500px 'IBM Plex Mono';color:#7C8272}
.it{position:relative;border:1px solid rgba(255,255,255,.09);border-radius:14px;margin-bottom:8px;background:rgba(255,255,255,.02);overflow:hidden}.an .it{transition:border-color .4s,background .4s}.it.on{border-color:rgba(198,244,50,.45);background:rgba(198,244,50,.04)}
.bt{width:100%;display:grid;grid-template-columns:1fr auto 20px;gap:14px;align-items:center;padding:15px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}.bt:focus-visible{outline:2px solid var(--a);outline-offset:-2px}
.bt b{font-size:16px;font-weight:600}.bt em{font:500 12.500px 'IBM Plex Mono';font-style:normal;color:#8A917C}.it.on .bt em{color:var(--a)}
.ch{width:10px;height:10px;border-right:2px solid #8A917C;border-bottom:2px solid #8A917C;transform:rotate(45deg) translate(-2px,-2px)}.an .ch{transition:transform .4s cubic-bezier(.3,1.5,.5,1)}.it.on .ch{transform:rotate(225deg);border-color:var(--a)}
.pn{display:grid;grid-template-rows:0fr}.an .pn{transition:grid-template-rows .55s cubic-bezier(.4,0,.2,1)}.it.on .pn{grid-template-rows:1fr}.pn>div{overflow:hidden}
.mt{padding:2px 16px 16px;display:grid;gap:12px}
.r{display:grid;grid-template-columns:118px 1fr 74px;gap:12px;align-items:center;font:500 12.500px 'IBM Plex Mono'}.r span{color:#8A917C}.r b{text-align:right;color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.tk{position:relative;height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 2px,transparent 2px 6px)}
.tk i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,var(--a) 0 2px,transparent 2px 6px);filter:drop-shadow(0 0 6px rgba(198,244,50,.6))}
.an .tk i{transition:width .9s cubic-bezier(.2,.8,.2,1)}.it.on .tk i{width:var(--w)}
.nt{margin-top:2px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.12);font:400 12.500px/1.5 'IBM Plex Mono';color:#7C8272}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="cd"><div class="hd"><div><small>MODEL H-7 / SPEC SHEET</small><h1>Halo Over-Ear</h1></div><span>REV 4.2</span></div><div id="ac"></div></div>
<script>
const S=[['Drivers','40 mm beryllium',[['Frequency','4 Hz to 48 kHz',.96,48,' kHz'],['Distortion','THD under 0.05%',.12,0.05,' %'],['Sensitivity','Per 1 mW',.82,104,' dB']],'Dual-layer diaphragm with a tuned rear chamber.'],
['Battery','52 hours',[['Playback','ANC on',.7,38,' h'],['Playback','ANC off',1,52,' h'],['Quick charge','10 min = 6 h',.2,10,' min']],'USB-C PD, full charge in 1 h 45 min.'],
['Noise cancelling','Adaptive hybrid',[['Low band','Up to 800 Hz',.94,42,' dB'],['Mid band','Up to 2 kHz',.7,31,' dB'],['Latency','Mic to driver',.1,0.8,' ms']],'Eight microphones sampled at 192 kHz.'],
['Connectivity','Bluetooth 5.4',[['Range','Open air',.8,40,' m'],['Codecs','LDAC, aptX, AAC',.9,990,' kbps'],['Multipoint','Devices',.4,3,'']],'Auracast ready with seamless handover.']];
const ac=document.getElementById('ac'),its=[];
S.forEach((s,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML='<button class="bt" aria-expanded="false"><b>'+s[0]+'</b><em>'+s[1]+'</em><span class="ch"></span></button><div class="pn"><div><div class="mt">'+s[2].map(r=>'<div class="r"><span>'+r[0]+'<br>'+r[1]+'</span><div class="tk" style="--w:'+(r[2]*100)+'%"><i></i></div><b data-v="'+r[3]+'" data-u="'+r[4]+'">0'+r[4]+'</b></div>').join('')+'<div class="nt">'+s[3]+'</div></div></div></div>';d.querySelector('.bt').onclick=()=>{off=true;open(i)};ac.appendChild(d);its.push(d)});
let tm=0;
function count(d){const bs=[...d.querySelectorAll('b[data-v]')];const t0=performance.now();cancelAnimationFrame(tm);(function f(n){const k=Math.min(1,(n-t0)/900),e=1-Math.pow(1-k,3);bs.forEach(b=>{const v=+b.dataset.v;b.textContent=(v%1?(v*e).toFixed(2):Math.round(v*e).toLocaleString('en-US'))+b.dataset.u});if(k<1)tm=requestAnimationFrame(f)})(t0)}
function open(i){its.forEach((d,k)=>{const o=k===i&&!d.classList.contains('on');d.classList.toggle('on',o);d.querySelector('.bt').setAttribute('aria-expanded',o);if(o)count(d)})}
open(0);cancelAnimationFrame(tm);its[0].querySelectorAll('b[data-v]').forEach(b=>{b.textContent=(+b.dataset.v%1?(+b.dataset.v).toFixed(2):(+b.dataset.v).toLocaleString('en-US'))+b.dataset.u});
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('an')));
/* Idle demo: after 3s the sections open in turn; the panel expands, tick-mark gauges charge from empty with a glow and every value counts up to its figure, then the previous panel collapses, until you click one. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3400);let k=0;while(!off){k=(k+1)%S.length;open(k);await sleep(3200)}})()}
</script></body></html>
