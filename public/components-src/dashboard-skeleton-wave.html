<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Skeleton Wave</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0C0F18;color:#E8ECF7;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ap{width:100%;max-width:920px;display:grid;grid-template-columns:190px 1fr;background:#111522;border:1px solid #1D2336;border-radius:26px;overflow:hidden;box-shadow:0 40px 80px -30px #000}
.sd{background:#0E121D;border-right:1px solid #1B2133;padding:18px 14px;display:flex;flex-direction:column;gap:10px}
.mn{padding:20px 22px;position:relative}
.sk{position:relative;overflow:hidden;background:#262F4E;border-radius:10px}.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(160,180,255,.3) 50%,transparent 70%);transform:translateX(-120%);animation:wv 1.9s ease-in-out infinite;animation-delay:var(--w,0s)}@keyframes wv{to{transform:translateX(120%)}}
.lg{height:22px;width:110px;margin:4px 6px 14px}.it{height:34px}.it.on{background:#37426B}
.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.tp .t{height:24px;width:180px}.tp .r{display:flex;gap:10px}.tp .r div{height:34px;width:34px;border-radius:50%}.tp .r div.p{width:110px;border-radius:99px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.kp div{height:96px;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.kp div i{display:block;height:10px;width:40%;border-radius:6px;background:#323D63}.kp div b{display:block;height:24px;width:60%;border-radius:8px;background:#323D63}
.ch{height:210px;border-radius:18px;margin-bottom:14px;padding:18px;display:flex;align-items:flex-end;gap:10px}.ch i{flex:1;border-radius:6px 6px 2px 2px;background:#323D63;height:var(--h)}
.tb{border-radius:18px;padding:14px}.tb div{display:grid;grid-template-columns:34px 1.4fr 1fr 80px;gap:14px;align-items:center;padding:8px 0}.tb i{display:block;height:10px;border-radius:6px;background:#323D63}.tb i.a{height:30px;width:30px;border-radius:50%}
.ts{position:absolute;right:22px;bottom:16px;font-size:12.5px;color:#6A7498;display:flex;align-items:center;gap:8px}.ts i{width:8px;height:8px;border-radius:50%;background:#FBBF24;animation:bl 1s infinite}@keyframes bl{50%{opacity:.3}}
.ct{position:absolute;inset:0;background:#111522;opacity:0;pointer-events:none;transition:opacity .6s}.ap.dn .ct{opacity:1;pointer-events:auto}
.ap.dn .sk::after{animation:none}
.cv{padding:20px 22px;height:100%}
.bt{position:absolute;left:22px;bottom:14px;z-index:5;border:1px solid #2A3250;background:#161B2E;color:#C9D1EE;border-radius:99px;padding:7px 16px;font:600 12.5px 'Manrope';cursor:pointer}.bt:focus-visible{outline:2px solid #818CF8}
@media(max-width:720px){.ap{grid-template-columns:1fr}.sd{display:none}.kp{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.sk::after{animation:none}}
</style></head><body>
<div class="ap" id="ap"><aside class="sd"><div class="sk lg"></div><div class="sk it on" style="--w:.1s"></div><div class="sk it" style="--w:.2s"></div><div class="sk it" style="--w:.3s"></div><div class="sk it" style="--w:.4s"></div><div class="sk it" style="--w:.5s"></div></aside>
<main class="mn"><div class="tp"><div class="sk t"></div><div class="r"><div class="sk p" style="--w:.1s"></div><div class="sk" style="--w:.2s;border-radius:50%"></div></div></div>
<div class="kp"><div class="sk" style="--w:.1s"><i></i><b></b></div><div class="sk" style="--w:.25s"><i></i><b></b></div><div class="sk" style="--w:.4s"><i></i><b></b></div></div>
<div class="sk ch" style="--w:.2s"><i style="--h:40%"></i><i style="--h:62%"></i><i style="--h:48%"></i><i style="--h:76%"></i><i style="--h:58%"></i><i style="--h:90%"></i><i style="--h:68%"></i><i style="--h:84%"></i><i style="--h:52%"></i><i style="--h:72%"></i></div>
<div class="sk tb" style="--w:.35s"><div><i class="a"></i><i></i><i></i><i></i></div><div><i class="a"></i><i></i><i></i><i></i></div><div><i class="a"></i><i></i><i></i><i></i></div></div>
<div class="ts"><i></i>Loading your workspace...</div><button class="bt" id="bt">Preview loaded state</button></main></div>
<script>
const ap=document.getElementById('ap'),bt=document.getElementById('bt'),ts=document.querySelector('.ts');let ld=false;
bt.onclick=()=>{ld=!ld;ap.classList.toggle('dn',ld);bt.textContent=ld?'Back to skeleton':'Preview loaded state';ts.style.opacity=ld?0:1;if(ld)showContent()};
function showContent(){const m=ap.querySelector('.mn');if(m.querySelector('.ct'))return;const d=document.createElement('div');d.className='ct';d.innerHTML='<div class="cv"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 style="font-size:24px;font-weight:800;letter-spacing:-.045em">Overview</h2><span style="font-size:13px;color:#8A93B8">Last 30 days</span></div><div class="kp" style="margin-bottom:14px"><div style="background:#1A2033;height:96px;border-radius:18px;padding:14px"><span style="font-size:12.5px;color:#8A93B8">Revenue</span><b style="display:block;font-size:26px;font-weight:800;letter-spacing:-.05em;margin-top:8px">$48.2k</b></div><div style="background:#1A2033;height:96px;border-radius:18px;padding:14px"><span style="font-size:12.5px;color:#8A93B8">Users</span><b style="display:block;font-size:26px;font-weight:800;letter-spacing:-.05em;margin-top:8px">2,931</b></div><div style="background:#1A2033;height:96px;border-radius:18px;padding:14px"><span style="font-size:12.5px;color:#8A93B8">Conversion</span><b style="display:block;font-size:26px;font-weight:800;letter-spacing:-.05em;margin-top:8px">3.8%</b></div></div><div style="height:210px;background:#1A2033;border-radius:18px;padding:18px;display:flex;align-items:flex-end;gap:10px">'+[40,62,48,76,58,90,68,84,52,72].map(h=>'<i style="flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#818CF8,#4F46E5);height:'+h+'%"></i>').join('')+'</div></div>';m.appendChild(d)}
showContent();
</script></body></html>
