<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Split Export Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Instrument+Serif&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EFEBE2;color:#1D1A14;font-family:'Instrument Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{position:relative;width:100%;max-width:560px;border-radius:28px;background:#fff;padding:26px;box-shadow:0 30px 44px -30px rgba(29,26,20,.5),inset 0 0 0 1px rgba(29,26,20,.07);min-height:640px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.hd h1{font:400 34px/1 'Instrument Serif';letter-spacing:-.02em}.hd span{font:500 12px 'Geist Mono';color:#9A917D}
.sp{position:relative;display:inline-flex}
.bt{display:flex;align-items:center;gap:9px;border:0;height:48px;background:#1D1A14;color:#fff;font:700 14.500px 'Instrument Sans';cursor:pointer;transition:background .3s,width .5s cubic-bezier(.3,1.2,.4,1);overflow:hidden;position:relative}
.bt:focus-visible{outline:3px solid #E8590C;outline-offset:3px}
.m{border-radius:14px 0 0 14px;padding:0 18px 0 16px;min-width:140px}.c{border-radius:0 14px 14px 0;width:46px;justify-content:center;border-left:1px solid rgba(255,255,255,.2)}
.sp.run .m{background:#E8590C}.sp.run .c{background:#E8590C;border-color:rgba(255,255,255,.3)}.sp.ok .m,.sp.ok .c{background:#16A34A;border-color:rgba(255,255,255,.3)}
.bt svg{width:18px;height:18px;flex:none}.bt svg *{fill:none;stroke:currentColor;stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}
.c svg{transition:transform .3s}.c[aria-expanded=true] svg{transform:rotate(180deg)}
.bt .pg{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:rgba(255,255,255,.85)}
.bt .lb{white-space:nowrap}
.mn{position:absolute;left:0;top:calc(100% + 10px);width:290px;border-radius:20px;background:#fff;padding:6px;box-shadow:0 30px 54px -14px rgba(29,26,20,.45),inset 0 0 0 1px rgba(29,26,20,.1);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;pointer-events:none;transition:opacity .22s,transform .35s cubic-bezier(.3,1.5,.5,1);z-index:5}
.mn.on{opacity:1;transform:none;pointer-events:auto}
.hh{font:600 10.500px 'Geist Mono';letter-spacing:.14em;text-transform:uppercase;color:#A59D88;padding:8px 10px 4px}
.o{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:13px;cursor:pointer;transition:background .12s;animation:in .35s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*35ms)}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.o.hl{background:#FFF1E6}.o .ft{width:38px;height:44px;border-radius:8px 14px 8px 8px;background:var(--c);display:grid;place-items:end center;padding-bottom:5px;font:700 9.500px 'Geist Mono';color:#fff;letter-spacing:.04em;position:relative;flex:none}.o .ft::after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;background:linear-gradient(225deg,rgba(255,255,255,.55) 50%,rgba(0,0,0,.2) 50%);border-radius:0 0 0 4px}
.o b{display:block;font-size:14.500px;font-weight:600}.o span{font-size:12px;color:#8F8670}.o small{margin-left:auto;font:500 11.500px 'Geist Mono';color:#A59D88}
.sd{height:1px;background:#EFEBE0;margin:5px 8px}
.pv{margin-top:22px;border-radius:20px;background:#F6F2E9;padding:18px;display:grid;gap:10px}.pv .tt{display:flex;justify-content:space-between;font-size:15px;font-weight:700}.pv .tt span{font:500 12px 'Geist Mono';color:#9A917D}
.bs{display:flex;align-items:flex-end;gap:6px;height:80px}.bs i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#E8590C,#F6B38C)}
.ln{height:8px;border-radius:4px;background:#E6E0D2}.ln:nth-child(2){width:80%}
.ts{position:absolute;right:24px;bottom:24px;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:16px;background:#1D1A14;color:#fff;box-shadow:0 24px 36px -12px rgba(0,0,0,.6);opacity:0;transform:translateY(16px) scale(.94);transition:all .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none;max-width:calc(100% - 48px)}
.ts.on{opacity:1;transform:none}.ts .ic{width:32px;height:32px;border-radius:10px;background:#16A34A;display:grid;place-items:center;flex:none}.ts .ic svg{width:17px;height:17px}.ts .ic svg *{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ts b{display:block;font-size:14px}.ts small{font:500 11.500px 'Geist Mono';color:#A59D88}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="w" id="w"><div class="hd"><h1>Q3 report</h1><span>Updated 2 min ago</span></div>
<div class="sp" id="sp"><button class="bt m" id="mb"><svg viewBox="0 0 24 24" id="mi"></svg><span class="lb" id="ml">Export PDF</span><i class="pg" id="pg"></i></button><button class="bt c" id="cb" aria-haspopup="menu" aria-expanded="false" aria-label="Choose export format"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
<div class="mn" id="mn" role="menu"><div class="hh">Download as</div><div id="fl"></div><div class="sd"></div><div class="hh">Share</div><div class="o" style="--i:6" role="menuitem" data-k="link"><span class="ft" style="--c:#6366F1">URL</span><div><b>Copy public link</b><span>Anyone with the link can view</span></div></div></div></div>
<div class="pv"><div class="tt">Revenue by week<span>Oct 2026</span></div><div class="bs"><i style="height:42%"></i><i style="height:58%"></i><i style="height:48%"></i><i style="height:72%"></i><i style="height:64%"></i><i style="height:88%"></i><i style="height:78%"></i><i style="height:96%"></i></div><div class="ln"></div><div class="ln"></div></div>
<div class="ts" id="ts"><span class="ic"><svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><div><b id="tb">Exported</b><small id="tm"></small></div></div></div>
<script>
const FM=[['PDF','Document','#E11D48','1.2 MB','report-q3.pdf','<path d="M7 3h8l4 4v14H7ZM15 3v4h4M10 13h6M10 17h4"/>'],['PNG','Image','#0891B2','840 KB','report-q3.png','<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.800"/><path d="m21 16-5-5-9 9"/>'],['SVG','Vector','#7C3AED','96 KB','report-q3.svg','<path d="M12 3 3 8v8l9 5 9-5V8ZM12 3v18M3 8l18 8M21 8 3 16"/>'],['CSV','Spreadsheet','#16A34A','48 KB','report-q3.csv','<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>'],['XLSX','Workbook','#15803D','212 KB','report-q3.xlsx','<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/>']];
const sp=document.getElementById('sp'),mn=document.getElementById('mn'),cb=document.getElementById('cb'),fl=document.getElementById('fl'),ml=document.getElementById('ml'),mi=document.getElementById('mi'),pg=document.getElementById('pg'),ts=document.getElementById('ts');let cur=0,hl=1,open=false,busy=false;
const DL='<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>';mi.innerHTML=DL;
FM.forEach(([k,d,c,s,f,p],i)=>{const e=document.createElement('div');e.className='o';e.style.cssText='--i:'+i;e.setAttribute('role','menuitem');e.innerHTML='<span class="ft" style="--c:'+c+'">'+k+'</span><div><b>'+k+'</b><span>'+d+'</span></div><small>'+s+'</small>';e.onclick=()=>{off=true;run(i)};e.onmouseenter=()=>{off=true;hl=i;paint()};fl.appendChild(e)});
mn.querySelector('[data-k=link]').onclick=()=>{off=true;setOpen(false);toast('Link copied','Public link is on your clipboard')};
const os=[...fl.children];
function paint(){os.forEach((o,i)=>o.classList.toggle('hl',i===hl))}
function setOpen(o){open=o;mn.classList.toggle('on',o);cb.setAttribute('aria-expanded',o)}
function toast(t,m){document.getElementById('tb').textContent=t;document.getElementById('tm').textContent=m;ts.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>ts.classList.remove('on'),2600)}
async function run(i){if(busy)return;busy=true;cur=i;setOpen(false);const f=FM[i];sp.classList.add('run');mi.innerHTML=f[5];ml.textContent='Exporting '+f[0]+'...';
 for(let p=0;p<=100;p+=5){pg.style.setProperty('--p',p/100);ml.textContent='Exporting '+f[0]+' '+p+'%';await new Promise(r=>setTimeout(r,45))}
 sp.classList.remove('run');sp.classList.add('ok');mi.innerHTML='<path d="m5 12.500 4.500 4.500L19 7"/>';ml.textContent='Exported';toast(f[4],f[3]+', saved to Downloads');await new Promise(r=>setTimeout(r,1500));
 sp.classList.remove('ok');pg.style.setProperty('--p',0);mi.innerHTML=DL;ml.textContent='Export '+f[0];busy=false}
document.getElementById('mb').onclick=()=>{off=true;run(cur)};cb.onclick=()=>{off=true;setOpen(!open)};addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});document.addEventListener('pointerdown',e=>{if(open&&!sp.contains(e.target))setOpen(false)});
setOpen(true);paint();
/* Idle demo: the format menu opens, the highlight moves, a format is chosen and the button turns orange with a live percentage and a progress line, then flips green with a check while a toast slides in, and it repeats with the next format, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3200);let k=1;while(!off){setOpen(true);hl=(k+4)%5;paint();await sleep(700);hl=k%5;paint();await sleep(800);if(off)return;await run(k%5);k++;await sleep(1700)}})()}
</script></body></html>
