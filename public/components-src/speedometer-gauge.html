<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Speedometer Gauge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(800px 560px at 50% 40%,#18202E,#080B12 75%);color:#E8EEF8;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{display:grid;gap:18px;justify-items:center}
.g{position:relative;width:min(460px,92vw);aspect-ratio:1}
.g svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bz{fill:#0B1018;stroke:#2A3446;stroke-width:3}.tr{fill:none;stroke:#1B2434;stroke-width:16;stroke-linecap:round}.zn{fill:none;stroke-width:16;stroke-linecap:butt}.tk{stroke:#4A566E;stroke-width:2.500}.tk.m{stroke:#8FA0BD;stroke-width:4}
.lb{fill:#8FA0BD;font:600 13px 'JetBrains Mono';text-anchor:middle;dominant-baseline:middle}
.ar{fill:none;stroke:var(--c);stroke-width:16;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--v));filter:drop-shadow(0 0 10px var(--c))}
.nd{transform-origin:200px 200px;transform:rotate(calc(-135deg + var(--v)*270deg));transition:none}.nd path{fill:#FF4D3D;filter:drop-shadow(0 3px 5px rgba(0,0,0,.7))}.nd circle{fill:#1B2434;stroke:#FF4D3D;stroke-width:4}
.ct{position:absolute;left:0;right:0;top:58%;text-align:center}.ct b{display:block;font:700 clamp(46px,12vw,76px)/1 'Unbounded';letter-spacing:-.06em;font-variant-numeric:tabular-nums}.ct span{font:600 13px 'JetBrains Mono';letter-spacing:.2em;color:#8FA0BD}
.gr{position:absolute;left:50%;top:40%;width:56px;height:56px;margin:-28px;border-radius:14px;background:#111827;box-shadow:inset 0 0 0 2px #2A3446;display:grid;place-items:center;font:700 28px 'Unbounded';color:var(--c);transition:color .3s}
.rp{width:min(460px,92vw);display:grid;gap:8px}.rp div{display:flex;gap:4px;height:14px}.rp i{flex:1;border-radius:3px;background:#161E2C;transition:background .08s,box-shadow .08s}.rp i.on{background:var(--c);box-shadow:0 0 10px var(--c)}.rp small{display:flex;justify-content:space-between;font:600 11px 'JetBrains Mono';letter-spacing:.14em;color:#6C7A94}
.md{display:flex;gap:10px}.md span{padding:7px 14px;border-radius:99px;font:700 12px 'JetBrains Mono';letter-spacing:.1em;background:#111827;color:#6C7A94;box-shadow:inset 0 0 0 1px #2A3446;transition:all .25s}.md span.on{color:#0B1018;background:var(--c);box-shadow:0 0 18px var(--c)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w" id="w" style="--c:#22D3EE"><div class="g" id="g"><svg viewBox="0 0 400 400"><circle class="bz" cx="200" cy="200" r="190"/><path class="tr" d="M72.700 327.300A180 180 0 1 1 327.300 327.300" transform="translate(0 0)" pathLength="1"/><g id="zn"></g><g id="tk"></g><path class="ar" id="ar" d="M72.700 327.300A180 180 0 1 1 327.300 327.300" pathLength="1" style="--v:0"/><g class="nd" id="nd" style="--v:0"><path d="M200 214 192 210 200 52 208 210Z"/><circle cx="200" cy="200" r="13"/></g></svg>
<div class="gr" id="gr">N</div><div class="ct"><b id="sp">0</b><span>KM/H</span></div></div>
<div class="rp"><div id="rp"></div><small><span>IDLE</span><span>RPM x1000</span><span>REDLINE</span></small></div><div class="md" id="md"><span>ECO</span><span>COMFORT</span><span>SPORT</span></div></div>
<script>
const NS='http://www.w3.org/2000/svg',R=150,cx=200,cy=200;
function pt(a,r){const t=(a-90)*Math.PI/180;return[cx+r*Math.cos(t),cy+r*Math.sin(t)]}
const g=document.getElementById('tk'),zn=document.getElementById('zn');
for(let i=0;i<=24;i++){const a=-135+i*(270/24),m=i%2===0;const p1=pt(a,m?142:150),p2=pt(a,164),l=document.createElementNS(NS,'line');l.setAttribute('class','tk'+(m?' m':''));l.setAttribute('x1',p1[0]);l.setAttribute('y1',p1[1]);l.setAttribute('x2',p2[0]);l.setAttribute('y2',p2[1]);g.appendChild(l);
 if(m){const q=pt(a,122),t=document.createElementNS(NS,'text');t.setAttribute('class','lb');t.setAttribute('x',q[0]);t.setAttribute('y',q[1]);t.textContent=i*10;g.appendChild(t)}}
const Z=[[0,.5,'#22D3EE'],[.5,.8,'#FBBF24'],[.8,1,'#F43F5E']];
Z.forEach(([a,b,c])=>{const A=-135+a*270,B=-135+b*270,p1=pt(A,180),p2=pt(B,180),p=document.createElementNS(NS,'path');p.setAttribute('class','zn');p.setAttribute('d','M'+p1[0]+' '+p1[1]+'A180 180 0 '+((B-A)>180?1:0)+' 1 '+p2[0]+' '+p2[1]);p.setAttribute('stroke',c);p.setAttribute('opacity','.28');zn.appendChild(p)});
const rp=document.getElementById('rp');for(let i=0;i<24;i++){rp.appendChild(document.createElement('i'))}const rs=[...rp.children];
const w=document.getElementById('w'),ar=document.getElementById('ar'),nd=document.getElementById('nd'),sp=document.getElementById('sp'),gr=document.getElementById('gr'),md=[...document.querySelectorAll('#md span')];
let v=0,tv=0,vel=0,spd=0;function col(f){return f<.5?'#22D3EE':f<.8?'#FBBF24':'#F43F5E'}
function show(){const f=Math.max(0,Math.min(1,v));w.style.setProperty('--c',col(f));ar.style.setProperty('--v',f);nd.style.setProperty('--v',f);spd=Math.round(f*240);sp.textContent=spd;
 const gear=spd<5?'N':spd<40?1:spd<80?2:spd<120?3:spd<165?4:spd<205?5:6;gr.textContent=gear;const rpm=spd<5?.12:((spd%(gear===1?40:gear==='N'?1:42))/(gear===1?40:42))*.6+.28+f*.1;const on=Math.round(Math.min(1,rpm)*24);rs.forEach((r,i)=>r.classList.toggle('on',i<on));rs.forEach((r,i)=>{r.style.setProperty('--c',i>19?'#F43F5E':i>14?'#FBBF24':'#22D3EE')});md.forEach((m,i)=>m.classList.toggle('on',f<.45?i===0:f<.75?i===1:i===2))}
function step(dt){const k=140,d=11;vel+=(k*(tv-v)-d*vel)*dt;v+=vel*dt;show()}
/* Idle demo: the car pulls away, runs up through the gears to a high speed and eases off, over and over; the needle is driven by a spring so it overshoots and settles, the coloured arc and drive mode follow, the gear changes and the RPM bar rises and falls with each shift. */
let last=0;function loop(n){const dt=Math.min(.04,(n-last)/1000||0);last=n;step(dt);requestAnimationFrame(loop)}
v=.46;tv=.46;show();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){requestAnimationFrame(n=>{last=n;loop(n)});const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2400);while(true){for(const t of [.62,.84,.4,.18,.7,.96,.5,.08]){tv=t;await sleep(2000)}}})()}
else{show()}
</script></body></html>
