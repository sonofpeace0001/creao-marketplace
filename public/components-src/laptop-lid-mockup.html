<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Laptop Lid Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 500px at 50% 30%,#2A2F4A,transparent 70%),#0E1018;color:#EEF0FA;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{width:100%;max-width:860px;text-align:center}
h1{font-size:clamp(28px,5vw,46px);font-weight:700;letter-spacing:-.055em}p.sb{color:#8890B0;font-size:16px;margin:8px 0 40px}
.st{perspective:1700px;display:grid;place-items:center;height:430px}
.lp{position:relative;width:min(640px,92vw);transform-style:preserve-3d;transform:rotateX(14deg) rotateY(var(--ry,-12deg));transition:transform .6s cubic-bezier(.3,1.2,.5,1)}
.lid{position:relative;width:100%;aspect-ratio:1.6;transform-origin:50% 100%;transform:rotateX(var(--o,8deg));transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.lid .fr{position:absolute;inset:0;border-radius:18px 18px 4px 4px;background:#0A0A0F;padding:14px 14px 18px;box-shadow:0 0 0 2px #3A3D52,inset 0 0 0 1px #1C1E2C;backface-visibility:hidden}
.lid .bk{position:absolute;inset:0;border-radius:18px 18px 4px 4px;background:linear-gradient(160deg,#C9CCDB,#8F93A8);transform:rotateY(180deg);backface-visibility:hidden;display:grid;place-items:center}.lid .bk i{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.35)}
.lid .nt{position:absolute;left:50%;top:0;width:70px;height:10px;margin-left:-35px;background:#0A0A0F;border-radius:0 0 8px 8px;z-index:3}
.scr{width:100%;height:100%;border-radius:8px;overflow:hidden;background:#F4F5FB;color:#14172E;position:relative;display:grid;grid-template-columns:78px 1fr}
.scr .sd{background:#14172E;padding:14px 10px;display:flex;flex-direction:column;gap:8px;align-items:center}.scr .sd i{width:28px;height:28px;border-radius:9px;background:#2A2F52}.scr .sd i:first-child{background:linear-gradient(135deg,#6366F1,#EC4899);margin-bottom:8px}.scr .sd i.on{background:#4F46E5}
.scr .mn{padding:16px 18px;overflow:hidden}.scr .mn b{display:block;font-size:15px;font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.scr .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.scr .kp div{background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 4px 10px -6px rgba(20,23,46,.3)}.scr .kp small{font-size:9px;color:#7A7FA0;font-weight:600}.scr .kp strong{display:block;font-size:15px;letter-spacing:-.04em;margin-top:1px}
.scr .ch{background:#fff;border-radius:10px;padding:10px;height:96px;display:flex;align-items:flex-end;gap:5px;box-shadow:0 4px 10px -6px rgba(20,23,46,.3)}.scr .ch i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#818CF8,#4F46E5);height:var(--h)}
.scr .tb{margin-top:8px;display:grid;gap:5px}.scr .tb i{height:9px;border-radius:4px;background:#E3E5F2}.scr .tb i:nth-child(2){width:80%}.scr .tb i:nth-child(3){width:64%}
.lid .gl{position:absolute;inset:14px 14px 18px;border-radius:8px;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);pointer-events:none;animation:gl 5s ease-in-out infinite}@keyframes gl{0%,100%{transform:translateX(-60%)}50%{transform:translateX(60%)}}
.base{position:relative;width:calc(100% + 40px);margin-left:-20px;height:16px;border-radius:0 0 22px 22px;background:linear-gradient(180deg,#B7BACB,#8A8EA4);box-shadow:0 30px 40px -10px rgba(0,0,0,.7)}.base::before{content:"";position:absolute;left:50%;top:0;width:110px;height:6px;margin-left:-55px;border-radius:0 0 10px 10px;background:#6C7088}
.ctl{margin-top:36px;display:flex;gap:10px;justify-content:center}.ctl button{border:1px solid #2E3350;background:#161A2A;color:#DDE1F5;border-radius:99px;padding:10px 20px;font:600 14px 'Inter Tight';cursor:pointer}.ctl button:hover{border-color:#818CF8}.ctl button:focus-visible{outline:2px solid #818CF8;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="c"><h1>Open it up</h1><p class="sb">The lid swings open on a real 3D hinge. Hover to turn the laptop.</p>
<div class="st" id="st"><div class="lp" id="lp"><div class="lid" id="lid"><div class="fr"><span class="nt"></span><div class="scr"><div class="sd"><i></i><i class="on"></i><i></i><i></i><i></i></div><div class="mn"><b>Revenue overview</b><div class="kp"><div><small>REVENUE</small><strong>$48.2k</strong></div><div><small>ORDERS</small><strong>2,931</strong></div><div><small>GROWTH</small><strong>+12%</strong></div></div><div class="ch"><i style="--h:40%"></i><i style="--h:60%"></i><i style="--h:48%"></i><i style="--h:72%"></i><i style="--h:58%"></i><i style="--h:88%"></i><i style="--h:66%"></i><i style="--h:96%"></i><i style="--h:80%"></i></div><div class="tb"><i></i><i></i><i></i></div></div></div><div class="gl"></div></div><div class="bk"><i></i></div></div><div class="base"></div></div></div>
<div class="ctl"><button id="op">Close lid</button></div></div>
<script>
const lid=document.getElementById('lid'),lp=document.getElementById('lp'),st=document.getElementById('st'),op=document.getElementById('op');let open=true;
function set(o){open=o;lid.style.setProperty('--o',o?'8deg':'-92deg');op.textContent=o?'Close lid':'Open lid'}
lid.style.transition='none';lid.style.setProperty('--o','8deg');requestAnimationFrame(()=>requestAnimationFrame(()=>lid.style.transition=''));
op.onclick=()=>set(!open);
st.addEventListener('pointermove',e=>{const r=st.getBoundingClientRect();lp.style.setProperty('--ry',(((e.clientX-r.left)/r.width-.5)*30)+'deg')});st.addEventListener('pointerleave',()=>lp.style.setProperty('--ry','-12deg'));
</script></body></html>
