<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Day Night Toggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{--bg:#DCEBFA;--card:#fff;--tx:#14233B;--sb:#5E7391;background:var(--bg);color:var(--tx);font-family:'Poppins',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;transition:background .6s,color .6s;-webkit-font-smoothing:antialiased}
body.n{--bg:#0A1024;--card:#141C38;--tx:#EEF1FF;--sb:#8C97C0}
.c{width:100%;max-width:460px;background:var(--card);border-radius:30px;padding:36px 30px;text-align:center;box-shadow:0 40px 70px -44px rgba(10,20,50,.6);transition:background .6s}
.c h1{font-size:24px;font-weight:700;letter-spacing:-.03em}.c p{color:var(--sb);font-size:14.5px;margin:6px 0 28px;transition:color .6s}
.sw{position:relative;display:block;width:200px;height:90px;margin:0 auto;border:0;padding:0;border-radius:99px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,#5FB4F5,#A8DBFF);box-shadow:inset 0 6px 14px rgba(0,0,0,.28),0 12px 24px -10px rgba(40,100,180,.5);transition:background .6s}
.sw::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0B1236,#2B2F6E);opacity:0;transition:opacity .6s}
.n .sw::before{opacity:1}.sw:focus-visible{outline:3px solid #6D4DF2;outline-offset:4px}
.kn{position:absolute;z-index:3;top:9px;left:9px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3A8,#FFC93C 60%,#F5A31A);box-shadow:0 0 0 10px rgba(255,255,255,.16),0 0 0 22px rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.3);transition:transform .6s cubic-bezier(.5,1.4,.4,1),background .6s,box-shadow .6s}
.n .kn{transform:translateX(110px);background:radial-gradient(circle at 35% 30%,#F4F6FF,#CDD3EA 65%,#B3BAD6);box-shadow:0 0 0 10px rgba(255,255,255,.06),0 0 0 22px rgba(255,255,255,.04),0 6px 14px rgba(0,0,0,.4)}
.kn i{position:absolute;border-radius:50%;background:rgba(120,130,170,.35);opacity:0;transition:opacity .4s}.n .kn i{opacity:1}.kn i:nth-child(1){width:18px;height:18px;left:16px;top:14px}.kn i:nth-child(2){width:11px;height:11px;left:44px;top:34px}.kn i:nth-child(3){width:8px;height:8px;left:22px;top:46px}
.st{position:absolute;z-index:2;inset:0;opacity:0;transform:translateY(-30px);transition:all .6s}.n .st{opacity:1;transform:none}.st b{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s infinite}@keyframes tw{50%{opacity:.25}}
.cl{position:absolute;z-index:2;inset:0;transition:transform .6s cubic-bezier(.5,1.2,.4,1);}.n .cl{transform:translateY(60px)}.cl span{position:absolute;background:#fff;border-radius:99px}.cl .a{left:90px;top:48px;width:70px;height:22px;opacity:.95}.cl .a::before{content:"";position:absolute;left:12px;top:-12px;width:28px;height:28px;border-radius:50%;background:#fff}.cl .b{left:130px;top:60px;width:56px;height:18px;opacity:.75}.cl .c2{left:60px;top:64px;width:50px;height:16px;opacity:.6}
.lb{margin-top:24px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sb)}.lb b{color:var(--tx)}
.pv{display:flex;gap:10px;margin-top:26px}.pv div{flex:1;height:64px;border-radius:16px;background:color-mix(in srgb,var(--tx) 7%,transparent);transition:background .6s;padding:12px;text-align:left}.pv div i{display:block;height:7px;border-radius:5px;background:color-mix(in srgb,var(--tx) 22%,transparent);margin-bottom:7px}.pv div i:last-child{width:55%}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="c"><h1>Appearance</h1><p>Flip the switch and watch the sky change.</p>
<button class="sw" id="sw" role="switch" aria-checked="false" aria-label="Dark mode"><div class="st" aria-hidden="true"><b style="left:24px;top:18px"></b><b style="left:48px;top:50px;animation-delay:.6s"></b><b style="left:70px;top:24px;animation-delay:1.1s"></b><b style="left:96px;top:60px;animation-delay:.3s;width:2px;height:2px"></b><b style="left:122px;top:20px;animation-delay:1.6s"></b><b style="left:150px;top:44px;animation-delay:.9s;width:2px;height:2px"></b><b style="left:172px;top:18px;animation-delay:1.3s"></b></div><div class="cl" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c2"></span></div><div class="kn"><i></i><i></i><i></i></div></button>
<div class="lb" id="lb">Theme <b>Light</b></div><div class="pv"><div><i></i><i></i></div><div><i></i><i></i></div><div><i></i><i></i></div></div></div>
<script>
const sw=document.getElementById('sw');function set(n){document.body.classList.toggle('n',n);sw.setAttribute('aria-checked',n);document.getElementById('lb').innerHTML='Theme <b>'+(n?'Dark':'Light')+'</b>'}
sw.onclick=()=>set(!document.body.classList.contains('n'));set(false);
</script></body></html>
