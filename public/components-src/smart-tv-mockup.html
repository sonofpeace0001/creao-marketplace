<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Smart TV Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0B10;color:#fff;font-family:'Archivo',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.wr{width:100%;max-width:780px;display:flex;flex-direction:column;align-items:center}
.tv{position:relative;width:100%;aspect-ratio:16/9;background:#050507;border-radius:14px;padding:8px;box-shadow:0 44px 70px -30px #000,inset 0 0 0 2px #26262E,inset 0 0 0 4px #0B0B0F}
.sc{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#0B0D16}
.bg{position:absolute;inset:0;transition:opacity .8s}.bg svg{width:100%;height:100%;display:block}.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0B0D16 8%,rgba(11,13,22,.55) 45%,transparent),linear-gradient(0deg,#0B0D16 6%,transparent 55%)}
.nv{position:absolute;left:3.500%;top:5%;display:flex;gap:18px;z-index:3;font-size:13px;font-weight:600;color:#9BA3C4}.nv b{color:#fff;padding-bottom:3px;border-bottom:2.500px solid #fff}.nv span{padding-bottom:3px}
.hr{position:absolute;left:3.500%;top:13%;width:46%;z-index:3}.hr small{font:500 11px 'DM Mono';letter-spacing:.2em;color:#FFB454;text-transform:uppercase}.hr h1{font:800 36px/.95 'Archivo';letter-spacing:-.04em;margin:6px 0 8px;transition:opacity .3s,transform .4s}.hr p{font-size:12px;line-height:1.45;color:#C8CEE6;max-width:320px;transition:opacity .3s}.hr .mt{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;font-weight:700;color:#C8CEE6}.hr .mt i{font-style:normal;padding:2px 7px;border-radius:5px;border:1.500px solid #C8CEE6}
.hr.sw h1,.hr.sw p,.hr.sw .mt{opacity:0;transform:translateY(8px)}
.bt{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:7px 16px;border-radius:99px;background:#fff;color:#0B0D16;font-weight:800;font-size:13px}
.rw{position:absolute;left:0;right:0;bottom:4%;padding:0 3.500%;z-index:3}.rw h3{font-size:12px;font-weight:700;color:#C8CEE6;margin-bottom:8px}.tk{display:flex;gap:12px}
.pc{position:relative;flex:none;width:calc((100% - 60px)/6);aspect-ratio:3/4;border-radius:10px;overflow:hidden;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .3s;opacity:.78}.pc svg{width:100%;height:100%;display:block}.pc span{position:absolute;left:8px;right:8px;bottom:7px;font-size:10px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.pc.fo{transform:scale(1.14) translateY(-6px);box-shadow:0 0 0 3px #fff,0 18px 30px -8px rgba(0,0,0,.8);opacity:1;z-index:2}
.rm{position:absolute;right:2.500%;top:5%;z-index:4;display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,26px);gap:3px;padding:8px;border-radius:99px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px)}.rm i{display:grid;place-items:center;border-radius:50%;font-style:normal;font-size:11px;color:#9BA3C4;transition:all .2s}.rm i.pr{background:#fff;color:#0B0D16;transform:scale(.88)}.rm .c{background:rgba(255,255,255,.14)}
.nk{width:74px;height:46px;background:linear-gradient(90deg,#16161B,#34343C 50%,#16161B);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.fs{width:300px;height:10px;border-radius:99px;background:linear-gradient(180deg,#3A3A42,#15151A);box-shadow:0 20px 20px -10px #000}
@media(max-width:560px){.hr h1{font-size:26px}.hr p{display:none}.rm{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wr"><div class="tv"><div class="sc" id="sc"><div class="bg" id="bg"></div><div class="nv"><b>Home</b><span>Movies</span><span>Series</span><span>Kids</span><span>Live</span></div><div class="hr" id="hr"><small id="hk">Featured · Drama</small><h1 id="ht"></h1><p id="hp"></p><div class="mt" id="hm"></div><span class="bt">▶ Play now</span></div><div class="rw"><h3>Trending this week</h3><div class="tk" id="tk"></div></div><div class="rm" id="rm"><i></i><i data-d="u">▲</i><i></i><i data-d="l">◀</i><i class="c" data-d="o">●</i><i data-d="r">▶</i><i></i><i data-d="d">▼</i><i></i></div></div></div><div class="nk"></div><div class="fs"></div></div>
<script>
function scene(s,w,h,big){const r=(n=1)=>{s=(s*9301+49297)%233280;return s/233280*n};const P=[['#1B2A6B','#E85D75','#FFB86B'],['#0B3B3C','#2FA58B','#F4E285'],['#3A1C5B','#C4478D','#FF9E7A'],['#10243A','#3D7BA8','#F2D8A7'],['#3B1A1A','#D1583B','#F8C37A']][Math.floor(r(5))];const id='g'+w+Math.floor(s);let o='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P[0]+'"/><stop offset=".55" stop-color="'+P[1]+'"/><stop offset="1" stop-color="'+P[2]+'"/></linearGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#'+id+')"/><circle cx="'+(w*.25+r(w*.55))+'" cy="'+(h*.2+r(h*.2))+'" r="'+(h*.1+r(h*.07))+'" fill="#FFF3D1" opacity=".95"/>';for(let l=0;l<4;l++){let d='M0 '+h+'L0 '+(h*.6+l*h*.1);const a=h*.08+r(h*.12),f=.01+r(.02)*(300/w),ph=r(6);for(let x=0;x<=w;x+=w/50)d+=' L'+x+' '+(h*.6+l*h*.1-a*Math.abs(Math.sin(x*f+ph))-a*.35*Math.sin(x*f*2.3+ph*2)).toFixed(1);d+=' L'+w+' '+h+'Z';o+='<path d="'+d+'" fill="#0C0A14" opacity="'+(.2+l*.22)+'"/>'}return o+'</svg>'}
const T=[['Saltwater','Drama','A fisherman returns to the island he swore he would never see again.','2026','1h 54m','16+',3],['Night Market','Thriller','One evening, three strangers and a stolen ledger.','2026','2h 02m','13+',14],['The Long Thaw','Series','A research station, an early spring and a signal nobody sent.','S2','8 eps','16+',27],['Paper Lanterns','Family','Two cousins race a festival across a city that never sleeps.','2025','1h 38m','PG',41],['Last Ferry','Mystery','The final crossing of the season carries more than passengers.','2026','1h 47m','13+',55],['Ember Coast','Adventure','A surveyor, a map and a coastline that keeps rearranging itself.','2026','2h 11m','12+',68]];
const tk=document.getElementById('tk'),$=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let cur=1,off=false;const pcs=T.map((t,i)=>{const d=document.createElement('div');d.className='pc';d.innerHTML=scene(t[6]+3,120,180)+'<span>'+t[0]+'</span>';d.onclick=()=>{off=true;foc(i)};tk.appendChild(d);return d});
const bgs=T.map(t=>{const d=document.createElement('div');d.className='bg';d.style.opacity=0;d.innerHTML=scene(t[6],780,440);$('sc').insertBefore(d,$('sc').firstChild);return d});$('bg').remove();
function foc(i,inst){cur=i;pcs.forEach((p,k)=>p.classList.toggle('fo',k===i));bgs.forEach((b,k)=>b.style.opacity=k===i?1:0);const t=T[i],h=$('hr');if(inst){fill(t)}else{h.classList.add('sw');setTimeout(()=>{fill(t);h.classList.remove('sw')},260)}}
function fill(t){$('hk').textContent='Featured · '+t[1];$('ht').textContent=t[0];$('hp').textContent=t[2];$('hm').innerHTML='<span>'+t[3]+'</span><span>'+t[4]+'</span><i>'+t[5]+'</i>'}
async function key(d){const k=document.querySelector('#rm [data-d="'+d+'"]');if(k){k.classList.add('pr');await sl(180);k.classList.remove('pr')}}
foc(1,true);document.querySelector('.wr').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a smart-TV home screen driven by a tiny on-screen remote; a pressed arrow lights on the remote, the white focus ring and enlarged poster step along the trending row, the full-screen backdrop cross-fades to that title's scene and the hero headline, genre, description, year, runtime and rating swap with a short rise, then the centre button presses on the last pick and the loop continues, until you click a poster. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);const seq=[['r',2],['r',3],['r',4],['l',3],['l',2],['l',1],['l',0],['r',1]];let k=0;while(!off){const[d,i]=seq[k++%seq.length];await key(d);foc(i);await sl(2100)}})()}
</script></body></html>
