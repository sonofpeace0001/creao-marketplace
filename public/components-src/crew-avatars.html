<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Presence Avatars</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0C10;color:#EAEEF6;font-family:'Rethink Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 18px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;background:#10141C;border:1px solid #1F2633;border-radius:26px;padding:28px;box-shadow:0 40px 80px -34px #000}
.s{margin-bottom:26px}.s:last-child{margin-bottom:0}
.s h2{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#6C7791;font-weight:700;margin-bottom:14px}
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0A0C10;background:linear-gradient(135deg,var(--a),var(--b));width:var(--s,44px);height:var(--s,44px);font-size:calc(var(--s,44px)*.34);box-shadow:0 0 0 3px #10141C}
.st{display:flex;align-items:center}
.st .av{margin-left:-8px;transition:transform .25s cubic-bezier(.3,1.5,.4,1),margin .25s}.st .av:first-child{margin-left:0}
.st:hover .av{margin-left:-2px}.st .av:hover{transform:translateY(-6px) scale(1.1);z-index:2}
.more{margin-left:-8px;width:44px;height:44px;border-radius:50%;background:#1B2231;border:0;color:#B8C2DA;font:700 13px 'Rethink Sans';cursor:pointer;box-shadow:0 0 0 3px #10141C;transition:all .2s}.more:hover{background:#252E42;color:#fff}.more:focus-visible{outline:2px solid #5EEAD4;outline-offset:3px}
.hid{display:none}.hid.show{display:grid}
.sz{display:flex;align-items:flex-end;gap:16px}
.pr{display:flex;flex-wrap:wrap;gap:14px 22px}
.u{display:flex;align-items:center;gap:12px}
.u .av{box-shadow:none}.u .d{position:absolute;right:0;bottom:0;width:30%;height:30%;border-radius:50%;border:3px solid #10141C;background:var(--c)}
.u .d.on{animation:p 2s infinite}@keyframes p{50%{box-shadow:0 0 0 5px rgba(52,211,153,.18)}}
.u b{display:block;font-size:14.5px;font-weight:700}.u span{font-size:12.5px;color:#7C87A0}
.u .on+*{}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="c">
 <div class="s"><h2>Collaborators · 8 editing</h2><div class="st" id="st"></div></div>
 <div class="s"><h2>Size scale</h2><div class="sz" id="sz"></div></div>
 <div class="s"><h2>Presence</h2><div class="pr" id="pr"></div></div>
</div>
<script>
const P=[['AK','#5EEAD4','#38BDF8'],['MR','#F9A8D4','#C084FC'],['JT','#FDE68A','#FB923C'],['SL','#A5B4FC','#6366F1'],['DP','#86EFAC','#22C55E'],['EO','#FCA5A5','#F43F5E'],['NB','#7DD3FC','#3B82F6'],['YC','#FDBA74','#EF4444']];
const av=(p,s)=>'<span class="av" style="--a:'+p[1]+';--b:'+p[2]+(s?';--s:'+s+'px':'')+'" title="'+p[0]+'">'+p[0]+'</span>';
const st=document.getElementById('st');st.innerHTML=P.slice(0,5).map(p=>av(p)).join('')+'<button class="more" id="m" aria-expanded="false" aria-label="Show 3 more collaborators">+3</button>'+P.slice(5).map(p=>av(p).replace('class="av"','class="av hid"')).join('');
document.getElementById('m').onclick=e=>{const o=e.currentTarget.getAttribute('aria-expanded')!=='true';e.currentTarget.setAttribute('aria-expanded',o);e.currentTarget.textContent=o?'−':'+3';st.querySelectorAll('.hid').forEach(h=>h.classList.toggle('show',o))};
document.getElementById('sz').innerHTML=[28,36,44,56,72].map(s=>av(P[s%8],s)).join('');
const U=[['Aisha Khan','Editing now',P[0],'#34D399',1],['Marcus Reid','Away · 12m',P[1],'#FBBF24',0],['Jonas Tran','Do not disturb',P[2],'#F43F5E',0],['Sofia Lund','Offline',P[3],'#64748B',0]];
document.getElementById('pr').innerHTML=U.map(u=>'<div class="u"><span class="av" style="--a:'+u[2][1]+';--b:'+u[2][2]+';--s:46px">'+u[2][0]+'<i class="d '+(u[4]?'on':'')+'" style="--c:'+u[3]+'"></i></span><div><b>'+u[0]+'</b><span>'+u[1]+'</span></div></div>').join('');
</script></body></html>
