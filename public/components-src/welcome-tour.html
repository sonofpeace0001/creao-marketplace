<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7EAF6;color:#161B38;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ap{position:relative;width:100%;max-width:700px;height:430px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 36px 60px -36px rgba(22,27,56,.5),0 0 0 1px rgba(22,27,56,.07);display:grid;grid-template-columns:150px 1fr}
.sb{background:#F4F5FC;padding:18px 14px;border-right:1px solid #E7E9F6;display:grid;gap:7px;align-content:start}
.sb i{display:block;height:34px;border-radius:11px;background:#E4E7F6;transition:all .3s}.sb i:first-child{height:24px;width:60%;background:#C7CCF4;margin-bottom:8px}
.mn{padding:20px;display:grid;gap:12px;align-content:start}
.tp{display:flex;justify-content:space-between;align-items:center}.tp b{font-size:18px;font-weight:700}.tp i{width:34px;height:34px;border-radius:50%;background:#E4E7F6}
.cds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cds i{height:76px;border-radius:14px;background:#EFF1FB;transition:all .3s}
.big{height:130px;border-radius:16px;background:#F4F5FC;transition:all .3s;position:relative}
.nw{position:absolute;right:20px;top:64px;padding:11px 18px;border-radius:12px;background:#4F46E5;color:#fff;font:600 14px 'Outfit';transition:all .3s;border:0}
.hl{box-shadow:0 0 0 4px #fff,0 0 0 7px #4F46E5!important;background:#fff!important;z-index:3;position:relative}
.sd{position:absolute;inset:0;background:rgba(18,22,52,.55);backdrop-filter:blur(1.5px);z-index:2;transition:opacity .3s}
.tip{position:absolute;z-index:5;width:290px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 30px 50px -16px rgba(18,22,52,.6),0 0 0 1px rgba(22,27,56,.08);transition:left .4s cubic-bezier(.3,1.2,.4,1),top .4s cubic-bezier(.3,1.2,.4,1)}
.tip::before{content:"";position:absolute;left:var(--ax,30px);top:-7px;width:14px;height:14px;background:#fff;transform:rotate(45deg);border-radius:3px}
.tip small{font-size:12px;font-weight:700;letter-spacing:.1em;color:#4F46E5;text-transform:uppercase}.tip h2{font-size:19px;font-weight:700;letter-spacing:-.025em;margin:6px 0 6px}.tip p{font-size:14.5px;color:#5E668F;line-height:1.5}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#D7DBF2;transition:all .3s}.dots i.on{width:20px;border-radius:7px;background:#4F46E5}
.bt{display:flex;gap:8px;align-items:center}.sk{border:0;background:none;color:#8089B8;font:600 14px 'Outfit';cursor:pointer;padding:8px}.sk:hover{color:#161B38}
.nx{border:0;border-radius:12px;padding:10px 18px;font:600 14.5px 'Outfit';background:#161B38;color:#fff;cursor:pointer}.nx:focus-visible,.sk:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.rs{position:absolute;inset:0;z-index:6;display:none;place-items:center;background:rgba(231,234,246,.9);backdrop-filter:blur(4px)}.rs.on{display:grid}.rs button{border:0;border-radius:14px;padding:14px 24px;font:600 15px 'Outfit';background:#4F46E5;color:#fff;cursor:pointer}
@media(max-width:620px){.ap{grid-template-columns:1fr}.sb{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="ap" id="ap"><div class="sb"><i></i><i id="n0"></i><i id="n1"></i><i></i><i></i></div><div class="mn"><div class="tp"><b>Dashboard</b><i></i></div><div class="cds"><i id="c0"></i><i></i><i></i></div><div class="big" id="bg"><button class="nw" id="nw">+ New project</button></div></div>
 <div class="sd" id="sd"></div>
 <div class="tip" id="tp" role="dialog" aria-live="polite"><small id="k"></small><h2 id="h"></h2><p id="p"></p><div class="ft"><div class="dots" id="d"></div><div class="bt"><button class="sk" id="sk">Skip tour</button><button class="nx" id="nx"></button></div></div></div>
 <div class="rs" id="rs"><button id="rr">Restart the tour</button></div></div>
<script>
const S=[['n0','Navigation','Jump between your work','Everything lives in the sidebar — projects, inbox and reports are always one click away.',160,56,28],['c0','Live metrics','See what changed today','These cards update in real time so you always know where things stand.',230,150,28],['nw','Quick create','Start something new','Press this button — or hit N anywhere — to create a project in seconds.',330,190,200]];
let i=0;const $=id=>document.getElementById(id);
function show(){document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));const s=S[i],t=$(s[0]);t.classList.add('hl');const ap=$('ap').getBoundingClientRect(),r=t.getBoundingClientRect();
 $('k').textContent='Step '+(i+1)+' of '+S.length;$('h').textContent=s[2];$('p').textContent=s[3];$('d').innerHTML=S.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('');$('nx').textContent=i===S.length-1?'Finish':'Next';
 let x=r.left-ap.left,y=r.bottom-ap.top+14;x=Math.max(14,Math.min(x,ap.width-304));if(y>ap.height-200)y=r.top-ap.top-190;$('tp').style.left=x+'px';$('tp').style.top=y+'px';$('tp').style.setProperty('--ax',Math.max(18,Math.min(r.left-ap.left-x+r.width/2-7,260))+'px')}
$('nx').onclick=()=>{if(i<S.length-1){i++;show()}else end()};$('sk').onclick=end;$('rr').onclick=()=>{i=0;$('rs').classList.remove('on');$('sd').style.display='';$('tp').style.display='';show()};
function end(){document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));$('sd').style.display='none';$('tp').style.display='none';$('rs').classList.add('on')}
document.fonts.ready.then(show);show();addEventListener('resize',show);
</script></body></html>
