<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Countdown Offer CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FBE9D7;color:#2A1608;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.c{position:relative;width:100%;max-width:760px;border-radius:32px;padding:3px;background:conic-gradient(from var(--a),#F97316,#FACC15,#F97316 45%,#FBE9D7 55%,#F97316);animation:sp 5s linear infinite}@keyframes sp{to{--a:360deg}}
.in{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;background:#FFF9F1;border-radius:29px;padding:38px;overflow:hidden}
.in::before{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#FFE0B8,transparent 70%)}
.tg{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#C2410C;background:#FFE7D1;border-radius:99px;padding:6px 14px;margin-bottom:16px}.tg svg{animation:sp2 2s ease-in-out infinite}@keyframes sp2{50%{transform:scale(1.25) rotate(18deg)}}
h1{position:relative;font:800 clamp(30px,5vw,46px)/1.02 'Bricolage Grotesque';letter-spacing:-.045em}h1 span{color:#EA580C}
.l p{position:relative;font-size:16px;line-height:1.55;color:#7A5A40;margin:12px 0 22px;max-width:36ch}
.go{position:relative;display:inline-flex;align-items:center;gap:10px;background:#2A1608;color:#fff;border-radius:16px;padding:15px 24px;font:700 15.5px 'DM Sans';text-decoration:none;overflow:hidden;box-shadow:0 18px 30px -14px #2A1608;transition:transform .15s}.go:hover{transform:translateY(-2px)}.go svg{transition:transform .3s}.go:hover svg{transform:translateX(5px)}.go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-100%);animation:sh 3.4s infinite}@keyframes sh{40%,100%{transform:translateX(100%)}}.go:focus-visible{outline:3px solid #EA580C;outline-offset:3px}
.r{position:relative;background:#fff;border:1.5px solid #F3D9BE;border-radius:24px;padding:22px;box-shadow:0 24px 40px -26px rgba(194,65,12,.5)}
.r small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#A8826A;margin-bottom:12px}
.cd{display:flex;gap:8px;margin-bottom:18px}.cd div{flex:1;text-align:center;background:#2A1608;color:#fff;border-radius:14px;padding:10px 0}.cd b{display:block;font:500 28px 'DM Mono',monospace;letter-spacing:-.02em;line-height:1}.cd span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#E3BFA0;display:block;margin-top:5px}
.pb{display:flex;justify-content:space-between;font-size:13px;color:#7A5A40;margin-bottom:8px}.pb b{color:#2A1608}.br{height:10px;border-radius:10px;background:#F6E3CF;overflow:hidden}.br i{display:block;height:100%;width:73%;border-radius:10px;background:repeating-linear-gradient(135deg,#F97316 0 10px,#FB923C 10px 20px);animation:mv 1.2s linear infinite;background-size:28px 28px}@keyframes mv{to{background-position:28px 0}}
.pf{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:#7A5A40}.av{display:flex}.av i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-7px;background:var(--g)}.av i:first-child{margin-left:0}
@media(max-width:620px){.in{grid-template-columns:1fr;padding:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="c"><div class="in"><div class="l"><span class="tg"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.400 6.600L21 11l-6.600 2.400L12 20l-2.400-6.600L3 11l6.600-2.400z"/></svg>Launch week</span><h1>Save <span>40%</span> on every annual plan</h1><p>Lock in launch pricing for as long as you stay a customer. Offer ends when the clock does.</p><a class="go" href="#">Claim my discount<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
<div class="r"><small>Offer ends in</small><div class="cd"><div><b id="d">02</b><span>Days</span></div><div><b id="h">14</b><span>Hrs</span></div><div><b id="m">36</b><span>Min</span></div><div><b id="s">09</b><span>Sec</span></div></div><div class="pb"><span><b>731</b> of 1,000 claimed</span><span>73%</span></div><div class="br"><i></i></div><div class="pf"><div class="av"><i style="--g:linear-gradient(135deg,#6366F1,#EC4899)"></i><i style="--g:linear-gradient(135deg,#10B981,#0EA5E9)"></i><i style="--g:linear-gradient(135deg,#F59E0B,#EF4444)"></i></div>14 teams claimed this today</div></div></div></div>
<script>
let t=2*86400+14*3600+36*60+9;const p=n=>String(n).padStart(2,'0');function u(){document.getElementById('d').textContent=p(Math.floor(t/86400));document.getElementById('h').textContent=p(Math.floor(t%86400/3600));document.getElementById('m').textContent=p(Math.floor(t%3600/60));document.getElementById('s').textContent=p(t%60)}u();setInterval(()=>{t=Math.max(0,t-1);u()},1000);
</script></body></html>
