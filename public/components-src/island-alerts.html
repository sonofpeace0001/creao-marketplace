<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Island Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#DDE4FF,#F3E6FF);color:#10132B;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:520px;height:440px;background:#fff;border-radius:34px;box-shadow:0 40px 70px -40px rgba(60,40,140,.55),0 0 0 1px rgba(16,19,43,.06);overflow:hidden}
.is{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#06070F;color:#fff;border-radius:30px;overflow:hidden;transition:width .55s cubic-bezier(.3,1.25,.4,1),height .55s cubic-bezier(.3,1.25,.4,1);box-shadow:0 20px 34px -12px rgba(6,7,15,.6)}
.ic{display:flex;align-items:center;gap:12px;padding:0 18px;height:44px}.is:not(.open) .ic{height:36px;padding:0 12px}
.ic .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);flex:none;transition:background .3s}.ic .tx{font-size:14px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .25s}.is.open .tx{opacity:1;transition-delay:.18s}
.ex{padding:0 18px 16px;opacity:0;transition:opacity .25s}.is.open.big .ex{opacity:1;transition-delay:.2s}
.ex p{font-size:13.5px;color:#A5A9C4;line-height:1.5;margin-bottom:12px}.ex .bt{display:flex;gap:8px}.ex button{flex:1;border:0;border-radius:14px;padding:10px;font:600 13.5px 'Sora';cursor:pointer;transition:transform .12s}.ex button:active{transform:scale(.96)}.ex .p{background:#fff;color:#06070F}.ex .s{background:#1E2038;color:#fff}.ex button:focus-visible{outline:2px solid #8B8FFF;outline-offset:2px}
.pg{position:absolute;left:0;right:0;top:215px;padding:30px;text-align:center}.pg h1{font-size:24px;font-weight:700;letter-spacing:-.04em;margin-bottom:6px}.pg p{font-size:14px;color:#6A6F96;margin-bottom:22px}
.tg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tg button{border:1.5px solid #E1E4F6;background:#FAFAFF;color:#10132B;border-radius:12px;padding:10px 15px;font:600 13.5px 'Sora';cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}.tg button:hover{border-color:var(--c);background:#fff;transform:translateY(-2px)}.tg button:focus-visible{outline:2px solid #10132B;outline-offset:2px}.tg button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="st"><div class="is" id="is" role="status" aria-live="polite"><div class="ic"><i class="dot" id="dt"></i><span class="tx" id="tx"></span></div><div class="ex" id="ex"></div></div>
<div class="pg"><h1>Dynamic alerts</h1><p>Tap a trigger and watch the island morph to fit.</p><div class="tg" id="tg"></div></div></div>
<script>
const A={ok:['#34D399','Saved to drafts',0,'',[]],pay:['#FBBF24','Payment due in 3 days',1,'Your Pro plan renews on Nov 12. Update your card to avoid interruption.',[['Update card','p'],['Later','s']]],err:['#F87171','Build failed',1,'api-service failed with 3 type errors in auth.ts.',[['View log','p'],['Retry','s']]],inf:['#60A5FA','3 new comments',0,'',[]]};
const is=document.getElementById('is'),tx=document.getElementById('tx'),dt=document.getElementById('dt'),ex=document.getElementById('ex');let tm=null;
function size(big,txt){const probe=document.createElement('span');probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:600 14px Sora';probe.textContent=txt;document.body.appendChild(probe);const w=probe.offsetWidth+18*2+12+12;probe.remove();is.style.width=(big?Math.max(w,340):w)+'px';is.style.height=big?'158px':'44px'}
function show(k){clearTimeout(tm);const a=A[k];dt.style.setProperty('--c',a[0]);dt.style.background=a[0];dt.style.boxShadow='0 0 12px '+a[0];tx.textContent=a[1];ex.innerHTML=a[2]?'<p>'+a[3]+'</p><div class="bt">'+a[4].map(b=>'<button class="'+b[1]+'">'+b[0]+'</button>').join('')+'</div>':'';is.classList.add('open');is.classList.toggle('big',!!a[2]);size(!!a[2],a[1]);ex.querySelectorAll('button').forEach(b=>b.onclick=hide);if(!a[2])tm=setTimeout(hide,3200)}
function hide(){is.classList.remove('open','big');ex.innerHTML='';is.style.width='36px';is.style.height='36px'}
const tg=document.getElementById('tg');[['ok','Saved','#34D399'],['pay','Payment due','#FBBF24'],['err','Build failed','#F87171'],['inf','Comments','#60A5FA']].forEach(b=>{const e=document.createElement('button');e.style.setProperty('--c',b[2]);e.innerHTML='<i></i>'+b[1];e.onclick=()=>show(b[0]);tg.appendChild(e)});
is.style.width='36px';is.style.height='36px';setTimeout(()=>show('pay'),150);
</script></body></html>
