<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Application Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 480px at 100% 100%,#2A1840,transparent 60%),#0A0810;color:#EFEAF8;font-family:'Epilogue',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:520px;background:#120F1D;border:1px solid #251F38;border-radius:28px;padding:28px;box-shadow:0 40px 80px -34px #000}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:#8A7FAE;margin-bottom:12px}.top b{color:#fff}
.pb{display:flex;gap:6px;margin-bottom:24px}.pb i{flex:1;height:5px;border-radius:5px;background:#201A33;overflow:hidden}.pb i::after{content:"";display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#FF8A5B,#E84393);transition:width .5s cubic-bezier(.3,1,.4,1)}.pb i.on::after{width:100%}
.st h1{font-size:24px;font-weight:800;letter-spacing:-.04em}.st p{color:#8A7FAE;font-size:14.5px;margin:5px 0 20px;line-height:1.5}
.f{margin-bottom:14px}.f label{display:block;font-size:13px;font-weight:600;color:#B8AED8;margin-bottom:7px}
.f input,.f select{width:100%;background:#17132A;border:1.5px solid #2B2445;border-radius:14px;padding:14px 15px;font:500 15px 'Epilogue';color:#EFEAF8;outline:0;transition:all .2s;appearance:none}
.f input:focus,.f select:focus{border-color:#E84393;box-shadow:0 0 0 4px rgba(232,67,147,.14)}.f.bad input,.f.bad select{border-color:#FF6B7A}
.f .er{display:none;font-size:12.5px;color:#FF8A96;margin-top:6px}.f.bad .er{display:block}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ch button{border:1.5px solid #2B2445;background:#17132A;color:#CFC6EA;font:600 14px 'Epilogue';padding:15px;border-radius:14px;cursor:pointer;text-align:left;transition:all .2s}
.ch button[aria-pressed=true]{border-color:#E84393;background:rgba(232,67,147,.12);color:#fff}.ch button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sm{background:#17132A;border:1.5px dashed #2B2445;border-radius:16px;padding:6px 16px}.sm div{display:flex;justify-content:space-between;padding:11px 0;font-size:14.5px;border-bottom:1px solid #221C38}.sm div:last-child{border-bottom:0}.sm span{color:#8A7FAE}.sm b{font-weight:600;text-align:right}
.ft{display:flex;justify-content:space-between;margin-top:22px}
.bk{border:0;background:none;color:#8A7FAE;font:700 14.5px 'Epilogue';cursor:pointer;padding:12px 6px}.bk:disabled{opacity:0;pointer-events:none}.bk:hover{color:#fff}
.nx{border:0;border-radius:14px;padding:14px 28px;font:700 15px 'Epilogue';background:linear-gradient(135deg,#FF8A5B,#E84393);color:#fff;cursor:pointer;box-shadow:0 14px 26px -12px rgba(232,67,147,.7);transition:transform .15s}.nx:hover{transform:translateY(-1px)}.nx:focus-visible,.bk:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:480px){.g,.ch{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="top"><span>Step <b id="n">1</b> of 3</span><span id="t">About you</span></div><div class="pb" id="pb"><i></i><i></i><i></i></div><div class="st" id="s"></div>
<div class="ft"><button class="bk" id="bk">← Back</button><button class="nx" id="nx">Continue</button></div></div>
<script>
const D={name:'Maya Alvarez',email:'maya@northwind.co',role:'Product designer',years:'5–8 years',focus:'Design systems'};let i=0;const $=id=>document.getElementById(id);
const E=s=>s.replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const view=[
()=>'<h1>Tell us about you</h1><p>The basics — it takes about a minute.</p><div class="f"><label for="a">Full name</label><input id="a" value="'+E(D.name)+'"><div class="er">Please enter your name.</div></div><div class="f"><label for="b">Work email</label><input id="b" value="'+E(D.email)+'"><div class="er">Enter a valid email address.</div></div>',
()=>'<h1>Your experience</h1><p>Helps us match you with the right team.</p><div class="f"><label for="c">Current role</label><input id="c" value="'+E(D.role)+'"><div class="er">Please enter your role.</div></div><div class="f"><label for="d">Years of experience</label><select id="d">'+['1–2 years','3–5 years','5–8 years','8+ years'].map(o=>'<option'+(o===D.years?' selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="f"><label>Focus area</label><div class="ch" id="ch">'+['Design systems','Product strategy','Brand & identity','Research'].map(o=>'<button type="button" aria-pressed="'+(o===D.focus)+'">'+o+'</button>').join('')+'</div></div>',
()=>'<h1>Review &amp; submit</h1><p>Make sure everything looks right.</p><div class="sm"><div><span>Name</span><b>'+E(D.name)+'</b></div><div><span>Email</span><b>'+E(D.email)+'</b></div><div><span>Role</span><b>'+E(D.role)+'</b></div><div><span>Experience</span><b>'+E(D.years)+'</b></div><div><span>Focus</span><b>'+E(D.focus)+'</b></div></div>'];
const T=['About you','Experience','Review'];
function draw(){$('s').innerHTML=view[i]();$('n').textContent=i+1;$('t').textContent=T[i];[...$('pb').children].forEach((x,k)=>x.classList.toggle('on',k<=i));$('bk').disabled=i===0;$('nx').textContent=i===2?'Submit application':'Continue';
 const ch=$('ch');if(ch)ch.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;D.focus=b.textContent;[...ch.children].forEach(x=>x.setAttribute('aria-pressed',x===b))})}
function ok(id,v){const f=$(id).closest('.f');f.classList.toggle('bad',!v);return v}
$('nx').onclick=()=>{if(i===0){D.name=$('a').value;D.email=$('b').value;if(!(ok('a',D.name.trim().length>1)&ok('b',/^\S+@\S+\.\S+$/.test(D.email))))return}
 if(i===1){D.role=$('c').value;D.years=$('d').value;if(!ok('c',D.role.trim().length>1))return}
 if(i<2){i++;draw()}else{$('s').innerHTML='<h1>Application sent</h1><p>Thanks '+E(D.name.split(' ')[0])+' — we\'ll email you within three working days.</p>';$('nx').style.display='none';$('bk').style.display='none'}};
$('bk').onclick=()=>{if(i>0){i--;draw()}};draw();
</script></body></html>
