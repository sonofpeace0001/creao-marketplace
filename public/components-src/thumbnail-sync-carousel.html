<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thumbnail Sync Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ECEEF2;color:#101420;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:720px;background:#fff;border-radius:28px;padding:14px;box-shadow:0 40px 56px -34px rgba(16,20,32,.5),inset 0 0 0 1px rgba(16,20,32,.07)}
.mn{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#101420}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .9s}.sl.on{opacity:1}.sl svg{width:100%;height:100%;display:block;transform:scale(1.06)}.sl.on svg{animation:kb 6s ease-out forwards}@keyframes kb{to{transform:scale(1.2) translate(var(--x,-2%),var(--y,-1%))}}
.mn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,10,18,.82));pointer-events:none}
.cp{position:absolute;left:24px;right:80px;bottom:20px;z-index:2;color:#fff}.cp small{font:500 11.500px 'DM Mono';letter-spacing:.18em;text-transform:uppercase;opacity:.8}.cp h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:4px;transition:transform .6s cubic-bezier(.3,1.2,.4,1),opacity .5s}.cp.sw h2,.cp.sw small{transform:translateY(14px);opacity:0}
.ct{position:absolute;right:20px;bottom:22px;z-index:2;font:500 13px 'DM Mono';color:#fff}.ct b{font-size:20px}
.ar{position:absolute;top:50%;width:42px;height:42px;margin-top:-21px;border:0;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);color:#fff;font-size:20px;cursor:pointer;z-index:3;transition:background .2s}.ar:hover{background:rgba(255,255,255,.35)}.ar.l{left:14px}.ar.r{right:14px}.ar:focus-visible{outline:2px solid #fff}
.th{display:flex;gap:10px;margin-top:12px;overflow:hidden;padding:2px}.th>div{display:flex;gap:10px;transition:transform .6s cubic-bezier(.3,1.1,.4,1)}
.tb{position:relative;flex:none;width:118px;height:70px;border-radius:12px;overflow:hidden;border:0;padding:0;cursor:pointer;opacity:.55;transition:opacity .3s,transform .4s cubic-bezier(.3,1.5,.5,1)}.tb.on{opacity:1;transform:translateY(-2px)}.tb svg{width:100%;height:100%;display:block}.tb::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 0 #6366F1;transition:box-shadow .25s}.tb.on::after{box-shadow:inset 0 0 0 3px #6366F1}
.tb i{position:absolute;left:0;bottom:0;height:4px;background:#fff;width:0;z-index:2}.tb.on i{width:var(--p,0%)}.tb:focus-visible{outline:2px solid #6366F1}
</style></head><body>
<div class="cd"><div class="mn" id="mn"><div class="cp" id="cp"><small id="sm"></small><h2 id="h2"></h2></div><div class="ct"><b id="cn">1</b> / 7</div><button class="ar l" id="pv" aria-label="Previous">‹</button><button class="ar r" id="nx" aria-label="Next">›</button></div><div class="th"><div id="tr"></div></div></div>
<script>
function scene(s,w,h){const r=(n=1)=>{s=(s*9301+49297)%233280;return s/233280*n};const P=[['#1B2A6B','#E85D75','#FFB86B'],['#0B3B3C','#2FA58B','#F4E285'],['#3A1C5B','#C4478D','#FF9E7A'],['#10243A','#3D7BA8','#F2D8A7'],['#3B1A1A','#D1583B','#F8C37A']][Math.floor(r(5))];const id='g'+w+Math.floor(s);let o='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P[0]+'"/><stop offset=".55" stop-color="'+P[1]+'"/><stop offset="1" stop-color="'+P[2]+'"/></linearGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#'+id+')"/><circle cx="'+(w*.2+r(w*.6))+'" cy="'+(h*.2+r(h*.2))+'" r="'+(h*.09+r(h*.06))+'" fill="#FFF3D1" opacity=".95"/>';for(let l=0;l<4;l++){let d='M0 '+h+'L0 '+(h*.6+l*h*.1);const a=h*.08+r(h*.1),f=.012+r(.02)*(400/w),ph=r(6);for(let x=0;x<=w;x+=w/50)d+=' L'+x+' '+(h*.6+l*h*.1-a*Math.abs(Math.sin(x*f+ph))-a*.35*Math.sin(x*f*2.3+ph*2)).toFixed(1);d+=' L'+w+' '+h+'Z';o+='<path d="'+d+'" fill="#0C0A14" opacity="'+(.22+l*.22)+'"/>'}return o+'</svg>'}
const S=[['Norway','Fjord at first light'],['Japan','Cedar paths of Koyasan'],['Morocco','Blue hour in the medina'],['Chile','Salt flat mirror'],['Scotland','Highland storm break'],['Greece','Whitewashed terraces'],['Canada','Aurora over Yukon']];
const mn=document.getElementById('mn'),tr=document.getElementById('tr'),$=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms));const slides=[],thumbs=[];let cur=0,off=false,pr=0;
S.forEach((s,i)=>{const d=document.createElement('div');d.className='sl';d.style.setProperty('--x',(i%2?2:-2)+'%');d.innerHTML=scene(i*13+9,720,405);mn.insertBefore(d,$('cp'));slides.push(d);const b=document.createElement('button');b.className='tb';b.innerHTML=scene(i*13+9,118,70)+'<i></i>';b.onclick=()=>{off=true;go(i)};tr.appendChild(b);thumbs.push(b)});
function go(i){i=(i+S.length)%S.length;const cp=$('cp');cp.classList.add('sw');slides.forEach((s,k)=>{if(k===i){s.classList.remove('on');void s.offsetWidth;s.classList.add('on')}else s.classList.remove('on')});thumbs.forEach((t,k)=>t.classList.toggle('on',k===i));setTimeout(()=>{$('sm').textContent=S[i][0];$('h2').textContent=S[i][1];cp.classList.remove('sw')},260);$('cn').textContent=i+1;cur=i;pr=0;const w=thumbs[i].offsetWidth+10,box=tr.parentNode.clientWidth;tr.style.transform='translateX('+Math.min(0,Math.max(box-S.length*w,box/2-(i*w+w/2)))+'px)'}
$('pv').onclick=()=>{off=true;go(cur-1)};$('nx').onclick=()=>{off=true;go(cur+1)};
go(2);slides[2].style.transition='none';$('sm').textContent=S[2][0];$('h2').textContent=S[2][1];requestAnimationFrame(()=>slides[2].style.transition='');
/* Idle demo: the main photo cross-fades while slowly zooming and drifting in alternating directions, its caption slides up from below, and the thumbnail strip underneath scrolls to centre the active frame, which rises with an indigo ring and a white progress line that fills until the next slide, looping through seven scenes, until you click an arrow or thumbnail. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let last=0;requestAnimationFrame(function lp(n){const dt=Math.min(.05,(n-last)/1000||0);last=n;if(!off&&n>3000){pr+=dt/3.4;if(pr>=1)go(cur+1);thumbs[cur].style.setProperty('--p',Math.min(1,pr)*100+'%')}requestAnimationFrame(lp)})}
</script></body></html>
