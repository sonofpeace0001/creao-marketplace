<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Circle Reveal Theme Toggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#CFD3E0;font-family:'Plus Jakarta Sans',sans-serif;display:grid;place-items:center;padding:20px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{position:relative;width:100%;max-width:760px;height:min(520px,86vh);border-radius:28px;overflow:hidden;box-shadow:0 40px 60px -34px rgba(10,12,30,.6),0 0 0 1px rgba(10,12,30,.1)}
.ly{position:absolute;inset:0;padding:22px 26px;display:grid;grid-template-rows:auto auto 1fr;gap:18px;--bg:#F6F7FB;--fg:#12162C;--mu:#7C829E;--cd:#fff;--bd:rgba(18,22,44,.07);--ac:#6366F1;background:var(--bg);color:var(--fg)}
.ly.dk{--bg:#0C0E1A;--fg:#EEF0FF;--mu:#8A90B5;--cd:#151829;--bd:rgba(255,255,255,.08);--ac:#818CF8}
.top{display:flex;align-items:center;gap:12px}.top .lg{font-weight:800;font-size:18px;letter-spacing:-.04em;display:flex;align-items:center;gap:9px}.top .lg i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--ac),#EC4899);display:block}
.top nav{display:flex;gap:18px;margin-left:24px;font-size:13.500px;font-weight:600;color:var(--mu)}.top nav b{color:var(--fg)}
.sp{margin-left:auto;width:48px}
.hd h1{font-size:26px;font-weight:800;letter-spacing:-.045em}.hd p{font-size:14px;color:var(--mu);margin-top:4px}
.gr{display:grid;grid-template-columns:repeat(3,1fr) 1.4fr;gap:12px;align-content:start}
.k{border-radius:20px;background:var(--cd);padding:16px;box-shadow:inset 0 0 0 1px var(--bd)}.k small{font-size:12px;font-weight:600;color:var(--mu)}.k b{display:block;font-size:26px;font-weight:800;letter-spacing:-.05em;margin-top:6px}.k i{font:600 11.500px 'Geist Mono';font-style:normal;color:#16A34A}
.ch{grid-column:1/-1;display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.bx{border-radius:20px;background:var(--cd);padding:16px;box-shadow:inset 0 0 0 1px var(--bd)}.bx small{font-size:12px;font-weight:600;color:var(--mu)}
.bs{display:flex;align-items:flex-end;gap:7px;height:110px;margin-top:12px}.bs i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 40%,var(--cd)))}
.li div{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px;font-weight:600}.li div:last-child{border:0}.li i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#EC4899);flex:none}.li span{margin-left:auto;color:var(--mu);font:500 12px 'Geist Mono'}
#top{z-index:3;clip-path:circle(0 at var(--x,50%) var(--y,50%))}
.tg{position:absolute;right:26px;top:16px;z-index:5;width:56px;height:56px;border-radius:50%;border:0;background:#12162C;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 18px -6px rgba(0,0,0,.5);transition:background .4s,transform .2s}
.tg:active{transform:scale(.92)}.tg:focus-visible{outline:3px solid #6366F1;outline-offset:3px}
.tg svg{position:absolute;width:26px;height:26px;transition:transform .6s cubic-bezier(.3,1.5,.5,1),opacity .35s}.tg svg *{fill:none;stroke:currentColor;stroke-width:2.100;stroke-linecap:round;stroke-linejoin:round}
.tg .su{opacity:1;transform:none}.tg .mo{opacity:0;transform:rotate(-90deg) scale(.4)}.app.dark .tg{background:#fff;color:#12162C}.app.dark .tg .su{opacity:0;transform:rotate(90deg) scale(.4)}.app.dark .tg .mo{opacity:1;transform:none}
@media(max-width:600px){.gr{grid-template-columns:1fr 1fr}.ch{grid-template-columns:1fr}.top nav{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app" id="app"><button class="tg" id="tg" aria-label="Switch to dark theme" aria-pressed="false"><svg class="su" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.500M12 19.500V22M2 12h2.500M19.500 12H22M4.900 4.900l1.800 1.800M17.300 17.300l1.800 1.800M19.100 4.900l-1.800 1.800M6.700 17.300l-1.800 1.800"/></svg><svg class="mo" viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 0 1 9.500 4 8 8 0 1 0 20 14.500Z"/></svg></button></div>
<script>
const app=document.getElementById('app'),tg=document.getElementById('tg');
const H='<div class="top"><div class="lg"><i></i>Northwind</div><nav><b>Overview</b><span>Reports</span><span>Customers</span><span>Billing</span></nav><span class="sp"></span></div><div class="hd"><h1>Good morning, Amara</h1><p>Here is how the store did overnight.</p></div><div class="gr"><div class="k"><small>Revenue</small><b>$48.2k</b><i>+12.4%</i></div><div class="k"><small>Orders</small><b>1,284</b><i>+8.1%</i></div><div class="k"><small>Conversion</small><b>3.8%</b><i>+0.4%</i></div><div class="k"><small>Avg order</small><b>$86.50</b><i>+5.2%</i></div><div class="ch"><div class="bx"><small>Sales this week</small><div class="bs"><i style="height:42%"></i><i style="height:58%"></i><i style="height:48%"></i><i style="height:72%"></i><i style="height:64%"></i><i style="height:90%"></i><i style="height:78%"></i></div></div><div class="bx li"><small>Latest orders</small><div><i></i>Priya N.<span>$128</span></div><div><i></i>Marcus W.<span>$64</span></div><div><i></i>Hannah C.<span>$212</span></div></div></div></div>';
const base=document.createElement('div');base.className='ly';base.innerHTML=H;const dk=document.createElement('div');dk.className='ly dk';dk.id='top';dk.innerHTML=H;app.insertBefore(base,tg);app.insertBefore(dk,tg);
let dark=false,raf;
function anim(to){const r=app.getBoundingClientRect(),b=tg.getBoundingClientRect(),x=b.left-r.left+b.width/2,y=b.top-r.top+b.height/2,max=Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y));dk.style.setProperty('--x',x+'px');dk.style.setProperty('--y',y+'px');
 const t0=performance.now(),D=900,from=to?0:max,dest=to?max:0;cancelAnimationFrame(raf);(function f(n){const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);dk.style.clipPath='circle('+(from+(dest-from)*e)+'px at '+x+'px '+y+'px)';if(k<1)raf=requestAnimationFrame(f)})(t0)}
function setT(d){dark=d;app.classList.toggle('dark',d);tg.setAttribute('aria-pressed',d);tg.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');anim(d)}
tg.onclick=()=>{off=true;setT(!dark)};
/* Idle demo: the theme flips every 3.4s; a circle expands from the sun and moon button across the whole app (and shrinks back for light), with the icon rotating between sun and moon, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2800);while(!off){setT(!dark);await sleep(3400)}})()}
</script></body></html>
