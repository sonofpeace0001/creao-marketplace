<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Morph Shape Loaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#101018;color:#ECEEFA;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:860px;text-align:center}
h1{font-size:clamp(26px,4.5vw,38px);font-weight:700;letter-spacing:-.05em}p.sb{color:#80849F;font-size:15px;margin:8px 0 34px}
.gd{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cd{background:#161824;border:1px solid #232739;border-radius:24px;height:200px;display:grid;place-items:center;position:relative}.cd small{position:absolute;left:0;right:0;bottom:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6B7090}
/* 1 morph */
.m1{width:56px;height:56px;background:linear-gradient(135deg,#F472B6,#8B5CF6);animation:m1 3s ease-in-out infinite}@keyframes m1{0%,100%{border-radius:50%;transform:rotate(0) scale(1)}25%{border-radius:12% ;transform:rotate(90deg) scale(.85)}50%{border-radius:50% 0 50% 0;transform:rotate(180deg) scale(1.1)}75%{border-radius:0 50% 0 50%;transform:rotate(270deg) scale(.9)}}
/* 2 triangle chase */
.m2{position:relative;width:64px;height:64px;animation:r2 2.4s linear infinite}.m2 i{position:absolute;width:20px;height:20px;border-radius:6px;background:var(--c)}.m2 i:nth-child(1){left:0;top:0;--c:#34D399;animation:b2 1.2s ease-in-out infinite}.m2 i:nth-child(2){right:0;top:0;--c:#FBBF24;animation:b2 1.2s .15s ease-in-out infinite}.m2 i:nth-child(3){left:22px;bottom:0;--c:#38BDF8;animation:b2 1.2s .3s ease-in-out infinite}@keyframes r2{to{transform:rotate(360deg)}}@keyframes b2{50%{transform:scale(.55);border-radius:50%}}
/* 3 stacking squares */
.m3{position:relative;width:56px;height:56px;perspective:200px}.m3 i{position:absolute;inset:0;border:3px solid var(--c);border-radius:10px;animation:s3 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.2s);opacity:.9}@keyframes s3{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(45deg) scale(calc(1 - var(--i)*.14))}}
/* 4 arc spinner */
.m4{position:relative;width:64px;height:64px}.m4 svg{width:100%;height:100%;animation:r2 1.4s linear infinite}.m4 circle{fill:none;stroke-width:5;stroke-linecap:round}.m4 .a{stroke:#F59E0B;stroke-dasharray:60 140;animation:d4 1.6s ease-in-out infinite}.m4 .b{stroke:#EC4899;stroke-dasharray:30 170;stroke-dashoffset:-70;opacity:.9}@keyframes d4{50%{stroke-dasharray:110 90}}
@media(max-width:700px){.gd{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:6s!important}}
</style></head><body>
<div class="c"><h1>Shapes in motion</h1><p class="sb">Four loaders built from nothing but CSS shapes.</p>
<div class="gd"><div class="cd"><div class="m1"></div><small>Morph</small></div><div class="cd"><div class="m2"><i></i><i></i><i></i></div><small>Chase</small></div><div class="cd"><div class="m3"><i style="--i:0;--c:#818CF8"></i><i style="--i:1;--c:#A78BFA"></i><i style="--i:2;--c:#C084FC"></i><i style="--i:3;--c:#E879F9"></i></div><small>Rotate</small></div><div class="cd"><div class="m4"><svg viewBox="0 0 64 64"><circle class="a" cx="32" cy="32" r="26"/><circle class="b" cx="32" cy="32" r="26"/></svg></div><small>Arc</small></div></div></div>
</body></html>
