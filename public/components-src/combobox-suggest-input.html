<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Combobox Suggest Input</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2F4F8;color:#101524;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:start center;padding:9vh 14px 24px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:440px}
.w>label{display:block;font-size:13px;font-weight:600;color:#5A6280;margin-bottom:9px}
.bx{position:relative}
.fd{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-height:56px;padding:9px 12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.500px #D8DDEB;transition:box-shadow .2s;cursor:text}
.fd:focus-within{box-shadow:inset 0 0 0 2px #4F46E5,0 0 0 5px rgba(79,70,229,.14)}
.fd input{flex:1;min-width:120px;border:0;outline:0;background:none;font:500 16px 'Inter Tight';color:#101524;padding:4px 2px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:99px;background:#EEF0FF;font-size:14px;font-weight:600;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 10.500px 'Inter Tight';color:#fff;flex:none}
.chip button{width:20px;height:20px;border:0;border-radius:50%;background:none;color:#6B73A1;cursor:pointer;font-size:15px;line-height:1}.chip button:hover{background:rgba(79,70,229,.15)}
.ls{position:absolute;left:0;right:0;top:calc(100% + 8px);border-radius:18px;background:#fff;box-shadow:0 24px 44px -16px rgba(16,21,36,.35),inset 0 0 0 1px rgba(16,21,36,.08);padding:6px;opacity:0;transform:translateY(-6px) scale(.985);pointer-events:none;transition:all .22s cubic-bezier(.3,1.3,.4,1);z-index:4;max-height:290px;overflow:hidden}
.bx.open .ls{opacity:1;transform:none;pointer-events:auto}
.op{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .12s}
.op.hl{background:#EEF0FF}.op .nm{font-size:15px;font-weight:600}.op .nm mark{background:none;color:#4F46E5;font-weight:700}.op .rl{font-size:12.500px;color:#7A82A3}
.op .av{width:34px;height:34px;font-size:12px}.op .ck{margin-left:auto;width:18px;height:18px;border-radius:50%;background:#4F46E5;display:none;place-items:center}.op.sel .ck{display:grid}.op.sel{opacity:.55}
.empty{padding:16px;text-align:center;font-size:14px;color:#8A91AE}
.ft{display:flex;gap:14px;padding:8px 10px 4px;margin-top:4px;border-top:1px solid #ECEEF5;font-size:12px;color:#8A91AE}.ft kbd{font:600 11px 'Inter Tight';padding:1px 6px;border-radius:5px;background:#F0F2F8;box-shadow:0 1px 0 #D8DDEB;color:#5A6280}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="w"><label for="in">Assign to</label>
<div class="bx" id="bx"><div class="fd" id="fd"><input id="in" role="combobox" aria-expanded="false" aria-controls="ls" aria-autocomplete="list" autocomplete="off" placeholder="Search teammates"></div><div class="ls" id="ls" role="listbox"></div></div></div>
<script>
const P=[['Priya Nair','Design lead','#7C3AED'],['Priscilla Okafor','Engineering manager','#0891B2'],['Marcus Webb','Staff engineer','#D97706'],['Amara Diallo','Product manager','#DB2777'],['Lucas Ferreira','Data scientist','#059669'],['Hannah Cho','Brand designer','#2563EB'],['Tomas Novak','DevOps','#DC2626']];
const bx=document.getElementById('bx'),fd=document.getElementById('fd'),inp=document.getElementById('in'),ls=document.getElementById('ls');let sel=[1],hl=0,list=[];
const ini=n=>n.split(' ').map(x=>x[0]).join('');
function chips(){fd.querySelectorAll('.chip').forEach(c=>c.remove());sel.forEach(i=>{const c=document.createElement('span');c.className='chip';c.innerHTML='<span class="av" style="background:'+P[i][2]+'">'+ini(P[i][0])+'</span>'+P[i][0].split(' ')[0]+'<button type="button" aria-label="Remove '+P[i][0]+'">&times;</button>';c.querySelector('button').onclick=()=>{sel=sel.filter(x=>x!==i);chips();render()};fd.insertBefore(c,inp)})}
function render(){const q=inp.value.trim().toLowerCase();list=P.map((p,i)=>i).filter(i=>P[i][0].toLowerCase().includes(q)).slice(0,4);hl=Math.min(hl,Math.max(0,list.length-1));
 ls.innerHTML=list.length?list.map((i,k)=>{const n=P[i][0],at=q?n.toLowerCase().indexOf(q):-1,nm=at>=0?n.slice(0,at)+'<mark>'+n.slice(at,at+q.length)+'</mark>'+n.slice(at+q.length):n;
  return '<div class="op'+(k===hl?' hl':'')+(sel.includes(i)?' sel':'')+'" role="option" data-i="'+i+'"><span class="av" style="background:'+P[i][2]+'">'+ini(n)+'</span><div><div class="nm">'+nm+'</div><div class="rl">'+P[i][1]+'</div></div><span class="ck"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span></div>'}).join('')+'<div class="ft"><span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> navigate</span><span><kbd>Enter</kbd> select</span><span><kbd>Esc</kbd> close</span></div>':'<div class="empty">No teammates match &ldquo;'+inp.value.replace(/</g,'')+'&rdquo;</div>';
 ls.querySelectorAll('.op').forEach(o=>o.onmousedown=e=>{e.preventDefault();choose(+o.dataset.i)})}
function open(v){bx.classList.toggle('open',v);inp.setAttribute('aria-expanded',v)}
function choose(i){if(!sel.includes(i))sel.push(i);else sel=sel.filter(x=>x!==i);inp.value='';chips();render()}
inp.addEventListener('input',()=>{hl=0;open(true);render()});inp.addEventListener('focus',()=>{open(true);render()});inp.addEventListener('blur',()=>open(false));fd.addEventListener('click',()=>inp.focus());
inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){hl=(hl+1)%list.length;render();e.preventDefault()}else if(e.key==='ArrowUp'){hl=(hl+list.length-1)%list.length;render();e.preventDefault()}else if(e.key==='Enter'&&list.length){choose(list[hl]);e.preventDefault()}else if(e.key==='Escape')open(false);else if(e.key==='Backspace'&&!inp.value&&sel.length){sel.pop();chips();render()}});
chips();render();
/* Idle demo: the menu opens, a query is typed, matches highlight, the selection moves and a teammate is added, then it resets. */
let off=false;['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>off=true,{once:true}));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 (async()=>{await sleep(3600);while(!off){sel=[1];chips();inp.value='';open(true);hl=0;render();await sleep(900);for(const c of 'ma'){if(off)return;inp.value+=c;hl=0;render();await sleep(220)}await sleep(700);if(off)return;hl=list.length>1?1:0;render();await sleep(600);choose(list[hl]);open(true);await sleep(1000);for(const c of 'han'){if(off)return;inp.value+=c;hl=0;render();await sleep(200)}await sleep(500);choose(list[0]);await sleep(1800);open(false);await sleep(1400)}})()}
else open(false);
open(true);
</script></body></html>
