<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Drop Empty State</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2F0FA;color:#181435;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.dz{position:relative;width:100%;max-width:560px;border-radius:30px;padding:46px 30px 34px;text-align:center;background:#fff;cursor:pointer;transition:all .3s cubic-bezier(.3,1.2,.4,1);outline:0;border:0;display:block;color:inherit;font:inherit}
.dz svg.bd{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.dz svg.bd rect{fill:none;stroke:#C9C1EE;stroke-width:2;stroke-dasharray:8 8;transition:stroke .3s;animation:mv 1.2s linear infinite}@keyframes mv{to{stroke-dashoffset:-32}}
.dz:hover,.dz.ov{background:#F7F5FF;transform:translateY(-4px)}.dz:hover svg.bd rect,.dz.ov svg.bd rect{stroke:#6D4DF2}.dz:focus-visible{outline:3px solid #181435;outline-offset:4px}
.il{position:relative;width:150px;height:116px;margin:0 auto 22px}
.fl{position:absolute;width:62px;height:78px;border-radius:12px;background:#fff;border:2px solid #181435;box-shadow:0 8px 16px -8px rgba(24,20,53,.4);display:grid;place-items:center;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.fl::before{content:"";width:28px;height:4px;border-radius:3px;background:var(--c);box-shadow:0 8px 0 var(--c),0 16px 0 #E4E0F5}
.f1{left:6px;top:20px;transform:rotate(-12deg);--c:#FF8A5B}.f2{right:6px;top:20px;transform:rotate(12deg);--c:#38BDF8}.f3{left:44px;top:6px;--c:#6D4DF2;z-index:2}
.dz:hover .f1,.dz.ov .f1{transform:rotate(-20deg) translate(-12px,-8px)}.dz:hover .f2,.dz.ov .f2{transform:rotate(20deg) translate(12px,-8px)}.dz:hover .f3,.dz.ov .f3{transform:translateY(-14px)}
.ar{position:absolute;left:50%;bottom:-8px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#6D4DF2;color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -6px #6D4DF2;z-index:3;animation:bn 2s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-6px)}}
.dz h1{font-size:24px;font-weight:800;letter-spacing:-.04em}.dz p{font-size:15px;line-height:1.55;color:#6C6694;margin:8px auto 18px;max-width:34ch}.dz p b{color:#6D4DF2;font-weight:700}
.tp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tp span{font-size:12.5px;font-weight:700;color:#5B5585;background:#F0EDFB;padding:5px 12px;border-radius:99px}
.ls{margin-top:20px;display:grid;gap:8px;text-align:left}.ls div{display:flex;align-items:center;gap:12px;background:#F7F5FF;border-radius:14px;padding:10px 14px;animation:in .4s cubic-bezier(.3,1.3,.5,1)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ls i{width:34px;height:34px;border-radius:10px;background:#6D4DF2;color:#fff;display:grid;place-items:center;font:800 10px 'Plus Jakarta Sans';font-style:normal;flex:none}.ls b{font-size:14px;font-weight:700;display:block}.ls span{font-size:12.5px;color:#8A84AE}.ls .bar{margin-left:auto;width:70px;height:5px;border-radius:5px;background:#E4E0F5;overflow:hidden}.ls .bar u{display:block;height:100%;width:0;background:#6D4DF2;border-radius:5px;transition:width 1s}
.tl{display:flex;justify-content:center;gap:8px;margin-top:16px;font-size:13px;color:#8A84AE}.tl a{color:#6D4DF2;font-weight:700;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div><button class="dz" id="dz" aria-label="Upload files. Drop files here or press Enter to browse."><svg class="bd" aria-hidden="true"><rect x="1" y="1" rx="29" style="width:calc(100% - 2px);height:calc(100% - 2px)"/></svg>
<div class="il" aria-hidden="true"><div class="fl f1"></div><div class="fl f2"></div><div class="fl f3"></div><div class="ar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div></div>
<h1 id="h">Drop your files here</h1><p id="p">Drag and drop to upload, or <b>browse from your computer</b>. We will organise them for you.</p><div class="tp"><span>PDF</span><span>PNG</span><span>JPG</span><span>MP4</span><span>Up to 50 MB</span></div></button>
<input type="file" id="f" multiple hidden><div class="ls" id="ls"></div><div class="tl"><span>No files yet?</span><a href="#">Start from a template</a></div></div>
<script>
const dz=document.getElementById('dz'),f=document.getElementById('f'),ls=document.getElementById('ls');
function add(n,s,t){const d=document.createElement('div');d.innerHTML='<i>'+(n.split('.').pop()||'FILE').slice(0,4).toUpperCase()+'</i><div><b>'+n+'</b><span>'+s+'</span></div><div class="bar"><u></u></div>';ls.appendChild(d);setTimeout(()=>d.querySelector('u').style.width='100%',60)}
function files(L){[...L].slice(0,4).forEach(x=>add(x.name,(x.size/1024<1024?Math.round(x.size/1024)+' KB':(x.size/1048576).toFixed(1)+' MB')));if(L.length){document.getElementById('h').textContent=L.length+' file'+(L.length>1?'s':'')+' uploading'}}
dz.onclick=()=>f.click();f.onchange=()=>files(f.files);
['dragenter','dragover'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.add('ov');document.getElementById('h').textContent='Release to upload'}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.remove('ov');if(e==='drop')files(x.dataTransfer.files);else document.getElementById('h').textContent='Drop your files here'}));
</script></body></html>
