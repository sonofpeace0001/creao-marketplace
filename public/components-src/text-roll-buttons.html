<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Text Roll Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F1014;color:#F2F3F8;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:760px;text-align:center}
h1{font-size:clamp(26px,4.5vw,38px);font-weight:700;letter-spacing:-.05em}p.sb{color:#80849C;font-size:15px;margin:8px 0 34px}
.rw{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:20px}
.bt{position:relative;display:inline-flex;align-items:center;gap:12px;border:0;cursor:pointer;font:600 17px 'Space Grotesk';padding:0 30px;height:58px;border-radius:99px;overflow:hidden;color:var(--tx,#0F1014);background:var(--bg,#F2F3F8);transition:transform .15s,background .3s}
.bt:active{transform:scale(.96)}.bt:focus-visible{outline:3px solid #818CF8;outline-offset:4px}
.rl{position:relative;display:block;height:1.4em;line-height:1.4em;overflow:hidden}.rl>span{display:block;transition:transform .5s cubic-bezier(.7,0,.2,1)}.rl>span+span{position:absolute;left:0;top:100%}
.bt:hover .rl>span,.bt:focus-visible .rl>span,.bt.on .rl>span{transform:translateY(-100%)}
.ar{position:relative;width:22px;height:22px;overflow:hidden;flex:none}.ar svg{position:absolute;left:0;top:0;transition:transform .5s cubic-bezier(.7,0,.2,1)}.ar svg+svg{transform:translateX(-140%)}.bt:hover .ar svg:first-child,.bt:focus-visible .ar svg:first-child,.bt.on .ar svg:first-child{transform:translateX(140%)}.bt:hover .ar svg+svg,.bt:focus-visible .ar svg+svg,.bt.on .ar svg+svg{transform:none}
.b2{--bg:#6366F1;--tx:#fff}.b3{--bg:transparent;--tx:#F2F3F8;box-shadow:inset 0 0 0 1.5px #3A3D52}.b3:hover{background:#F2F3F8;color:#0F1014}.b4{--bg:linear-gradient(135deg,#FF5B2E,#FFB703);--tx:#1B0E00}.b5{--bg:#14B8A6;--tx:#03201D;border-radius:16px}
.ls{display:flex;gap:8px;margin-top:6px;justify-content:center;flex-wrap:wrap}.lk{position:relative;display:inline-block;color:#F2F3F8;font:600 19px 'Space Grotesk';text-decoration:none;padding:6px 2px}.lk .rl{height:1.4em}.lk .rl>span+span{color:#818CF8}.lk::after{content:"";position:absolute;left:2px;right:2px;bottom:2px;height:2px;background:#818CF8;transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.7,0,.2,1)}.lk:hover::after,.lk:focus-visible::after{transform:scaleX(1);transform-origin:left}.lk:hover .rl>span,.lk:focus-visible .rl>span{transform:translateY(-100%)}.lk:focus-visible{outline:2px solid #818CF8;outline-offset:3px}
.hint{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#5E6280;margin-top:26px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><h1>Text roll</h1><p class="sb">Labels slide away to reveal a twin underneath.</p>
<div class="rw" id="r1"></div><div class="rw" id="r2"></div><div class="ls" id="ls"></div><div class="hint">Hover or focus any control</div></div>
<script>
const AR='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function bt(cls,a,b,ar){return '<button class="bt '+cls+'"><span class="rl"><span>'+a+'</span><span>'+b+'</span></span>'+(ar?'<span class="ar">'+AR+AR+'</span>':'')+'</button>'}
document.getElementById('r1').innerHTML=bt('b1 on','Get started','Let us go',1)+bt('b2','Watch demo','Press play',0)+bt('b3','Contact sales','Talk to us',1);
document.getElementById('r2').innerHTML=bt('b4','Claim offer','It is yours',1)+bt('b5','Join waitlist','You are in',0);
document.getElementById('ls').innerHTML=['Work','Studio','Journal','Contact'].map(t=>'<a class="lk" href="#"><span class="rl"><span>'+t+'</span><span>'+t+'</span></span></a>').join('&nbsp;&nbsp;&nbsp;');
const f=document.querySelector('.bt.on');document.querySelectorAll('.bt,.lk').forEach(x=>x.addEventListener('mouseenter',()=>f&&f.classList.remove('on')));
</script></body></html>
