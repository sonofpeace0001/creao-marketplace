<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cookie Bottom Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#DDE3EC;color:#142033;font-family:'Figtree',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ph{position:relative;width:100%;max-width:400px;height:600px;border-radius:40px;background:#fff;overflow:hidden;border:8px solid #142033;box-shadow:0 40px 70px -30px rgba(0,0,0,.55)}
.pg{padding:50px 22px;filter:blur(0);transition:filter .4s}.pg h2{font-size:24px;font-weight:800;letter-spacing:-.04em;margin-bottom:12px}.pg i{display:block;height:11px;border-radius:6px;background:#EBEFF5;margin-bottom:9px}.pg i:nth-child(3n){width:70%}.pg .im{height:120px;border-radius:18px;background:linear-gradient(135deg,#C7D2FE,#FBCFE8);margin:14px 0}
.sc{position:absolute;inset:0;background:rgba(20,32,51,.45);opacity:1;transition:opacity .4s}.gone .sc{opacity:0;pointer-events:none}
.sh{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 20px;box-shadow:0 -20px 50px -10px rgba(0,0,0,.3);transform:translateY(var(--y,0px));transition:transform .45s cubic-bezier(.3,1.2,.4,1);touch-action:none;will-change:transform}
.sh.drag{transition:none}.gone .sh{transform:translateY(110%)}
.hn{width:44px;height:5px;border-radius:5px;background:#D5DBE5;margin:0 auto 14px;cursor:grab}
.tp{display:flex;align-items:center;gap:12px;margin-bottom:6px}.tp i{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#F59E0B,#EA580C);display:grid;place-items:center;color:#fff}.tp b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.sh>p{font-size:14px;line-height:1.5;color:#5A6B80;margin-bottom:12px}
.ct{border:1.5px solid #E6EBF2;border-radius:16px;overflow:hidden;margin-bottom:12px}
.rw{border-bottom:1px solid #EEF1F6}.rw:last-child{border:0}.rh{display:flex;align-items:center;gap:10px;padding:11px 14px}.rh button.ex{display:flex;align-items:center;gap:8px;border:0;background:none;font:700 14.5px 'Figtree';color:#142033;cursor:pointer;flex:1;text-align:left;padding:0}.rh button.ex:focus-visible{outline:2px solid #2563EB;outline-offset:2px;border-radius:6px}.rh button.ex svg{color:#8D9BB0;transition:transform .25s}.rw.op .rh button.ex svg{transform:rotate(90deg)}
.dsc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.rw.op .dsc{grid-template-rows:1fr}.dsc>div{overflow:hidden}.dsc p{padding:0 14px 12px 32px;font-size:13px;line-height:1.5;color:#6A7B90}
.sw{position:relative;width:44px;height:26px;border:0;border-radius:26px;background:#CBD3DF;cursor:pointer;padding:0;transition:background .25s;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.sw[aria-checked=true]{background:#2563EB}.sw[aria-checked=true]::after{transform:translateX(18px)}.sw:disabled{opacity:.55;cursor:default}.sw:focus-visible{outline:2px solid #142033;outline-offset:2px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ac button{border-radius:14px;padding:14px;font:700 15px 'Figtree';cursor:pointer}.ac .ra{grid-column:1/3;border:0;background:#142033;color:#fff}.ac .rj,.ac .sv{border:1.5px solid #D5DCE7;background:#fff;color:#142033}.ac button:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
.bk{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);border:0;background:#142033;color:#fff;border-radius:99px;padding:12px 22px;font:700 14px 'Figtree';cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s .3s}.gone .bk{opacity:1;pointer-events:auto}.bk:focus-visible{outline:3px solid #2563EB;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="ph" id="ph"><div class="pg"><h2>Wild Ember Coffee</h2><i></i><i></i><i></i><div class="im"></div><i></i><i></i><i></i><i></i></div><div class="sc"></div>
<div class="sh" id="sh" role="dialog" aria-label="Cookie preferences"><div class="hn" id="hn" aria-hidden="true"></div><div class="tp"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 4 4 0 0 1-4-4 4 4 0 0 1-5-5zM8.500 10h.01M12 15h.01M15.500 13h.01"/></svg></i><b>Your cookie choices</b></div>
<p>We use cookies to keep the site working and to understand how it is used. You are in control.</p>
<div class="ct" id="ct"></div><div class="ac"><button class="ra" id="ra">Accept all</button><button class="rj" id="rj">Reject optional</button><button class="sv" id="sv">Save choices</button></div></div>
<button class="bk" id="bk">Reopen preferences</button></div>
<script>
const C=[['Strictly necessary','Required for security, sign-in and your cart. Always on.',1,1],['Analytics','Anonymous statistics that help us improve pages and fix errors.',0,1],['Personalisation','Remembers your language and recommends products you may like.',0,0],['Marketing','Used to show relevant offers on other sites. Never sold.',0,0]];
const ct=document.getElementById('ct');
C.forEach((c,i)=>{const r=document.createElement('div');r.className='rw'+(i===1?' op':'');r.innerHTML='<div class="rh"><button class="ex" aria-expanded="'+(i===1)+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'+c[0]+'</button><button class="sw" role="switch" aria-checked="'+!!c[3]+'" aria-label="'+c[0]+'" '+(c[2]?'disabled':'')+'></button></div><div class="dsc"><div><p>'+c[1]+'</p></div></div>';ct.appendChild(r);const e=r.querySelector('.ex');e.onclick=()=>{const o=r.classList.toggle('op');e.setAttribute('aria-expanded',o)};const s=r.querySelector('.sw');s.onclick=()=>s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true')});
const sw=[...ct.querySelectorAll('.sw')];const ph=document.getElementById('ph'),sh=document.getElementById('sh');
function close(){ph.classList.add('gone');sh.style.setProperty('--y','0px')}
document.getElementById('ra').onclick=()=>{sw.forEach(s=>s.setAttribute('aria-checked','true'));close()};document.getElementById('rj').onclick=()=>{sw.forEach((s,i)=>i&&s.setAttribute('aria-checked','false'));close()};document.getElementById('sv').onclick=close;document.getElementById('bk').onclick=()=>ph.classList.remove('gone');
let dr=false,sy=0;sh.addEventListener('pointerdown',e=>{if(e.target.closest('button,.ct'))return;dr=true;sy=e.clientY;sh.classList.add('drag');sh.setPointerCapture(e.pointerId)});sh.addEventListener('pointermove',e=>{if(!dr)return;const d=Math.max(0,e.clientY-sy);sh.style.setProperty('--y',d+'px')});const up=e=>{if(!dr)return;dr=false;sh.classList.remove('drag');const d=parseFloat(getComputedStyle(sh).getPropertyValue('--y'))||0;if(d>110)close();else sh.style.setProperty('--y','0px')};sh.addEventListener('pointerup',up);sh.addEventListener('pointercancel',up);
</script></body></html>
