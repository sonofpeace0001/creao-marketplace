<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Glass Widget Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:24px 14px;font-family:'Inter',-apple-system,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:radial-gradient(500px 400px at 15% 20%,#FF6B9D,transparent 60%),radial-gradient(520px 420px at 85% 15%,#5B8CFF,transparent 60%),radial-gradient(520px 420px at 70% 90%,#FFB86B,transparent 60%),radial-gradient(480px 380px at 10% 90%,#8A5BFF,transparent 60%),#2A1B5C}
.gd{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px}
.w{position:relative;border-radius:30px;padding:18px;background:rgba(255,255,255,.2);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 40px -18px rgba(30,10,80,.5),inset 0 1px 0 rgba(255,255,255,.4);overflow:hidden;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}.w:hover{transform:scale(1.03)}
.w.w2{grid-column:span 2}.w.h2{grid-row:span 2}
.w small{font-size:12.5px;font-weight:600;opacity:.8;letter-spacing:.02em;display:flex;align-items:center;gap:6px}.w .big{font-size:50px;font-weight:600;letter-spacing:-.05em;line-height:1;margin-top:6px}
/* weather */.wx .sun{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3A8,#FFC93C);box-shadow:0 0 30px #FFC93C;animation:sn 4s ease-in-out infinite}@keyframes sn{50%{transform:scale(1.1)}}.wx .cl{position:absolute;right:30px;top:36px;width:50px;height:20px;border-radius:99px;background:rgba(255,255,255,.9)}.wx .cl::before{content:"";position:absolute;left:10px;top:-12px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9)}
.wx p{position:absolute;left:18px;bottom:16px;font-size:14px;font-weight:500;opacity:.9}.wx p b{font-weight:600}
/* music */.mu{display:flex;flex-direction:column;justify-content:space-between}.mu .ar{width:62px;height:62px;border-radius:16px;background:linear-gradient(135deg,#FF5E9C,#8A5BFF);box-shadow:0 10px 20px -8px rgba(0,0,0,.5)}.mu .tt{font-size:16px;font-weight:600;margin-top:10px}.mu .ar2{font-size:13px;opacity:.75}
.mu .pb{height:5px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden}.mu .pb i{display:block;height:100%;width:42%;background:#fff;border-radius:5px}.mu .ct{display:flex;justify-content:center;gap:20px;align-items:center;margin-top:8px}.mu .ct button{border:0;background:none;color:#fff;cursor:pointer;display:grid;place-items:center}.mu .ct button:focus-visible{outline:2px solid #fff;border-radius:6px}
.mu .eq{position:absolute;right:18px;top:20px;display:flex;gap:3px;align-items:flex-end;height:24px}.mu .eq i{width:4px;border-radius:3px;background:#fff;animation:eq 1s ease-in-out infinite}.mu .eq i:nth-child(2){animation-delay:.2s}.mu .eq i:nth-child(3){animation-delay:.4s}.mu .eq i:nth-child(4){animation-delay:.1s}@keyframes eq{0%,100%{height:6px}50%{height:22px}}
/* rings */.rg{display:flex;align-items:center;justify-content:center;height:100%}.rg svg{width:112px;height:112px;transform:rotate(-90deg)}.rg circle{fill:none;stroke-linecap:round;stroke-width:11}.rg .t{opacity:.25}
/* calendar */.cal .d{font-size:56px;font-weight:600;letter-spacing:-.05em;line-height:1;margin-top:4px}.cal ul{list-style:none;margin-top:12px;display:grid;gap:8px}.cal li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500}.cal li i{width:4px;height:30px;border-radius:4px;background:var(--c)}.cal li span{display:block;font-size:12px;opacity:.7;font-weight:400}
/* battery */.bt .bar{height:12px;border-radius:12px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:14px}.bt .bar i{display:block;height:100%;width:78%;background:#7CFFB2;border-radius:12px}.bt .big{font-size:34px}
/* toggles */.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.tg button{border:0;border-radius:20px;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer;transition:all .25s}.tg button[aria-pressed=true]{background:#fff;color:#2A1B5C}.tg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:700px){.gd{grid-template-columns:repeat(2,1fr)}.w.w2{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="gd">
<div class="w wx w2"><small>Lisbon</small><div class="big">24&deg;</div><div class="sun"></div><div class="cl"></div><p><b>Mostly sunny</b><br>High 27&deg; Low 17&deg;</p></div>
<div class="w mu w2 h2"><div class="eq"><i></i><i></i><i></i><i></i></div><div><div class="ar"></div><div class="tt">Golden Hour</div><div class="ar2">Kacey Marlow</div></div><div><div class="pb"><i></i></div><div class="ct"><button aria-label="Previous"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M6 5v14M20 5v14L8 12z"/></svg></button><button aria-label="Pause"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button><button aria-label="Next"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M18 5v14M4 5v14l12-7z"/></svg></button></div></div></div>
<div class="w rgw"><div class="rg"><svg viewBox="0 0 112 112"><circle class="t" cx="56" cy="56" r="46" stroke="#FF5E7E"/><circle cx="56" cy="56" r="46" stroke="#FF5E7E" stroke-dasharray="289" stroke-dashoffset="72"/><circle class="t" cx="56" cy="56" r="33" stroke="#7CFFB2"/><circle cx="56" cy="56" r="33" stroke="#7CFFB2" stroke-dasharray="207" stroke-dashoffset="50"/><circle class="t" cx="56" cy="56" r="20" stroke="#6AD4FF"/><circle cx="56" cy="56" r="20" stroke="#6AD4FF" stroke-dasharray="126" stroke-dashoffset="30"/></svg></div></div>
<div class="w cal h2"><small>Thursday</small><div class="d">14</div><ul><li style="--c:#FF5E7E"><i></i><div>Design review<span>10:00</span></div></li><li style="--c:#7CFFB2"><i></i><div>Lunch with Maya<span>12:30</span></div></li><li style="--c:#6AD4FF"><i></i><div>Ship v3.4<span>16:00</span></div></li></ul></div>
<div class="w bt"><small>Battery</small><div class="big">78%</div><div class="bar"><i></i></div></div>
<div class="w tg w2" style="padding:12px"><button aria-pressed="true" aria-label="Wi-Fi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.500 16.500a5 5 0 0 1 7 0M12 20h.01"/></svg></button><button aria-pressed="true" aria-label="Bluetooth"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg></button><button aria-pressed="false" aria-label="Focus"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/></svg></button><button aria-pressed="false" aria-label="Airplane"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M17.800 19.200 16 11l3.500-3.500a2.100 2.100 0 0 0-3-3L13 8 4.800 6.200 3.400 7.600l6.300 3.400-3.500 3.500-3-.5-1 1 4 2 2 4 1-1-.5-3 3.500-3.500 3.400 6.300z"/></svg></button></div>
</div>
<script>document.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'))</script>
</body></html>
