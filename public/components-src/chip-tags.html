<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tag Input</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3F4F9;color:#171B34;font-family:'Onest',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:480px;background:#fff;border-radius:26px;padding:26px;box-shadow:0 40px 70px -44px rgba(40,40,110,.5),0 0 0 1px rgba(23,27,52,.06)}
label.l{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:10px}label.l span{font-weight:500;color:#8A90B0}
.bx{display:flex;flex-wrap:wrap;gap:8px;border:1.5px solid #DDE0F0;border-radius:16px;padding:10px;cursor:text;transition:all .2s}.bx:focus-within{border-color:#6D5EF5;box-shadow:0 0 0 4px rgba(109,94,245,.14)}
.tg{display:inline-flex;align-items:center;gap:4px;padding:6px 6px 6px 12px;border-radius:99px;font-size:13.5px;font-weight:600;animation:pop .25s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
.tg button{all:unset;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;cursor:pointer;opacity:.6}.tg button:hover{opacity:1;background:rgba(0,0,0,.1)}.tg button:focus-visible{outline:2px solid currentColor}
.bx input{flex:1;min-width:110px;border:0;outline:0;font:500 14.5px 'Onest';padding:6px 4px;color:#171B34}
.sg{margin-top:20px}.sg p{font-size:12.5px;font-weight:600;color:#8A90B0;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.sg div{display:flex;flex-wrap:wrap;gap:8px}.sg button{border:1.5px dashed #CBD0E6;background:#fff;border-radius:99px;padding:6px 13px;font:600 13.5px 'Onest';color:#5B6290;cursor:pointer;transition:all .15s}.sg button:hover{border-style:solid;border-color:#6D5EF5;color:#6D5EF5}.sg button:focus-visible{outline:2px solid #6D5EF5;outline-offset:2px}.sg button[disabled]{display:none}
.ft{display:flex;justify-content:space-between;margin-top:18px;font-size:13px;color:#8A90B0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><label class="l" for="i">Project topics<span id="n"></span></label><div class="bx" id="bx"><input id="i" placeholder="Add a topic and press Enter" autocomplete="off"></div>
<div class="sg"><p>Suggested</p><div id="sg"></div></div><div class="ft"><span>Backspace removes the last tag</span><span>Max 8 tags</span></div></div>
<script>
const P=[['#EDE9FE','#5B21B6'],['#DBEAFE','#1D4ED8'],['#DCFCE7','#15803D'],['#FFEDD5','#C2410C'],['#FCE7F3','#BE185D'],['#CFFAFE','#0E7490']];
let T=['Design systems','Accessibility','Motion'],S=['Typography','Prototyping','Research','Branding','Onboarding'];
const bx=document.getElementById('bx'),i=document.getElementById('i'),sg=document.getElementById('sg');
function col(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return P[h%P.length]}
function draw(){bx.querySelectorAll('.tg').forEach(x=>x.remove());T.forEach((t,k)=>{const c=col(t),e=document.createElement('span');e.className='tg';e.style.cssText='background:'+c[0]+';color:'+c[1];e.innerHTML=t.replace(/</g,'&lt;')+'<button type="button" aria-label="Remove '+t+'"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';e.querySelector('button').onclick=()=>{T.splice(k,1);draw();i.focus()};bx.insertBefore(e,i)});
 sg.innerHTML=S.map(s=>'<button '+(T.some(t=>t.toLowerCase()===s.toLowerCase())?'disabled':'')+'>+ '+s+'</button>').join('');sg.querySelectorAll('button').forEach((b,k)=>b.onclick=()=>add(S[k]));document.getElementById('n').textContent=T.length+' / 8'}
function add(v){v=v.trim();if(!v||T.length>=8||T.some(t=>t.toLowerCase()===v.toLowerCase()))return;T.push(v);i.value='';draw()}
i.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add(i.value)}else if(e.key==='Backspace'&&!i.value&&T.length){T.pop();draw()}};bx.onclick=()=>i.focus();draw();
</script></body></html>
