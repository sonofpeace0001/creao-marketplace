<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Row Actions Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080C0D;color:#E3EEEC;font-family:'Outfit',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.c{position:relative;width:100%;max-width:560px;background:#0E1415;border:1px solid #1B2628;border-radius:24px;padding:8px;box-shadow:0 40px 80px -34px #000;min-height:400px}
.r{display:flex;align-items:center;gap:14px;padding:14px 14px;border-radius:16px;transition:background .2s;position:relative}.r:hover{background:#121B1D}
.ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--b);color:var(--c)}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx span{font:500 12px 'Geist Mono',monospace;color:#5E7A7C}
.kb{width:38px;height:38px;border:0;border-radius:11px;background:none;color:#7D9799;cursor:pointer;display:grid;place-items:center;transition:all .2s}.kb:hover,.kb[aria-expanded=true]{background:#182324;color:#fff}.kb:focus-visible{outline:2px solid #2DD4BF;outline-offset:1px}
.mn{position:absolute;right:14px;top:56px;width:224px;background:#121B1D;border:1px solid #243436;border-radius:18px;padding:6px;box-shadow:0 30px 50px -16px #000;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:all .18s;z-index:4}
.mn.on{opacity:1;transform:none;pointer-events:auto}
.it{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#CFE0DE;font:500 14.5px 'Outfit';padding:10px 11px;border-radius:12px;cursor:pointer;text-align:left}
.it:hover,.it:focus-visible{background:#1B2A2C;color:#fff;outline:0}.it svg{color:#6E8E90;flex:none}.it:hover svg{color:#2DD4BF}
.sp{height:1px;background:#223133;margin:5px 6px}
.dg{color:#FF8E8E}.dg svg{color:#FF8E8E!important}.dg:hover,.dg:focus-visible{background:rgba(255,100,100,.12)}
.cf{display:flex;align-items:center;gap:10px;margin:6px;padding:10px 12px;background:rgba(255,100,100,.1);border:1px solid rgba(255,120,120,.3);border-radius:12px;font-size:13.5px;color:#FFC2C2;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.cf span{flex:1}.cf button{border:0;border-radius:9px;padding:6px 11px;font:600 12.5px 'Outfit';cursor:pointer}.cf .y{background:#FF6B6B;color:#2A0808}.cf .n{background:#243436;color:#CFE0DE}
.to{position:absolute;left:50%;bottom:18px;transform:translate(-50%,16px);background:#2DD4BF;color:#04201C;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;transition:all .25s;pointer-events:none}.to.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="c" id="c"></div><div class="to" id="to" role="status"></div>
<script>
const F=[['Q4 roadmap.fig','Edited 2h ago · 4.2 MB','#1A2D52','#7AA2FF','<path d="M12 2a5 5 0 0 0 0 10 5 5 0 0 0 0 10 5 5 0 1 0 0-10 5 5 0 0 0 0-10ZM12 12h5"/>'],['Brand guidelines.pdf','Edited yesterday · 11 MB','#3B1F2B','#FF8FB1','<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/>'],['Pricing model.xlsx','Edited Mon · 880 KB','#12362B','#4ADE80','<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 4v16"/>'],['Launch assets.zip','Edited Oct 14 · 64 MB','#382B10','#FBBF24','<path d="M4 7l8-4 8 4v10l-8 4-8-4Z"/><path d="m4 7 8 4 8-4M12 11v10"/>']];
const A=[['Open','<path d="M14 3h7v7M21 3l-9 9M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>'],['Rename','<path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4Z"/>'],['Duplicate','<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'],['Share link','<path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1"/>']];
const c=document.getElementById('c'),to=document.getElementById('to');let rows=F.slice(),open=-1,confirm=-1;
const I=p=>'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
function draw(){c.innerHTML=rows.map((f,i)=>'<div class="r"><span class="ic" style="--b:'+f[2]+';--c:'+f[3]+'">'+I(f[4])+'</span><div class="tx"><b>'+f[0]+'</b><span>'+f[1]+'</span></div><button class="kb" data-i="'+i+'" aria-haspopup="menu" aria-expanded="'+(open===i)+'" aria-label="Actions for '+f[0]+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="12" cy="19" r="1.800"/></svg></button>'+
 '<div class="mn'+(open===i?' on':'')+'" role="menu">'+(confirm===i?'<div class="cf"><span>Delete this file?</span><button class="y" data-y="'+i+'">Delete</button><button class="n" data-n="1">Cancel</button></div>':A.map(a=>'<button class="it" role="menuitem" data-a="'+a[0]+'">'+I(a[1])+a[0]+'</button>').join('')+'<div class="sp"></div><button class="it dg" role="menuitem" data-d="'+i+'">'+I('<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>')+'Delete</button>')+'</div></div>').join('')}
function toast(t){to.textContent=t;to.classList.add('on');setTimeout(()=>to.classList.remove('on'),1400)}
c.addEventListener('click',e=>{e.stopPropagation();const k=e.target.closest('.kb'),a=e.target.closest('[data-a]'),d=e.target.closest('[data-d]'),y=e.target.closest('[data-y]'),n=e.target.closest('[data-n]');
 if(k){const i=+k.dataset.i;open=open===i?-1:i;confirm=-1;draw();return}
 if(a){toast(a.dataset.a+' — done');open=-1;draw();return}
 if(d){confirm=+d.dataset.d;draw();return}
 if(y){rows.splice(+y.dataset.y,1);open=-1;confirm=-1;draw();toast('File deleted');return}
 if(n){confirm=-1;open=-1;draw()}});
document.addEventListener('click',()=>{if(open>-1){open=-1;confirm=-1;draw()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&open>-1){open=-1;confirm=-1;draw()}});
open=1;draw();
</script></body></html>
