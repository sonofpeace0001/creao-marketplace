<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Logo Orbit Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(600px 460px at 70% 50%,#1D2B66,transparent 70%),#080B1A;color:#EEF1FF;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{width:100%;max-width:940px;display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:center}
.tx small{font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8EA2FF}.tx h1{font-size:clamp(32px,4.8vw,54px);font-weight:800;letter-spacing:-.06em;line-height:1;margin:12px 0 14px}.tx p{font-size:16.5px;line-height:1.6;color:#8D9ACC;max-width:32ch}
.tx .st{display:flex;gap:26px;margin-top:26px}.tx .st b{display:block;font-size:30px;font-weight:800;letter-spacing:-.05em}.tx .st span{font-size:13px;color:#6C7AB8}
.or{position:relative;width:100%;max-width:520px;aspect-ratio:1;justify-self:center}
.rn{position:absolute;left:50%;top:50%;border:1px dashed rgba(142,162,255,.22);border-radius:50%;transform:translate(-50%,-50%)}.r1{width:38%;height:38%}.r2{width:68%;height:68%}.r3{width:98%;height:98%}
.ct{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:30%;background:linear-gradient(135deg,#6366F1,#A855F7);display:grid;place-items:center;box-shadow:0 0 70px -6px #818CF8;z-index:3}.ct svg{width:46%;height:46%;color:#fff}
.ct::before{content:"";position:absolute;inset:-12%;border-radius:36%;border:1px solid rgba(165,180,252,.4);animation:pu 3s ease-out infinite}@keyframes pu{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.ro{position:absolute;left:50%;top:50%;width:0;height:0;animation:ro var(--d) linear infinite;animation-delay:var(--dl,0s)}.ro.rv{animation-direction:reverse}@keyframes ro{to{transform:rotate(360deg)}}
.lg{position:absolute;left:var(--r);top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:28%;background:#131A3D;border:1px solid #2A3668;display:grid;place-items:center;color:var(--c);box-shadow:0 10px 24px -10px #000,0 0 26px -10px var(--c);animation:ro var(--d) linear infinite reverse;animation-delay:var(--dl,0s);transition:transform .3s}.ro.rv .lg{animation-direction:normal}
.lg:hover{transform:scale(1.25);z-index:5}.lg svg{width:54%;height:54%}
.lg .tp{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:#fff;color:#12163A;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .2s}.lg:hover .tp{opacity:1;transform:translateX(-50%)}
.or:hover .ro,.or:hover .lg{animation-play-state:paused}
@media(max-width:760px){.c{grid-template-columns:1fr;text-align:center}.tx p{margin-inline:auto}.tx .st{justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="c"><div class="tx"><small>Ecosystem</small><h1>Everyone orbits the same platform</h1><p>Hundreds of teams and tools plug into our core. Hover the orbit to pause and meet them.</p><div class="st"><div><b>480+</b><span>Integrations</span></div><div><b>2.4k</b><span>Companies</span></div></div></div>
<div class="or" id="or"><span class="rn r1"></span><span class="rn r2"></span><span class="rn r3"></span><div class="ct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.900 5.100L19 10l-5.100 1.900L12 17l-1.900-5.100L5 10l5.100-1.900zM19 16l.8 2.200L22 19l-2.200.8L19 22l-.8-2.200L16 19l2.200-.8z"/></svg></div></div></div>
<script>
const ICO={circle:'<circle cx="12" cy="12" r="8" fill="currentColor"/>',tri:'<path d="M12 4 21 19H3z" fill="currentColor"/>',hex:'<path d="M12 2 21 7v10l-9 5-9-5V7z" fill="currentColor"/>',sq:'<rect x="4" y="4" width="16" height="16" rx="4" fill="currentColor"/>',wave:'<path d="M2 14c3-6 5-6 8 0s5 6 8 0 3-4 4-4" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/>',diamond:'<path d="M12 2 22 12 12 22 2 12z" fill="currentColor"/>',cloud:'<path d="M7 18a5 5 0 1 1 1-9.900A6 6 0 0 1 19.500 11 3.500 3.500 0 0 1 18 18z" fill="currentColor"/>',leaf:'<path d="M20 4C9 4 4 9 4 16c0 2 .5 3 1 4 1-4 4-7 9-9-5 3-7 6-8 10 8 1 14-5 14-17z" fill="currentColor"/>',ring:'<circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="4"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/>'};
const R=[[.19,56,46,'18s',0,[['Northwind','circle','#60A5FA'],['Fjord','tri','#22D3EE'],['Helios','bolt','#FBBF24']]],[.34,50,40,'32s',1,[['Pinecone','hex','#4ADE80'],['Atlas','sq','#F87171'],['Marlow','wave','#A78BFA'],['Lumen','diamond','#FACC15'],['Orbit','ring','#F472B6']]],[.49,44,36,'48s',0,[['Vertex','diamond','#2DD4BF'],['Nimbus','cloud','#818CF8'],['Quill','leaf','#34D399'],['Kestrel','tri','#FB923C'],['Fable','circle','#E879F9'],['Zephyr','wave','#38BDF8'],['Tidal','hex','#5EEAD4']]]];
const or=document.getElementById('or');let W=520;function build(){W=or.getBoundingClientRect().width||520;document.querySelectorAll('.ro').forEach(e=>e.remove());R.forEach((r,ri)=>{const rad=W*r[0],n=r[5].length;r[5].forEach((l,i)=>{const o=document.createElement('div');o.className='ro'+(r[4]?' rv':'');o.style.cssText='--d:'+r[3]+';animation-delay:-'+(parseFloat(r[3])*i/n)+'s;';const g=document.createElement('div');g.className='lg';g.style.cssText='--r:'+rad+'px;--s:'+(W*.095)+'px;--c:'+l[2]+';--d:'+r[3]+';animation-delay:-'+(parseFloat(r[3])*i/n)+'s';g.innerHTML='<svg viewBox="0 0 24 24">'+ICO[l[1]]+'</svg><span class="tp">'+l[0]+'</span>';o.appendChild(g);or.appendChild(o)})})}
build();addEventListener('resize',build);
</script></body></html>
