<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Rewrite Textarea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0C0D12;color:#ECEEF6;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{position:relative;width:100%;max-width:620px;border-radius:26px;padding:2px;background:conic-gradient(from var(--a,0deg),#1D1F2B 0 55%,#8B5CF6 75%,#22D3EE 88%,#1D1F2B);animation:spin 5s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}
.in{background:#12141C;border-radius:24px;padding:22px}
.tp{display:flex;align-items:center;gap:8px;margin-bottom:14px}.tp i{width:8px;height:8px;border-radius:50%;background:#8B5CF6;box-shadow:0 0 12px #8B5CF6}.tp span{font:italic 22px 'Instrument Serif',serif}.tp em{margin-left:auto;font:500 12px 'Geist';font-style:normal;color:#6E7390}
.bx{position:relative;border-radius:16px;background:#0D0F16;border:1px solid #232634;min-height:150px;overflow:hidden}
.ta{display:block;width:100%;min-height:150px;border:0;outline:0;resize:none;background:none;color:#E4E6F2;font:400 16.5px/1.65 'Geist';padding:16px 18px}
.sw{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(139,92,246,.35) 50%,transparent 70%);transform:translateX(-100%);pointer-events:none}.bx.run .sw{animation:sw .9s ease-in-out infinite}@keyframes sw{to{transform:translateX(100%)}}
.ta.ch{color:#E4E6F2}.ta mark,.out mark{background:rgba(139,92,246,.28);color:#fff;border-radius:4px;padding:0 2px}
.out{display:none;font:400 16.5px/1.65 'Geist';padding:16px 18px;white-space:pre-wrap}.bx.res .out{display:block}.bx.res .ta{display:none}
.tn{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tn button{border:1px solid #2A2D3D;background:#161826;color:#B2B7CE;border-radius:99px;padding:7px 14px;font:500 13.5px 'Geist';cursor:pointer;transition:all .2s}.tn button:hover{border-color:#5B5F7D;color:#fff}.tn button[aria-pressed=true]{background:#8B5CF6;border-color:#8B5CF6;color:#fff}.tn button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ac{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.ac .l{display:flex;gap:8px}.ac button{border-radius:12px;padding:10px 18px;font:600 14px 'Geist';cursor:pointer}.ac .g{border:1px solid #2A2D3D;background:none;color:#B2B7CE}.ac .g:disabled{opacity:.4;cursor:default}.ac .p{border:0;background:linear-gradient(135deg,#8B5CF6,#6366F1);color:#fff;display:flex;align-items:center;gap:8px;box-shadow:0 12px 24px -10px #8B5CF6}.ac button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.c,.bx.run .sw{animation:none}}
</style></head><body>
<div class="c"><div class="in"><div class="tp"><i></i><span>Rewrite with AI</span><em id="wc"></em></div>
<div class="bx" id="bx"><textarea class="ta" id="ta" aria-label="Your text"></textarea><div class="out" id="out"></div><div class="sw"></div></div>
<div class="tn" id="tn" role="group" aria-label="Tone"></div>
<div class="ac"><div class="l"><button class="g" id="un" disabled>Undo</button></div><button class="p" id="rw"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.900 5.100L19 10l-5.100 1.900L12 17l-1.900-5.100L5 10l5.100-1.900zM19 16l.8 2.200L22 19l-2.200.8L19 22l-.8-2.200L16 19l2.200-.8z"/></svg>Rewrite</button></div></div></div>
<script>
const orig="Hey team, just wanted to let you know that the launch is probably going to slip by a few days because the payments integration is taking longer than we thought it would.";
const R={Friendly:"Hi team! A quick heads up: the launch may slip by a few days. The payments integration is taking a little longer than we hoped, but we are on it.",Formal:"Dear team, please be advised that the launch is expected to be delayed by several days owing to additional time required to complete the payments integration.",Concise:"Launch slips a few days. Payments integration is the blocker.",Bold:"The launch moves a few days. Payments integration needs more time, and we will get it right rather than rush it."};
const ta=document.getElementById('ta'),bx=document.getElementById('bx'),out=document.getElementById('out'),tn=document.getElementById('tn');let tone='Friendly',prev=null;
ta.value=orig;const wc=()=>document.getElementById('wc').textContent=(ta.value.trim().split(/\s+/).filter(Boolean).length)+' words';wc();ta.oninput=wc;
Object.keys(R).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.setAttribute('aria-pressed',k===tone);b.onclick=()=>{tone=k;tn.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};tn.appendChild(b)});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
document.getElementById('rw').onclick=()=>{const src=ta.value;prev=src;bx.classList.add('run');document.getElementById('un').disabled=true;setTimeout(()=>{bx.classList.remove('run');const t=R[tone],ow=new Set(src.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/)),w=t.split(' ');out.innerHTML='';bx.classList.add('res');let i=0;const iv=setInterval(()=>{if(i>=w.length){clearInterval(iv);ta.value=t;bx.classList.remove('res');wc();document.getElementById('un').disabled=false;return}const x=w[i++],n=!ow.has(x.toLowerCase().replace(/[^a-z]/g,''));out.innerHTML+=(n?'<mark>'+esc(x)+'</mark>':esc(x))+' '},45)},900)};
document.getElementById('un').onclick=()=>{if(prev!=null){ta.value=prev;wc();document.getElementById('un').disabled=true}};
</script></body></html>
