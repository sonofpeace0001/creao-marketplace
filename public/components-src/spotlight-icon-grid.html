<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spotlight Icon Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07080D;color:#EDEEF7;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.w{width:100%;max-width:760px;display:grid;gap:22px;justify-items:center}
.hd{text-align:center}.hd h1{font-size:clamp(24px,4.4vw,38px);font-weight:800;letter-spacing:-.05em}.hd p{color:#767A96;font-size:14px;margin-top:8px}
.g{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:100%;padding:14px;border-radius:28px;background:#0C0D15;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);cursor:crosshair;overflow:hidden}
.g::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(129,140,248,.16),transparent 65%);pointer-events:none}
.i{--k:0;position:relative;aspect-ratio:1;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) calc(var(--k)*16%),#10111B);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) calc(var(--k)*50%),rgba(255,255,255,.05));transform:scale(calc(1 + var(--k)*.1));transition:transform .12s linear}
.i svg{width:46%;height:46%;overflow:visible}.i svg *{fill:none;stroke:color-mix(in srgb,var(--c) calc(var(--k)*100%),#2B2E44);stroke-width:1.800;stroke-linecap:round;stroke-linejoin:round;transition:stroke .12s linear}
.i::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 calc(var(--k)*26px) color-mix(in srgb,var(--c) calc(var(--k)*70%),transparent);pointer-events:none}
.ft{font:500 12px 'Geist Mono';letter-spacing:.14em;text-transform:uppercase;color:#4D5170}
@media(max-width:520px){.g{grid-template-columns:repeat(6,1fr);gap:6px;padding:10px}.i:nth-child(n+25){display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Find the icon in the dark</h1><p>Every glyph sleeps until the light reaches it, then wakes in its own colour.</p></div><div class="g" id="g"></div><div class="ft">32 icons, 8 colours</div></div>
<script>
const P=['<path d="M3.500 11 12 4l8.500 7M5.500 10v10h13V10"/>','<path d="M6 9.500a6 6 0 0 1 12 0c0 5.500 2 7 2 7H4s2-1.500 2-7ZM10 20a2 2 0 0 0 4 0"/>','<rect x="3" y="5.500" width="18" height="13" rx="2.500"/><path d="m3.500 7.500 8.500 6 8.500-6"/>','<path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 7.300 4.300 4.300 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10Z"/>','<path d="M4 8h3l1.500-2.500h7L17 8h3v11H4Z"/><circle cx="12" cy="13" r="3.500"/>','<path d="M12 21s-6.500-5.800-6.500-11a6.500 6.500 0 0 1 13 0c0 5.200-6.500 11-6.500 11Z"/><circle cx="12" cy="10" r="2.400"/>','<rect x="5" y="10.500" width="14" height="10" rx="2.500"/><path d="M8 10.500V8a4 4 0 0 1 8 0v2.500"/>','<path d="m12 3.500 2.600 5.400 5.900.8-4.300 4.200 1 5.900-5.200-2.800-5.200 2.800 1-5.900-4.300-4.200 5.900-.8Z"/>','<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>','<path d="M4 5h16v11H9l-5 4Z"/>','<rect x="4" y="5" width="16" height="15" rx="2.500"/><path d="M8 3v4M16 3v4M4 10h16"/>','<rect x="3" y="6.500" width="18" height="13" rx="3"/><path d="M15 12h6v4h-6a2 2 0 0 1 0-4Z"/>','<path d="M12 3 4.500 6v5.500c0 4.700 3.200 8 7.500 9.500 4.300-1.500 7.500-4.800 7.500-9.500V6Z"/><path d="m8.800 12 2.400 2.400 4-4.600"/>','<path d="M12 3c3 2 5 5 5 9l-2 2.500H9L7 12c0-4 2-7 5-9ZM9 15l-2 3.500 3-1M15 15l2 3.500-3-1"/>','<circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/>','<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.500 4.500 4.500 0 0 1 17.500 18Z"/>'];
const C=['#818CF8','#F472B6','#34D399','#FBBF24','#22D3EE','#FB923C','#A78BFA','#F87171'];
const g=document.getElementById('g');for(let i=0;i<32;i++){const d=document.createElement('div');d.className='i';d.style.setProperty('--c',C[(i+Math.floor(i/8))%8]);d.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+P[i%16]+'</svg>';g.appendChild(d)}
const cells=[...g.children];let real=0;
function aim(x,y){const gr=g.getBoundingClientRect();g.style.setProperty('--mx',(x-gr.left)+'px');g.style.setProperty('--my',(y-gr.top)+'px');const R=Math.max(150,gr.width*.2);cells.forEach(c=>{const r=c.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2)),k=Math.max(0,1-d/R);c.style.setProperty('--k',(k*k*(3-2*k)).toFixed(3))})}
addEventListener('pointermove',e=>{real=performance.now();aim(e.clientX,e.clientY)});
const seed=()=>{const r=g.getBoundingClientRect();aim(r.left+r.width*.6,r.top+r.height*.45)};seed();document.fonts.ready.then(seed);
/* Idle demo: an invisible light wanders over the grid on a Lissajous path, waking whichever icons it passes, until a real pointer appears. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)(function loop(n){if(n-real>2200&&n>3000){const r=g.getBoundingClientRect(),t=n/1000;aim(r.left+r.width*(.5+.46*Math.sin(t*.8)),r.top+r.height*(.5+.42*Math.sin(t*1.3+1)))}requestAnimationFrame(loop)})(0);
</script></body></html>
