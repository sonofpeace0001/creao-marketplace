<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Undo Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2F1EC;color:#1D1B16;font-family:'Public Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;display:grid;gap:12px}
.al{position:relative;display:flex;align-items:flex-start;gap:14px;border-radius:18px;padding:16px 16px 16px 18px;overflow:hidden;background:var(--b);border:1px solid var(--l);color:var(--t);transition:all .45s cubic-bezier(.3,1,.4,1);max-height:160px}
.al.out{opacity:0;transform:translateX(30px);max-height:0;padding-top:0;padding-bottom:0;margin-top:-12px;border-width:0}
.al .ic{flex:none;width:34px;height:34px;border-radius:11px;background:var(--i);color:#fff;display:grid;place-items:center}
.al .tx{flex:1;min-width:0}.al b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}.al span{font-size:14px;opacity:.85;line-height:1.5;display:block;margin-top:2px}
.al .ac{display:flex;gap:6px;align-items:center;flex:none}.al .ac button{border:0;background:none;color:inherit;font:700 13.5px 'Public Sans';padding:8px 11px;border-radius:9px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.al .ac button:hover{background:rgba(0,0,0,.07)}.al .ac button:focus-visible{outline:2px solid currentColor}
.al .x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;text-decoration:none!important;opacity:.7}.al .x:hover{opacity:1}
.al .pb{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--i);transform-origin:left;animation:pb var(--d) linear forwards}@keyframes pb{to{transform:scaleX(0)}}.al:hover .pb{animation-play-state:paused}
.sx{--b:#EAF8EF;--l:#C6EBD3;--t:#0F4D2A;--i:#16A34A}.wr{--b:#FFF6E0;--l:#F6DEA5;--t:#6B4500;--i:#D98B00}.er{--b:#FEECEC;--l:#F8C6C6;--t:#7A1717;--i:#DC2626}.nf{--b:#E9F1FF;--l:#C4D7FA;--t:#12408C;--i:#2563EB}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.bt button{border:1.5px solid #1D1B16;background:#fff;color:#1D1B16;border-radius:99px;padding:8px 15px;font:600 13px 'Public Sans';cursor:pointer;transition:all .15s}.bt button:hover{background:#1D1B16;color:#fff}.bt button:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.al .pb{animation:none}}
</style></head><body>
<div class="c"><div id="ls" role="region" aria-label="Alerts" style="display:grid;gap:12px"></div><div class="bt" id="bt"></div></div>
<script>
const I={sx:'<path d="m5 12.500 4.500 4.500L19 7"/>',wr:'<path d="M12 9v4M12 17h.01M10.300 3.900 1.800 18a2 2 0 0 0 1.700 3h17a2 2 0 0 0 1.700-3L13.700 3.900a2 2 0 0 0-3.400 0Z"/>',er:'<path d="M12 8v5M12 16.500h.01"/><circle cx="12" cy="12" r="9"/>',nf:'<path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/>'};
const D={sx:['Project archived','Northwind redesign moved to the archive.','Undo'],wr:['Storage almost full','You have used 94% of your 10 GB plan.','Upgrade'],er:['Payment failed','Your card ending 4242 was declined.','Retry'],nf:['Maintenance tonight','Short downtime expected at 02:00 UTC.','Details']};
const ls=document.getElementById('ls');
function add(k,delay){const a=D[k],e=document.createElement('div');e.className='al '+k;e.setAttribute('role','alert');e.style.setProperty('--d',(delay||8)+'s');
 e.innerHTML='<div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round">'+I[k]+'</svg></div><div class="tx"><b>'+a[0]+'</b><span>'+a[1]+'</span></div><div class="ac"><button class="a1">'+a[2]+'</button><button class="x" aria-label="Dismiss"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><i class="pb"></i>';
 const out=()=>{e.classList.add('out');setTimeout(()=>e.remove(),450)};e.querySelector('.x').onclick=out;e.querySelector('.a1').onclick=out;e.querySelector('.pb').addEventListener('animationend',out);ls.prepend(e)}
['sx','wr','er','nf'].forEach(k=>add(k,k==='er'?18:k==='wr'?12:15));
const bt=document.getElementById('bt');[['sx','Archive item'],['wr','Storage warning'],['er','Payment error'],['nf','Notice']].forEach(b=>{const e=document.createElement('button');e.textContent=b[1];e.onclick=()=>add(b[0]);bt.appendChild(e)});
</script></body></html>
