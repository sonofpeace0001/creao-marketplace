<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Email Inbox Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E3E7F2;color:#12172E;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ap{position:relative;width:100%;max-width:720px;height:500px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 70px -44px rgba(18,23,46,.55),0 0 0 1px rgba(18,23,46,.07)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #ECEFF8}.bar b{font-size:16px;font-weight:800;letter-spacing:-.03em}.bar span{margin-left:auto;font-size:12.5px;color:#8991B3}
.ls{padding:6px 8px}.it{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;padding:12px;border-radius:14px;cursor:pointer;transition:background .15s}.it:hover,.it.hv{background:#F4F6FC}.it:focus-visible{outline:2px solid #5B5BF6}
.it i{width:40px;height:40px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font:800 13px 'Manrope';font-style:normal}.it b{display:block;font-size:14.5px;font-weight:700}.it .sj{font-size:13.5px;color:#12172E;font-weight:600;margin-top:1px}.it .pv{display:block;font-size:13px;color:#8991B3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}.it time{font-size:12px;color:#9AA2C0;align-self:start;margin-top:4px}.it.un b,.it.un .sj{font-weight:800}.it.un::before{content:"";position:absolute;left:10px;width:7px;height:7px;border-radius:50%;background:#5B5BF6;margin-top:0;transform:translateX(-14px)}
.it{position:relative}
.rd{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transform:translateY(24px) scale(.97);transition:all .45s cubic-bezier(.3,1.1,.4,1);display:flex;flex-direction:column}.rd.on{opacity:1;pointer-events:auto;transform:none}
.rd .tp{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #ECEFF8}.rd .tp button{display:flex;align-items:center;gap:6px;border:0;background:#F1F3FB;border-radius:10px;padding:8px 12px;font:700 13px 'Manrope';color:#4A5280;cursor:pointer}.rd .tp button:focus-visible{outline:2px solid #5B5BF6}
.rd .sc{flex:1;overflow:hidden;padding:20px 26px;background:#F4F6FC}
.ml{max-width:520px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 40px -22px rgba(18,23,46,.4)}
.ml .hd{padding:26px 28px;background:linear-gradient(135deg,#5B5BF6,#9B6BFF);color:#fff}.ml .hd small{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.85}.ml .hd h2{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:6px}
.ml .by{padding:20px 28px 6px;font-size:14.5px;line-height:1.6;color:#4A5280}
.ml ul{list-style:none;padding:8px 28px 4px}.ml li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0F2FA;font-size:14.5px;font-weight:600}.ml li i{width:24px;height:24px;border-radius:50%;border:2px solid #CDD2EA;display:grid;place-items:center;flex:none;transition:all .3s}.ml li.d i{background:#22C55E;border-color:#22C55E;color:#fff}.ml li.d{color:#8991B3;text-decoration:line-through}.ml li i svg{opacity:0;transform:scale(.3);transition:all .3s cubic-bezier(.3,1.8,.5,1)}.ml li.d i svg{opacity:1;transform:none}
.ml .cta{display:block;margin:18px 28px 26px;text-align:center;background:#12172E;color:#fff;border-radius:12px;padding:14px;font:800 14.5px 'Manrope';text-decoration:none}
</style></head><body>
<div class="ap" id="ap"><div class="bar"><b>Inbox</b><span>3 unread</span></div>
<div class="ls" id="ls"></div>
<div class="rd" id="rd"><div class="tp"><button id="bk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>Inbox</button></div><div class="sc"><div class="ml"><div class="hd"><small>Welcome aboard</small><h2>You are in, Ada.</h2></div><div class="by">Your workspace is ready. Here are three quick steps to get the most out of Launchpad in your first week.</div><ul id="ck"><li class="d"><i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i>Create your account</li><li><i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i>Invite two teammates</li><li><i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i>Publish your first page</li></ul><a class="cta" href="#" onclick="return false">Open my workspace</a></div></div></div></div>
<script>
const M=[['Launchpad','Welcome to Launchpad, Ada','Your workspace is ready. Three quick steps to get started...','9:41 AM','#5B5BF6,#9B6BFF',1],['Maya Rowe','Re: Homepage copy review','Looks good to me, shipping it this afternoon unless anyone...','8:12 AM','#F59E0B,#EF4444',1],['Stripe','Your payout is on the way','A payout of $1,284.00 is scheduled to arrive on Nov 12...','Yesterday','#0EA5E9,#6366F1',1],['Linear','Weekly summary: 14 issues closed','Your team closed 14 issues this week, 3 more than last week...','Mon','#10B981,#0EA5E9',0]];
const ls=document.getElementById('ls'),rd=document.getElementById('rd');
M.forEach((m,i)=>{const b=document.createElement('button');b.className='it'+(m[5]?' un':'')+(i===0?' hv':'');b.innerHTML='<i style="--g:linear-gradient(135deg,'+m[4]+')">'+m[0].slice(0,2).toUpperCase()+'</i><div><b>'+m[0]+'</b><div class="sj">'+m[1]+'</div><span class="pv">'+m[2]+'</span></div><time>'+m[3]+'</time>';b.onclick=()=>{if(i===0){rd.classList.add('on');setTimeout(()=>document.querySelectorAll('#ck li')[1].classList.add('d'),500)}};ls.appendChild(b)});
document.getElementById('bk').onclick=()=>{rd.classList.remove('on');document.querySelectorAll('#ck li')[1].classList.remove('d')};
</script></body></html>
