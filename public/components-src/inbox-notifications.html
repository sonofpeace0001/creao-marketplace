<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inbox Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090D;color:#E8EAF2;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:520px;background:#0F1218;border:1px solid #1D2230;border-radius:26px;overflow:hidden;box-shadow:0 40px 80px -34px #000}
.hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #1A1F2C}.hd h1{font-size:18px;font-weight:700;letter-spacing:-.025em}.hd h1 i{font-style:normal;font-size:12px;font-weight:700;background:#6C7BFF;color:#fff;padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:2px}
.hd button{border:0;background:none;color:#8A93B2;font:600 13px 'DM Sans';cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:9px}.hd button:hover{background:#171B26;color:#fff}.hd button:focus-visible{outline:2px solid #6C7BFF}
.gp{padding:14px 22px 6px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#586080;text-transform:uppercase}
.n{position:relative;display:flex;gap:14px;align-items:flex-start;padding:14px 22px;cursor:pointer;transition:background .2s}.n:hover{background:#13171F}
.n.u{background:linear-gradient(90deg,rgba(108,123,255,.1),transparent 70%)}.n.u::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#6C7BFF}
.av{position:relative;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#0F1218;background:var(--c)}
.av .bd{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#0F1218;display:grid;place-items:center;color:var(--k)}
.tx{flex:1;min-width:0}.tx p{font-size:14.5px;line-height:1.45;color:#B6BCD2}.tx p b{color:#fff;font-weight:600}
.tx time{display:block;margin-top:4px;font-size:12.5px;color:#586080}
.act{display:flex;gap:8px;margin-top:10px}.act button{border:1px solid #2A3042;background:#151A25;color:#CFD5EA;font:600 13px 'DM Sans';padding:7px 14px;border-radius:10px;cursor:pointer}.act .p{background:#E8EAF2;color:#0F1218;border-color:#E8EAF2}.act button:hover{border-color:#6C7BFF}.act button:focus-visible{outline:2px solid #6C7BFF;outline-offset:2px}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#6C7BFF;margin-top:6px;transition:transform .25s}.n:not(.u) .dot{transform:scale(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Inbox<i id="ct"></i></h1><button id="mk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.500 4.500 4.500L16 8M10 17l.5.5L20 8"/></svg>Mark all read</button></div><div id="l"></div></div>
<script>
const N=[['New',[['Sofia Lund','#C4B5FD','commented on <b>Brand refresh v3</b> — “Can we try the warmer palette?”','2 min ago',1,'M21 12a8 8 0 0 1-11.500 7.200L3 21l1.800-5.500A8 8 0 1 1 21 12Z','#C4B5FD'],['Marcus Reid','#86EFAC','invited you to review <b>Checkout redesign</b>','24 min ago',1,'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z','#86EFAC',1]]],['Earlier',[['Deploy bot','#FDE68A','<b>web@4f2a9c1</b> was deployed to production','3 hr ago',0,'M12 19V5M5 12l7-7 7 7','#FDE68A'],['Aisha Khan','#FBA8C8','joined your workspace <b>Northwind Studio</b>','Yesterday',0,'M12 5v14M5 12h14','#FBA8C8']]]];
const flat=[];N.forEach(g=>g[1].forEach(n=>flat.push(n)));const l=document.getElementById('l');
function draw(){let h='';let k=0;N.forEach(g=>{h+='<div class="gp">'+g[0]+'</div>';g[1].forEach(n=>{h+='<div class="n'+(n[4]?' u':'')+'" data-k="'+k+'"><span class="av" style="--c:'+n[1]+'">'+n[0].split(' ').map(w=>w[0]).join('')+'<span class="bd" style="--k:'+n[6]+'"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="'+n[5]+'"/></svg></span></span><div class="tx"><p><b>'+n[0]+'</b> '+n[2]+'</p><time>'+n[3]+'</time>'+(n[7]?'<div class="act"><button class="p">Review</button><button>Decline</button></div>':'')+'</div><span class="dot"></span></div>';k++})});l.innerHTML=h;
 const u=flat.filter(n=>n[4]).length;document.getElementById('ct').textContent=u+' new';document.getElementById('ct').style.display=u?'':'none'}
l.addEventListener('click',e=>{const n=e.target.closest('.n');if(n){flat[+n.dataset.k][4]=0;draw()}});document.getElementById('mk').onclick=()=>{flat.forEach(n=>n[4]=0);draw()};draw();
</script></body></html>
