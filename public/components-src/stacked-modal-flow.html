<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stacked Modal Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7E9F4;color:#161A3C;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:700px;height:520px;border-radius:28px;background:#F7F8FD;overflow:hidden;box-shadow:0 40px 60px -34px rgba(22,26,60,.5),inset 0 0 0 1px rgba(22,26,60,.07)}
.pg{position:absolute;inset:0;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}.pg .hd{grid-column:1/4;height:30px;width:40%;border-radius:8px;background:#DDE0F0}.pg i{height:120px;border-radius:16px;background:#EBEEF8}
.bk{position:absolute;inset:0;background:rgba(18,20,50,.5);backdrop-filter:blur(3px);opacity:0;transition:opacity .5s}.bk.on{opacity:1}
.m{position:absolute;left:50%;top:50%;width:390px;margin:-170px 0 0 -195px;background:#fff;border-radius:26px;padding:24px;box-shadow:0 30px 60px -16px rgba(0,0,0,.45);transition:transform .7s cubic-bezier(.3,1.2,.4,1),opacity .5s,filter .5s;transform:translateY(60px) scale(.92);opacity:0;pointer-events:none}
.m.f{transform:none;opacity:1;pointer-events:auto}.m.b1{transform:translateY(-26px) scale(.94);opacity:.8;filter:brightness(.88)}.m.b2{transform:translateY(-52px) scale(.88);opacity:.55;filter:brightness(.76)}.m.x{transform:translateY(40px) scale(.94);opacity:0}
.m small{font-size:11.500px;font-weight:800;letter-spacing:.14em;color:#6D4DFF}.m h2{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:5px 0 4px}.m p{font-size:14px;color:#6A70A0;margin-bottom:16px}
.ch{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-radius:14px;background:#F4F5FC;box-shadow:inset 0 0 0 2px transparent;min-height:56px;transition:box-shadow .3s}.ch.fc{box-shadow:inset 0 0 0 2px #6D4DFF;background:#fff}.ch span{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.500px #DDE0F2;font-size:13px;font-weight:700;animation:in .4s cubic-bezier(.3,2,.5,1)}.ch span u{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:800 10px 'Manrope';color:#fff;text-decoration:none}@keyframes in{from{opacity:0;transform:scale(.6)}}
.rd{display:grid;gap:8px}.rd div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 2px #E8EAF6;font-weight:700;font-size:14.500px;transition:all .3s cubic-bezier(.3,1.6,.5,1)}.rd div span{margin-left:auto;font-size:12px;color:#8A90B8;font-weight:600}.rd div i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px #C7CBE6;transition:all .3s}.rd div.on{box-shadow:inset 0 0 0 2.500px #6D4DFF;background:#F3F0FF;transform:scale(1.02)}.rd div.on i{background:#6D4DFF;box-shadow:inset 0 0 0 4px #F3F0FF,0 0 0 2px #6D4DFF}
.ok{text-align:center}.ok .ck{width:68px;height:68px;border-radius:50%;background:#16A34A;display:grid;place-items:center;margin:4px auto 12px;transform:scale(0);transition:transform .6s cubic-bezier(.3,2,.5,1) .3s}.m.f .ok .ck{transform:scale(1)}.ok svg{width:32px;height:32px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.ok .av{display:flex;justify-content:center;margin:10px 0 4px}.ok .av u{width:34px;height:34px;border-radius:50%;margin-left:-8px;background:var(--c);display:grid;place-items:center;font:800 13px 'Manrope';color:#fff;text-decoration:none;box-shadow:0 0 0 3px #fff}.ok .av u:first-child{margin-left:0}
.bt{display:flex;gap:9px;margin-top:18px}.bt button{flex:1;border:0;border-radius:14px;padding:13px;font:800 14.500px 'Manrope';cursor:pointer;transition:transform .15s}.bt .p{background:#161A3C;color:#fff}.bt .s{background:#F0F1F9;color:#44497A;flex:.6}.bt .pr{transform:scale(.95)}
.dots{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;z-index:5}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .4s}.dots i.on{background:#fff;width:22px;border-radius:5px}
@media(max-width:480px){.m{width:92%;margin-left:-46%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="st" id="st"><div class="pg"><div class="hd"></div><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="bk" id="bk"></div>
<div class="m" id="m0"><small>STEP 1 OF 3</small><h2>Invite your team</h2><p>Add the people who will work in this space.</p><div class="ch fc" id="ch"></div><div class="bt"><button class="s">Skip</button><button class="p" id="b0">Continue</button></div></div>
<div class="m" id="m1"><small>STEP 2 OF 3</small><h2>Choose a role</h2><p>You can change this later in settings.</p><div class="rd" id="rd"><div><i></i>Admin<span>Full access</span></div><div class="on"><i></i>Editor<span>Create and edit</span></div><div><i></i>Viewer<span>Read only</span></div></div><div class="bt"><button class="s">Back</button><button class="p" id="b1">Send invites</button></div></div>
<div class="m" id="m2"><div class="ok"><div class="ck"><svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7"/></svg></div><h2>Invites sent</h2><p>Three teammates will get an email shortly.</p><div class="av"><u style="--c:#6366F1">M</u><u style="--c:#EC4899">D</u><u style="--c:#10B981">I</u></div></div><div class="bt"><button class="p" id="b2">Done</button></div></div>
<div class="dots" id="dots"><i></i><i></i><i></i></div></div>
<script>
const $=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let off=false;const ms=[$('m0'),$('m1'),$('m2')];
const NM=[['maya@northwind.co','M','#6366F1'],['dev@northwind.co','D','#EC4899'],['ines@northwind.co','I','#10B981']];
function chips(n){$('ch').innerHTML=NM.slice(0,n).map(x=>'<span><u style="--c:'+x[2]+'">'+x[1]+'</u>'+x[0]+'</span>').join('')}
function state(step){ms.forEach((m,i)=>{m.className='m';if(step<0)m.classList.add('x');else if(i===step)m.classList.add('f');else if(i<step){m.classList.add(step-i===1?'b1':'b2')}});$('bk').classList.toggle('on',step>=0);[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i===step))}
async function press(id){const b=$(id);b.classList.add('pr');await sl(240);b.classList.remove('pr')}
chips(3);[...$('rd').children].forEach((r,i)=>r.onclick=()=>{off=true;[...$('rd').children].forEach((x,k)=>x.classList.toggle('on',k===i))});
state(1);ms.forEach(m=>m.style.transition='none');state(1);requestAnimationFrame(()=>requestAnimationFrame(()=>ms.forEach(m=>m.style.transition='')));
$('b0').onclick=()=>{off=true;state(1)};$('b1').onclick=()=>{off=true;state(2)};$('b2').onclick=()=>{off=true;state(-1)};
document.querySelector('.st').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: three modals stack in depth instead of replacing each other; the first (invite chips) recedes behind the second (role picker) with a slight scale-down, lift and dimming, then both recede behind a third success modal whose green check springs in, and Done dismisses the whole stack at once, then the flow starts again with chips typed in one by one, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){await press('b1');state(2);await sl(2800);await press('b2');state(-1);await sl(1000);if(off)return;chips(0);await sl(300);state(0);await sl(900);for(let i=1;i<=3;i++){chips(i);await sl(600)}await sl(700);await press('b0');state(1);await sl(1800);const r=[...$('rd').children];r.forEach(x=>x.classList.remove('on'));r[2].classList.add('on');await sl(1200);r[2].classList.remove('on');r[1].classList.add('on');await sl(600)}})()}
</script></body></html>
