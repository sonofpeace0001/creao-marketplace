<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Month Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(700px 440px at 90% 0,#142238,transparent 60%),#090B10;color:#E8ECF5;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 16px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:780px;display:grid;grid-template-columns:1.6fr 1fr;background:#0F131B;border:1px solid #1E2533;border-radius:28px;overflow:hidden;box-shadow:0 40px 80px -34px #000}
.cal{padding:26px 24px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hd h1{font-size:22px;font-weight:800;letter-spacing:-.035em}.hd h1 span{color:#6C7891;font-weight:600}
.nv{display:flex;gap:6px}.nv button{width:36px;height:36px;border-radius:11px;border:1px solid #232C3D;background:#121722;color:#C3CCE0;cursor:pointer;display:grid;place-items:center;transition:all .2s}.nv button:hover{background:#1A2132;color:#fff}.nv button:focus-visible{outline:2px solid #4DA3FF;outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dn{font:500 11px 'Geist Mono',monospace;color:#5B677F;text-align:center;padding:6px 0 10px;letter-spacing:.08em}
.d{position:relative;aspect-ratio:1;border:0;border-radius:14px;background:none;color:#B7C0D6;font:600 14.5px 'Manrope';cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.d:hover{background:#171E2D;color:#fff}.d:focus-visible{outline:2px solid #4DA3FF;outline-offset:-2px}
.d.o{color:#3A455C}.d.t{box-shadow:inset 0 0 0 1.5px #4DA3FF;color:#fff}
.d.s{background:linear-gradient(135deg,#4DA3FF,#6C63FF);color:#fff;box-shadow:0 10px 20px -8px rgba(77,163,255,.7)}
.d .ev{position:absolute;bottom:7px;display:flex;gap:3px}.d .ev i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.d.s .ev i{background:#fff}
.ag{background:#0C1017;border-left:1px solid #1E2533;padding:26px 22px;display:flex;flex-direction:column}
.ag small{font:500 11px 'Geist Mono',monospace;letter-spacing:.14em;color:#5B677F}
.ag h2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:6px 0 16px}
.it{display:flex;gap:12px;padding:12px;margin:0 -12px;border-radius:14px;transition:background .2s}.it:hover{background:#121723}
.it i{width:4px;border-radius:4px;background:var(--c);flex:none}.it b{display:block;font-size:14.5px;font-weight:700}.it span{font-size:12.5px;color:#6C7891;font-weight:500}
.em{margin:auto 0;text-align:center;color:#56627A;font-size:14px;line-height:1.5}
@media(max-width:680px){.c{grid-template-columns:1fr}.ag{border-left:0;border-top:1px solid #1E2533}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="cal"><div class="hd"><h1 id="t"></h1><div class="nv"><button id="pv" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><button id="nx" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div></div><div class="g" id="g"></div></div>
<div class="ag"><small id="ds"></small><h2 id="dh"></h2><div id="ls"></div></div></div>
<script>
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],DN=['MO','TU','WE','TH','FR','SA','SU'];
const E={'0-5':[['Design review','10:00 · Studio B','#4DA3FF'],['Team lunch','12:30 · Rooftop','#34D399']],'0-9':[['Sprint planning','09:30 · Zoom','#6C63FF']],'0-14':[['Investor update','15:00 · Boardroom','#F59E0B'],['1:1 with Maya','16:30 · Call','#4DA3FF']],'0-21':[['Launch day','All day','#F43F5E']],'0-27':[['Quarterly offsite','All day','#34D399']]};
const now=new Date();let y=now.getFullYear(),m=now.getMonth(),sel=now.getDate();
const g=document.getElementById('g');
function draw(){document.getElementById('t').innerHTML=MN[m]+' <span>'+y+'</span>';
 const first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let h=DN.map(d=>'<div class="dn">'+d+'</div>').join('');
 for(let i=0;i<42;i++){let d=i-first+1,o=false;if(d<1){d=prev+d;o=true}else if(d>dim){d=d-dim;o=true}
  const ev=!o?(E['0-'+d]||[]):[],t=!o&&d===now.getDate()&&m===now.getMonth()&&y===now.getFullYear();
  h+='<button class="d'+(o?' o':'')+(t?' t':'')+(!o&&d===sel?' s':'')+'" data-d="'+(o?'':d)+'" '+(o?'tabindex="-1"':'')+' aria-label="'+d+' '+MN[m]+(ev.length?', '+ev.length+' events':'')+'">'+d+(ev.length?'<span class="ev">'+ev.map(e=>'<i style="--c:'+e[2]+'"></i>').join('')+'</span>':'')+'</button>'}
 g.innerHTML=h;agenda()}
function agenda(){const ev=E['0-'+sel]||[];document.getElementById('ds').textContent=MN[m].toUpperCase()+' '+y;document.getElementById('dh').textContent=MN[m].slice(0,3)+' '+sel;
 document.getElementById('ls').innerHTML=ev.length?ev.map(e=>'<div class="it"><i style="--c:'+e[2]+'"></i><div><b>'+e[0]+'</b><span>'+e[1]+'</span></div></div>').join(''):'<div class="em">Nothing scheduled.<br>Enjoy the free day.</div>'}
g.addEventListener('click',e=>{const b=e.target.closest('.d');if(!b||!b.dataset.d)return;sel=+b.dataset.d;draw()});
document.getElementById('pv').onclick=()=>{m--;if(m<0){m=11;y--}sel=1;draw()};document.getElementById('nx').onclick=()=>{m++;if(m>11){m=0;y++}sel=1;draw()};draw();
</script></body></html>
