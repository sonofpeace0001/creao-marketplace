<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password Strength Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0E0B1A;color:#ECE9FA;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(520px 340px at 80% 10%,rgba(124,92,255,.22),transparent 70%)}
.f{--c:#7C5CFF;width:100%;max-width:420px;border-radius:24px;padding:28px;background:#15112A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 40px 60px -34px rgba(0,0,0,.8)}
.f h1{font-size:24px;font-weight:700;letter-spacing:-.035em}.f>p{color:#8D86B3;font-size:14px;margin:6px 0 22px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8D86B3;margin-bottom:8px}
.fld{position:relative}
.fld input{width:100%;border:0;border-radius:14px;background:#0E0B1A;color:#fff;font:500 17px 'JetBrains Mono';letter-spacing:.06em;padding:16px 52px 16px 16px;box-shadow:inset 0 0 0 1.500px rgba(255,255,255,.1);outline:0;transition:box-shadow .25s}
.fld input:focus{box-shadow:inset 0 0 0 2px var(--c),0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.eye{position:absolute;right:8px;top:50%;width:38px;height:38px;margin-top:-19px;border:0;border-radius:10px;background:none;color:#8D86B3;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:#fff}.eye:focus-visible{outline:2px solid var(--c)}.eye svg{width:22px;height:22px}
.eye .sl{stroke-dasharray:26;stroke-dashoffset:0;transition:stroke-dashoffset .3s}.eye.on .sl{stroke-dashoffset:26}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0 10px}
.meter i{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.meter i::after{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.3,1.2,.4,1)}
.meter i.on::after{transform:none}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.lab{font-weight:700;color:var(--c);transition:color .3s}.ct{color:#8D86B3;font:500 12px 'JetBrains Mono'}
.rules{list-style:none;display:grid;gap:9px;margin:20px 0 24px}
.rules li{display:flex;align-items:center;gap:10px;font-size:14px;color:#8D86B3;transition:color .25s}
.rules li i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.500px rgba(255,255,255,.18);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.rules li svg{width:12px;height:12px;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .35s .05s}
.rules li.ok{color:#ECE9FA}.rules li.ok i{background:#34D399;box-shadow:none;transform:scale(1.08)}.rules li.ok svg{stroke-dashoffset:0}
.go{width:100%;border:0;border-radius:14px;padding:16px;background:var(--c);color:#fff;font:700 16px 'Inter Tight';cursor:pointer;transition:filter .2s,opacity .2s}
.go:disabled{opacity:.35;cursor:not-allowed}.go:not(:disabled):hover{filter:brightness(1.1)}.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<form class="f" id="f" onsubmit="return false" novalidate><h1>Create your password</h1><p>Use something a stranger cannot guess in a thousand years.</p>
<label for="pw">Password</label><div class="fld"><input id="pw" type="password" autocomplete="new-password" value="Tidal-Harbour7!" aria-describedby="lab"><button type="button" class="eye" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button></div>
<div class="meter" id="m"><i></i><i></i><i></i><i></i></div><div class="row"><span class="lab" id="lab" aria-live="polite">Strong</span><span class="ct" id="ct"></span></div>
<ul class="rules" id="r"><li data-k="len"><i><svg viewBox="0 0 24 24" fill="none" stroke="#06281C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i>At least 12 characters</li><li data-k="case"><i><svg viewBox="0 0 24 24" fill="none" stroke="#06281C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i>Upper and lower case letters</li><li data-k="num"><i><svg viewBox="0 0 24 24" fill="none" stroke="#06281C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i>A number</li><li data-k="sym"><i><svg viewBox="0 0 24 24" fill="none" stroke="#06281C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></i>A symbol such as ! or -</li></ul>
<button class="go" id="go" disabled>Continue</button></form>
<script>
const pw=document.getElementById('pw'),f=document.getElementById('f'),segs=[...document.querySelectorAll('#m i')],lab=document.getElementById('lab'),ct=document.getElementById('ct'),go=document.getElementById('go'),eye=document.getElementById('eye'),rules=[...document.querySelectorAll('#r li')];
const L=[['Too weak','#F43F5E','instantly'],['Weak','#F97316','minutes'],['Fair','#FACC15','3 days'],['Good','#84CC16','8 years'],['Strong','#34D399','900 years']];
function eval_(v){const t={len:v.length>=12,case:/[a-z]/.test(v)&&/[A-Z]/.test(v),num:/\d/.test(v),sym:/[^A-Za-z0-9]/.test(v)};let s=Object.values(t).filter(Boolean).length;if(!v)s=0;return{t,s}}
function paint(){const{t,s}=eval_(pw.value),l=L[s];f.style.setProperty('--c',s?l[1]:'#7C5CFF');segs.forEach((e,i)=>e.classList.toggle('on',i<s));
 lab.textContent=pw.value?l[0]:'Enter a password';lab.style.color=pw.value?l[1]:'#8D86B3';ct.textContent=pw.value?'~ '+l[2]+' to crack':'';rules.forEach(r=>r.classList.toggle('ok',t[r.dataset.k]));go.disabled=s<4}
pw.addEventListener('input',paint);
eye.onclick=()=>{const sh=pw.type==='password';pw.type=sh?'text':'password';eye.classList.toggle('on',sh);eye.setAttribute('aria-label',sh?'Hide password':'Show password')};
paint();
/* Idle demo: the field retypes four ever-stronger passwords, revealed, until a real interaction. */
let off=false;['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>off=true,{once:true}));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const seq=['harbour','Harbour7','Harbour7!','Tidal-Harbour7!'],sleep=ms=>new Promise(r=>setTimeout(r,ms));
 (async()=>{await sleep(3600);while(!off){pw.type='text';eye.classList.add('on');pw.value='';paint();for(const s of seq){if(off)return;for(let i=pw.value.length;i<=s.length;i++){if(off)return;pw.value=s.slice(0,i);paint();await sleep(110)}await sleep(850)}await sleep(1400)}})()}
</script></body></html>
