<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cookie Scan Report Consent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080C12;color:#E8EEF8;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:660px;background:#0F151F;border-radius:28px;padding:24px;box-shadow:0 44px 64px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08);overflow:hidden;position:relative}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}.hd small{font:600 11.500px 'Geist Mono';letter-spacing:.14em;color:#38BDF8;text-transform:uppercase;display:flex;align-items:center;gap:8px}.hd small i{width:8px;height:8px;border-radius:50%;background:#38BDF8;animation:bk 1s infinite}.done .hd small i{animation:none;background:#34D399}.done .hd small{color:#34D399}@keyframes bk{50%{opacity:.3}}.hd h1{font:800 44px/1 'Sora';letter-spacing:-.05em;margin-top:6px;font-variant-numeric:tabular-nums}.hd h1 span{font-size:16px;color:#7C8AA0;font-weight:600;letter-spacing:0;margin-left:8px}
.rk{text-align:right}.rk b{display:block;font:800 22px 'Sora';letter-spacing:-.03em}.rk span{font:500 11px 'Geist Mono';color:#7C8AA0}
.sb{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#182231;margin-bottom:6px;gap:2px}.sb i{display:block;height:100%;width:0;background:var(--c);transition:width .5s}
.lg{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;font:500 12px 'Geist Mono';color:#8A97AD}.lg span{display:flex;align-items:center;gap:7px}.lg i{width:9px;height:9px;border-radius:3px;background:var(--c)}.lg b{color:#fff;font-variant-numeric:tabular-nums}
.ls{position:relative;height:250px;overflow:hidden;border-radius:16px;background:#0B1119;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sc{position:absolute;left:0;right:0;height:46px;background:linear-gradient(180deg,transparent,rgba(56,189,248,.22),rgba(56,189,248,.5));border-bottom:2px solid #38BDF8;z-index:3;top:var(--y,0px);transform:translateY(-100%);opacity:var(--o,0);pointer-events:none}
.rw{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;height:50px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.04);opacity:0;transform:translateX(-14px);transition:opacity .3s,transform .4s cubic-bezier(.3,1.4,.5,1)}.rw.on{opacity:1;transform:none}
.rw b{font:500 14px 'Geist Mono';color:#fff}.rw span{font:400 12px 'Geist Mono';color:#7C8AA0}.rw em{font:600 10.500px 'Geist Mono';font-style:normal;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);letter-spacing:.06em}
.ft{display:flex;gap:10px;margin-top:16px}.ft button{border:0;border-radius:13px;padding:12px 18px;font:700 13.500px 'Sora';cursor:pointer;opacity:.35;pointer-events:none;transition:opacity .4s}.done .ft button{opacity:1;pointer-events:auto}.ft .p{background:#38BDF8;color:#04202E}.ft .s{background:rgba(255,255,255,.08);color:#D3DCEC}
</style></head><body>
<div class="cd" id="cd"><div class="hd"><div><small><i></i><span id="sm">Scanning your site</span></small><h1><span id="n" style="font:inherit;color:#fff;margin:0">0</span><span>cookies found</span></h1></div><div class="rk"><b id="rk">—</b><span id="rl">PRIVACY RISK</span></div></div>
<div class="sb" id="sb"></div><div class="lg" id="lg"></div><div class="ls" id="ls"><i class="sc" id="sc"></i></div>
<div class="ft"><button class="p">Review &amp; classify</button><button class="s">Export report</button></div></div>
<script>
const CAT={n:['Necessary','#34D399'],f:['Functional','#38BDF8'],a:['Analytics','#A78BFA'],m:['Marketing','#FB7185']};
const CK=[['__session','n','1st party','Session'],['csrf_token','n','1st party','Session'],['lang','f','1st party','1 year'],['theme','f','1st party','6 months'],['_ga','a','Google','2 years'],['_gid','a','Google','24 hours'],['_hjSession','a','Hotjar','30 min'],['_fbp','m','Meta','3 months'],['IDE','m','DoubleClick','13 months'],['_gcl_au','m','Google Ads','3 months'],['li_sugr','m','LinkedIn','3 months'],['MUID','m','Microsoft','13 months']];
const $=id=>document.getElementById(id),ls=$('ls'),sl=t=>new Promise(r=>setTimeout(r,t));let off=false;const rows=[],cnt={n:0,f:0,a:0,m:0};
Object.keys(CAT).forEach(k=>{$('sb').insertAdjacentHTML('beforeend','<i style="--c:'+CAT[k][1]+'" id="b'+k+'"></i>');$('lg').insertAdjacentHTML('beforeend','<span style="--c:'+CAT[k][1]+'"><i></i>'+CAT[k][0]+' <b id="c'+k+'">0</b></span>')});
CK.forEach((c,i)=>{const d=document.createElement('div');d.className='rw';d.style.setProperty('--c',CAT[c[1]][1]);d.style.cssText+='position:absolute;left:0;right:0;top:'+(i*50)+'px';d.innerHTML='<b>'+c[0]+'</b><span>'+c[2]+' · '+c[3]+'</span><em>'+CAT[c[1]][0].toUpperCase()+'</em>';ls.appendChild(d);rows.push(d)});
function paint(n){const tot=Math.max(1,n);Object.keys(cnt).forEach(k=>{cnt[k]=CK.slice(0,n).filter(c=>c[1]===k).length;$('c'+k).textContent=cnt[k];$('b'+k).style.width=(cnt[k]/CK.length*100)+'%'});$('n').textContent=n;const risk=cnt.m*3+cnt.a*1.5;$('rk').textContent=n<CK.length?'—':risk>12?'High':risk>6?'Medium':'Low';$('rk').style.color=risk>12?'#FB7185':risk>6?'#FBBF24':'#34D399'}
function scroll(n){ls.scrollTop=Math.max(0,n*50-230)}
rows.forEach(r=>{r.style.transition='none';r.classList.add('on')});paint(CK.length);$('cd').classList.add('done');$('sm').textContent='Scan complete';ls.scrollTop=0;requestAnimationFrame(()=>requestAnimationFrame(()=>rows.forEach(r=>r.style.transition='')));
document.querySelector('.cd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a cookie scanner audits a site; a cyan scan line sweeps down a list as each cookie row slides in with its name, vendor, lifetime and a colour-coded category chip, a stacked bar and the four category counters grow in step with the running total, and when the sweep ends the scanner dot turns green, the privacy risk readout resolves to a rating and the Review and Export buttons wake up, then it clears and scans again, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){$('cd').classList.remove('done');rows.forEach(r=>r.classList.remove('on'));$('sm').textContent='Scanning your site';paint(0);$('sc').style.setProperty('--o',1);await sl(500);for(let i=0;i<CK.length&&!off;i++){$('sc').style.setProperty('--y',(i*50+50)+'px');rows[i].classList.add('on');paint(i+1);await sl(430)}$('sc').style.setProperty('--o',0);$('cd').classList.add('done');$('sm').textContent='Scan complete';paint(CK.length);await sl(4600)}})()}
</script></body></html>
