<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Giant Wordmark Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8E6DF;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0;-webkit-font-smoothing:antialiased}
.ft{--x:50%;--y:50%;position:relative;background:#0E0E0C;color:#F2F0E8;padding:54px 6vw 0;overflow:hidden;min-height:520px;display:flex;flex-direction:column;justify-content:space-between}
.tp{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px;position:relative;z-index:3}
.tp h3{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#7B786C;margin-bottom:14px}.tp a{display:block;color:#D8D5C9;text-decoration:none;font-size:15px;padding:4px 0;transition:color .2s,transform .2s}.tp a:hover{color:#FFB703;transform:translateX(4px)}.tp a:focus-visible{outline:2px solid #FFB703;outline-offset:3px;border-radius:4px}
.nl p{font-size:15px;line-height:1.5;color:#A9A699;max-width:30ch;margin-bottom:14px}.nl form{display:flex;gap:6px;max-width:340px;border:1px solid #2E2D27;border-radius:99px;padding:5px}.nl input{flex:1;min-width:0;border:0;background:none;outline:0;color:#F2F0E8;font:500 14.5px 'Inter';padding:0 14px}.nl input::placeholder{color:#6F6C61}.nl button{border:0;background:#FFB703;color:#1B1405;border-radius:99px;padding:10px 18px;font:600 14px 'Inter';cursor:pointer}.nl button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mid{display:flex;justify-content:space-between;font-size:13px;color:#6F6C61;position:relative;z-index:3;margin:40px 0 0}
.wm{position:relative;z-index:2;font:400 clamp(120px,43vw,560px)/.94 'Anton',sans-serif;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;margin:20px -1vw -.14em;user-select:none;color:#2B2A25}
.wm span{position:relative;display:block}
.wm .lit{position:absolute;inset:0;color:transparent;background:radial-gradient(300px circle at var(--wx,50%) var(--wy,50%),#FFB703,#FB5607 55%,transparent 85%);-webkit-background-clip:text;background-clip:text;pointer-events:none}
.ft::before{content:"";position:absolute;inset:0;background:radial-gradient(500px circle at var(--x) var(--y),rgba(255,183,3,.09),transparent 70%);pointer-events:none}
@media(max-width:640px){.tp{grid-template-columns:1fr 1fr}.nl{grid-column:1/3}}
.pg{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:30px 6vw}.pg i{display:block;border-radius:8px;background:rgba(20,20,40,.08)}.pg i:nth-child(1){width:min(420px,70%);height:34px}.pg i:nth-child(2){width:min(560px,86%);height:12px}.pg i:nth-child(3){width:min(480px,76%);height:12px}.pg i:nth-child(4){width:130px;height:40px;border-radius:99px;margin-top:8px;background:rgba(20,20,40,.14)}</style></head><body>
<div class="pg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<footer class="ft" id="ft"><div class="tp"><div class="nl"><h3>Stay in the loop</h3><p>One short email a month. New components, no spam.</p><form onsubmit="event.preventDefault()"><input type="email" placeholder="you@studio.com" aria-label="Email"><button>Join</button></form></div>
<div><h3>Product</h3><a href="#">Components</a><a href="#">Templates</a><a href="#">Pricing</a><a href="#">Changelog</a></div><div><h3>Company</h3><a href="#">About</a><a href="#">Careers</a><a href="#">Press kit</a><a href="#">Contact</a></div><div><h3>Social</h3><a href="#">Twitter</a><a href="#">GitHub</a><a href="#">Dribbble</a><a href="#">YouTube</a></div></div>
<div class="mid"><span>2026 Folio Studio. All rights reserved.</span><span>Privacy · Terms</span></div>
<div class="wm" aria-hidden="true"><span>Folio<span class="lit">Folio</span></span></div></footer>
<script>
const ft=document.getElementById('ft');let real=false,t=.8;const wm=ft.querySelector('.wm');function set(x,y){ft.style.setProperty('--x',x+'px');ft.style.setProperty('--y',y+'px');const w=wm.getBoundingClientRect(),r=ft.getBoundingClientRect();wm.style.setProperty('--wx',(x-(w.left-r.left))+'px');wm.style.setProperty('--wy',(y-(w.top-r.top))+'px')}
ft.addEventListener('pointermove',e=>{real=true;const r=ft.getBoundingClientRect();set(e.clientX-r.left,e.clientY-r.top)});ft.addEventListener('pointerleave',()=>real=false);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(){if(!real){t+=.012;const r=ft.getBoundingClientRect();set(r.width*(.5+Math.cos(t)*.38),r.height*(.78+Math.sin(t*1.4)*.08))}if(!reduce)requestAnimationFrame(loop)}
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>{const r=ft.getBoundingClientRect();set(r.width*.4,r.height*.8);if(!reduce)loop()});
</script></body></html>
