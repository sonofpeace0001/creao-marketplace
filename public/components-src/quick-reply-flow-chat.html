<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quick Reply Flow Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8E3F4;color:#241B3D;font-family:'Nunito',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px 14px;-webkit-font-smoothing:antialiased}
.wd{width:100%;max-width:400px;height:600px;background:#fff;border-radius:30px;box-shadow:0 44px 64px -30px rgba(36,27,61,.6),inset 0 0 0 1px rgba(36,27,61,.06);display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:16px 18px;background:linear-gradient(135deg,#7C3AED,#C026D3);color:#fff}.av{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;position:relative}.av::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#34D399;box-shadow:0 0 0 2.500px #A21CAF}
.hd b{display:block;font-size:16px;font-weight:800}.hd span{font-size:12.500px;opacity:.85}
.ms{flex:1;overflow:hidden;padding:16px 14px 8px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;background:#FAF8FF}
.m{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14.500px;line-height:1.4;animation:in .45s cubic-bezier(.3,1.5,.5,1)}@keyframes in{from{opacity:0;transform:translateY(12px) scale(.94)}}
.m.b{align-self:flex-start;background:#fff;box-shadow:0 1px 0 rgba(36,27,61,.07),inset 0 0 0 1px #EEE9FA;border-bottom-left-radius:6px}.m.u{align-self:flex-end;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;border-bottom-right-radius:6px;font-weight:700}
.ty{align-self:flex-start;display:flex;gap:4px;padding:13px 16px;background:#fff;border-radius:18px;border-bottom-left-radius:6px;box-shadow:inset 0 0 0 1px #EEE9FA}.ty i{width:7px;height:7px;border-radius:50%;background:#B7A8DC;animation:bn 1s infinite}.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}@keyframes bn{30%{transform:translateY(-5px);background:#7C3AED}}
.qr{display:flex;gap:7px;flex-wrap:wrap;align-self:flex-start;padding-left:2px}.qr button{border:0;border-radius:99px;padding:8px 15px;background:#fff;color:#7C3AED;font:800 13.500px 'Nunito';cursor:pointer;box-shadow:inset 0 0 0 2px #7C3AED;animation:in .45s cubic-bezier(.3,1.5,.5,1) both;transition:background .2s,color .2s,transform .15s}.qr button:nth-child(2){animation-delay:.08s}.qr button:nth-child(3){animation-delay:.16s}.qr button.pr{background:#7C3AED;color:#fff;transform:scale(.94)}.qr button:focus-visible{outline:3px solid #C4B5FD}
.cr{display:flex;gap:10px;overflow:hidden;align-self:stretch;animation:in .5s cubic-bezier(.3,1.4,.5,1)}.pc{flex:none;width:136px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px #EEE9FA;overflow:hidden}.pc .im{height:74px;display:grid;place-items:center;font-size:36px;background:var(--c)}.pc .tx{padding:8px 10px 10px}.pc b{display:block;font-size:13px;font-weight:800;line-height:1.15}.pc span{font-size:12.500px;color:#7A6E9C;font-weight:700}.pc button{margin-top:7px;width:100%;border:0;border-radius:10px;padding:7px;background:#F3EDFF;color:#7C3AED;font:800 12.500px 'Nunito';cursor:pointer;transition:all .25s}.pc button.ok{background:#16A34A;color:#fff}.pc button.pr{transform:scale(.94)}
.in{display:flex;gap:10px;padding:12px 14px;border-top:1px solid #F0ECFA;background:#fff}.in div{flex:1;padding:11px 15px;border-radius:99px;background:#F5F2FC;font-size:14px;color:#A89BC9}.in button{width:42px;border:0;border-radius:50%;background:#7C3AED;color:#fff;font-size:17px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="wd"><div class="hd"><div class="av">🎁</div><div><b>Penny</b><span>Gift concierge · replies instantly</span></div></div><div class="ms" id="ms"></div><div class="in"><div>Type a message…</div><button aria-label="Send">➤</button></div></div>
<script>
const ms=document.getElementById('ms'),sl=ms2=>new Promise(r=>setTimeout(r,ms2));let off=false,gen=0;
function add(c,h,fast){const d=document.createElement('div');d.className=c;d.innerHTML=h;if(fast)d.style.animation='none';ms.appendChild(d);while(ms.children.length>9)ms.firstChild.remove();return d}
function typing(){const t=add('ty','<i></i><i></i><i></i>');return t}
const PR=[['Linen candle set','$34','#FDE68A','🕯️'],['Pocket Polaroid','$48','#BFDBFE','📷'],['Silk sleep mask','$29','#FBCFE8','🌙']];
const cards='<div class="cr">'+PR.map((p,i)=>'<div class="pc"><div class="im" style="--c:'+p[2]+'">'+p[3]+'</div><div class="tx"><b>'+p[0]+'</b><span>'+p[1]+'</span><button data-i="'+i+'">Add to gift</button></div></div>').join('')+'</div>';
function chips(a){return '<div class="qr">'+a.map(x=>'<button>'+x+'</button>').join('')+'</div>'}
function preset(){ms.innerHTML='';add('m b','Hi Alex 👋 I am Penny. What can I help you with?',1);add('m u','Find a gift',1);add('m b','Lovely! Who is it for?',1);add('m u','A friend',1);add('m b','Here are three picks under $50 that friends love:',1);const c=add('cr','',1);c.outerHTML=cards;}
preset();
document.getElementById('ms').addEventListener('pointerdown',()=>{off=true});
async function press(el){el.classList.add('pr');await sl(260);el.classList.remove('pr')}
/* Idle demo: a shopping assistant chat plays itself; bouncing typing dots precede each bot message, quick-reply chips pop in one after another and the chosen chip becomes the user's bubble, a carousel of gift cards slides in, the second card's Add button presses and turns green, and the bot follows up with a gift-wrap offer, then the conversation clears and restarts, until you tap the chat. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){const cs=ms.querySelectorAll('.pc button');const b=cs[1];if(b){await press(b);b.classList.add('ok');b.textContent='Added ✓'}await sl(700);if(off)return;let t=typing();await sl(1300);t.remove();add('m b','Nice choice! Want it gift wrapped for $4?');await sl(500);const q=add('qr','<button>Yes please</button><button>No thanks</button>');await sl(1500);if(off)return;await press(q.children[0]);q.remove();add('m u','Yes please');t=typing();await sl(1300);t.remove();add('m b','Done! Wrapped and shipping tomorrow 🎀');await sl(4200);if(off)return;ms.innerHTML='';add('m b','Hi Alex 👋 I am Penny. What can I help you with?');await sl(600);let q2=add('qr','<button>Track order</button><button>Find a gift</button><button>Talk to a human</button>');await sl(1700);await press(q2.children[1]);q2.remove();add('m u','Find a gift');t=typing();await sl(1200);t.remove();add('m b','Lovely! Who is it for?');await sl(500);q2=add('qr','<button>Partner</button><button>A friend</button><button>Parent</button>');await sl(1500);await press(q2.children[1]);q2.remove();add('m u','A friend');t=typing();await sl(1300);t.remove();add('m b','Here are three picks under $50 that friends love:');await sl(600);const c=add('cr','');c.outerHTML=cards;await sl(2200)}})()}
</script></body></html>
