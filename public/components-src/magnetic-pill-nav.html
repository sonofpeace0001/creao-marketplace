<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magnetic Pill Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 340px at 50% 0%,#2D2563,transparent 70%),#0C0B18;color:#F0EFFB;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:820px;text-align:center}
.nv{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 22px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);box-shadow:0 30px 60px -24px rgba(0,0,0,.7)}
.lg{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.04em;margin-right:14px}.lg i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#A78BFA,#F472B6)}
.ls{position:relative;display:flex;gap:2px}
.pl{position:absolute;top:0;height:100%;border-radius:99px;background:linear-gradient(135deg,#7C5CFF,#C04CFD);box-shadow:0 10px 24px -8px #7C5CFF;transition:left .45s cubic-bezier(.3,1.5,.5,1),width .45s cubic-bezier(.3,1.5,.5,1);z-index:0}
.ls a{position:relative;z-index:1;display:block;padding:11px 19px;border-radius:99px;font-size:15px;font-weight:500;color:#B9B6D8;text-decoration:none;will-change:transform;transition:color .25s}.ls a:hover,.ls a.on{color:#fff}.ls a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cta{margin-left:10px;border:0;background:#fff;color:#14112B;border-radius:99px;padding:11px 20px;font:700 14.5px 'Space Grotesk';cursor:pointer;will-change:transform}.cta:focus-visible{outline:3px solid #A78BFA;outline-offset:2px}
.ct{margin-top:80px}.ct h1{font-size:clamp(34px,6vw,60px);font-weight:700;letter-spacing:-.055em;line-height:1}.ct p{color:#8F8CB8;font-size:16px;margin-top:12px}
@media(max-width:620px){.nv{padding:5px}.lg{display:none}.ls a{padding:10px 12px;font-size:14px}.cta{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><nav class="nv" id="nv" aria-label="Main"><div class="lg"><i></i>Orbit</div><div class="ls" id="ls"><span class="pl" id="pl"></span><a href="#">Home</a><a href="#" class="on">Work</a><a href="#">Services</a><a href="#">Journal</a><a href="#">Contact</a></div><button class="cta" id="cta">Hire us</button></nav>
<div class="ct"><h1>Magnetic navigation</h1><p>Links lean toward your cursor and the pill snaps with a spring.</p></div></div>
<script>
const ls=document.getElementById('ls'),pl=document.getElementById('pl'),as=[...ls.querySelectorAll('a')];let cur=as.find(a=>a.classList.contains('on'));
function mv(a){pl.style.left=a.offsetLeft+'px';pl.style.width=a.offsetWidth+'px'}
function init(){pl.style.transition='none';mv(cur);requestAnimationFrame(()=>requestAnimationFrame(()=>pl.style.transition=''))}init();(document.fonts&&document.fonts.ready||Promise.resolve()).then(init);
as.forEach(a=>{a.addEventListener('mouseenter',()=>mv(a));a.addEventListener('focus',()=>mv(a));a.addEventListener('click',e=>{e.preventDefault();cur=a;as.forEach(x=>x.classList.toggle('on',x===a));mv(a)})});
ls.addEventListener('mouseleave',()=>{mv(cur);as.forEach(a=>a.style.transform='')});
function mag(el,k){el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);el.style.transform='translate('+(dx*k)+'px,'+(dy*k)+'px)'});el.addEventListener('pointerleave',()=>el.style.transform='')}
as.forEach(a=>mag(a,.28));mag(document.getElementById('cta'),.35);
ls.addEventListener('blur',()=>mv(cur),true);
</script></body></html>
