<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Docs Code Tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EDEFF5;color:#14172B;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:700px}
.c h1{font-size:22px;font-weight:700;letter-spacing:-.03em}.c p{font-size:14.5px;color:#5E6585;margin:4px 0 16px}.c p code{font:500 13px 'Fira Code',monospace;background:#DFE3F2;border-radius:6px;padding:1px 6px}
.cb{background:#0E1220;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(10,14,40,.7)}
.tb{display:flex;align-items:center;padding:0 8px 0 6px;background:#0A0E1A;border-bottom:1px solid #1A2036}
.tb button.t{position:relative;border:0;background:none;color:#7C86AB;padding:13px 14px;font:600 13.5px 'Inter';cursor:pointer}.tb button.t[aria-selected=true]{color:#fff}.tb button.t:focus-visible{outline:2px solid #818CF8;outline-offset:-2px}
.ul{position:absolute;bottom:0;height:2px;background:#818CF8;border-radius:2px;transition:left .35s cubic-bezier(.4,1.3,.5,1),width .35s;box-shadow:0 0 12px #818CF8}
.tw{position:relative;display:flex}.fn{margin-left:auto;font:400 12px 'Fira Code',monospace;color:#5A6385;padding-right:12px}
.cp{display:flex;align-items:center;gap:7px;border:1px solid #232A45;background:#131830;color:#B2BAD8;border-radius:9px;padding:6px 11px;font:600 12.5px 'Inter';cursor:pointer;min-width:84px;justify-content:center;transition:all .25s}.cp:hover{border-color:#4C5788;color:#fff}.cp.ok{background:#12301F;border-color:#1F6B3F;color:#4ADE80}.cp:focus-visible{outline:2px solid #818CF8}
.cp .ic{position:relative;width:15px;height:15px}.cp .ic svg{position:absolute;inset:0;transition:all .3s cubic-bezier(.3,1.6,.5,1)}.cp .ic .ck{opacity:0;transform:scale(.3) rotate(-60deg)}.cp.ok .ic .cc{opacity:0;transform:scale(.3) rotate(60deg)}.cp.ok .ic .ck{opacity:1;transform:none}
pre{padding:16px 0;font:400 13.5px/1.75 'Fira Code',monospace;overflow-x:auto;color:#D4DAF2}
.ln{display:flex;padding:0 18px 0 0;transition:opacity .2s;position:relative}.ln i{flex:none;width:44px;text-align:right;padding-right:16px;color:#3E4768;font-style:normal;user-select:none}.ln.hl{background:linear-gradient(90deg,rgba(129,140,248,.18),rgba(129,140,248,.03));box-shadow:inset 2px 0 0 #818CF8}
pre:hover .ln:not(:hover){opacity:.45}
.k{color:#C792EA}.s{color:#C3E88D}.n{color:#F78C6C}.cm{color:#5A6385;font-style:italic}.f{color:#82AAFF}.p{color:#89DDFF}
.rs{border-top:1px solid #1A2036;background:#0A0E1A;padding:12px 18px;font:400 12.5px/1.7 'Fira Code',monospace;color:#8E98BF}.rs b{color:#4ADE80;font-weight:500}.rs em{font-style:normal;color:#7C86AB}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><h1>Create a customer</h1><p>Send a <code>POST</code> request to create a customer and return the new object.</p>
<div class="cb"><div class="tb"><div class="tw" id="tw" role="tablist"><span class="ul" id="ul"></span></div><span class="fn" id="fn"></span><button class="cp" id="cp"><span class="ic"><svg class="cc" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><svg class="ck" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><span id="cl">Copy</span></button></div>
<pre id="pr"></pre><div class="rs"><b>201 Created</b> <em>· 143 ms</em><br>{ "id": "cus_8f2Qk1", "email": "ada@studio.com" }</div></div></div>
<script>
const K={js:['await','const','new','from','import','async','return'],py:['import','from','as','print','with'],sh:[]};
const C={cURL:{f:'terminal',l:'sh',hl:[2,3],code:`curl https://api.nova.app/v1/customers \\\n  -H "Authorization: Bearer sk_live_51Hx" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "email": "ada@studio.com",\n    "plan": "pro"\n  }'`},Node:{f:'create.mjs',l:'js',hl:[3,4,5],code:`import Nova from "nova";\n\nconst nova = new Nova("sk_live_51Hx");\nconst customer = await nova.customers.create({\n  email: "ada@studio.com",\n  plan: "pro",\n});\n\n// customer.id -> "cus_8f2Qk1"\nconsole.log(customer.id);`},Python:{f:'create.py',l:'py',hl:[4,5,6],code:`import nova\n\nnova.api_key = "sk_live_51Hx"\ncustomer = nova.Customer.create(\n    email="ada@studio.com",\n    plan="pro",\n)\n\n# customer.id -> "cus_8f2Qk1"\nprint(customer.id)`}};
function hi(c,l){const esc=c.replace(/&/g,'&amp;').replace(/</g,'&lt;');return esc.replace(/(\/\/.*|#.*)$|("[^"]*"|'[^']*')|\b(\d+)\b|\b([A-Za-z_]+)(?=\()|\b([A-Za-z_]+)\b/g,(m,cm,s,n,f,w)=>{if(cm)return '<span class="cm">'+cm+'</span>';if(s)return '<span class="s">'+s+'</span>';if(n)return '<span class="n">'+n+'</span>';if(f)return '<span class="f">'+f+'</span>';if(w&&K[l].includes(w))return '<span class="k">'+w+'</span>';return m})}
const tw=document.getElementById('tw'),ul=document.getElementById('ul'),pr=document.getElementById('pr');let cur='Node';
Object.keys(C).forEach(k=>{const b=document.createElement('button');b.className='t';b.role='tab';b.textContent=k;b.onclick=()=>show(k);tw.appendChild(b)});
function show(k){cur=k;const c=C[k];tw.querySelectorAll('.t').forEach(b=>{b.setAttribute('aria-selected',b.textContent===k);if(b.textContent===k){ul.style.left=b.offsetLeft+'px';ul.style.width=b.offsetWidth+'px'}});document.getElementById('fn').textContent=c.f;pr.innerHTML=c.code.split('\n').map((ln,i)=>'<div class="ln'+(c.hl.includes(i+1)?' hl':'')+'"><i>'+(i+1)+'</i><span>'+hi(ln,c.l)+'</span></div>').join('')}
show('Node');(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>show(cur));
document.getElementById('cp').onclick=e=>{const b=document.getElementById('cp');navigator.clipboard&&navigator.clipboard.writeText(C[cur].code).catch(()=>{});b.classList.add('ok');document.getElementById('cl').textContent='Copied';setTimeout(()=>{b.classList.remove('ok');document.getElementById('cl').textContent='Copy'},1700)};
</script></body></html>
