<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Avatar Shape Morph</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2EFE8;color:#1D1A14;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;border-radius:32px;background:#fff;padding:28px;display:grid;gap:24px;justify-items:center;text-align:center;box-shadow:0 30px 44px -30px rgba(29,26,20,.5),inset 0 0 0 1px rgba(29,26,20,.07)}
.hd h1{font-size:28px;font-weight:800;letter-spacing:-.05em}.hd p{color:#8A8269;font-size:14px;margin-top:6px}
.st{position:relative;width:220px;height:220px;display:grid;place-items:center}
.sh{position:absolute;inset:0;transition:filter .4s;filter:drop-shadow(0 22px 22px rgba(29,26,20,.25))}
.ph{position:absolute;inset:0;clip-path:var(--cp);background:var(--bg)}.ph svg{width:100%;height:100%;display:block}
.nm{font-size:20px;font-weight:800;letter-spacing:-.04em}.nm small{display:block;font:500 12px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:#9A9179;margin-top:4px}
.sp{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.b{display:grid;justify-items:center;gap:8px;border:0;background:none;font:700 12.500px 'Bricolage Grotesque';color:#6B6350;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.b:hover{transform:translateY(-3px)}
.b i{display:block;width:58px;height:58px;border-radius:18px;background:#F5F2EA;box-shadow:inset 0 0 0 1.500px rgba(29,26,20,.08);display:grid;place-items:center;transition:background .3s,box-shadow .3s}
.b i span{display:block;width:30px;height:30px;background:#BDB5A0;clip-path:var(--cp);transition:background .3s}
.b[aria-pressed=true]{color:#1D1A14}.b[aria-pressed=true] i{background:#1D1A14}.b[aria-pressed=true] i span{background:#FFD23F}.b:focus-visible{outline:3px solid #E8590C;outline-offset:3px;border-radius:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>One photo, any shape</h1><p>A true morph: every outline is 48 points, so the edge flows from one to the next.</p></div>
<div class="st"><div class="sh"><div class="ph" id="ph"></div></div></div><div class="nm" id="nm"></div><div class="sp" id="sp" role="group" aria-label="Avatar shape"></div></div>
<script>
const N=48,pt=(f)=>Array.from({length:N},(_,i)=>f(i/N*Math.PI*2));
const SH={
 Circle:pt(t=>[50+50*Math.cos(t),50+50*Math.sin(t)]),
 Squircle:pt(t=>{const c=Math.cos(t),s=Math.sin(t),n=4;return[50+50*Math.sign(c)*Math.pow(Math.abs(c),2/n),50+50*Math.sign(s)*Math.pow(Math.abs(s),2/n)]}),
 Hexagon:pt(t=>{const a=((t+Math.PI/2)%(Math.PI/3))-Math.PI/6,r=Math.cos(Math.PI/6)/Math.cos(a)*50;return[50+r*Math.cos(t),50+r*Math.sin(t)]}),
 Star:pt(t=>{const k=(1+Math.cos(5*(t-Math.PI/2)))/2,r=26+24*Math.pow(k,.7);return[50+r*Math.cos(t-Math.PI/2),50+r*Math.sin(t-Math.PI/2)]}),
 Blob:pt(t=>{const r=40+7*Math.sin(3*t+.6)+5*Math.cos(2*t+1.2)+3*Math.sin(5*t);return[50+r*Math.cos(t),50+r*Math.sin(t)]}),
 Diamond:pt(t=>{const c=Math.cos(t),s=Math.sin(t),r=50/(Math.abs(c)+Math.abs(s));return[50+r*c,50+r*s]})};
const names=Object.keys(SH);
function poly(a){return 'polygon('+a.map(p=>p[0].toFixed(2)+'% '+p[1].toFixed(2)+'%').join(',')+')'}
function face(s){const r=n=>{s=(s*9301+49297)%233280;return Math.floor(s/233280*n)};const sk=['#F2C9A5','#E0A57A','#B9784B','#8A5230','#5B3420','#F7D9C1'][r(6)],hr=['#1B1410','#3B2314','#7A4A21','#C9A15E','#B5361F','#6B6B73','#2D2A6B'][r(7)],bg=['#FFD6A5','#CAFFBF','#9BF6FF','#BDB2FF','#FFC6FF','#FDFFB6','#A0C4FF','#FFADAD'][r(8)],sh=['#6366F1','#EC4899','#0EA5E9','#10B981','#F59E0B','#8B5CF6'][r(6)],st=r(5),gl=r(3)===0,sm=r(3);
 let h='';if(st===1)h+='<path d="M24 52c-2-24 8-34 26-34s28 10 26 34c-2 12-6 16-6 16H30s-4-4-6-16Z" fill="'+hr+'"/>';
 let top='';if(st===0)top='<path d="M27 46c0-16 9-22 23-22s23 6 23 22c-6-8-14-10-23-10s-17 2-23 10Z" fill="'+hr+'"/>';else if(st===1)top='<path d="M27 48c0-17 9-24 23-24s23 7 23 24c-7-7-14-11-23-11s-16 4-23 11Z" fill="'+hr+'"/>';else if(st===2)top='<g fill="'+hr+'"><circle cx="31" cy="40" r="9"/><circle cx="42" cy="31" r="10"/><circle cx="56" cy="30" r="10"/><circle cx="68" cy="39" r="9"/><circle cx="50" cy="27" r="9"/></g>';else if(st===3)top='<g fill="'+hr+'"><path d="M28 46c0-14 8-20 22-20s22 6 22 20c-5-6-13-9-22-9s-17 3-22 9Z"/><circle cx="50" cy="20" r="8"/></g>';
 return '<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="'+bg+'"/>'+h+'<path d="M14 100c2-18 16-26 36-26s34 8 36 26Z" fill="'+sh+'"/><rect x="43" y="62" width="14" height="14" rx="6" fill="'+sk+'"/><ellipse cx="50" cy="48" rx="21" ry="24" fill="'+sk+'"/>'+top+'<circle cx="42" cy="50" r="2.200" fill="#2A1A12"/><circle cx="58" cy="50" r="2.200" fill="#2A1A12"/>'+(gl?'<g fill="none" stroke="#2A1A12" stroke-width="1.800"><circle cx="42" cy="50" r="6.500"/><circle cx="58" cy="50" r="6.500"/><path d="M48.500 50h3"/></g>':'')+'<path d="'+(sm===0?'M43 60q7 6 14 0':sm===1?'M44 60q6 4 12 0':'M43 59q7 8 14 0')+'" fill="none" stroke="#2A1A12" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="57" r="3.200" fill="#FF8A8A" opacity=".35"/><circle cx="64" cy="57" r="3.200" fill="#FF8A8A" opacity=".35"/></svg>'}
const ph=document.getElementById('ph'),sp=document.getElementById('sp'),nm=document.getElementById('nm');ph.innerHTML=face(208);
let cur=names.indexOf('Blob'),from=SH.Blob,to=SH.Blob,t0=0,raf;
function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function go(n){const i=names.indexOf(n);from=cur_pts();to=SH[n];cur=i;t0=performance.now();[...sp.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===i));nm.innerHTML=n+'<small>'+N+' points</small>';cancelAnimationFrame(raf);(function f(now){const k=Math.min(1,(now-t0)/700),e=ease(k);ph.style.setProperty('--cp',poly(to.map((p,j)=>[from[j][0]+(p[0]-from[j][0])*e,from[j][1]+(p[1]-from[j][1])*e])));cp=to.map((p,j)=>[from[j][0]+(p[0]-from[j][0])*e,from[j][1]+(p[1]-from[j][1])*e]);if(k<1)raf=requestAnimationFrame(f)})(t0)}
let cp=SH.Blob;function cur_pts(){return cp}
names.forEach(n=>{const b=document.createElement('button');b.className='b';b.setAttribute('aria-pressed','false');b.innerHTML='<i><span style="--cp:'+poly(SH[n])+'"></span></i>'+n;b.onclick=()=>{off=true;go(n)};sp.appendChild(b)});
ph.style.setProperty('--cp',poly(SH.Blob));go('Blob');
/* Idle demo: the portrait morphs through all six outlines every 2s. Each shape has the same 48 points, so the edge flows between them with an ease-in-out-cubic over 700ms, until a shape is chosen. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms)),ord=['Hexagon','Star','Circle','Diamond','Squircle','Blob'];(async()=>{await sleep(3000);let k=0;while(!off){go(ord[k++%6]);await sleep(2000)}})()}
</script></body></html>
