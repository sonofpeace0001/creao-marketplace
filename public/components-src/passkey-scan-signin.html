<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Passkey Scan Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(500px 360px at 50% 0%,#1E3A8A,transparent 70%),#070B18;color:#EAF0FF;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:420px;background:rgba(18,26,52,.7);backdrop-filter:blur(20px);border:1px solid #243258;border-radius:32px;padding:34px 30px 26px;text-align:center;box-shadow:0 40px 80px -30px #000}
.lg{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.04em;margin-bottom:18px}.lg i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#38BDF8,#6366F1)}
.c h1{font-size:25px;font-weight:800;letter-spacing:-.05em}.c p.sb{font-size:14.5px;color:#8FA0CC;margin:6px 0 22px}
.fp{position:relative;width:150px;height:150px;margin:0 auto 22px;cursor:pointer;border:0;background:none;border-radius:50%;outline:0}.fp:focus-visible{box-shadow:0 0 0 4px #38BDF8}
.fp .rg{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(56,189,248,.4)}.fp .rg.r2{inset:-14px;border-color:rgba(56,189,248,.22)}.fp .rg.r3{inset:-30px;border-color:rgba(56,189,248,.1)}
.fp.sc .rg{animation:rp 1.8s ease-out infinite}.fp.sc .r2{animation-delay:.3s}.fp.sc .r3{animation-delay:.6s}@keyframes rp{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.fp .cr{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1F3A78,#0F1D44);border:1.5px solid #2F4A8C;overflow:hidden;display:grid;place-items:center;box-shadow:0 20px 40px -16px #38BDF8}
.fp svg.f{width:78px;height:78px;color:#38BDF8;transition:color .4s}
.fp .ln{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#7DD3FC,transparent);box-shadow:0 0 18px 4px #38BDF8;opacity:0}.fp.sc .ln{opacity:1;animation:sc 1.4s ease-in-out infinite}@keyframes sc{0%{top:8%}50%{top:90%}100%{top:8%}}
.fp .ok{position:absolute;inset:0;border-radius:50%;background:#16A34A;display:grid;place-items:center;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.7,.5,1)}.fp.dn .ok{transform:scale(1)}.ok svg path{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .4s .3s}.fp.dn .ok svg path{stroke-dashoffset:0}
.st{height:22px;font-size:14.5px;font-weight:600;color:#9DB0DC;margin-bottom:20px;transition:color .3s}.st.ok2{color:#4ADE80}
.us{display:flex;align-items:center;gap:12px;background:#0F1834;border:1px solid #1F2C52;border-radius:16px;padding:10px 14px;text-align:left;margin-bottom:14px}.us i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:grid;place-items:center;font:800 13px 'Manrope';font-style:normal}.us b{display:block;font-size:14.5px}.us span{font-size:12.5px;color:#7E90BE}.us button{margin-left:auto;border:0;background:none;color:#7DD3FC;font:600 13px 'Manrope';cursor:pointer}.us button:focus-visible{outline:2px solid #38BDF8;border-radius:4px}
.alt{display:flex;flex-direction:column;gap:8px}.alt button{height:48px;border-radius:14px;border:1px solid #243258;background:#0F1834;color:#DCE6FF;font:600 14.5px 'Manrope';cursor:pointer;transition:border-color .2s}.alt button:hover{border-color:#38BDF8}.alt button:focus-visible{outline:2px solid #38BDF8}
.ft{margin-top:18px;font-size:12.5px;color:#677AA8}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="lg"><i></i>Meridian</div><h1>Welcome back</h1><p class="sb">Touch the sensor to sign in with your passkey.</p>
<button class="fp sc" id="fp" aria-label="Sign in with passkey"><span class="rg r3"></span><span class="rg r2"></span><span class="rg"></span><span class="cr"><svg class="f" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.400" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a3 3 0 0 0-3 3c0 2-.5 4-1.500 6M12 11a3 3 0 0 1 3 3c0 1.500.2 3 .6 4.200M7 8.400A6 6 0 0 1 18 11c0 1 0 2.200.2 3.200M5 14c0-1 0-2 .2-3M3 12a9 9 0 0 1 14.600-7M12 14c0 2.500-.6 4.500-1.200 6M9 21c.8-1.700 1.300-3.500 1.600-5.400M21 12.500c0 2 .3 3.800.7 5"/></svg><span class="ln"></span></span><span class="ok"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span></button>
<div class="st" id="st" role="status">Scanning for your fingerprint...</div>
<div class="us"><i>MR</i><div><b>Maya Rowe</b><span>maya@northwind.co</span></div><button>Switch</button></div>
<div class="alt"><button>Use password instead</button><button>Email me a sign-in link</button></div><div class="ft">Passkeys are phishing resistant and never leave your device.</div></div>
<script>
const fp=document.getElementById('fp'),st=document.getElementById('st');let tm;
function scan(){clearTimeout(tm);fp.classList.remove('dn');fp.classList.add('sc');st.classList.remove('ok2');st.textContent='Scanning for your fingerprint...';tm=setTimeout(done,2600)}
function done(){fp.classList.remove('sc');fp.classList.add('dn');st.classList.add('ok2');st.textContent='Verified. Signing you in...';tm=setTimeout(scan,2800)}
fp.onclick=()=>{if(fp.classList.contains('dn'))scan();else{clearTimeout(tm);done()}};
scan();
</script></body></html>
