<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Marching Borders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EDEBE4;color:#17181C;font-family:'Archivo',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;width:100%;max-width:640px}
.m{position:relative;border-radius:20px;padding:26px 22px;background:#FBFAF6;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;border:0;color:inherit;font:inherit}
.m svg.b{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.m svg.b rect{fill:none;stroke:var(--c);stroke-width:2.5;stroke-dasharray:9 7;animation:mv 1s linear infinite;transition:stroke-width .2s}
.m:hover svg.b rect{stroke-width:3.5;animation-duration:.4s}.m:focus-visible{outline:3px solid #17181C;outline-offset:4px}
@keyframes mv{to{stroke-dashoffset:-32}}
.m i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff}
.m b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:18px}.m span{font:500 14px 'Archivo Narrow';color:#6C6E78;letter-spacing:.02em;margin-top:2px;display:block}
.m.sel{background:color-mix(in srgb,var(--c) 10%,#FBFAF6)}.m.sel svg.b rect{stroke-dasharray:none;animation:none;stroke-width:3}
.ck{position:absolute;right:16px;top:16px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.m.sel .ck{transform:scale(1)}
.hd{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}.hd h1{font-size:24px;font-weight:800;letter-spacing:-.04em}.hd span{font:500 14px 'Archivo Narrow';color:#6C6E78}
@media(max-width:480px){.g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.m svg.b rect{animation:none}}
</style></head><body>
<div class="g"><div class="hd"><h1>Pick your starting point</h1><span id="st">None selected</span></div>
<button class="m" style="--c:#E8472B"><svg class="b"><rect x="1.250" y="1.250" rx="19" style="width:calc(100% - 2.5px);height:calc(100% - 2.5px)"/></svg><span class="ck"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><div><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></i><b>Blank canvas</b><span>Start from nothing</span></div></button>
<button class="m" style="--c:#2563EB"><svg class="b"><rect x="1.250" y="1.250" rx="19" style="width:calc(100% - 2.5px);height:calc(100% - 2.5px)"/></svg><span class="ck"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><div><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg></i><b>From template</b><span>40+ ready layouts</span></div></button>
<button class="m" style="--c:#0E9F6E"><svg class="b"><rect x="1.250" y="1.250" rx="19" style="width:calc(100% - 2.5px);height:calc(100% - 2.5px)"/></svg><span class="ck"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><div><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></i><b>Import file</b><span>Figma, CSV or Notion</span></div></button>
<button class="m" style="--c:#9333EA"><svg class="b"><rect x="1.250" y="1.250" rx="19" style="width:calc(100% - 2.5px);height:calc(100% - 2.5px)"/></svg><span class="ck"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><div><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/></svg></i><b>Ask the AI</b><span>Describe it in a line</span></div></button></div>
<script>
const M=[...document.querySelectorAll('.m')];
M.forEach(m=>m.addEventListener('click',()=>{M.forEach(x=>x.classList.toggle('sel',x===m));document.getElementById('st').textContent='Selected: '+m.querySelector('b').textContent;M.forEach(x=>x.setAttribute('aria-pressed',x===m))}));
M.forEach(m=>m.setAttribute('aria-pressed','false'));
</script></body></html>
