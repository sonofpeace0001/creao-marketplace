<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stroke Weight Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--w:2;--c:#2F4BFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EFF1F8;color:#14193A;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:620px;background:#fff;border-radius:30px;padding:26px;box-shadow:0 36px 60px -38px rgba(20,25,58,.5),0 0 0 1px rgba(20,25,58,.06)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hd h1{font-size:22px;font-weight:800;letter-spacing:-.04em}.hd p{font-size:14px;color:#6A7096;margin-top:3px}
.ct{background:#F4F6FD;border-radius:18px;padding:12px 16px;min-width:230px}
.ct div{display:flex;justify-content:space-between;font:500 12px 'DM Mono',monospace;color:#6A7096;margin-bottom:8px}.ct b{color:#14193A;font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:#DCE1F5;outline:0;display:block}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 8px rgba(47,75,255,.5);cursor:grab}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid #fff}
input:focus-visible{box-shadow:0 0 0 4px rgba(47,75,255,.2)}
.sw{display:flex;gap:7px;margin-top:11px}.sw button{width:20px;height:20px;border-radius:50%;border:0;background:var(--k);cursor:pointer;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(20,25,58,.15)}.sw button[aria-pressed=true]{box-shadow:0 0 0 2px #fff,0 0 0 4px #14193A}.sw button:focus-visible{outline:2px solid #14193A;outline-offset:3px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.t{aspect-ratio:1;border-radius:20px;border:1.5px solid #E6E9F6;background:#FAFBFF;display:grid;place-items:center;align-content:center;gap:9px;color:var(--c);transition:all .2s}
.t:hover{background:#fff;border-color:var(--c);transform:translateY(-3px);box-shadow:0 14px 22px -14px var(--c)}
.t svg{width:32px;height:32px;stroke-width:var(--w)}.t span{font-size:12px;font-weight:700;color:#6A7096}
.ft{margin-top:18px;display:flex;justify-content:space-between;font:500 12px 'DM Mono',monospace;color:#8A90B8}
@media(max-width:520px){.g{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Stroke studio</h1><p>One icon family, any weight.</p></div><div class="ct"><div><span>STROKE</span><b id="v">2.0 px</b></div><input id="r" type="range" min="1" max="3" step=".25" value="2" aria-label="Stroke weight"><div class="sw" id="sw"></div></div></div>
<div class="g" id="g"></div><div class="ft"><span>24 × 24 grid</span><span>Round caps · round joins</span></div></div>
<script>
const I=[['Home','<path d="m3 11 9-8 9 8M5 10v10h5v-6h4v6h5V10"/>'],['Search','<circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/>'],['Alerts','<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.300 21a1.900 1.900 0 0 0 3.400 0"/>'],['Mail','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'],['People','<circle cx="9" cy="8" r="3.500"/><path d="M3 20a6 6 0 0 1 12 0M17 4a3.500 3.500 0 0 1 0 7M21 20a6 6 0 0 0-4-5.600"/>'],['Saved','<path d="M6 3h12v18l-6-4-6 4Z"/>'],['Cloud','<path d="M7 18a4.500 4.500 0 0 1-.6-8.960A6 6 0 0 1 18 10a4 4 0 0 1-1 8Z"/>'],['Settings','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.200 4.200l2.100 2.100M17.700 17.700l2.100 2.100M2 12h3M19 12h3M4.200 19.800l2.100-2.100M17.700 6.300l2.100-2.100"/>']];
document.getElementById('g').innerHTML=I.map(i=>'<div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'+i[1]+'</svg><span>'+i[0]+'</span></div>').join('');
const r=document.getElementById('r'),v=document.getElementById('v'),root=document.documentElement.style;
r.addEventListener('input',()=>{root.setProperty('--w',r.value);v.textContent=(+r.value).toFixed(2).replace(/0$/,'')+' px'});
const C=['#2F4BFF','#E8530E','#0E9F6E','#C026D3','#14193A'];const sw=document.getElementById('sw');sw.innerHTML=C.map((c,i)=>'<button style="--k:'+c+'" aria-pressed="'+(i===0)+'" aria-label="Colour '+(i+1)+'"></button>').join('');
sw.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;root.setProperty('--c',b.style.getPropertyValue('--k'));[...sw.children].forEach(x=>x.setAttribute('aria-pressed',x===b))});
</script></body></html>
