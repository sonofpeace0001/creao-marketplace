<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Glitch Text Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Space+Mono:wght@400;700&family=Anton&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05060A;color:#F2F4FF;font-family:'Space Mono',monospace;min-height:100vh;display:grid;place-items:center;padding:24px 4vw;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none;z-index:5}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7));pointer-events:none;z-index:4}
.c{width:100%;max-width:1000px;text-align:center;position:relative;z-index:2}
.tp{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#00F0FF;margin-bottom:20px}.tp b{color:#FF2E7E;font-weight:700}
.gl{position:relative;display:inline-block;font:400 clamp(70px,16vw,210px)/.92 'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;color:#F2F4FF;cursor:default}
.gl::before,.gl::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.gl::before{color:#FF2E7E;transform:translate(var(--dx,-3px),0);clip-path:var(--c1,inset(0 0 55% 0));animation:g1 2.6s steps(1) infinite;mix-blend-mode:screen}
.gl::after{color:#00F0FF;transform:translate(calc(var(--dx,-3px)*-1),0);clip-path:var(--c2,inset(55% 0 0 0));animation:g2 2.6s steps(1) infinite;mix-blend-mode:screen}
@keyframes g1{0%{clip-path:inset(0 0 80% 0);transform:translate(-4px,0)}8%{clip-path:inset(30% 0 40% 0);transform:translate(5px,-2px)}12%{clip-path:inset(62% 0 10% 0);transform:translate(-6px,1px)}16%{clip-path:inset(0 0 55% 0);transform:translate(-2px,0)}60%{clip-path:inset(10% 0 70% 0);transform:translate(3px,0)}64%{clip-path:inset(48% 0 24% 0);transform:translate(-5px,2px)}68%,100%{clip-path:inset(0 0 55% 0);transform:translate(-2px,0)}}
@keyframes g2{0%{clip-path:inset(70% 0 0 0);transform:translate(4px,0)}8%{clip-path:inset(12% 0 60% 0);transform:translate(-5px,2px)}12%{clip-path:inset(40% 0 38% 0);transform:translate(6px,-1px)}16%{clip-path:inset(55% 0 0 0);transform:translate(2px,0)}60%{clip-path:inset(60% 0 15% 0);transform:translate(-3px,0)}64%{clip-path:inset(20% 0 52% 0);transform:translate(5px,-2px)}68%,100%{clip-path:inset(55% 0 0 0);transform:translate(2px,0)}}
.gl.hv::before,.gl:hover::before{animation-duration:.35s}.gl.hv::after,.gl:hover::after{animation-duration:.35s}
.gl .sk{position:relative;display:block;animation:sk 2.6s steps(1) infinite}@keyframes sk{0%,13%,17%,61%,67%,100%{transform:none}14%{transform:skewX(-6deg) translateX(3px)}62%{transform:skewX(5deg) translateX(-4px)}}
.sb{font-size:clamp(14px,1.8vw,18px);line-height:1.7;color:#8C93B5;max-width:46ch;margin:26px auto 30px}.sb em{font-style:normal;color:#00F0FF}
.bt{display:inline-flex;gap:14px}.bt a{padding:14px 28px;font:700 14px 'Space Mono';letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border:2px solid #00F0FF;color:#00F0FF;position:relative;transition:all .2s}.bt a.p{background:#00F0FF;color:#05060A;box-shadow:5px 5px 0 #FF2E7E}.bt a:hover{transform:translate(-2px,-2px)}.bt a.p:hover{box-shadow:8px 8px 0 #FF2E7E}.bt a:focus-visible{outline:3px solid #fff;outline-offset:4px}
@media(prefers-reduced-motion:reduce){.gl::before,.gl::after,.gl .sk{animation:none}}
</style></head><body>
<div class="c"><div class="tp"><b>///</b> signal lost <b>///</b></div><h1 class="gl hv" data-t="System Error"><span class="sk">System Error</span></h1><p class="sb">Reality is <em>glitching</em>. Hover the title to destabilize it, or stay calm and watch it tear on its own.</p><div class="bt"><a class="p" href="#">Reboot</a><a href="#">Read the logs</a></div></div>
<script>document.querySelector('.gl').addEventListener('mouseenter',e=>e.currentTarget.classList.remove('hv'));</script>
</body></html>
