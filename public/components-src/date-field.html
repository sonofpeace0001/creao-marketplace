<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Date Picker Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3F1EC;color:#1D2A24;font-family:'Instrument Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 18px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:340px;min-height:500px}
label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;color:#34463D}
.f{position:relative}
.in{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #D6DDD7;border-radius:14px;padding:14px 16px;font:500 16px 'Instrument Sans';color:#1D2A24;cursor:pointer;text-align:left;transition:all .2s}
.in:hover{border-color:#A9B8AE}.in[aria-expanded=true]{border-color:#16794E;box-shadow:0 0 0 4px rgba(22,121,78,.14)}.in:focus-visible{outline:0;border-color:#16794E;box-shadow:0 0 0 4px rgba(22,121,78,.14)}
.in svg{color:#5E7367;flex:none}.in span{flex:1}.in .ph{color:#8E9E94}
.pop{position:absolute;left:0;top:calc(100% + 10px);width:320px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 30px 50px -20px rgba(29,42,36,.45),0 0 0 1px rgba(29,42,36,.08);opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top left;pointer-events:none;transition:all .22s;z-index:5}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.hd b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.hd button{width:34px;height:34px;border:0;border-radius:10px;background:#F2F5F2;color:#34463D;cursor:pointer;display:grid;place-items:center}.hd button:hover{background:#E4EBE5}.hd button:focus-visible{outline:2px solid #16794E}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.dn{text-align:center;font-size:11.5px;font-weight:600;color:#8E9E94;padding:6px 0}
.d{aspect-ratio:1;border:0;border-radius:50%;background:none;font:500 14px 'Instrument Sans';color:#2A3A32;cursor:pointer;transition:background .15s}
.d:hover{background:#EAF2EC}.d.o{color:#BCC7BF}.d.t{box-shadow:inset 0 0 0 1.5px #16794E;font-weight:700}.d.s{background:#16794E;color:#fff;font-weight:700}.d:focus-visible{outline:2px solid #16794E;outline-offset:-2px}
.ft{display:flex;justify-content:space-between;margin-top:10px;padding-top:12px;border-top:1px solid #EEF1EE}
.ft button{border:0;background:none;font:600 13.5px 'Instrument Sans';color:#16794E;cursor:pointer;padding:6px 8px;border-radius:8px}.ft button:hover{background:#EAF2EC}
.nt{margin-top:200px;font-size:13px;color:#7A8A80;text-align:center;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><label for="b">Check-in date</label><div class="f"><button class="in" id="b" aria-haspopup="dialog" aria-expanded="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.500" y="5" width="17" height="15.500" rx="3"/><path d="M3.500 10h17M8 3v4M16 3v4"/></svg><span id="v" class="ph">Select a date</span></button>
 <div class="pop on" id="p" role="dialog" aria-label="Choose a date"><div class="hd"><button id="pv" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><b id="t"></b><button id="nx" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div><div class="g" id="g"></div><div class="ft"><button id="td">Today</button><button id="cl">Clear</button></div></div></div></div>
<script>
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],DN=['Mo','Tu','We','Th','Fr','Sa','Su'];
const n=new Date();let y=n.getFullYear(),m=n.getMonth(),sel=new Date(y,m,Math.min(n.getDate()+3,28));
const g=document.getElementById('g'),b=document.getElementById('b'),p=document.getElementById('p');
const fmt=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'});
function draw(){document.getElementById('t').textContent=MN[m]+' '+y;const f=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),pr=new Date(y,m,0).getDate();let h=DN.map(d=>'<div class="dn">'+d+'</div>').join('');
 for(let i=0;i<42;i++){let d=i-f+1,o=0,mm=m,yy=y;if(d<1){d+=pr;o=1;mm=m-1}else if(d>dim){d-=dim;o=1;mm=m+1}const dt=new Date(yy,mm,d),t=dt.toDateString()===n.toDateString(),s=sel&&dt.toDateString()===sel.toDateString();
  h+='<button class="d'+(o?' o':'')+(t?' t':'')+(s?' s':'')+'" data-t="'+dt.getTime()+'" aria-label="'+fmt(dt)+'"'+(s?' aria-pressed="true"':'')+'>'+d+'</button>'}
 g.innerHTML=h;const v=document.getElementById('v');v.textContent=sel?fmt(sel):'Select a date';v.className=sel?'':'ph'}
function set(o){p.classList.toggle('on',o);b.setAttribute('aria-expanded',o)}
b.onclick=()=>set(!p.classList.contains('on'));g.addEventListener('click',e=>{const d=e.target.closest('.d');if(!d)return;sel=new Date(+d.dataset.t);m=sel.getMonth();y=sel.getFullYear();draw();set(false)});
document.getElementById('pv').onclick=()=>{m--;if(m<0){m=11;y--}draw()};document.getElementById('nx').onclick=()=>{m++;if(m>11){m=0;y++}draw()};
document.getElementById('td').onclick=()=>{sel=new Date();m=sel.getMonth();y=sel.getFullYear();draw();set(false)};document.getElementById('cl').onclick=()=>{sel=null;draw()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){set(false);b.focus()}});document.addEventListener('click',e=>{if(!e.target.closest('.f'))set(false)});draw();
</script></body></html>
