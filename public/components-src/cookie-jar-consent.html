<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cookie Jar Consent</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3E8D6;color:#3A2410;font-family:'Nunito',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(600px 380px at 20% 0,rgba(214,150,70,.25),transparent 70%)}
.cd{width:100%;max-width:700px;background:#FFFAF0;border-radius:32px;padding:28px;box-shadow:0 40px 56px -34px rgba(58,36,16,.55),inset 0 0 0 1px rgba(58,36,16,.1);display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:center}
.jr{position:relative;width:230px;height:290px}.jr svg{width:100%;height:100%;overflow:visible}
.ck{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E6B070,#C0813E 60%,#8B5A26);box-shadow:inset 0 -3px 5px rgba(0,0,0,.25);opacity:0;transform:translateY(-260px) rotate(var(--r));z-index:2}
.ck::before,.ck::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#4A2A10}.ck::before{left:9px;top:9px;box-shadow:12px 4px 0 #4A2A10,2px 13px 0 #4A2A10}.ck::after{left:21px;top:20px;box-shadow:-6px 5px 0 #4A2A10}
.ck.on{opacity:1;transform:translateY(0) rotate(var(--r));animation:dr .9s cubic-bezier(.5,0,.8,.6) both}@keyframes dr{0%{transform:translateY(-260px) rotate(0);opacity:1}60%{transform:translateY(0) rotate(var(--r))}75%{transform:translateY(-14px) rotate(var(--r))}88%{transform:translateY(0) rotate(var(--r))}94%{transform:translateY(-4px) rotate(var(--r))}100%{transform:translateY(0) rotate(var(--r))}}
.ck.off{animation:ff .35s ease-in forwards}@keyframes ff{to{opacity:0;transform:translateY(-40px) scale(.5) rotate(var(--r))}}
.rt{}.rt h1{font:800 31px/1.05 'Fraunces',serif;letter-spacing:-.03em;margin-bottom:6px}.rt>p{font-size:14.500px;line-height:1.5;color:#8A6B4A;margin-bottom:18px}
.ct{display:grid;gap:8px;margin-bottom:16px}.rw{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px #F0E1CB}.rw b{display:block;font-size:15px;font-weight:800}.rw span{font-size:12.500px;color:#9A7C5A}.rw em{margin-left:auto;font:800 12.500px 'Nunito';font-style:normal;color:#C0813E;min-width:44px;text-align:right}
.sw{position:relative;flex:none;width:46px;height:26px;border-radius:99px;background:#E7D5BA;cursor:pointer;transition:background .3s;border:0}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}.sw.on{background:#C0813E}.sw.on::after{transform:translateX(20px)}.sw.lk{opacity:.55;cursor:not-allowed}.sw:focus-visible{outline:3px solid #3A2410;outline-offset:2px}
.bt{display:flex;gap:9px}.bt button{flex:1;border:0;border-radius:15px;padding:13px;font:800 14.500px 'Nunito';cursor:pointer;transition:transform .15s}.bt .a{background:#3A2410;color:#fff}.bt .r{background:#F3E4CC;color:#3A2410}.bt .pr{transform:scale(.95)}.bt button:focus-visible{outline:3px solid #C0813E;outline-offset:2px}
@media(max-width:620px){.cd{grid-template-columns:1fr;justify-items:center}.rt{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="cd"><div class="jr" id="jr"><svg viewBox="0 0 230 290"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset=".25" stop-color="#E9F0F4" stop-opacity=".25"/><stop offset=".8" stop-color="#C9D8E0" stop-opacity=".35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".6"/></linearGradient></defs>
<ellipse cx="115" cy="278" rx="84" ry="9" fill="rgba(58,36,16,.18)"/><rect x="50" y="22" width="130" height="30" rx="9" fill="#3A2410"/><rect x="42" y="46" width="146" height="14" rx="7" fill="#5A3A1E"/><path d="M52 62h126a6 6 0 0 1 6 6v6c10 12 14 30 14 54v108c0 22-14 36-36 36H68c-22 0-36-14-36-36V128c0-24 4-42 14-54v-6a6 6 0 0 1 6-6Z" fill="url(#gl)" stroke="#BFD0DA" stroke-width="3"/><path d="M52 82v160" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/></svg><div id="ck"></div></div>
<div class="rt"><h1>Fresh batch, your choice.</h1><p>Pick which cookies go in the jar. Essentials are always baked in.</p><div class="ct" id="ct"></div><div class="bt"><button class="r" id="re">Only essentials</button><button class="a" id="ac">Accept all</button></div></div></div>
<script>
const CAT=[['Essential','Keeps the site secure and working',3,true],['Preferences','Language, region and layout',2],['Analytics','Anonymous usage statistics',4],['Marketing','Personalised offers and ads',5]];
const $=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let off=false;const st=CAT.map(c=>!!c[3]);
const POS=[];const rows=[[115,246],[78,246],[152,246],[95,214],[135,214],[115,184],[78,215],[152,215],[96,178],[134,178],[115,148],[78,182],[152,182],[96,142],[134,142]];
const cks=[];let idx=0;CAT.forEach((c,ci)=>{for(let k=0;k<c[2];k++){const e=document.createElement('i');e.className='ck';const p=rows[idx++];e.style.cssText='left:'+p[0]+'px;top:'+(p[1]-0)+'px;--r:'+(Math.round(Math.random()*60-30))+'deg;animation-delay:'+(k*90)+'ms';e.dataset.c=ci;$('ck').appendChild(e);cks.push(e)}});
$('ck').style.cssText='position:absolute;inset:0;pointer-events:none';
const sws=CAT.map((c,i)=>{const d=document.createElement('div');d.className='rw';d.innerHTML='<div><b>'+c[0]+'</b><span>'+c[1]+'</span></div><em></em><button class="sw'+(c[3]?' on lk':'')+'" role="switch" aria-checked="'+!!c[3]+'" aria-label="'+c[0]+'"></button>';const b=d.querySelector('.sw');if(!c[3])b.onclick=()=>{off=true;set(i,!st[i])};$('ct').appendChild(d);return b});
function set(i,v,inst){st[i]=v;sws[i].classList.toggle('on',v);sws[i].setAttribute('aria-checked',v);sws[i].parentNode.querySelector('em').textContent=v?CAT[i][2]+' cookies':'';cks.filter(c=>+c.dataset.c===i).forEach((c,k)=>{c.classList.remove('on','off');void c.offsetWidth;if(v){if(inst){c.style.animation='none';c.classList.add('on')}else c.classList.add('on')}else{if(c.style.opacity!=='')c.style.animation='';if(!inst)c.classList.add('off')}})}
function all(v){for(let i=1;i<CAT.length;i++)set(i,v)}
set(0,true,true);set(1,true,true);set(2,true,true);set(3,false,true);cks.forEach(c=>{if(c.classList.contains('on'))c.style.animation='none'});
$('ac').onclick=()=>{off=true;all(true)};$('re').onclick=()=>{off=true;all(false)};
async function press(id){const b=$(id);b.classList.add('pr');await sl(240);b.classList.remove('pr')}
document.querySelector('.cd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a glass cookie jar fills as consent is given; essential cookies already sit at the bottom, then Marketing is switched on and five cookies drop in and bounce onto the pile, Accept all presses and the remaining categories fill the jar to the brim, and Only essentials empties it, each cookie shrinking away upward, then the cycle repeats, until you flip a switch or press a button. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){set(3,true);await sl(2200);if(off)return;await press('re');all(false);await sl(1800);await press('ac');all(true);await sl(3200);if(off)return;set(3,false);await sl(1400);set(2,false);await sl(1400);set(2,true);await sl(800);set(3,true);set(3,false);set(3,true);await sl(1500);set(3,false)}})()}
</script></body></html>
