<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quick Switcher Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7E9EF;color:#16192B;font-family:'Onest',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.pl{width:100%;max-width:720px;background:#fff;border-radius:22px;box-shadow:0 44px 70px -34px rgba(22,25,43,.6),0 0 0 1px rgba(22,25,43,.08);overflow:hidden}
.in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #EEF0F5}.in svg{width:18px;height:18px;stroke:#8A90AB;stroke-width:2;fill:none;stroke-linecap:round;flex:none}.in div{flex:1;font:500 17px 'Onest';min-height:24px}.in div i{display:inline-block;width:2px;height:18px;background:#4F46E5;vertical-align:-3px;margin-left:1px;animation:bk .8s steps(2) infinite}@keyframes bk{50%{opacity:0}}.in kbd{font:500 11px 'JetBrains Mono';padding:3px 8px;border-radius:7px;background:#F1F3F8;color:#7A819F}
.bd{display:grid;grid-template-columns:1.1fr 1fr;height:320px}
.ls{position:relative;padding:8px;overflow:hidden;border-right:1px solid #EEF0F5}.ls h4{font:600 10.500px 'JetBrains Mono';letter-spacing:.16em;color:#9AA1BC;margin:8px 10px 6px}
.hl{position:absolute;left:8px;right:8px;height:46px;border-radius:12px;background:#EEF0FF;box-shadow:inset 3px 0 0 #4F46E5;transition:transform .35s cubic-bezier(.3,1.3,.4,1);top:0}
.it{position:relative;display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;font-size:14.500px;font-weight:500;transition:opacity .3s,transform .4s cubic-bezier(.3,1.3,.4,1)}.it .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 10px 'JetBrains Mono';color:#fff;background:var(--c)}.it>span:last-child{margin-left:auto;font:400 11.500px 'JetBrains Mono';color:#9AA1BC}.it mark{background:none;color:#4F46E5;font-weight:700}.it.out{opacity:0;transform:translateX(-14px)}
.pv{padding:16px;background:#FAFBFD;display:flex;flex-direction:column;gap:10px}.pv h4{font:600 10.500px 'JetBrains Mono';letter-spacing:.16em;color:#9AA1BC}
.pv .fi{display:flex;align-items:center;gap:10px}.pv .fi b{font-size:15px}.pv .fi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 11px 'JetBrains Mono';color:#fff;background:var(--c);transition:background .3s}
.pv .cd{flex:1;border-radius:12px;background:#14172B;padding:12px 14px;font:400 11.500px/1.7 'JetBrains Mono';color:#B6BCE0;overflow:hidden}.pv .cd div{white-space:nowrap}.pv .cd .k{color:#F29E74}.pv .cd .f{color:#8FD1B8}.pv .cd .s{color:#E8C877}.pv .cd .c{color:#6E7599}
.pv.sw .cd,.pv.sw .fi{opacity:0;transform:translateY(6px)}.pv .cd,.pv .fi{transition:opacity .25s,transform .35s}
.ft{display:flex;gap:16px;padding:10px 18px;border-top:1px solid #EEF0F5;background:#FAFBFD;font-size:12px;color:#7A819F}.ft kbd{font:500 10.500px 'JetBrains Mono';padding:2px 6px;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1px #DFE2EC;margin-right:5px;transition:transform .15s,background .15s}.ft kbd.pr{transform:translateY(2px);background:#E4E7F6}
@media(max-width:620px){.bd{grid-template-columns:1fr}.pv{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="pl" id="pl"><div class="in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.300-4.300"/></svg><div><span id="tx"></span><i></i></div><kbd>⌘ P</kbd></div>
<div class="bd"><div class="ls" id="ls"><i class="hl" id="hl"></i></div><div class="pv" id="pv"><h4>PREVIEW</h4><div class="fi"><span class="ic" id="pi">TS</span><b id="pn">pricing-table.tsx</b></div><div class="cd" id="pc"></div></div></div>
<div class="ft"><span><kbd id="k1">↑</kbd><kbd id="k2">↓</kbd>navigate</span><span><kbd id="k3">↵</kbd>open</span><span><kbd>esc</kbd>close</span></div></div>
<script>
const F=[['pricing-table.tsx','TS','#3178C6','src/components',['<span class="k">export function</span> <span class="f">PricingTable</span>({ plans }) {','  <span class="k">return</span> (','    &lt;<span class="f">Grid</span> cols={plans.length}&gt;','      {plans.map(p =&gt; &lt;<span class="f">Plan</span> {...p} /&gt;)}','    &lt;/<span class="f">Grid</span>&gt;','  );','}']],['product-page.tsx','TS','#3178C6','src/pages',['<span class="k">export default function</span> <span class="f">ProductPage</span>() {','  <span class="k">const</span> { data } = <span class="f">useProduct</span>();','  <span class="k">return</span> &lt;<span class="f">Hero</span> product={data} /&gt;;','}']],['profile.css','CSS','#E5522B','src/styles',['<span class="f">.profile</span> {','  display: <span class="s">grid</span>;','  gap: <span class="s">24px</span>;','}','<span class="f">.profile__avatar</span> { border-radius: <span class="s">50%</span>; }']],['pipeline.yml','YML','#0F9D6E','.github/workflows',['<span class="f">name</span>: <span class="s">release</span>','<span class="f">on</span>:','  push: { branches: [<span class="s">main</span>] }','<span class="f">jobs</span>:','  build: { runs-on: <span class="s">ubuntu-latest</span> }']],['README.md','MD','#6B7390','/',['<span class="k">#</span> Atlas','<span class="c">A fast, friendly design system.</span>','','<span class="k">##</span> Getting started','npm install atlas-ui']],['prompts.json','JSON','#B45309','config',['{','  <span class="f">"model"</span>: <span class="s">"fast-1"</span>,','  <span class="f">"temperature"</span>: <span class="s">0.4</span>','}']]];
const ls=document.getElementById('ls'),hl=document.getElementById('hl'),$=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let rows=[],off=false,idx=0,q='';
function fz(n,q){if(!q)return true;let i=0;for(const c of n.toLowerCase()){if(c===q[i])i++;if(i===q.length)return true}return false}
function mk(n,q){if(!q)return n;let o='',i=0;for(const c of n){if(i<q.length&&c.toLowerCase()===q[i]){o+='<mark>'+c+'</mark>';i++}else o+=c}return o}
const els=F.map((f,i)=>{const d=document.createElement('div');d.className='it';d.style.setProperty('--c',f[2]);d.innerHTML='<span class="ic">'+f[1]+'</span><b class="n"></b><span>'+f[3]+'</span>';d.onclick=()=>{off=true};ls.appendChild(d);return d});
ls.insertBefore(hl,ls.firstChild);const hd=document.createElement('h4');hd.textContent='FILES';ls.insertBefore(hd,els[0]);
function render(){const vis=F.map((f,i)=>i).filter(i=>fz(F[i][0],q));els.forEach((e,i)=>{const on=vis.includes(i);e.style.display=on?'':'none';if(on){e.classList.remove('out');e.querySelector('.n').innerHTML=mk(F[i][0],q)}});rows=vis;if(idx>=rows.length)idx=0;sel(idx)}
function sel(k){idx=k;const i=rows[k];if(i===undefined)return;hl.style.transform='translateY('+(els[i].offsetTop)+'px)';const f=F[i],pv=$('pv');pv.classList.add('sw');setTimeout(()=>{$('pi').textContent=f[1];$('pi').style.setProperty('--c',f[2]);$('pi').style.background=f[2];$('pn').textContent=f[0];$('pc').innerHTML=f[4].map(l=>'<div>'+l+'</div>').join('');pv.classList.remove('sw')},180)}
function press(id){const k=$(id);k.classList.add('pr');setTimeout(()=>k.classList.remove('pr'),180)}
q='pro';$('tx').textContent='pro';render();document.getElementById('pl').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: a fuzzy file switcher; letters are typed into the search box and the list filters live, matched letters turning indigo and non-matching files sliding out, while an indigo highlight with a left rule glides to the top result and the preview pane on the right fades to that file's icon, name and syntax-coloured code, then the arrow keys at the bottom depress as the selection steps down and the query is cleared, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){for(const s of ['p','pr','pro']){q=s;$('tx').textContent=s;render();await sl(650)}await sl(900);press('k2');idx=Math.min(rows.length-1,idx+1);sel(idx);await sl(1300);press('k1');idx=0;sel(0);await sl(1100);press('k3');await sl(500);for(let i=2;i>=0;i--){q='pro'.slice(0,i);$('tx').textContent=q;render();await sl(380)}await sl(900);q='';$('tx').textContent='';idx=0;render();await sl(1100);for(const s of ['p','pr','pro']){}}})()}
</script></body></html>
