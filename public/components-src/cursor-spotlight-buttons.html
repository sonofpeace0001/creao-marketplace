<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cursor Spotlight Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0B;color:#EDEDEF;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:700px;display:grid;gap:30px;justify-items:center;text-align:center}
.w h1{font-size:clamp(24px,4.4vw,36px);font-weight:700;letter-spacing:-.04em}.w p{color:#85858F;font-size:15px;margin-top:8px}
.grp{--mx:60%;--my:50%;position:relative;display:flex;gap:10px;padding:10px;border-radius:24px;background:#111114;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);flex-wrap:wrap;justify-content:center}
.grp::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(320px circle at var(--mx) var(--my),rgba(129,140,248,.2),transparent 60%);pointer-events:none}
.sb{position:relative;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:16px 24px;background:#16161A;color:#EDEDEF;font:600 15px 'DM Sans';cursor:pointer;overflow:hidden;isolation:isolate}
.sb::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:radial-gradient(160px circle at calc(var(--mx) - var(--ox)) calc(var(--my) - var(--oy)),rgba(165,180,252,.95),transparent 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1;opacity:var(--o,1)}
.sb::after{content:"";position:absolute;inset:0;background:radial-gradient(140px circle at calc(var(--mx) - var(--ox)) calc(var(--my) - var(--oy)),rgba(129,140,248,.22),transparent 70%);z-index:-1;opacity:var(--o,1)}
.sb svg{width:18px;height:18px;color:#A5B4FC}
.sb:focus-visible{outline:2px solid #A5B4FC;outline-offset:3px}
.sb.pri{background:#EDEDEF;color:#0A0A0B}.sb.pri svg{color:#0A0A0B}.sb.pri::after{background:radial-gradient(140px circle at calc(var(--mx) - var(--ox)) calc(var(--my) - var(--oy)),rgba(99,102,241,.35),transparent 70%)}
.sb small{font:600 11px 'DM Sans';padding:2px 7px;border-radius:99px;background:rgba(165,180,252,.16);color:#C7D2FE}
@media(prefers-reduced-motion:reduce){.grp::before,.sb::before,.sb::after{transition:none}}
</style></head><body>
<div class="w"><div><h1>One light, shared by every button</h1><p>A single cursor spotlight lights the tray, then each button's edge and fill on its own.</p></div>
<div class="grp" id="g">
<button class="sb pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New project</button>
<button class="sb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4Z"/></svg>Comments<small>12</small></button>
<button class="sb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1Z"/></svg>Settings</button>
<button class="sb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>Share</button>
</div></div>
<script>
const g=document.getElementById('g'),bs=[...g.querySelectorAll('.sb')];
function pos(x,y){const gr=g.getBoundingClientRect();g.style.setProperty('--mx',(x-gr.left)+'px');g.style.setProperty('--my',(y-gr.top)+'px');
 for(const b of bs){const r=b.getBoundingClientRect();b.style.setProperty('--ox',(r.left-gr.left)+'px');b.style.setProperty('--oy',(r.top-gr.top)+'px');b.style.setProperty('--mx',(x-gr.left)+'px');b.style.setProperty('--my',(y-gr.top)+'px')}}
function preset(){const r=bs[1].getBoundingClientRect();pos(r.left+r.width*.4,r.top+r.height*.5)}
preset();let real=0;addEventListener('pointermove',e=>{real=performance.now();pos(e.clientX,e.clientY)});addEventListener('resize',preset);
/* Idle demo: the light drifts back and forth across the tray until a real pointer moves. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)(function loop(n){if(n-real>2000){const gr=g.getBoundingClientRect(),t=n/1000;pos(gr.left+gr.width*(.5+.5*Math.sin(t*.8)),gr.top+gr.height*(.5+.28*Math.sin(t*1.7)))}requestAnimationFrame(loop)})(performance.now());
</script></body></html>
