<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spotlight Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090E;color:#ECEFF8;font-family:'Be Vietnam Pro',sans-serif;min-height:100vh;display:grid;place-items:center;padding:40px 22px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:960px}
.h{text-align:center;margin-bottom:34px}.h small{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#7C86A8;font-weight:600}
.h h1{font-size:clamp(32px,4.8vw,50px);font-weight:800;letter-spacing:-.045em;margin-top:10px}
.g{--x:-200px;--y:-200px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.c{position:relative;border-radius:24px;padding:26px 24px;background:#10121B;overflow:hidden;isolation:isolate;transition:transform .3s}
.c::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:radial-gradient(220px circle at var(--mx,-200px) var(--my,-200px),var(--a),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1;opacity:0;transition:opacity .3s}
.c::after{content:"";position:absolute;inset:1px;border-radius:23px;background:radial-gradient(260px circle at var(--mx,-200px) var(--my,-200px),rgba(255,255,255,.07),transparent 65%);z-index:-1;opacity:0;transition:opacity .3s}
.g:hover .c::before,.g:hover .c::after{opacity:1}
.c{box-shadow:0 0 0 1px #1D2030}.c:hover{transform:translateY(-4px)}
.av{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:-.04em;color:#06070B;background:linear-gradient(135deg,var(--a),var(--b));margin-bottom:20px;box-shadow:0 14px 26px -12px var(--a)}
.c h2{font-size:19px;font-weight:700;letter-spacing:-.03em}.c .r{font-size:14px;color:var(--a);font-weight:600;margin-top:3px}
.c p{font-size:14px;color:#8A93B2;line-height:1.55;margin-top:12px}
.tg{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}.tg i{font-style:normal;font-size:12px;font-weight:600;color:#A9B1CE;background:#171A28;padding:5px 10px;border-radius:99px}
@media(max-width:760px){.g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="h"><small>The crew</small><h1>Small team. Serious craft.</h1></div>
<div class="g" id="g"></div></div>
<script>
const T=[['Noor Haddad','CEO & co-founder','Spent a decade scaling logistics software before starting Fieldnote.','NH','#2DD4BF','#38BDF8',['Strategy','Sales']],['Theo Bergström','CTO','Builds the sync engine. Believes every bug is a missing test.','TB','#F472B6','#FB923C',['Systems','Rust']],['Ines Carvalho','Head of Design','Ex-agency; obsessed with the 4px between two things.','IC','#A78BFA','#60A5FA',['Product','Brand']]];
const g=document.getElementById('g');
g.innerHTML=T.map(t=>'<article class="c" style="--a:'+t[4]+';--b:'+t[5]+'"><div class="av">'+t[3]+'</div><h2>'+t[0]+'</h2><div class="r">'+t[1]+'</div><p>'+t[2]+'</p><div class="tg">'+t[6].map(x=>'<i>'+x+'</i>').join('')+'</div></article>').join('');
g.addEventListener('pointermove',e=>g.querySelectorAll('.c').forEach(c=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}));
</script></body></html>
