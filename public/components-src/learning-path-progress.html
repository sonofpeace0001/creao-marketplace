<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Learning Path Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4EFE6;color:#1D2A24;font-family:'Figtree',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:560px;border-radius:30px;background:#FFFDF8;padding:28px 28px 22px;box-shadow:0 36px 50px -34px rgba(29,42,36,.5),inset 0 0 0 1px rgba(29,42,36,.08)}
.hd small{font:500 11.500px 'DM Mono';letter-spacing:.14em;text-transform:uppercase;color:#8B9A90}.hd h1{font:700 27px/1.1 'Fraunces',serif;letter-spacing:-.02em;margin:5px 0 14px}
.ov{display:flex;align-items:center;gap:12px;margin-bottom:20px}.ov .bar{flex:1;height:8px;border-radius:4px;background:#ECE6D8;overflow:hidden}.ov .bar i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,#0F9D6E,#6BCB77);border-radius:4px}.ov b{font:500 13px 'DM Mono';color:#0F9D6E;min-width:36px;text-align:right}
.pt{position:relative;display:grid;gap:0}
.pt::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:3px;background:#E7E0D0;border-radius:2px}
.pt .fill{position:absolute;left:19px;top:20px;width:3px;height:var(--h,0px);background:linear-gradient(#0F9D6E,#6BCB77);border-radius:2px}
.m{position:relative;display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:start;padding:10px 0;cursor:pointer}
.nd{width:42px;height:42px;border-radius:50%;background:#FFFDF8;box-shadow:inset 0 0 0 3px #E7E0D0;display:grid;place-items:center;z-index:1;transition:all .4s cubic-bezier(.3,1.6,.5,1);font:700 15px 'Fraunces',serif;color:#9AA89E;position:relative}
.nd svg{position:absolute;width:20px;height:20px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .1s}.nd svg *{fill:none;stroke:#fff;stroke-width:3.500;stroke-linecap:round;stroke-linejoin:round}
.m.dn .nd{background:#0F9D6E;box-shadow:none;color:transparent}.m.dn .nd svg{stroke-dashoffset:0}
.m.cu .nd{box-shadow:inset 0 0 0 3px #0F9D6E,0 0 0 7px rgba(15,157,110,.16);color:#0F9D6E;animation:pu 2s ease-in-out infinite}@keyframes pu{50%{box-shadow:inset 0 0 0 3px #0F9D6E,0 0 0 12px rgba(15,157,110,0)}}
.tx b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;transition:color .3s}.tx span{font-size:13px;color:#8B9A90}.m.dn .tx b{color:#7A887F}
.sub{height:5px;border-radius:3px;background:#ECE6D8;margin-top:8px;overflow:hidden;width:180px;opacity:0;max-height:0;transition:opacity .3s,max-height .3s}.m.cu .sub{opacity:1;max-height:5px}.sub i{display:block;height:100%;width:var(--q,0%);background:#0F9D6E;border-radius:3px}
.tg{font:500 12px 'DM Mono';color:#8B9A90;padding-top:4px}.m.cu .tg{color:#0F9D6E}
.bg{margin-top:0;max-height:0;padding:0 16px;overflow:hidden;border-radius:16px;background:#E8F7EF;color:#0A7A55;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(8px);transition:all .5s cubic-bezier(.3,1.6,.5,1)}.bg.on{opacity:1;transform:none;max-height:60px;margin-top:12px;padding:12px 16px}
</style></head><body>
<div class="cd"><div class="hd"><small>Course path</small><h1>Product design foundations</h1></div><div class="ov"><div class="bar"><i id="ob"></i></div><b id="op">0%</b></div>
<div class="pt" id="pt"><i class="fill" id="fl"></i></div><div class="bg" id="bg">🎓 Path complete — certificate unlocked</div></div>
<script>
const MS=[['Design thinking basics','4 lessons',4],['Typography and grids','6 lessons',6],['Colour systems','5 lessons',5],['Interaction and motion','7 lessons',7],['Capstone portfolio','3 lessons',3]];
const pt=document.getElementById('pt'),fl=document.getElementById('fl'),rows=[];let done=2,q=.4,off=false;
const CK='<svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7"/></svg>';
MS.forEach((m,i)=>{const d=document.createElement('div');d.className='m';d.innerHTML='<span class="nd">'+(i+1)+CK+'</span><div class="tx"><b>'+m[0]+'</b><span>'+m[1]+'</span><div class="sub"><i></i></div></div><span class="tg"></span>';d.onclick=()=>{off=true;done=i;q=0;paint()};pt.appendChild(d);rows.push(d)});
function paint(){rows.forEach((r,i)=>{r.classList.toggle('dn',i<done);r.classList.toggle('cu',i===done);r.querySelector('.sub i').style.setProperty('--q',(i===done?q*100:0)+'%');r.querySelector('.tg').textContent=i<done?'done':i===done?Math.round(q*MS[i][2])+'/'+MS[i][2]:''});
 const tot=MS.reduce((a,m)=>a+m[2],0);let c=0;MS.forEach((m,i)=>{if(i<done)c+=m[2];else if(i===done)c+=q*m[2]});const p=Math.min(100,c/tot*100);document.getElementById('ob').style.setProperty('--p',p+'%');document.getElementById('op').textContent=Math.round(p)+'%';
 const el=rows[Math.min(done,rows.length-1)];const y=done>=rows.length?pt.clientHeight-40:(el.offsetTop+21-20+(el===rows[done]?q*(rows[Math.min(done+1,rows.length-1)].offsetTop-el.offsetTop):0));fl.style.setProperty('--h',Math.max(0,y)+'px');document.getElementById('bg').classList.toggle('on',done>=rows.length)}
paint();
/* Idle demo: the learner advances through lessons; the current milestone's pulsing ring fills a mini progress bar and counter, the green spine grows down the path, on completion the node snaps to a drawn checkmark and the next one starts pulsing, and the final milestone reveals a certificate banner before the path resets. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(2600);while(!off){const n=MS[done]?MS[done][2]:0;for(let l=Math.round(q*n)+1;l<=n&&!off;l++){q=l/n;paint();await sleep(650)}if(off)return;await sleep(500);done++;q=0;paint();if(done>=MS.length){await sleep(3200);if(off)return;done=0;q=0;paint();await sleep(800)}}})()}
</script></body></html>
