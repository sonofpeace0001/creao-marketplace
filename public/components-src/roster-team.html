<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Team Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F6F1E7;color:#1F2A24;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:40px 22px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:940px}
.h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.h h1{font:400 clamp(34px,5vw,52px)/.98 'Young Serif',serif;letter-spacing:-.025em;max-width:480px}.h h1 em{color:#C2410C;font-style:normal}
.h p{max-width:300px;color:#6A7A70;font-size:15px;line-height:1.55}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.c{position:relative;background:#fff;border-radius:24px;padding:16px 16px 20px;box-shadow:0 0 0 1px rgba(31,42,36,.07);transition:transform .3s cubic-bezier(.3,1.4,.4,1),box-shadow .3s}
.c:hover,.c:focus-within{transform:translateY(-8px) rotate(-1deg);box-shadow:0 26px 36px -20px rgba(31,42,36,.4),0 0 0 1px rgba(31,42,36,.07)}
.c:nth-child(even):hover{transform:translateY(-8px) rotate(1deg)}
.av{position:relative;aspect-ratio:1;border-radius:18px;background:var(--bg);display:grid;place-items:center;overflow:hidden;margin-bottom:16px}
.av b{font:400 60px 'Young Serif',serif;color:var(--fg);letter-spacing:-.04em}
.av::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;border:2px solid var(--fg);opacity:.18;right:-30%;top:-30%}
.so{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;justify-content:center;opacity:0;transform:translateY(10px);transition:all .28s}
.c:hover .so,.c:focus-within .so{opacity:1;transform:none}
.so a{width:34px;height:34px;border-radius:50%;background:#fff;color:#1F2A24;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.18);transition:transform .2s}.so a:hover{transform:scale(1.12)}.so a:focus-visible{outline:2px solid #1F2A24;outline-offset:2px}
.c h2{font:400 20px 'Young Serif',serif;letter-spacing:-.02em}.c p{font-size:13.5px;color:#6A7A70;margin-top:3px}
@media(max-width:760px){.g{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="h"><h1>The people behind <em>the work.</em></h1><p>A small team of makers across four time zones, united by a love of tidy details.</p></div>
<div class="g" id="g"></div></div>
<script>
const T=[['Amara Osei','Founder & CEO','AO','#FFD9C2','#9A3412'],['Jonas Lindqvist','Head of Design','JL','#D6E8D2','#2F6B3A'],['Priya Raman','Staff Engineer','PR','#DDD6FA','#5B3FC6'],['Diego Marín','Customer Lead','DM','#FBE3A6','#8A5A00']];
const a='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.800 3h3.100l-6.800 7.700L22 21h-6.200l-4.900-6.400L5.300 21H2.200l7.300-8.300L2 3h6.400l4.400 5.800Z"/></svg>',l='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4.980 3.500a2.500 2.500 0 1 1 0 5 2.500 2.500 0 0 1 0-5ZM3 9.500h4V21H3Zm7 0h3.800v1.600h.1c.5-1 1.800-2 3.800-2 4 0 4.800 2.600 4.800 6V21h-4v-5c0-1.200 0-2.800-1.700-2.800s-2 1.300-2 2.700V21h-4Z"/></svg>';
document.getElementById('g').innerHTML=T.map(t=>'<article class="c"><div class="av" style="--bg:'+t[3]+';--fg:'+t[4]+'"><b>'+t[2]+'</b><div class="so"><a href="#" aria-label="'+t[0]+' on X">'+a+'</a><a href="#" aria-label="'+t[0]+' on LinkedIn">'+l+'</a></div></div><h2>'+t[0]+'</h2><p>'+t[1]+'</p></article>').join('');
</script></body></html>
