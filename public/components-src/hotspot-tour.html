<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feature Hotspots Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E7EAF6;color:#12163A;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.ap{position:relative;display:grid;grid-template-columns:150px 1fr;width:100%;max-width:760px;height:430px;background:#fff;border-radius:22px;overflow:visible;box-shadow:0 40px 70px -40px rgba(18,22,58,.55),0 0 0 1px rgba(18,22,58,.07)}
.sd{background:#F6F7FD;border-radius:22px 0 0 22px;padding:18px 12px;border-right:1px solid #E8EAF6}.sd b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0 6px 18px}.sd b i{width:20px;height:20px;border-radius:7px;background:linear-gradient(135deg,#6366F1,#EC4899)}
.nv{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:500;color:#5A6089;margin-bottom:3px}.nv.on{background:#fff;color:#12163A;box-shadow:0 2px 6px rgba(18,22,58,.08)}.nv i{width:14px;height:14px;border-radius:5px;background:#CFD3EE}
.mn{padding:20px 22px;position:relative}.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.tp h2{font-size:21px;font-weight:700;letter-spacing:-.035em}
.sr{display:flex;align-items:center;gap:8px;background:#F4F5FB;border-radius:10px;padding:8px 12px;width:170px;font-size:13px;color:#8A90B8}
.nw{background:#4F46E5;color:#fff;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kp div{border:1px solid #ECEEF8;border-radius:14px;padding:12px}.kp b{font-size:20px;font-weight:700;letter-spacing:-.03em;display:block}.kp span{font-size:12px;color:#8A90B8}
.ch{height:140px;border:1px solid #ECEEF8;border-radius:14px;display:flex;align-items:flex-end;gap:7px;padding:14px}.ch i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#818CF8,#C7D2FE)}
.hs{position:absolute;width:30px;height:30px;margin:-15px;border:0;border-radius:50%;background:#4F46E5;color:#fff;font:700 13px 'Inter Tight';cursor:pointer;z-index:5;display:grid;place-items:center;box-shadow:0 6px 14px -4px #4F46E5;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.hs:hover,.hs[aria-expanded=true]{transform:scale(1.15)}.hs:focus-visible{outline:3px solid #12163A;outline-offset:3px}
.hs::before,.hs::after{content:"";position:absolute;inset:0;border-radius:50%;background:#4F46E5;z-index:-1;animation:pu 2.2s ease-out infinite}.hs::after{animation-delay:1.1s}@keyframes pu{from{transform:scale(1);opacity:.55}to{transform:scale(2.4);opacity:0}}
.hs.dn{background:#16A34A;box-shadow:0 6px 14px -4px #16A34A}.hs.dn::before,.hs.dn::after{display:none}
.tt{position:absolute;width:230px;background:#12163A;color:#fff;border-radius:16px;padding:14px 16px;z-index:8;box-shadow:0 24px 40px -12px rgba(18,22,58,.6);opacity:0;transform:translateY(6px) scale(.96);pointer-events:none;transition:all .25s cubic-bezier(.3,1.3,.5,1)}.tt.on{opacity:1;transform:none;pointer-events:auto}
.tt b{display:block;font-size:14.5px;font-weight:700;margin-bottom:4px}.tt p{font-size:13px;line-height:1.5;color:#B5BAE0;margin-bottom:12px}.tt .r{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8A90C0}.tt button{border:0;background:#fff;color:#12163A;border-radius:9px;padding:6px 12px;font:700 12.5px 'Inter Tight';cursor:pointer}.tt button:focus-visible{outline:2px solid #818CF8}
.pg{position:absolute;left:50%;bottom:-48px;transform:translateX(-50%);font-size:13px;color:#6A70A0;font-weight:600;white-space:nowrap}.pg b{color:#12163A}
@media(max-width:620px){.ap{grid-template-columns:1fr}.sd{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="ap" id="ap"><div class="sd"><b><i></i>Orbit</b><div class="nv on"><i></i>Overview</div><div class="nv"><i></i>Projects</div><div class="nv"><i></i>Reports</div><div class="nv"><i></i>Team</div></div>
<div class="mn"><div class="tp"><h2>Overview</h2><div style="display:flex;gap:10px"><div class="sr">Search…</div><div class="nw">New project</div></div></div>
<div class="kp"><div><b>$48.2k</b><span>Revenue</span></div><div><b>1,284</b><span>Customers</span></div><div><b>96%</b><span>Retention</span></div></div><div class="ch"><i style="height:35%"></i><i style="height:55%"></i><i style="height:42%"></i><i style="height:70%"></i><i style="height:58%"></i><i style="height:84%"></i><i style="height:66%"></i><i style="height:92%"></i></div></div>
<div class="tt" id="tt" role="dialog" aria-live="polite"></div><div class="pg" id="pg"></div></div>
<script>
const H=[['Search anything','Press / to jump to any project, person or report in a second.',[560,70],'down'],['Create a project','Start from a template or a blank canvas. Everything syncs live.',[690,70],'down'],['Track your KPIs','Pin the numbers that matter. They update in real time.',[300,150],'down'],['Spot trends early','Hover any bar to compare against last period.',[470,320],'up']];
const ap=document.getElementById('ap'),tt=document.getElementById('tt');let cur=0,done=new Set();
H.forEach((h,i)=>{const b=document.createElement('button');b.className='hs';b.style.left=h[2][0]+'px';b.style.top=h[2][1]+'px';b.textContent=i+1;b.setAttribute('aria-label','Tip '+(i+1)+': '+h[0]);b.setAttribute('aria-expanded','false');b.onclick=()=>open(i);ap.appendChild(b)});
const B=[...ap.querySelectorAll('.hs')];
function open(i){cur=i;B.forEach((b,k)=>b.setAttribute('aria-expanded',k===i));const h=H[i];tt.innerHTML='<b>'+h[0]+'</b><p>'+h[1]+'</p><div class="r"><span>'+(i+1)+' of '+H.length+'</span><button>'+(i===H.length-1?'Done':'Next')+'</button></div>';
 const W=ap.clientWidth,x=Math.max(10,Math.min(W-240,h[2][0]-115)),y=h[3]==='down'?h[2][1]+26:h[2][1]-tt.offsetHeight-26;tt.style.left=x+'px';tt.style.top=Math.max(8,y)+'px';tt.classList.add('on');
 tt.querySelector('button').onclick=()=>{done.add(i);B[i].classList.add('dn');B[i].textContent='✓';if(i<H.length-1)open(i+1);else{tt.classList.remove('on');B.forEach(b=>b.setAttribute('aria-expanded','false'));upd()}};upd()}
function upd(){document.getElementById('pg').innerHTML='<b>'+done.size+' of '+H.length+'</b> tips explored'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){tt.classList.remove('on');B.forEach(b=>b.setAttribute('aria-expanded','false'))}});
upd();setTimeout(()=>open(1),80);
</script></body></html>
