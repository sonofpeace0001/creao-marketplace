<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Workflow Race Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0D12;color:#EDEFF6;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{width:100%;max-width:740px;background:#12151D;border-radius:28px;padding:26px;box-shadow:0 44px 64px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:14px;flex-wrap:wrap}.hd small{font:700 11.500px 'Space Mono';letter-spacing:.18em;color:#7C86A6;text-transform:uppercase}.hd h1{font:700 28px 'Space Grotesk';letter-spacing:-.04em;margin-top:5px}
.sv{text-align:right;opacity:0;transform:translateY(8px);transition:all .5s cubic-bezier(.3,1.6,.5,1)}.sv.on{opacity:1;transform:none}.sv small{display:block;font:700 10.500px 'Space Mono';letter-spacing:.14em;color:#7C86A6}.sv b{font:700 34px/1 'Space Grotesk';letter-spacing:-.05em;color:#34D399;font-variant-numeric:tabular-nums}
.ln{margin-bottom:18px}.ln .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.ln .t b{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}.ln .t b i{width:9px;height:9px;border-radius:50%;background:var(--c)}.ln .t em{font:700 20px 'Space Mono';font-style:normal;font-variant-numeric:tabular-nums;color:var(--c)}
.tr{position:relative;height:58px;border-radius:16px;background:#181C28;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
.fl{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 28%,transparent));border-right:2px solid var(--c)}
.st{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:20%;font:700 10.500px 'Space Mono';color:#68708F;letter-spacing:.06em;transition:color .3s}.st.on{color:#fff}.st i{width:14px;height:14px;border-radius:50%;background:#232838;box-shadow:inset 0 0 0 2px #3A4058;transition:all .35s cubic-bezier(.3,2,.5,1);display:grid;place-items:center;font-style:normal;font-size:9px;color:#06281D}.st.on i{background:var(--c);box-shadow:none;transform:scale(1.2)}.st.wt i{background:#F59E0B;box-shadow:none;animation:bk .7s infinite}@keyframes bk{50%{opacity:.3}}
.rn{position:absolute;top:50%;left:var(--p,0%);width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:17px;box-shadow:0 0 18px var(--c);z-index:3}
.nt{margin-top:6px;font:400 11.500px 'Space Mono';color:#6C7596;height:16px}
.ft{display:flex;justify-content:space-between;margin-top:6px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font:700 12px 'Space Mono';color:#7C86A6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="cd"><div class="hd"><div><small>Weekly report workflow</small><h1>Manual vs. automated</h1></div><div class="sv" id="sv"><small>TIME SAVED</small><b id="sb">0h 00m</b></div></div>
<div class="ln" style="--c:#F59E0B"><div class="t"><b><i></i>By hand</b><em id="ta">0:00:00</em></div><div class="tr" id="ra"></div><div class="nt" id="na"></div></div>
<div class="ln" style="--c:#34D399"><div class="t"><b><i></i>With Relay</b><em id="tb">0:00:00</em></div><div class="tr" id="rb"></div><div class="nt" id="nb"></div></div>
<div class="ft"><span>5 STEPS</span><span>EXPORT → CLEAN → CHART → REVIEW → SEND</span></div></div>
<script>
const ST=['EXPORT','CLEAN','CHART','REVIEW','SEND'],$=id=>document.getElementById(id),sl=t=>new Promise(r=>setTimeout(r,t));let off=false;
function lane(id,ico){const r=$(id);r.innerHTML=ST.map((s,i)=>'<div class="st" style="left:'+(i*20)+'%"><i></i>'+s+'</div>').join('')+'<div class="fl"></div><div class="rn">'+ico+'</div>';return r}
const A=lane('ra','🚶'),B=lane('rb','⚡');
const fmt=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function set(r,p,dn){r.style.setProperty('--p',p+'%');[...r.querySelectorAll('.st')].forEach((s,i)=>s.classList.toggle('on',p>=i*20+10))}
const MA=[18*60,52*60,41*60,96*60,23*60],MB=[20,35,15,150,5];
function simTime(M,p){let t=0;for(let i=0;i<5;i++){const a=Math.max(0,Math.min(1,(p-i*20)/20));t+=M[i]*a}return t}
set(A,34);set(B,100);$('ta').textContent=fmt(simTime(MA,34));$('tb').textContent=fmt(225);$('na').textContent='Waiting on a colleague…';$('nb').textContent='Done · sent to 14 people';$('sv').classList.add('on');$('sb').textContent='4h 08m';
document.querySelector('.cd').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: two lanes race through the same five-step reporting workflow; the automated runner glides through all five steps in a few seconds with its timer finishing under four minutes, while the manual runner crawls with amber waiting pauses between steps and a clock that runs into hours, and when the fast lane finishes a Time saved figure pops in and counts up to the difference, then both reset and race again, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){set(A,0);set(B,0);$('sv').classList.remove('on');$('na').textContent='';$('nb').textContent='';$('ta').textContent='0:00:00';$('tb').textContent='0:00:00';await sl(700);let pa=0,pb=0;const t0=performance.now();while(pb<100&&!off){const el=(performance.now()-t0)/1000;pb=Math.min(100,el/5.600*100);pa=Math.min(40,Math.pow(el/5.600,.8)*34);set(B,pb);set(A,pa);$('ta').textContent=fmt(simTime(MA,pa));$('tb').textContent=fmt(simTime(MB,pb));$('nb').textContent=pb>=100?'Done · sent to 14 people':'Running…';$('na').textContent=((pa%20)>17||(pa%20)<2)?'Waiting on a colleague…':'';await sl(30)}if(off)return;$('sv').classList.add('on');const t1=performance.now();while(performance.now()-t1<900){const k=1-Math.pow(1-(performance.now()-t1)/900,3);const m=Math.round((4*60+8)*k);$('sb').textContent=Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';await sl(30)}let pa2=pa;const t2=performance.now();while(performance.now()-t2<2600&&!off){pa2=Math.min(100,pa+(100-pa)*((performance.now()-t2)/2600));set(A,pa2);$('ta').textContent=fmt(simTime(MA,pa2)*1);await sl(30)}$('na').textContent='Done · sent to 14 people';await sl(3200)}})()}
</script></body></html>
