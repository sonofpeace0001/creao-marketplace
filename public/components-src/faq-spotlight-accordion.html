<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spotlight FAQ Accordion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0C;color:#EDEDF0;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:680px}
.hd{text-align:center;margin-bottom:26px}.hd h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.045em;font-weight:600}.hd p{color:#8A8A94;margin-top:8px;font-size:15.5px}
.tabs{display:flex;justify-content:center;gap:6px;margin-bottom:20px;flex-wrap:wrap}.tabs button{border:1px solid #232328;background:#111114;color:#9A9AA4;border-radius:99px;padding:7px 15px;font:500 13.5px 'Geist';cursor:pointer;transition:all .2s}.tabs button:hover{color:#fff}.tabs button[aria-pressed=true]{background:#EDEDF0;color:#0A0A0C;border-color:#EDEDF0}.tabs button:focus-visible{outline:2px solid #8B8FFF;outline-offset:2px}
.ls{--x:50%;--y:50%;display:grid;gap:8px}
.it{position:relative;border-radius:16px;background:#111114;border:1px solid #1E1E23;overflow:hidden;isolation:isolate;transition:border-color .25s}
.it::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(139,143,255,.16),transparent 65%);opacity:0;transition:opacity .3s;z-index:-1}.it:hover::before{opacity:1}
.it[hidden]{display:none}.it.open{border-color:#34345A}
.q{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:18px 20px;font:500 16px 'Geist';cursor:pointer}.q:focus-visible{outline:2px solid #8B8FFF;outline-offset:-2px;border-radius:16px}
.q b{flex:1;font-weight:500;letter-spacing:-.015em}
.pm{position:relative;flex:none;width:26px;height:26px;border-radius:50%;border:1px solid #2A2A32;transition:all .3s}.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:1.5px;background:#C7C7D0;transform:translate(-50%,-50%);transition:transform .3s}.pm::after{transform:translate(-50%,-50%) rotate(90deg)}
.it.open .pm{background:#8B8FFF;border-color:#8B8FFF}.it.open .pm::before,.it.open .pm::after{background:#0A0A0C}.it.open .pm::after{transform:translate(-50%,-50%) rotate(0)}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,.9,.3,1)}.it.open .a{grid-template-rows:1fr}.a>div{overflow:hidden}.a p{padding:0 20px 20px 60px;color:#9A9AA6;line-height:1.65;font-size:15px}
.ft{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:22px;font-size:14px;color:#8A8A94}.ft a{color:#C7C9FF;font-weight:600;text-decoration:none}.ft a:hover{text-decoration:underline}
@media(max-width:520px){.a p{padding-left:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Questions, answered.</h1><p>Everything you need to know before you start.</p></div>
<div class="tabs" id="tb" role="group" aria-label="Topic"><button aria-pressed="true" data-t="all">All</button><button aria-pressed="false" data-t="Billing">Billing</button><button aria-pressed="false" data-t="Security">Security</button><button aria-pressed="false" data-t="Product">Product</button></div>
<div class="ls" id="ls"></div><div class="ft"><span>Still stuck?</span><a href="#">Talk to a human &rarr;</a></div></div>
<script>
const Q=[['Billing','Can I change plans at any time?','Yes. Upgrades apply immediately and are prorated. Downgrades take effect at the end of your billing period so you never lose paid time.'],['Billing','Do you offer refunds?','Every plan has a 30-day money-back guarantee. Email us within 30 days and we will refund you in full, no questions asked.'],['Security','Is my data encrypted?','All data is encrypted in transit with TLS 1.3 and at rest with AES-256. Enterprise plans can bring their own encryption keys.'],['Product','Can my whole team use it for free?','Teams of up to five people can use the Starter plan for free forever, including every integration.'],['Security','Where is my data stored?','You choose a region at signup: US, EU or Asia-Pacific. Data never leaves the region you pick.']];
const ls=document.getElementById('ls');
ls.innerHTML=Q.map((q,i)=>'<div class="it'+(i===0?' open':'')+'" data-t="'+q[0]+'"><button class="q" aria-expanded="'+(i===0)+'" aria-controls="a'+i+'"><b>'+q[1]+'</b><span class="pm"></span></button><div class="a" id="a'+i+'" role="region"><div><p>'+q[2]+'</p></div></div></div>').join('');
const I=[...ls.children];
I.forEach(it=>{it.querySelector('.q').onclick=()=>{const o=!it.classList.contains('open');I.forEach(x=>{x.classList.remove('open');x.querySelector('.q').setAttribute('aria-expanded','false')});if(o){it.classList.add('open');it.querySelector('.q').setAttribute('aria-expanded','true')}};
 it.addEventListener('pointermove',e=>{const r=it.getBoundingClientRect();it.style.setProperty('--mx',(e.clientX-r.left)+'px');it.style.setProperty('--my',(e.clientY-r.top)+'px')})});
I[1].style.setProperty('--mx','70%');I[1].style.setProperty('--my','50%');I[1].classList.add('demo');
document.querySelectorAll('#tb button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tb button').forEach(x=>x.setAttribute('aria-pressed',x===b));I.forEach(it=>it.hidden=b.dataset.t!=='all'&&it.dataset.t!==b.dataset.t)});
const st=document.createElement('style');st.textContent='.it.demo::before{opacity:1}';document.head.appendChild(st);
</script></body></html>
