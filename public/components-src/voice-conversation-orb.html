<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Voice Conversation Orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05060C;color:#EEF0FA;font-family:'Figtree',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{position:relative;width:100%;max-width:440px;height:600px;border-radius:36px;background:radial-gradient(500px 420px at 50% 36%,var(--g,#1B1F52),#05060C 70%);box-shadow:0 44px 70px -36px #000,inset 0 0 0 1px rgba(255,255,255,.09);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:26px 24px 28px;transition:--g .8s}
.st{font:500 12px 'Geist Mono';letter-spacing:.2em;text-transform:uppercase;color:var(--c,#8B9CFF);display:flex;align-items:center;gap:8px;transition:color .5s}.st i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:p 1.2s infinite}@keyframes p{50%{opacity:.3}}
.tm{font:500 13px 'Geist Mono';color:#7C84A8;margin-top:6px;font-variant-numeric:tabular-nums}
canvas{width:300px;height:300px;margin-top:10px}
.cp{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:21px;line-height:1.4;font-weight:500;min-height:110px}
.cp .w{opacity:.28;transition:opacity .25s,color .25s}.cp .w.on{opacity:1}.cp.me .w.on{color:#C5CCFF}.cp .nm{font:500 11.500px 'Geist Mono';letter-spacing:.18em;color:#6F78A0;margin-bottom:10px;text-transform:uppercase}
.bt{display:flex;gap:22px;align-items:center}.bt button{width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);transition:background .3s,transform .15s}.bt button:active{transform:scale(.92)}.bt button:focus-visible{outline:2px solid #fff}.bt .mic{width:74px;height:74px;background:var(--c,#6366F1);color:#05060C;font-size:28px;box-shadow:0 0 0 0 var(--c);animation:rp 2s infinite}@keyframes rp{70%{box-shadow:0 0 0 18px transparent}0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}}.bt .end{background:#EF4444}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="cd" id="cd"><div class="st" id="st"><i></i><span>Listening</span></div><div class="tm" id="tm">00:14</div><canvas id="cv" width="600" height="600"></canvas><div class="cp" id="cp"></div>
<div class="bt"><button aria-label="Mute">🎙</button><button class="mic" aria-label="Talk" id="mc">●</button><button class="end" aria-label="End call">✕</button></div></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),cd=document.getElementById('cd'),cp=document.getElementById('cp'),stt=document.getElementById('st');
const TH={listen:['#7C8CFF','#7C8CFF','#3B82F6','#1B1F52','Listening'],think:['#C084FC','#A855F7','#6D28D9','#2A1450','Thinking'],speak:['#34D399','#22D3EE','#0EA5E9','#0B3A44','Speaking']};
let mode='listen',amp=.35,tgt=.35,t=0,col=TH.listen.slice(0,3),off=false;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
let cur=[hx(TH.listen[0]),hx(TH.listen[1]),hx(TH.listen[2])];
function draw(n){t=n/1000;amp+=(tgt-amp)*.1;const tg=TH[mode].slice(0,3).map(hx);cur=cur.map((c,i)=>c.map((v,k)=>v+(tg[i][k]-v)*.06));
 x.clearRect(0,0,600,600);const cx=300,cy=300;const lay=[[0,1,1],[.5,.8,.62],[1,.6,.4]];
 for(let L=0;L<3;L++){x.beginPath();const R=(190-L*24)*(1+amp*.18);for(let i=0;i<=120;i++){const a=i/120*Math.PI*2;const w=Math.sin(a*3+t*(1.3+L*.4)+L)*.5+Math.sin(a*5-t*(1.9-L*.3))*.35+Math.sin(a*2+t*.8+L*2)*.4;const r=R*(1+w*amp*.22);const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();const g=x.createRadialGradient(cx-30,cy-40,10,cx,cy,R*1.25);const c1=cur[L].map(Math.round);g.addColorStop(0,'rgba(255,255,255,'+(L===2?.9:.35)+')');g.addColorStop(.35,'rgba('+c1+','+(.95-L*.22)+')');g.addColorStop(1,'rgba('+c1+',0.12)');x.fillStyle=g;x.shadowColor='rgba('+c1+',.7)';x.shadowBlur=60-L*14;x.fill()}
 x.shadowBlur=0;cd.style.setProperty('--c','rgb('+cur[0].map(Math.round)+')');cd.style.setProperty('--g','rgb('+hx(TH[mode][3]).map(Math.round)+')');requestAnimationFrame(draw)}
requestAnimationFrame(draw);
const sl=ms=>new Promise(r=>setTimeout(r,ms));
function setMode(m){mode=m;stt.querySelector('span').textContent=TH[m][4]}
function words(s,me){cp.className='cp'+(me?' me':'');cp.innerHTML='<div class="nm">'+(me?'You':'Aria')+'</div><div>'+s.split(' ').map(w=>'<span class="w">'+w+' </span>').join('')+'</div>';return [...cp.querySelectorAll('.w')]}
async function say(s,me,wpm){const ws=words(s,me);for(const w of ws){if(off)return;w.classList.add('on');tgt=me?.4+Math.random()*.6:.5+Math.random()*.7;await sl(wpm)}}
let sec=14;setInterval(()=>{sec++;document.getElementById('tm').textContent='00:'+String(sec%60).padStart(2,'0')},1000);
const D=[['What should I cook with leftover rice and a few eggs?','Egg fried rice is perfect. Cold rice crisps better, so start with a very hot pan and add the eggs last.'],['How long should the pan heat up?','About two minutes on high. When a drop of water dances and vanishes, you are ready to go.']];
words(D[0][0],true).forEach(w=>w.classList.add('on'));tgt=.8;
/* Idle demo: a voice assistant orb alternates between listening, thinking and speaking; the blobby orb swells with the voice level and recolours (blue, violet, teal), captions light up word by word, and the call timer ticks, looping through short exchanges, until you tap a control. */
document.getElementById('cd').addEventListener('pointerdown',()=>{off=true});
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3600);let i=0;while(!off){const d=D[i%D.length];setMode('listen');await say(d[0],true,170);if(off)return;tgt=.3;setMode('think');cp.innerHTML='<div class="nm">Aria</div><div class="w on">…</div>';tgt=.15;await sl(1300);setMode('speak');await say(d[1],false,230);tgt=.2;await sl(1100);i++}})()}
</script></body></html>
