<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Outline Fill Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D0D10;color:#F4F1EA;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 4vw;-webkit-font-smoothing:antialiased;overflow:hidden}
.c{width:100%;max-width:1000px}
.tp{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#7A7870;margin-bottom:20px}
.ls{display:flex;flex-direction:column}
.ln{position:relative;display:block;font:400 clamp(70px,15.4vw,190px)/.98 'Anton',sans-serif;text-transform:uppercase;letter-spacing:.005em;white-space:nowrap;-webkit-text-stroke:2px #F4F1EA;color:transparent;cursor:default;outline:0;overflow:hidden;border-bottom:1px solid #26262B;padding:2px 0}
.ln .fl{position:absolute;left:0;top:2px;color:var(--c);-webkit-text-stroke:0;clip-path:inset(0 100% 0 0);transition:clip-path .65s cubic-bezier(.7,0,.2,1);pointer-events:none;white-space:nowrap}
.ln:hover .fl,.ln.on .fl,.ln:focus-visible .fl{clip-path:inset(0 0 0 0)}
.ln.up .fl{clip-path:inset(100% 0 0 0)}.ln.up:hover .fl,.ln.up.on .fl,.ln.up:focus-visible .fl{clip-path:inset(0 0 0 0)}
.ln.rt .fl{clip-path:inset(0 0 0 100%)}.ln.rt:hover .fl,.ln.rt.on .fl,.ln.rt:focus-visible .fl{clip-path:inset(0 0 0 0)}
.ln .mn{position:absolute;right:0;top:50%;transform:translateY(-50%);font:500 14px 'Space Grotesk';letter-spacing:.1em;-webkit-text-stroke:0;color:#7A7870;opacity:0;transition:opacity .3s}.ln:hover .mn,.ln.on .mn{opacity:1}
.ln:focus-visible{outline:2px solid #FFB703;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="tp"><span>Selected disciplines</span><span>Hover a word</span></div><div class="ls" id="ls"></div></div>
<script>
const W=[['Brand','#FFB703',''],['Motion','#FB5607','up'],['Digital','#8338EC','rt'],['Print','#06D6A0','']];
const ls=document.getElementById('ls');W.forEach((w,i)=>{const e=document.createElement('div');e.className='ln '+w[2];e.tabIndex=0;e.style.setProperty('--c',w[1]);e.setAttribute('role','text');e.innerHTML=w[0]+'<span class="fl" aria-hidden="true">'+w[0]+'</span><span class="mn">0'+(i+1)+'</span>';ls.appendChild(e)});
const l=ls.children;l[1].classList.add('on');
ls.addEventListener('mouseover',()=>{[...l].forEach(x=>x.classList.remove('on'))});
</script></body></html>
