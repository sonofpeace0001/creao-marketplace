<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Flip Profile Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1B1530;background-image:radial-gradient(500px 360px at 70% 0,#4C2A8C,transparent 70%);color:#F3EFFF;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{perspective:1200px}
.cd{position:relative;width:min(340px,92vw);height:460px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.1,.4,1);cursor:pointer}.cd.fl{transform:rotateY(180deg)}.cd:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:30px}
.fc{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;overflow:hidden;box-shadow:0 40px 70px -30px #000,0 0 0 1px rgba(255,255,255,.12)}
.fr{background:linear-gradient(165deg,#FF8A5B,#E8316B 55%,#4B1B8C);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:30px 24px;text-align:center}
.fr::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 12%,rgba(255,255,255,.5),transparent 50%)}
.pt{position:absolute;left:50%;top:44px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 20px 40px -10px rgba(0,0,0,.4),0 0 0 8px rgba(255,255,255,.25)}.pt::before{content:"";position:absolute;left:50%;top:28%;width:42%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#E8316B}.pt::after{content:"";position:absolute;left:20%;right:20%;top:62%;bottom:-6%;border-radius:60px 60px 0 0;background:#E8316B}.pt{overflow:hidden}
.fr h1{position:relative;font:800 29px 'Syne';letter-spacing:-.04em}.fr .rl{position:relative;font-size:15px;opacity:.92;margin:4px 0 14px}
.fr .tg{position:relative;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}.fr .tg span{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);padding:5px 12px;border-radius:99px}
.fr .hn{position:relative;font-size:12.5px;opacity:.8;display:flex;align-items:center;gap:6px}
.bk{transform:rotateY(180deg);background:#161230;border:1px solid #2E2860;padding:28px 26px;display:flex;flex-direction:column}
.bk h2{font:800 22px 'Syne';letter-spacing:-.03em;margin-bottom:6px}.bk p{font-size:14.5px;line-height:1.6;color:#B8B1E6;margin-bottom:18px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.st div{background:#1F1A44;border:1px solid #2E2860;border-radius:14px;padding:12px 6px;text-align:center}.st b{display:block;font:800 22px 'Syne';letter-spacing:-.04em}.st span{font-size:11.5px;color:#9A92D6}
.sk{display:grid;gap:10px;margin-bottom:auto}.sk div{font-size:13px;font-weight:600;display:flex;justify-content:space-between;color:#CFC9F5}.sk i{display:block;height:6px;border-radius:6px;background:#241E50;margin-top:5px;overflow:hidden}.sk i u{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FF8A5B,#E8316B);width:0;transition:width .4s .25s ease-out}.cd.fl .sk i u{width:var(--w)}
.ac{display:flex;gap:10px;margin-top:18px}.ac button{flex:1;border:0;border-radius:14px;padding:12px;font:700 14px 'Inter';cursor:pointer}.ac .p{background:linear-gradient(135deg,#FF8A5B,#E8316B);color:#fff}.ac .s{background:#241E50;color:#F3EFFF}.ac button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="cd" id="cd" tabindex="0" role="button" aria-pressed="false" aria-label="Profile card for Ines Duarte. Press Enter to flip.">
<div class="fc fr"><div class="pt"></div><h1>Ines Duarte</h1><div class="rl">Product Designer · Lisbon</div><div class="tg"><span>Brand</span><span>Motion</span><span>Systems</span></div><div class="hn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.700M21 4v5h-5"/></svg>Click to flip</div></div>
<div class="fc bk"><h2>About Ines</h2><p>Ten years designing calm products for fast teams. Currently leading design at Northwind and teaching a motion workshop on weekends.</p>
<div class="st"><div><b>124</b><span>Projects</span></div><div><b>38k</b><span>Followers</span></div><div><b>9y</b><span>Experience</span></div></div>
<div class="sk"><div>Visual design<span>95%</span><i><u style="--w:95%"></u></i></div><div>Prototyping<span>88%</span><i><u style="--w:88%"></u></i></div><div>Research<span>72%</span><i><u style="--w:72%"></u></i></div></div>
<div class="ac"><button class="p" data-s="1">Follow</button><button class="s" data-s="1">Message</button></div></div></div></div>
<script>
const cd=document.getElementById('cd');function tg(){cd.classList.toggle('fl');cd.setAttribute('aria-pressed',cd.classList.contains('fl'))}
cd.addEventListener('click',e=>{if(e.target.closest('button'))return;tg()});cd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}});
cd.querySelectorAll('.ac button').forEach(b=>b.onclick=e=>{e.stopPropagation();b.textContent=b.classList.contains('p')?(b.textContent==='Follow'?'Following':'Follow'):'Sent'});
setTimeout(()=>{cd.classList.add('fl');cd.setAttribute('aria-pressed','true')},100);
</script></body></html>
