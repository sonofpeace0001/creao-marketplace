<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lightbox Flip Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EFEBE4;color:#1C1914;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{position:relative;width:100%;max-width:860px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}.hd h1{font:700 32px 'Fraunces',serif;letter-spacing:-.03em}.hd span{font-size:13px;color:#8E8672}
.gd{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:12px}
.th{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;cursor:zoom-in;background:#222;transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s}.th:hover,.th.hv{transform:scale(1.03);box-shadow:0 20px 30px -14px rgba(0,0,0,.5)}.th:focus-visible{outline:3px solid #1C1914;outline-offset:3px}
.th.w2{grid-column:span 2}.th.h2{grid-row:span 2}
.th svg{display:block;width:100%;height:100%;pointer-events:none}.th .cp{position:absolute;left:12px;bottom:10px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);transition:all .25s}.th:hover .cp,.th.hv .cp{opacity:1;transform:none}
.ov{position:fixed;inset:0;z-index:50;background:rgba(18,15,10,0);display:none;transition:background .4s}.ov.on{display:block;background:rgba(18,15,10,.88)}
.fl{position:fixed;z-index:60;border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);transition:all .5s cubic-bezier(.3,1,.4,1)}.fl svg{display:block;width:100%;height:100%}
.ui{position:fixed;z-index:70;opacity:0;transition:opacity .3s .25s;color:#fff}.ov.on~.ui{opacity:1}
.nv{position:fixed;top:50%;width:48px;height:48px;margin-top:-24px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px)}.nv:hover{background:rgba(255,255,255,.28)}.nv:focus-visible{outline:2px solid #fff}.l{left:22px}.r{right:22px}
.cl{position:fixed;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}.cl:hover{background:rgba(255,255,255,.28)}.cl:focus-visible{outline:2px solid #fff}
.cn{position:fixed;left:0;right:0;bottom:22px;text-align:center;color:#fff}.cn b{font:700 22px 'Fraunces',serif;display:block}.cn span{font-size:13px;opacity:.7}
@media(max-width:640px){.gd{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Field notes</h1><span id="ct">8 photographs</span></div><div class="gd" id="gd"></div></div>
<div class="ov" id="ov"></div>
<button class="ui nv l" id="pv" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><button class="ui nv r" id="nx" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button><button class="ui cl" id="cl" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="ui cn" id="cn"></div>
<script>
function art(i,w,h){const P=[['#FFE0B2','#F57C00','#4E1F00'],['#BBDEFB','#1976D2','#0D2A55'],['#E1BEE7','#8E24AA','#2E0B3A'],['#C8E6C9','#388E3C','#0F3314'],['#F8BBD0','#D81B60','#4B0C24'],['#FFF59D','#F9A825','#4A3500'],['#B2EBF2','#00ACC1','#04343B'],['#FFCCBC','#E64A19','#431305']][i%8],s=i%4;const sc=[`<circle cx="300" cy="110" r="52" fill="${P[1]}"/><path d="M0 250 Q130 160 260 230 T520 200 V400 H0Z" fill="${P[2]}"/>`,`<path d="M0 330 L120 150 L220 270 L330 110 L520 300 V400 H0Z" fill="${P[2]}" opacity=".92"/><circle cx="130" cy="80" r="30" fill="#fff" opacity=".85"/>`,`<rect x="90" y="90" width="130" height="230" rx="65" fill="${P[1]}"/><rect x="230" y="170" width="170" height="150" rx="26" fill="${P[2]}" opacity=".9"/>`,`<g fill="none" stroke="${P[1]}" stroke-width="10"><path d="M0 230 Q130 170 260 230 T520 230"/><path d="M0 290 Q130 230 260 290 T520 290" opacity=".7"/><path d="M0 350 Q130 290 260 350 T520 350" opacity=".5"/></g><circle cx="380" cy="100" r="42" fill="${P[1]}"/>`][s];return '<svg viewBox="0 0 520 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="l'+i+(w||'')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P[0]+'"/><stop offset="1" stop-color="'+P[1]+'" stop-opacity=".5"/></linearGradient></defs><rect width="520" height="400" fill="url(#l'+i+(w||'')+')"/>'+sc+'</svg>'}
const N=[['Cliff light','Algarve','w2 h2'],['Tide line','Oregon',''],['Stone arch','Kyoto',''],['Dusk meadow','Provence','h2'],['Salt flat','Bolivia','w2'],['Cedar mist','Hokkaido',''],['Dune glow','Namib',''],['Still water','Como','']];
const gd=document.getElementById('gd'),ov=document.getElementById('ov');let cur=-1,fl=null;
N.forEach((n,i)=>{const b=document.createElement('button');b.className='th '+n[2];if(i===4)b.classList.add('hv');b.innerHTML=art(i,'t')+'<span class="cp">'+n[0]+'</span>';b.onclick=()=>open(i);gd.appendChild(b)});
const ths=[...gd.children];
function box(){const W=innerWidth,H=innerHeight,w=Math.min(W*.8,980),h=Math.min(H*.72,w*.72);return{l:(W-w)/2,t:(H-h)/2-16,w,h}}
function open(i){cur=i;const th=ths[i],r=th.getBoundingClientRect();fl=document.createElement('div');fl.className='fl';fl.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';fl.innerHTML=art(i,'f');document.body.appendChild(fl);th.style.visibility='hidden';ov.classList.add('on');ths.forEach(t=>t.classList.remove('hv'));requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=box();fl.style.cssText+=';left:'+b.l+'px;top:'+b.t+'px;width:'+b.w+'px;height:'+b.h+'px'}));cap()}
function cap(){document.getElementById('cn').innerHTML='<b>'+N[cur][0]+'</b><span>'+N[cur][1]+' &nbsp;·&nbsp; '+(cur+1)+' / '+N.length+'</span>'}
function close(){if(cur<0)return;const th=ths[cur],r=th.getBoundingClientRect();fl.style.left=r.left+'px';fl.style.top=r.top+'px';fl.style.width=r.width+'px';fl.style.height=r.height+'px';ov.classList.remove('on');const f=fl,t=th;setTimeout(()=>{f.remove();t.style.visibility=''},520);cur=-1}
function go(d){const n=(cur+d+N.length)%N.length;fl.style.opacity=0;const f=fl;setTimeout(()=>f.remove(),250);ths[cur].style.visibility='';cur=n;const b=box();fl=document.createElement('div');fl.className='fl';fl.style.cssText='left:'+b.l+'px;top:'+b.t+'px;width:'+b.w+'px;height:'+b.h+'px;opacity:0;transform:translateX('+(d*40)+'px)';fl.innerHTML=art(n,'f');document.body.appendChild(fl);ths[n].style.visibility='hidden';requestAnimationFrame(()=>requestAnimationFrame(()=>{fl.style.opacity=1;fl.style.transform=''}));cap()}
ov.onclick=close;document.getElementById('cl').onclick=close;document.getElementById('pv').onclick=()=>go(-1);document.getElementById('nx').onclick=()=>go(1);
addEventListener('keydown',e=>{if(cur<0)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
</script></body></html>
