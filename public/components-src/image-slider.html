<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hero Slider</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0B;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 18px;-webkit-font-smoothing:antialiased}
.s{position:relative;width:100%;max-width:820px;aspect-ratio:16/10;border-radius:28px;overflow:hidden;background:#111;box-shadow:0 50px 100px -34px #000,0 0 0 1px #1F1F24}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .9s ease,transform 6s ease-out}
.sl.on{opacity:1;transform:scale(1)}
.sl .bg{position:absolute;inset:0;background:var(--g)}
.sl svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
.sl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 30%,rgba(0,0,0,.72))}
.cp{position:absolute;left:34px;bottom:56px;z-index:2;max-width:480px;transform:translateY(14px);opacity:0;transition:all .8s .25s}.on .cp{transform:none;opacity:1}
.cp small{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.8)}
.cp h1{font:500 clamp(30px,5vw,52px)/1 'Fraunces',serif;letter-spacing:-.035em;margin-top:10px}.cp h1 em{font-weight:400}
.ar{position:absolute;top:50%;z-index:3;width:50px;height:50px;margin-top:-25px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,10,12,.35);backdrop-filter:blur(10px);color:#fff;cursor:pointer;display:grid;place-items:center;transition:all .2s;opacity:0}
.s:hover .ar,.ar:focus-visible{opacity:1}.ar:hover{background:#fff;color:#0A0A0B}.ar:focus-visible{outline:2px solid #fff;outline-offset:3px}
.pv{left:18px}.nx{right:18px}
.pg{position:absolute;left:34px;right:34px;bottom:24px;z-index:3;display:flex;gap:8px;align-items:center}
.pg button{flex:1;height:28px;border:0;background:none;cursor:pointer;position:relative;padding:0}
.pg button::before{content:"";position:absolute;left:0;right:0;top:12px;height:3px;border-radius:3px;background:rgba(255,255,255,.28)}
.pg button i{position:absolute;left:0;top:12px;height:3px;border-radius:3px;background:#fff;width:0}
.pg button.dn i{width:100%}.pg button.on i{animation:f var(--d,5500ms) linear forwards}
.pg button:focus-visible{outline:2px solid #fff;outline-offset:1px}
@keyframes f{to{width:100%}}
.ct{position:absolute;right:30px;top:24px;z-index:3;font:600 12.5px 'Inter';letter-spacing:.08em;background:rgba(10,10,12,.4);backdrop-filter:blur(10px);padding:7px 12px;border-radius:99px}
@media(prefers-reduced-motion:reduce){.sl,.cp{transition:none}.pg button.on i{animation:none;width:100%}}
</style></head><body>
<div class="s" id="s" aria-roledescription="carousel" aria-label="Featured destinations">
 <div class="sl on"><div class="bg" style="--g:linear-gradient(180deg,#2B1B5A 0%,#C2417F 50%,#FF9A5C 78%,#FFD08A)"></div><svg viewBox="0 0 800 200" preserveAspectRatio="none"><path d="M0 120 120 60l90 50 120-80 130 90 110-60 100 70 130-50v150H0Z" fill="#2A1148"/><path d="M0 160l140-50 120 40 140-60 160 60 120-40 120 30v60H0Z" fill="#190A2E"/></svg><div class="cp"><small>Amalfi Coast</small><h1>Where the light <em>lingers</em></h1></div></div>
 <div class="sl"><div class="bg" style="--g:linear-gradient(180deg,#0C2D57 0%,#1672A6 55%,#7DD3E8 100%)"></div><svg viewBox="0 0 800 200" preserveAspectRatio="none"><path d="M0 90C100 60 180 120 300 90S500 40 620 90 740 70 800 80v120H0Z" fill="#0B4F78" opacity=".85"/><path d="M0 130C120 100 220 150 340 125S560 90 680 130 760 120 800 120v80H0Z" fill="#06304F"/></svg><div class="cp"><small>Maldives</small><h1>Water in every <em>shade</em></h1></div></div>
 <div class="sl"><div class="bg" style="--g:linear-gradient(180deg,#0F2A1C 0%,#1F6B45 55%,#C7E87A 100%)"></div><svg viewBox="0 0 800 200" preserveAspectRatio="none"><path d="M0 100 70 30l50 60 70-70 80 90 90-60 90 80 110-70 90 70 150-40v120H0Z" fill="#0E3B25"/><path d="M0 150l100-40 110 50 120-60 140 60 130-50 200 50v40H0Z" fill="#082416"/></svg><div class="cp"><small>Banff</small><h1>Quiet <em>peaks</em></h1></div></div>
 <span class="ct" id="c" aria-live="polite">1 / 3</span>
 <button class="ar pv" id="pv" aria-label="Previous slide"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
 <button class="ar nx" id="nx" aria-label="Next slide"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
 <div class="pg" id="pg"></div></div>
<script>
const s=document.getElementById('s'),sl=[...s.querySelectorAll('.sl')],pg=document.getElementById('pg'),DUR=5500;let i=0,tm,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
pg.innerHTML=sl.map((_,k)=>'<button aria-label="Slide '+(k+1)+'"><i></i></button>').join('');const bs=[...pg.children];bs.forEach(b=>b.style.setProperty('--d',DUR+'ms'));
function go(k){i=(k+sl.length)%sl.length;sl.forEach((x,j)=>x.classList.toggle('on',j===i));bs.forEach((b,j)=>{b.classList.remove('on','dn');if(j<i)b.classList.add('dn');void b.offsetWidth;if(j===i)b.classList.add('on')});document.getElementById('c').textContent=(i+1)+' / '+sl.length;arm()}
function arm(){clearTimeout(tm);if(!paused)tm=setTimeout(()=>go(i+1),DUR)}
bs.forEach((b,k)=>b.onclick=()=>go(k));document.getElementById('pv').onclick=()=>go(i-1);document.getElementById('nx').onclick=()=>go(i+1);
s.addEventListener('mouseenter',()=>{clearTimeout(tm);s.querySelectorAll('.pg button.on i').forEach(x=>x.style.animationPlayState='paused')});
s.addEventListener('mouseleave',()=>go(i));addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});go(0);
</script></body></html>
