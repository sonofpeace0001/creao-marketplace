<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magnify Dock Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#6D5BD0 0%,#C65BCF 45%,#FF8A65 100%);color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 14px 60px;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.25),transparent 40%),radial-gradient(circle at 85% 80%,rgba(0,0,0,.2),transparent 45%)}
.ct{position:relative;z-index:1;width:100%;flex:1;display:grid;place-items:center;text-align:center;padding:20px 20px 80px}.ct h1{font-size:clamp(36px,7vw,72px);font-weight:700;letter-spacing:-.06em;line-height:1}.ct p{font-size:17px;opacity:.85;margin-top:12px}
.dk{position:relative;display:flex;align-items:flex-end;gap:10px;height:84px;padding:0 14px 12px;border-radius:26px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(22px);box-shadow:0 30px 50px -20px rgba(40,10,60,.55)}
.it{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:var(--s,56px);height:var(--s,56px);flex:none;text-decoration:none;color:#fff;outline:0}
.it .ic{width:100%;height:100%;border-radius:calc(var(--s,56px)*.26);display:grid;place-items:center;background:var(--g);box-shadow:0 8px 14px -6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5)}.it .ic svg{width:52%;height:52%}
.it .tp{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(6px);background:rgba(25,18,45,.85);backdrop-filter:blur(10px);border-radius:10px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}.it.hv .tp,.it:focus-visible .tp{opacity:1;transform:translateX(-50%)}
.it .dt{position:absolute;bottom:-9px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:0}.it.on .dt{opacity:.9}
.it:focus-visible .ic{box-shadow:0 0 0 3px #fff}
.sep{width:1.5px;align-self:stretch;margin:8px 4px 6px;background:rgba(255,255,255,.35);border-radius:2px}
@media(prefers-reduced-motion:reduce){.it{--s:56px!important}}
</style></head><body>
<div class="ct"><div><h1>Dock navigation</h1><p>Hover the dock and icons swell like on macOS.</p></div></div>
<nav class="dk" id="dk" aria-label="Dock"></nav>
<script>
const I=[['Home','#fff','linear-gradient(135deg,#60A5FA,#2563EB)','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',1],['Projects','','linear-gradient(135deg,#34D399,#059669)','M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],['Messages','','linear-gradient(135deg,#F472B6,#DB2777)','M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'],['Calendar','','linear-gradient(135deg,#FBBF24,#F97316)','M4 6h16v14H4zM8 3v4M16 3v4M4 11h16'],0,['Music','','linear-gradient(135deg,#A78BFA,#6D28D9)','M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'],['Settings','','linear-gradient(135deg,#94A3B8,#475569)','M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.200l2-1.500-2-3.400-2.300 1a7 7 0 0 0-2-1.200L14 3h-4l-.4 2.700a7 7 0 0 0-2 1.200l-2.300-1-2 3.400 2 1.500A7 7 0 0 0 5 12c0 .4 0 .8.100 1.200l-2 1.500 2 3.400 2.300-1a7 7 0 0 0 2 1.200L10 21h4l.4-2.700a7 7 0 0 0 2-1.200l2.300 1 2-3.400-2-1.500c.1-.4.100-.8.100-1.200z']];
const dk=document.getElementById('dk'),els=[];
I.forEach(i=>{if(!i){const s=document.createElement('span');s.className='sep';dk.appendChild(s);return}const a=document.createElement('a');a.href='#';a.className='it'+(i[4]?' on':'');a.style.setProperty('--g',i[2]);a.setAttribute('aria-label',i[0]);a.innerHTML='<span class="tp">'+i[0]+'</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+i[3]+'"/></svg></span><i class="dt"></i>';a.onclick=e=>{e.preventDefault();els.forEach(x=>x.a.classList.remove('on'));a.classList.add('on')};dk.appendChild(a);els.push({a,s:56,t:56})});
let mx=null,real=false,tt=0;const BASE=56,MAX=96,R=150;
dk.addEventListener('pointermove',e=>{real=true;mx=e.clientX});dk.addEventListener('pointerleave',()=>{real=false;mx=null});
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function f(){tt+=.014;let x=mx;if(!real){const r=dk.getBoundingClientRect();x=r.left+r.width*(.5+Math.sin(tt)*.3)}
 let hov=null,best=1e9;els.forEach(o=>{const r=o.a.getBoundingClientRect(),c=r.left+r.width/2,d=Math.abs(x-c);const k=x==null?0:Math.max(0,1-d/R);o.t=BASE+(MAX-BASE)*Math.cos((1-k)*Math.PI/2)**1.4*(k>0?1:0);if(d<best&&x!=null){best=d;hov=o}});
 els.forEach(o=>{o.s+=(o.t-o.s)*.2;o.a.style.setProperty('--s',o.s.toFixed(1)+'px');o.a.classList.toggle('hv',o===hov&&best<46&&(real||false)||(o===hov&&!real&&best<60))});
 if(!reduce)requestAnimationFrame(f)}
tt=.9;f();
</script></body></html>
