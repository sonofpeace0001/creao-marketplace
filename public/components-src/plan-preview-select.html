<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plan Preview Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ECEBF8;color:#171335;font-family:'Sora',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:780px;align-items:start}
.fm{background:#fff;border-radius:28px;padding:26px;box-shadow:0 40px 70px -44px rgba(70,40,160,.5),0 0 0 1px rgba(23,19,53,.06);position:relative;min-height:380px}
.fm h1{font-size:20px;font-weight:800;letter-spacing:-.04em}.fm>p{font-size:13.5px;color:#7A74A6;margin:4px 0 18px}.lb{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.tr{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid #DDD9F0;background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:all .2s}.tr:hover{border-color:#B8B1E6}.tr[aria-expanded=true]{border-color:#6D4DF2;box-shadow:0 0 0 4px rgba(109,77,242,.13)}.tr:focus-visible{outline:3px solid #171335;outline-offset:2px}
.ic{width:38px;height:38px;border-radius:12px;background:var(--g);display:grid;place-items:center;color:#fff;flex:none}.tr .tx{flex:1}.tr b{display:block;font-size:15px;font-weight:700}.tr span{font-size:12.5px;color:#7A74A6}.tr .ch{transition:transform .25s;color:#8E88B8}.tr[aria-expanded=true] .ch{transform:rotate(180deg)}
.pn{position:absolute;left:26px;right:26px;top:128px;background:#fff;border:1px solid #E6E2F6;border-radius:20px;padding:6px;box-shadow:0 30px 50px -16px rgba(70,40,160,.4);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top;pointer-events:none;transition:all .22s cubic-bezier(.3,1.3,.5,1);z-index:5}.pn.op{opacity:1;transform:none;pointer-events:auto}
.op2{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:14px;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:background .15s}.op2:hover,.op2.hl{background:#F5F3FF}.op2:focus-visible{outline:2px solid #6D4DF2}.op2[aria-selected=true]{background:#EFEBFF}.op2 em{margin-left:auto;font-style:normal;font-weight:800;font-size:14px}.op2 b{display:block;font-size:14px;font-weight:700}.op2 span{font-size:12px;color:#7A74A6}.op2 .tick{width:18px;color:#6D4DF2;opacity:0}.op2[aria-selected=true] .tick{opacity:1}
.sm{margin-top:96px;border-top:1px dashed #E0DCF4;padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}.sm span{font-size:13px;color:#7A74A6}.sm b{font-size:24px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pv{background:linear-gradient(160deg,var(--g1),var(--g2));border-radius:28px;padding:26px;color:#fff;position:relative;overflow:hidden;min-height:380px;transition:background .5s;box-shadow:0 40px 70px -44px var(--g1)}
.pv::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.pv small{position:relative;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}.pv h2{position:relative;font-size:30px;font-weight:800;letter-spacing:-.05em;margin:6px 0 4px}.pv .pr{position:relative;font-size:40px;font-weight:800;letter-spacing:-.06em;margin-bottom:16px}.pv .pr span{font-size:15px;font-weight:600;opacity:.8;letter-spacing:0}
.pv ul{position:relative;list-style:none;display:grid;gap:10px}.pv li{display:flex;gap:10px;font-size:14.5px;font-weight:500;align-items:center;animation:in .4s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i)*50ms)}@keyframes in{from{opacity:0;transform:translateX(-8px)}}.pv li svg{flex:none;background:rgba(255,255,255,.25);border-radius:50%;padding:3px;width:20px;height:20px}
@media(max-width:700px){.c{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="c"><div class="fm"><h1>Pick your plan</h1><p>The preview on the right updates as you choose.</p><span class="lb" id="lbl">Plan</span>
<button class="tr" id="tr" aria-haspopup="listbox" aria-expanded="true" aria-labelledby="lbl tt"><span class="ic" id="ic"></span><span class="tx"><b id="tt"></b><span id="ts"></span></span><svg class="ch" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
<div class="pn op" id="pn" role="listbox" aria-labelledby="lbl"></div><div class="sm"><span>Billed monthly</span><b id="tot"></b></div></div>
<div class="pv" id="pv" aria-live="polite"><small id="pk"></small><h2 id="ph"></h2><div class="pr" id="pp"></div><ul id="fl"></ul></div></div>
<script>
const P=[['Starter','For side projects',0,['#34D399','#047857'],'linear-gradient(135deg,#34D399,#047857)',['3 projects','Community support','1 GB storage','Basic analytics']],['Pro','For growing teams',24,['#8B5CF6','#4F46E5'],'linear-gradient(135deg,#8B5CF6,#4F46E5)',['Unlimited projects','Priority support','100 GB storage','Advanced analytics','Custom domains']],['Business','For scaling companies',79,['#F472B6','#BE185D'],'linear-gradient(135deg,#F472B6,#BE185D)',['Everything in Pro','SSO and audit logs','1 TB storage','Dedicated manager','99.99% SLA']]];
let cur=1;const tr=document.getElementById('tr'),pn=document.getElementById('pn'),CK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>',ICO='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
pn.innerHTML=P.map((p,i)=>'<button class="op2" role="option" data-i="'+i+'" aria-selected="'+(i===cur)+'"><span class="ic" style="--g:'+p[4]+'">'+ICO+'</span><div><b>'+p[0]+'</b><span>'+p[1]+'</span></div><em>'+(p[2]?'$'+p[2]:'Free')+'</em><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></button>').join('');
function set(i){cur=i;const p=P[i];document.getElementById('ic').style.setProperty('--g',p[4]);document.getElementById('ic').style.background=p[4];document.getElementById('ic').innerHTML=ICO;document.getElementById('tt').textContent=p[0];document.getElementById('ts').textContent=p[1];document.getElementById('tot').textContent=p[2]?'$'+p[2]+'/mo':'Free';
 const pv=document.getElementById('pv');pv.style.setProperty('--g1',p[3][0]);pv.style.setProperty('--g2',p[3][1]);document.getElementById('pk').textContent=i===1?'Most popular':'Plan';document.getElementById('ph').textContent=p[0];document.getElementById('pp').innerHTML=(p[2]?'$'+p[2]:'Free')+'<span>'+(p[2]?' /month':'')+'</span>';document.getElementById('fl').innerHTML=p[5].map((f,k)=>'<li style="--i:'+k+'">'+CK+f+'</li>').join('');pn.querySelectorAll('.op2').forEach((b,k)=>b.setAttribute('aria-selected',k===i))}
function open(o){pn.classList.toggle('op',o);tr.setAttribute('aria-expanded',o)}tr.onclick=()=>open(!pn.classList.contains('op'));pn.querySelectorAll('.op2').forEach(b=>b.onclick=()=>{set(+b.dataset.i);open(false);tr.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){open(false);tr.focus()}if(pn.classList.contains('op')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();set(Math.max(0,Math.min(2,cur+(e.key==='ArrowDown'?1:-1))))}});document.addEventListener('pointerdown',e=>{if(!pn.contains(e.target)&&!tr.contains(e.target))open(false)});set(1);
</script></body></html>
