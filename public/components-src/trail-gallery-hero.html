<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trail Gallery Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F1EA;color:#151412;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;cursor:crosshair}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;isolation:isolate}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,4vw,44px);position:relative;z-index:5}
.lg{font-weight:800;font-size:20px;letter-spacing:-.05em}nav ul{display:flex;gap:28px;list-style:none;font-size:14px;font-weight:600;color:#6F6A5E}nav a{color:inherit;text-decoration:none}
.nb{border:0;border-radius:99px;padding:11px 20px;background:#151412;color:#F4F1EA;font:700 13px 'Bricolage Grotesque';cursor:pointer}.nb:focus-visible,.b1:focus-visible{outline:3px solid #FF5A1F;outline-offset:3px}
.c{position:relative;z-index:4;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 40px;pointer-events:none}
.c>*{pointer-events:auto}
.eb{font:500 12px 'DM Mono';letter-spacing:.2em;text-transform:uppercase;color:#7A7467}
h1{font-weight:800;font-size:clamp(46px,10.5vw,150px);line-height:.88;letter-spacing:-.065em;margin:18px 0 20px;mix-blend-mode:multiply}
h1 em{font-style:normal;color:#FF5A1F}
.sb{max-width:460px;font-size:clamp(15px,1.7vw,18px);line-height:1.5;color:#5C574B;font-weight:500}
.b1{margin-top:26px;border:0;border-radius:99px;padding:17px 30px;background:#FF5A1F;color:#fff;font:700 16px 'Bricolage Grotesque';cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.b1 svg{width:18px;height:18px}
.hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font:500 11px 'DM Mono';letter-spacing:.18em;text-transform:uppercase;color:#9B9486;z-index:4;transition:opacity .4s}
.tile{position:absolute;width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);border-radius:var(--r);background:var(--bg);box-shadow:0 18px 26px -14px rgba(21,20,18,.45);overflow:hidden;z-index:2;pointer-events:none;transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(.2);opacity:0;animation:trail 1.700s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes trail{12%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(1)}70%{opacity:1;transform:translate(var(--x),calc(var(--y) - 10px)) rotate(var(--rot)) scale(1)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) - 40px)) rotate(calc(var(--rot) + 8deg)) scale(.85)}}
.tile::before{content:"";position:absolute;inset:0;background:var(--art)}
.tile span{position:absolute;left:10px;bottom:8px;font:500 9px 'DM Mono';letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
@media(max-width:680px){nav ul{display:none}}
@media(prefers-reduced-motion:reduce){.tile{animation-duration:.01s}}
</style></head><body>
<section class="hero" id="hero"><nav><div class="lg">Folio&mdash;</div><ul><li><a href="#">Work</a></li><li><a href="#">Studio</a></li><li><a href="#">Journal</a></li></ul><button class="nb">Start a project</button></nav>
<div class="c"><div class="eb">Independent design studio, Lisbon and Lagos</div><h1>Work worth <em>following</em></h1><p class="sb">We design identities, products and films for companies that would rather be remembered than liked.</p><button class="b1">See selected work<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<div class="hint" id="hint">Move your cursor</div></section>
<script>
const hero=document.getElementById('hero');
const ART=[['linear-gradient(135deg,#FF5A1F,#FFB36B)','radial-gradient(circle at 70% 30%,rgba(255,255,255,.55) 0 18%,transparent 19%)','Mono'],['linear-gradient(160deg,#1F3BFF,#7C8CFF)','repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 4px,transparent 4px 14px)','Halo'],['linear-gradient(140deg,#0E9F6E,#9BE8C3)','conic-gradient(from 90deg at 30% 70%,rgba(255,255,255,.45),transparent 40%)','Fern'],['linear-gradient(150deg,#151412,#4B4638)','radial-gradient(circle at 30% 70%,#FF5A1F 0 16%,transparent 17%),radial-gradient(circle at 70% 30%,#F4F1EA 0 10%,transparent 11%)','Ember'],['linear-gradient(135deg,#F7C6E0,#B89CFF)','linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 40% 60%,transparent 60%)','Plume'],['linear-gradient(145deg,#FFD84D,#FF8A3D)','radial-gradient(circle at 50% 120%,#151412 0 40%,transparent 41%)','Dusk']];
const SZ=[[120,160],[150,110],[110,110],[130,170],[160,120]];let last=null,n=0,real=0,dist=0;
function drop(x,y){const a=ART[n%ART.length],s=SZ[Math.floor(Math.random()*SZ.length)],t=document.createElement('div');t.className='tile';
 t.style.cssText='left:0;top:0;--x:'+x+'px;--y:'+y+'px;--w:'+s[0]+'px;--h:'+s[1]+'px;--r:'+(n%3===0?'999px':n%3===1?'16px':'4px')+';--bg:'+a[0]+';--art:'+a[1]+';--rot:'+((Math.random()*24-12)|0)+'deg';
 t.innerHTML='<span>'+a[2]+' 0'+(n%9+1)+'</span>';hero.appendChild(t);n++;setTimeout(()=>t.remove(),1800)}
function move(x,y){const r=hero.getBoundingClientRect();x-=r.left;y-=r.top;if(!last){last=[x,y];return}dist+=Math.hypot(x-last[0],y-last[1]);last=[x,y];if(dist>95){dist=0;drop(x,y)}document.getElementById('hint').style.opacity=0}
addEventListener('pointermove',e=>{real=performance.now();move(e.clientX,e.clientY)});
/* Idle demo: a ghost cursor traces a looping figure across the hero so the trail keeps dropping work, until a real pointer moves. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){setTimeout(()=>(function loop(nw){if(nw-real>2200){const t=nw/1000,r=hero.getBoundingClientRect();move(r.left+r.width*(.5+.4*Math.sin(t*.9)),r.top+r.height*(.5+.32*Math.sin(t*1.4+.5)))}requestAnimationFrame(loop)})(0),0)}
/* Pre-seed a few tiles so the first frame already shows the effect. */
setTimeout(()=>{const r=hero.getBoundingClientRect();[[.18,.32],[.3,.62],[.72,.28],[.84,.58],[.58,.74]].forEach(([a,b],i)=>setTimeout(()=>drop(r.width*a,r.height*b),i*60))},120);
</script></body></html>
