<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spinner Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F1EA;color:#1B1A17;font-family:'Instrument Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:640px;background:#fff;border:1.5px solid #1B1A17;border-radius:24px;padding:22px;box-shadow:7px 7px 0 #1B1A17}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.hd h1{font-size:18px;font-weight:700;letter-spacing:-.03em}.hd span{font:500 11.5px 'DM Mono',monospace;color:#8C8677;letter-spacing:.08em}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.t{aspect-ratio:1;border:1.5px solid #E6E1D5;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#FBFAF6}.t b{font:500 11px 'DM Mono',monospace;color:#8C8677;letter-spacing:.08em}
.s1{width:34px;height:34px;border-radius:50%;border:4px solid #E6E1D5;border-top-color:#FF5A36;animation:r 0.9s linear infinite}
.s2{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 30%,#2563EB);-webkit-mask:radial-gradient(circle 11px,transparent 98%,#000 100%);mask:radial-gradient(circle 11px,transparent 98%,#000 100%);animation:r 1s linear infinite}
.s3{position:relative;width:34px;height:34px;animation:r 1.8s linear infinite}.s3 i{position:absolute;left:50%;top:0;width:4px;height:9px;margin-left:-2px;border-radius:3px;background:#1B1A17;transform-origin:50% 17px}
.s4{width:30px;height:30px;border:4px solid #1B1A17;border-radius:6px;animation:fl 1.6s ease-in-out infinite}
.s5{display:grid;grid-template-columns:repeat(3,9px);gap:4px}.s5 i{width:9px;height:9px;border-radius:2px;background:#16A34A;animation:gr 1.2s ease-in-out infinite}.s5 i:nth-child(1),.s5 i:nth-child(5),.s5 i:nth-child(9){animation-delay:0s}.s5 i:nth-child(2),.s5 i:nth-child(6),.s5 i:nth-child(7){animation-delay:.15s}.s5 i:nth-child(3),.s5 i:nth-child(4),.s5 i:nth-child(8){animation-delay:.3s}
.s6{position:relative;width:34px;height:34px}.s6::before,.s6::after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid transparent}.s6::before{border-top-color:#9333EA;animation:r 1s linear infinite}.s6::after{inset:7px;border-bottom-color:#F59E0B;animation:r .7s linear infinite reverse}
.s7{width:34px;height:34px;border-radius:50%;background:#EC4899;animation:mo 1.4s ease-in-out infinite}
.s8{display:flex;gap:4px;align-items:flex-end;height:30px}.s8 i{width:5px;background:#0891B2;border-radius:2px;animation:ba 1s ease-in-out infinite}.s8 i:nth-child(1){height:30%}.s8 i:nth-child(2){height:60%;animation-delay:.1s}.s8 i:nth-child(3){height:100%;animation-delay:.2s}.s8 i:nth-child(4){height:60%;animation-delay:.3s}.s8 i:nth-child(5){height:30%;animation-delay:.4s}
@keyframes r{to{transform:rotate(360deg)}}@keyframes fl{0%{transform:rotate(0)}50%{transform:rotate(180deg) scale(.7);border-radius:50%}100%{transform:rotate(360deg)}}
@keyframes gr{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.3);opacity:.3}}@keyframes mo{0%,100%{transform:scale(.4)}50%{transform:scale(1);border-radius:30%}}@keyframes ba{0%,100%{filter:brightness(1);transform:scaleY(1)}50%{filter:brightness(1.4);transform:scaleY(.4)}}
@media(max-width:520px){.g{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:8s!important}}
</style></head><body>
<div class="c"><div class="hd"><h1>Spinner set</h1><span>8 VARIANTS</span></div><div class="g" id="g"></div></div>
<script>
const S=[['<div class="s1" role="status" aria-label="Loading"></div>','RING'],['<div class="s2" role="status" aria-label="Loading"></div>','ARC'],['<div class="s3" role="status" aria-label="Loading">'+Array.from({length:12},(_,i)=>'<i style="transform:rotate('+i*30+'deg);opacity:'+(.15+i*.07)+'"></i>').join('')+'</div>','SPOKES'],['<div class="s4" role="status" aria-label="Loading"></div>','FLIP'],['<div class="s5" role="status" aria-label="Loading">'+'<i></i>'.repeat(9)+'</div>','GRID'],['<div class="s6" role="status" aria-label="Loading"></div>','DUAL'],['<div class="s7" role="status" aria-label="Loading"></div>','MORPH'],['<div class="s8" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i></div>','WAVE']];
document.getElementById('g').innerHTML=S.map(s=>'<div class="t">'+s[0]+'<b>'+s[1]+'</b></div>').join('');
</script></body></html>
