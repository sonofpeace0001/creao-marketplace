<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mood Dial Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFF8EC;color:#231A12;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.f{--h:84;--col:hsl(var(--h) 80% 52%);width:100%;max-width:440px;border-radius:30px;padding:28px;background:#fff;box-shadow:0 40px 60px -36px rgba(35,26,18,.4),inset 0 0 0 1px rgba(35,26,18,.07)}
.f h1{font:800 26px/1.05 'Bricolage Grotesque';letter-spacing:-.04em;text-align:center}.f>p{color:#85735F;font-size:14px;text-align:center;margin:8px 0 8px}
.face{display:block;width:170px;height:170px;margin:6px auto 4px;filter:drop-shadow(0 18px 18px color-mix(in srgb,var(--col) 40%,transparent))}
.face .bg{fill:var(--col);transition:fill .15s}
.face .mouth,.face .brow,.face .eye{transition:all .18s cubic-bezier(.3,1.3,.4,1)}
.face .mouth{fill:none;stroke:#231A12;stroke-width:5;stroke-linecap:round}.face .brow{stroke:#231A12;stroke-width:5;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
.score{text-align:center;font:800 54px/1 'Bricolage Grotesque';letter-spacing:-.05em;color:var(--col);transition:color .15s}
.cap{text-align:center;font-weight:600;font-size:15px;color:#6E5C48;margin:2px 0 14px;min-height:22px}
.rg{position:relative;padding:0 2px}
.rg input{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;outline:0;cursor:pointer;background:linear-gradient(90deg,hsl(0 80% 55%),hsl(40 90% 55%),hsl(84 80% 50%),hsl(130 70% 45%))}
.rg input::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:4px solid var(--col);box-shadow:0 6px 12px rgba(35,26,18,.3);transition:transform .15s}
.rg input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--col);box-shadow:0 6px 12px rgba(35,26,18,.3)}
.rg input:active::-webkit-slider-thumb{transform:scale(1.15)}.rg input:focus-visible{outline:3px solid #231A12;outline-offset:6px}
.tk{display:flex;justify-content:space-between;margin:10px 2px 0;font:700 11px 'DM Sans';color:#A8967F}
.ta{margin-top:20px}.ta label{display:block;font-size:13px;font-weight:700;color:#6E5C48;margin-bottom:8px}
.ta textarea{width:100%;height:76px;resize:none;border:0;border-radius:16px;background:#FBF3E4;padding:14px;font:500 15px 'DM Sans';color:#231A12;outline:0;box-shadow:inset 0 0 0 1.500px transparent;transition:box-shadow .2s}
.ta textarea:focus{box-shadow:inset 0 0 0 2px var(--col)}
.go{width:100%;margin-top:16px;border:0;border-radius:16px;padding:16px;background:#231A12;color:#FFF8EC;font:700 16px 'DM Sans';cursor:pointer}.go:focus-visible{outline:3px solid var(--col);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<form class="f" id="f" onsubmit="return false"><h1>How likely are you to recommend us?</h1><p>Slide to answer. One tap, no login.</p>
<svg class="face" viewBox="0 0 100 100" role="img" aria-label="Face reflecting the score"><circle class="bg" cx="50" cy="50" r="48"/><ellipse class="eye" id="el" cx="34" cy="42" rx="4.500" ry="6.500" fill="#231A12"/><ellipse class="eye" id="er" cx="66" cy="42" rx="4.500" ry="6.500" fill="#231A12"/><path class="brow" id="bl" d="M26 30h16"/><path class="brow" id="br" d="M58 30h16"/><path class="mouth" id="mo" d="M30 66Q50 80 70 66"/></svg>
<div class="score" id="sc">8</div><div class="cap" id="cp" aria-live="polite"></div>
<div class="rg"><input type="range" id="rg" min="0" max="10" step="1" value="8" aria-label="Likelihood to recommend, 0 to 10"><div class="tk"><span>Not at all</span><span>Extremely</span></div></div>
<div class="ta"><label for="ta" id="tl">What is the main reason for your score?</label><textarea id="ta" placeholder="Tell us in a sentence"></textarea></div><button class="go">Send feedback</button></form>
<script>
const f=document.getElementById('f'),rg=document.getElementById('rg'),sc=document.getElementById('sc'),cp=document.getElementById('cp'),mo=document.getElementById('mo'),bl=document.getElementById('bl'),br=document.getElementById('br'),el=document.getElementById('el'),er=document.getElementById('er'),tl=document.getElementById('tl');
const C=['Painful. Tell us what went wrong.','Very disappointed','Disappointed','Below expectations','Not quite there','Neutral','Fine, with room to grow','Pretty good','Good','Great','Love it. Thank you.'];
function set(v){v=+v;f.style.setProperty('--h',Math.round(v*12.5));sc.textContent=v;cp.textContent=C[v];const q=66+(v-5)*3.2;mo.setAttribute('d','M30 '+(66+(v>=5?0:(5-v)*1.2))+'Q50 '+(66+(v-5)*3.2)+' 70 '+(66+(v>=5?0:(5-v)*1.2)));
 const k=v>=5?(v-5)*.6:-(5-v)*4,ty=v>=5?-(v-5)*1.7:(5-v)*.6;bl.style.transform='rotate('+k+'deg) translateY('+ty+'px)';br.style.transform='rotate('+(-k)+'deg) translateY('+ty+'px)';
 const ry=v>7?6.5-(v-7)*1.2:6.5;el.setAttribute('ry',ry);er.setAttribute('ry',ry);tl.textContent=v>=9?'What do you love most?':v>=7?'What could make it a 10?':'What went wrong?'}
rg.addEventListener('input',()=>set(rg.value));set(8);
/* Idle demo: the dial sweeps through the scale so the face keeps changing, until the first real interaction. */
let off=false;['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>off=true,{once:true}));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const seq=[8,3,0,5,10,6],sleep=ms=>new Promise(r=>setTimeout(r,ms));
 (async()=>{await sleep(3600);let i=0;while(!off){const to=seq[i++%seq.length];let v=+rg.value;while(v!==to&&!off){v+=to>v?1:-1;rg.value=v;set(v);await sleep(120)}await sleep(1300)}})()}
</script></body></html>
