<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shake Attention Modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0C12;color:#EAEDF7;font-family:'Hanken Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:700px;height:560px;border-radius:28px;background:#12151F;overflow:hidden;box-shadow:0 44px 64px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08)}
.ed{position:absolute;inset:0;padding:22px 26px}.ed .tb{display:flex;gap:8px;margin-bottom:18px;font:500 12px 'Fira Code';color:#6E7798}.ed .tb i{width:10px;height:10px;border-radius:50%;background:#2A2F45}.ed h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:12px}.ed p{height:11px;border-radius:5px;background:#1D2234;margin-bottom:9px;width:92%}.ed p:nth-child(4){width:72%}.ed p:nth-child(5){width:84%}
.bk{position:absolute;inset:0;background:rgba(4,6,12,.62);backdrop-filter:blur(3px);opacity:0;transition:opacity .45s,background .3s}.bk.on{opacity:1}.bk.al{background:rgba(60,8,16,.7)}
.m{position:absolute;left:50%;top:50%;width:400px;margin:-215px 0 0 -200px;background:#fff;color:#14172B;border-radius:26px;padding:26px;box-shadow:0 30px 60px -16px rgba(0,0,0,.7);transform:translateY(40px) scale(.9);opacity:0;transition:transform .6s cubic-bezier(.3,1.5,.5,1),opacity .35s,box-shadow .3s}.m.on{transform:none;opacity:1}
.m.sk{animation:sk .55s cubic-bezier(.36,.07,.19,.97);box-shadow:0 30px 60px -16px rgba(0,0,0,.7),0 0 0 3px #EF4444,0 0 40px rgba(239,68,68,.55)}@keyframes sk{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-14px)}40%,60%{transform:translateX(14px)}}
.ic{width:48px;height:48px;border-radius:15px;background:#FFF1DC;display:grid;place-items:center;font-size:24px;margin-bottom:14px}.m h2{font-size:23px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}.m>p{font-size:14.500px;color:#6A7096;line-height:1.45;margin-bottom:14px}
.ch{display:grid;gap:6px;margin-bottom:12px}.ch div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#F4F5FB;font:500 12.500px 'Fira Code';color:#44497A}.ch div b{font-weight:500;padding:1px 7px;border-radius:5px;font-size:11px}.ch .a b{background:#DDF7E8;color:#0F8A5F}.ch .d b{background:#FFE3E3;color:#C0262E}.ch .m2 b{background:#E6EAFF;color:#3157D5}
.hn{height:0;overflow:hidden;font-size:13px;font-weight:700;color:#DC2626;transition:height .3s,margin .3s;display:flex;align-items:center;gap:7px}.hn.on{height:22px;margin-bottom:6px}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bt button{border:0;border-radius:13px;padding:13px;font:800 14px 'Hanken Grotesk';cursor:pointer;transition:transform .15s}.bt .p{background:#14172B;color:#fff;grid-column:1/3}.bt .s{background:#F0F1F9;color:#44497A}.bt .d{background:#FFEBEB;color:#C0262E}.bt .pr{transform:scale(.95)}
.ts{position:absolute;left:50%;bottom:22px;transform:translate(-50%,30px);padding:10px 18px;border-radius:99px;background:#16A34A;color:#fff;font-weight:800;font-size:13.500px;opacity:0;transition:all .45s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}.ts.on{opacity:1;transform:translate(-50%,0)}
.cl{position:absolute;left:0;top:0;width:22px;z-index:9;pointer-events:none;transition:transform .9s cubic-bezier(.5,0,.2,1)}.cl svg{width:22px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}.cl.pk svg{animation:ck .3s}@keyframes ck{40%{transform:scale(.75)}}
@media(max-width:480px){.m{width:92%;margin-left:-46%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="st" id="st"><div class="ed"><div class="tb"><i></i><i></i><i></i><span>pricing-page.md · edited</span></div><h1>Q1 pricing update</h1><p></p><p></p><p></p><p></p></div><div class="bk" id="bk"></div>
<div class="m" id="m"><div class="ic">⚠️</div><h2>You have unsaved changes</h2><p>If you leave now, these edits to the pricing page will be lost.</p><div class="ch"><div class="a"><b>+14</b>Updated annual discount copy</div><div class="m2"><b>~3</b>Rewrote plan comparison table</div><div class="d"><b>−2</b>Removed legacy enterprise tier</div></div><div class="hn" id="hn">⚠ Please choose an option to continue</div><div class="bt"><button class="p" id="sv">Save draft and leave</button><button class="s">Keep editing</button><button class="d">Discard</button></div></div>
<div class="ts" id="ts">✓ Draft saved</div><div class="cl" id="cl"><svg viewBox="0 0 24 24"><path d="M4 3l16 8-7 2-3 7Z" fill="#fff" stroke="#14172B" stroke-width="1.500" stroke-linejoin="round"/></svg></div></div>
<script>
const $=id=>document.getElementById(id),m=$('m'),bk=$('bk'),cl=$('cl'),sl=t=>new Promise(r=>setTimeout(r,t));let off=false;
function cur(x,y,inst){if(inst)cl.style.transition='none';cl.style.transform='translate('+x+'px,'+y+'px)';if(inst){void cl.offsetWidth;cl.style.transition=''}}
function show(v){m.classList.toggle('on',v);bk.classList.toggle('on',v);if(!v){bk.classList.remove('al');$('hn').classList.remove('on')}}
async function click(){cl.classList.add('pk');await sl(300);cl.classList.remove('pk')}
async function shake(){m.classList.remove('sk');void m.offsetWidth;m.classList.add('sk');bk.classList.add('al');$('hn').classList.add('on');await sl(700);m.classList.remove('sk')}
m.style.transition='none';bk.style.transition='none';show(true);$('hn').classList.add('on');m.classList.add('sk');m.style.animation='none';bk.classList.add('al');cur(40,60,true);requestAnimationFrame(()=>requestAnimationFrame(()=>{m.style.transition='';bk.style.transition='';m.style.animation=''}));
$('sv').onclick=()=>{off=true;show(false)};document.querySelector('.st').addEventListener('pointerdown',()=>{off=true});
/* Idle demo: an unsaved-changes dialog that protects the user; a cursor clicks the dim backdrop outside the dialog, and instead of closing it the card shakes side to side with a red ring and glow, the backdrop tints red and a warning line unfolds above the buttons, then the cursor moves to Save draft and leave, presses it, the dialog falls away and a green toast confirms the draft, before the dialog pops back for the next round, until you click. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);while(!off){m.classList.remove('sk');bk.classList.remove('al');$('hn').classList.remove('on');cur(40,60);await sl(900);await click();await shake();await sl(1200);const r=$('sv').getBoundingClientRect(),s=$('st').getBoundingClientRect();cur(r.left-s.left+r.width/2,r.top-s.top+r.height/2);await sl(1000);$('sv').classList.add('pr');await click();$('sv').classList.remove('pr');show(false);$('ts').classList.add('on');await sl(2200);$('ts').classList.remove('on');await sl(800);if(off)return;show(true);await sl(1400)}})()}
</script></body></html>
