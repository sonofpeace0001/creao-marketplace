<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Team Hover Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EDEAE3;color:#14130F;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{position:relative;width:100%;max-width:820px;background:#F7F4EC;border-radius:26px;padding:32px 36px;overflow:hidden;box-shadow:0 40px 70px -44px rgba(20,19,15,.55),0 0 0 1px rgba(20,19,15,.07)}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8C8778}
.ls{list-style:none}
.ls li{position:relative;border-top:1px solid #DCD7C8}.ls li:last-child{border-bottom:1px solid #DCD7C8}
.ls a{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:16px 0;color:inherit;text-decoration:none;cursor:pointer}
.ls a:focus-visible{outline:2px solid #C2410C;outline-offset:-2px}
.ls .n{font:500 13px 'Inter';color:#A7A18F}
.ls .nm{font:400 clamp(34px,6.4vw,66px)/1 'Instrument Serif',serif;letter-spacing:-.03em;transition:transform .45s cubic-bezier(.2,.8,.2,1),color .3s}
.ls .rl{font-size:14px;color:#8C8778;transition:color .3s}
.ls li.on .nm{transform:translateX(18px);color:#C2410C;font-style:italic}.ls li.on .rl{color:#14130F}
.ls:has(li.on) li:not(.on) .nm{color:#B8B2A0}
.fl{position:absolute;width:150px;height:190px;border-radius:14px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.8);transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1);box-shadow:0 24px 36px -14px rgba(20,19,15,.55);overflow:hidden;z-index:5;background:var(--g)}
.fl.on{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1)}
.fl::before{content:"";position:absolute;left:50%;top:34%;width:46%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:rgba(255,255,255,.88)}
.fl::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:34%;border-radius:60px 60px 0 0;background:rgba(255,255,255,.88)}
.fl span{position:absolute;left:10px;bottom:8px;z-index:2;font:600 11.5px 'Inter';letter-spacing:.06em;color:#14130F;background:rgba(255,255,255,.9);padding:2px 7px;border-radius:5px}
@media(max-width:560px){.c{padding:22px}.ls a{grid-template-columns:30px 1fr}.ls .rl{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c" id="c"><div class="hd"><span>The people</span><span>07 humans · 4 time zones</span></div><ul class="ls" id="ls"></ul><div class="fl" id="fl"><span id="fn"></span></div></div>
<script>
const T=[['Ines Duarte','Founder, Design','linear-gradient(160deg,#FFB48A,#E8562A)',-6],['Marcus Reid','Head of Product','linear-gradient(160deg,#9CC8FF,#3D6FE0)',5],['Priya Raman','Engineering Lead','linear-gradient(160deg,#B6F0C8,#2EA36A)',-4],['Tomas Berg','Brand and Motion','linear-gradient(160deg,#F7C4F0,#B24FD0)',7],['Aiko Tanaka','Customer Success','linear-gradient(160deg,#FFE29A,#E8A21B)',-7]];
const ls=document.getElementById('ls'),fl=document.getElementById('fl'),c=document.getElementById('c');
ls.innerHTML=T.map((t,i)=>'<li><a href="#" tabindex="0"><span class="n">0'+(i+1)+'</span><span class="nm">'+t[0]+'</span><span class="rl">'+t[1]+'</span></a></li>').join('');
const L=[...ls.children];let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(i,x,y){L.forEach((l,k)=>l.classList.toggle('on',k===i));if(i<0){fl.classList.remove('on');return}fl.style.setProperty('--g',T[i][2]);fl.style.setProperty('--r',T[i][3]+'deg');document.getElementById('fn').textContent=T[i][1];fl.classList.add('on');move(x,y)}
function move(x,y){const r=c.getBoundingClientRect();fl.style.left=Math.max(90,Math.min(r.width-90,x-r.left+110))+'px';fl.style.top=(y-r.top)+'px'}
L.forEach((l,i)=>{l.addEventListener('pointerenter',e=>show(i,e.clientX,e.clientY));l.addEventListener('pointermove',e=>move(e.clientX,e.clientY));l.addEventListener('pointerleave',()=>show(-1));l.querySelector('a').addEventListener('focus',()=>{const r=l.getBoundingClientRect();show(i,r.left+r.width*.6,r.top+r.height/2)});l.querySelector('a').addEventListener('blur',()=>show(-1));l.querySelector('a').addEventListener('click',e=>e.preventDefault())});
setTimeout(()=>{const r=L[1].getBoundingClientRect();show(1,r.left+r.width*.62,r.top+r.height/2)},60);
</script></body></html>
