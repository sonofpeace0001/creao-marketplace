<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edge Network Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(160deg,#EEF4FF,#F7F1FF);color:#13203A;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:820px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;background:#fff;border-radius:34px;padding:32px;box-shadow:0 40px 70px -44px rgba(19,32,58,.55),0 0 0 1px rgba(19,32,58,.06)}
.gb{position:relative;width:min(330px,70vw);aspect-ratio:1;margin:0 auto}
.sp{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff,#DCE8FF 50%,#B9CFFF 100%);box-shadow:inset -18px -16px 40px rgba(60,100,200,.28),0 40px 50px -28px rgba(60,100,200,.6);overflow:hidden}
.mer{position:absolute;inset:0}.mer i{position:absolute;left:50%;top:0;bottom:0;width:100%;margin-left:-50%;border-radius:50%;border:1.2px solid rgba(70,110,210,.25);transform:scaleX(var(--s));animation:sw 14s linear infinite;animation-delay:var(--d)}
@keyframes sw{0%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.lat{position:absolute;left:0;right:0;border-top:1.2px solid rgba(70,110,210,.22)}
.land{position:absolute;border-radius:48% 52% 55% 45%;background:rgba(70,110,210,.18)}
.sv{position:absolute;left:var(--x);top:var(--y);width:12px;height:12px;margin:-6px;border-radius:50%;background:#4F46E5;box-shadow:0 0 0 4px rgba(79,70,229,.2),0 0 16px rgba(79,70,229,.7);cursor:pointer;border:0;transition:transform .2s}
.sv:hover,.sv.on{transform:scale(1.5)}.sv.on{background:#06B6D4;box-shadow:0 0 0 5px rgba(6,182,212,.25),0 0 18px rgba(6,182,212,.8)}.sv:focus-visible{outline:2px solid #13203A;outline-offset:3px}
.sv::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid currentColor;color:#4F46E5;animation:pu 2.4s ease-out infinite;animation-delay:var(--d)}
@keyframes pu{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.tx small{font-size:12px;font-weight:700;letter-spacing:.16em;color:#4F46E5;text-transform:uppercase}
.tx h1{font-size:30px;font-weight:800;letter-spacing:-.045em;line-height:1.05;margin:8px 0 8px}.tx p{font-size:15px;color:#667697;line-height:1.55}
.ls{display:grid;gap:7px;margin-top:20px}
.ls button{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;border:1.5px solid #E5ECF8;background:#F8FAFE;border-radius:14px;padding:11px 14px;font:600 14px 'Plus Jakarta Sans';color:#13203A;cursor:pointer;text-align:left;transition:all .2s}
.ls button i{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2)}.ls button span{font-size:12.5px;color:#7A89AA;font-weight:600}
.ls button:hover{border-color:#C5D2F2}.ls button.on{border-color:#4F46E5;background:#EEEDFF}.ls button:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
@media(max-width:720px){.c{grid-template-columns:1fr;padding:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="gb"><div class="sp"><div class="land" style="left:20%;top:24%;width:30%;height:26%"></div><div class="land" style="left:54%;top:30%;width:26%;height:30%"></div><div class="land" style="left:30%;top:58%;width:20%;height:22%;border-radius:60% 40% 50% 50%"></div>
 <div class="mer"><i style="--s:1;--d:0s"></i><i style="--s:1;--d:-3.5s"></i><i style="--s:1;--d:-7s"></i><i style="--s:1;--d:-10.5s"></i></div><span class="lat" style="top:25%"></span><span class="lat" style="top:50%"></span><span class="lat" style="top:75%"></span>
 <button class="sv on" style="--x:30%;--y:34%;--d:0s" data-i="0" aria-label="New York"></button><button class="sv" style="--x:52%;--y:30%;--d:.5s" data-i="1" aria-label="Frankfurt"></button><button class="sv" style="--x:70%;--y:46%;--d:1s" data-i="2" aria-label="Singapore"></button><button class="sv" style="--x:36%;--y:66%;--d:1.5s" data-i="3" aria-label="São Paulo"></button></div></div>
 <div class="tx"><small>Global edge</small><h1>Fast wherever your users are.</h1><p>Requests are served from the closest of our 42 edge regions — typically within 30 ms.</p><div class="ls" id="ls"></div></div></div>
<script>
const R=[['New York','12 ms'],['Frankfurt','18 ms'],['Singapore','24 ms'],['São Paulo','29 ms']];let s=0;const ls=document.getElementById('ls');
function draw(){ls.innerHTML=R.map((r,i)=>'<button data-i="'+i+'" class="'+(i===s?'on':'')+'" aria-pressed="'+(i===s)+'"><i></i>'+r[0]+'<span>'+r[1]+'</span></button>').join('');document.querySelectorAll('.sv').forEach((p,i)=>p.classList.toggle('on',i===s))}
document.querySelector('.c').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){s=+b.dataset.i;draw()}});draw();
</script></body></html>
