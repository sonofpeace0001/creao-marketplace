<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sound Wave Toggle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{--c:#FF5A36;background:#16100E;color:#FBEFEA;font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(520px 360px at 50% 100%,rgba(255,90,54,.2),transparent 70%)}
.cd{width:100%;max-width:460px;border-radius:32px;background:#201714;padding:26px;display:grid;gap:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 40px 60px -36px rgba(0,0,0,.9)}
.tr{display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:center}.ar{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#FF5A36,#C2185B);position:relative;overflow:hidden}.ar::before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#1B1210;box-shadow:0 0 0 7px rgba(0,0,0,.25),0 0 0 14px rgba(0,0,0,.14)}.ar::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#FF5A36}
.on .ar{animation:rt 5s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
.tr b{display:block;font-size:20px;font-weight:800;letter-spacing:-.04em}.tr span{font:500 12.500px 'DM Mono';color:#A58C84}
.eq{display:flex;align-items:flex-end;gap:5px;height:76px;padding:0 4px}
.eq i{flex:1;border-radius:4px;background:linear-gradient(180deg,var(--c),#7A1D12);height:8px;transition:height .5s,opacity .5s,background .5s;opacity:.35}
.on .eq i{opacity:1;animation:eq 1s ease-in-out infinite;animation-delay:calc(var(--i)*-.09s)}
@keyframes eq{0%,100%{height:10%}25%{height:80%}50%{height:35%}75%{height:100%}}
.ct{display:flex;align-items:center;gap:16px}
.sp{position:relative;width:64px;height:64px;border-radius:50%;border:0;background:var(--c);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 14px 22px -8px var(--c);transition:background .4s,box-shadow .4s,transform .15s}
.sp:active{transform:scale(.92)}.sp:focus-visible{outline:3px solid #fff;outline-offset:4px}
.sp svg{width:30px;height:30px;overflow:visible}.sp svg *{fill:none;stroke:currentColor;stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round}
.sp .cn{fill:currentColor;stroke:none;transform-origin:8px 12px}.on .sp .cn{animation:vb .35s ease-in-out infinite alternate}@keyframes vb{from{transform:scale(1)}to{transform:scale(1.07,1.12)}}
.sp .w1,.sp .w2,.sp .w3{transform-origin:10px 12px;opacity:0;transition:opacity .3s}.on .sp .w1{opacity:1;animation:wv 1.500s ease-out infinite}.on .sp .w2{opacity:1;animation:wv 1.500s ease-out .25s infinite}.on .sp .w3{opacity:1;animation:wv 1.500s ease-out .5s infinite}
@keyframes wv{0%{opacity:0;transform:translateX(-3px) scale(.8)}30%{opacity:1}100%{opacity:0;transform:translateX(3px) scale(1.15)}}
.sp .sl{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s .05s}:not(.on) .sp .sl{stroke-dashoffset:0}
:not(.on) .sp{background:#3A2B27;box-shadow:none;color:#C9AFA6}
.vo{flex:1;display:grid;gap:8px}.vo .tp{display:flex;justify-content:space-between;font:500 12px 'DM Mono';color:#A58C84;letter-spacing:.06em}.vo .tk{position:relative;height:8px;border-radius:4px;background:#33241F;overflow:hidden}.vo .tk i{display:block;height:100%;width:var(--v,0%);border-radius:4px;background:linear-gradient(90deg,#FF8A5C,var(--c));transition:width .6s cubic-bezier(.3,1.2,.4,1)}
.lb{font:600 12px 'DM Mono';letter-spacing:.14em;text-align:center;color:#A58C84;transition:color .3s}.on .lb{color:var(--c)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="cd on" id="cd"><div class="tr"><div class="ar"></div><div><b>Night Drive</b><span>Kofi Mensah, 3:42</span></div></div>
<div class="eq" id="eq" aria-hidden="true"></div>
<div class="ct"><button class="sp" id="sp" aria-pressed="true" aria-label="Mute"><svg viewBox="0 0 24 24"><path class="cn" d="M3 9.500h3.500L11 5.500v13l-4.500-4H3Z"/><path class="w1" d="M14.500 9a4 4 0 0 1 0 6"/><path class="w2" d="M17 6.500a8 8 0 0 1 0 11"/><path class="w3" d="M19.500 4a12 12 0 0 1 0 16"/><path class="sl" pathLength="1" d="M15 9l6 6M21 9l-6 6"/></svg></button>
<div class="vo"><div class="tp"><span>Volume</span><span id="vt">72%</span></div><div class="tk"><i id="vf" style="--v:72%"></i></div></div></div>
<div class="lb" id="lb">PLAYING</div></div>
<script>
const cd=document.getElementById('cd'),sp=document.getElementById('sp'),eq=document.getElementById('eq'),vf=document.getElementById('vf'),vt=document.getElementById('vt'),lb=document.getElementById('lb');
for(let i=0;i<24;i++){const b=document.createElement('i');b.style.setProperty('--i',i);eq.appendChild(b)}
function set(on){cd.classList.toggle('on',on);sp.setAttribute('aria-pressed',on);sp.setAttribute('aria-label',on?'Mute':'Unmute');lb.textContent=on?'PLAYING':'MUTED';vf.style.setProperty('--v',on?'72%':'0%');vt.textContent=on?'72%':'0%'}
sp.onclick=()=>{off=true;set(!cd.classList.contains('on'))};
/* Idle demo: sound is muted and unmuted every 3s; the speaker cone throbs and three waves ripple outward when on, a slash draws across when muted, the equaliser and record stop, and the volume bar slides, until a real click. */
let off=false;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3000);while(!off){set(!cd.classList.contains('on'));await sleep(3000)}})()}
</script></body></html>
