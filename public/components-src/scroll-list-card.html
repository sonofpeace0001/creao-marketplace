<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Feed Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EEF1F6;color:#17202E;font-family:'Hanken Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px 20px;-webkit-font-smoothing:antialiased}
.card{position:relative;width:100%;max-width:420px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(23,32,46,.45),0 0 0 1px rgba(23,32,46,.06)}
.hd{padding:22px 24px 16px;border-bottom:1px solid #EDF0F5;display:flex;justify-content:space-between;align-items:flex-start}
.hd h1{font-size:21px;font-weight:800;letter-spacing:-.035em}.hd p{font-size:13.5px;color:#7A8498;margin-top:3px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#0E9F6E;background:#E1F7EE;padding:6px 11px;border-radius:99px}
.live i{width:7px;height:7px;border-radius:50%;background:#0E9F6E;animation:p 1.8s infinite}@keyframes p{50%{opacity:.3}}
.sc{height:340px;overflow-y:auto;scroll-behavior:smooth;position:relative}
.sc::-webkit-scrollbar{width:0}
.it{display:flex;gap:14px;padding:16px 24px;transition:background .2s}
.it:hover{background:#F7F9FC}
.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:700 13px 'Hanken Grotesk';color:#fff;background:var(--c)}
.bd b{font-size:15px;font-weight:700;letter-spacing:-.01em}.bd p{font-size:14px;color:#5A6577;line-height:1.45;margin-top:2px}
.bd time{display:block;margin-top:6px;font-size:12px;color:#9AA3B5;font-weight:600}
.fd{position:absolute;left:0;right:0;height:46px;pointer-events:none;z-index:2;transition:opacity .2s}
.top{top:67px;background:linear-gradient(#fff,transparent);opacity:0}.bot{bottom:0;background:linear-gradient(transparent,#fff)}
.up{position:absolute;right:16px;bottom:16px;z-index:3;display:flex;align-items:center;gap:6px;background:#17202E;color:#fff;border:0;border-radius:99px;font:700 13px 'Hanken Grotesk';padding:9px 14px;cursor:pointer;box-shadow:0 12px 24px -10px rgba(23,32,46,.7);opacity:0;transform:translateY(10px);pointer-events:none;transition:all .25s}
.up.on{opacity:1;transform:none;pointer-events:auto}
</style></head><body>
<div class="card"><div class="hd"><div><h1>Team activity</h1><p>Updates from the last 24 hours</p></div><span class="live"><i></i>Live</span></div>
 <div class="fd top" id="ft"></div><div class="fd bot" id="fb"></div>
 <div class="sc" id="sc"></div>
 <button class="up" id="up" aria-label="Scroll to top"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Top</button></div>
<script>
const D=[['MR','#2563EB','Marcus Reid','approved the Q3 launch plan','2 min ago'],['AK','#10B981','Aisha Khan','merged “Fix checkout rounding” into main','14 min ago'],['JT','#F59E0B','Jonas Tran','commented on Pricing page v4','38 min ago'],['SL','#EC4899','Sofia Lund','uploaded 6 new hero concepts','1 hr ago'],['DP','#8B5CF6','Dev Patel','closed 12 resolved bugs','2 hr ago'],['EO','#EF4444','Elena Ortiz','invited 3 reviewers to Brand refresh','3 hr ago'],['NB','#0EA5E9','Noah Brandt','scheduled the Friday retro','5 hr ago'],['YC','#14B8A6','Yuki Chen','shipped v2.8.1 to production','7 hr ago'],['LF','#F97316','Lena Fischer','updated the onboarding checklist','9 hr ago']];
const sc=document.getElementById('sc');sc.innerHTML=D.map(d=>'<div class="it"><div class="av" style="--c:'+d[1]+'">'+d[0]+'</div><div class="bd"><b>'+d[2]+'</b><p>'+d[3]+'</p><time>'+d[4]+'</time></div></div>').join('');
const ft=document.getElementById('ft'),fb=document.getElementById('fb'),up=document.getElementById('up');
function u(){ft.style.opacity=sc.scrollTop>4?1:0;fb.style.opacity=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4?0:1;up.classList.toggle('on',sc.scrollTop>120)}
sc.addEventListener('scroll',u);up.onclick=()=>sc.scrollTo({top:0});u();
</script></body></html>
