<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Advent Door Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1F17;color:#F6EBD0;font-family:'Nunito',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased;background-image:radial-gradient(700px 440px at 50% 0,rgba(214,69,65,.25),transparent 70%)}
.cd{position:relative;width:100%;max-width:640px;border-radius:30px;background:linear-gradient(180deg,#14382B,#0E2A20);padding:26px;box-shadow:0 44px 64px -34px #000,inset 0 0 0 2px rgba(231,196,106,.35);overflow:hidden}
.hd{text-align:center;margin-bottom:18px;position:relative}.hd small{font:800 12px 'Nunito';letter-spacing:.3em;color:#E7C46A;text-transform:uppercase}.hd h1{font:800 34px/1.05 'Fraunces',serif;letter-spacing:-.02em;margin-top:4px}.hd p{font-size:14px;color:#A7C2B2;margin-top:6px}
.gd{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;perspective:1100px;position:relative}
.dr{position:relative;aspect-ratio:1;transform-style:preserve-3d}
.bk{position:absolute;inset:0;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:34px;box-shadow:inset 0 3px 8px rgba(0,0,0,.45)}
.dp{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.1,.4,1)}.dr.op .dp{transform:rotateY(-78deg)}
.fr{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:grid;place-items:center;font:800 24px 'Fraunces',serif;color:#3A1D00;background:linear-gradient(135deg,#F7DE8F,#D8A93E 55%,#F2CE70);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 4px 8px rgba(0,0,0,.4)}
.fr::after{content:"";position:absolute;inset:6px;border-radius:8px;border:1.500px dashed rgba(58,29,0,.35)}
.fr.lk{background:linear-gradient(135deg,#8C2F2B,#C0443F 60%,#8C2F2B);color:#F6EBD0}.fr.lk::before{content:"🔒";position:absolute;right:6px;bottom:4px;font-size:11px;opacity:.7}
.ba{position:absolute;inset:0;border-radius:12px;background:#21493A;backface-visibility:hidden;transform:rotateY(180deg)}
.dr.pop .bk{animation:pp .6s .4s cubic-bezier(.3,1.8,.5,1)}@keyframes pp{from{transform:scale(.6)}}
.sn{position:absolute;inset:0;pointer-events:none;overflow:hidden}.sn i{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.7;animation:fl linear infinite}@keyframes fl{to{transform:translateY(700px) translateX(var(--x))}}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:14px;color:#A7C2B2;position:relative}.ft b{color:#E7C46A}
@media(max-width:560px){.gd{grid-template-columns:repeat(4,1fr)}.bk{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="cd"><div class="sn" id="sn"></div><div class="hd"><small>The 24 days of December</small><h1>Open a door a day</h1><p>Today is the 14th. Every door up to now is waiting for you.</p></div><div class="gd" id="gd"></div><div class="ft"><span>Opened <b id="oc">0</b> of 14 unlocked</span><span>Next surprise in 9h 24m</span></div></div>
<script>
const IC=['⭐','🎁','🕯️','🧦','🍪','🔔','🎄','🦌','⛄','🧣','🍫','🎶','❄️','🥧','🎅','🍊','🛷','🪅','🧁','🕊️','🌟','🍷','🎀','👼'],BG=['#2E5B8C','#8C3A5B','#4F7A38','#8C6A2E','#5B3A8C','#2E7A7A'];
const gd=document.getElementById('gd'),doors=[],sl=ms=>new Promise(r=>setTimeout(r,ms));let off=false,n=0;
for(let i=0;i<24;i++){const d=document.createElement('div');d.className='dr';d.innerHTML='<div class="bk" style="--bg:'+BG[(i*5)%6]+'">'+IC[i]+'</div><div class="dp"><div class="fr'+(i>=14?' lk':'')+'">'+(i+1)+'</div><div class="ba"></div></div>';d.onclick=()=>{if(i<14){off=true;tog(i)}};gd.appendChild(d);doors.push(d)}
function tog(i,v){const d=doors[i];const o=v===undefined?!d.classList.contains('op'):v;d.classList.toggle('op',o);d.classList.toggle('pop',o);n=doors.filter(x=>x.classList.contains('op')).length;document.getElementById('oc').textContent=n}
[0,1,2,3,4,6,9].forEach(i=>{doors[i].querySelector('.dp').style.transition='none';tog(i,true)});requestAnimationFrame(()=>requestAnimationFrame(()=>doors.forEach(d=>d.querySelector('.dp').style.transition='')));
const sn=document.getElementById('sn');for(let i=0;i<22;i++){const f=document.createElement('i');f.style.cssText='left:'+Math.random()*100+'%;--x:'+(Math.random()*60-30)+'px;animation-duration:'+(7+Math.random()*7)+'s;animation-delay:-'+Math.random()*10+'s;width:'+(3+Math.random()*4)+'px;height:'+(3+Math.random()*4)+'px';sn.appendChild(f)}
/* Idle demo: twenty-four foil-gold doors with real 3D hinges wait on a green board while soft snow falls; every door up to today (the 14th) opens one after another, swinging wide on its left edge to reveal a coloured alcove and a little emoji that pops in, a counter tallies the opened doors, then all close again and the cycle repeats; the locked later doors stay red, until you click a door. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){(async()=>{await sl(3400);const order=[5,7,8,10,11,12,13];while(!off){for(const i of order){if(off)return;tog(i,true);await sl(700)}await sl(2600);if(off)return;for(let i=13;i>=0;i--){if(![0,1,2,3,4,6,9].includes(i))tog(i,false)}await sl(1600)}})()}
</script></body></html>
