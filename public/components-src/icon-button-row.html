<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Toolbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D10;--panel:#161A20;--panel2:#1D222A;--edge:#2A313B;--text:#E8ECF2;--muted:#7C8696;--amber:#FFB020;--green:#3DDC84;--red:#FF4D4D}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 0,#151A22,var(--bg) 62%);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:48px 24px}
.rack{width:100%;max-width:820px}
.cap{display:flex;justify-content:space-between;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 6px 12px}
.bar{display:flex;align-items:stretch;gap:0;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:18px;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -24px rgba(0,0,0,.9),0 0 0 1px #000;flex-wrap:wrap}
.grp{display:flex;gap:8px;padding:0 12px;position:relative}
.grp+.grp::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:2px;background:linear-gradient(#000,#2a313b);border-radius:2px}
.k{position:relative;width:54px;height:54px;border-radius:12px;border:1px solid #000;background:linear-gradient(180deg,#2B323D,#1E242C);color:#C9D1DD;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #090B0E,0 6px 10px rgba(0,0,0,.45);transition:transform .07s,box-shadow .07s,color .15s}
.k:hover{color:#fff}
.k:active,.k[aria-pressed=true]{transform:translateY(3px);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 0 0 #090B0E;background:linear-gradient(180deg,#1A1F26,#222830)}
.k:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.k::after{content:"";position:absolute;left:50%;bottom:6px;width:16px;height:3px;border-radius:3px;transform:translateX(-50%);background:#0b0d10;box-shadow:inset 0 1px 1px #000}
.k[aria-pressed=true]::after{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.k.rec[aria-pressed=true]{color:var(--red)}
.k.rec[aria-pressed=true]::after{background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1s steps(2) infinite}
.k.play[aria-pressed=true]{color:var(--green)}
.k.play[aria-pressed=true]::after{background:var(--green);box-shadow:0 0 10px var(--green)}
@keyframes blink{50%{opacity:.25}}
.k::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,6px);white-space:nowrap;background:#000;border:1px solid var(--edge);color:var(--text);font:500 11.5px 'IBM Plex Sans';padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:3}
.k:hover::before,.k:focus-visible::before{opacity:1;transform:translate(-50%,0)}
.k svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.read{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:14px 6px 0;font:500 12px 'IBM Plex Mono',monospace;color:var(--muted);flex-wrap:wrap}
.tc{font:600 30px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--amber);text-shadow:0 0 18px rgba(255,176,32,.35)}
.st{display:flex;gap:16px;align-items:center}
.led{display:inline-flex;align-items:center;gap:7px}
.led i{width:8px;height:8px;border-radius:50%;background:#2a313b}
.led.on i{background:var(--c);box-shadow:0 0 10px var(--c)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="rack">
  <div class="cap"><span>Studio / Transport</span><span>Rev. B · 48 kHz</span></div>
  <div class="bar" role="toolbar" aria-label="Studio toolbar">
    <div class="grp">
      <button class="k rec" id="rec" aria-pressed="false" data-tip="Record · R" aria-label="Record"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6.5"/></svg></button>
      <button class="k play" id="play" aria-pressed="false" data-tip="Play / Pause · Space" aria-label="Play"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg></button>
      <button class="k" id="stop" data-tip="Stop · ⇧Space" aria-label="Stop"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    </div>
    <div class="grp">
      <button class="k tg" data-tool aria-pressed="true" data-tip="Select · V" aria-label="Select"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3.5 19 11l-6.2 1.9L10 19Z"/></svg></button>
      <button class="k tg" data-tool aria-pressed="false" data-tip="Razor · C" aria-label="Razor"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="18" r="2.6"/><circle cx="6" cy="6" r="2.6"/><path d="M8 7.6 20 17M8 16.4 20 7"/></svg></button>
      <button class="k tg" id="snap" aria-pressed="true" data-tip="Snap to grid · S" aria-label="Snap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v9a6 6 0 0 0 12 0V3M6 8h4M14 8h4"/></svg></button>
    </div>
    <div class="grp">
      <button class="k" data-tip="Zoom out · −" aria-label="Zoom out"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6"/></svg></button>
      <button class="k" data-tip="Zoom in · +" aria-label="Zoom in"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6M11 8v6"/></svg></button>
      <button class="k tg" aria-pressed="false" data-tip="Loop · L" aria-label="Loop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg></button>
    </div>
  </div>
  <div class="read">
    <div class="tc" id="tc" aria-live="off">00:12:48:03</div>
    <div class="st">
      <span class="led" id="l1" style="--c:var(--red)"><i></i>REC</span>
      <span class="led" id="l2" style="--c:var(--green)"><i></i>PLAY</span>
      <span class="led on" id="l3" style="--c:var(--amber)"><i></i>SNAP</span>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let f=12*60*30+48*30+3,run=null;
const fmt=n=>{const fr=n%30,s=Math.floor(n/30)%60,m=Math.floor(n/1800)%60,h=Math.floor(n/108000);return[h,m,s,fr].map(x=>String(x).padStart(2,'0')).join(':')};
const set=(b,v)=>b.setAttribute('aria-pressed',v);
const tick=()=>{f++;$('tc').textContent=fmt(f)};
function sync(){$('l1').classList.toggle('on',$('rec').getAttribute('aria-pressed')==='true');$('l2').classList.toggle('on',$('play').getAttribute('aria-pressed')==='true');$('l3').classList.toggle('on',$('snap').getAttribute('aria-pressed')==='true')}
$('play').onclick=()=>{const on=$('play').getAttribute('aria-pressed')!=='true';set($('play'),on);clearInterval(run);if(on)run=setInterval(tick,33);sync()};
$('rec').onclick=()=>{set($('rec'),$('rec').getAttribute('aria-pressed')!=='true');sync()};
$('stop').onclick=()=>{set($('play'),false);set($('rec'),false);clearInterval(run);f=0;$('tc').textContent=fmt(0);sync()};
// tools behave like a radio group; other toggles flip independently
document.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{
  if(b.hasAttribute('data-tool')){document.querySelectorAll('[data-tool]').forEach(x=>set(x,false));set(b,true)}
  else set(b,b.getAttribute('aria-pressed')!=='true');
  sync()}));
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.key==='r'||e.key==='R')$('rec').click()});
sync();
</script>
</body>
</html>
