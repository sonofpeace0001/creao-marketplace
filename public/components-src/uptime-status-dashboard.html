<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Uptime Status Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0D12;color:#E6EBF5;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:900px;background:#10141C;border:1px solid #1D2430;border-radius:24px;padding:22px;box-shadow:0 40px 80px -40px #000}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.hd .ok{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.04em}.hd .ok i{position:relative;width:12px;height:12px;border-radius:50%;background:#34D399}.hd .ok i::after{content:"";position:absolute;inset:0;border-radius:50%;background:#34D399;animation:pg 1.8s ease-out infinite}@keyframes pg{to{transform:scale(3.4);opacity:0}}.hd span{margin-left:auto;font:500 12.5px 'JetBrains Mono',monospace;color:#6A7488}
.top{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.ch{background:#0C1017;border:1px solid #1B2230;border-radius:18px;padding:16px 18px}.ch .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.ch .t b{font-size:14px;font-weight:600;color:#9AA4BA}.ch .t span{font:500 24px 'Inter Tight';letter-spacing:-.04em}.ch .t span small{font:500 12px 'JetBrains Mono',monospace;color:#6A7488;margin-left:4px}
.ch canvas{width:100%;height:110px;display:block}
.in{background:#0C1017;border:1px solid #1B2230;border-radius:18px;padding:16px 18px}.in b{font-size:14px;font-weight:600;color:#9AA4BA;display:block;margin-bottom:10px}.in .e{display:flex;gap:10px;padding:9px 0;border-top:1px solid #161C28;font-size:13.5px;line-height:1.4}.in .e:first-of-type{border:0}.in .e i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c)}.in .e span{color:#6A7488;font:400 11.5px 'JetBrains Mono',monospace;display:block}
.sv{background:#0C1017;border:1px solid #1B2230;border-radius:18px;overflow:hidden}
.rw{display:grid;grid-template-columns:150px 1fr 74px;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid #161C28}.rw:first-child{border:0}
.rw .nm{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}.rw .nm i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.up{display:flex;gap:2px;height:30px;align-items:stretch}.up i{flex:1;border-radius:2px;background:#34D399;opacity:.9;transition:transform .15s,opacity .15s;position:relative}.up i.d{background:#F59E0B}.up i.x{background:#EF4444}.up i:hover{transform:scaleY(1.2);opacity:1}
.rw .pc{text-align:right;font:500 13px 'JetBrains Mono',monospace;color:#9AA4BA}
.lg{display:flex;justify-content:space-between;font:400 11.5px 'JetBrains Mono',monospace;color:#5A6478;padding:0 18px 12px}
.tt{position:fixed;z-index:30;background:#1A2230;border:1px solid #2A3548;border-radius:10px;padding:7px 11px;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}.tt b{display:block;font-size:13px}.tt.on{opacity:1}
@media(max-width:720px){.top{grid-template-columns:1fr}.rw{grid-template-columns:1fr 60px}.rw .up{grid-column:1/3;order:3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div class="ok"><i></i>All systems operational</div><span>UPDATED <b id="ts">just now</b></span></div>
<div class="top"><div class="ch"><div class="t"><b>Requests per second</b><span id="rps">0<small>req/s</small></span></div><canvas id="cv"></canvas></div><div class="in"><b>Recent incidents</b><div class="e"><i style="--c:#F59E0B"></i><div>Elevated API latency in EU<span>Resolved · Nov 3 · 14 min</span></div></div><div class="e"><i style="--c:#EF4444"></i><div>Webhook delivery delayed<span>Resolved · Oct 26 · 38 min</span></div></div><div class="e"><i style="--c:#34D399"></i><div>Scheduled maintenance<span>Completed · Oct 12</span></div></div></div></div>
<div class="sv" id="sv"></div><div class="tt" id="tt"></div></div>
<script>
const SV=[['API','#34D399',99.98],['Dashboard','#34D399',99.99],['Webhooks','#F59E0B',99.71],['Database','#34D399',100],['Edge network','#34D399',99.97]];
function seed(n){let s=n*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const sv=document.getElementById('sv'),tt=document.getElementById('tt');
SV.forEach((s,k)=>{const r=seed(k+3),w=document.createElement('div');w.className='rw';let h='<div class="nm" style="--c:'+s[1]+'"><i></i>'+s[0]+'</div><div class="up">';for(let i=0;i<60;i++){const q=r();const cls=(k===2&&(i===41||i===44))?'x':(q>.97?'d':'');const day=60-i;h+='<i class="'+cls+'" data-d="'+day+'" data-s="'+(cls==='x'?'Outage':cls==='d'?'Degraded':'Operational')+'"></i>'}w.innerHTML=h+'</div><div class="pc">'+s[2]+'%</div>';sv.appendChild(w)});
sv.insertAdjacentHTML('beforeend','<div class="lg"><span>60 days ago</span><span>Today</span></div>');
sv.addEventListener('mousemove',e=>{const i=e.target.closest('.up i');if(!i){tt.classList.remove('on');return}tt.innerHTML='<b>'+i.dataset.s+'</b>'+i.dataset.d+' days ago';tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY-48)+'px';tt.classList.add('on')});sv.addEventListener('mouseleave',()=>tt.classList.remove('on'));
const cv=document.getElementById('cv'),x=cv.getContext('2d');let W=400,H=110,dpr=Math.min(2,devicePixelRatio||1);function size(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',()=>{size();draw()});
const N=90,D=[];let t=0;function nx(){t+=.35;return 5200+Math.sin(t*.5)*900+Math.sin(t*1.7)*380+(Math.random()-.5)*340}
for(let i=0;i<N;i++)D.push(nx());
function draw(){x.clearRect(0,0,W,H);const mx=7600,mn=3400;x.strokeStyle='rgba(120,140,180,.12)';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,H*i/4);x.lineTo(W,H*i/4);x.stroke()}
 const P=D.map((v,i)=>[i/(N-1)*W,H-(v-mn)/(mx-mn)*(H-14)-6]);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(52,211,153,.35)');g.addColorStop(1,'rgba(52,211,153,0)');x.beginPath();x.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++){const m=[(P[i-1][0]+P[i][0])/2,(P[i-1][1]+P[i][1])/2];x.quadraticCurveTo(P[i-1][0],P[i-1][1],m[0],m[1])}x.lineTo(P[N-1][0],P[N-1][1]);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fillStyle=g;x.fill();
 x.beginPath();x.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++){const m=[(P[i-1][0]+P[i][0])/2,(P[i-1][1]+P[i][1])/2];x.quadraticCurveTo(P[i-1][0],P[i-1][1],m[0],m[1])}x.lineTo(P[N-1][0],P[N-1][1]);x.strokeStyle='#34D399';x.lineWidth=2;x.lineJoin='round';x.stroke();const l=P[N-1];x.fillStyle='#34D399';x.beginPath();x.arc(l[0]-2,l[1],4,0,6.283);x.fill();x.strokeStyle='rgba(52,211,153,.35)';x.beginPath();x.arc(l[0]-2,l[1],8,0,6.283);x.stroke();
 document.getElementById('rps').innerHTML=Math.round(D[N-1]).toLocaleString()+'<small>req/s</small>'}
draw();if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{D.shift();D.push(nx());draw()},700);
let s=0;setInterval(()=>{s+=1;document.getElementById('ts').textContent=s<5?'just now':s+'s ago'},1000);
</script></body></html>
