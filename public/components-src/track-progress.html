<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Usage Meters</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090A0D;color:#E8EAF1;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:500px;background:#101216;border:1px solid #1D2028;border-radius:26px;padding:26px;box-shadow:0 40px 80px -34px #000}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.hd h1{font-size:19px;font-weight:700;letter-spacing:-.03em}.hd p{font-size:13.5px;color:#7A8196;margin-top:3px}
.hd button{border:1px solid #2A2E3A;background:#161921;color:#CBD0E2;font:600 13px 'Inter';padding:9px 14px;border-radius:11px;cursor:pointer}.hd button:hover{border-color:#6C7BFF;color:#fff}.hd button:focus-visible{outline:2px solid #6C7BFF;outline-offset:2px}
.m{margin-bottom:22px}.m:last-child{margin-bottom:0}
.t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}.t b{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:9px}.t b i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.t span{font:500 12.5px 'Geist Mono',monospace;color:#7A8196}.t span em{font-style:normal;color:#E8EAF1}
.tr{position:relative;height:12px;border-radius:12px;background:#1A1D26;overflow:hidden}
.tr i{position:absolute;inset:0 auto 0 0;width:0;border-radius:12px;background:linear-gradient(90deg,var(--c),var(--d));transition:width 1.1s cubic-bezier(.3,1,.4,1);overflow:hidden}
.tr i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sh 2.4s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.tk{display:flex;justify-content:space-between;margin-top:7px;font:500 10.5px 'Geist Mono',monospace;color:#4D5365}
.wn{margin-top:7px;font-size:12.5px;color:#FBBF24;display:none;font-weight:500}.m.hi .wn{display:block}
@media(prefers-reduced-motion:reduce){.tr i::after{animation:none}*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Plan usage</h1><p>Pro plan · resets in 12 days</p></div><button id="r">Refresh</button></div><div id="l"></div></div>
<script>
const M=[['Storage',74,'GB','100 GB','#38BDF8','#6366F1','74.2 GB'],['API requests',91,'req','1M / mo','#FBBF24','#F97316','912k'],['Team seats',60,'','10 seats','#34D399','#10B981','6 of 10']];
const l=document.getElementById('l');
l.innerHTML=M.map((m,i)=>'<div class="m'+(m[1]>85?' hi':'')+'" style="--c:'+m[4]+';--d:'+m[5]+'"><div class="t"><b><i></i>'+m[0]+'</b><span><em>'+m[6]+'</em> / '+m[3]+'</span></div><div class="tr" role="progressbar" aria-label="'+m[0]+' usage" aria-valuenow="'+m[1]+'" aria-valuemin="0" aria-valuemax="100"><i data-w="'+m[1]+'"></i></div><div class="tk"><span>0</span><span>50%</span><span>100%</span></div><div class="wn">Approaching your limit — consider upgrading.</div></div>').join('');
function run(){l.querySelectorAll('.tr i').forEach(i=>{i.style.transition='none';i.style.width='0';void i.offsetWidth;i.style.transition='';requestAnimationFrame(()=>i.style.width=i.dataset.w+'%')})}
document.getElementById('r').onclick=run;setTimeout(run,80);
</script></body></html>
