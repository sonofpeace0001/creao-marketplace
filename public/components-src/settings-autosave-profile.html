<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Autosave Profile Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EFEBF7;color:#1D1535;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:600px;background:#fff;border-radius:26px;padding:26px 28px 24px;box-shadow:0 40px 70px -44px rgba(60,30,120,.5),0 0 0 1px rgba(29,21,53,.06)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.hd h1{font:800 24px 'Bricolage Grotesque';letter-spacing:-.04em}.hd p{font-size:13.5px;color:#7E73A6;margin-top:3px}
.as{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#8D83B1;padding:6px 12px;border-radius:99px;background:#F4F1FB;transition:all .3s;white-space:nowrap}.as .ic{position:relative;width:16px;height:16px}.as .ic svg{position:absolute;inset:0;transition:all .3s}.as .ic .sp{opacity:0;animation:rot .8s linear infinite}.as .ic .ck{opacity:0;transform:scale(.3)}@keyframes rot{to{transform:rotate(360deg)}}
.as.sv{background:#EEF0FF;color:#4F46E5}.as.sv .sp{opacity:1}.as.dn{background:#E3F8EC;color:#15803D}.as.dn .ck{opacity:1;transform:none}.as.dn .sp{opacity:0}.as .ic .id{opacity:1}.as.sv .id,.as.dn .id{opacity:0}
.av{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding:14px;border:1.5px dashed #D9D2EE;border-radius:18px;transition:all .2s}.av:hover{border-color:#8B5CF6;background:#FAF8FF}
.av .im{position:relative;width:64px;height:64px;flex:none}.av .im i{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF4444);display:grid;place-items:center;color:#fff;font:800 20px 'Bricolage Grotesque';font-style:normal}.av .im svg{position:absolute;inset:-5px;width:74px;height:74px;transform:rotate(-90deg)}.av .im circle{fill:none;stroke:#8B5CF6;stroke-width:3;stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:56}
.av b{display:block;font-size:14.5px}.av span{font-size:13px;color:#7E73A6}.av button{margin-left:auto;border:1px solid #D9D2EE;background:#fff;border-radius:10px;padding:8px 14px;font:600 13px 'Inter';cursor:pointer;color:#4C3F7D}.av button:focus-visible{outline:2px solid #8B5CF6}
.gd{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f{position:relative}.f.w{grid-column:1/3}.f label{display:block;font-size:12.5px;font-weight:600;color:#6D6290;margin-bottom:6px}.f input,.f textarea{width:100%;border:1.5px solid #E5E0F2;border-radius:12px;padding:11px 14px;font:500 15px 'Inter';color:#1D1535;outline:0;background:#fff;transition:all .2s;resize:none}.f input:focus,.f textarea:focus{border-color:#8B5CF6;box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.f .dt{position:absolute;right:12px;top:36px;width:8px;height:8px;border-radius:50%;background:#F59E0B;opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.3,1.8,.5,1)}.f.dy .dt{opacity:1;transform:none}.f.dy input,.f.dy textarea{border-color:#F6C77C}.f.ok .dt{background:#22C55E;opacity:1;transform:none}.f.ok input,.f.ok textarea{border-color:#A3E4BD}
.f .cn{position:absolute;right:12px;bottom:9px;font-size:11.5px;color:#A79DC9}
.dz{margin-top:18px;border:1px solid #F3D5D5;background:#FFF7F7;border-radius:16px;overflow:hidden}.dz button.t{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:13px 16px;font:600 14px 'Inter';color:#B42323;cursor:pointer;text-align:left}.dz button.t svg{margin-left:auto;transition:transform .3s}.dz.op button.t svg{transform:rotate(180deg)}.dz button.t:focus-visible{outline:2px solid #B42323;outline-offset:-2px}
.dz .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,1,.4,1)}.dz.op .bd{grid-template-rows:1fr}.dz .bd>div{overflow:hidden}.dz .bd p{padding:0 16px 8px;font-size:13.5px;color:#8D5A5A;line-height:1.5}.dz .bd button{margin:4px 16px 16px;border:1.5px solid #DC2626;background:#fff;color:#DC2626;border-radius:10px;padding:9px 14px;font:600 13px 'Inter';cursor:pointer}.dz .bd button:hover{background:#DC2626;color:#fff}.dz .bd button:focus-visible{outline:2px solid #DC2626;outline-offset:2px}
@media(max-width:520px){.gd{grid-template-columns:1fr}.f.w{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>Your profile</h1><p>Changes save automatically as you type.</p></div><div class="as dn" id="as" role="status"><span class="ic"><svg class="id" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><svg class="sp" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.200-8.600"/></svg><svg class="ck" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg></span><span id="at">Saved just now</span></div></div>
<div class="av"><div class="im"><svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="36"/></svg><i>MR</i></div><div><b>Profile photo</b><span>JPG or PNG up to 4 MB</span></div><button>Change</button></div>
<div class="gd"><div class="f"><label for="n">Full name</label><input id="n" value="Maya Rowe"><i class="dt"></i></div><div class="f"><label for="u">Username</label><input id="u" value="mayarowe"><i class="dt"></i></div><div class="f w"><label for="e">Email</label><input id="e" value="maya@northwind.co"><i class="dt"></i></div><div class="f w"><label for="b">Bio</label><textarea id="b" rows="3" maxlength="140">Product designer building calm, fast interfaces for small teams.</textarea><i class="dt" style="top:36px"></i><span class="cn" id="cn"></span></div></div>
<div class="dz" id="dz"><button class="t" id="dt" aria-expanded="false">Danger zone<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="bd"><div><p>Deleting your account removes all pages and cannot be undone.</p><button>Delete account</button></div></div></div></div>
<script>
const as=document.getElementById('as'),at=document.getElementById('at');let tm,t2;
function save(f){f.classList.remove('ok');f.classList.add('dy');as.className='as sv';at.textContent='Saving...';clearTimeout(tm);tm=setTimeout(()=>{as.className='as dn';at.textContent='All changes saved';document.querySelectorAll('.f.dy').forEach(x=>{x.classList.remove('dy');x.classList.add('ok');setTimeout(()=>x.classList.remove('ok'),1400)})},900)}
document.querySelectorAll('.f input,.f textarea').forEach(i=>i.addEventListener('input',()=>{save(i.closest('.f'));if(i.id==='b')cn()}));
function cn(){document.getElementById('cn').textContent=document.getElementById('b').value.length+'/140'}cn();
document.getElementById('dt').onclick=()=>{const o=document.getElementById('dz').classList.toggle('op');document.getElementById('dt').setAttribute('aria-expanded',o)};
</script></body></html>
