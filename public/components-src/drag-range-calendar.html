<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Drag Range Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F2EDE4;color:#241D12;font-family:'Work Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:820px;background:#FBF8F1;border-radius:26px;padding:28px;box-shadow:0 40px 70px -44px rgba(36,29,18,.55),0 0 0 1px rgba(36,29,18,.07)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:22px}.hd h1{font:700 clamp(24px,4vw,32px)/1 'Fraunces',serif;letter-spacing:-.03em}.hd p{color:#8A7E66;font-size:14px;margin-top:6px}
.sm{text-align:right}.sm b{display:block;font:700 30px 'Fraunces',serif;letter-spacing:-.04em;color:#C2410C}.sm span{font-size:13px;color:#8A7E66}
.mo{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh b{font:600 17px 'Fraunces',serif}.mh button{width:30px;height:30px;border:0;background:none;border-radius:9px;cursor:pointer;color:#6B5F46;display:grid;place-items:center}.mh button:hover{background:#EFE8D8}.mh button:focus-visible{outline:2px solid #C2410C}.mh button[hidden]{visibility:hidden}
.gr{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;text-align:center;user-select:none;touch-action:none}.gr .w{font-size:11px;font-weight:600;letter-spacing:.08em;color:#A89B7E;padding:6px 0}
.d{position:relative;aspect-ratio:1;border:0;background:none;font:500 14px 'Work Sans';color:#241D12;cursor:pointer;z-index:1}
.d span{position:relative;z-index:2;display:grid;place-items:center;width:100%;height:100%;border-radius:50%;transition:background .15s,color .15s,transform .2s cubic-bezier(.3,1.5,.5,1)}
.d:hover:not(.s):not(:disabled) span{background:#EFE8D8;transform:scale(1.08)}
.d.r::before{content:"";position:absolute;left:0;right:0;top:12%;bottom:12%;background:#FBE0CC;z-index:0}
.d.rs::before{left:50%;border-radius:99px 0 0 99px}.d.re::before{right:50%;border-radius:0 99px 99px 0}.d.rs.re::before{display:none}
.d.s span{background:#C2410C;color:#fff;transform:scale(1.04);box-shadow:0 6px 14px -4px #C2410C}.d.r:not(.s){color:#7A2D07}
.d:disabled{color:#C9BFA8;cursor:default}.d:focus-visible{outline:2px solid #241D12;outline-offset:-2px;border-radius:50%}
.d.hv::before{content:"";position:absolute;left:0;right:0;top:12%;bottom:12%;background:#F6E7D8;z-index:0}
.ft{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid #ECE5D4}
.pr{display:flex;gap:8px;flex-wrap:wrap}.pr button{border:1.5px solid #E1D8C2;background:#fff;color:#4A3F28;border-radius:99px;padding:8px 14px;font:600 13px 'Work Sans';cursor:pointer;transition:all .15s}.pr button:hover{border-color:#C2410C;color:#C2410C}.pr button:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
.bk{border:0;background:#241D12;color:#FBF8F1;border-radius:14px;padding:12px 24px;font:700 14.5px 'Work Sans';cursor:pointer;transition:transform .15s}.bk:hover:not(:disabled){transform:translateY(-2px)}.bk:disabled{background:#CFC6B0;cursor:default}.bk:focus-visible{outline:3px solid #C2410C;outline-offset:3px}
@media(max-width:700px){.mo{grid-template-columns:1fr}.mo>div:nth-child(2){display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="hd"><div><h1>When are you travelling?</h1><p>Click or drag across days to choose your stay.</p></div><div class="sm"><b id="nt">0 nights</b><span id="dr">Select dates</span></div></div>
<div class="mo" id="mo"></div>
<div class="ft"><div class="pr"><button data-n="3">Weekend</button><button data-n="7">One week</button><button data-n="14">Two weeks</button><button data-c="1">Clear</button></div><button class="bk" id="bk" disabled>Check availability</button></div></div>
<script>
const T=new Date(2026,10,9);let vy=2026,vm=10,a=new Date(2026,10,14),b=new Date(2026,10,19),dg=false,hv=null;
const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
const k=d=>d.getFullYear()*10000+d.getMonth()*100+d.getDate();
function month(y,m,first,last){const f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let h='<div><div class="mh"><button '+(first?'':'hidden')+' data-s="-1" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><b>'+M[m]+' '+y+'</b><button '+(last?'':'hidden')+' data-s="1" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div><div class="gr">'+['M','T','W','T','F','S','S'].map(x=>'<span class="w">'+x+'</span>').join('');
 for(let i=0;i<f;i++)h+='<span></span>';const lo=a&&b?(a<b?a:b):a,hi=a&&b?(a<b?b:a):a;
 for(let d=1;d<=n;d++){const dt=new Date(y,m,d),past=dt<T;let c='d';if(lo&&hi&&k(dt)>=k(lo)&&k(dt)<=k(hi)){c+=' r';if(k(dt)===k(lo))c+=' rs s';if(k(dt)===k(hi))c+=' re s'}else if(a&&!b&&hv&&k(dt)>k(a)&&k(dt)<=k(hv))c+=' hv';
  h+='<button class="'+c+'" '+(past?'disabled':'')+' data-d="'+y+'-'+m+'-'+d+'"><span>'+d+'</span></button>'}return h+'</div></div>'}
const mo=document.getElementById('mo');
function draw(){const m2=vm===11?0:vm+1,y2=vm===11?vy+1:vy;mo.innerHTML=month(vy,vm,1,0)+month(y2,m2,0,1);
 const lo=a&&b?(a<b?a:b):a,hi=a&&b?(a<b?b:a):a,n=lo&&hi?Math.round((hi-lo)/864e5):0;document.getElementById('nt').textContent=n+(n===1?' night':' nights');document.getElementById('dr').textContent=lo&&hi&&n?lo.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' to '+hi.toLocaleDateString('en-US',{month:'short',day:'numeric'}):(lo?'Choose a check-out':'Select dates');document.getElementById('bk').disabled=!(n>0)}
function P(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m,d)}
mo.addEventListener('pointerdown',e=>{const bt=e.target.closest('.d');if(bt&&!bt.disabled){dg=true;a=P(bt.dataset.d);b=null;hv=null;draw()}const s=e.target.closest('[data-s]');if(s){vm+=+s.dataset.s;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}draw()}});
mo.addEventListener('pointerover',e=>{const bt=e.target.closest('.d');if(!bt||bt.disabled)return;const d=P(bt.dataset.d);if(dg){b=d;draw()}else if(a&&!b){hv=d;draw()}});
addEventListener('pointerup',e=>{if(!dg)return;dg=false;const bt=document.elementFromPoint(e.clientX,e.clientY)?.closest('.d');if(bt&&!bt.disabled)b=P(bt.dataset.d);if(b&&k(b)===k(a)){b=null}draw()});
mo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const bt=e.target.closest('.d');if(!bt)return;e.preventDefault();const d=P(bt.dataset.d);if(!a||b){a=d;b=null}else{b=d;if(b<a)[a,b]=[b,a]}draw()}});
document.querySelector('.pr').addEventListener('click',e=>{const bt=e.target.closest('button');if(!bt)return;if(bt.dataset.c){a=b=null}else{a=new Date(2026,10,14);b=new Date(a);b.setDate(a.getDate()+ +bt.dataset.n)}draw()});
document.getElementById('bk').onclick=e=>{e.target.textContent='Searching…';setTimeout(()=>e.target.textContent='12 stays available',900)};
draw();
</script></body></html>
