<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plan Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#4F46E5;--ink:#161432;--m:#6B6A86;--l:#E8E7F4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F6F5FC;color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:40px 20px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:820px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
h1{font-size:26px;letter-spacing:-.04em;font-weight:800}
.sw{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--m);cursor:pointer;user-select:none}
.sw input{display:none}.sw i{width:40px;height:23px;border-radius:99px;background:#CFCDE6;position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.4,1);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--b)}.sw input:checked+i::after{transform:translateX(17px)}
.sw input:focus-visible+i{outline:2px solid var(--b);outline-offset:2px}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 50px -34px rgba(22,20,50,.4),0 0 0 1px var(--l)}
th,td{padding:15px 18px;text-align:center;font-size:14.5px;border-bottom:1px solid var(--l)}
th:first-child,td:first-child{text-align:left;font-weight:600}
thead th{padding:22px 18px 18px;font-size:15px;font-weight:800;background:#FBFBFE}
thead th small{display:block;font-weight:600;color:var(--m);font-size:12.5px;margin-top:2px}
.rec{background:linear-gradient(180deg,#EEEDFF,#F7F6FF)!important;position:relative}
thead .rec{color:var(--b)}
thead .rec::before{content:"Recommended";position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:0 0 9px 9px}
tr:last-child td{border-bottom:0}
.y{color:var(--b)}.n{color:#C4C2DA}
tr.same.hide{display:none}
.g td:first-child{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);background:#FAFAFD;font-weight:700;padding:11px 18px}
.g td{background:#FAFAFD}
</style></head><body>
<div class="w">
<div class="top"><h1>Compare plans</h1><label class="sw"><input type="checkbox" id="d"><i></i>Show differences only</label></div>
<table id="t"><thead><tr><th></th><th>Free<small>$0</small></th><th class="rec">Team<small>$19 / seat</small></th><th>Enterprise<small>Custom</small></th></tr></thead><tbody>
<tr class="g"><td colspan="4">Collaboration</td></tr>
<tr class="same"><td>Unlimited projects</td><td class="y">✓</td><td class="y rec">✓</td><td class="y">✓</td></tr>
<tr><td>Guest reviewers</td><td class="n">—</td><td class="y rec">✓</td><td class="y">✓</td></tr>
<tr><td>Version history</td><td>7 days</td><td class="rec">1 year</td><td>Unlimited</td></tr>
<tr class="g"><td colspan="4">Security</td></tr>
<tr class="same"><td>Two-factor authentication</td><td class="y">✓</td><td class="y rec">✓</td><td class="y">✓</td></tr>
<tr><td>SAML single sign-on</td><td class="n">—</td><td class="n rec">—</td><td class="y">✓</td></tr>
<tr><td>Audit log export</td><td class="n">—</td><td class="y rec">✓</td><td class="y">✓</td></tr>
<tr class="g"><td colspan="4">Support</td></tr>
<tr><td>Response time</td><td>Community</td><td class="rec">Within 4 hours</td><td>Within 30 min</td></tr>
</tbody></table></div>
<script>
const t=document.getElementById('t');
document.getElementById('d').addEventListener('change',e=>t.querySelectorAll('tr.same').forEach(r=>r.classList.toggle('hide',e.target.checked)));
</script></body></html>
