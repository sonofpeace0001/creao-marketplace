<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Flip Reveal Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EAE6DC;color:#1B1812;font-family:'Hanken Grotesk',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:880px}
.hd{text-align:center;margin-bottom:26px}.hd h1{font:800 clamp(28px,5vw,42px)/1 'Bricolage Grotesque';letter-spacing:-.05em}.hd p{color:#7C7462;font-size:16px;margin-top:8px}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;perspective:1200px}
.cd{position:relative;height:330px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.2,.4,1);outline:0;text-align:left;color:inherit;font:inherit}
.cd.fl,.cd:hover,.cd:focus-visible{transform:rotateY(180deg)}.cd:focus-visible .fr{box-shadow:0 0 0 3px #1B1812}
.fc{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:24px;display:flex;flex-direction:column}
.fr{background:var(--bg);color:#fff;justify-content:space-between;box-shadow:0 26px 40px -24px rgba(40,30,10,.55)}
.fr .ar{position:absolute;right:-30px;top:-30px;width:210px;height:210px;opacity:.9}.fr .nm{font:700 13px 'Hanken Grotesk';letter-spacing:.14em;text-transform:uppercase;opacity:.85}.fr h2{font:800 30px/1.02 'Bricolage Grotesque';letter-spacing:-.04em}.fr .hn{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;opacity:.9}.fr .hn svg{animation:nd 1.6s ease-in-out infinite}@keyframes nd{50%{transform:translateX(5px)}}
.bk{background:#fff;transform:rotateY(180deg);box-shadow:0 26px 40px -24px rgba(40,30,10,.55);border:1.5px solid var(--bg)}
.bk h3{font:800 22px 'Bricolage Grotesque';letter-spacing:-.04em;color:var(--bg);margin-bottom:8px}.bk p{font-size:14.5px;line-height:1.55;color:#5A5342;margin-bottom:14px}
.bk ul{list-style:none;display:grid;gap:9px;margin-bottom:auto}.bk li{display:flex;gap:9px;font-size:14px;font-weight:500;align-items:center}.bk li svg{flex:none;color:var(--bg)}
.bk .ln{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font:700 14px 'Hanken Grotesk';color:var(--bg);text-decoration:none}
@media(max-width:700px){.gd{grid-template-columns:1fr}.cd{height:280px}}
@media(prefers-reduced-motion:reduce){.cd{transition:none}.fr .hn svg{animation:none}}
</style></head><body>
<div class="c"><div class="hd"><h1>Flip to learn more</h1><p>Hover, tap or focus a card to turn it around.</p></div><div class="gd" id="gd"></div></div>
<script>
const CK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.500 4.500 4.500L19 7"/></svg>';
const C=[['Design','Craft','linear-gradient(150deg,#FF5B2E,#FFB703)','#D9480F','Interfaces that feel inevitable.',['Design systems and tokens','Prototypes in days','Usability testing'],'<circle cx="105" cy="105" r="40" fill="none" stroke="#fff" stroke-width="5" stroke-opacity=".6"/><circle cx="105" cy="105" r="75" fill="none" stroke="#fff" stroke-width="5" stroke-opacity=".4"/><circle cx="105" cy="105" r="14" fill="#fff"/>'],['Build','Engineer','linear-gradient(150deg,#4F46E5,#A855F7)','#4F46E5','Fast, typed and ready to scale.',['Next.js and edge delivery','Accessible by default','Tests and CI included'],'<rect x="40" y="50" width="130" height="30" rx="8" fill="#fff" fill-opacity=".55"/><rect x="60" y="95" width="110" height="30" rx="8" fill="#fff" fill-opacity=".4"/><rect x="40" y="140" width="90" height="30" rx="8" fill="#fff" fill-opacity=".3"/>'],['Grow','Scale','linear-gradient(150deg,#0F766E,#22D3EE)','#0F766E','Turn visitors into customers.',['Lifecycle email','Experiments and analytics','Referral loops'],'<path d="M20 180 L70 130 L110 150 L180 60" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7"/><circle cx="180" cy="60" r="12" fill="#fff"/>']];
const gd=document.getElementById('gd');C.forEach((c,i)=>{const b=document.createElement('button');b.className='cd'+(i===1?' fl':'');b.style.setProperty('--bg',i===0?'#D9480F':i===1?'#4F46E5':'#0F766E');b.setAttribute('aria-label',c[0]+' card, flip for details');b.innerHTML='<div class="fc fr" style="background:'+c[2]+'"><svg class="ar" viewBox="0 0 210 210">'+c[6]+'</svg><span class="nm">0'+(i+1)+' / '+c[1]+'</span><div><h2>'+c[0]+'</h2></div><span class="hn">Hover to flip<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div><div class="fc bk"><h3>'+c[0]+'</h3><p>'+c[4]+'</p><ul>'+c[5].map(x=>'<li>'+CK+x+'</li>').join('')+'</ul><a class="ln" href="#">See the details<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>';b.onclick=()=>b.classList.toggle('fl');gd.appendChild(b)});
gd.addEventListener('mouseover',()=>gd.querySelectorAll('.fl').forEach(x=>{if(!x.matches(':hover'))x.classList.remove('fl')}));
</script></body></html>
