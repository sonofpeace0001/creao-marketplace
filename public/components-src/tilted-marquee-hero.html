<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tilted Marquee Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0C14;color:#F1F2FA;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}
.hr{position:relative;width:100%;max-width:1060px;min-height:560px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 40px;gap:20px}
.tx{position:relative;z-index:3}
.tx small{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#A5B4FC;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3);border-radius:99px;padding:6px 14px;margin-bottom:22px}.tx small i{width:7px;height:7px;border-radius:50%;background:#818CF8;box-shadow:0 0 10px #818CF8}
.tx h1{font-size:clamp(38px,5.4vw,66px);line-height:1;font-weight:800;letter-spacing:-.055em}.tx h1 span{background:linear-gradient(90deg,#818CF8,#F472B6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tx p{font-size:17px;line-height:1.6;color:#9298B8;max-width:40ch;margin:20px 0 28px}
.bt{display:flex;gap:12px;flex-wrap:wrap}.bt a{padding:14px 26px;border-radius:14px;font:700 15px 'Plus Jakarta Sans';text-decoration:none}.bt .p{background:#fff;color:#0B0C14}.bt .g{border:1px solid #2A2E4A;color:#D4D7EE}.bt a:focus-visible{outline:3px solid #818CF8;outline-offset:3px}
.st{display:flex;gap:30px;margin-top:34px}.st b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em}.st span{font-size:13px;color:#7A80A0}
.mq{position:relative;height:560px;perspective:1100px;overflow:hidden;-webkit-mask:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);mask:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent)}
.pl{position:absolute;inset:-10% 0;display:flex;gap:16px;justify-content:center;transform:rotateX(20deg) rotateZ(-14deg) scale(1.08);transform-origin:center}
.cl{display:flex;flex-direction:column;gap:16px;width:170px;animation:up 38s linear infinite}.cl:nth-child(2){animation-direction:reverse;animation-duration:44s}.cl:nth-child(3){animation-duration:34s}
@keyframes up{to{transform:translateY(-50%)}}
.cd{border-radius:20px;padding:16px;background:linear-gradient(160deg,#171A2E,#10121F);border:1px solid #23274A;height:var(--h)}
.cd .ic{width:36px;height:36px;border-radius:11px;background:var(--g);margin-bottom:12px}.cd b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px}.cd i{display:block;height:6px;border-radius:4px;background:#23274A;margin-bottom:6px}.cd i:last-child{width:60%}
.cd.im{padding:0;overflow:hidden;background:var(--g)}
@media(max-width:820px){.hr{grid-template-columns:1fr;padding:30px 20px}.mq{height:300px}}
@media(prefers-reduced-motion:reduce){.cl{animation:none}}
</style></head><body>
<div class="hr"><div class="tx"><small><i></i>Trusted by 9,000 product teams</small><h1>Build the product people <span>talk about</span></h1><p>One platform to design, ship and measure everything your team makes, without the tool sprawl.</p><div class="bt"><a class="p" href="#">Start free trial</a><a class="g" href="#">Watch demo</a></div><div class="st"><div><b>4.9</b><span>Average rating</span></div><div><b>38k</b><span>Active teams</span></div><div><b>99.9%</b><span>Uptime</span></div></div></div>
<div class="mq" aria-hidden="true"><div class="pl" id="pl"></div></div></div>
<script>
const G=['linear-gradient(135deg,#6366F1,#8B5CF6)','linear-gradient(135deg,#EC4899,#F97316)','linear-gradient(135deg,#10B981,#06B6D4)','linear-gradient(135deg,#F59E0B,#EF4444)','linear-gradient(135deg,#0EA5E9,#6366F1)','linear-gradient(135deg,#A855F7,#EC4899)'];
const T=['Roadmaps','Analytics','Reviews','Automations','Docs','Insights','Sprints','Billing','Alerts','Search'];
function card(i,k){const h=[150,190,130,170,210,140][(i+k)%6];if((i+k)%4===2)return '<div class="cd im" style="--h:'+h+'px;--g:'+G[(i+k)%6]+'"></div>';return '<div class="cd" style="--h:'+h+'px"><div class="ic" style="--g:'+G[(i+k)%6]+'"></div><b>'+T[(i*3+k)%T.length]+'</b><i></i><i></i></div>'}
const pl=document.getElementById('pl');for(let c=0;c<4;c++){let h='';for(let r=0;r<2;r++)for(let k=0;k<6;k++)h+=card(c,k);const d=document.createElement('div');d.className='cl';d.innerHTML=h;d.style.marginTop=(c%2?-80:0)+'px';pl.appendChild(d)}
</script></body></html>
