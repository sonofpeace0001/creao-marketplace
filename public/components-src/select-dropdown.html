<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Account Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(600px 400px at 10% 0,#1B1830,transparent 60%),#0A0A10;color:#ECEBF7;font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:26px 16px;-webkit-font-smoothing:antialiased}
.w{position:relative;width:340px;min-height:470px}
.tr{display:flex;align-items:center;gap:12px;width:100%;background:#14131F;border:1px solid #26243A;border-radius:18px;padding:10px 14px 10px 10px;color:inherit;cursor:pointer;font:inherit;text-align:left;transition:border-color .2s}
.tr:hover,.tr[aria-expanded=true]{border-color:#4B4780}.tr:focus-visible{outline:2px solid #A59BFF;outline-offset:3px}
.av{position:relative;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#FFB86B,#F43F8E);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.av::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#34D399;border:3px solid #14131F}
.tr b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}.tr span.s{font-size:12.5px;color:#8A87A8}
.tr svg{margin-left:auto;color:#8A87A8;transition:transform .25s}.tr[aria-expanded=true] svg{transform:rotate(180deg)}
.mn{position:absolute;left:0;right:0;top:72px;background:#14131F;border:1px solid #2A2840;border-radius:22px;padding:8px;box-shadow:0 40px 60px -20px #000;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top;pointer-events:none;transition:all .22s;z-index:3}
.mn.on{opacity:1;transform:none;pointer-events:auto}
.hd{padding:12px 12px 10px;display:flex;justify-content:space-between;align-items:center}.hd small{font-size:12.5px;color:#8A87A8}.hd b{font-size:14px;display:block;margin-top:1px}
.pl{font-size:11px;font-weight:700;letter-spacing:.08em;color:#C4BEFF;background:rgba(165,155,255,.14);padding:4px 9px;border-radius:99px}
.it{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#D8D6EC;font:500 14.5px 'DM Sans';padding:10px 12px;border-radius:13px;cursor:pointer;text-align:left}
.it:hover,.it:focus-visible{background:#1E1C30;color:#fff;outline:0}.it svg{color:#8A87A8;flex:none}.it:hover svg{color:#A59BFF}
.it kbd{margin-left:auto;font:500 11.5px 'DM Sans';color:#6E6B8E;background:#1C1A2C;border:1px solid #2A2840;border-radius:6px;padding:2px 7px}
.sp{height:1px;background:#242238;margin:6px 8px}
.th{display:flex;align-items:center;gap:12px;padding:10px 12px;font-size:14.5px;font-weight:500;color:#D8D6EC}.th svg{color:#8A87A8}
.sw{margin-left:auto;width:42px;height:24px;border-radius:99px;background:#2B2942;border:0;position:relative;cursor:pointer;transition:background .25s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.4,1)}.sw[aria-checked=true]{background:#7C6BFF}.sw[aria-checked=true]::after{transform:translateX(18px)}.sw:focus-visible{outline:2px solid #A59BFF;outline-offset:2px}
.out{color:#FF8A9A}.out:hover svg{color:#FF8A9A}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><button class="tr" id="t" aria-haspopup="menu" aria-expanded="true"><span class="av">MA</span><span><b>Maya Alvarez</b><span class="s">maya@northwind.co</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
 <div class="mn on" id="m" role="menu"><div class="hd"><div><small>Workspace</small><b>Northwind Studio</b></div><span class="pl">PRO</span></div>
  <button class="it" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile<kbd>⌘P</kbd></button>
  <button class="it" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>Billing &amp; plan</button>
  <button class="it" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.200 4.200l2.100 2.100M17.700 17.700l2.100 2.100M2 12h3M19 12h3M4.200 19.800l2.100-2.100M17.700 6.300l2.100-2.100"/></svg>Settings<kbd>⌘,</kbd></button>
  <div class="th"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z"/></svg>Dark mode<button class="sw" role="switch" aria-checked="true" aria-label="Dark mode"></button></div>
  <div class="sp"></div>
  <button class="it out" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.100" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button></div></div>
<script>
const t=document.getElementById('t'),m=document.getElementById('m');function set(o){m.classList.toggle('on',o);t.setAttribute('aria-expanded',o)}
t.onclick=e=>{e.stopPropagation();set(!m.classList.contains('on'))};document.addEventListener('click',e=>{if(!m.contains(e.target))set(false)});
const sw=m.querySelector('.sw');sw.onclick=e=>{e.stopPropagation();sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')!=='true')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){set(false);t.focus()}const its=[...m.querySelectorAll('.it')];if(!m.classList.contains('on')||!its.length)return;const i=its.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();its[(i+1)%its.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();its[(i-1+its.length)%its.length].focus()}});
</script></body></html>
