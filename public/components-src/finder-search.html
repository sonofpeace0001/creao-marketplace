<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Docs Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#EEF1F6;color:#171D2E;font-family:'Figtree',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{position:relative;width:min(580px,100%);min-height:430px}
.sb{display:flex;align-items:center;gap:13px;background:#fff;border:1.5px solid #DDE2EE;border-radius:20px;padding:6px 8px 6px 18px;box-shadow:0 20px 34px -24px rgba(23,29,46,.5);transition:all .2s}
.sb:focus-within{border-color:#4F46E5;box-shadow:0 0 0 5px rgba(79,70,229,.13),0 20px 34px -24px rgba(23,29,46,.5)}
.sb svg{color:#8791AC;flex:none}.sb input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 17px 'Figtree';color:#171D2E;padding:14px 0}.sb input::placeholder{color:#9AA3BC}
.sb kbd{display:flex;gap:3px;font:700 12.5px 'Figtree';color:#7A84A0;background:#F3F5FA;border:1px solid #DDE2EE;border-bottom-width:2px;border-radius:9px;padding:6px 10px}
.dd{position:absolute;left:0;right:0;top:78px;background:#fff;border:1px solid #E2E6F1;border-radius:22px;padding:8px;box-shadow:0 36px 56px -24px rgba(23,29,46,.5);opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .18s}.dd.on{opacity:1;transform:none;pointer-events:auto}
.gp{padding:12px 12px 6px;font-size:11.5px;font-weight:800;letter-spacing:.12em;color:#98A1BA;text-transform:uppercase}
.it{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:14px;cursor:pointer}
.it.on{background:#EFEEFF}.it i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--b);color:var(--c)}
.it b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}.it span{font-size:13px;color:#7A84A0}.it mark{background:#FFE58A;color:inherit;border-radius:3px}
.it em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:#98A1BA;opacity:0}.it.on em{opacity:1}
.ft{display:flex;gap:16px;padding:10px 14px 6px;margin-top:6px;border-top:1px solid #EEF0F6;font-size:12.5px;color:#8791AC}.ft kbd{font:700 11px 'Figtree';background:#F3F5FA;border:1px solid #DDE2EE;border-radius:5px;padding:1px 6px}
.em{padding:34px 14px;text-align:center;color:#8791AC;font-size:14.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div class="sb"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" value="api" placeholder="Search the docs…" aria-label="Search docs" role="combobox" aria-expanded="true" aria-controls="dd" autocomplete="off"><kbd>⌘ K</kbd></div>
 <div class="dd on" id="dd" role="listbox"></div></div>
<script>
const D=[['Guides','Authentication','Get and use API keys','M12 3 4 6v6c0 5 3.400 8 8 9 4.600-1 8-4 8-9V6Z','#E4E1FF','#4F46E5'],['Guides','Webhooks','Receive events in real time','M13 2 4 14h7l-1 8 9-12h-7Z','#FFF0D2','#C2750A'],['Guides','Rate limits','Understand API quotas','M12 6v6l4 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z','#DDF5EA','#16794E'],['Reference','POST /v1/orders','Create an order','M5 12h14M13 6l6 6-6 6','#FDE3E8','#C0264A'],['Reference','GET /v1/customers','List all customers','M5 12h14M13 6l6 6-6 6','#DFEBFF','#2B64C9'],['Reference','API versioning','How we ship breaking changes','M4 7h16M4 12h16M4 17h10','#EDE4FF','#6D3FE0']];
const q=document.getElementById('q'),dd=document.getElementById('dd');let cur=0,rows=[];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(t,s){const i=s?t.toLowerCase().indexOf(s.toLowerCase()):-1;return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+s.length))+'</mark>'+esc(t.slice(i+s.length))}
function draw(){const s=q.value.trim();rows=D.filter(d=>!s||(d[1]+' '+d[2]).toLowerCase().includes(s.toLowerCase()));cur=Math.min(cur,Math.max(0,rows.length-1));
 if(!rows.length){dd.innerHTML='<div class="em">No results for “'+esc(s)+'”</div>';return}
 let h='',g='';rows.forEach((r,i)=>{if(r[0]!==g){g=r[0];h+='<div class="gp">'+g+'</div>'}h+='<div class="it'+(i===cur?' on':'')+'" role="option" aria-selected="'+(i===cur)+'" data-i="'+i+'"><i style="--b:'+r[4]+';--c:'+r[5]+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="'+r[3]+'"/></svg></i><div><b>'+hl(r[1],s)+'</b><span>'+esc(r[2])+'</span></div><em>↵ Open</em></div>'});
 dd.innerHTML=h+'<div class="ft"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>'}
q.addEventListener('input',()=>{cur=0;dd.classList.add('on');draw()});q.addEventListener('focus',()=>dd.classList.add('on'));
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cur=(cur+1)%Math.max(1,rows.length);draw()}if(e.key==='ArrowUp'){e.preventDefault();cur=(cur-1+rows.length)%Math.max(1,rows.length);draw()}if(e.key==='Escape')dd.classList.remove('on')});
dd.addEventListener('mousemove',e=>{const it=e.target.closest('.it');if(it&&+it.dataset.i!==cur){cur=+it.dataset.i;draw()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select()}});
document.addEventListener('click',e=>{if(!e.target.closest('.w'))dd.classList.remove('on')});draw();
</script></body></html>
