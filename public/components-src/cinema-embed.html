<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cinema Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#F2F2F6;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:34px 20px;-webkit-font-smoothing:antialiased}
.pl{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 50px 100px -30px #000,0 0 0 1px #1d1d24;cursor:pointer;user-select:none}
.sc{position:absolute;inset:-6%;background:radial-gradient(60% 70% at 70% 30%,#FF8A3D 0,transparent 60%),radial-gradient(70% 80% at 20% 80%,#3B2BB8 0,transparent 65%),linear-gradient(160deg,#0E1030,#1B0B2E);animation:z 20s ease-in-out infinite alternate;filter:saturate(1.2)}
@keyframes z{to{transform:scale(1.12) translate(-2%,2%)}}
.sc::after{content:"";position:absolute;left:0;right:0;bottom:26%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);filter:blur(1px)}
.vg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 55%,rgba(0,0,0,.8))}
.ti{position:absolute;left:24px;top:20px;right:24px;display:flex;justify-content:space-between;align-items:flex-start;transition:opacity .3s}
.ti b{font-size:17px;font-weight:600;letter-spacing:-.02em;display:block}.ti span{font-size:13px;color:#C9C9D6}
.tag{font:500 11px 'Geist Mono',monospace;letter-spacing:.1em;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:5px 10px;border-radius:99px}
.big{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:transform .25s,opacity .25s}
.pl:hover .big{transform:scale(1.08)}.playing .big{opacity:0;transform:scale(1.5);pointer-events:none}
.dur{position:absolute;right:20px;bottom:64px;font:500 12px 'Geist Mono',monospace;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:7px}.playing .dur{display:none}
.ct{position:absolute;left:0;right:0;bottom:0;padding:0 20px 16px;transition:opacity .3s,transform .3s}
.playing:not(:hover) .ct,.playing:not(:hover) .ti{opacity:0;transform:translateY(6px)}
.pg{height:5px;border-radius:5px;background:rgba(255,255,255,.22);cursor:pointer;position:relative;margin-bottom:12px}
.pg i{position:absolute;inset:0 auto 0 0;width:0;background:#fff;border-radius:5px}
.pg i::after{content:"";position:absolute;right:-6px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;gap:14px;font:500 12.5px 'Geist Mono',monospace;color:#E6E6EE}
.row button{background:none;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;border-radius:8px}.row button:hover{background:rgba(255,255,255,.15)}
.row button:focus-visible,.pl:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sp{flex:1}
@media(prefers-reduced-motion:reduce){.sc{animation:none}}
</style></head><body>
<div class="pl" id="p" tabindex="0" role="button" aria-label="Play video: The Making of Nocturne">
 <div class="sc"></div><div class="vg"></div>
 <div class="ti"><div><b>The Making of Nocturne</b><span>A film by Studio Halvorsen · 2025</span></div><span class="tag">4K · HDR</span></div>
 <div class="big"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px"><path d="M8 5.500v13a1 1 0 0 0 1.500.860l10.500-6.500a1 1 0 0 0 0-1.720L9.500 4.640A1 1 0 0 0 8 5.500Z"/></svg></div>
 <span class="dur">4:12</span>
 <div class="ct"><div class="pg" id="g"><i id="b"></i></div><div class="row"><button id="pp" aria-label="Play or pause"><svg id="ic" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.500v13a1 1 0 0 0 1.500.860l10.500-6.500a1 1 0 0 0 0-1.720L9.500 4.640A1 1 0 0 0 8 5.500Z"/></svg></button><span id="t">0:00 / 4:12</span><span class="sp"></span><button aria-label="Volume"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9ZM17 8.500a5 5 0 0 1 0 7"/></svg></button><button aria-label="Fullscreen"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div></div></div>
<script>
const p=document.getElementById('p'),b=document.getElementById('b'),t=document.getElementById('t'),ic=document.getElementById('ic');let cur=0,T=252,run=null;
const f=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const PL='<path d="M8 5.500v13a1 1 0 0 0 1.500.860l10.500-6.500a1 1 0 0 0 0-1.720L9.500 4.640A1 1 0 0 0 8 5.500Z"/>',PA='<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
function ui(){b.style.width=(cur/T*100)+'%';t.textContent=f(cur)+' / '+f(T)}
function toggle(){if(run){clearInterval(run);run=null;p.classList.remove('playing');ic.innerHTML=PL}else{p.classList.add('playing');ic.innerHTML=PA;run=setInterval(()=>{cur=Math.min(T,cur+.25);ui();if(cur>=T){toggle();cur=0}},250)}}
p.addEventListener('click',e=>{if(e.target.closest('.pg')){const r=document.getElementById('g').getBoundingClientRect();cur=Math.max(0,Math.min(T,(e.clientX-r.left)/r.width*T));ui();return}if(e.target.closest('.row')&&!e.target.closest('#pp'))return;toggle()});
p.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target===p){e.preventDefault();toggle()}});ui();
</script></body></html>
