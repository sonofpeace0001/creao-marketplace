<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spotlight Border CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090D;color:#F2F4FA;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{--x:50%;--y:50%;position:relative;width:100%;max-width:760px;border-radius:30px;padding:1.5px;background:radial-gradient(360px circle at var(--x) var(--y),#A5B4FC,rgba(236,72,153,.7) 38%,rgba(255,255,255,.06) 72%)}
.in{position:relative;border-radius:29px;padding:58px 44px 50px;background:#0D0E14;overflow:hidden;text-align:center}
.in::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--x) var(--y),rgba(129,140,248,.18),transparent 60%);pointer-events:none}
.in::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;-webkit-mask:radial-gradient(300px circle at var(--x) var(--y),#000,transparent);mask:radial-gradient(300px circle at var(--x) var(--y),#000,transparent);pointer-events:none}
.in>*{position:relative;z-index:2}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#C7CBF5;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3);border-radius:99px;padding:6px 14px;margin-bottom:22px}.pill i{width:7px;height:7px;border-radius:50%;background:#818CF8;box-shadow:0 0 10px #818CF8}
h1{font-size:clamp(34px,6vw,56px);line-height:1.04;font-weight:700;letter-spacing:-.05em}h1 span{background:linear-gradient(90deg,#A5B4FC,#F9A8D4);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:17px;line-height:1.6;color:#8E94AA;max-width:46ch;margin:16px auto 30px}
.bt{display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:center}.bt a{padding:14px 26px;border-radius:14px;font:600 15px 'Geist';text-decoration:none;transition:transform .15s}.bt a:hover{transform:translateY(-1px)}.bt .p{background:#F2F4FA;color:#0D0E14}.bt .g{border:1px solid #2A2D3C;color:#D8DBEA;background:rgba(255,255,255,.03)}.bt a:focus-visible{outline:3px solid #818CF8;outline-offset:3px}
.pr{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:30px;font-size:13.5px;color:#7C8299}.av{display:flex}.av i{width:28px;height:28px;border-radius:50%;border:2px solid #0D0E14;margin-left:-8px;background:var(--g)}.av i:first-child{margin-left:0}
@media(max-width:560px){.in{padding:44px 22px 38px}}
</style></head><body>
<div class="c" id="c"><div class="in"><span class="pill"><i></i>Join 12,400 teams</span><h1>Ready to ship <span>faster</span> than ever?</h1><p>Start building in minutes with components that look expensive and behave like they cost more.</p><div class="bt"><a class="p" href="#">Start for free</a><a class="g" href="#">Book a demo</a></div><div class="pr"><div class="av"><i style="--g:linear-gradient(135deg,#6366F1,#EC4899)"></i><i style="--g:linear-gradient(135deg,#10B981,#0EA5E9)"></i><i style="--g:linear-gradient(135deg,#F59E0B,#EF4444)"></i><i style="--g:linear-gradient(135deg,#8B5CF6,#06B6D4)"></i></div>Loved by designers and engineers</div></div></div>
<script>
const c=document.getElementById('c');let real=false,t=.5;function set(px,py){c.style.setProperty('--x',px+'px');c.style.setProperty('--y',py+'px')}
c.addEventListener('pointermove',e=>{real=true;const r=c.getBoundingClientRect();set(e.clientX-r.left,e.clientY-r.top)});c.addEventListener('pointerleave',()=>real=false);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(){if(!real){t+=.012;const r=c.getBoundingClientRect();set(r.width*(.5+Math.cos(t)*.42),r.height*(.5+Math.sin(t*1.2)*.46))}if(!reduce)requestAnimationFrame(loop)}
const r0=c.getBoundingClientRect();set(r0.width*.66,r0.height*.04);if(!reduce)loop();
</script></body></html>
