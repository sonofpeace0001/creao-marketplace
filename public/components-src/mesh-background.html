<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Soft Focus Mesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:40px 24px;color:#2A2230;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative;background:#FBF4EE}
.m{position:absolute;inset:-10%;background:
 radial-gradient(38% 42% at 18% 22%,#FFC9B5 0,transparent 70%),
 radial-gradient(34% 40% at 82% 18%,#D9CCFF 0,transparent 70%),
 radial-gradient(40% 44% at 70% 86%,#BFEBD9 0,transparent 70%),
 radial-gradient(30% 34% at 12% 82%,#FFE6A8 0,transparent 70%);filter:blur(30px);animation:sh 22s ease-in-out infinite alternate}
@keyframes sh{to{transform:scale(1.08) translate(2%,-2%) rotate(2deg)}}
.g{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .4 0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.s{position:absolute;border:1.5px solid rgba(42,34,48,.18);border-radius:50%}
.s1{width:160px;height:160px;left:9%;top:58%;animation:fl 9s ease-in-out infinite}
.s2{width:90px;height:90px;right:12%;top:14%;border-radius:28px;transform:rotate(18deg);animation:fl 11s -3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(8deg)}}
.c{position:relative;text-align:center;max-width:720px}
.k{display:inline-block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.8);font-weight:500}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(52px,9vw,116px);line-height:.95;letter-spacing:-.04em;margin:26px 0 20px;font-variation-settings:'opsz' 144}
h1 em{font-style:italic;color:#8A5BD8}
p{font-size:18px;line-height:1.55;color:#5B4F63;max-width:460px;margin:0 auto}
.b{display:inline-flex;align-items:center;gap:10px;margin-top:32px;background:#2A2230;color:#fff;font:500 15px 'DM Sans';padding:15px 26px;border-radius:99px;text-decoration:none;box-shadow:0 18px 34px -16px rgba(42,34,48,.7);transition:transform .2s}
.b:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="m"></div><div class="g"></div><div class="s s1"></div><div class="s s2"></div>
<div class="c"><span class="k">Mesh · soft focus</span><h1>Calm, but <em>alive.</em></h1><p>Four pastel light pools drift behind your content. Warm, human, and gentle enough to put text on.</p><a class="b" href="#">Copy the CSS <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></a></div>
</body></html>
