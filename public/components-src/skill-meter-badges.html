<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Skill Meter Badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3EFE7;color:#1C1914;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.w{width:100%;max-width:640px;display:grid;gap:22px}
.hd{display:flex;justify-content:space-between;align-items:end}.hd h1{font:400 40px/1 'Instrument Serif';letter-spacing:-.02em}.hd h1 i{color:#D4380D}.hd span{font:500 12px 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;color:#988F7B}
.g{display:grid;gap:10px}
.s{--c:#2563EB;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:16px;padding:14px 18px 14px 14px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px rgba(28,25,20,.07),0 14px 20px -18px rgba(28,25,20,.5);transition:transform .3s cubic-bezier(.3,1.4,.4,1)}
.s:hover{transform:translateX(5px)}
.ic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,#fff);display:grid;place-items:center;font:700 13px 'JetBrains Mono';color:var(--c);letter-spacing:-.02em}
.mid b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.m{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.m i{height:9px;border-radius:5px;background:#ECE7DB;position:relative;overflow:hidden}
.m i::before{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.3,1.2,.4,1);transition-delay:calc(var(--i)*90ms)}
.m i.f::before{transform:none}.m i.f::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:sh 2.800s ease-in-out infinite;animation-delay:calc(var(--i)*.18s + var(--d))}
@keyframes sh{40%,100%{transform:translateX(100%)}}
.lv{display:grid;justify-items:end;gap:2px;min-width:92px}.lv b{font-size:13.500px;font-weight:700;color:var(--c)}.lv small{font:500 11.500px 'JetBrains Mono';color:#9A917D}
.lv .bd{height:1.3em;overflow:hidden;text-align:right}.lv .bd span{display:block;transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="w"><div class="hd"><h1>Skills, <i>measured</i></h1><span>5-step scale</span></div><div class="g" id="g"></div></div>
<script>
const K=[['React','RX',5,'#2563EB','Expert','9 years'],['Figma','Fg',4,'#9333EA','Advanced','6 years'],['SQL','SQL',3,'#0E9F6E','Proficient','4 years'],['Go','Go',2,'#0891B2','Learning','1 year'],['Rust','Rs',1,'#D4380D','Beginner','3 months']];
const LV=['','Beginner','Learning','Proficient','Advanced','Expert'];
const g=document.getElementById('g');
K.forEach(([n,ab,l,c,lab,yr],i)=>{const e=document.createElement('article');e.className='s';e.style.setProperty('--c',c);e.dataset.l=l;
 e.innerHTML='<div class="ic">'+ab+'</div><div class="mid"><b>'+n+'</b><div class="m" role="img" aria-label="'+n+': '+lab+', '+l+' of 5">'+[0,1,2,3,4].map(k=>'<i style="--i:'+k+';--d:'+(i*.3)+'s"></i>').join('')+'</div></div><div class="lv"><b>'+lab+'</b><small>'+yr+'</small></div>';g.appendChild(e)});
const rows=[...g.children];
function fill(e,l){[...e.querySelectorAll('.m i')].forEach((b,k)=>b.classList.toggle('f',k<l))}
rows.forEach(e=>fill(e,+e.dataset.l));
/* Idle demo: every few seconds all five meters empty and then refill left to right with a 90ms stagger, and a glint then travels along the filled segments forever. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{await sleep(3800);while(true){rows.forEach(e=>fill(e,0));await sleep(700);for(const e of rows){fill(e,+e.dataset.l);await sleep(260)}await sleep(5200)}})()}
</script></body></html>
