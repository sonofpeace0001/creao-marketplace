<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Horizon Grid Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#080414;color:#F2ECFF;font-family:'Manrope',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#080414 0%,#1A0B3D 38%,#4B1170 56%,#C1306E 68%,#FF8A4C 76%);z-index:-4}
.stars{position:absolute;inset:0 0 40%;z-index:-3;background-image:radial-gradient(1.200px 1.200px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 8%,#fff,transparent),radial-gradient(1.500px 1.500px at 52% 26%,#fff,transparent),radial-gradient(1px 1px at 70% 12%,#fff,transparent),radial-gradient(1.200px 1.200px at 86% 30%,#fff,transparent),radial-gradient(1px 1px at 22% 36%,#fff,transparent),radial-gradient(1px 1px at 92% 6%,#fff,transparent),radial-gradient(1.300px 1.300px at 62% 40%,#fff,transparent);animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
.sun{position:absolute;left:50%;bottom:24%;width:min(380px,36vh,70vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,50%);background:linear-gradient(180deg,#FFE27A 0%,#FF8A4C 45%,#FF2E7E 100%);z-index:-2;-webkit-mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 18px);mask:repeating-linear-gradient(180deg,#000 0 14px,transparent 14px 18px);-webkit-mask-size:100% 100%;filter:drop-shadow(0 0 60px rgba(255,100,120,.6));animation:sunpulse 6s ease-in-out infinite alternate}
@keyframes sunpulse{to{filter:drop-shadow(0 0 90px rgba(255,100,120,.85))}}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:-1;background:linear-gradient(180deg,#2A0A4D,#0E0420 70%);overflow:hidden;perspective:260px;perspective-origin:50% 0;box-shadow:0 -1px 0 rgba(255,150,120,.9),0 -8px 30px rgba(255,90,140,.45)}
.grid{position:absolute;left:-60%;width:220%;top:0;height:260%;transform:rotateX(72deg);transform-origin:50% 0;background-image:linear-gradient(rgba(255,70,170,.95) 2px,transparent 2px),linear-gradient(90deg,rgba(255,70,170,.95) 2px,transparent 2px);background-size:90px 90px;animation:move 1.600s linear infinite;filter:drop-shadow(0 0 5px rgba(255,70,170,.9))}
@keyframes move{to{background-position:0 90px}}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,10,77,.55),transparent 35%)}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,4vw,48px)}
.lg{font:700 18px 'Unbounded';letter-spacing:-.04em;display:flex;align-items:center;gap:10px}.lg i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#FF8A4C,#FF2E7E);display:block}
nav ul{display:flex;gap:28px;list-style:none;font-size:14px;font-weight:600;color:#C9BBEC}nav a{color:inherit;text-decoration:none}nav a:hover{color:#fff}
.nb{border:0;border-radius:99px;padding:11px 20px;background:rgba(255,255,255,.1);color:#fff;font:700 13px 'Manrope';cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);backdrop-filter:blur(8px)}
.c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:clamp(14px,3.6vh,44px) 20px 0}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font-size:13px;font-weight:600;color:#E9DDFF;backdrop-filter:blur(8px)}
.pill b{background:linear-gradient(135deg,#FF8A4C,#FF2E7E);color:#fff;border-radius:99px;padding:3px 9px;font-size:11px;letter-spacing:.06em}
h1{font:700 clamp(34px,6vw,78px)/.98 'Unbounded';letter-spacing:-.06em;margin:18px 0 14px;max-width:16ch;text-shadow:0 0 40px rgba(255,46,126,.35)}
h1 span{background:linear-gradient(90deg,#FFE27A,#FF8A4C 45%,#FF2E7E);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;opacity:0;transform:translateY(24px);animation:up .5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.sb{font-size:clamp(15px,1.8vw,19px);line-height:1.5;color:#CDBFF0;max-width:540px}
.ct{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.b1{border:0;border-radius:99px;padding:16px 28px;background:linear-gradient(135deg,#FF8A4C,#FF2E7E);color:#fff;font:700 16px 'Manrope';cursor:pointer;box-shadow:0 14px 34px -8px rgba(255,46,126,.7);transition:transform .2s}.b1:hover{transform:translateY(-2px)}
.b2{border:0;border-radius:99px;padding:16px 28px;background:rgba(255,255,255,.08);color:#fff;font:700 16px 'Manrope';cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.b1:focus-visible,.b2:focus-visible,.nb:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:680px){nav ul{display:none}.grid{background-size:56px 56px}}
@media(prefers-reduced-motion:reduce){.grid,.stars,.sun{animation:none}.w{animation:none;opacity:1;transform:none}}
</style></head><body>
<section class="hero"><div class="sky"></div><div class="stars"></div><div class="sun"></div><div class="floor"><div class="grid"></div></div>
<nav><div class="lg"><i></i>Meridian</div><ul><li><a href="#">Platform</a></li><li><a href="#">Pricing</a></li><li><a href="#">Changelog</a></li><li><a href="#">Docs</a></li></ul><button class="nb">Sign in</button></nav>
<div class="c"><span class="pill"><b>NEW</b>Zero-downtime rollouts are live</span>
<h1 id="h"><span>Ship at the speed of thought</span></h1>
<p class="sb">Meridian turns every merge into a global deploy in under nine seconds, with instant rollback and a preview for every pull request.</p>
<div class="ct"><button class="b1">Start deploying free</button><button class="b2">Watch the 90 second demo</button></div></div></section>
<script>
/* Headline reveals word by word on load; the grid, sun and stars animate on their own forever. */
const h=document.getElementById('h'),sp=h.querySelector('span'),words=sp.textContent.split(' ');sp.innerHTML=words.map((w,i)=>'<span class="w" style="animation-delay:'+(i*70)+'ms">'+w+'</span>').join(' ');
</script></body></html>
