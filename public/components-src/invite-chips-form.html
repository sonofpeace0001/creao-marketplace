<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Invite Chips Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F3F4F8;color:#14151F;font-family:'Geist',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.f{width:100%;max-width:480px;border-radius:24px;background:#fff;padding:26px;box-shadow:0 40px 60px -38px rgba(20,21,31,.4),inset 0 0 0 1px rgba(20,21,31,.07)}
.f h1{font-size:22px;font-weight:700;letter-spacing:-.03em}.f>p{color:#6C6F85;font-size:14px;margin:6px 0 18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:16px;box-shadow:inset 0 0 0 1.500px #DFE1EC;min-height:96px;align-content:flex-start;cursor:text;transition:box-shadow .2s}
.tags:focus-within{box-shadow:inset 0 0 0 2px #4F46E5,0 0 0 5px rgba(79,70,229,.14)}
.ch{--c:#4F46E5;display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border-radius:99px;background:color-mix(in srgb,var(--c) 11%,#fff);font-size:14px;font-weight:500;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.ch.out{animation:out .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes out{to{transform:scale(.4);opacity:0;width:0;padding:0;margin:-4px}}
.ch i{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:700 11px 'Geist';display:grid;place-items:center;font-style:normal}
.ch button{width:20px;height:20px;border:0;border-radius:50%;background:none;color:#6C6F85;cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1}.ch button:hover{background:rgba(20,21,31,.1);color:#14151F}.ch button:focus-visible{outline:2px solid #4F46E5}
.ch.bad{--c:#DC2626;animation:shake .4s}.ch.bad span::after{content:"  invalid";font-size:11px;font-weight:700;color:#DC2626}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tags input{flex:1;min-width:150px;border:0;outline:0;font:500 14px 'Geist';padding:6px 4px;background:none;color:#14151F}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}
.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:#6C6F85;font-weight:500}
.seg{position:relative;display:flex;border-radius:12px;background:#EEEFF6;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 14px;font:600 13px 'Geist';color:#6C6F85;cursor:pointer;border-radius:9px;transition:color .2s}
.seg button[aria-pressed=true]{color:#14151F}.seg button:focus-visible{outline:2px solid #4F46E5}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:#fff;box-shadow:0 2px 6px rgba(20,21,31,.15);transition:transform .3s cubic-bezier(.3,1.3,.4,1),width .3s}
.go{border:0;border-radius:14px;padding:14px 22px;background:#14151F;color:#fff;font:600 15px 'Geist';cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:opacity .2s}.go:disabled{opacity:.35;cursor:not-allowed}.go:focus-visible{outline:3px solid #4F46E5;outline-offset:3px}
.go b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:#4F46E5;font-size:12px;padding:0 6px;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}.go b.bump{transform:scale(1.35)}
.hint{margin-top:14px;font-size:12.500px;color:#8C8FA6}.hint kbd{font:600 11px 'Geist';padding:2px 6px;border-radius:5px;background:#EEEFF6;box-shadow:0 1px 0 #DFE1EC}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<form class="f" id="f" onsubmit="return false" novalidate><h1>Invite your team</h1><p>Paste or type emails. Press Enter, comma or space to add each one.</p>
<div class="tags" id="tg"><input id="in" type="text" autocomplete="off" aria-label="Email addresses" placeholder="name@company.com"></div>
<div class="row"><div class="sel">Role<div class="seg" id="sg" role="group" aria-label="Role"><span class="th" id="th"></span><button type="button" aria-pressed="false">Viewer</button><button type="button" aria-pressed="true">Editor</button><button type="button" aria-pressed="false">Admin</button></div></div><button class="go" id="go" disabled>Send <b id="n">0</b></button></div>
<div class="hint"><kbd>Backspace</kbd> removes the last invite. Invalid addresses are flagged, not lost.</div></form>
<script>
const tg=document.getElementById('tg'),inp=document.getElementById('in'),go=document.getElementById('go'),n=document.getElementById('n'),sg=document.getElementById('sg'),th=document.getElementById('th');
const COL=['#4F46E5','#0891B2','#D97706','#DB2777','#059669','#7C3AED'];let ci=0;
const ok=v=>/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v);
function count(){const c=tg.querySelectorAll('.ch:not(.bad):not(.out)').length;n.textContent=c;n.classList.add('bump');setTimeout(()=>n.classList.remove('bump'),200);go.disabled=!c}
function add(v){v=v.trim();if(!v)return;const good=ok(v),el=document.createElement('span');el.className='ch'+(good?'':' bad');el.style.setProperty('--c',COL[ci++%COL.length]);
 el.innerHTML='<i>'+v[0].toUpperCase()+'</i><span></span><button type="button" aria-label="Remove '+v.replace(/"/g,'')+'">&times;</button>';el.querySelector('span').textContent=v;
 el.querySelector('button').onclick=()=>rm(el);tg.insertBefore(el,inp);count();return el}
function rm(el){el.classList.add('out');setTimeout(()=>{el.remove();count()},240)}
inp.addEventListener('keydown',e=>{if(['Enter',',',' '].includes(e.key)&&inp.value.trim()){e.preventDefault();add(inp.value);inp.value=''}else if(e.key==='Backspace'&&!inp.value){const l=[...tg.querySelectorAll('.ch:not(.out)')].pop();if(l)rm(l)}});
inp.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(/[\s,;]/.test(t.trim())){e.preventDefault();t.split(/[\s,;]+/).forEach(add)}});
inp.addEventListener('blur',()=>{if(inp.value.trim()){add(inp.value);inp.value=''}});tg.addEventListener('click',()=>inp.focus());
function seg(i){[...sg.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-pressed',k===i));const b=sg.querySelectorAll('button')[i];th.style.width=b.offsetWidth+'px';th.style.transform='translateX('+(b.offsetLeft-3)+'px)'}
sg.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>seg(i));
add('amara@northwind.io');add('lucas@northwind.io');seg(1);document.fonts.ready.then(()=>seg([...sg.querySelectorAll('button')].findIndex(b=>b.getAttribute('aria-pressed')==='true')));
/* Idle demo: someone types another invite, a typo gets flagged and removed, then it loops, until real input. */
let off=false;['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>off=true,{once:true}));
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 async function type(s){for(const ch of s){if(off)return false;inp.value+=ch;await sleep(70)}return true}
 (async()=>{await sleep(3600);while(!off){if(!await type('priya@northwind.io'))return;await sleep(250);add(inp.value);inp.value='';await sleep(900);if(!await type('sam@northwind'))return;await sleep(250);const b=add(inp.value);inp.value='';await sleep(1500);if(b)rm(b);await sleep(900);if(off)return;seg(2);await sleep(1200);seg(1);await sleep(900);[...tg.querySelectorAll('.ch')].slice(2).forEach(rm);await sleep(1600)}})()}
</script></body></html>
