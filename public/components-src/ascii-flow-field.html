<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASCII Flow Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070B;color:#EDEEF7;font-family:'JetBrains Mono',monospace;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.cd{position:relative;width:100%;max-width:760px;aspect-ratio:16/10;border-radius:26px;overflow:hidden;background:#0A0A12;box-shadow:0 44px 70px -34px #000,inset 0 0 0 1px rgba(255,255,255,.08);cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;left:28px;bottom:24px;pointer-events:none}.ov small{display:block;font:500 11px 'JetBrains Mono';letter-spacing:.2em;color:#9EA6C8;margin-bottom:6px}.ov h1{font:800 54px/.9 'Syne';letter-spacing:-.04em;color:#fff;mix-blend-mode:difference}
.hn{position:absolute;right:22px;top:18px;font:500 11px 'JetBrains Mono';color:#7C84A8;pointer-events:none;letter-spacing:.08em}
</style></head><body>
<div class="cd" id="cd"><canvas id="cv"></canvas><span class="hn" id="hn">MOVE POINTER TO DISTURB</span><div class="ov"><small>FLOW FIELD / 0.3</small><h1>SIGNAL<br>NOISE</h1></div></div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),cd=document.getElementById('cd');const CH=' .·:-=+*#%@';let cols,rows,cw=11,chh=18,W,H,mx=-999,my=-999,t=0,off=false,gh=true,dpr=Math.min(2,devicePixelRatio||1);
function size(){const r=cd.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cw=Math.max(8,W/68);chh=cw*1.6;cols=Math.ceil(W/cw);rows=Math.ceil(H/chh);cx.font='500 '+(cw*1.35)+'px JetBrains Mono';cx.textBaseline='top'}
size();addEventListener('resize',size);
function n(x,y,t){return Math.sin(x*.11+t*.9)+Math.sin(y*.17-t*.7)+Math.sin((x+y)*.07+t*.5)+Math.sin(Math.hypot(x-cols/2,y-rows/2)*.18-t*1.2)}
function draw(){cx.fillStyle='#0A0A12';cx.fillRect(0,0,W,H);for(let j=0;j<rows;j++){for(let i=0;i<cols;i++){let v=(n(i,j,t)+4)/8;const px=i*cw+cw/2,py=j*chh+chh/2;const d=Math.hypot(px-mx,py-my);let hl=0;if(d<110){hl=1-d/110;v=Math.min(1,v+hl*.7)}const k=Math.min(CH.length-1,Math.floor(v*v*CH.length*1.15));if(!k)continue;const hue=210+v*120-hl*60;cx.fillStyle='hsla('+hue+',90%,'+(35+v*45+hl*20)+'%,'+(.35+v*.65)+')';let ox=0,oy=0;if(hl){ox=(px-mx)/d*hl*6;oy=(py-my)/d*hl*6}cx.fillText(CH[k],i*cw+ox,j*chh+oy)}}}
function loop(ms){t=ms/1000;if(gh&&!off){const a=(t-3)*.5;mx=W*(.5+.3*Math.cos(a));my=H*(.45+.28*Math.sin(a*2)/1.1)}draw();requestAnimationFrame(loop)}
mx=W*.62;my=H*.38;t=2.2;draw();
cd.addEventListener('pointermove',e=>{off=true;document.getElementById('hn').style.opacity=0;const r=cd.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});cd.addEventListener('pointerleave',()=>{mx=my=-999});
/* Idle demo: a field of characters is driven by overlapping sine waves; density maps to a ramp from dot to at-sign and to a hue from blue to magenta, the whole field drifts and breathes, and a ghost cursor traces a figure-eight that pushes nearby glyphs away and lights them brighter, until you move your own pointer over it. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(loop);
</script></body></html>
