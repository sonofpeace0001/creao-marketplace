<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Animated File Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0C0D12;color:#E4E7F2;font-family:'Inter Tight',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{display:grid;grid-template-columns:260px 1fr;width:100%;max-width:760px;height:420px;background:#12141B;border:1px solid #21242F;border-radius:20px;overflow:hidden;box-shadow:0 40px 70px -40px #000}
.sd{border-right:1px solid #21242F;display:flex;flex-direction:column;background:#0F1117}
.sr{display:flex;align-items:center;gap:8px;margin:12px;padding:0 10px;border-radius:10px;background:#171A23;border:1px solid #232734;color:#6C7390}.sr:focus-within{border-color:#6C7CFF}.sr input{flex:1;min-width:0;border:0;outline:0;background:none;color:#E4E7F2;font:500 13.5px 'Inter Tight';padding:9px 0}
.tr{flex:1;overflow:auto;padding:0 8px 10px;position:relative}
.hl{position:absolute;left:8px;right:8px;height:30px;border-radius:8px;background:#222744;border:1px solid #2F3566;transition:transform .3s cubic-bezier(.3,1.2,.4,1),opacity .2s;pointer-events:none;opacity:0}
.rw{position:relative;display:flex;align-items:center;gap:7px;height:30px;padding-right:8px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#B6BBD0;white-space:nowrap;user-select:none;border:0;background:none;width:100%;text-align:left;font-family:inherit}.rw:hover{color:#fff}.rw.sel{color:#fff}.rw:focus-visible{outline:2px solid #6C7CFF;outline-offset:-2px}
.rw .ch{width:14px;flex:none;color:#6C7390;transition:transform .2s}.rw.open .ch{transform:rotate(90deg)}.rw .ic{flex:none}.rw .gs{margin-left:auto;font:500 11px 'Geist Mono',monospace}.gs.m{color:#F5B544}.gs.a{color:#4ADE80}.gs.d{color:#F87171}
.ch2{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}.ch2.open{grid-template-rows:1fr}.ch2>div{overflow:hidden;position:relative;padding-left:14px}.ch2>div::before{content:"";position:absolute;left:7px;top:0;bottom:6px;width:1px;background:#252936}
.ed{display:flex;flex-direction:column;min-width:0}.tb{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;border-bottom:1px solid #21242F;font:500 13px 'Geist Mono',monospace;color:#9AA0BC}.tb b{color:#fff;font-weight:500}
pre{flex:1;margin:0;padding:16px 18px;font:400 13px/1.8 'Geist Mono',monospace;overflow:auto;color:#B6BBD0}.k{color:#C792EA}.f{color:#82AAFF}.s{color:#C3E88D}.c{color:#546E7A}.n{color:#F78C6C}
.em{display:grid;place-items:center;height:100%;color:#5E6580;font-size:14px}
@media(max-width:640px){.c{grid-template-columns:1fr;height:auto}.ed{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="c"><div class="sd"><label class="sr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" placeholder="Filter files" aria-label="Filter files"></label><div class="tr" id="tr"><div class="hl" id="hl"></div><div id="rt" role="tree"></div></div></div>
<div class="ed"><div class="tb" id="tb"></div><pre id="cd"></pre></div></div>
<script>
const T=[{n:'src',t:'d',o:1,c:[{n:'components',t:'d',o:1,c:[{n:'Button.tsx',g:'m',code:'<span class="k">import</span> { cva } <span class="k">from</span> <span class="s">"class-variance-authority"</span>;\n\n<span class="k">export function</span> <span class="f">Button</span>({ variant = <span class="s">"primary"</span> }) {\n  <span class="k">return</span> &lt;<span class="f">button</span> className={styles({ variant })} /&gt;;\n}'},{n:'Card.tsx',g:'a',code:'<span class="c">// New card component</span>\n<span class="k">export const</span> <span class="f">Card</span> = () =&gt; &lt;<span class="f">div</span> className=<span class="s">"card"</span> /&gt;;'},{n:'Modal.tsx',code:'<span class="k">export</span> <span class="k">function</span> <span class="f">Modal</span>() {\n  <span class="k">return</span> <span class="n">null</span>;\n}'}]},{n:'app',t:'d',c:[{n:'layout.tsx',code:'<span class="k">export default function</span> <span class="f">Layout</span>({ children }) {\n  <span class="k">return</span> &lt;<span class="f">html</span>&gt;{children}&lt;/<span class="f">html</span>&gt;;\n}'},{n:'page.tsx',g:'m',code:'<span class="k">export default function</span> <span class="f">Page</span>() {\n  <span class="k">return</span> &lt;<span class="f">main</span>&gt;Hello&lt;/<span class="f">main</span>&gt;;\n}'}]},{n:'index.ts',code:'<span class="k">export</span> * <span class="k">from</span> <span class="s">"./components/Button"</span>;'}]},{n:'public',t:'d',c:[{n:'logo.svg',code:'<span class="c">&lt;!-- vector logo --&gt;</span>'},{n:'robots.txt',g:'d',code:'User-agent: *\nAllow: /'}]},{n:'package.json',code:'{\n  <span class="k">"name"</span>: <span class="s">"northwind-web"</span>,\n  <span class="k">"version"</span>: <span class="n">"2.4.0"</span>\n}'},{n:'README.md',code:'<span class="c"># Northwind web</span>\nA calm dashboard for teams.'}];
const F='<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="#F5B544" stroke="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',FL=c=>'<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></svg>',CH='<svg class="ch" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const col=n=>/tsx|ts$/.test(n)?'#6C9CFF':/json/.test(n)?'#F5B544':/md|txt/.test(n)?'#9AA0BC':'#4ADE80';
let sel=null,q='';const rt=document.getElementById('rt');
function build(a,p){return a.map(x=>{const id=p+'/'+x.n;if(x.t==='d'){const ch=x.c.filter(function f(y){return y.t==='d'?y.c.some(f):y.n.toLowerCase().includes(q)});const show=!q||ch.length;if(!show)return '';return '<div><button class="rw '+((x.o||q)?'open':'')+'" role="treeitem" aria-expanded="'+!!(x.o||q)+'" data-d="'+id+'" style="padding-left:'+0+'px">'+CH+F+x.n+'</button><div class="ch2 '+((x.o||q)?'open':'')+'"><div>'+build(x.c,id)+'</div></div></div>'}
 if(q&&!x.n.toLowerCase().includes(q))return '';return '<button class="rw'+(sel===id?' sel':'')+'" role="treeitem" data-f="'+id+'"><span style="width:14px;flex:none"></span>'+FL(col(x.n))+x.n+(x.g?'<span class="gs '+x.g+'">'+x.g.toUpperCase()+'</span>':'')+'</button>'}).join('')}
function find(a,p,id){for(const x of a){const i=p+'/'+x.n;if(i===id)return x;if(x.c){const r=find(x.c,i,id);if(r)return r}}}
function render(){rt.innerHTML=build(T,'');move()}
function move(){const s=rt.querySelector('.rw.sel'),h=document.getElementById('hl');if(!s){h.style.opacity=0;return}const r=s.getBoundingClientRect(),p=document.getElementById('tr').getBoundingClientRect();h.style.opacity=1;h.style.transform='translateY('+(r.top-p.top+document.getElementById('tr').scrollTop)+'px)'}
rt.addEventListener('click',e=>{const d=e.target.closest('[data-d]');if(d){const n=find(T,'',d.dataset.d);n.o=!n.o;render();return}const f=e.target.closest('[data-f]');if(f){sel=f.dataset.f;const n=find(T,'',sel);document.getElementById('tb').innerHTML='<span>'+sel.slice(1).split('/').join(' / ').replace(/([^/]+)$/,'<b>$1</b>')+'</span>';document.getElementById('cd').innerHTML=n.code;render()}});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();render()});
sel='/src/components/Button.tsx';document.getElementById('tb').innerHTML='<span>src / components / <b>Button.tsx</b></span>';document.getElementById('cd').innerHTML=find(T,'',sel).code;render();(document.fonts&&document.fonts.ready||Promise.resolve()).then(move);
</script></body></html>
