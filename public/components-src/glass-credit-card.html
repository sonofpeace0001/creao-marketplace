<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Glass Credit Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0F0D;color:#E9F3EE;font-family:'Manrope',sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 14px;-webkit-font-smoothing:antialiased;overflow:hidden;background-image:radial-gradient(520px 360px at 28% 30%,rgba(52,211,153,.18),transparent 70%),radial-gradient(520px 360px at 78% 74%,rgba(250,204,21,.12),transparent 70%)}
.w{display:grid;justify-items:center;gap:30px}
.scene{perspective:1100px}
.card{position:relative;width:min(380px,88vw);aspect-ratio:1.586;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.1,.3,1);transform:rotateY(0) rotateX(6deg)}
.card.back{transform:rotateY(180deg) rotateX(6deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 36px 44px -24px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.16)}
.front{background:linear-gradient(135deg,rgba(52,211,153,.55),rgba(14,60,50,.85) 55%,rgba(250,204,21,.35)),#0F2A22}
.front::before{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%,20%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.front::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 30px rgba(255,255,255,.04),0 0 0 62px rgba(255,255,255,.03)}
.row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.logo{font-weight:800;font-size:19px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}.logo i{width:22px;height:22px;border-radius:7px;background:#FACC15;display:block;position:relative}.logo i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#0F2A22}
.chip{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#F3D98B,#C79A33);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.chip::before,.chip::after{content:"";position:absolute;background:rgba(0,0,0,.25)}.chip::before{left:0;right:0;top:50%;height:1px}.chip::after{top:0;bottom:0;left:33%;width:1px;box-shadow:12px 0 0 rgba(0,0,0,.25)}
.num{font:500 20px 'Martian Mono';letter-spacing:.08em;position:relative;z-index:1}
.meta{display:flex;justify-content:space-between;align-items:end;position:relative;z-index:1}.meta small{display:block;font-size:10px;letter-spacing:.14em;color:rgba(233,243,238,.6);text-transform:uppercase;margin-bottom:2px}.meta b{font-size:15px;letter-spacing:.02em}
.net{display:flex}.net i{width:30px;height:30px;border-radius:50%;background:#F97316;display:block}.net i+i{background:rgba(250,204,21,.9);margin-left:-12px;mix-blend-mode:screen}
.rear{transform:rotateY(180deg);background:linear-gradient(135deg,#12332A,#0A1A15);padding:0}
.stripe{height:48px;background:#050806;margin-top:26px}
.sig{margin:22px 24px 0;display:flex;gap:10px;align-items:center}.sig div{flex:1;height:38px;border-radius:6px;background:repeating-linear-gradient(135deg,#E9F3EE 0 6px,#CFE1D8 6px 12px);display:flex;align-items:center;padding-left:10px;font:italic 500 15px 'Manrope';color:#33463E}.sig b{background:#fff;color:#0A0F0D;font:500 15px 'Martian Mono';padding:9px 12px;border-radius:6px}
.fine{margin:18px 24px 0;font-size:11px;line-height:1.5;color:rgba(233,243,238,.55)}
.ctl{display:flex;gap:10px}
.ctl button{border:0;border-radius:99px;padding:11px 20px;background:rgba(255,255,255,.08);color:#E9F3EE;font:700 13px 'Manrope';cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);display:inline-flex;gap:8px;align-items:center;transition:background .2s}
.ctl button:hover{background:rgba(255,255,255,.14)}.ctl button:focus-visible{outline:2px solid #34D399;outline-offset:3px}
.ctl svg{width:16px;height:16px}
@media(prefers-reduced-motion:reduce){.card{transition:none}.front::before{animation:none}}
</style></head><body>
<div class="w"><div class="scene"><div class="card" id="card">
<div class="face front" aria-label="Card front"><div class="row"><div class="logo"><i></i>Meridian</div><div class="chip"></div></div><div class="num">4821  ••••  ••••  0937</div><div class="meta"><div><small>Cardholder</small><b>Amara Okonkwo</b></div><div><small>Expires</small><b>09/29</b></div><div class="net"><i></i><i></i></div></div></div>
<div class="face rear" aria-label="Card back"><div class="stripe"></div><div class="sig"><div>Amara Okonkwo</div><b>284</b></div><p class="fine">Issued by Meridian Bank N.A., Member FDIC. Virtual number rotates every 24 hours. Report loss in app, any hour.</p></div>
</div></div>
<div class="ctl"><button id="flip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.700L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.700L3 16M3 21v-5h5"/></svg>Flip card</button><button id="frz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4.500 7l15 10M19.500 7l-15 10"/></svg>Freeze</button></div></div>
<script>
const card=document.getElementById('card'),flip=document.getElementById('flip'),frz=document.getElementById('frz');let off=false,timer;
flip.onclick=()=>card.classList.toggle('back');frz.onclick=()=>{const f=card.classList.toggle('frozen');card.style.filter=f?'saturate(.15) brightness(.85)':'';frz.lastChild.textContent=f?'Unfreeze':'Freeze'};
addEventListener('pointerdown',()=>{off=true;clearInterval(timer)},{once:true});addEventListener('keydown',()=>{off=true;clearInterval(timer)},{once:true});
/* Idle demo: the card turns over every 3.4s until someone touches the page. */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setTimeout(()=>{if(off)return;card.classList.add('back');timer=setInterval(()=>card.classList.toggle('back'),3400)},3600);
</script></body></html>
