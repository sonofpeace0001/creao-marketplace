<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pay What You Want Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg,#FDEBD5);transition:background .5s;color:#2B1608;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:560px;background:#FFFDF8;border-radius:34px;padding:34px 32px 30px;text-align:center;box-shadow:0 40px 70px -40px rgba(80,40,10,.5),0 0 0 1px rgba(43,22,8,.07)}
.c small{font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#B4491C}.c h1{font:700 clamp(30px,5vw,40px)/1.05 'Fraunces',serif;letter-spacing:-.03em;margin:10px 0 8px}.c>p{font-size:15.5px;line-height:1.55;color:#7A5F46;max-width:40ch;margin:0 auto}
.hr{position:relative;width:110px;height:110px;margin:26px auto 4px}.hr svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 18px rgba(239,68,68,.35))}.hr .h{transform-origin:50% 55%;transform:scale(var(--s,1));transition:transform .25s cubic-bezier(.3,1.8,.5,1);fill:var(--hc,#F87171)}
.hr.bt .h{animation:bt .9s ease-in-out infinite}@keyframes bt{50%{transform:scale(calc(var(--s,1)*1.1))}}
.pr{display:flex;justify-content:center;align-items:baseline;font:800 76px/1 'Fraunces',serif;letter-spacing:-.05em;height:84px;overflow:hidden}.pr span{font-size:38px;margin-right:4px;font-weight:700}
.dg{position:relative;width:.58em;height:84px;overflow:hidden}.dg div{position:absolute;left:0;right:0;transition:transform .4s cubic-bezier(.2,.9,.2,1)}.dg b{display:block;height:84px;line-height:84px;font-weight:800}
.ms{height:26px;font-size:16px;font-weight:600;color:#B4491C;margin:6px 0 14px;transition:opacity .2s}
.sl{padding:0 6px}.sl input{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:12px;background:linear-gradient(90deg,var(--hc,#F87171) var(--p),#F1E2CF var(--p));outline:0;cursor:pointer}.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid var(--hc,#F87171);box-shadow:0 8px 16px -4px rgba(80,40,10,.45)}.sl input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--hc,#F87171)}.sl input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(43,22,8,.35)}
.tk{display:flex;justify-content:space-between;margin:8px 4px 0;font-size:12px;font-weight:600;color:#A98D70}
.pt{display:flex;gap:8px;justify-content:center;margin:20px 0;flex-wrap:wrap}.pt button{border:1.5px solid #EBD9C3;background:#fff;border-radius:99px;padding:8px 16px;font:600 14px 'Inter';color:#6B4F36;cursor:pointer}.pt button:hover{border-color:#B4491C;color:#B4491C}.pt button:focus-visible{outline:2px solid #B4491C}
.go{width:100%;border:0;border-radius:18px;padding:17px;font:700 17px 'Inter';color:#fff;background:#2B1608;cursor:pointer;box-shadow:0 18px 30px -14px #2B1608;transition:transform .15s}.go:hover{transform:translateY(-1px)}.go:focus-visible{outline:3px solid #B4491C;outline-offset:3px}
.fn{font-size:13px;color:#A98D70;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="c"><small>Pay what feels fair</small><h1>Name your price</h1><p>Every plan unlocks the full app. Choose what it is worth to you and help us keep it independent.</p>
<div class="hr" id="hr"><svg viewBox="0 0 100 90"><path class="h" d="M50 84C14 56 4 38 4 24 4 12 14 4 26 4c9 0 18 5 24 14C56 9 65 4 74 4c12 0 22 8 22 20 0 14-10 32-46 60z"/></svg></div>
<div class="pr" id="pr"></div><div class="ms" id="ms"></div>
<div class="sl"><input type="range" id="rg" min="0" max="60" step="1" value="18" aria-label="Your price per month"><div class="tk"><span>$0</span><span>$15</span><span>$30</span><span>$45</span><span>$60</span></div></div>
<div class="pt" id="pt"></div><button class="go" id="go">Continue</button><p class="fn" id="fn"></p></div>
<script>
const M=[[0,'Free for now. Come back anytime.','#94A3B8','#EEF2F6',.7],[5,'Every little bit helps.','#38BDF8','#E0F2FE',.8],[10,'Thank you, that is generous.','#34D399','#DCFCE7',.92],[20,'You are keeping us going.','#FBBF24','#FEF3C7',1.05],[35,'Wow. You are a patron of the arts.','#FB923C','#FFEDD5',1.2],[50,'Legendary. We will send you a gift.','#F43F5E','#FFE4E6',1.35]];
const rg=document.getElementById('rg'),pr=document.getElementById('pr');
function odo(v){const s=String(v);let ds=[...pr.querySelectorAll('.dg')];if(ds.length!==s.length){pr.innerHTML='<span>$</span>'+[...s].map(()=>'<div class="dg"><div>'+[...'0123456789'].map(n=>'<b>'+n+'</b>').join('')+'</div></div>').join('');ds=[...pr.querySelectorAll('.dg')];ds.forEach(d=>d.firstChild.style.transition='none');requestAnimationFrame(()=>requestAnimationFrame(()=>ds.forEach(d=>d.firstChild.style.transition='')))}ds.forEach((d,i)=>d.firstChild.style.transform='translateY(-'+(+s[i]*84)+'px)')}
function upd(){const v=+rg.value;let m=M[0];M.forEach(x=>{if(v>=x[0])m=x});odo(v);document.getElementById('ms').textContent=m[1];document.body.style.setProperty('--bg',m[3]);const h=document.getElementById('hr');h.style.setProperty('--hc',m[2]);h.style.setProperty('--s',m[4]);h.classList.toggle('bt',v>=20);document.querySelector('.c').style.setProperty('--hc',m[2]);document.documentElement.style.setProperty('--hc',m[2]);rg.style.setProperty('--p',(v/60*100)+'%');document.getElementById('fn').textContent=v?'$'+(v*12)+' billed yearly. Cancel anytime.':'No payment needed today.';document.getElementById('go').textContent=v?'Continue with $'+v+'/month':'Continue for free'}
document.getElementById('pt').innerHTML=[5,12,20,35].map(v=>'<button data-v="'+v+'">$'+v+'</button>').join('');document.querySelectorAll('#pt button').forEach(b=>b.onclick=()=>{rg.value=b.dataset.v;upd()});
rg.addEventListener('input',upd);upd();
</script></body></html>
