<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ink Trail Cursor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;0,9..144,700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0B10;color:#F4F1FF;font-family:'Inter',sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 14px;-webkit-font-smoothing:antialiased}
.st{position:relative;width:100%;max-width:820px;aspect-ratio:16/10;border-radius:28px;overflow:hidden;background:#0E0E16;box-shadow:0 0 0 1px #1E1E2C,0 50px 80px -40px #000;cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%}
.tx{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:20px}
.tx h1{font:700 clamp(36px,8vw,84px)/.98 'Fraunces',serif;letter-spacing:-.04em}.tx h1 em{font-style:italic;font-weight:500;background:linear-gradient(90deg,#FF7AB6,#7C9CFF,#4DE3C1);-webkit-background-clip:text;background-clip:text;color:transparent}
.tx p{margin-top:14px;font-size:15px;color:#9A97B8}
.ct{position:absolute;left:18px;bottom:16px;display:flex;gap:8px}.ct button{border:1px solid #2B2B44;background:rgba(14,14,22,.7);backdrop-filter:blur(8px);color:#E6E3FF;border-radius:99px;padding:8px 14px;font:600 12.5px 'Inter';cursor:pointer;display:flex;align-items:center;gap:8px}.ct button i{width:10px;height:10px;border-radius:50%;background:var(--c)}.ct button:hover{border-color:#6A6AA8}.ct button[aria-pressed=true]{background:#F4F1FF;color:#0E0E16;border-color:#F4F1FF}.ct button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cl{position:absolute;right:18px;bottom:16px}.cl button{border:1px solid #2B2B44;background:rgba(14,14,22,.7);color:#E6E3FF;border-radius:99px;padding:8px 14px;font:600 12.5px 'Inter';cursor:pointer}.cl button:hover{border-color:#6A6AA8}.cl button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style></head><body>
<div class="st" id="st"><canvas id="cv" role="img" aria-label="Interactive canvas that paints glowing ink where you move the pointer"></canvas><div class="tx"><h1>Leave a <em>trace.</em></h1><p>Move your cursor. The ink blooms and fades.</p></div>
<div class="ct" id="ct" role="group" aria-label="Ink colour"></div><div class="cl"><button id="cl">Clear</button></div></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d');let W,H,dpr,P=[],mx=-99,my=-99,px=-99,py=-99,hue=0,mode=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MODES=[['Aurora','linear-gradient(135deg,#FF7AB6,#4DE3C1)'],['Ember','linear-gradient(135deg,#FFD25A,#FF4B1F)'],['Ocean','linear-gradient(135deg,#7C9CFF,#22D3EE)']];
const ct=document.getElementById('ct');ct.innerHTML=MODES.map((m,i)=>'<button aria-pressed="'+(i===0)+'"><i style="--c:'+m[1]+';background:'+m[1]+'"></i>'+m[0]+'</button>').join('');[...ct.children].forEach((b,i)=>b.onclick=()=>{mode=i;[...ct.children].forEach((z,k)=>z.setAttribute('aria-pressed',k===i))});
function col(a){const h=mode===0?(hue%120)+300:mode===1?(hue%50)+8:(hue%60)+190;return 'hsla('+(h%360)+',95%,62%,'+a+')'}
function size(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#0E0E16';x.fillRect(0,0,W,H)}
function add(a,b,c,d){const dx=c-a,dy=d-b,dist=Math.hypot(dx,dy),n=Math.max(1,Math.floor(dist/4));for(let i=0;i<n;i++){const t=i/n;P.push({x:a+dx*t,y:b+dy*t,r:10+Math.min(22,dist*.35)+Math.random()*6,l:1,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5-.1,h:hue});hue+=.8}}
function frame(){x.globalCompositeOperation='source-over';x.fillStyle='rgba(14,14,22,.09)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=.009;p.x+=p.vx;p.y+=p.vy;p.r*=.985;if(p.l<=0){P.splice(i,1);continue}const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);const hh=mode===0?(p.h%120)+300:mode===1?(p.h%50)+8:(p.h%60)+190;g.addColorStop(0,'hsla('+(hh%360)+',95%,62%,'+p.l*.55+')');g.addColorStop(1,'hsla('+(hh%360)+',95%,50%,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
 if(!reduced)requestAnimationFrame(frame)}
document.getElementById('st').addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();const cx=e.clientX-r.left,cy=e.clientY-r.top;if(px<0){px=cx;py=cy}add(px,py,cx,cy);px=cx;py=cy;if(reduced)frame()});
document.getElementById('st').addEventListener('pointerleave',()=>{px=-99});document.getElementById('cl').onclick=()=>{P=[];x.globalCompositeOperation='source-over';x.fillStyle='#0E0E16';x.fillRect(0,0,W,H)};
size();addEventListener('resize',size);
// demo swirl until the user interacts
let t=0,demo=null;function swirl(){const cx=W*.5+Math.cos(t)*W*.3,cy=H*.5+Math.sin(t*1.3)*H*.3;if(px<0){px=cx;py=cy}add(px,py,cx,cy);px=cx;py=cy;t+=.05}
if(!reduced)demo=setInterval(swirl,16);else{for(let k=0;k<120;k++)swirl();frame()}
document.getElementById('st').addEventListener('pointerenter',()=>{if(demo){clearInterval(demo);demo=null;px=-99}});
requestAnimationFrame(frame);
</script></body></html>
